version: 2
updates:
  # Bun workspace (apps/*, packages/*, examples/plugins/*) — root lockfile
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  - package-ecosystem: "docker"
    directories:
      - "/apps/api"
      - "/packages/keycloak-spi"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"

  - package-ecosystem: "docker-compose"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"

  # Keycloak SPI (Java)
  - package-ecosystem: "maven"
    directory: "/packages/keycloak-spi"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"

  # Workflow actions in .github/workflows/**. Every action is pinned to a full
  # commit SHA (issue #95); without this ecosystem those pins never move, so a
  # patched action CVE would go unnoticed. Dependabot reads the trailing
  # "# vX.Y.Z" comment and bumps both the SHA and the comment together.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Amsterdam"
