name: API e2e

# Runs the full GraphQL + REST + MCP e2e suite (`apps/api test:e2e`) against a
# real Postgres AND a real Keycloak — the same suite a developer runs locally
# against the compose stack. Until now this suite only ran on a laptop or,
# manually, against the deployed cluster (e2e-cluster.yml); the ci.yml gates
# job runs only the no-database API unit tests. This closes the follow-up
# recorded there (issue #22): the transport-auth, workflow-http and
# control-provisioning flows need a live issuer to mint bearer tokens, so they
# were not exercised on pull requests at all.
#
# Modeled on web-e2e.yml, which established the pattern of standing this stack
# up on a pull request. Differences: no Redis, no web build, no browser — the
# harness serves graphql-yoga in-process, so only Postgres and Keycloak are
# real. Both generated realms are imported: the tenant realm for the bearer
# flows and the CONTROL realm for the provisioning suite.
#
# Trigger matches ci.yml exactly — see the note in web-e2e.yml and issue #269
# for why a gate must run on EVERY pull request, unfiltered.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: api-e2e-${{ github.ref }}
  cancel-in-progress: true

# pull-requests: write exists solely for the sticky results comment the last
# step maintains; nothing here pushes code or images.
permissions:
  contents: read
  pull-requests: write

jobs:
  api-e2e:
    name: API e2e (GraphQL, REST, MCP)
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as the db-tests job in ci.yml and the
      # web-e2e workflow. These are the documented local-dev-only values from
      # AGENTS.md; they exist in .env.example and in the compose file, and are
      # never used outside CI and local development. The harness connects as
      # the privileged openshapeforge role (its own default), which is what
      # lets the entity-event specs read the journal directly.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openshapeforge
          POSTGRES_PASSWORD: openshapeforge
          POSTGRES_DB: openshapeforge_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U openshapeforge -d openshapeforge_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Produces keycloak/openshapeforge-realm.json AND
      # keycloak/openshapeforge-control-realm.json, both gitignored. Without
      # this there are no realms to import.
      - name: Generate artifacts
        run: bun run generate

      # Started before the migrations rather than after, so its ~40s of
      # startup overlaps work that does not need it. Readiness is waited for
      # further down, immediately before the suite mints its first token.
      #
      # The stock Keycloak image, not the one packages/keycloak-spi builds —
      # same reasoning and same tag-lockstep trick as web-e2e.yml. Unlike that
      # workflow the CONTROL realm is mounted too: the control-provisioning
      # suite authenticates a platform operator against it.
      - name: Start Keycloak with both generated realms
        run: |
          image=$(grep -m1 '^FROM quay.io/keycloak/keycloak' packages/keycloak-spi/Dockerfile | awk '{print $2}')
          echo "keycloak image: $image"
          docker run -d --name keycloak --network host \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HTTP_ENABLED=true \
            -e KC_HTTP_PORT=8181 \
            -e KC_HOSTNAME=http://localhost:8181 \
            -e KC_HOSTNAME_STRICT=false \
            -e KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true \
            -e KC_HEALTH_ENABLED=true \
            -e KC_FEATURES=organization \
            -v "$PWD/keycloak/openshapeforge-realm.json:/opt/keycloak/data/import/openshapeforge-realm.json:ro" \
            -v "$PWD/keycloak/openshapeforge-control-realm.json:/opt/keycloak/data/import/openshapeforge-control-realm.json:ro" \
            "$image" start-dev --import-realm

      - name: Apply migrations
        env:
          OPENSHAPEFORGE_MIGRATE_DATABASE_URL: postgres://openshapeforge:openshapeforge@localhost:5434/openshapeforge_dev
          DATABASE_URL: postgres://openshapeforge_app:openshapeforge_app@localhost:5434/openshapeforge_dev
        run: bun run db:migrate

      # Health lives on the management port, not on 8181.
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:9000/health/ready 2>/dev/null | grep -q '"status": *"UP"'; then
              echo "keycloak ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::keycloak did not become ready within 120s"
          docker logs keycloak; exit 1

      # The harness supplies DATABASE_URL and the internal-context secret
      # itself; what is set here is exactly what a laptop exports to enable the
      # Keycloak-backed flows (the recipe in control-provisioning.e2e.test.ts
      # and apps/api/.env.example). Every value is a documented local-dev
      # default. Realm-user passwords are deliberately NOT set: the harness
      # falls back to the committed dev-realm literal, and this realm is the
      # one `bun run generate` just produced.
      #
      # The Keycloak-dependent specs skip themselves when no token can be
      # minted — correct on a laptop with no Keycloak, but in THIS job a skip
      # means the stack is broken and the gate would silently stop gating. So
      # the summary is checked: any skipped test fails the job.
      # test:e2e:report rather than test:e2e: same three suites, same exit
      # code, but it also renders .e2e-report/ — index.html (self-contained,
      # per-test request/response capture), junit.xml, and summary.md. The
      # report is what makes a failure here diagnosable without a laptop.
      - name: Run the e2e suite and render the report
        env:
          OPENSHAPEFORGE_API_VERIFY_BEARER_JWKS_URI: http://localhost:8181/realms/openshapeforge/protocol/openid-connect/certs
          OPENSHAPEFORGE_API_VERIFY_BEARER_ISSUER: http://localhost:8181/realms/openshapeforge
          OPENSHAPEFORGE_API_VERIFY_BEARER_AUDIENCE: erp-provider
          OPENSHAPEFORGE_CONTROL_KEYCLOAK_BASE_URL: http://localhost:8181
          OPENSHAPEFORGE_CONTROL_VERIFY_BEARER_ISSUER: http://localhost:8181/realms/openshapeforge-control
          OPENSHAPEFORGE_CONTROL_VERIFY_BEARER_JWKS_URI: http://localhost:8181/realms/openshapeforge-control/protocol/openid-connect/certs
          OPENSHAPEFORGE_CONTROL_VERIFY_BEARER_CLIENT_ID: openshapeforge-admin-gateway
          KEYCLOAK_CLIENT_SECRET_OPENSHAPEFORGE_AUTH_API: openshapeforge-auth-api-secret
        run: bun run test:e2e:report

      # In THIS job a skipped test means a token could not be minted — the
      # stack is broken and the gate would silently stop gating — so any skip
      # fails the job. Separate from the run step so the report above is
      # rendered and published either way.
      - name: Fail on skipped tests
        run: |
          # Case-level <skipped> elements — the same thing render-e2e-report.ts
          # parses, so the guard and the report cannot disagree.
          if grep -q '<skipped' .e2e-report/junit.xml; then
            echo "::error::e2e tests were skipped — the Keycloak-backed flows did not run. A skip here means minting a token failed, not that the flow is optional."
            exit 1
          fi

      # The full HTML report, downloadable from the run page.
      - name: Publish the HTML report
        id: report
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: api-e2e-report
          path: .e2e-report/
          retention-days: 14
          if-no-files-found: ignore

      # The same summary, rendered on the workflow run page itself.
      - name: Render the step summary
        if: always()
        run: |
          if [ -f .e2e-report/summary.md ]; then
            cat .e2e-report/summary.md >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Full HTML report: ${{ steps.report.outputs.artifact-url }}" >> "$GITHUB_STEP_SUMMARY"
          fi

      # One sticky comment per pull request, edited in place on every run so
      # the PR carries the latest results instead of accumulating a comment
      # per push. Matched by the invisible marker, not by author, so it keeps
      # working whichever token identity posts it.
      - name: Post the results on the pull request
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          ARTIFACT_URL: ${{ steps.report.outputs.artifact-url }}
        run: |
          marker='<!-- api-e2e-report -->'
          {
            echo "$marker"
            if [ -f .e2e-report/summary.md ]; then
              cat .e2e-report/summary.md
            else
              echo "### API e2e — ❌ the suite did not produce a report (the stack failed before tests ran; see the job log)"
            fi
            echo ""
            if [ -n "$ARTIFACT_URL" ]; then
              echo "📄 [Full HTML report]($ARTIFACT_URL) (per-test request/response capture) · [run](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            fi
          } > /tmp/comment.md
          existing=$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq "[.[] | select(.body | startswith(\"$marker\"))][0].id" 2>/dev/null || true)
          if [ -n "$existing" ] && [ "$existing" != "null" ]; then
            gh api -X PATCH "repos/${{ github.repository }}/issues/comments/$existing" \
              -F body=@/tmp/comment.md > /dev/null
          else
            gh api -X POST "repos/${{ github.repository }}/issues/$PR/comments" \
              -F body=@/tmp/comment.md > /dev/null
          fi

      - name: Collect logs from a failure
        if: failure()
        run: |
          echo "=== keycloak ==="; docker logs keycloak 2>&1 | tail -100 || true
