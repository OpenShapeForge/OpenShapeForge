name: CI

# Gate every PR to main (and pushes to main) with the project's own proof
# gates: the compiler generator + determinism checks, typechecks, unit tests,
# the third-party notices check, the Keycloak SPI build, the Helm chart, and
# the database migration tests. These mirror the gates documented in AGENTS.md.
#
# NOTE: wiring these jobs as required_status_checks in branch protection is a
# separate repo-admin step tracked in issue #47.

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  gates:
    name: Generate, typecheck, unit tests, notices
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      # --frozen-lockfile: fail if bun.lock is out of date rather than mutating it.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # generate is REQUIRED before the api typecheck/tests (produces
      # apps/api/src/generated/**).
      - name: Generate artifacts
        run: bun run generate

      - name: Typecheck
        run: bun run typecheck:compiler && bun run typecheck:api

      - name: Compiler unit tests
        run: bun test packages/compiler

      # API unit tests that need no database: config (limits, production guard),
      # the Fastify rate-limit boundary (driven with app.inject), and the
      # authorization guards that reject before any transaction opens. The
      # database-backed suites run in the db-tests job below.
      - name: API unit tests (no database)
        run: >-
          cd apps/api && bun test src/config src/roles
          src/graphql/__tests__/introspection.test.ts
          src/graphql/__tests__/classified-query-guard.unit.test.ts
          src/graphql/__tests__/classified-nullability.unit.test.ts

      # Determinism + freshness gate: regenerates twice and fails on drift, so
      # it must run after (or independently of) the generate step above.
      - name: Check generated artifacts are fresh and deterministic
        run: bun run check:generated

      - name: Check local authoring catalog is self-consistent
        run: bun run check:authoring-local

      - name: Check THIRD-PARTY-NOTICES is up to date
        run: bun run check:notices

      # A required status check is matched by job NAME. Renaming a job here
      # would silently drop the gate the branch-protection ruleset claims to
      # enforce, so the two are checked against each other.
      - name: Check branch protection requires the jobs that exist
        run: bun run check:required-checks

  keycloak-spi:
    name: Build Keycloak SPI (Maven)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # SPI targets Java 17 (packages/keycloak-spi/pom.xml).
      - uses: actions/setup-java@c1e323688fd81a25caa38c78aa6df2d33d3e20d9 # v4.8.0
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Package SPI
        run: mvn -B -f packages/keycloak-spi/pom.xml -DskipTests package

  helm:
    name: Lint and template Helm chart
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Helm lint
        run: helm lint ./deploy/helm/openshapeforge-api

      # The chart is fail-closed: it refuses to render without credentials, so
      # template with throwaway CI-only values purely to validate the manifests.
      # These are not real secrets and are never deployed.
      - name: Helm template
        run: |
          helm template ./deploy/helm/openshapeforge-api \
            --set database.url="postgres://app:app@db:5432/app" \
            --set database.migrateUrl="postgres://mig:mig@db:5432/app" \
            --set database.appPassword="ci-template-only" \
            --set auth.internalContextSecret="ci-template-only"

      # The Keycloak subchart is disabled by default, so the render above never
      # touches it. Template it explicitly, otherwise a broken subchart would
      # only surface during an actual deploy.
      - name: Helm template with the Keycloak subchart enabled
        run: |
          printf '{"realm":"ci-template-only"}' > /tmp/ci-realm.json
          helm template ./deploy/helm/openshapeforge-api \
            --set database.url="postgres://app:app@db:5432/app" \
            --set database.migrateUrl="postgres://mig:mig@db:5432/app" \
            --set database.appPassword="ci-template-only" \
            --set auth.internalContextSecret="ci-template-only" \
            --set keycloak.enabled=true \
            --set keycloak.database.jdbcUrl="jdbc:postgresql://db:5432/keycloak" \
            --set keycloak.database.password="ci-template-only" \
            --set keycloak.admin.password="ci-template-only" \
            --set 'global.imagePullSecrets[0].name=ghcr-pull' \
            --set-file keycloak.realm.json=/tmp/ci-realm.json

  db-tests:
    name: Database migration tests
    runs-on: ubuntu-latest
    services:
      # Matches docker-compose.local.yml (pgvector on Postgres 17). The tests
      # create throwaway scratch databases and provision the openshapeforge_app
      # role through the privileged connection, so the service must run as the
      # superuser openshapeforge role. These credentials are the documented
      # local-dev-only values from AGENTS.md, never used outside CI/local dev.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openshapeforge
          POSTGRES_PASSWORD: openshapeforge
          POSTGRES_DB: openshapeforge_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U openshapeforge -d openshapeforge_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # apps/api types consume generated artifacts; generate before running.
      - name: Generate artifacts
        run: bun run generate

      # The db tests default to localhost:5434 with the openshapeforge role and
      # a /postgres admin URL — the exact service configured above — so no extra
      # env wiring is needed.
      - name: Migration + drift tests
        run: cd apps/api && bun test src/db

  # Software-composition analysis (issue #105). The other jobs prove the code
  # builds and behaves; nothing here proves its dependencies are free of known
  # CVEs. One Trivy filesystem scan covers all three dependency trees at once:
  # bun.lock (JS), packages/keycloak-spi/pom.xml (Java), and the two Dockerfiles
  # (base images). SBOM + provenance attestations for the *published* images are
  # already emitted by docker-api.yml / docker-keycloak.yml, so this closes the
  # remaining half of #105.
  scan:
    name: Dependency and secret scan (Trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # exit-code 0 => reports without failing the build. A CVE disclosed
      # upstream is not something a PR author can fix, so blocking on it would
      # wedge unrelated work. To promote this to a hard gate: set exit-code to
      # "1" and add "Dependency and secret scan (Trivy)" to
      # required_status_checks in scripts/github/protect-main.ruleset.json.
      #
      # ignore-unfixed drops advisories with no released patch — the same
      # rationale: nothing actionable in a PR.
      - name: Trivy filesystem scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "0"
          format: table

# Follow-up: the full GraphQL e2e suite (apps/api test:e2e) additionally needs a
# running Keycloak issuer to mint bearer tokens for the transport-auth flows, so
# it is not wired here yet. Tracked as a follow-up to issue #22.
