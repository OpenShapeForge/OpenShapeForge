name: Deploy

# Deploys the Helm release (API + migrate Job + optional Keycloak) to the
# Scaleway Kapsule cluster.
#
# Runs entirely in CI — never from a workstation. The images it installs are the
# ones published by the "API image" and "Keycloak image" workflows; this
# workflow builds nothing.
#
# REQUIRED REPOSITORY SECRETS — five, all Scaleway. Only the first two are
# actually secret; the rest are identifiers the SDK insists on.
#   SCW_ACCESS_KEY               Scaleway API key
#   SCW_SECRET_KEY               Scaleway API secret
#   SCW_DEFAULT_PROJECT_ID       MUST be the OpenShapeForge project, not the
#                                CLI default — the organization has several
#   SCW_DEFAULT_ORGANIZATION_ID  The ORGANIZATION, which is not the project.
#                                With no config file on the runner the SDK
#                                rejects most calls without it.
#   SCW_CLUSTER_ID               Kapsule cluster ID
#
# Every application credential (database URLs, app password, internal context
# secret, Keycloak database and admin passwords) is read at run time from
# Scaleway Secret Manager, where Terraform in OpenShapeForge-Base publishes it.
# Those passwords are generated inside Terraform state, which this repository
# cannot read — so copying them into GitHub secrets by hand would be the only
# alternative, and would go stale the moment they rotate.
#
# GHCR authentication uses the job's own GITHUB_TOKEN (packages: read), so no
# personal access token is needed. See the pull-secret step for the one caveat
# that carries.

on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy. Empty = sha-<short commit> of this ref."
        required: false
        type: string
      deploy_keycloak:
        description: "Also deploy Keycloak from the subchart."
        required: false
        type: boolean
        default: true
      bearer_audience:
        description: "aud the API requires in bearer tokens. Must appear in the token's aud array."
        required: false
        type: string
        default: "erp-provider"
      api_host:
        description: "Public hostname to serve the API on. Empty = no Ingress (ClusterIP only)."
        required: false
        type: string
        default: "api.openshapeforge.eu"
      auth_host:
        description: "Public hostname for Keycloak. CHANGES THE TOKEN ISSUER — existing tokens stop validating. Empty = Keycloak stays cluster-internal."
        required: false
        type: string
        default: "auth.openshapeforge.eu"
      realm_mode:
        description: "Keycloak realm to compile. development permits the committed dev secrets and must never reach a public hostname."
        required: false
        type: choice
        default: production
        options:
          - development
          - production
      tls_issuer:
        description: "cert-manager ClusterIssuer. Switch to staging while iterating on a NON-production hostname — prod allows only 5 failed validations per hostname per hour."
        required: false
        type: choice
        default: letsencrypt-prod
        options:
          - letsencrypt-staging
          - letsencrypt-prod

# Never let two deploys race for the same release.
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: read # pull the private GHCR images with GITHUB_TOKEN

env:
  NAMESPACE: openshapeforge
  RELEASE: openshapeforge
  REGION: nl-ams
  SECRET_PREFIX: openshapeforge
  # The realm this deployment IS. `bun run generate` emits one
  # keycloak/<realm>-realm.json per authored realm, and since #288 there are
  # two of them — the tenant realm below and openshapeforge-control, which is
  # generated but NOT deployed (apps/admin is dev/CI only; see
  # deploy/README.md). Naming it here rather than globbing the directory: a
  # glob picked the alphabetically first file, which is the CONTROL realm, so
  # it would have derived the wrong issuer and handed Keycloak the wrong realm
  # to import.
  TENANT_REALM: openshapeforge

jobs:
  deploy:
    name: Helm upgrade --install
    runs-on: ubuntu-latest
    # Attach required reviewers to this environment in repo settings to gate
    # deploys behind an approval.
    environment: dev
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Fail early and legibly rather than part-way through a helm upgrade.
      - name: Preflight — required secrets are present
        env:
          REQUIRED: >-
            SCW_ACCESS_KEY SCW_SECRET_KEY SCW_DEFAULT_PROJECT_ID
            SCW_DEFAULT_ORGANIZATION_ID SCW_CLUSTER_ID
          SECRETS_JSON: ${{ toJSON(secrets) }}
        run: |
          missing=""
          for key in $REQUIRED; do
            if [ -z "$(jq -r --arg k "$key" '.[$k] // ""' <<<"$SECRETS_JSON")" ]; then
              missing="$missing $key"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::missing repository secrets:$missing"
            exit 1
          fi
          echo "all required secrets present"

      # The inputs are individually plausible but can combine into a deploy
      # that is both broken and unsafe: a development realm carries the
      # committed dev client secrets (authorization.yaml devSecret literals)
      # and sslRequired: none, and staging certificates are issued from an
      # untrusted root. Neither belongs on a hostname real clients resolve.
      #
      # Iteration is unaffected — any OTHER hostname may still use a
      # development realm and staging certificates, which is what they are for.
      # Only the live names are constrained.
      - name: Preflight — live hostnames require production settings
        env:
          PROTECTED_HOSTS: "api.openshapeforge.eu auth.openshapeforge.eu"
        run: |
          fail=0
          for host in "${{ inputs.api_host }}" "${{ inputs.auth_host }}"; do
            [ -n "$host" ] || continue
            case " $PROTECTED_HOSTS " in
              *" $host "*) ;;
              *) continue ;;
            esac
            if [ "${{ inputs.tls_issuer }}" != "letsencrypt-prod" ]; then
              echo "::error::$host is a live hostname, but tls_issuer is '${{ inputs.tls_issuer }}'. Staging certificates are issued from an untrusted root and every client would see a TLS error."
              fail=1
            fi
            if [ "${{ inputs.realm_mode }}" != "production" ]; then
              echo "::error::$host is a live hostname, but realm_mode is '${{ inputs.realm_mode }}'. A development realm carries this repository's committed client secrets and must never be reachable publicly."
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::refusing to deploy. Use realm_mode=production and tls_issuer=letsencrypt-prod for a live hostname, or deploy to a different hostname."
            exit 1
          fi
          echo "hostname/settings combination is coherent"

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Produces keycloak/openshapeforge-realm.json, which is gitignored and
      # therefore must be regenerated here rather than read from the checkout.
      - name: Install Scaleway CLI
        run: |
          curl -fsSL https://github.com/scaleway/scaleway-cli/releases/download/v2.51.0/scaleway-cli_2.51.0_linux_amd64 \
            -o /usr/local/bin/scw
          chmod +x /usr/local/bin/scw

      # The compiler REFUSES to emit a production realm carrying committed
      # client secrets or user passwords; it reads them from the environment
      # here. Terraform generates them into Secret Manager, so the names below
      # are the contract between the two — a mismatch fails generation naming
      # the variable rather than silently shipping a committed default.
      #
      # Users are kept in the production realm on purpose: they are the
      # identities the e2e suite authenticates as to prove roles and tenant
      # isolation. Production changes their passwords, not their existence.
      - name: Read realm credentials from Secret Manager
        if: ${{ inputs.realm_mode == 'production' }}
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
        run: |
          set -euo pipefail
          fetch() {
            scw secret version access-by-path secret-path=/ \
              secret-name="$1" revision=latest region="$REGION" \
              project-id="$SCW_DEFAULT_PROJECT_ID" -o json | jq -r '.data' | base64 -d
          }
          # secret-name -> env var the compiler reads.
          while IFS='|' read -r name var; do
            [ -z "$name" ] && continue
            value="$(fetch "$name")"
            if [ -z "$value" ]; then
              echo "::error::Secret Manager entry missing or empty: $name (needed for $var)"
              exit 1
            fi
            echo "::add-mask::$value"
            echo "$var=$value" >> "$GITHUB_ENV"
          done <<'PAIRS'
          ${{ env.SECRET_PREFIX }}-realm-client-openshapeforge-gateway|KEYCLOAK_CLIENT_SECRET_OPENSHAPEFORGE_GATEWAY
          ${{ env.SECRET_PREFIX }}-realm-client-erp-provider|KEYCLOAK_CLIENT_SECRET_ERP_PROVIDER
          ${{ env.SECRET_PREFIX }}-realm-client-openshapeforge-timeline|KEYCLOAK_CLIENT_SECRET_OPENSHAPEFORGE_TIMELINE
          ${{ env.SECRET_PREFIX }}-realm-client-seed-service|KEYCLOAK_CLIENT_SECRET_SEED_SERVICE
          ${{ env.SECRET_PREFIX }}-realm-client-openshapeforge-auth-api|KEYCLOAK_CLIENT_SECRET_OPENSHAPEFORGE_AUTH_API
          ${{ env.SECRET_PREFIX }}-realm-user-acme-directie|E2E_USER_PASSWORD_ACME_DIRECTIE
          ${{ env.SECRET_PREFIX }}-realm-user-acme-vastgoedbeheerder|E2E_USER_PASSWORD_ACME_VASTGOEDBEHEERDER
          ${{ env.SECRET_PREFIX }}-realm-user-acme-wijkbeheerder|E2E_USER_PASSWORD_ACME_WIJKBEHEERDER
          ${{ env.SECRET_PREFIX }}-realm-user-acme-verhuurconsulent|E2E_USER_PASSWORD_ACME_VERHUURCONSULENT
          ${{ env.SECRET_PREFIX }}-realm-user-acme-noaccess|E2E_USER_PASSWORD_ACME_NOACCESS
          ${{ env.SECRET_PREFIX }}-realm-user-beta-verhuurconsulent|E2E_USER_PASSWORD_BETA_VERHUURCONSULENT
          PAIRS
          echo "realm credentials loaded (values masked)"

      # The CONTROL realm (openshapeforge-control, #288) is generated but NOT
      # deployed — apps/admin is dev/CI only, see deploy/README.md. Production
      # mode still refuses to emit ANY realm that carries a committed dev
      # credential, so generation would fail on a realm this deployment never
      # installs. One-shot random values satisfy that rule without inventing a
      # credential anyone could come to depend on: they are generated here,
      # never stored, and the realm file they land in is not the one handed to
      # Helm below.
      #
      # The day apps/admin gets deployed, these three move into the PAIRS list
      # above and into Secret Manager alongside the tenant realm's — the
      # deployment would otherwise stand up an issuer nobody holds credentials
      # for.
      - name: Placeholder credentials for the undeployed control realm
        if: ${{ inputs.realm_mode == 'production' }}
        run: |
          set -euo pipefail
          for var in KEYCLOAK_CLIENT_SECRET_OPENSHAPEFORGE_ADMIN_GATEWAY \
                     E2E_USER_PASSWORD_PLATFORM_OPERATOR \
                     E2E_USER_PASSWORD_PLATFORM_NOACCESS; do
            value="$(openssl rand -hex 32)"
            echo "::add-mask::$value"
            echo "$var=$value" >> "$GITHUB_ENV"
          done
          echo "control-realm placeholders set (values masked, never stored)"

      - name: Generate artifacts
        env:
          OPENSHAPEFORGE_REALM_MODE: ${{ inputs.realm_mode }}
        run: bun run generate

      - uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4.3.1

      - name: Fetch kubeconfig
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          # Was wrongly set to the PROJECT id. It happened to work here because
          # a cluster lookup by ID needs no organization, but it would have
          # failed the moment any call did.
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
        run: |
          scw k8s kubeconfig install "${{ secrets.SCW_CLUSTER_ID }}" \
            region=${{ env.REGION }} auth-method=copy-cli-token
          kubectl config current-context
          kubectl get nodes

      - name: Ensure namespace
        run: |
          kubectl create namespace "$NAMESPACE" --dry-run=client -o yaml | kubectl apply -f -

      # The GHCR packages are private, so both the API and Keycloak pods need
      # this to pull. Recreated on every deploy.
      #
      # CAVEAT: GITHUB_TOKEN expires when this job ends. `helm --wait` below
      # blocks until the rollout completes, so every image is pulled while the
      # token is still valid, and imagePullPolicy=IfNotPresent means restarts
      # reuse the node's cached copy. But a pod scheduled onto a NEW node long
      # after the deploy would fail to pull. To make this durable, either make
      # the GHCR packages public, or set a GHCR_PULL_TOKEN repository secret
      # (a PAT with read:packages) — it is used in preference when present.
      - name: Create GHCR pull secret
        env:
          PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "${{ secrets.GHCR_PULL_TOKEN }}" ]; then
            echo "using GHCR_PULL_TOKEN (durable)"
          else
            echo "::warning::using GITHUB_TOKEN for the pull secret; it expires with this job. Pods scheduled onto a new node later will fail to pull. Set GHCR_PULL_TOKEN or make the packages public to fix."
          fi
          kubectl -n "$NAMESPACE" create secret docker-registry ghcr-pull \
            --docker-server=ghcr.io \
            --docker-username="${{ github.actor }}" \
            --docker-password="$PULL_TOKEN" \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Resolve image tag
        id: tag
        run: |
          tag="${{ inputs.image_tag }}"
          if [ -z "$tag" ]; then
            # Matches docker/metadata-action's type=sha (7-char short sha).
            tag="sha-$(echo "${GITHUB_SHA}" | cut -c1-7)"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "deploying tag: $tag"

      # Confirm the images actually exist before touching the cluster: a missing
      # tag would otherwise surface as an ImagePullBackOff several minutes into
      # a failed rollout.
      - name: Verify images exist in GHCR
        env:
          PULL_TOKEN: ${{ secrets.GHCR_PULL_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          echo "$PULL_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          for img in openshapeforge-api openshapeforge-keycloak; do
            ref="ghcr.io/openshapeforge/$img:${{ steps.tag.outputs.tag }}"
            if ! docker manifest inspect "$ref" >/dev/null 2>&1; then
              echo "::error::image not found: $ref"
              exit 1
            fi
            echo "found $ref"
          done

      # Credentials come from Secret Manager, where Terraform published them.
      # They are written straight into a values file rather than onto the helm
      # command line: --set values would be visible in the process table, and
      # these are not GitHub secrets so the runner does not mask them
      # automatically — hence the explicit ::add-mask:: on every value.
      - name: Read deploy credentials from Secret Manager
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          # Required: with no config file on the runner, the SDK refuses every
          # call without an organization. It is NOT the project ID — this
          # organization contains several projects.
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
        run: |
          set -euo pipefail
          # NOTE: no 2>/dev/null here, deliberately. Suppressing scw's stderr
          # once turned a plain "organization ID is required" into a step that
          # died in 40ms with no output at all, because pipefail + set -e killed
          # it before anything was written. An error we cannot read costs far
          # more than noisy logs.
          fetch() {
            scw secret version access-by-path \
              secret-path=/ \
              secret-name="${SECRET_PREFIX}-$1" \
              revision=latest \
              region="$REGION" \
              project-id="$SCW_DEFAULT_PROJECT_ID" \
              -o json | jq -r '.data' | base64 -d
          }
          umask 077
          : > secrets.values.yaml
          emit() { # name -> yaml path
            value="$(fetch "$1")"
            if [ -z "$value" ]; then
              echo "::error::Secret Manager entry not found or empty: ${SECRET_PREFIX}-$1"
              exit 1
            fi
            echo "::add-mask::$value"
            printf '%s: %s\n' "$2" "$(jq -Rn --arg v "$value" '$v')" >> secrets.values.yaml
          }
          {
            echo "database:"
          } >> secrets.values.yaml
          emit database-url            "  url"
          emit migrate-database-url    "  migrateUrl"
          emit app-password            "  appPassword"
          # Required on every install since #223, worker workload or not: the
          # emitted RLS policies name openshapeforge_worker either way and the
          # migrate Job is what creates it. Fetching it here fails with the
          # secret's name; omitting it would fail later inside `helm template`,
          # which says less. Needs a `${SECRET_PREFIX}-worker-password` entry in
          # Secret Manager, distinct from app-password.
          emit worker-password         "  workerPassword"
          echo "auth:" >> secrets.values.yaml
          emit internal-context-secret "  internalContextSecret"
          echo "keycloak:" >> secrets.values.yaml
          echo "  database:" >> secrets.values.yaml
          emit keycloak-jdbc-url       "    jdbcUrl"
          emit keycloak-db-password    "    password"
          echo "  admin:" >> secrets.values.yaml
          emit keycloak-admin-password "    password"
          echo "wrote $(grep -c ':' secrets.values.yaml) lines of values (contents masked)"

      # When the chart also deploys Keycloak, point the API's bearer verifier at
      # it. The chart deliberately does not infer these (issuer must equal the
      # `iss` claim exactly, which depends on the URL clients use), but for an
      # in-cluster issuer the Service name IS that URL, so it can be derived
      # here. Without this the API accepts no bearer token at all.
      #
      # The realm NAME is env.TENANT_REALM — it is "openshapeforge", not the
      # release name, and guessing it yields a 404 discovery document. The
      # generated file is cross-checked against it rather than searched for, so
      # a renamed realm fails here instead of deploying the wrong issuer.
      - name: Derive issuer
        if: ${{ inputs.deploy_keycloak }}
        id: issuer
        run: |
          realm="${TENANT_REALM}"
          realm_file="keycloak/${realm}-realm.json"
          if [ ! -f "$realm_file" ]; then
            echo "::error::$realm_file was not generated. env.TENANT_REALM must name an authored realm; found: $(ls keycloak/*-realm.json 2>/dev/null | tr '\n' ' ')"
            exit 1
          fi
          if [ "$(jq -r '.realm' "$realm_file")" != "$realm" ]; then
            echo "::error::$realm_file does not declare realm '$realm'"
            exit 1
          fi
          internal="http://${RELEASE}-keycloak:8080/realms/${realm}"

          if [ -n "${{ inputs.auth_host }}" ]; then
            # Keycloak is public: it stamps `iss` with its external URL, so the
            # API must verify against THAT, not the Service name.
            issuer="https://${{ inputs.auth_host }}/realms/${realm}"
          else
            issuer="$internal"
          fi

          # JWKS is fetched back-channel and its host is never compared to any
          # claim, so keep it INTERNAL even when the issuer is public: it avoids
          # hairpinning out through the load balancer and back, and keeps the
          # API's startup independent of public DNS and certificate validity.
          echo "realm=$realm" >> "$GITHUB_OUTPUT"
          echo "issuer=$issuer" >> "$GITHUB_OUTPUT"
          echo "jwks=$internal/protocol/openid-connect/certs" >> "$GITHUB_OUTPUT"
          echo "realm '$realm'"
          echo "  issuer (must equal the iss claim): $issuer"
          echo "  jwks   (back-channel, internal):   $internal/protocol/openid-connect/certs"

      - name: Helm upgrade --install
        run: |
          bearer_args=()
          if [ "${{ inputs.deploy_keycloak }}" = "true" ]; then
            bearer_args=(
              --set auth.bearer.issuer="${{ steps.issuer.outputs.issuer }}"
              --set auth.bearer.jwksUri="${{ steps.issuer.outputs.jwks }}"
              --set auth.bearer.audience="${{ inputs.bearer_audience }}"
            )
          fi

          # Ingress + TLS. The controller, cert-manager and the DNS record are
          # cluster platform, owned by Terraform in OpenShapeForge-Base; the
          # chart only declares the Ingress and names the issuer that should
          # fulfil it. An empty api_host leaves the release ClusterIP-only.
          ingress_args=()
          host="${{ inputs.api_host }}"
          if [ -n "$host" ]; then
            ingress_args=(
              --set ingress.enabled=true
              --set ingress.className=nginx
              --set "ingress.annotations.cert-manager\.io/cluster-issuer=${{ inputs.tls_issuer }}"
              --set "ingress.hosts[0].host=$host"
              --set "ingress.hosts[0].paths[0].path=/"
              --set "ingress.hosts[0].paths[0].pathType=Prefix"
              --set "ingress.tls[0].secretName=openshapeforge-api-tls"
              --set "ingress.tls[0].hosts[0]=$host"
            )
            echo "serving on https://$host (issuer: ${{ inputs.tls_issuer }})"
          else
            echo "no api_host given — ClusterIP only, no Ingress"
          fi

          # Keycloak's own hostname. KC_HOSTNAME is what Keycloak stamps into
          # `iss`, so this and auth.bearer.issuer above are one decision made in
          # two places — the derive step computed both from the same input.
          # KC_PROXY_HEADERS is required because the ingress terminates TLS:
          # without it Keycloak builds redirect and issuer URLs from the
          # in-cluster request and advertises http:// on the wrong host.
          auth_args=()
          ahost="${{ inputs.auth_host }}"
          if [ "${{ inputs.deploy_keycloak }}" = "true" ] && [ -n "$ahost" ]; then
            auth_args=(
              --set keycloak.hostname="https://$ahost"
              --set keycloak.proxyHeaders=xforwarded
              --set keycloak.ingress.enabled=true
              --set keycloak.ingress.className=nginx
              --set "keycloak.ingress.annotations.cert-manager\.io/cluster-issuer=${{ inputs.tls_issuer }}"
              --set "keycloak.ingress.hosts[0].host=$ahost"
              # WHICH prefixes are public is the chart's decision, not this
              # workflow's: naming the realm makes it route that realm's OIDC
              # surface (discovery, protocol, login-actions) plus /resources for
              # the login theme, and nothing else. /admin (the console),
              # /realms/master, and the identity-configuration SPI at
              # /realms/<realm>/openshapeforge match no rule and never reach
              # Keycloak. This used to pass /realms/<realm> as a single prefix,
              # which routed the SPI to the internet — the finding S8 closes.
              --set "keycloak.ingress.publicRealm=${{ steps.issuer.outputs.realm }}"
              --set "keycloak.ingress.tls[0].secretName=openshapeforge-keycloak-tls"
              --set "keycloak.ingress.tls[0].hosts[0]=$ahost"
            )
            echo "keycloak public at https://$ahost (OIDC surface of ${{ steps.issuer.outputs.realm }} + /resources only; admin console and configuration SPI unrouted)"
          fi
          helm upgrade --install "$RELEASE" ./deploy/helm/openshapeforge-api \
            --namespace "$NAMESPACE" \
            --values secrets.values.yaml \
            --set image.tag="${{ steps.tag.outputs.tag }}" \
            --set 'global.imagePullSecrets[0].name=ghcr-pull' \
            --set keycloak.enabled=${{ inputs.deploy_keycloak }} \
            --set keycloak.image.tag="${{ steps.tag.outputs.tag }}" \
            --set-file keycloak.realm.json="keycloak/${TENANT_REALM}-realm.json" \
            "${bearer_args[@]}" \
            "${ingress_args[@]}" \
            "${auth_args[@]}" \
            --wait \
            --timeout 15m

      - name: Remove the rendered credentials
        if: always()
        run: rm -f secrets.values.yaml

      # --wait already blocks on readiness; this reports WHAT is running so the
      # log is useful without cluster access.
      - name: Report rollout
        if: always()
        run: |
          kubectl -n "$NAMESPACE" get deploy,pod,svc -o wide || true
          echo "--- migrate Job (Helm hook) ---"
          kubectl -n "$NAMESPACE" get jobs || true

      # On failure the pod logs are the only way to tell a migration error from
      # an image-pull problem, and they vanish with the next attempt.
      - name: Dump diagnostics on failure
        if: failure()
        run: |
          kubectl -n "$NAMESPACE" describe pods || true
          # `worker` is only present when workers.enabled=true; the selector is
          # the release, and worker pods carry it, so this reaches them. Without
          # the name here a failed worker rollout would produce no logs at all —
          # it has no probes and no Service, so its log is the only signal.
          for c in api keycloak migrate worker; do
            echo "=== logs: $c ==="
            kubectl -n "$NAMESPACE" logs -l app.kubernetes.io/instance="$RELEASE" \
              -c "$c" --tail=200 --all-containers=false || true
          done
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp | tail -40 || true
