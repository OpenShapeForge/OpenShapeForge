name: API image

# Builds the API container image (apps/api/Dockerfile), smoke-tests it, and
# publishes it to the GitHub Container Registry.
#
#   pull request (any base) -> build + smoke test only, never push
#   push to main            -> push :main and :sha-<commit>
#   tag v*                  -> push :<version>, :<major>.<minor> and :latest
#   repository dispatch     -> build default-branch SHA and publish :main and
#                              :sha-<commit>
#
# The image path matches what the Helm chart defaults to
# (deploy/helm/openshapeforge-api/values.yaml) and what deploy/README.md
# documents, so a chart install needs no image.repository override.
#
# NOTE: pushes to main/tags are not gated on the CI workflow here — the two run
# independently. Merges to main are already gated by CI on the pull request.

on:
  # Every pull request, whatever its base branch, for the reason in ci.yml:
  # a stacked PR used to match no trigger and so reported no checks at all
  # (#269). Building and smoke-testing an intermediate branch is the point;
  # the separate hosted publish job keeps it out of the registry.
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  # This event cannot select a branch or tag: GitHub binds it to the default
  # branch's current SHA.
  repository_dispatch:
    types: [publish-images]

concurrency:
  group: docker-api-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Lowercase literal: GHCR rejects the mixed-case ${{ github.repository_owner }}
  # (OpenShapeForge), and this is the path values.yaml already ships.
  IMAGE: ghcr.io/openshapeforge/openshapeforge-api

jobs:
  build:
    # Named distinctly from the Keycloak image job: a required status check is
    # matched by name, and two jobs sharing one name cannot both be required.
    # Keep the established name even though publication now lives in a separate
    # hosted job below.
    name: Build, smoke test, push the API image
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'osf-pr' || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Build into the local docker daemon FIRST so the image is smoke-tested
      # before anything is published. The registry build below reuses this
      # build's layer cache, so it costs one build, not two.
      #
      # Build context is the repository ROOT: the Dockerfile runs
      # `bun run generate`, which needs the compiler, its config, the workspace
      # plugins and authoring.config.yaml (see .dockerignore).
      - name: Build image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64
          load: true
          tags: openshapeforge-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Prove the image actually boots and serves /api/health. NODE_ENV is
      # development because production mode deliberately refuses to start
      # without a pinned bearer audience and a strong internal context secret
      # (assertProductionEnv) — credentials CI has no business minting. With no
      # DATABASE_URL the API logs a warning and serves without a database,
      # which is enough to catch a broken image.
      #
      # --read-only mirrors the chart's securityContext.readOnlyRootFilesystem
      # (issue #24). The tmpfs mirrors the emptyDir the chart mounts at /tmp. If
      # the image ever starts needing to write to its own filesystem, this fails
      # here rather than in a cluster after a rollout.
      - name: Smoke test the image
        run: |
          docker run -d --platform linux/amd64 --name api-smoke -p 3001:3001 \
            --read-only --tmpfs /tmp \
            -e NODE_ENV=development \
            openshapeforge-api:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:3001/api/health | grep -q '"status":"ok"'; then
              echo "health OK after ${i}s"
              docker rm -f api-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::image did not serve /api/health within 30s"
          docker logs api-smoke
          docker rm -f api-smoke >/dev/null
          exit 1

  # Publication is physically separated from pull-request validation so the
  # self-hosted runner never receives packages:write, registry credentials, or
  # a push step. This job is always GitHub-hosted. Repository dispatch can only
  # publish the default branch; release publication remains a reviewed v* tag
  # push and cannot select an arbitrary workflow definition.
  publish:
    name: Publish the API image
    needs: build
    if: ${{ (github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))) || (github.event_name == 'repository_dispatch' && github.ref == 'refs/heads/main') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Preflight — publication request is empty
        # Stable security-policy anchor used by check:deploy-workflows.
        id: request
        if: github.event_name == 'repository_dispatch'
        env:
          DISPATCH_PAYLOAD_JSON: ${{ toJSON(github.event.client_payload) }}
        run: |
          set -euo pipefail
          payload_json="$DISPATCH_PAYLOAD_JSON"
          [ "$payload_json" != "null" ] || payload_json="{}"
          if ! jq -e 'type == "object" and length == 0' <<<"$payload_json" >/dev/null; then
            echo "::error::publish-images does not accept client_payload fields"
            exit 1
          fi

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          # `latest` tracks the newest RELEASE tag, not the newest main commit —
          # the chart pins an explicit version, so latest must mean a release.
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=openshapeforge-api
            org.opencontainers.image.description=OpenShapeForge API — generated GraphQL CRUD service with Postgres row-level security
            org.opencontainers.image.licenses=BUSL-1.1

      # The hosted validation job above populated the same GHA cache. This step
      # exports and pushes with provenance/SBOM; the self-hosted PR path can
      # never reach it.
      - name: Push to GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha
