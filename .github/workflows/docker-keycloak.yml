name: Keycloak image

# Builds the Keycloak image (packages/keycloak-spi/Dockerfile) — official
# Keycloak with the OpenShapeForge SPI provider jar layered on and `kc.sh build`
# already run — smoke-tests it, and publishes it to GHCR.
#
# Trigger/tag behaviour mirrors the API image workflow exactly, so a given git
# tag produces a matching pair of images:
#
#   pull request (any base) -> build + smoke test only, never push
#   push to main            -> push :main and :sha-<commit>
#   tag v*                  -> push :<version>, :<major>.<minor> and :latest
#   manual run on any other ref -> build + smoke test only, never push
#
# There is deliberately NO paths filter: a tag push must publish this image even
# when the tagged commit changed nothing under packages/keycloak-spi, otherwise
# the API and Keycloak images would drift apart at release tags.
#
# The realm is NOT baked in. `bun run generate` produces
# keycloak/openshapeforge-realm.json, which is environment-specific and
# gitignored; the Helm chart imports it at deploy time instead, so one image
# serves every environment.

on:
  # Every pull request, whatever its base branch, for the reason in ci.yml:
  # a stacked PR used to match no trigger and so reported no checks at all
  # (#269). Building and smoke-testing an intermediate branch is the point;
  # the separate hosted publish job keeps it out of the registry.
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: docker-keycloak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Lowercase literal: GHCR rejects the mixed-case ${{ github.repository_owner }}.
  IMAGE: ghcr.io/openshapeforge/openshapeforge-keycloak

jobs:
  build:
    # Named distinctly from the API image job: a required status check is
    # matched by name, and two jobs sharing one name cannot both be required.
    # Keep the established name even though publication now lives in a separate
    # hosted job below.
    name: Build, smoke test, push the Keycloak image
    runs-on: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository && 'osf-pr' || 'ubuntu-latest' }}
    permissions:
      contents: read
    services:
      # Keycloak's image is built with `kc.sh build --db=postgres`, so it needs a
      # real Postgres to reach a ready state. This throwaway instance exists only
      # for the smoke test; the credentials are local to the runner.
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_DB: keycloak
          POSTGRES_USER: keycloak
          POSTGRES_PASSWORD: keycloak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U keycloak -d keycloak"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      # Build into the local daemon first so the image is smoke-tested before
      # anything is published. The registry build below reuses this layer cache.
      # Context is packages/keycloak-spi (the Maven build needs only pom.xml and
      # src), NOT the repository root.
      - name: Build image for testing
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: packages/keycloak-spi
          file: packages/keycloak-spi/Dockerfile
          load: true
          tags: openshapeforge-keycloak:ci
          cache-from: type=gha,scope=keycloak
          cache-to: type=gha,mode=max,scope=keycloak

      # Cheap structural check first: if the Maven stage silently produced
      # nothing, the jar would be missing and Keycloak would still start fine
      # without the SPI — a failure mode the health probe alone cannot catch.
      - name: Verify the SPI provider jar is present
        run: |
          docker run --rm --entrypoint ls openshapeforge-keycloak:ci \
            /opt/keycloak/providers/openshapeforge-keycloak-spi.jar

      # Prove the image actually reaches a ready state against Postgres. Host
      # networking lets the container reach the service container on localhost.
      - name: Smoke test the image
        run: |
          docker run -d --name kc-smoke --network host \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_DB=postgres \
            -e KC_DB_URL=jdbc:postgresql://localhost:5432/keycloak \
            -e KC_DB_USERNAME=keycloak \
            -e KC_DB_PASSWORD=keycloak \
            -e KC_HEALTH_ENABLED=true \
            -e KC_HTTP_ENABLED=true \
            -e KC_HOSTNAME_STRICT=false \
            openshapeforge-keycloak:ci start-dev
          # Keycloak serves health on the management port (9000), not 8080.
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9000/health/ready 2>/dev/null | grep -q '"status": *"UP"'; then
              echo "keycloak ready after ${i}s"
              docker rm -f kc-smoke >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::keycloak did not become ready within 90s"
          docker logs kc-smoke
          docker rm -f kc-smoke >/dev/null
          exit 1

      # The chart runs the container with securityContext.readOnlyRootFilesystem
      # (issue #24), writable emptyDirs mounted only at /opt/keycloak/data and
      # /tmp. Prove that combination boots, using the command the chart actually
      # uses: `start --optimized`, which skips Quarkus augmentation because
      # `kc.sh build` already ran at image build time.
      #
      # This deliberately does NOT reuse the start-dev step above: start-dev
      # re-runs augmentation and writes into /opt/keycloak/lib, so it cannot run
      # on a read-only rootfs. If someone drops the `kc.sh build` line from the
      # Dockerfile, `start --optimized` starts augmenting too and this step
      # fails — which is exactly the regression worth catching.
      - name: Smoke test the image with a read-only root filesystem
        run: |
          docker run -d --name kc-rofs --network host \
            --read-only --tmpfs /tmp --tmpfs /opt/keycloak/data \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_DB=postgres \
            -e KC_DB_URL=jdbc:postgresql://localhost:5432/keycloak \
            -e KC_DB_USERNAME=keycloak \
            -e KC_DB_PASSWORD=keycloak \
            -e KC_HEALTH_ENABLED=true \
            -e KC_HTTP_ENABLED=true \
            -e KC_HOSTNAME_STRICT=false \
            openshapeforge-keycloak:ci start --optimized
          for i in $(seq 1 90); do
            if curl -fsS http://127.0.0.1:9000/health/ready 2>/dev/null | grep -q '"status": *"UP"'; then
              echo "keycloak ready on a read-only rootfs after ${i}s"
              docker rm -f kc-rofs >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "::error::keycloak did not become ready on a read-only rootfs within 90s"
          docker logs kc-rofs
          docker rm -f kc-rofs >/dev/null
          exit 1

  # Publication is physically separated from pull-request validation so the
  # self-hosted runner never receives packages:write, registry credentials, or
  # a push step. This job is always GitHub-hosted and is fail-closed to main and
  # v* release refs; workflow_dispatch on a feature branch only validates.
  publish:
    name: Publish the Keycloak image
    needs: build
    if: ${{ github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')) }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive tags and labels
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
          labels: |
            org.opencontainers.image.title=openshapeforge-keycloak
            org.opencontainers.image.description=Keycloak with the OpenShapeForge SPI provider
            org.opencontainers.image.licenses=BUSL-1.1

      # The hosted validation job above populated the same GHA cache. This step
      # exports and pushes with provenance/SBOM; the self-hosted PR path can
      # never reach it.
      - name: Push to GHCR
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: packages/keycloak-spi
          file: packages/keycloak-spi/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=keycloak
