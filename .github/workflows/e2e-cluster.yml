name: E2E against cluster

# Runs the GraphQL + REST e2e suite against the DEPLOYED environment: the public
# API behind its ingress and certificate, the real Keycloak, and the managed
# database.
#
# The suite runs ON THE RUNNER, from this checkout. Most of it only needs HTTPS —
# it drives https://api.openshapeforge.eu exactly as any client would. Four
# specs additionally read Postgres directly (the entity-event journal and the
# schema-drift state), and that database has no public endpoint, so a short-lived
# tunnel is opened for them rather than exposing it.
#
# Running from the checkout rather than from a container image is deliberate: a
# newly written test runs immediately, instead of only after a build has been
# published and deployed.
#
# Manual dispatch only. It mutates the deployed database — the suite creates
# rows and removes them through the API afterwards — so it should be a decision,
# not something that fires on every push.
#
# REQUIRED REPOSITORY SECRETS: the same Scaleway set the deploy workflow uses.

on:
  workflow_dispatch:
    inputs:
      api_url:
        description: "URL the suite drives. Default exercises the public ingress and its certificate."
        required: false
        type: string
        default: "https://api.openshapeforge.eu"

concurrency:
  group: e2e-cluster
  cancel-in-progress: false

permissions:
  contents: read

env:
  NAMESPACE: openshapeforge
  RELEASE: openshapeforge
  REGION: nl-ams
  # Local port the database tunnel listens on.
  DB_LOCAL_PORT: "15432"

jobs:
  e2e:
    name: e2e against the deployed cluster
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The suite imports generated types and the entity manifest.
      - name: Generate artifacts
        run: bun run generate

      - name: Install Scaleway CLI
        run: |
          curl -fsSL https://github.com/scaleway/scaleway-cli/releases/download/v2.51.0/scaleway-cli_2.51.0_linux_amd64 \
            -o /usr/local/bin/scw
          chmod +x /usr/local/bin/scw

      - name: Fetch kubeconfig
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
        run: |
          scw k8s kubeconfig install "${{ secrets.SCW_CLUSTER_ID }}" \
            region=${{ env.REGION }} auth-method=copy-cli-token
          kubectl get nodes

      # Read the issuer off the deployment and pass it through unchanged, so the
      # suite authenticates against exactly what the API verifies against.
      # Deriving it independently would let the two drift and turn a config
      # mismatch into a mysterious auth failure.
      - name: Read issuer from the deployed API
        id: cfg
        run: |
          issuer=$(kubectl -n "$NAMESPACE" get deploy "${RELEASE}-openshapeforge-api" \
            -o jsonpath='{range .spec.template.spec.containers[0].env[?(@.name=="OPENSHAPEFORGE_API_VERIFY_BEARER_ISSUER")]}{.value}{end}')
          if [ -z "$issuer" ]; then
            echo "::error::the API deployment has no bearer issuer configured; deploy with Keycloak enabled first"
            exit 1
          fi
          echo "issuer=$issuer" >> "$GITHUB_OUTPUT"
          echo "issuer: $issuer"

      # Four specs read Postgres directly. The instance is on the cluster's
      # private network with no public endpoint, so forward a local port through
      # a throwaway in-cluster TCP proxy. kubectl port-forward can only target a
      # pod, hence the proxy rather than a selector-less Service.
      #
      # This keeps the database unreachable from the internet — the alternative,
      # enabling its public endpoint, would expose it permanently to make a
      # manual test convenient.
      - name: Open a tunnel to the database
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
        run: |
          set -euo pipefail
          url=$(scw secret version access-by-path secret-path=/ \
            secret-name=openshapeforge-migrate-database-url revision=latest \
            region="$REGION" project-id="$SCW_DEFAULT_PROJECT_ID" -o json | jq -r '.data' | base64 -d)
          echo "::add-mask::$url"
          hostport=$(sed -E 's#.*@([^/]+)/.*#\1#' <<<"$url")

          kubectl -n "$NAMESPACE" delete pod db-tunnel --ignore-not-found --wait=true
          kubectl -n "$NAMESPACE" run db-tunnel --image=alpine/socat --restart=Never -- \
            "TCP-LISTEN:5432,fork,reuseaddr" "TCP:${hostport}"
          kubectl -n "$NAMESPACE" wait --for=condition=ready pod/db-tunnel --timeout=120s

          kubectl -n "$NAMESPACE" port-forward pod/db-tunnel "${DB_LOCAL_PORT}:5432" \
            > /tmp/port-forward.log 2>&1 &

          # nc, not bash's /dev/tcp: the builtin is shell-specific, so a probe
          # written with it cannot be exercised outside the runner's shell —
          # and a readiness check nobody can test is worse than none.
          ready=""
          for i in $(seq 1 30); do
            if nc -z 127.0.0.1 "${DB_LOCAL_PORT}" 2>/dev/null; then ready=yes; break; fi
            sleep 1
          done
          if [ -z "$ready" ]; then
            echo "::error::database tunnel never came up"; cat /tmp/port-forward.log; exit 1
          fi
          echo "tunnel up on 127.0.0.1:${DB_LOCAL_PORT}"

          # Same credentials, rerouted through the tunnel.
          local_url=$(sed -E "s#@[^/]+/#@127.0.0.1:${DB_LOCAL_PORT}/#" <<<"$url")
          echo "::add-mask::$local_url"
          echo "DATABASE_URL=$local_url" >> "$GITHUB_ENV"

      - name: Read the trusted-context secret
        env:
          SCW_ACCESS_KEY: ${{ secrets.SCW_ACCESS_KEY }}
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          SCW_DEFAULT_PROJECT_ID: ${{ secrets.SCW_DEFAULT_PROJECT_ID }}
          SCW_DEFAULT_ORGANIZATION_ID: ${{ secrets.SCW_DEFAULT_ORGANIZATION_ID }}
        run: |
          set -euo pipefail
          secret=$(scw secret version access-by-path secret-path=/ \
            secret-name=openshapeforge-internal-context-secret revision=latest \
            region="$REGION" project-id="$SCW_DEFAULT_PROJECT_ID" -o json | jq -r '.data' | base64 -d)
          echo "::add-mask::$secret"
          echo "OPENSHAPEFORGE_INTERNAL_CONTEXT_SECRET=$secret" >> "$GITHUB_ENV"

      # --timeout: bun's 5s default assumes a local database. Here every journal
      # read crosses runner -> cluster API -> port-forward -> proxy -> database,
      # and the suite runs ~3.5x slower than it does over a local tunnel; the
      # event-journal specs tripped the default at exactly 5000ms. This is
      # latency, not a slow query, so the budget is raised rather than the
      # assertion loosened.
      - name: Run the e2e suite
        working-directory: apps/api
        env:
          NODE_ENV: test
          E2E_API_URL: ${{ inputs.api_url }}
          OPENSHAPEFORGE_API_VERIFY_BEARER_ISSUER: ${{ steps.cfg.outputs.issuer }}
        run: bun test --timeout 30000 src/graphql/__tests__ src/rest/__tests__

      - name: Close the tunnel
        if: always()
        run: |
          pkill -f "port-forward pod/db-tunnel" || true
          kubectl -n "$NAMESPACE" delete pod db-tunnel --ignore-not-found
