name: File sizes

# The readability gate (scripts/validate-pr-file-sizes.sh): every file a pull
# request TOUCHES stays at most 400 lines.
#
# Its own workflow rather than a step in ci.yml's `gates` job, for one reason:
# it is the only check here that needs the repository's FULL history. It diffs
# against the merge base with the PR's base branch, and `actions/checkout`
# clones one commit by default. Putting `fetch-depth: 0` on the gates job would
# make every other check in it pay for a full clone it has no use for.
#
# Same trigger as ci.yml, and for the same reason: EVERY pull request, whatever
# its base branch. A base filter here would report no check at all on a stacked
# pull request, which reads as pending rather than as never-going-to-run (#269)
# — and check:required-checks fails the build if this workflow grows one.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: file-sizes-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  file-sizes:
    name: File size gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The merge base with the PR's base branch has to exist locally.
          fetch-depth: 0

      # No `bun install`: the gate is bash and git only. Bun is here to run the
      # package script, so the command is the same one a developer runs.
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Check changed files stay readable
        run: bun run check:file-sizes
