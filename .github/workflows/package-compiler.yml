name: Package compiler

# Build the installable npm tarball for @openshapeforge/compiler, upload it as
# a run artifact, and — on pushes to main — publish it to the GitHub Packages
# npm registry so a host repo (docs/consuming.md) can install it by name. The
# repo is public, so the package is public too; note GitHub's npm registry
# still requires consumers to authenticate with a read:packages token even for
# public packages.
#
# The tarball is proven, not just produced: it is installed into a scratch
# project outside the workspace and the packaged bin regenerates this repo's own
# committed artifacts. A tarball that is missing a file (an EJS template, a JSON
# schema under config/ — both are loaded relative to the package at runtime)
# fails here rather than on the first consumer's machine.
#
# Not part of ci.yml: that workflow's jobs are wired to branch protection by
# NAME (scripts/check-required-checks.mjs), and this job is a distribution
# concern, not a merge gate.

on:
  push:
    branches: [main]
  # Path-filtered on purpose — this is not a required check (required checks
  # must run on every PR, see check-required-checks.mjs), so it only needs to
  # run when the tarball's contents could change.
  pull_request:
    paths:
      - "packages/compiler/**"
      - "bun.lock"
      - "docs/consuming.md"
      - ".github/workflows/package-compiler.yml"
  # On-demand, for grabbing a tarball from an arbitrary branch.
  workflow_dispatch:

concurrency:
  group: package-compiler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pack:
    name: Pack and smoke-test the compiler tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      # The smoke test regenerates against THIS repo as the host, and the
      # registered example plugins resolve their imports from the repo's own
      # node_modules — so the workspace install is needed even though the
      # tarball itself is built without it.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # LICENSE and README are copied in rather than committed to the package
      # directory: npm auto-includes both from the package root, the BUSL text
      # must travel with the tarball, and docs/consuming.md IS the package's
      # usage documentation — duplicating either in-tree would drift.
      - name: Pack the tarball
        run: |
          cp LICENSE packages/compiler/LICENSE
          cp docs/consuming.md packages/compiler/README.md
          mkdir -p /tmp/compiler-pack
          npm pack --pack-destination /tmp/compiler-pack ./packages/compiler

      # Install the tarball into a scratch project OUTSIDE the workspace (an
      # in-workspace install would resolve back to packages/compiler and prove
      # nothing), then run the packaged bin against this repo as the host root.
      # The generated artifacts are committed and deterministic (ci.yml's
      # check:generated), so `git diff --exit-code` is the assertion: the
      # packaged compiler must reproduce them byte-for-byte.
      - name: Smoke-test the tarball against this repo
        run: |
          mkdir -p /tmp/compiler-smoke
          cd /tmp/compiler-smoke
          printf '{"name":"compiler-smoke","private":true}\n' > package.json
          bun add /tmp/compiler-pack/openshapeforge-compiler-*.tgz
          ./node_modules/.bin/openshapeforge-compiler --repo-root "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" diff --exit-code

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openshapeforge-compiler-npm-${{ github.sha }}
          path: /tmp/compiler-pack/openshapeforge-compiler-*.tgz
          if-no-files-found: error
          retention-days: 90

  # Publish to the GitHub Packages npm registry — pushes to main only, and only
  # when this package.json version is not there yet, so releasing is "bump the
  # version and merge" and every other main push is a clean no-op. A registry
  # version is immutable; there is deliberately no force path.
  #
  # Its own job, not a step above: it is the only thing here needing
  # `packages: write`, and the pack job also runs on pull requests, where that
  # grant would be pure attack surface. It re-packs rather than downloading the
  # artifact because `npm publish <dir>` packs identically (same npm, same
  # committed tree — the smoke test in `pack` proved that exact content) and a
  # download step would add another pinned action for no additional proof.
  publish:
    name: Publish to GitHub Packages
    needs: pack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same pack-time copies as the pack job, for the same reason: the BUSL
      # text and the usage docs travel with the tarball without being
      # duplicated in-tree.
      - name: Stage LICENSE and README
        run: |
          cp LICENSE packages/compiler/LICENSE
          cp docs/consuming.md packages/compiler/README.md

      # The literal ${NODE_AUTH_TOKEN} is expanded by npm itself from the
      # step-level env at request time — the token never lands on disk.
      # GitHub's npm registry requires auth for reads too, so the
      # already-published probe below needs this as much as the publish does.
      - name: Configure npm for GitHub Packages
        run: printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > ~/.npmrc

      - name: Publish if this version is not published yet
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./packages/compiler/package.json').version")
          if npm view "@openshapeforge/compiler@${version}" version --registry=https://npm.pkg.github.com >/dev/null 2>&1; then
            echo "@openshapeforge/compiler@${version} is already published; nothing to do."
            exit 0
          fi
          npm publish ./packages/compiler
