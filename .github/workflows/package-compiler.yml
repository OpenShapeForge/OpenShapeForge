name: Package compiler

# Build the installable npm tarballs for @openshapeforge/compiler and its two
# public runtime contract packages, upload them as one run artifact, and — on
# pushes to main — publish them to the GitHub Packages npm registry in
# dependency order. The repo is public, but GitHub's npm registry still
# requires consumers to authenticate with a read:packages token.
#
# The tarball is proven, not just produced: it is installed into a scratch
# project outside the workspace and the packaged bin regenerates this repo's own
# committed artifacts. A tarball that is missing a file (an EJS template, a JSON
# schema under config/ — both are loaded relative to the package at runtime)
# fails here rather than on the first consumer's machine.
#
# Not part of ci.yml: that workflow's jobs are wired to branch protection by
# NAME (scripts/check-required-checks.mjs), and this job is a distribution
# concern, not a merge gate.

on:
  push:
    branches: [main]
  # Path-filtered on purpose — this is not a required check (required checks
  # must run on every PR, see check-required-checks.mjs), so it only needs to
  # run when the tarball's contents could change.
  pull_request:
    paths:
      - "packages/compiler/**"
      - "packages/interface-web/**"
      - "packages/operations/**"
      - "bun.lock"
      - "docs/consuming.md"
      - ".github/workflows/package-compiler.yml"
  # On-demand, for grabbing a tarball from an arbitrary branch.
  workflow_dispatch:

concurrency:
  group: package-compiler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pack:
    name: Pack and smoke-test the compiler tarball
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      # The smoke test regenerates against THIS repo as the host, and the
      # registered example plugins resolve their imports from the repo's own
      # node_modules — so the workspace install is needed even though the
      # tarball itself is built without it.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # LICENSE and README are copied in rather than committed to the package
      # directories. All three public tarballs carry the BUSL text; the
      # compiler also carries the consumer guide as its package README.
      - name: Pack the tarballs
        run: |
          for package in operations interface-web compiler; do
            cp LICENSE "packages/${package}/LICENSE"
          done
          cp docs/consuming.md packages/compiler/README.md
          mkdir -p /tmp/compiler-pack
          npm pack --pack-destination /tmp/compiler-pack ./packages/operations
          npm pack --pack-destination /tmp/compiler-pack ./packages/interface-web
          npm pack --pack-destination /tmp/compiler-pack ./packages/compiler

      # Install the tarball into a scratch project OUTSIDE the workspace (an
      # in-workspace install would resolve back to packages/compiler and prove
      # nothing), then run the packaged bin against this repo as the host root.
      # The generated artifacts are committed and deterministic (ci.yml's
      # check:generated), so `git diff --exit-code` is the assertion: the
      # packaged compiler must reproduce them byte-for-byte.
      - name: Smoke-test the tarball against this repo
        run: |
          mkdir -p /tmp/compiler-smoke
          cd /tmp/compiler-smoke
          printf '{"name":"compiler-smoke","private":true}\n' > package.json
          npm install \
            /tmp/compiler-pack/openshapeforge-operations-*.tgz \
            /tmp/compiler-pack/openshapeforge-interface-web-*.tgz \
            /tmp/compiler-pack/openshapeforge-compiler-*.tgz
          ./node_modules/.bin/openshapeforge-compiler --repo-root "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" diff --exit-code

      - name: Upload the tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openshapeforge-compiler-npm-${{ github.sha }}
          path: /tmp/compiler-pack/openshapeforge-*.tgz
          if-no-files-found: error
          retention-days: 90

  # Publish to the GitHub Packages npm registry — pushes to main only, and only
  # when this package.json version is not there yet, so releasing is "bump the
  # version and merge" and every other main push is a clean no-op. A registry
  # version is immutable; there is deliberately no force path.
  #
  # Its own job, not a step above: it is the only thing here needing
  # `packages: write`, and the pack job also runs on pull requests, where that
  # grant would be pure attack surface. It re-packs rather than downloading the
  # artifact because `npm publish <dir>` packs identically (same npm, same
  # committed tree — the smoke test in `pack` proved that exact content) and a
  # download step would add another pinned action for no additional proof.
  publish:
    name: Publish to GitHub Packages
    needs: pack
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # Same pack-time copies as the pack job, for the same reason.
      - name: Stage licenses and compiler README
        run: |
          for package in operations interface-web compiler; do
            cp LICENSE "packages/${package}/LICENSE"
          done
          cp docs/consuming.md packages/compiler/README.md

      # The literal ${NODE_AUTH_TOKEN} is expanded by npm itself from the
      # step-level env at request time — the token never lands on disk.
      # GitHub's npm registry requires auth for reads too, so the
      # already-published probe below needs this as much as the publish does.
      - name: Configure npm for GitHub Packages
        run: printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > ~/.npmrc

      - name: Verify immutable versions, then publish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/compiler-publish
          : > /tmp/compiler-publish/new-tarballs

          # Preflight EVERY package before publishing any of them. A version in
          # the registry is immutable: identical content is a clean no-op, but
          # changed content under that version is a missing version bump and
          # must stop before a dependant can be published against stale code.
          for package in operations interface-web compiler; do
            name=$(node -p "require('./packages/${package}/package.json').name")
            version=$(node -p "require('./packages/${package}/package.json').version")
            pack_json=$(npm pack --json --pack-destination /tmp/compiler-publish "./packages/${package}")
            tarball=$(PACK_JSON="${pack_json}" node -p 'JSON.parse(process.env.PACK_JSON)[0].filename')
            local_integrity=$(PACK_JSON="${pack_json}" node -p 'JSON.parse(process.env.PACK_JSON)[0].integrity')
            published_integrity=$(npm view "${name}@${version}" dist.integrity --json --registry=https://npm.pkg.github.com 2>/dev/null || true)

            if [ -n "${published_integrity}" ]; then
              published_integrity=$(PUBLISHED_INTEGRITY="${published_integrity}" node -p 'JSON.parse(process.env.PUBLISHED_INTEGRITY)')
              if [ "${local_integrity}" != "${published_integrity}" ]; then
                echo "::error::${name}@${version} already exists with different contents; bump its version before publishing."
                exit 1
              fi
              echo "${name}@${version} is already published with identical contents; nothing to do."
            else
              printf '/tmp/compiler-publish/%s\n' "${tarball}" >> /tmp/compiler-publish/new-tarballs
            fi
          done

          # The plan is already dependency ordered because the preflight loop
          # is operations -> interface-web -> compiler. Publish the exact
          # tarballs whose integrity was checked rather than repacking them.
          while IFS= read -r tarball; do
            npm publish "${tarball}"
          done < /tmp/compiler-publish/new-tarballs
