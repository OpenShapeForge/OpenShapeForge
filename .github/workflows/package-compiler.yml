name: Package compiler

# Build the installable npm tarballs for @openshapeforge/compiler and its two
# public runtime contract packages, upload them as one run artifact, and — on
# pushes to main and to the hans/dev integration branch — publish every
# non-private workspace package to the GitHub Packages npm registry in
# dependency order (scripts/publish-packages.mjs). The repo is public, but
# GitHub's npm registry still requires consumers to authenticate with a
# read:packages token.
#
# The tarball is proven, not just produced: it is installed into a scratch
# project outside the workspace and the packaged bin regenerates this repo's own
# committed artifacts. A tarball that is missing a file (an EJS template, a JSON
# schema under config/ — both are loaded relative to the package at runtime)
# fails here rather than on the first consumer's machine.
#
# Not part of ci.yml: that workflow's jobs are wired to branch protection by
# NAME (scripts/check-required-checks.mjs), and this job is a distribution
# concern, not a merge gate.

on:
  push:
    branches: [main, hans/dev]
  # Path-filtered on purpose — this is not a required check (required checks
  # must run on every PR, see check-required-checks.mjs), so it only needs to
  # run when a published package's contents could change.
  pull_request:
    paths:
      - "packages/**"
      - "bun.lock"
      - "docs/consuming.md"
      - "scripts/publish-packages.mjs"
      - ".github/workflows/package-compiler.yml"
  # On-demand, for grabbing a tarball from an arbitrary branch.
  workflow_dispatch:

concurrency:
  group: package-compiler-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pack:
    name: Pack and smoke-test the compiler tarball
    runs-on: [self-hosted, macOS, ARM64, osf-package]
    permissions:
      contents: read
      # The publish dry run below asks the registry which versions already
      # exist; GitHub's npm registry needs auth even for that read.
      packages: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      # The smoke test regenerates against THIS repo as the host, and the
      # registered example plugins resolve their imports from the repo's own
      # node_modules — so the workspace install is needed even though the
      # tarball itself is built without it.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # LICENSE and README are copied in rather than committed to the package
      # directories. All three public tarballs carry the BUSL text; the
      # compiler also carries the consumer guide as its package README.
      - name: Pack the tarballs
        run: |
          for package in operations interface-web compiler; do
            cp LICENSE "packages/${package}/LICENSE"
          done
          cp docs/consuming.md packages/compiler/README.md
          rm -rf /tmp/compiler-pack
          mkdir -p /tmp/compiler-pack
          npm pack --pack-destination /tmp/compiler-pack ./packages/operations
          npm pack --pack-destination /tmp/compiler-pack ./packages/interface-web
          npm pack --pack-destination /tmp/compiler-pack ./packages/compiler

      # Install the tarball into a scratch project OUTSIDE the workspace (an
      # in-workspace install would resolve back to packages/compiler and prove
      # nothing), then run the packaged bin against this repo as the host root.
      # The generated artifacts are committed and deterministic (ci.yml's
      # check:generated), so `git diff --exit-code` is the assertion: the
      # packaged compiler must reproduce them byte-for-byte.
      - name: Smoke-test the tarball against this repo
        run: |
          rm -rf /tmp/compiler-smoke
          mkdir -p /tmp/compiler-smoke
          cd /tmp/compiler-smoke
          printf '{"name":"compiler-smoke","private":true}\n' > package.json
          npm install \
            /tmp/compiler-pack/openshapeforge-operations-*.tgz \
            /tmp/compiler-pack/openshapeforge-interface-web-*.tgz \
            /tmp/compiler-pack/openshapeforge-compiler-*.tgz
          ./node_modules/.bin/openshapeforge-compiler --repo-root "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" diff --exit-code

      - name: Upload the tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: openshapeforge-compiler-npm-${{ github.sha }}
          path: /tmp/compiler-pack/openshapeforge-*.tgz
          if-no-files-found: error
          retention-days: 90

      # Prove the full publish plan on every run without publishing anything:
      # every non-private package packs with its workspace specifiers rewritten,
      # and the version arithmetic for this commit is printed in the log. The
      # literal ${NODE_AUTH_TOKEN} is expanded by npm itself from the step-level
      # env at request time — the token never lands on disk.
      - name: Dry-run the publish plan
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > ~/.npmrc
          bun scripts/publish-packages.mjs --channel dev --sha "${GITHUB_SHA}" --dry-run

  # Publish to the GitHub Packages npm registry — pushes to main and hans/dev
  # only. On main the package.json version is published under `latest` when it
  # is not there yet, so releasing is "bump the version and merge" and every
  # other main push is a clean no-op; a registry version is immutable and there
  # is deliberately no force path. On hans/dev every push publishes
  # `<version>-dev.<8-char sha>` under the `dev` dist-tag, with the workspace's
  # internal dependencies pinned to that same run, so a consumer can install the
  # integration branch at an exact commit. `latest` is never moved from there.
  #
  # Its own job, not a step above: it is the only thing here needing
  # `packages: write`, and the pack job also runs on pull requests, where that
  # grant would be pure attack surface. It re-packs rather than downloading the
  # artifact because `npm publish` packs identically (same npm, same committed
  # tree — the smoke test in `pack` proved that exact content) and a download
  # step would add another pinned action for no additional proof.
  publish:
    name: Publish to GitHub Packages
    needs: pack
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/hans/dev')
    runs-on: [self-hosted, macOS, ARM64, osf-package]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      # Publishing re-packs every workspace package in this fresh job. Their
      # prepack builds need the repository's development dependencies (for
      # example @types/bun), which are not carried over from the pack job.
      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The literal ${NODE_AUTH_TOKEN} is expanded by npm itself from the
      # step-level env at request time — the token never lands on disk.
      # GitHub's npm registry requires auth for reads too, so the
      # already-published probe needs this as much as the publish does.
      - name: Configure npm for GitHub Packages
        run: printf '//npm.pkg.github.com/:_authToken=${NODE_AUTH_TOKEN}\n' > ~/.npmrc

      - name: Publish in dependency order
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${GITHUB_REF}" = "refs/heads/main" ]; then
            bun scripts/publish-packages.mjs --channel main
          else
            bun scripts/publish-packages.mjs --channel dev --sha "${GITHUB_SHA}"
          fi
