name: Web browser e2e

# Drives a real Chromium against a real stack: Postgres, Redis, Keycloak,
# `apps/api` and `apps/web`. It exists because two defects reached main past
# every other gate here — a server-action effect loop and a `dataTransfer` read
# that only a browser refuses — and neither is reachable from a typecheck, a
# build, or a simulated DOM. See issue #275.
#
# Its own workflow rather than a job in ci.yml, and deliberately NOT part of
# `gates`: that job has no Postgres, and this needs four services plus two app
# processes. `docker-keycloak.yml` is the precedent for standing a stack up on a
# pull request. Unlike that one this workflow builds and pushes NO image.
#
# Trigger matches ci.yml exactly. Issue #269 is the reason it is spelled out:
# a workflow that does not run on a pull request is not a gate, and one that
# runs only on pull requests to main is not a gate on the stacked PRs #240
# produces. This is a required status check, so leaving it base-filtered while
# the others widened would put a stacked PR back in the state #269 describes —
# a check that reads as pending and never runs.
#
# `bun run generate` is not optional here and is not just for types. Both the
# realm JSON Keycloak imports and the `/workflow` route files themselves are
# generator output and gitignored, so a clean checkout has neither.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  browser-e2e:
    name: Browser e2e (apps/web)
    runs-on: ubuntu-latest
    services:
      # Same image and credentials as the db-tests job in ci.yml. These are the
      # documented local-dev-only values from AGENTS.md; they exist in
      # .env.example and in the compose file, and are never used outside CI and
      # local development.
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: openshapeforge
          POSTGRES_PASSWORD: openshapeforge
          POSTGRES_DB: openshapeforge_dev
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U openshapeforge -d openshapeforge_dev"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      # The web session store. Sign-in does not work without it: the cookie
      # holds an opaque id and the session payload lives here.
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.4

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # Produces keycloak/openshapeforge-realm.json AND
      # apps/web/src/app/(plugins)/workflow/**, both gitignored. Without this
      # there is no realm to import and no route to visit.
      - name: Generate artifacts
        run: bun run generate

      # Started before the build rather than after, so its ~40s of startup
      # overlaps work that does not need it. Readiness is waited for further
      # down, immediately before anything talks to it.
      #
      # The stock Keycloak image, not the one packages/keycloak-spi builds: the
      # generated realm declares no custom components, so the SPI provider is
      # not needed to import it — and a Maven build would cost more than the
      # whole rest of this job. The tag is READ OUT of that Dockerfile so the
      # two cannot drift, and it carries the digest pin with it.
      #
      # start-dev keeps Keycloak on its embedded database, which is what makes
      # a second Postgres unnecessary here.
      - name: Start Keycloak with the generated realm
        run: |
          image=$(grep -m1 '^FROM quay.io/keycloak/keycloak' packages/keycloak-spi/Dockerfile | awk '{print $2}')
          echo "keycloak image: $image"
          docker run -d --name keycloak --network host \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin \
            -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -e KC_HTTP_ENABLED=true \
            -e KC_HTTP_PORT=8181 \
            -e KC_HOSTNAME=http://localhost:8181 \
            -e KC_HOSTNAME_STRICT=false \
            -e KC_HOSTNAME_BACKCHANNEL_DYNAMIC=true \
            -e KC_HEALTH_ENABLED=true \
            -e KC_FEATURES=organization \
            -v "$PWD/keycloak/openshapeforge-realm.json:/opt/keycloak/data/import/openshapeforge-realm.json:ro" \
            "$image" start-dev --import-realm

      # Keyed on the lockfile because that is what pins @playwright/test, and the
      # browser build a given release downloads is fixed.
      - name: Cache the browser binaries
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('bun.lock') }}

      - name: Install Chromium
        working-directory: apps/web
        run: bunx playwright install --with-deps chromium

      - name: Apply migrations
        env:
          OPENSHAPEFORGE_MIGRATE_DATABASE_URL: postgres://openshapeforge:openshapeforge@localhost:5434/openshapeforge_dev
          DATABASE_URL: postgres://openshapeforge_app:openshapeforge_app@localhost:5434/openshapeforge_dev
        run: bun run db:migrate

      - name: Build the web app
        run: bun run build:web

      - name: Start the API
        env:
          OPENSHAPEFORGE_ROLE: api
          PORT: "3001"
          HOST: 127.0.0.1
          DATABASE_URL: postgres://openshapeforge_app:openshapeforge_app@localhost:5434/openshapeforge_dev
          OPENSHAPEFORGE_MIGRATE_DATABASE_URL: postgres://openshapeforge:openshapeforge@localhost:5434/openshapeforge_dev
          OPENSHAPEFORGE_API_VERIFY_BEARER_JWKS_URI: http://localhost:8181/realms/openshapeforge/protocol/openid-connect/certs
          OPENSHAPEFORGE_API_VERIFY_BEARER_ISSUER: http://localhost:8181/realms/openshapeforge
          OPENSHAPEFORGE_API_VERIFY_BEARER_AUDIENCE: erp-provider
          OPENSHAPEFORGE_INTERNAL_CONTEXT_SECRET: openshapeforge-local-dev-context-secret
        run: |
          bun run --cwd apps/api start > /tmp/api.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:3001/api/health >/dev/null 2>&1; then
              echo "api ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the API never became ready"; cat /tmp/api.log; exit 1

      # Health lives on the management port, not on 8181.
      - name: Wait for Keycloak
        run: |
          for i in $(seq 1 120); do
            if curl -fsS http://127.0.0.1:9000/health/ready 2>/dev/null | grep -q '"status": *"UP"'; then
              echo "keycloak ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::keycloak did not become ready within 120s"
          docker logs keycloak; exit 1

      # AUTH_URL is http://localhost:3000 because that origin is one of the
      # redirect URIs the dev realm's gateway client accepts. Serving the app
      # anywhere else means adding that origin to
      # packages/compiler/config/authoring/authorization.yaml first, or Keycloak
      # refuses the callback. Every value below is a documented local-dev
      # default from apps/web/.env.example.
      - name: Start the web app
        env:
          PORT: "3000"
          AUTH_SECRET: openshapeforge-local-dev-auth-secret
          AUTH_KEYCLOAK_ID: openshapeforge-gateway
          AUTH_KEYCLOAK_SECRET: dev-secret
          AUTH_KEYCLOAK_ISSUER: http://localhost:8181/realms/openshapeforge
          AUTH_URL: http://localhost:3000
          AUTH_COOKIE_SECURE: "false"
          REDIS_URL: redis://localhost:6379
          OPENSHAPEFORGE_GATEWAY_URL: http://127.0.0.1:3001
          OPENSHAPEFORGE_GRAPHQL_GATEWAY_PATH: /api/graphql
          OPENSHAPEFORGE_GRAPHQL_FORWARD_ACCESS_TOKEN: "false"
          OPENSHAPEFORGE_INTERNAL_CONTEXT_SECRET: openshapeforge-local-dev-context-secret
        run: |
          bun run --cwd apps/web start > /tmp/web.log 2>&1 &
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:3000/login >/dev/null 2>&1; then
              echo "web ready after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the web app never became ready"; cat /tmp/web.log; exit 1

      # E2E_USER_PASSWORD_ACME_DIRECTIE is deliberately not set: the suite falls
      # back to the committed dev-realm literal exactly as the API's e2e harness
      # does, and this realm is the one `bun run generate` just produced.
      - name: Run the browser suite
        env:
          E2E_WEB_URL: http://localhost:3000
        run: bun run test:browser

      - name: Collect traces and server logs from a failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-e2e-failure
          path: |
            apps/web/test-results/
            /tmp/api.log
            /tmp/web.log
          retention-days: 7
          if-no-files-found: ignore
