# Authoring layers, applied in order (Kustomize-style base + overlays).
# Overlays may add files and patch entities from earlier layers with
# `kind: entityPatch`; catalogs/*.yaml merge across layers automatically.
# Plugins extend the compiler with generators, platform tables, and their
# own authoring layers (see packages/compiler/src/plugins.ts).
layers:
  - packages/compiler/config/authoring
  # One layer per connector, so a connector directory is self-contained: its
  # contract sits beside the package that implements it, and adding or dropping
  # an integration is one directory and one line here rather than an edit in
  # two trees. The shape mirrors how a plugin ships its own `authoring/`.
  - connectors/afas-profit/authoring
  - connectors/exact-online/authoring
  - connectors/dynamics-finance/authoring
plugins:
  - ./examples/plugins/entity-docs.ts
  # Workflow node catalogs: contributes the platform workflow catalog tables,
  # emits the api-side workflow artifacts (web-side ones only when apps/web
  # exists), and ships its own authoring layer (workflow-nodes/** plus a
  # Relation entityPatch). See examples/plugins/workflow/index.ts.
  - ./examples/plugins/workflow/index.ts
  # The domain node packs, as their own plugin so a deployment can drop them.
  # Its authoring layer ships `domain-workflow-nodes/**` rather than
  # `workflow-nodes/**` on purpose: every plugin's authoring layer merges into
  # one tree, and the workflow plugin's generator globs `workflow-nodes/`
  # recursively. A shared directory name would put these straight back into the
  # standard catalog, which is the thing this split exists to prevent. The two
  # catalogs are separate slices of one table (`catalog = 'domain'` here,
  # `'standard'` there), each authoritative over its own rows.
  - ./examples/plugins/workflow-domain-nodes/index.ts
