# Runs the GraphQL + REST e2e suite INSIDE the cluster, against the deployed
# API and the managed database.
#
# Applied by .github/workflows/e2e-cluster.yml, which substitutes the __…__
# placeholders. Kept as a file rather than inlined in the workflow so the thing
# that actually runs against a live environment is reviewable on its own.
#
# It runs in-cluster rather than from a runner because the database is on a
# private network with no public endpoint — a runner would need a tunnel, and
# the suite reads and cleans up rows directly.
#
# The API image carries the whole repository (its Dockerfile COPYs the root), so
# the specs and their dependencies are already present; nothing is built here.
apiVersion: batch/v1
kind: Job
metadata:
  name: e2e
  namespace: openshapeforge
  labels:
    app.kubernetes.io/name: openshapeforge-e2e
spec:
  # One shot. A retry would re-run against rows the previous attempt may have
  # left behind, turning a real failure into a confusing one.
  backoffLimit: 0
  template:
    metadata:
      labels:
        app.kubernetes.io/name: openshapeforge-e2e
    spec:
      restartPolicy: Never
      imagePullSecrets:
        - name: ghcr-pull
      containers:
        - name: e2e
          image: ghcr.io/openshapeforge/openshapeforge-api:__IMAGE_TAG__
          workingDir: /app/apps/api
          command: ["bun", "test", "src/graphql/__tests__", "src/rest/__tests__"]
          env:
            # Not production: this is a test harness, and the production guard
            # would reject its dev-shaped configuration.
            - name: NODE_ENV
              value: "test"
            # Drive the deployed service over HTTP instead of starting an
            # in-process yoga instance.
            - name: E2E_API_URL
              value: "__E2E_API_URL__"
            # The harness reads and cleans up rows directly, using the
            # PRIVILEGED role deliberately: verification and teardown must not
            # be filtered by the RLS policies under test.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: openshapeforge-openshapeforge-api
                  key: OPENSHAPEFORGE_MIGRATE_DATABASE_URL
            # Must equal the deployed API's secret, or every signed
            # trusted-context header the suite mints is rejected.
            - name: OPENSHAPEFORGE_INTERNAL_CONTEXT_SECRET
              valueFrom:
                secretKeyRef:
                  name: openshapeforge-openshapeforge-api
                  key: OPENSHAPEFORGE_INTERNAL_CONTEXT_SECRET
            # The harness uses this ONLY as the base URL for fetching a token —
            # it is not verifying anything. Pointing it at the in-cluster
            # Service keeps the suite independent of public DNS and certificate
            # validity, and the token is still accepted by the API: Keycloak
            # stamps `iss` from KC_HOSTNAME regardless of which URL minted it,
            # so an internally-fetched token carries the PUBLIC issuer.
            - name: OPENSHAPEFORGE_API_VERIFY_BEARER_ISSUER
              value: "__TOKEN_ISSUER__"
          resources:
            requests:
              cpu: 200m
              memory: 512Mi
            limits:
              memory: 1Gi
