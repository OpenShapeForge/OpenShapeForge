apiVersion: v2
name: openshapeforge-api
description: >-
  OpenShapeForge API — a generated GraphQL CRUD service with Postgres row-level
  security. Deploys the API and runs schema migrations as a pre-upgrade Job.
  Brings your own external Postgres and Keycloak (OIDC issuer).
type: application
version: 0.1.0
appVersion: "0.1.0"

# Keycloak is vendored under charts/ rather than pulled from a repository: the
# deployment must run the image built from packages/keycloak-spi, which no
# upstream chart knows about. Declared here purely so `condition` can gate it —
# it stays OFF unless explicitly enabled, preserving the documented
# bring-your-own-issuer posture.
dependencies:
  - name: keycloak
    version: 0.1.0
    repository: ""
    condition: keycloak.enabled
keywords:
  - openshapeforge
  - graphql
  - postgres
  - rls
home: https://github.com/OpenShapeForge/OpenShapeForge
sources:
  - https://github.com/OpenShapeForge/OpenShapeForge
