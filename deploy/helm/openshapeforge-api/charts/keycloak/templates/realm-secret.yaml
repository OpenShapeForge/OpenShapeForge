{{- if and .Values.realm.enabled .Values.realm.json (not .Values.realm.existingSecret) -}}
# The generated realm, supplied at deploy time with
#   --set-file keycloak.realm.json=keycloak/openshapeforge-dev-realm.json
# A Secret rather than a ConfigMap because a realm export can carry client
# secrets.
apiVersion: v1
kind: Secret
metadata:
  name: {{ printf "%s-realm" (include "keycloak.fullname" .) }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  realm.json: |
    {{- .Values.realm.json | nindent 4 }}
{{- end -}}
