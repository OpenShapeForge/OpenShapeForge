{{- if not .Values.database.existingSecret -}}
{{- if or (not .Values.database.jdbcUrl) (not .Values.database.password) (not .Values.admin.password) -}}
{{- fail "keycloak: set keycloak.database.existingSecret, or provide keycloak.database.jdbcUrl, keycloak.database.password and keycloak.admin.password. Do not deploy with empty credentials." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "keycloak.fullname" . }}
  labels:
    {{- include "keycloak.labels" . | nindent 4 }}
type: Opaque
stringData:
  KC_DB_URL: {{ .Values.database.jdbcUrl | quote }}
  KC_DB_USERNAME: {{ .Values.database.username | quote }}
  KC_DB_PASSWORD: {{ .Values.database.password | quote }}
  # Only consumed while the database is empty; ignored on later starts.
  KC_BOOTSTRAP_ADMIN_USERNAME: {{ .Values.admin.username | quote }}
  KC_BOOTSTRAP_ADMIN_PASSWORD: {{ .Values.admin.password | quote }}
{{- end -}}
