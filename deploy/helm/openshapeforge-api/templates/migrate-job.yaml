{{- if .Values.migration.enabled -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "openshapeforge-api.fullname" . }}-migrate
  labels:
    {{- include "openshapeforge-api.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    # Run before the Deployment rolls, on install and upgrade.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: {{ .Values.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        {{- include "openshapeforge-api.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: migrate
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "openshapeforge-api.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          # Roll forward the generated schema + apply versioned migrations,
          # provisioning the restricted app role. Runs as the privileged role.
          command: ["bun", "apps/api/src/db/migrate.ts"]
          env:
            {{- include "openshapeforge-api.commonEnv" . | nindent 12 }}
            - name: OPENSHAPEFORGE_MIGRATE_DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openshapeforge-api.secretName" . }}
                  key: OPENSHAPEFORGE_MIGRATE_DATABASE_URL
            # migrate.ts reads the migrate URL; DATABASE_URL is provided too so
            # any restricted-role grant sweep can reference it.
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "openshapeforge-api.secretName" . }}
                  key: DATABASE_URL
            # Password the restricted role is provisioned with (first creation
            # only). Required because NODE_ENV=production; must match the
            # password inside DATABASE_URL.
            - name: OPENSHAPEFORGE_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "openshapeforge-api.secretName" . }}
                  key: OPENSHAPEFORGE_APP_PASSWORD
            {{- if .Values.database.appPasswordRotate }}
            # One-shot rotation: set database.appPasswordRotate=true for a single
            # upgrade to reset the existing role's password to the value above.
            - name: OPENSHAPEFORGE_APP_PASSWORD_ROTATE
              value: "1"
            {{- end }}
          resources:
            {{- toYaml .Values.migration.resources | nindent 12 }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end -}}
