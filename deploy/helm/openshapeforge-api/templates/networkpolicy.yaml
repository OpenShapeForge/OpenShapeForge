{{- if .Values.networkPolicy.enabled -}}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "openshapeforge-api.fullname" . }}
  labels:
    {{- include "openshapeforge-api.labels" . | nindent 4 }}
spec:
  # Selects both the API Deployment and the migrate Job pods (shared selector
  # labels). The migrate Job carries the privileged DB URL; scoping its egress
  # to Postgres limits what a compromised migrate pod can reach.
  podSelector:
    matchLabels:
      {{- include "openshapeforge-api.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Egress
    {{- if .Values.networkPolicy.ingress.enabled }}
    - Ingress
    {{- end }}
  egress:
    # Allow DNS resolution (kube-dns / CoreDNS).
    {{- if .Values.networkPolicy.egress.allowDNS }}
    - to:
        {{- with .Values.networkPolicy.egress.dnsSelector }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
    {{- end }}
    # Scope egress to the external Postgres. Provide the database endpoint via
    # networkPolicy.egress.database (a list of NetworkPolicyPeer entries, e.g.
    # an ipBlock CIDR) and databasePort. Leaving `database` empty falls back to
    # allowing the database port to any destination (still narrows the port).
    - to:
        {{- with .Values.networkPolicy.egress.database }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.networkPolicy.egress.databasePort }}
    {{- with .Values.networkPolicy.egress.extra }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
  {{- if .Values.networkPolicy.ingress.enabled }}
  ingress:
    - from:
        {{- with .Values.networkPolicy.ingress.from }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
      ports:
        - protocol: TCP
          port: {{ .Values.service.targetPort }}
  {{- end }}
{{- end -}}
