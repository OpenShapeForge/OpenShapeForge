{{- if not .Values.database.existingSecret -}}
{{- if or (not .Values.database.url) (not .Values.database.migrateUrl) (not .Values.database.appPassword) (not .Values.auth.internalContextSecret) -}}
{{- fail "Set database.existingSecret, or provide database.url, database.migrateUrl, database.appPassword, and auth.internalContextSecret. Do not deploy with empty credentials." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openshapeforge-api.fullname" . }}
  labels:
    {{- include "openshapeforge-api.labels" . | nindent 4 }}
type: Opaque
stringData:
  # Restricted (NOSUPERUSER NOBYPASSRLS) role — the API runtime connection.
  DATABASE_URL: {{ .Values.database.url | quote }}
  # Privileged role — migrations only (provisions the restricted role + DDL).
  OPENSHAPEFORGE_MIGRATE_DATABASE_URL: {{ .Values.database.migrateUrl | quote }}
  # Password the migrate Job provisions the restricted role with (first creation
  # only). Must equal the password embedded in DATABASE_URL above.
  OPENSHAPEFORGE_APP_PASSWORD: {{ .Values.database.appPassword | quote }}
  # Signed service-to-service context header secret.
  OPENSHAPEFORGE_INTERNAL_CONTEXT_SECRET: {{ .Values.auth.internalContextSecret | quote }}
{{- end -}}
