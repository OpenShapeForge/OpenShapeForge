{{- if not .Values.database.existingSecret -}}
{{- if or (not .Values.database.url) (not .Values.database.migrateUrl) (not .Values.database.appPassword) (not .Values.auth.internalContextSecret) -}}
{{- fail "Set database.existingSecret, or provide database.url, database.migrateUrl, database.appPassword, and auth.internalContextSecret. Do not deploy with empty credentials." -}}
{{- end -}}
{{- if not .Values.database.workerPassword -}}
{{- fail "database.workerPassword is required: the migrate Job provisions the openshapeforge_worker role with it, on every install, because the workflow queue policies name that role whether or not this install runs a worker. It must differ from database.appPassword. Set database.workerUrl too if a worker workload is deployed." -}}
{{- end -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openshapeforge-api.fullname" . }}
  labels:
    {{- include "openshapeforge-api.labels" . | nindent 4 }}
  annotations:
    # The pre-install/pre-upgrade migrate Job (weight -5) reads its credentials
    # from this Secret. Make the Secret a hook too, with a lower weight (-10) so
    # it is created BEFORE the Job; otherwise on a fresh `helm install` the Job
    # runs (hooks precede normal resources) before this normal Secret exists and
    # its secretKeyRefs fail with CreateContainerConfigError. Deliberately DO NOT
    # set hook-succeeded in the delete policy: the Secret must persist after the
    # hooks so the steady-state Deployment pods (a normal resource) can mount it.
    # pre-upgrade re-runs on every upgrade, keeping the Secret fresh with the
    # current values.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-10"
    "helm.sh/hook-delete-policy": before-hook-creation
type: Opaque
stringData:
  # Restricted (NOSUPERUSER NOBYPASSRLS) role — the API runtime connection.
  DATABASE_URL: {{ .Values.database.url | quote }}
  # Privileged role — migrations only (provisions the restricted role + DDL).
  OPENSHAPEFORGE_MIGRATE_DATABASE_URL: {{ .Values.database.migrateUrl | quote }}
  # Password the migrate Job provisions the restricted role with (first creation
  # only). Must equal the password embedded in DATABASE_URL above.
  OPENSHAPEFORGE_APP_PASSWORD: {{ .Values.database.appPassword | quote }}
  # SECOND restricted role — the worker runtime connection. The workflow queue
  # policies compare current_user against `openshapeforge_worker`, so this is
  # what makes a worker's cross-tenant claim legal and DATABASE_URL's role
  # unable to make one. Written even when empty so a worker workload's
  # secretKeyRef always resolves: an empty value is refused by the worker at
  # boot, with a message naming the variable, which is a better failure than a
  # pod that cannot start for a reason Kubernetes describes as a missing key.
  OPENSHAPEFORGE_WORKER_DATABASE_URL: {{ .Values.database.workerUrl | quote }}
  # Password the migrate Job provisions the worker role with (first creation
  # only). Must equal the password embedded in OPENSHAPEFORGE_WORKER_DATABASE_URL
  # above, and must differ from OPENSHAPEFORGE_APP_PASSWORD.
  OPENSHAPEFORGE_WORKER_PASSWORD: {{ .Values.database.workerPassword | quote }}
  # Signed service-to-service context header secret.
  OPENSHAPEFORGE_INTERNAL_CONTEXT_SECRET: {{ .Values.auth.internalContextSecret | quote }}
{{- end -}}
