apiVersion: v1
kind: Service
metadata:
  name: {{ include "openshapeforge-api.fullname" . }}
  labels:
    {{- include "openshapeforge-api.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  sessionAffinity: {{ .Values.service.sessionAffinity }}
  {{- with .Values.service.sessionAffinityConfig }}
  sessionAffinityConfig:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  ports:
    - name: http
      port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "openshapeforge-api.selectorLabels" . | nindent 4 }}
