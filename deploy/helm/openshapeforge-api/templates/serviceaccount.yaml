{{- if .Values.serviceAccount.create -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "openshapeforge-api.serviceAccountName" . }}
  labels:
    {{- include "openshapeforge-api.labels" . | nindent 4 }}
  annotations:
    # The migrate Job (weight -5) runs as this ServiceAccount, and Helm creates
    # EVERY hook before ANY normal resource. As a plain resource this did not
    # exist when the Job was created, so a fresh `helm install` never got a pod:
    #   pods "…-migrate-" is forbidden: error looking up service account
    #   openshapeforge/…: serviceaccount not found
    # and the Job retried until the install timed out. Only upgrades over an
    # existing release worked, which is why it survived template-only testing.
    #
    # Same fix the Secret already carries, one weight earlier so the ordering is
    # ServiceAccount (-15) -> Secret (-10) -> Job (-5).
    #
    # Deliberately NO hook-succeeded in the delete policy: the steady-state
    # Deployment is a normal resource and needs this to outlive the hooks.
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-15"
    "helm.sh/hook-delete-policy": before-hook-creation
    {{- with .Values.serviceAccount.annotations }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
automountServiceAccountToken: false
{{- end -}}
