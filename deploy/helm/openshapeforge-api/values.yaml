# Default values for openshapeforge-api.
#
# OpenShapeForge expects an EXTERNAL Postgres and an EXTERNAL OIDC issuer
# (Keycloak). This chart deploys only the API and its migration Job.
#
# Security posture (see SECURITY.md):
#   - the API connects to Postgres as a RESTRICTED (NOSUPERUSER NOBYPASSRLS)
#     role via database.url, so FORCE ROW LEVEL SECURITY is enforced;
#   - migrations run as a PRIVILEGED role via database.migrateUrl in a
#     pre-upgrade Job (it also provisions the restricted role);
#   - NODE_ENV=production is always set, so the API refuses to start unless a
#     bearer audience and a strong internal context secret are configured
#     (assertProductionEnv).

replicaCount: 2

image:
  repository: ghcr.io/openshapeforge/openshapeforge-api
  tag: "" # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- Database ----------------------------------------------------------------
# Provide connection strings via an existing Secret (recommended) OR let the
# chart create one from the inline values below (fine for dev/testing only —
# do not commit real credentials).
database:
  # If set, all secret env is read from this existing Secret. It must contain
  # keys: DATABASE_URL, OPENSHAPEFORGE_MIGRATE_DATABASE_URL,
  # OPENSHAPEFORGE_INTERNAL_CONTEXT_SECRET.
  existingSecret: ""
  # Used only when existingSecret is empty (chart-managed Secret):
  url: "" # postgres://openshapeforge_app:<pw>@<host>:5432/openshapeforge  (restricted role)
  migrateUrl: "" # postgres://openshapeforge:<pw>@<host>:5432/openshapeforge  (privileged role)

# --- Authentication (OIDC / Keycloak) ----------------------------------------
# Non-secret bearer verification config. Audience is REQUIRED in production.
auth:
  bearer:
    jwksUri: "" # e.g. https://idp.example.com/realms/openshapeforge/protocol/openid-connect/certs
    issuer: "" # e.g. https://idp.example.com/realms/openshapeforge
    audience: "" # e.g. erp-provider  (must match the token's aud)
  # Shared secret for signed service-to-service context headers. Provide via
  # existingSecret (key OPENSHAPEFORGE_INTERNAL_CONTEXT_SECRET) or inline below.
  internalContextSecret: ""
  # Comma-separated roles that grant tenant-wide read scope (optional).
  tenantBypassRoles: ""

# --- Migration Job -----------------------------------------------------------
migration:
  enabled: true
  # Runs as a Helm pre-install/pre-upgrade hook before the Deployment rolls.
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# --- Service -----------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  targetPort: 3001

# --- Ingress (optional) ------------------------------------------------------
# SECURITY: the API serves OIDC bearer tokens and signed internal-context
# headers carrying tenant/auth data — never expose it over plaintext HTTP.
# When you enable the ingress you MUST terminate TLS. Do it here (recommended)
# or at an upstream LB/mesh; if you rely on an upstream terminator, set
# tls.required=false to silence the guard below and accept that responsibility.
ingress:
  enabled: false
  className: ""
  # Force HTTP->HTTPS redirect by default. On ingress-nginx these annotations
  # make the controller 308-redirect plaintext requests to HTTPS. Merge with
  # your own annotations; drop/override them for a controller with different
  # keys (e.g. Traefik, GKE, AWS ALB).
  sslRedirect: true
  # Uncomment and point at your cert-manager ClusterIssuer to have certificates
  # provisioned automatically; the tls block below is then filled in for you by
  # cert-manager writing to the referenced secret.
  # certManagerClusterIssuer: letsencrypt-prod
  certManagerClusterIssuer: ""
  annotations: {}
  hosts:
    - host: openshapeforge-api.local
      paths:
        - path: /
          pathType: Prefix
  # TLS termination. Populate this (or set certManagerClusterIssuer above) before
  # enabling ingress in production. Example:
  #   tls:
  #     hosts:
  #       - openshapeforge-api.example.com
  #     secretName: openshapeforge-api-tls
  tls:
    # Fail the render if the ingress is enabled with no TLS and no upstream
    # terminator, so the API is never silently served over plaintext HTTP.
    # Set to false ONLY when TLS is terminated upstream (LB/mesh).
    required: true
    hosts: []
    secretName: ""

# --- Workload ----------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # The image is a static Bun app that reads generated artifacts baked at build
  # time via module-relative reads, so it needs no writable code paths. The root
  # filesystem is read-only; the only writable location is a /tmp emptyDir (see
  # tmpDir below), which Bun uses for runtime scratch.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Writable scratch mount for the read-only-root containers (API + migrate Job).
# With readOnlyRootFilesystem: true the container filesystem is immutable except
# for this emptyDir mounted at /tmp, which Bun uses for temporary files. Disable
# it only if you also set securityContext.readOnlyRootFilesystem: false.
tmpDir:
  enabled: true
  # sizeLimit caps the emptyDir so scratch writes can't exhaust node memory/disk.
  sizeLimit: 64Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
# Extra environment variables (name/value) appended to the API container.
extraEnv: []
