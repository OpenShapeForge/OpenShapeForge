# Default values for openshapeforge-api.
#
# OpenShapeForge expects an EXTERNAL Postgres and an EXTERNAL OIDC issuer
# (Keycloak). This chart deploys only the API and its migration Job.
#
# Security posture (see SECURITY.md):
#   - the API connects to Postgres as a RESTRICTED (NOSUPERUSER NOBYPASSRLS)
#     role via database.url, so FORCE ROW LEVEL SECURITY is enforced;
#   - a WORKER connects as a SECOND restricted role via database.workerUrl.
#     The workflow queue policies compare current_user against that role, so a
#     worker process must not be given the API's credentials — and never falls
#     back to them (apps/api/src/roles/worker.ts refuses);
#   - migrations run as a PRIVILEGED role via database.migrateUrl in a
#     pre-upgrade Job (it also provisions both restricted roles);
#   - NODE_ENV=production is always set, so the API refuses to start unless a
#     bearer audience and a strong internal context secret are configured
#     (assertProductionEnv).

replicaCount: 2

image:
  repository: ghcr.io/openshapeforge/openshapeforge-api
  tag: "" # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- Database ----------------------------------------------------------------
# Provide connection strings via an existing Secret (recommended) OR let the
# chart create one from the inline values below (fine for dev/testing only —
# do not commit real credentials).
database:
  # If set, all secret env is read from this existing Secret. It must contain
  # keys: DATABASE_URL, OPENSHAPEFORGE_MIGRATE_DATABASE_URL,
  # OPENSHAPEFORGE_APP_PASSWORD, OPENSHAPEFORGE_INTERNAL_CONTEXT_SECRET — and,
  # when any worker workload is deployed, OPENSHAPEFORGE_WORKER_DATABASE_URL
  # and OPENSHAPEFORGE_WORKER_PASSWORD as well. The chart cannot check the
  # contents of a Secret it does not own; a worker started without the worker
  # URL refuses to boot rather than falling back to DATABASE_URL, so the
  # omission surfaces as a CrashLoopBackOff with an explicit message.
  existingSecret: ""
  # Used only when existingSecret is empty (chart-managed Secret):
  url: "" # postgres://openshapeforge_app:<pw>@<host>:5432/openshapeforge  (restricted role)
  migrateUrl: "" # postgres://openshapeforge:<pw>@<host>:5432/openshapeforge  (privileged role)
  # Password for the restricted openshapeforge_app role. The pre-upgrade migrate
  # Job provisions the role with this value ON FIRST CREATION ONLY (it never
  # force-resets an existing role's password), so it MUST equal <pw> in
  # database.url above. Required in production (NODE_ENV=production is always
  # set): a strong, randomized secret — the migrate Job refuses to run if unset
  # or left at the dev default. To rotate an already-provisioned role, set the
  # new value here AND appPasswordRotate=true for one upgrade (update
  # database.url in lockstep).
  appPassword: ""
  # Set to true for a SINGLE upgrade to rotate the restricted role's password to
  # database.appPassword. Leave false for routine upgrades.
  appPasswordRotate: false

  # WORKER connection string, for any workload running OPENSHAPEFORGE_ROLE=<a
  # worker role>. A SECOND restricted role, not a second URL for the same one:
  #
  #   postgres://openshapeforge_worker:<pw>@<host>:5432/openshapeforge
  #
  # The workflow queue policies read
  #   current_user = 'openshapeforge_worker'
  #   AND app.current_worker_role() = '<role>'
  # so the connected role is what authorizes the cross-tenant claim. Giving a
  # worker database.url instead would leave both processes on one database
  # identity — the property this exists to remove — and the worker would drain
  # nothing while reporting healthy. apps/api/src/roles/worker.ts therefore
  # refuses to start when this is unset, when it equals DATABASE_URL, and when
  # it names any role other than openshapeforge_worker.
  #
  # Empty is valid and means "this install deploys no worker": the Secret key is
  # still written (empty), the migrate Job still provisions the role, and only a
  # worker pod would notice. Leave it empty until a worker workload is enabled.
  workerUrl: ""
  # Password for the restricted openshapeforge_worker role. Same first-creation
  # contract as appPassword, and it MUST equal <pw> in database.workerUrl. Keep
  # it distinct from appPassword — one credential shared by both roles is one
  # credential, and the whole point of the second role is that holding one does
  # not get you the other.
  #
  # REQUIRED, even with workerUrl empty, when the chart manages the Secret. The
  # migrate Job provisions the role on every install because the emitted queue
  # policies name it either way, and a role the policies name but nothing
  # creates fails silently — the queue simply reads as empty. An upgrade from a
  # chart version before #223 therefore has to set this once.
  workerPassword: ""
  # Set to true for a SINGLE upgrade to rotate the worker role's password to
  # database.workerPassword. Leave false for routine upgrades.
  workerPasswordRotate: false

# --- Authentication (OIDC / Keycloak) ----------------------------------------
# Non-secret bearer verification config. Audience is REQUIRED in production.
auth:
  bearer:
    jwksUri: "" # e.g. https://idp.example.com/realms/openshapeforge/protocol/openid-connect/certs
    issuer: "" # e.g. https://idp.example.com/realms/openshapeforge
    audience: "" # e.g. erp-provider  (must match the token's aud)
  # Shared secret for signed service-to-service context headers. Provide via
  # existingSecret (key OPENSHAPEFORGE_INTERNAL_CONTEXT_SECRET) or inline below.
  internalContextSecret: ""
  # Comma-separated roles that grant tenant-wide read scope (optional).
  tenantBypassRoles: ""

# --- Resource limits (rate limiting + timeouts) ------------------------------
# App-level resource-exhaustion controls (issues #130, #161). GraphQL query
# depth / alias / cost / token / directive limits are separate and always on
# (see the API's yoga config). All values are overridable via extraEnv.
limits:
  rateLimit:
    # Max requests per window for an ANONYMOUS caller, keyed on client IP.
    max: 600
    # Sliding window length in milliseconds.
    windowMs: 60000
    # Budget for a caller presenting a trusted-context header whose HMAC
    # verifies — keyed per tenant+user, not per service. Empty => 5 × max.
    maxTrusted: ""
    # Shared store, so the budget is EXACT across replicas. Left empty the
    # store is in-memory and the budget is per instance: with replicaCount 2 a
    # client can reach up to 2 × max before being throttled.
    #
    # Two ways to supply it. Inline is fine for a URL with no credentials:
    #   redisUrl: redis://valkey.openshapeforge.svc:6379
    # A URL carrying a password belongs in a Secret instead:
    #   redisUrlSecret: { name: openshapeforge-redis, key: url }
    redisUrl: ""
    redisUrlSecret:
      name: ""
      key: url
  # Whole-request timeout in ms (Fastify requestTimeout); 0 disables.
  requestTimeoutMs: 30000
  # Per-request Postgres statement_timeout in ms, applied inside the tenant
  # transaction so one request cannot hold a connection indefinitely; 0 disables.
  dbStatementTimeoutMs: 15000
  # Reverse-proxy hops Fastify trusts to derive the client IP that the rate
  # limiter keys on. Behind a single ingress this is 1. Set a boolean or an
  # IP/CIDR allowlist string for other topologies. Trusting too many hops lets a
  # client spoof X-Forwarded-For and evade the limit.
  trustProxy: 1

# --- Migration Job -----------------------------------------------------------
migration:
  enabled: true
  # Runs as a Helm pre-install/pre-upgrade hook before the Deployment rolls.
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# --- Network isolation (optional) --------------------------------------------
# The migrate Job runs with the PRIVILEGED database URL (CREATE ROLE / DDL). It
# shares the API's selector labels, so this policy scopes egress for BOTH the
# API and the migrate Job to Postgres (plus DNS). Enable it, and set
# egress.database to your Postgres endpoint, to limit the blast radius of a
# compromised migrate pod. Requires a CNI that enforces NetworkPolicy.
networkPolicy:
  enabled: false
  egress:
    # Restrict egress to the Postgres port only.
    databasePort: 5432
    # NetworkPolicyPeer entries identifying the database (recommended). Example:
    #   database:
    #     - ipBlock:
    #         cidr: 10.0.0.5/32
    # Empty => allow the database port to any destination (port-only scoping).
    database: []
    # Permit DNS lookups (needed to resolve the Postgres/OIDC hostnames).
    allowDNS: true
    # Selector for the DNS server. Empty => any destination on port 53.
    # Typical kube-dns example:
    #   dnsSelector:
    #     - namespaceSelector: {}
    #       podSelector:
    #         matchLabels:
    #           k8s-app: kube-dns
    dnsSelector: []
    # Additional raw egress rules appended verbatim (e.g. OIDC/JWKS host).
    extra: []
  ingress:
    # Off by default; when disabled the policy only constrains egress.
    enabled: false
    # NetworkPolicyPeer entries allowed to reach the API's targetPort.
    from: []

# --- Service -----------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  targetPort: 3001
  # MCP transport sessions retain short-lived process-local state. Browser
  # OAuth/configuration handoffs are database-backed and may resume elsewhere.
  sessionAffinity: ClientIP
  sessionAffinityConfig:
    clientIP:
      timeoutSeconds: 1800

# --- Ingress (optional) ------------------------------------------------------
# The API carries OIDC bearer tokens and signed internal-context headers, so
# plaintext HTTP is never an acceptable default. Enabling ingress without a tls
# block FAILS the render (see templates/ingress.yaml) rather than quietly
# serving the API over HTTP.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: openshapeforge-api.local
      paths:
        - path: /
          pathType: Prefix
  # Each entry: {secretName, hosts: []}. With cert-manager, name a secret that
  # does not exist yet and add its issuer annotation, e.g.
  #   annotations:
  #     cert-manager.io/cluster-issuer: letsencrypt-prod
  #   tls:
  #     - secretName: openshapeforge-api-tls
  #       hosts: [api.example.com]
  tls: []
  # Annotations merged in (never overriding ingress.annotations) whenever TLS is
  # configured, so a request that arrives on :80 is redirected instead of
  # answered. These are ingress-nginx keys — replace them for another controller.
  sslRedirect:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  # Escape hatch for the one legitimate plaintext case: TLS terminated upstream
  # by a load balancer or service mesh the chart cannot see. Setting this to
  # true serves the API over HTTP if nothing else terminates TLS — it is a
  # deliberate, auditable choice, not a default.
  allowPlaintext: false

# --- Workload ----------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

# Scales the API Deployment on CPU, and ONLY the API Deployment. It does not
# cover the worker workload below, deliberately — see the note there.
autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # The image is a static Bun app: it reads generated artifacts baked at build
  # time and never writes to its own filesystem. Verified in CI — the API image
  # smoke test in .github/workflows/docker-api.yml boots the container with
  # `--read-only`. The chart still mounts an emptyDir at /tmp (see below) so a
  # dependency reaching for os.tmpdir() has somewhere to go.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Writable scratch mounted at /tmp in the API container and the migrate Job,
# so readOnlyRootFilesystem: true does not depend on nothing ever needing a
# temp file. sizeLimit caps it; the pod is evicted rather than filling the node.
tmpVolume:
  enabled: true
  sizeLimit: 64Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
# Extra environment variables (name/value) appended to the API container.
# Authored MCP browser handoffs need configured, non-derived origins, for
# example OPENSHAPEFORGE_PUBLIC_ORIGIN=https://api.example.com and
# OPENSHAPEFORGE_WEB_ORIGIN=https://app.example.com. Put
# OPENSHAPEFORGE_ELICITED_SECRET_KEYS in a Secret-backed deployment value.
extraEnv: []

# --- Worker workload (optional, OFF by default) ------------------------------
# One image, several roles: `OPENSHAPEFORGE_ROLE` picks which one
# `apps/api/src/index.ts` starts. `api` is the default and is the HTTP server
# every template above deploys; any other value names a background worker role
# contributed by a runtime module. The workflow plugin contributes
# `workflow-worker` — the process that drains `workflow.control_commands`,
# fires due schedules and resumes due timer waits.
#
# It is a separate Deployment rather than a thread inside the API because a poll
# loop and a request path have unrelated failure modes and unrelated scaling
# needs, and because its database session is deliberately different: it presents
# `app.worker_role`, a GUC the request path never sets (docs/api.md#the-worker-axis).
#
# OFF by default, so an existing install does not silently gain a pod. With it
# off nothing else changes — the rendered manifests are byte-identical to a
# chart that had no worker support at all.
#
# Everything the worker shares with the API is configured ONCE, above: `image`,
# `imagePullSecrets`, `serviceAccount`, `podSecurityContext`, `securityContext`,
# `tmpVolume`, and the same Secret (`database.existingSecret`, or the
# chart-managed one). Only what genuinely differs is listed here.
workers:
  enabled: false

  # Which role to start. A value rather than a literal in the template, for the
  # same reason `apps/api` names no worker role: roles are CONTRIBUTED by
  # runtime modules, and a repo that drops the workflow plugin loses
  # `workflow-worker` with it. The default names the only role the shipped
  # plugin set contributes, which makes it a convenience, not a coupling.
  #
  # Empty — or `api` — fails the render rather than being defaulted: index.ts
  # reads `OPENSHAPEFORGE_ROLE?.trim() || "api"`, so either would start a
  # second copy of the HTTP server here, with no Service in front of it.
  role: workflow-worker

  # Two, and the chart says so rather than leaving it to whoever installs it.
  #
  # N replicas are safe by construction: a poll claims rows with
  # `for update skip locked`, so a contended row is claimed by exactly one
  # worker, and a redelivery is idempotent because the command row is consumed
  # conditionally and the instance row is taken `for update` before anything is
  # decided. So this number is purely an availability choice.
  #
  # Two is the smallest number that keeps the queue moving through a node drain,
  # an image pull or a crash-loop backoff — and, given there are no probes (see
  # below), the smallest number for which one wedged worker means half the
  # throughput rather than none. It is also the availability `replicaCount`
  # above already assumes for the API, so the chart stays consistent about what
  # kind of cluster it expects.
  #
  # One is the smallest that costs nothing. Set it where a queue that pauses
  # while a node is replaced is acceptable.
  replicaCount: 2

  # --- Probes: there are none, on purpose ------------------------------------
  # The worker has no HTTP surface, so the API's `httpGet` probes do not
  # transfer, and the two alternatives both fail on inspection today:
  #
  #   - an `exec` probe has nothing to observe. The worker writes no heartbeat
  #     and opens no socket, so a probe could only assert that PID 1 exists —
  #     something the kubelet already knows. A liveness check that cannot fail
  #     is worse than none, because it reads as coverage.
  #   - a real liveness signal (the worker publishing a tick timestamp a probe
  #     can read) is a change to the `ModuleWorkerHandle` contract in
  #     `apps/api/src/modules/contract.ts` and to every contributed worker. That
  #     is a runtime change, not a chart one.
  #
  # The trade-off accepted: a worker that is alive but WEDGED — a tick blocked
  # on a connection Postgres never answers, say — is invisible to Kubernetes and
  # will not be restarted. What bounds the damage is the queue itself: a claim
  # older than the worker's visibility timeout (`processingTimeoutMs`, 120s by
  # default) is reclaimed and redispatched by another replica, so a wedged
  # worker costs throughput rather than commands. That is only true while a
  # second replica exists, which is what replicaCount above is for.
  #
  # A consequence worth knowing: with no readinessProbe a worker pod is Ready as
  # soon as its container is running. A worker that crash-loops (a bad
  # DATABASE_URL, an unknown role) still fails `helm upgrade --wait`, because a
  # backing-off container is not running — but one that starts and does nothing
  # would not.

  # Long enough for an in-flight tick to drain. `stop()` settles only after the
  # in-flight tick by contract, and SIGTERM is what a container runtime sends:
  # a grace period shorter than a dispatch turns a clean redeploy into one
  # abandoned command per replica, left `processing` until the visibility
  # timeout reclaims it.
  #
  # 150 = 120 + 30, both halves grounded in the worker's own code:
  #
  #   - 120s is where waiting stops buying anything:
  #     `DEFAULT_PROCESSING_TIMEOUT_MS` in
  #     `examples/plugins/workflow/runtime/control-command-worker.ts`, past
  #     which a claim is reclaimable by another replica anyway. The longest a
  #     single dispatch can take is bounded at the same 120s by
  #     `DEFAULT_RESTATE_TIMEOUT_MS`, the `AbortSignal.timeout` on a post to a
  #     durable-execution ingress — so one dispatch fits inside the window in
  #     which finishing it is still worth more than handing it over.
  #   - 30s covers what `stop()` drains BEFORE the command worker: the schedule
  #     sweep and the timer sweep, each awaiting its own in-flight tick, plus
  #     the 25ms granularity they poll at and closing the connection pool.
  #
  # A full batch (`DEFAULT_BATCH_SIZE` = 10) of dispatches each taking the full
  # 120s would exceed this, and deliberately so: by then the first command has
  # outlived its own visibility timeout and another replica may take it, so
  # waiting is strictly worse than exiting. With the default in-process
  # dispatcher a tick is bounded by Postgres and 30-60s is usually plenty; the
  # default is sized for the durable-execution path because the chart cannot see
  # which dispatcher the worker chose.
  terminationGracePeriodSeconds: 150

  # Same shape as the API's, and for the same reason no CPU limit is set: the
  # poll loop reschedules with NO delay while it is still finding work
  # (`nextDelayMs = result.processed > 0 ? 0 : pollIntervalMs`), so a backlog
  # should drain at whatever rate the node has spare.
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

  # No autoscaling block, and no HorizontalPodAutoscaler — `autoscaling` above
  # targets the API Deployment by name and does not reach this one.
  #
  # CPU is the wrong signal for a poll loop, not merely an imprecise one. An
  # idle worker sleeps `pollIntervalMs` between claims and sits near zero; a
  # worker blocked on a slow database also sits near zero, which is precisely
  # when a backlog is building. So utilisation tracks "is Postgres answering
  # quickly", inverted against the thing worth scaling on. Worse, every replica
  # added runs another `for update skip locked` scan per second against the same
  # three tables, so if the database IS the bottleneck, scaling out makes it
  # slower while CPU stays flat and the autoscaler keeps going.
  #
  # The signal that matters is queue depth — pending rows in
  # `workflow.control_commands` — which needs a metrics adapter (Prometheus
  # plus KEDA, or an external-metrics API) that this chart neither deploys nor
  # can assume. Fixed replicas until then.

  # Extra environment variables (name/value) appended to the worker container.
  # Separate from `extraEnv` above rather than added to it: the two containers
  # run different roles, and silently giving the worker the API's overrides is
  # how a request-path setting ends up changing a queue drain.
  #
  # This is where a durable-execution service is configured, if there is one.
  # Both halves are required, and the contract token exists so an ingress URL
  # arriving from a shared environment cannot move workflows onto a service
  # nobody chose:
  #
  #   extraEnv:
  #     - name: OPENSHAPEFORGE_WORKFLOW_RESTATE_CONTRACT
  #       value: workflow-command-v1
  #     - name: OPENSHAPEFORGE_WORKFLOW_RESTATE_INGRESS_URL
  #       value: http://restate.restate.svc:8080
  #
  # Absent both, the worker uses its in-process dispatcher, which is the
  # default and is correct on its own — durable execution is the upgrade.
  extraEnv: []

  podAnnotations: {}
  podLabels: {}
  nodeSelector: {}
  tolerations: []
  affinity: {}

  # Egress the worker needs ON TOP of the API's. Rendered only when
  # `networkPolicy.enabled` is also true, as a SECOND policy selecting only
  # worker pods (they carry their own labels, so the API's policy does not
  # reach them). It has no `ingress` rules and does not name Ingress in
  # policyTypes: the worker listens on nothing, so there is no port to admit
  # anyone to.
  #
  # DNS and Postgres are NOT repeated here — the worker claims from the same
  # database as the API, so `networkPolicy.egress.database`, `.databasePort`,
  # `.allowDNS` and `.dnsSelector` above stay the one place the endpoint is
  # named. `networkPolicy.egress.extra` is deliberately not inherited: those
  # rules are written for the API (a JWKS host, say), and the worker verifies
  # no tokens.
  networkPolicy:
    egress:
      # The durable-execution service the worker posts claimed commands to,
      # when `extraEnv` above configures one. Worker-only: the dispatcher is
      # chosen in the worker's start path and nothing on the request path ever
      # calls it.
      durableExecution:
        enabled: false
        # Restate's default ingress port.
        port: 8080
        # NetworkPolicyPeer entries identifying the ingress. Empty => allow the
        # port to any destination (still narrows the port), matching how
        # networkPolicy.egress.database behaves.
        peers: []
      # Additional raw egress rules appended verbatim to the worker's policy.
      extra: []

# --- Keycloak subchart (optional) --------------------------------------------
# OFF by default: the documented posture is an EXTERNAL OIDC issuer, and that
# does not change. Enable this only where the chart should also stand up the
# identity provider (dev, CI, a self-contained demo environment).
#
# When enabled you must ALSO set auth.bearer.* above to point at it — the chart
# deliberately does not infer them, because `issuer` has to match the `iss`
# claim in issued tokens exactly, which depends on the external URL clients use.
# For an in-cluster issuer that is typically:
#
#   auth.bearer.issuer  = http://<release>-keycloak:8080/realms/openshapeforge
#   auth.bearer.jwksUri = <issuer>/protocol/openid-connect/certs
#
# Full settings live in charts/keycloak/values.yaml.
keycloak:
  enabled: false

# Pull secrets shared by BOTH the API and the Keycloak subchart. The GHCR
# packages are private, so a docker-registry Secret is required unless the
# packages are made public.
global:
  imagePullSecrets: []
