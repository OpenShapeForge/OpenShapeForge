# Default values for openshapeforge-api.
#
# OpenShapeForge expects an EXTERNAL Postgres and an EXTERNAL OIDC issuer
# (Keycloak). This chart deploys only the API and its migration Job.
#
# Security posture (see SECURITY.md):
#   - the API connects to Postgres as a RESTRICTED (NOSUPERUSER NOBYPASSRLS)
#     role via database.url, so FORCE ROW LEVEL SECURITY is enforced;
#   - migrations run as a PRIVILEGED role via database.migrateUrl in a
#     pre-upgrade Job (it also provisions the restricted role);
#   - NODE_ENV=production is always set, so the API refuses to start unless a
#     bearer audience and a strong internal context secret are configured
#     (assertProductionEnv).

replicaCount: 2

image:
  repository: ghcr.io/openshapeforge/openshapeforge-api
  tag: "" # defaults to .Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []
nameOverride: ""
fullnameOverride: ""

# --- Database ----------------------------------------------------------------
# Provide connection strings via an existing Secret (recommended) OR let the
# chart create one from the inline values below (fine for dev/testing only —
# do not commit real credentials).
database:
  # If set, all secret env is read from this existing Secret. It must contain
  # keys: DATABASE_URL, OPENSHAPEFORGE_MIGRATE_DATABASE_URL,
  # OPENSHAPEFORGE_APP_PASSWORD, OPENSHAPEFORGE_INTERNAL_CONTEXT_SECRET.
  existingSecret: ""
  # Used only when existingSecret is empty (chart-managed Secret):
  url: "" # postgres://openshapeforge_app:<pw>@<host>:5432/openshapeforge  (restricted role)
  migrateUrl: "" # postgres://openshapeforge:<pw>@<host>:5432/openshapeforge  (privileged role)
  # Password for the restricted openshapeforge_app role. The pre-upgrade migrate
  # Job provisions the role with this value ON FIRST CREATION ONLY (it never
  # force-resets an existing role's password), so it MUST equal <pw> in
  # database.url above. Required in production (NODE_ENV=production is always
  # set): a strong, randomized secret — the migrate Job refuses to run if unset
  # or left at the dev default. To rotate an already-provisioned role, set the
  # new value here AND appPasswordRotate=true for one upgrade (update
  # database.url in lockstep).
  appPassword: ""
  # Set to true for a SINGLE upgrade to rotate the restricted role's password to
  # database.appPassword. Leave false for routine upgrades.
  appPasswordRotate: false

# --- Authentication (OIDC / Keycloak) ----------------------------------------
# Non-secret bearer verification config. Audience is REQUIRED in production.
auth:
  bearer:
    jwksUri: "" # e.g. https://idp.example.com/realms/openshapeforge/protocol/openid-connect/certs
    issuer: "" # e.g. https://idp.example.com/realms/openshapeforge
    audience: "" # e.g. erp-provider  (must match the token's aud)
  # Shared secret for signed service-to-service context headers. Provide via
  # existingSecret (key OPENSHAPEFORGE_INTERNAL_CONTEXT_SECRET) or inline below.
  internalContextSecret: ""
  # Comma-separated roles that grant tenant-wide read scope (optional).
  tenantBypassRoles: ""

# --- Resource limits (rate limiting + timeouts) ------------------------------
# App-level resource-exhaustion controls (issues #130, #161). GraphQL query
# depth / alias / cost / token / directive limits are separate and always on
# (see the API's yoga config). All values are overridable via extraEnv.
limits:
  rateLimit:
    # Max requests per window for an ANONYMOUS caller, keyed on client IP.
    max: 600
    # Sliding window length in milliseconds.
    windowMs: 60000
    # Budget for a caller presenting a trusted-context header whose HMAC
    # verifies — keyed per tenant+user, not per service. Empty => 5 × max.
    maxTrusted: ""
    # Shared store, so the budget is EXACT across replicas. Left empty the
    # store is in-memory and the budget is per instance: with replicaCount 2 a
    # client can reach up to 2 × max before being throttled.
    #
    # Two ways to supply it. Inline is fine for a URL with no credentials:
    #   redisUrl: redis://valkey.openshapeforge.svc:6379
    # A URL carrying a password belongs in a Secret instead:
    #   redisUrlSecret: { name: openshapeforge-redis, key: url }
    redisUrl: ""
    redisUrlSecret:
      name: ""
      key: url
  # Whole-request timeout in ms (Fastify requestTimeout); 0 disables.
  requestTimeoutMs: 30000
  # Per-request Postgres statement_timeout in ms, applied inside the tenant
  # transaction so one request cannot hold a connection indefinitely; 0 disables.
  dbStatementTimeoutMs: 15000
  # Reverse-proxy hops Fastify trusts to derive the client IP that the rate
  # limiter keys on. Behind a single ingress this is 1. Set a boolean or an
  # IP/CIDR allowlist string for other topologies. Trusting too many hops lets a
  # client spoof X-Forwarded-For and evade the limit.
  trustProxy: 1

# --- Migration Job -----------------------------------------------------------
migration:
  enabled: true
  # Runs as a Helm pre-install/pre-upgrade hook before the Deployment rolls.
  backoffLimit: 3
  activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi

# --- Network isolation (optional) --------------------------------------------
# The migrate Job runs with the PRIVILEGED database URL (CREATE ROLE / DDL). It
# shares the API's selector labels, so this policy scopes egress for BOTH the
# API and the migrate Job to Postgres (plus DNS). Enable it, and set
# egress.database to your Postgres endpoint, to limit the blast radius of a
# compromised migrate pod. Requires a CNI that enforces NetworkPolicy.
networkPolicy:
  enabled: false
  egress:
    # Restrict egress to the Postgres port only.
    databasePort: 5432
    # NetworkPolicyPeer entries identifying the database (recommended). Example:
    #   database:
    #     - ipBlock:
    #         cidr: 10.0.0.5/32
    # Empty => allow the database port to any destination (port-only scoping).
    database: []
    # Permit DNS lookups (needed to resolve the Postgres/OIDC hostnames).
    allowDNS: true
    # Selector for the DNS server. Empty => any destination on port 53.
    # Typical kube-dns example:
    #   dnsSelector:
    #     - namespaceSelector: {}
    #       podSelector:
    #         matchLabels:
    #           k8s-app: kube-dns
    dnsSelector: []
    # Additional raw egress rules appended verbatim (e.g. OIDC/JWKS host).
    extra: []
  ingress:
    # Off by default; when disabled the policy only constrains egress.
    enabled: false
    # NetworkPolicyPeer entries allowed to reach the API's targetPort.
    from: []

# --- Service -----------------------------------------------------------------
service:
  type: ClusterIP
  port: 80
  targetPort: 3001

# --- Ingress (optional) ------------------------------------------------------
# The API carries OIDC bearer tokens and signed internal-context headers, so
# plaintext HTTP is never an acceptable default. Enabling ingress without a tls
# block FAILS the render (see templates/ingress.yaml) rather than quietly
# serving the API over HTTP.
ingress:
  enabled: false
  className: ""
  annotations: {}
  hosts:
    - host: openshapeforge-api.local
      paths:
        - path: /
          pathType: Prefix
  # Each entry: {secretName, hosts: []}. With cert-manager, name a secret that
  # does not exist yet and add its issuer annotation, e.g.
  #   annotations:
  #     cert-manager.io/cluster-issuer: letsencrypt-prod
  #   tls:
  #     - secretName: openshapeforge-api-tls
  #       hosts: [api.example.com]
  tls: []
  # Annotations merged in (never overriding ingress.annotations) whenever TLS is
  # configured, so a request that arrives on :80 is redirected instead of
  # answered. These are ingress-nginx keys — replace them for another controller.
  sslRedirect:
    enabled: true
    annotations:
      nginx.ingress.kubernetes.io/ssl-redirect: "true"
      nginx.ingress.kubernetes.io/force-ssl-redirect: "true"
  # Escape hatch for the one legitimate plaintext case: TLS terminated upstream
  # by a load balancer or service mesh the chart cannot see. Setting this to
  # true serves the API over HTTP if nothing else terminates TLS — it is a
  # deliberate, auditable choice, not a default.
  allowPlaintext: false

# --- Workload ----------------------------------------------------------------
resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 75

livenessProbe:
  httpGet:
    path: /api/health
    port: http
  initialDelaySeconds: 10
  periodSeconds: 15
  timeoutSeconds: 3
  failureThreshold: 3

readinessProbe:
  httpGet:
    path: /api/ready
    port: http
  initialDelaySeconds: 5
  periodSeconds: 10
  timeoutSeconds: 3
  failureThreshold: 3

podAnnotations: {}
podLabels: {}

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  # The image is a static Bun app: it reads generated artifacts baked at build
  # time and never writes to its own filesystem. Verified in CI — the API image
  # smoke test in .github/workflows/docker-api.yml boots the container with
  # `--read-only`. The chart still mounts an emptyDir at /tmp (see below) so a
  # dependency reaching for os.tmpdir() has somewhere to go.
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# Writable scratch mounted at /tmp in the API container and the migrate Job,
# so readOnlyRootFilesystem: true does not depend on nothing ever needing a
# temp file. sizeLimit caps it; the pod is evicted rather than filling the node.
tmpVolume:
  enabled: true
  sizeLimit: 64Mi

serviceAccount:
  create: true
  name: ""
  annotations: {}

nodeSelector: {}
tolerations: []
affinity: {}
# Extra environment variables (name/value) appended to the API container.
extraEnv: []

# --- Keycloak subchart (optional) --------------------------------------------
# OFF by default: the documented posture is an EXTERNAL OIDC issuer, and that
# does not change. Enable this only where the chart should also stand up the
# identity provider (dev, CI, a self-contained demo environment).
#
# When enabled you must ALSO set auth.bearer.* above to point at it — the chart
# deliberately does not infer them, because `issuer` has to match the `iss`
# claim in issued tokens exactly, which depends on the external URL clients use.
# For an in-cluster issuer that is typically:
#
#   auth.bearer.issuer  = http://<release>-keycloak:8080/realms/openshapeforge
#   auth.bearer.jwksUri = <issuer>/protocol/openid-connect/certs
#
# Full settings live in charts/keycloak/values.yaml.
keycloak:
  enabled: false

# Pull secrets shared by BOTH the API and the Keycloak subchart. The GHCR
# packages are private, so a docker-registry Secret is required unless the
# packages are made public.
global:
  imagePullSecrets: []
