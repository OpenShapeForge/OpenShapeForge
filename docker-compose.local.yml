name: openshapeforge

networks:
  service-net:
    driver: bridge

services:
  platform-db:
    image: pgvector/pgvector:pg17
    container_name: openshapeforge-platform-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: openshapeforge_dev
      POSTGRES_USER: openshapeforge
      POSTGRES_PASSWORD: openshapeforge
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - platform-db-data-pg17:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openshapeforge -d openshapeforge_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - service-net

  # Session store for apps/web. The web app keeps the full OIDC session
  # (access/id/refresh tokens) here and puts only an opaque session id in the
  # encrypted cookie, so sign-in does not work without it.
  redis:
    image: redis:8-alpine
    container_name: openshapeforge-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - service-net

  keycloak-db:
    image: postgres:18-alpine
    container_name: openshapeforge-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      # Mount the whole data root, not `/var/lib/postgresql/data`. Postgres 18+
      # images set PGDATA to a major-version subdirectory
      # (`/var/lib/postgresql/18/docker`) and declare their volume one level up;
      # mounting the pre-18 path makes the container exit on start.
      - keycloak-db-data-pg18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - service-net

  keycloak:
    container_name: openshapeforge-keycloak
    restart: unless-stopped
    build:
      context: ./packages/keycloak-spi
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8181}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      # Required by the identity-configuration SPI, which manages Keycloak
      # Organizations in the TENANT realm. Server-wide flag, so it stays on even
      # though the control realm sets organizationsEnabled: false.
      KC_FEATURES: organization
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT:-8181}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      # `--import-realm` imports EVERY file in /opt/keycloak/data/import, so
      # each generated realm is mounted individually — one bind per realm rather
      # than the whole `keycloak/` directory, so a stale export left on a
      # developer's disk cannot silently become a realm in the running server.
      # Both files come from `bun run generate`; run it before the first up.
      - ./keycloak/openshapeforge-realm.json:/opt/keycloak/data/import/openshapeforge-realm.json:ro
      # The control realm: the issuer apps/admin signs platform operators in
      # against, deliberately separate from the tenant realm above.
      - ./keycloak/openshapeforge-control-realm.json:/opt/keycloak/data/import/openshapeforge-control-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000 && printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q UP'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    networks:
      - service-net

volumes:
  # Suffixed with the Postgres major version the data belongs to. A major
  # version bump needs a fresh volume — there is no in-place upgrade — so the
  # name has to change with the image, or compose silently hands the new image
  # the old layout and the container exits on start.
  platform-db-data-pg17:
  keycloak-db-data-pg18:
