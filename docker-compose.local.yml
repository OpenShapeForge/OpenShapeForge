name: openshapeforge

networks:
  service-net:
    driver: bridge

services:
  platform-db:
    image: pgvector/pgvector:pg17
    container_name: openshapeforge-platform-db
    restart: unless-stopped
    ports:
      - "5434:5432"
    environment:
      POSTGRES_DB: openshapeforge_dev
      POSTGRES_USER: openshapeforge
      POSTGRES_PASSWORD: openshapeforge
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - platform-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U openshapeforge -d openshapeforge_dev"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - service-net

  keycloak-db:
    image: postgres:17-alpine
    container_name: openshapeforge-keycloak-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: keycloak
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - keycloak-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - service-net

  keycloak:
    container_name: openshapeforge-keycloak
    restart: unless-stopped
    build:
      context: ./packages/keycloak-spi
    command: ["start-dev", "--import-realm"]
    ports:
      - "${KEYCLOAK_PORT:-8181}:8080"
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: keycloak
      KC_FEATURES: organization
      KC_HEALTH_ENABLED: "true"
      KC_HTTP_ENABLED: "true"
      KC_HTTP_PORT: "8080"
      KC_HOSTNAME: "http://localhost:${KEYCLOAK_PORT:-8181}"
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HOSTNAME_STRICT: "false"
      KC_HOSTNAME_STRICT_HTTPS: "false"
    volumes:
      - ./keycloak/openshapeforge-dev-realm.json:/opt/keycloak/data/import/openshapeforge-dev-realm.json:ro
    depends_on:
      keycloak-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'exec 3<>/dev/tcp/localhost/9000 && printf \"GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n\" >&3 && cat <&3 | grep -q UP'"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 45s
    networks:
      - service-net

volumes:
  platform-db-data:
  keycloak-db-data:
