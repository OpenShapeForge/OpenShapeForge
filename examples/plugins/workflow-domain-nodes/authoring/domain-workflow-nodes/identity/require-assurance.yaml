schemaVersion: 1
kind: workflowNode
nodeType: identity.requireAssurance
category: identity
label:
  en: Require assurance level
  nl: Vereis identificatieniveau
description:
  en: Check whether a conversation has a current sufficient identity assurance level.
  nl: Controleer of een conversatie een voldoende actueel identificatieniveau heeft.
configFields:
  - key: conversationId
    valueType: string
    semanticType: conversationId
    label:
      en: Conversation ID
      nl: Conversatie-ID
    description:
      en: Conversation whose stored identity assurance should be checked.
      nl: Conversatie waarvan de opgeslagen identity assurance moet worden gecontroleerd.
    help:
      en: When omitted, the bridge tries to inherit the conversation id from the current workflow context. That same conversation is also passed into the child identification workflow when extra assurance is needed.
      nl: Als je dit leeg laat, probeert de bridge de conversatie-id uit de huidige workflowcontext over te nemen. Diezelfde conversatie wordt ook doorgegeven aan de child-identificatieworkflow wanneer extra assurance nodig is.
    render:
      component: OptionVariablePicker
      props:
        valueMode: insertText
  - key: requiredLevel
    valueType: string
    required: true
    label:
      en: Required level
      nl: Vereist niveau
    description:
      en: Minimum assurance level that must be present and still valid.
      nl: Minimale assurance-level die aanwezig en nog geldig moet zijn.
    help:
      en: |
        The bridge compares the stored conversation assurance against this ordered scale: `contact`, `address`, `iban`,
        `verified_identity`, `manual`. If the current level is lower, the node routes to `identificatie_nodig`.
      nl: |
        De bridge vergelijkt de opgeslagen conversation-assurance met deze geordende schaal: `contact`, `address`, `iban`,
        `verified_identity`, `manual`. Als het huidige niveau lager is, routeert de node naar `identificatie_nodig`.
    defaultValue: address
    validation:
      required: true
    options:
      type: static
      items:
        - value: contact
          label: { en: Contact, nl: Contact }
        - value: address
          label: { en: Address, nl: Adres }
        - value: iban
          label: { en: IBAN, nl: IBAN }
        - value: verified_identity
          label: { en: Verified identity, nl: Geverifieerde identiteit }
        - value: manual
          label: { en: Manually confirmed, nl: Handmatig bevestigd }
    render:
      component: ReferenceSelect
      props:
        clearable: false
  - key: maxAgeMinutes
    valueType: integer
    label:
      en: Maximum age (minutes)
      nl: Maximale leeftijd (minuten)
    description:
      en: How old a successful assurance may be before it is treated as expired.
      nl: Hoe oud een succesvolle assurance mag zijn voordat die als verlopen wordt behandeld.
    help:
      en: If the assurance is older than this, missing `verifiedAt`, or already past its own `expiresAt`, the bridge triggers the identification-needed path even when the level itself would otherwise be sufficient.
      nl: Als de assurance ouder is dan dit, geen `verifiedAt` heeft, of al voorbij zijn eigen `expiresAt` is, triggert de bridge alsnog het identificatie-nodig-pad, ook als het niveau op zichzelf voldoende zou zijn.
    defaultValue: 1440
    validation:
      min: 0
    render:
      component: NumberInput
      props:
        min: 0
        step: 1
