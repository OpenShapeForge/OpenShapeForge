schemaVersion: 1
kind: workflowNode
nodeType: conversation.handover
category:
  en: Messaging
  nl: Berichten
label:
  en: Hand over to employee
  nl: Zet door naar medewerker
description:
  en: Pause AI handling and create handover context for an employee.
  nl: Pauzeer AI-afhandeling en maak overdrachtscontext voor een medewerker.
configFields:
  - key: conversationId
    valueType: string
    semanticType: conversationId
    label:
      en: Conversation ID
      nl: Conversatie-ID
    description:
      en: Existing conversation that should be handed over.
      nl: Bestaande conversatie die moet worden overgedragen.
    help:
      en: Usually this comes from the workflow context or an upstream conversation variable. The runtime does not create a
        new conversation here; it updates the existing one and fails when the ID is missing or unknown.
      nl: Meestal komt dit uit de workflowcontext of een eerdere conversatievariabele. De runtime maakt hier geen nieuwe
        conversatie aan; hij werkt de bestaande conversatie bij en faalt wanneer de ID ontbreekt of onbekend is.
    render:
      component: OptionVariablePicker
      props:
        valueMode: insertText
  - key: targetQueueId
    valueType: string
    semanticType: workQueueId
    label:
      en: Target queue
      nl: Doelqueue
    description:
      en: Work queue that receives the handed-over conversation.
      nl: Werkqueue die de overgedragen conversatie ontvangt.
    help:
      en: Select a fixed queue or insert a variable with a work queue ID. When left empty, the conversation is still paused
        for AI handling but is not assigned to a queue.
      nl: Kies een vaste queue of voeg een variabele met een werkqueue-ID in. Als dit leeg blijft, wordt AI-afhandeling nog
        steeds gepauzeerd maar wordt de conversatie niet aan een queue toegewezen.
    options:
      type: remote
      remoteUrl: /api/workflow/designer/core-entity-options?entity=work-queue
    render:
      component: OptionVariablePicker
      props:
        clearable: true
        expectedSemanticType: workQueueId
        optionSectionLabel: Queues
        variableSectionLabel: Dynamische variabelen
  - key: reasonCode
    valueType: string
    label:
      en: Reason code
      nl: Reden (code)
    description:
      en: Stable handover reason used in read models, events, and summary metadata.
      nl: Stabiele overdrachtsreden voor read models, events en samenvattingsmetadata.
    help:
      en: Use a machine-readable code such as identity_required or repair_unclear. The code is required and is also used as
        fallback text when no reason message is provided.
      nl: Gebruik een machineleesbare code zoals identity_required of repair_unclear. De code is verplicht en wordt ook als
        fallbacktekst gebruikt als er geen redenbericht is ingevuld.
    validation:
      required: true
    render:
      component: Input
  - key: reasonMessage
    valueType: string
    semanticType: variableTemplate
    label:
      en: Reason message
      nl: Reden-bericht
    description:
      en: Human-readable explanation shown in the handover summary.
      nl: Leesbare toelichting die in de overdrachtssamenvatting komt.
    help:
      en: This can include workflow variables. The text helps the employee understand why AI stopped and what happened so
        far; it is not sent as a customer reply.
      nl: Dit veld mag workflowvariabelen bevatten. De tekst helpt de medewerker begrijpen waarom AI stopt en wat er al is
        gebeurd; hij wordt niet als klantantwoord verzonden.
    validation:
      required: true
    render:
      component: VariableTemplateInput
      props:
        rows: 5
  - key: proposedReplyTemplateSlug
    valueType: string
    semanticType: templateSlug
    label:
      en: Proposed reply template
      nl: Template voor voorgesteld antwoord
    description:
      en: Template slug used to create an internal proposed reply for the employee.
      nl: Template-slug waarmee een intern voorgesteld antwoord voor de medewerker wordt gemaakt.
    help:
      en: The runtime stores a proposed-reply message when this template is set. It is review context for the employee, not
        an automatically sent provider message.
      nl: De runtime bewaart een voorgesteld-antwoordbericht wanneer deze template is ingesteld. Dit is reviewcontext voor
        de medewerker, geen automatisch verzonden providerbericht.
    validation:
      required: true
    options:
      type: remote
      remoteUrl: /api/templates/options
    render:
      component: OptionVariablePicker
      props:
        hideVariables: true
        expectedSemanticType: templateSlug
        optionSectionLabel: Templates
        variableSectionLabel: Dynamische variabelen
  - key: proposedReplyBindings
    valueType: object
    variables: whole
    label:
      en: Parameter bindings
      nl: Parameter bindings
    description:
      en: Values used to render the proposed reply template.
      nl: Waarden waarmee de voorgesteld-antwoordtemplate wordt gevuld.
    help:
      en: Bind template parameters to fixed values or workflow variables. These bindings are stored with the proposed reply
        so the employee can review the drafted content.
      nl: Koppel templateparameters aan vaste waarden of workflowvariabelen. Deze bindings worden bij het voorgestelde
        antwoord opgeslagen zodat de medewerker de conceptinhoud kan beoordelen.
    defaultValue: {}
    render:
      component: NotificationTemplateVariablesEditor
  - key: suggestedWorkflows
    valueType: object
    cardinality:
      min: 0
      max: "unbounded"
    variables: whole
    label:
      en: Suggested workflows
      nl: Voorgestelde workflows
    description:
      en: Optional workflow suggestions stored with the handover proposal.
      nl: Optionele workflowvoorstellen die bij de overdracht worden opgeslagen.
    help:
      en: Use this for router output or another upstream value that suggests next workflows to the employee. The node stores
        the suggestion data; it does not start those workflows itself.
      nl: Gebruik dit voor router-output of een andere eerdere waarde die vervolgworkflows aan de medewerker voorstelt. De
        node slaat de voorstellen op; hij start die workflows niet zelf.
    render:
      component: OptionVariablePicker
      props:
        clearable: true
        valueMode: insertText
        variableSectionLabel: Dynamische variabelen
        placeholder: Kies router-output
    item:
      key: suggestedWorkflow
      valueType: object
      description:
        en: One suggested follow-up workflow entry.
        nl: Een voorgestelde vervolgworkflow.
      help:
        en: Keep the object shape aligned with the upstream router or suggestion node that produced it.
        nl: Houd de objectstructuur gelijk aan de eerdere router- of suggestienode die deze waarde heeft gemaakt.
      children:
        - key: workflowDefinitionId
          valueType: string
          semanticType: workflowDefinitionId
          label:
            en: Workflow definition ID
            nl: Workflowdefinitie-ID
          description:
            en: Definition ID of the suggested published workflow.
            nl: Definitie-ID van de voorgestelde gepubliceerde workflow.
          help:
            en: Use the published workflow definition ID here when the handover suggestion should point to one concrete workflow without name-based lookup.
            nl: Gebruik hier de definitie-ID van de gepubliceerde workflow wanneer het overdrachtsvoorstel naar een concrete workflow moet wijzen zonder naamgebaseerde lookup.
        - key: workflowDefinitionName
          valueType: string
          label:
            en: Workflow name
            nl: Workflownaam
          description:
            en: Human-readable name of the suggested workflow.
            nl: Leesbare naam van de voorgestelde workflow.
          help:
            en: This is display metadata for the employee handover and helps show which workflow is being suggested.
            nl: Dit is weergavemetadata voor de medewerkersoverdracht en helpt te tonen welke workflow wordt voorgesteld.
        - key: publishedVersion
          valueType: integer
          label:
            en: Published version
            nl: Gepubliceerde versie
          description:
            en: Published version number of the suggested workflow.
            nl: Gepubliceerd versienummer van de voorgestelde workflow.
          help:
            en: Keep this aligned with the referenced definition so employees or downstream tooling can see the exact published version behind the suggestion.
            nl: Houd dit gelijk aan de verwezen definitie zodat medewerkers of downstream tooling de exacte gepubliceerde versie achter het voorstel kunnen zien.
        - key: label
          valueType: string
          label:
            en: Label
            nl: Label
          description:
            en: Short display label for this suggested workflow.
            nl: Kort weergavelabel voor deze voorgestelde workflow.
          help:
            en: Use a concise title that reads well in an employee handover list.
            nl: Gebruik een korte titel die prettig leest in een medewerkersoverdrachtslijst.
        - key: confidence
          valueType: number
          label:
            en: Confidence
            nl: Zekerheid
          description:
            en: Confidence score attached to this workflow suggestion.
            nl: Zekerheidsscore die aan dit workflowvoorstel hangt.
          help:
            en: Upstream routing logic can use this to indicate how strongly it recommends the workflow. The handover node stores the score but does not interpret it.
            nl: Eerdere routinglogica kan dit gebruiken om aan te geven hoe sterk de workflow wordt aanbevolen. De handover-node slaat de score op maar interpreteert hem niet.
        - key: reason
          valueType: string
          label:
            en: Reason
            nl: Reden
          description:
            en: Explanation for why this workflow was suggested.
            nl: Uitleg waarom deze workflow is voorgesteld.
          help:
            en: Use this to carry the short rationale from the router or suggestion logic into the employee handover.
            nl: Gebruik dit om de korte motivatie uit de router- of suggestielogica mee te geven in de medewerkersoverdracht.
        - key: rank
          valueType: integer
          label:
            en: Rank
            nl: Rang
          description:
            en: Relative ordering of this workflow suggestion.
            nl: Relatieve volgorde van dit workflowvoorstel.
          help:
            en: Upstream suggestion logic can use this to mark preference order. The handover node only stores and forwards the rank.
            nl: Eerdere suggestielogica kan dit gebruiken om de voorkeursvolgorde aan te geven. De handover-node slaat de rang alleen op en geeft die door.
  - key: customerSenderType
    valueType: string
    defaultValue: ai
    label:
      en: Customer sender type
      nl: Klantbericht-afzender
    description:
      en: Sender type used for customer-facing handover artifacts.
      nl: Afzendertype voor klantgerichte overdrachtsartefacten.
    help:
      en: The current runtime treats system here as a system sender; other values fall back to AI. Keep the default unless a
        system-authored handover message is intentionally needed.
      nl: De huidige runtime behandelt system hier als systeemafzender; andere waarden vallen terug op AI. Laat de standaard
        staan tenzij bewust een systeemgeschreven overdrachtsbericht nodig is.
  - key: summaryMode
    valueType: string
    defaultValue: ai
    label:
      en: Summary mode
      nl: Samenvattingsmodus
    description:
      en: Determines whether the deterministic handover summary may be refined by AI.
      nl: Bepaalt of de deterministische overdrachtssamenvatting door AI mag worden verfijnd.
    help:
      en: With ai, the runtime first stores a deterministic summary and may enqueue an AI refinement after commit when the
        worker contract is enabled. The deterministic summary remains when refinement is unavailable.
      nl: Met ai bewaart de runtime eerst een deterministische samenvatting en kan daarna een AI-verfijning enqueuen als het
        workercontract actief is. De deterministische samenvatting blijft staan als verfijning niet beschikbaar is.
  - key: summarySenderType
    valueType: string
    defaultValue: ai
    label:
      en: Summary sender type
      nl: Samenvatting-afzender
    description:
      en: Sender type used for the internal handover summary message.
      nl: Afzendertype voor het interne overdrachtssamenvattingsbericht.
    help:
      en: Use system only for summaries that should be clearly system-authored. Otherwise the runtime records the summary as
        AI-authored context.
      nl: Gebruik system alleen voor samenvattingen die duidelijk door het systeem geschreven moeten zijn. Anders registreert
        de runtime de samenvatting als AI-context.
  - key: relatedCaseEntityId
    valueType: string
    semanticType: caseId
    label:
      en: Related case ID
      nl: Gerelateerde zaak-ID
    description:
      en: Case to link to the handed-over conversation.
      nl: Zaak die aan de overgedragen conversatie wordt gekoppeld.
    help:
      en: Provide a valid case UUID when the handover belongs to a case. Invalid or empty values are ignored for case-link
        creation instead of being coerced.
      nl: Geef een geldige zaak-UUID op wanneer de overdracht bij een zaak hoort. Ongeldige of lege waarden worden genegeerd
        voor het maken van de zaaklink en niet omgezet.
  - key: collectedValues
    valueType: object
    defaultValue: {}
    label:
      en: Collected values
      nl: Verzamelde waarden
    description:
      en: Structured values already collected by the workflow.
      nl: Gestructureerde waarden die de workflow al heeft verzameld.
    help:
      en: These values are included in handover summary context so the employee can see known answers or extracted fields.
        They are not independently validated by this node.
      nl: Deze waarden gaan mee in de overdrachtssamenvatting zodat de medewerker bekende antwoorden of geëxtraheerde velden
        ziet. Deze node valideert ze niet afzonderlijk.
  - key: sourceWorkflowInstanceId
    valueType: string
    label:
      en: Source workflow instance ID
      nl: Bron-workflowinstance-ID
    description:
      en: Workflow instance to record as the source of the proposed reply.
      nl: Workflowinstance die als bron van het voorgestelde antwoord wordt vastgelegd.
    help:
      en: Leave empty to use the current workflow instance. Set this only when the handover proposal should point back to a
        different originating instance.
      nl: Laat leeg om de huidige workflowinstance te gebruiken. Vul dit alleen in wanneer het overdrachtsvoorstel naar een
        andere broninstance moet verwijzen.
