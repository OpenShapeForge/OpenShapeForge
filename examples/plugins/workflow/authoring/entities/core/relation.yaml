# Plugin overlay patch: opts Relation into entity workflow-node
# generation. It adds the `workflow:` block that the base entity does not
# carry on its own and demonstrates
# plugin + authoring-layer + entityPatch composition: the workflow plugin's
# authoring/ directory is appended as a layer automatically, and this patch
# strategically merges into the base entities/core/relation.yaml by slug.
kind: entityPatch
workflow:
  nodes:
    actions:
      create: true
      getOne: true
      list: true
      update: true
      delete: true
