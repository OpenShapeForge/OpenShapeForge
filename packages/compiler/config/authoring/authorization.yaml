      - name: tenant-acme
        subGroups:
          - name: role-directie
          - name: role-vastgoedbeheer
          - name: role-wijkbeheer
          - name: role-verhuur
          - name: role-zonder-app-toegang
      - name: tenant-beta
        subGroups:
