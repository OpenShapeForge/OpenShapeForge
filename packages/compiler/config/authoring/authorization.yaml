schemaVersion: 2
kind: authorizationConfig

# Keycloak realm-export.json is generated from this file. One file authors:
# - realm settings (sslRequired, token lifespans, etc.)
# - realm roles (composite, including per-client mappings)
# - clients (just names + bearerOnly flag; all other client shape is a hardcoded
#   generator default — see generators/keycloak.ts)
# - groups (optional hierarchy; user membership via `users[].groups` paths)
# - users (dev test accounts; plain passwords OK in dev)
#
# Entity-derived client roles (natural-person:read, etc.) are STILL appended on
# top of the entityRoleClient by the generator, based on entity YAML auth blocks.

realm:
  name: openshapeforge
  displayName: OpenShapeForge
  enabled: true
  sslRequired: none
  registrationAllowed: false
  loginWithEmailAllowed: true
  duplicateEmailsAllowed: false
  resetPasswordAllowed: false
  editUsernameAllowed: false
  bruteForceProtected: false
  organizationsEnabled: true
  accessTokenLifespan: 900
  ssoSessionIdleTimeout: 28800
  ssoSessionMaxLifespan: 86400

  events:
    enabled: true
    adminEnabled: true
    listeners:
      - jboss-logging

keycloak:
  # The client that receives entity-derived roles (natural-person:read, etc.)
  # generated from entity YAML authorization blocks.
  entityRoleClient: erp-provider

  # Clients to create in the realm. Each is either:
  #   gateway        — interactive login client (redirectUris, protocolMappers)
  #   bearerOnly     — resource server that only validates tokens
  #   serviceAccount — client credentials flow only
  # Protocol mappers and non-security defaults come from the generator.
  # SECURITY: gateway redirectUris/webOrigins are an explicit allow-list here —
  # never "*" (the generator refuses wildcards and standard-flow gateways with
  # no concrete redirectUris). Secrets use `devSecret` (dev-only literal, valid
  # only on this dev realm) or a `${env:VAR}` reference resolved at generate
  # time; a non-dev realm carrying a literal/dev secret fails generation.
  clients:
    - id: openshapeforge-gateway
      kind: gateway
      name: OpenShapeForge API Gateway
      # Dev-only credential — never reuse outside local development. A real
      # deployment authors its own gateway with a `${env:...}` secret.
      devSecret: dev-secret
      secret: ${env:KEYCLOAK_CLIENT_SECRET_OPENSHAPEFORGE_GATEWAY}
      # Concrete local-dev redirect URIs / CORS origins for the docker-compose
      # stack (API :3001, Keycloak account console :8181, and a dev SPA on
      # :3000). A non-dev realm must supply its own real hostnames here.
      redirectUris:
        - http://localhost:3000/*
        - http://localhost:3001/*
        - http://localhost:8181/realms/openshapeforge/account/*
      webOrigins:
        - http://localhost:3000
        - http://localhost:3001
        - http://localhost:8181

    - id: erp-provider
      kind: bearerOnly
      name: ERP Provider — entity scopes
      devSecret: erp-provider-secret
      secret: ${env:KEYCLOAK_CLIENT_SECRET_ERP_PROVIDER}

    - id: openshapeforge-support
      kind: bearerOnly

    - id: openshapeforge-audit
      kind: bearerOnly

    - id: openshapeforge-timeline
      kind: bearerOnly
      name: OpenShapeForge Timeline Service
      devSecret: openshapeforge-timeline-secret
      secret: ${env:KEYCLOAK_CLIENT_SECRET_OPENSHAPEFORGE_TIMELINE}

    - id: openshapeforge-knowledge-base
      kind: bearerOnly
      name: OpenShapeForge Knowledge Base

    - id: seed-service
      kind: serviceAccount
      name: Seed Service Account
      devSecret: seed-service-secret
      secret: ${env:KEYCLOAK_CLIENT_SECRET_SEED_SERVICE}

    - id: openshapeforge-messaging
      kind: bearerOnly

    - id: openshapeforge-realtime
      kind: bearerOnly

    - id: openshapeforge-auth-api
      kind: serviceAccount
      name: OpenShapeForge Auth API Service
      devSecret: openshapeforge-auth-api-secret
      secret: ${env:KEYCLOAK_CLIENT_SECRET_OPENSHAPEFORGE_AUTH_API}
      # The identity-configuration SPI (OpenShapeForgeResource) manages realm
      # organizations, groups, roles, and user role mappings, and its admin
      # endpoints require the caller to hold realm-management `manage-realm`
      # (Keycloak's realm-admin capability). Grant that role to this service
      # account so its client-credentials token passes the SPI's authorization
      # check instead of being rejected with 403.
      serviceAccountClientRoles:
        realm-management:
          - manage-realm

# Realm-level roles. `composites` is an explicit per-client role list;
# `includes` is a wildcard-expansion pattern over entity-derived composite roles
# (e.g. "*:full" expands to natural-person:full + relation:full + …).
#
# Cross-tenant platform admin (formerly `system-admin`) is granted via Keycloak's
# built-in `realm-management.realm-admin` client role — assigned per user under
# `users[].clientRoles` below.
realmRoles:
  directie:
    description: "Directie: global read/write/approve on all resources"
    composites:
      erp-provider:
        - General.All.ReadWrite
        - CaseFile.All.ReadWrite
        - Energy.All.ReadWrite
        - Finance.All.ReadWrite
        - Quality.All.ReadWrite
        - Maintenance.All.ReadWrite
        - Organization.All.ReadWrite
        - Agreements.All.ReadWrite
        - ProjectDevelopment.All.ReadWrite
        - Relations.All.ReadWrite
        - RealEstate.All.ReadWrite
        - HousingAllocation.All.ReadWrite
        - Cases.All.ReadWrite
        - Relations.Bsn.Read
      openshapeforge-support:
        - Support.Issues.All
      openshapeforge-audit:
        - Audit.Logs.All
        - Audit.Settings.Manage
      openshapeforge-timeline:
        - Timeline.Events.ReadAll
        - Timeline.All
      openshapeforge-knowledge-base:
        - KnowledgeBase.All
      openshapeforge-auth-api:
        - Organization.Employees.ReadWrite
        - Organization.EmployeeRoles.ReadWrite
        - Organization.Positions.ReadWrite
        - Relations.RelationGroups.ReadWrite
      openshapeforge-messaging:
        - Messaging.OptIn.Read
        - Messaging.OptIn.Write
        - Messaging.Send
        - Messaging.Read
        - Messaging.Admin
        - Messaging.Conversation.ReadAll
        - Messaging.Conversation.ViewQueue
        - Messaging.Conversation.Assign
        - Messaging.Conversation.Reassign

  vastgoedbeheerder:
    description: "Vastgoedbeheer: full access to the real estate module"
    composites:
      erp-provider:
        - RealEstate.All.ReadWrite
        - General.All.Read
        - Relations.All.Read
        - Maintenance.All.ReadWrite
        - Energy.All.ReadWrite
        - Quality.All.ReadWrite
        - Cases.All.ReadWrite
      openshapeforge-support:
        - Support.Issues.ReadAll
        - Support.Issues.Comment
        - Support.Issues.Manage
      openshapeforge-audit:
        - Audit.Logs.ReadAll
      openshapeforge-timeline:
