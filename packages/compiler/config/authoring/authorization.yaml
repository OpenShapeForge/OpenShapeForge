      openshapeforge-knowledge-base:
        - KnowledgeBase.Articles.Read
      openshapeforge-messaging:
        - Messaging.OptIn.Read
        - Messaging.Read
        - Messaging.Conversation.ViewQueue

  wijkbeheerder:
    description: "Wijkbeheer: read/write access to area units and read access to agreements"
    composites:
      erp-provider:
