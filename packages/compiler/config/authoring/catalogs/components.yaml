schemaVersion: 1
kind: componentCatalog

# The component catalog has two parts.
#
# The field part is the Battery design system's field components, under
# Figma's names and with Figma's properties. Those are not written here: the
# compiler reads them from config/design-system/figma-fields.json, which
# packages/compiler/scripts/figma-fields.ts generates from the design system's
# Figma manifest. `fields` below adds what Figma does not have per component:
# its texts (under the design system's slot names) and its behaviour and data
# settings. Figma's `state` is never authored; the renderer derives it.
#
# The hand-written part is `components`: view, relationship and custom
# components, the OSF editors that are no Figma field, and the names the
# compiler produces itself. A plugin declares the names it owns in its own
# catalogs/components.yaml with `kind: extension`.

# ── Default component per field type ──
# Used when a field does not specify a `render.component`. A default whose
# value may be absent offers `required`: the component for a field that must
# have a value.
defaults:
  string:
    label:
      nl: Tekst
      en: Text
    component: FieldSingleLine
  integer:
    label:
      nl: Geheel getal
      en: Integer
    component: FieldIntegerDecimal
  number:
    label:
      nl: Getal
      en: Number
    component: FieldIntegerDecimal
  boolean:
    label:
      nl: Ja/nee
      en: Yes/no
    component: FieldNullableBoolean
    props: { trueText: { en: Yes, nl: Ja }, falseText: { en: No, nl: Nee }, nullText: { en: Not set, nl: Onbekend } }
    required:
      component: FieldBoolean
      props: { trueText: { en: Yes, nl: Ja }, falseText: { en: No, nl: Nee } }
  object:
    label:
      nl: JSON-object
      en: JSON object
    component: FieldCodeStructuredJson
  collection:
    label:
      nl: JSON-lijst
      en: JSON array
    component: FieldCodeStructuredJson
  date:
    label:
      nl: Datum
      en: Date
    component: FieldDate
  datetime:
    label:
      nl: Datum en tijd
      en: Date and time
    component: FieldDateAndTime
    props: { showTimezoneSelector: false }

# ── Default component per view element ──
# Used when a view does not specify a `render.component` for that element.
viewDefaults:
  page:
    component: PageShell
  header:
    component: PageHeader
  list:
    component: DataTable
  search:
    component: SearchInput
  filterBar:
    component: FilterBar
  tabs:
    component: TabBar
  section:
    component: SectionCard
  form:
    component: FormSection
  badges:
    component: BadgeList
  submitButton:
    component: SubmitButton
  relationshipTab:
    component: RelationshipPanel

# ── Non-Figma settings of the design system's fields ──
# `fieldTexts` are texts every field takes. Per field, `texts` are its own
# texts and `props` its behaviour and data settings; the Figma properties
# (layout, labelWidth and the component's own) come from figma-fields.json.
fieldTexts: [empty]
fields:
  FieldAddress: { texts: [labels], props: [countryPresets, showRegion] }
  FieldBankAccountStructuredId: { texts: [labels] }
  FieldBoolean: { texts: [trueText, falseText] }
  FieldChildRecordsLineItems: { texts: [add, remove, edit] }
  FieldCodeStructuredJson: { texts: [labels], props: [schemaName, rows] }
  FieldColorIcon: { texts: [labels], props: [colors, icons] }
  FieldCommercialAmount: { texts: [labels], props: [cadenceOptions] }
  FieldComputedValue: { texts: [overrideLabel, loading], props: [details] }
  FieldDate: { props: [minDate, maxDate] }
  FieldDateAndTime: { texts: [dateLabel, timeLabel, timezoneLabel], props: [timezone, timezones] }
  FieldDateRange: { texts: [startLabel, endLabel, optionalText, fromText, untilText], props: [openEnd] }
  FieldDuration: { props: [unit] }
  FieldEmail: { texts: [placeholder], props: [emailAction, requirementPlacement] }
  FieldFileAttachment:
    texts: [uploadTitle, uploadDescription, chooseLabel, add, replaceLabel, remove, downloadLabel, previewLabel, imagePreviewLabel, uploadingText, retry]
    props: [accept, showReplace, maxFiles]
  FieldFormula: { texts: [evaluateLabel, suggestionsLabel, emptySuggestionsLabel], props: [showSuggestionsButton, suggestions] }
  FieldHierarchicalRelation: { texts: [placeholder, clear, noResults, retry, loading] }
  FieldIdentifierCode: { texts: [placeholder], props: [prefix] }
  FieldImage:
    texts: [uploadTitle, uploadDescription, chooseLabel, add, replaceLabel, remove, downloadLabel, previewLabel, imagePreviewLabel, uploadingText, retry]
    props: [accept, showReplace]
  FieldIntegerDecimal: { props: [unit, inputMode, min, max, currency, decimalPlaces, scale] }
  FieldKeyValuePairs: { texts: [labels] }
  FieldLocalizedText: { texts: [localeLabel, fallbackLabel, availabilityText], props: [locales, fallbackLocale] }
  FieldLocationCoordinates: { texts: [labels, mapLabel], props: [coordinateContext] }
  FieldMarkdown: { texts: [variableListLabel, variableEmptyMessage] }
  FieldMeasurement: { texts: [unitLabel], props: [unit, unitOptions, inputMode] }
  FieldMoney: { props: [currency, minorUnitPrecision, decimalPlaces, scale] }
  FieldMultiline: { texts: [placeholder], props: [rows, maxLength] }
  FieldMultipleChoice: {}
  FieldMultipleRelatedRecords: { texts: [placeholder, clear, noResults, retry, loading], props: [referentieGroep, clearable, searchable] }
  FieldNullableBoolean: { texts: [trueText, falseText, nullText] }
  FieldNumericRange: { texts: [minLabel, maxLabel] }
  FieldPercentage: { props: [unit, decimalPlaces] }
  FieldPeriod: { texts: [typeLabel, periodLabel, kindLabels], props: [defaultKind] }
  FieldPersonName: { texts: [labels], props: [allowSingleName] }
  FieldPhone: { props: [country, countries] }
  FieldRatingBoundedScale: { props: [min, max, step, readDisplay, emptyDisplay] }
  FieldRecurrence: { texts: [labels], props: [showEndCondition] }
  FieldRepeatedFieldGroup: { texts: [add, remove, moveUpLabel] }
  FieldSecret: { texts: [masked, placeholder] }
  FieldSignature:
    texts: [downloadLabel, signedByLabel, evidenceLabel, immutableLabel, signerLabel, requestLabel, clear, pendingLabel, signedLabel, expiredLabel, declinedLabel, uploadTitle, uploadDescription, uploadHint, chooseLabel, retry]
  FieldSingleChoice: {}
  FieldSingleLine: { texts: [placeholder], props: [requirementPlacement, maxLength] }
  FieldSingleRelatedRecord: { texts: [placeholder, clear, noResults, retry, loading], props: [referentieGroep, clearable, searchable] }
  FieldStatus: { props: [presentation] }
  FieldSystemMetadata: { texts: [loading, retry, propertyLabel, valueLabel] }
  FieldTime: { props: [precision] }
  FieldTimezone: { texts: [placeholder, noResults], props: [timezones] }
  FieldUrl: { texts: [placeholder] }

# ── Hand-written components ──
components:

  # ── View-level components ──

  PageShell:
    kind: view
    description: Root wrapper for a page. Renders title and children.
    props:
      - title

  PageHeader:
    kind: view
    description: Entity header with title template, subtitle, and badges.
    props:
      - titleTemplate
      - subtitleTemplate
      - badges
      - data

  DataTable:
    kind: view
    description: Sortable data table with columns, row click, and pagination.
    props:
      - columns
      - rows
      - onRowClick
      - defaultSort
      - loading

  SearchInput:
    kind: view
    description: Search input field.
    props:
      - value
      - onChange
      - placeholder

  FilterBar:
    kind: view
    description: Row of filter controls.
    props:
      - filters
      - values
      - onChange

  TabBar:
    kind: view
    description: Tab navigation wrapper with tab content.
    props:
      - tabs
      - activeTab
      - onTabChange
      - children

  SectionCard:
    kind: view
    description: Card with title and field list.
    props:
      - title
      - children

  FormSection:
    kind: view
    description: Fieldset wrapper for a group of form fields.
    props:
      - title
      - children

  BadgeList:
    kind: view
    description: Horizontal list of badges.
    props:
      - layout
      - items

  SubmitButton:
    kind: view
    description: Form submit button.
    props:
      - label

  RelationshipPanel:
    kind: relationship
    description: Panel showing related entities.
    props:
      - relationship
      - parentId
      - emptyLabel

  # ── Custom view components ──

  WoonsituatiePanel:
    kind: custom
    description: Custom panel showing living situation details for a person.
    props:
      - parentId

  InkomensOverzicht:
    kind: custom
    description: Custom income overview panel with totals.
    props:
      - parentId

  NaturalPersonInboxBaseline:
    kind: custom
    description: Mock natural-person workspace baseline using the inbox layout and relations datascreen.
    props: []

  # ── Field components that are no design-system field ──
  # OSF editors and composites, and the names the compiler produces itself.
  # Each one is drawn inside the design system's field frame, so it takes the
  # frame's Figma properties (layout, labelWidth) like a design-system field.

  EntityReferenceSelect:
    kind: field
    description: Picks a record of the referenced entity. The compiler gives it to a field whose type is an entity identity.
    props: [layout, labelWidth]

  EntityReferenceDisplay:
    kind: field
    description: Shows the referenced record. The compiler gives it to a read-only field whose type is an entity identity.
    props: [layout, labelWidth]

  ChoiceTiles:
    kind: field
    description: Static options shown as tiles. The compiler gives it to a field whose static options ask for tiles.
    props: [layout, labelWidth]

  IconPicker:
    kind: field
    description: Searchable icon selection with artwork loaded on demand.
    props: [layout, labelWidth]

  ColorPicker:
    kind: field
    description: Color picker for a hex color value.
    props: [layout, labelWidth]

  ColorDisplay:
    kind: field
    description: Read-only color swatch with the hex value available on hover.
    props: [layout, labelWidth]

  ImagePicker:
    kind: field
    description: Chooses an uploaded image of the record's template or document.
    props: [layout, labelWidth]

  ImageDisplay:
    kind: field
    description: Shows an uploaded image of the record's template or document.
    props: [layout, labelWidth]

  FileUpload:
    kind: field
    description: File upload with drag and drop.
    props: [layout, labelWidth, accept, maxSizeMb, multiple, fileNameField, mimeTypeField, checksumField]

  ListSelect:
    kind: field
    description: Selection from the field's own list of values.
    props: [layout, labelWidth]

  OptionVariablePicker:
    kind: field
    description: Selection of a record or a process variable that holds one.
    props: [layout, labelWidth, valueMode, clearable]

  VariableTemplateInput:
    kind: field
    description: Text with variable references.
    props: [layout, labelWidth]

  JsonEditor:
    kind: field
    description: Editor for a JSON value.
    props: [layout, labelWidth]

  MapPicker:
    kind: field
    description: Map-based location picker for addresses and coordinates.
    props: [layout, labelWidth, defaultZoom, defaultCenter, geocodeProvider]

  FieldDefinitionEditor:
    kind: field
    description: Structured editor for single field definitions and field-definition lists.
    props: [layout, labelWidth]

  FieldDefinitionView:
    kind: field
    description: Read-only display for single field definitions and field-definition lists.
    props: [layout, labelWidth]

  TemplateValues:
    kind: field
    description: A record's local values under the labels its linked template version declares, each shown by its own
      type. Reads the definitions from the version the record links (versionField on versionEntity) and the field of
      that version's template that declares them (definitionsField).
    props: [layout, labelWidth, versionField, versionEntity, definitionsField]

  ConditionBuilder:
    kind: field
    description: Structured builder for canonical conditions and condition groups.
    props: [layout, labelWidth, mode, leftSourceField, defaultPath]
