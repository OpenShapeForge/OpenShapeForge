schemaVersion: 1
kind: osfTypeCatalog

# Core semantic types — always available
types:
  # A selected entity definition supplies the shape. Its relationship fields
  # are stored relationally, never embedded in this object's JSON values.
  entityValue:
    kind: object
    label: { en: Typed entity values, nl: Getypeerde entiteitswaarden }
    valueType: object

  # Entity type identity, distinct from an individual record ID.
  entityTypeName:
    options: { type: dynamic, source: entityTypes.list }
    label: { en: Entity type, nl: Entiteitstype }
    valueType: string
    validation:
      minLength: 1
      maxLength: 120

  badgeVariant:
    label: { en: Badge variant, nl: Badgevariant }
    valueType: string
    options:
      type: static
      items:
        - value: default
          label:
            en: Default
            nl: Standaard
        - value: secondary
          label:
            en: Secondary
            nl: Secundair
        - value: destructive
          label:
            en: Destructive
            nl: Destructief
        - value: outline
          label:
            en: Outline
            nl: Omlijning
    render:
      display: TextDisplay
      input: ListSelect

  labelOutputType:
    label: { en: Label output type, nl: Labeluitvoertype }
    valueType: string
    options:
      type: static
      items:
        - value: boolean
          label:
            en: Yes/no
            nl: Ja/nee
        - value: number
          label:
            en: Number
            nl: Getal
        - value: string
          label:
            en: String
            nl: Tekst
    render:
      display: TextDisplay
      input: ListSelect

  labelValidity:
    label: { en: Label validity, nl: Labelgeldigheid }
    valueType: string
    options:
      type: static
      items:
        - value: permanent
          label:
            en: Permanent
            nl: Permanent
        - value: temporary
          label:
            en: Temporary
            nl: Tijdelijk
        - value: conditional
          label:
            en: Conditional
            nl: Voorwaardelijk
    render:
      display: TextDisplay
      input: ListSelect

  multilineText:
    label: { en: Multiline text, nl: Meerregelige tekst }
    valueType: string
    render:
      display: TextDisplay
      input: Textarea
    props:
      rows: 4

  email:
    label: { en: Email, nl: E-mail }
    valueType: string
    icon: AtSign
    validation:
      pattern: "^[^@]+@[^@]+\\.[^@]+$"
      maxLength: 254
    render:
      display: TextDisplay
      input: Input
    classification:
      sensitivity: pii
      category: contactgegevens
    audit: true

  phone:
    label: { en: Phone number, nl: Telefoonnummer }
    valueType: string
    icon: Phone
    validation:
      pattern: "^\\+?[0-9\\s\\-()]{7,20}$"
    render:
      display: TextDisplay
      input: Input
    classification:
      sensitivity: pii
      category: contactgegevens

  iban:
    label: { en: IBAN, nl: IBAN }
    valueType: string
    icon: CreditCard
    validation:
      pattern: "^[A-Z]{2}[0-9]{2}[A-Z0-9]{4,30}$"
      minLength: 15
      maxLength: 34
    render:
      display: TextDisplay
      input: Input
    classification:
      sensitivity: confidential
      category: financieel
    retention:
      mode: inline
      scope: field
      duration: P7Y
      disposition:
        action: anonymize
      reason: { en: "Financial data must be retained for 7 years (Dutch tax law)", nl: "Financiële gegevens moeten 7 jaar bewaard worden (fiscale bewaarplicht)" }
    audit: true

  url:
    label: { en: URL, nl: URL }
    valueType: string
    icon: Link
    validation:
      pattern: "^https?://"
      maxLength: 2000
    render:
      display: TextDisplay
      input: Input

  webUrl:
    label: { en: Web URL, nl: Web-URL }
    valueType: string
    icon: Globe
    validation:
      pattern: "^https?://"
      maxLength: 2000
    render:
      display: TextDisplay
      input: Input

  mailtoLink:
    label: { en: Email link, nl: E-maillink }
    valueType: string
    icon: Mail
    validation:
      pattern: "^mailto:[^\\s@]+@[^\\s@]+\\.[^\\s@]+(?:\\?.*)?$"
      maxLength: 2000
    render:
      display: TextDisplay
      input: Input
    classification:
      sensitivity: pii
      category: contactgegevens

  phoneLink:
    label: { en: Phone link, nl: Telefoonlink }
    valueType: string
    icon: PhoneCall
    validation:
      pattern: "^tel:\\+?[0-9][0-9\\s\\-().]{5,30}$"
      maxLength: 200
    render:
      display: TextDisplay
      input: Input
    classification:
      sensitivity: pii
      category: contactgegevens

  smsLink:
    label: { en: SMS link, nl: SMS-link }
    valueType: string
    icon: MessageCircle
    validation:
      pattern: "^sms:\\+?[0-9][0-9\\s\\-().]{5,30}(?:\\?.*)?$"
      maxLength: 500
    render:
      display: TextDisplay
      input: Input
    classification:
      sensitivity: pii
      category: contactgegevens

  whatsappLink:
    label: { en: WhatsApp link, nl: WhatsApp-link }
    valueType: string
    icon: MessageCircle
    validation:
      pattern: "^(?:https://wa\\.me/\\+?[0-9]{7,15}(?:\\?.*)?|https://api\\.whatsapp\\.com/send\\?phone=\\+?[0-9]{7,15}(?:&.*)?|whatsapp://send\\?phone=\\+?[0-9]{7,15}(?:&.*)?)$"
      maxLength: 2000
    render:
      display: TextDisplay
      input: Input
    classification:
      sensitivity: pii
      category: contactgegevens

  deeplink:
    label: { en: Deeplink, nl: Deeplink }
    valueType: string
    icon: Link
    validation:
      pattern: "^(?:https?|mailto|tel|sms|whatsapp|openshapeforge|geo|maps):"
      maxLength: 2000
    render:
      display: TextDisplay
      input: Input

  conversationId:
    label: { en: Conversation ID, nl: Conversatie-ID }
    valueType: string
    icon: MessageSquare
    lookup:
      provider: messaging.conversations
      remoteUrl: /api/runtime/lookups?osfType=conversationId
      searchParam: search
    render:
      display: TextDisplay
      input: Input

  identityAssuranceLevel:
    label: { en: Identity assurance level, nl: Identificatieniveau }
    pluralLabel: { en: Identity assurance levels, nl: Identificatieniveaus }
    valueType: string
    icon: ShieldCheck
    render:
      display: TextDisplay
      input: ReferenceSelect
    props:
      clearable: false
    options:
      type: static
      items:
        - { value: none, label: { en: None, nl: Geen } }
        - { value: contact, label: { en: Contact, nl: Contact } }
        - { value: address, label: { en: Address, nl: Adres } }
        - { value: iban, label: { en: IBAN, nl: IBAN } }
        - { value: verified_identity, label: { en: Verified identity, nl: Geverifieerde identiteit } }
        - { value: manual, label: { en: Manually confirmed, nl: Handmatig bevestigd } }

  referenceDataCode:
    label: { en: Reference value, nl: Referentiewaarde }
    valueType: string
    icon: List
    render:
      display: TextDisplay
      input: ReferenceSelect
    props:
      clearable: false

  fileStorageLocation:
    label: { en: File, nl: Bestand }
    valueType: string
    icon: File
    render:
      display: TextDisplay
      input: FileUpload
    props:
      fileNameField: fileName
      mimeTypeField: mimeType
      checksumField: checksum

  workflowDefinitionId:
    label: { en: Workflow definition ID, nl: Workflow-definitie-ID }
    pluralLabel: { en: Workflow definition IDs, nl: Workflow-definitie-IDs }
    valueType: string
    icon: Workflow
    render:
      display: WorkflowDefinitionReferenceDisplay
      input: Input
    # Generic workflow-definition fields use a plain input; case authoring
    # should use caseTemplateId / caseStepTemplateId instead of category-filtered
    # workflow-definition pickers.

  postalCode:
    label: { en: Postal code, nl: Postcode }
    valueType: string
    icon: MapPin
    validation:
      pattern: "^[0-9]{4}\\s?[A-Z]{2}$"
    render:
      display: TextDisplay
      input: Input

  currency:
    label: { en: Currency amount, nl: Geldbedrag }
    valueType: number
    icon: Banknote
    render:
      display: MoneyInput
      input: MoneyInput
    props:
      currency: EUR

  condition:
    valueType: object
    label: { en: Condition, nl: Conditie }
    icon: GitBranch
    render:
      display: TextDisplay
      input: ConditionBuilder
    props:
      mode: free

  labelSet:
    valueType: object
    label: { en: Labels, nl: Labels }
    icon: Tags
    render:
      display: BadgeList
      input: JsonFieldEditor

  variableTemplate:
    valueType: string
    label: { en: Variable template, nl: Variabele-template }
    icon: Braces
    render:
      display: TextDisplay
      input: VariableTemplateInput

  # A stored FieldDefinition is the authored field contract itself: its value
  # schema is the field-definition authoring schema, bundled by the compiler.
  fieldDefinition:
    valueType: object
    schema: { $ref: "#/$defs/fieldDefinition" }
    label: { en: Field definition, nl: Velddefinitie }
    pluralLabel: { en: Field definitions, nl: Velddefinities }
    icon: ListChecks
    render:
      display: FieldDefinitionView
      input: JsonFieldEditor
