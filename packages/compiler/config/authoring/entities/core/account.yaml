schemaVersion: 3
kind: coreEntity
module: core
entity: Account
title: Account
description: A login identity in the current organization, resolved through canonical account Operations.
language: en
labels: { en: Account, nl: Account }
pluralLabels: { en: Accounts, nl: Accounts }
domains: [organization]
displayTemplate: "{{label}}"
filterField: label
source:
  kind: operations
  query:
    filterFields: [id, label, email, status, issuer, relationId]
    sortFields: [id, label, email, status, issuer, relationId]
authorization:
  roles:
    read: [Organization.Accounts.Read, Organization.Accounts.Manage]
fields:
  - { key: id, osfType: string, required: true, readOnly: true, validation: { format: uuid }, label: { en: Account, nl: Account } }
  - { key: label, osfType: string, required: true, readOnly: true, label: { en: Name, nl: Naam } }
  - { key: email, osfType: string, required: true, readOnly: true, label: { en: Email, nl: E-mail } }
  - { key: issuer, osfType: string, required: true, readOnly: true, label: { en: Technical issuer, nl: Technische uitgever } }
  - key: status
    osfType: string
    required: true
    readOnly: true
    label: { en: Organization access, nl: Organisatietoegang }
    options:
      type: static
      items:
        - { value: linked, label: { en: Active, nl: Actief } }
        - { value: blocked, label: { en: Blocked, nl: Geblokkeerd } }
        - { value: pending_confirmation, label: { en: Awaiting confirmation, nl: Wacht op bevestiging } }
  - { key: relationId, osfType: string, readOnly: true, validation: { format: uuid }, label: { en: Linked relation ID, nl: Gekoppelde relatie-ID } }
  - { key: linkedAt, osfType: datetime, readOnly: true, label: { en: Linked at, nl: Gekoppeld op } }
  - { key: revision, osfType: string, required: true, readOnly: true, label: { en: Account revision, nl: Accountrevisie } }
  - { key: directRoles, osfType: string, cardinality: collection, required: true, readOnly: true, label: { en: Direct role keys, nl: Directe rolkeys } }
  - { key: groupRoles, osfType: string, cardinality: collection, required: true, readOnly: true, label: { en: Group role keys, nl: Groepsrolkeys } }
  - { key: effectiveRoles, osfType: string, cardinality: collection, required: true, readOnly: true, label: { en: Effective role keys, nl: Effectieve rolkeys } }
  - { key: groups, osfType: string, cardinality: collection, required: true, readOnly: true, label: { en: Relation groups, nl: Relatiegroepen } }
  - key: providers
    osfType: object
    cardinality: collection
    readOnly: true
    label: { en: Linked login providers, nl: Gekoppelde loginproviders }
    children:
      - { key: key, osfType: string, required: true, label: { en: Provider key, nl: Providerkey } }
      - { key: label, osfType: string, required: true, label: { en: Provider, nl: Provider } }
      - { key: type, osfType: string, required: true, label: { en: Provider type, nl: Providertype } }
  - key: providerState
    osfType: string
    readOnly: true
    label: { en: Provider verification, nl: Providercontrole }
    options:
      type: static
      items:
        - { value: available, label: { en: Checked, nl: Gecontroleerd } }
        - { value: unavailable, label: { en: Unavailable, nl: Niet beschikbaar } }
        - { value: unsupported, label: { en: Cannot verify all linked providers, nl: Niet alle gekoppelde providers verifieerbaar } }
        - { value: not_configured, label: { en: Provider labels not configured for this organization, nl: Providerlabels niet ingesteld voor deze organisatie } }
        - { value: external_identity, label: { en: Account uses another identity service, nl: Account gebruikt een andere identiteitsdienst } }
  - { key: providersCheckedAt, osfType: datetime, readOnly: true, label: { en: Providers checked at, nl: Providers gecontroleerd op } }
operations:
  list:
    name: { en: List accounts, nl: Accounts tonen }
    description:
      en: "A bounded page of real accounts in the current organization, without invitations."
      nl: "Een begrensde pagina echte accounts in de huidige organisatie, zonder uitnodigingen."
    implementation: { type: plugin, plugin: accounts, handler: listOrganizationAccounts, action: list }
    input: { schema: {} }
    output: { schema: {} }
    errors: []
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  get:
    name: { en: View account, nl: Account bekijken }
    description: { en: Read one organization-bound account and check its linked login providers., nl: Lees één organisatiegebonden account en controleer de gekoppelde loginproviders. }
    implementation: { type: plugin, plugin: accounts, handler: getOrganizationAccount, action: get }
    input: { schema: {} }
    output: { schema: {} }
    errors: []
    effects: { data: read, external: read }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  block:
    name: { en: Block organization access, nl: Organisatietoegang blokkeren }
    description: { en: Block organization access for this account in the current organization., nl: Organisatietoegang blokkeren voor dit account in de huidige organisatie. }
    implementation: { type: plugin, plugin: accounts, handler: blockOrganizationAccount }
    target: { scope: record, inputField: id, inputBindings: { revision: revision } }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [id, revision]
        properties:
          id: { type: string, format: uuid, x-osf-i18n: { title: { en: Account, nl: Account } } }
          revision: { type: string, pattern: "^[a-f0-9]{32}$", x-osf-i18n: { title: { en: Current account revision, nl: Huidige accountrevisie } } }
    output: { schema: { type: object, additionalProperties: false, required: [updated], properties: { updated: { type: boolean, x-osf-i18n: { title: { en: Changed, nl: Gewijzigd } } } } } }
    auth: { mode: session, roles: [Organization.Accounts.Manage] }
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: acknowledgement }
    errors:
      - { status: 400, code: VALIDATION, description: Invalid account or revision. }
      - { status: 401, code: UNAUTHENTICATED, description: Sign in first. }
      - { status: 401, code: TENANT_REQUIRED, description: Select an organization. }
      - { status: 403, code: FORBIDDEN, description: Account management permission required. }
      - { status: 404, code: NOT_FOUND, description: Account not found in this organization. }
      - { status: 409, code: VERSION_CONFLICT, description: Read the changed account again. }
      - { status: 409, code: INVALID_STATE, description: Account access is already blocked. }
      - { status: 409, code: SELF_BLOCK, description: You cannot block your own access. }
      - { status: 409, code: LAST_ADMINISTRATOR, description: Keep one active directly assigned administrator. }
      - { status: 503, code: OPERATION_UNAVAILABLE, description: Account storage unavailable. }
  restore:
    name: { en: Restore organization access, nl: Organisatietoegang herstellen }
    description: { en: Restore organization access for this account in the current organization., nl: Organisatietoegang herstellen voor dit account in de huidige organisatie. }
    implementation: { type: plugin, plugin: accounts, handler: restoreOrganizationAccount }
    target: { scope: record, inputField: id, inputBindings: { revision: revision } }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [id, revision]
        properties:
          id: { type: string, format: uuid, x-osf-i18n: { title: { en: Account, nl: Account } } }
          revision: { type: string, pattern: "^[a-f0-9]{32}$", x-osf-i18n: { title: { en: Current account revision, nl: Huidige accountrevisie } } }
    output: { schema: { type: object, additionalProperties: false, required: [updated], properties: { updated: { type: boolean, x-osf-i18n: { title: { en: Changed, nl: Gewijzigd } } } } } }
    auth: { mode: session, roles: [Organization.Accounts.Manage] }
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: acknowledgement }
    errors:
      - { status: 400, code: VALIDATION, description: Invalid account or revision. }
      - { status: 401, code: UNAUTHENTICATED, description: Sign in first. }
      - { status: 401, code: TENANT_REQUIRED, description: Select an organization. }
      - { status: 403, code: FORBIDDEN, description: Account management permission required. }
      - { status: 404, code: NOT_FOUND, description: Account not found in this organization. }
      - { status: 409, code: VERSION_CONFLICT, description: Read the changed account again. }
      - { status: 409, code: INVALID_STATE, description: Account access is already active. }
      - { status: 409, code: LAST_ADMINISTRATOR, description: Keep one active directly assigned administrator. }
      - { status: 503, code: OPERATION_UNAVAILABLE, description: Account storage unavailable. }
  assignRole:
    name: { en: Assign account role, nl: Accountrol toekennen }
    description: { en: Assign account role for this account in the current organization., nl: Accountrol toekennen voor dit account in de huidige organisatie. }
    implementation: { type: plugin, plugin: accounts, handler: assignOrganizationAccountRole }
    target: { scope: record, inputField: id, inputBindings: { revision: revision } }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [id, revision, roleKey]
        properties:
          id: { type: string, format: uuid, x-osf-i18n: { title: { en: Account, nl: Account } } }
          revision: { type: string, pattern: "^[a-f0-9]{32}$", x-osf-i18n: { title: { en: Current account revision, nl: Huidige accountrevisie } } }
          roleKey: { type: string, minLength: 1, x-osf-i18n: { title: { en: Role, nl: Rol } }, x-osf-reference: { entity: AccessRole, valueField: key } }
    output: { schema: { type: object, additionalProperties: false, required: [updated], properties: { updated: { type: boolean, x-osf-i18n: { title: { en: Changed, nl: Gewijzigd } } } } } }
    auth: { mode: session, roles: [Organization.Access.Manage] }
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: acknowledgement }
    errors:
      - { status: 400, code: VALIDATION, description: Invalid account or role. }
      - { status: 401, code: UNAUTHENTICATED, description: Sign in first. }
      - { status: 401, code: TENANT_REQUIRED, description: Select an organization. }
      - { status: 403, code: FORBIDDEN, description: Organization access management permission required. }
      - { status: 404, code: NOT_FOUND, description: Account not found in this organization. }
      - { status: 409, code: VERSION_CONFLICT, description: Read the changed account again. }
      - { status: 409, code: INVALID_STATE, description: Link the account before assigning roles. }
      - { status: 409, code: LAST_ADMINISTRATOR, description: Keep one active directly assigned administrator. }
      - { status: 503, code: OPERATION_UNAVAILABLE, description: Account storage unavailable. }
  revokeRole:
    name: { en: Revoke account role, nl: Accountrol intrekken }
    description: { en: Revoke account role for this account in the current organization., nl: Accountrol intrekken voor dit account in de huidige organisatie. }
    implementation: { type: plugin, plugin: accounts, handler: revokeOrganizationAccountRole }
    target: { scope: record, inputField: id, inputBindings: { revision: revision } }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [id, revision, roleKey]
        properties:
          id: { type: string, format: uuid, x-osf-i18n: { title: { en: Account, nl: Account } } }
          revision: { type: string, pattern: "^[a-f0-9]{32}$", x-osf-i18n: { title: { en: Current account revision, nl: Huidige accountrevisie } } }
          roleKey: { type: string, minLength: 1, x-osf-i18n: { title: { en: Role, nl: Rol } }, x-osf-reference: { entity: AccessRole, valueField: key } }
    output: { schema: { type: object, additionalProperties: false, required: [updated], properties: { updated: { type: boolean, x-osf-i18n: { title: { en: Changed, nl: Gewijzigd } } } } } }
    auth: { mode: session, roles: [Organization.Access.Manage] }
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: acknowledgement }
    errors:
      - { status: 400, code: VALIDATION, description: Invalid account or role. }
      - { status: 401, code: UNAUTHENTICATED, description: Sign in first. }
      - { status: 401, code: TENANT_REQUIRED, description: Select an organization. }
      - { status: 403, code: FORBIDDEN, description: Organization access management permission required. }
      - { status: 404, code: NOT_FOUND, description: Account not found in this organization. }
      - { status: 409, code: VERSION_CONFLICT, description: Read the changed account again. }
      - { status: 409, code: INVALID_STATE, description: Link the account before revoking roles. }
      - { status: 409, code: LAST_ADMINISTRATOR, description: Keep one active directly assigned administrator. }
      - { status: 503, code: OPERATION_UNAVAILABLE, description: Account storage unavailable. }
interfaces:
  rest:
    operations:
      list: { method: GET, path: /api/accounts/account/list }
      get: { method: GET, path: /api/accounts/account/:id/get }
      block: { method: POST, path: /api/accounts/account/:id/block }
      restore: { method: POST, path: /api/accounts/account/:id/restore }
      assignRole: { method: POST, path: /api/accounts/account/:id/assign-role }
      revokeRole: { method: POST, path: /api/accounts/account/:id/revoke-role }
  graphql: {}
  mcp: {}
  web:
    views:
      collection:
        route: /accounts
        title: { en: Accounts, nl: Accounts }
        columns: [{ key: label }, { key: email }, { key: status }, { key: groups }]
        defaultSort: { key: label, direction: asc }
      record:
        routes: { read: /accounts/:id }
        title: "{{label}}"
        subtitle: "{{email}}"
        actions: [block, restore, assignRole, revokeRole]
        layout:
          tabs:
            - id: overview
              label: { en: Account, nl: Account }
              fields: [label, email, status, linkedAt, relationId]
            - id: access
              label: { en: Access, nl: Toegang }
              fields: [groups, directRoles, groupRoles, effectiveRoles]
            - id: providers
              label: { en: Login providers, nl: Loginproviders }
              fields: [providers, providerState, providersCheckedAt]
