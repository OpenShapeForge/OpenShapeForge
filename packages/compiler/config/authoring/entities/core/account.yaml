schemaVersion: 3
kind: coreEntity
module: core
entity: Account
title: Account
description: A user account for platform access, linked to a natural person.
language: en
displayTemplate: "{{username}}"
filterField: username
labels:
  en: Account
  nl: Account
domains:
  - relations
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: username
    osfType: string
    required: true
    label:
      en: Username
      nl: Gebruikersnaam
    description:
      en: Unique username for login.
      nl: Unieke gebruikersnaam voor inloggen.
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: username
      storageClass: core
  - key: email
    osfType: string
    required: true
    label:
      en: Email
      nl: E-mail
    description:
      en: Email address associated with the account.
      nl: E-mailadres gekoppeld aan het account.
    validation:
      minLength: 1
      maxLength: 254
    persisted:
      column: email
      storageClass: core
  - key: keycloakSub
    osfType: string
    required: false
    readOnly: true
    label:
      en: Keycloak subject
      nl: Keycloak subject
    description:
      en: Keycloak user identifier (sub claim) linked to this account. Set on first authenticated request.
      nl: Keycloak-gebruikersidentifier (sub-claim) gekoppeld aan dit account. Wordt gezet bij eerste geverifieerde verzoek.
    validation:
      maxLength: 255
    persisted:
      column: keycloak_sub
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Current status of the account (e.g. active, inactive, locked).
      nl: Huidige status van het account (bijv. actief, inactief, vergrendeld).
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ACCOUNTSTATUS
    osfType: referenceDataCode
  - key: lastLoginAt
    osfType: datetime
    required: false
    readOnly: true
    label:
      en: Last login
      nl: Laatste login
    description:
      en: Date and time of the most recent login.
      nl: Datum en tijd van de meest recente login.
    persisted:
      column: last_login_at
      storageClass: core
  - key: validFrom
    osfType: datetime
    required: false
    label:
      en: Valid from
      nl: Geldig vanaf
    description:
      en: Date and time from which this account is valid.
      nl: Datum en tijd vanaf wanneer dit account geldig is.
    persisted:
      column: valid_from
      storageClass: core
  - key: validUntil
    osfType: datetime
    required: false
    label:
      en: Valid until
      nl: Geldig tot
    description:
      en: Date and time until which this account remains valid.
      nl: Datum en tijd tot wanneer dit account geldig blijft.
    persisted:
      column: valid_until
      storageClass: core
  - key: passwordChangedAt
    osfType: datetime
    required: false
    readOnly: true
    label:
      en: Password changed at
      nl: Wachtwoord gewijzigd op
    description:
      en: Date and time when the password was last changed.
      nl: Datum en tijd waarop het wachtwoord voor het laatst is gewijzigd.
    persisted:
      column: password_changed_at
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse:
        label:
          en: Accounts
          nl: Accounts
  - key: naturalPersonId
    label:
      en: Natural person
      nl: Natuurlijk persoon
    persisted:
      column: natural_person_id
      storageClass: core
    osfType: NaturalPerson
    relationship:
      ownership: reference
      inverse:
        label:
          en: Accounts
          nl: Accounts
operations:
  list:
    name: List Account
    description: List Account records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Account
    description: Get Account records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Account
    description: Create Account records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Account records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /accounts
          nl: /accounts
        columns:
          - key: username
            sortable: true
          - key: email
            sortable: true
          - key: status
            sortable: true
          - key: validUntil
            sortable: true
          - key: lastLoginAt
            sortable: true
        title:
          en: Accounts
          nl: Accounts
        defaultSort:
          key: username
          direction: asc
      record:
        routes:
          read:
            en: /accounts/:id
            nl: /accounts/:id
          create:
            en: /accounts/create
            nl: /accounts/aanmaken
        title: "{{username}}"
        subtitle: "{{email}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Account details
                    nl: Accountgegevens
                  fields:
                    - username
                    - email
                    - status
                    - validFrom
                    - validUntil
                    - passwordChangedAt
                    - lastLoginAt
        modes:
          create:
            title:
              en: Create account
              nl: Account aanmaken
            groups:
              - title:
                  en: Account details
                  nl: Accountgegevens
                fields:
                  - username
                  - email
                  - status
                  - validFrom
                  - validUntil
          update:
            title:
              en: Edit account
              nl: Account bewerken
    fields:
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ACCOUNTSTATUS
            clearable: false
      lastLoginAt:
        render:
          component: DateTimePicker
          props: {}
      validFrom:
        render:
          component: DateTimePicker
          props: {}
      validUntil:
        render:
          component: DateTimePicker
          props: {}
      passwordChangedAt:
        render:
          component: DateTimePicker
          props: {}
