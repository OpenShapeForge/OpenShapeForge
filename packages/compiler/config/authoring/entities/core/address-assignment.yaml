schemaVersion: 3
kind: coreEntity
module: core
entity: AddressAssignment
title: Address Assignment
description: A dated assignment of an address to a relation, optionally scoped to a role.
language: en
displayTemplate: "{{role}}"
filterField: role
labels:
  en: Address Assignment
  nl: Adrestoewijzing
pluralLabels:
  en: Address assignments
  nl: Adrestoewijzingen
domains:
  - relations
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: type
    osfType: string
    required: true
    label:
      en: Type
      nl: Type
    description:
      en: Usage type of the assignment, such as residential, postal, billing, or visiting.
      nl: Gebruikstype van de toewijzing, zoals woon-, post-, factuur- of bezoekadres.
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: type
      storageClass: core
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which the address assignment is effective.
      nl: Datum vanaf wanneer de adrestoewijzing geldig is.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which the address assignment is effective.
      nl: Datum tot wanneer de adrestoewijzing geldig is.
    persisted:
      column: end_date
      storageClass: core
  - key: isPrimary
    osfType: boolean
    required: false
    label:
      en: Primary
      nl: Primair
    description:
      en: Whether this is the primary address assignment of its type.
      nl: Of dit de primaire adrestoewijzing van dit type is.
    persisted:
      column: is_primary
      storageClass: core
  - key: notes
    required: false
    label:
      en: Notes
      nl: Notities
    description:
      en: Additional notes about the address assignment.
      nl: Aanvullende notities bij de adrestoewijzing.
    validation:
      maxLength: 2000
    persisted:
      column: notes
      storageClass: core
    osfType: multilineText
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse:
        label:
          en: Address assignments
          nl: Adrestoewijzingen
  - key: addressId
    label:
      en: Address
      nl: Adres
    persisted:
      column: address_id
      storageClass: core
    osfType: Address
    relationship:
      ownership: reference
  - key: relationRoleId
    label:
      en: Relation role
      nl: Relatierol
    persisted:
      column: relation_role_id
      storageClass: core
    osfType: RelationRole
    relationship:
      ownership: reference
      inverse:
        label:
          en: Address assignments
          nl: Adrestoewijzingen
operations:
  list:
    name: List Address Assignment
    description: List AddressAssignment records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Address Assignment
    description: Get AddressAssignment records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Address Assignment
    description: Create AddressAssignment records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update AddressAssignment records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /address-assignments
          nl: /adrestoewijzingen
        columns:
          - key: type
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
          - key: isPrimary
            sortable: true
        title:
          en: Address Assignments
          nl: Adrestoewijzingen
        defaultSort:
          key: type
          direction: asc
      record:
        routes:
          read:
            en: /address-assignments/:id
            nl: /adrestoewijzingen/:id
          create:
            en: /address-assignments/create
            nl: /adrestoewijzingen/aanmaken
        title: "{{type}}"
        subtitle: "{{startDate}} – {{endDate}}"
        badges:
          - type
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Assignment
                    nl: Toewijzing
                  fields:
                    - type
                    - startDate
                    - endDate
                    - isPrimary
                - title:
                    en: Notes
                    nl: Notities
                  fields:
                    - notes
        modes:
          create:
            title:
              en: Create address assignment
              nl: Adrestoewijzing aanmaken
            groups:
              - title:
                  en: Assignment
                  nl: Toewijzing
                fields:
                  - type
                  - startDate
                  - endDate
                  - isPrimary
              - title:
                  en: Notes
                  nl: Notities
                fields:
                  - notes
          update:
            title:
              en: Edit address assignment
              nl: Adrestoewijzing bewerken
    fields:
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
      notes:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
