schemaVersion: 3
kind: coreEntity
module: core
entity: Address
title: Address
description: A physical or postal address associated with a relation.
language: en
displayTemplate: "{{street}} {{houseNumber}}"
filterField: street
labels:
  en: Address
  nl: Adres
domains:
  - relations
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: type
    valueType: string
    required: true
    label:
      en: Type
      nl: Type
    description:
      en: Type of address (e.g. home, postal, visit, billing).
      nl: Type adres (bijv. woon, post, bezoek, factuur).
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ADDRESSTYPE
    semanticType: referenceDataCode
  - key: street
    valueType: string
    required: false
    label:
      en: Street
      nl: Straat
    description:
      en: Street name.
      nl: Straatnaam.
    validation:
      maxLength: 200
    persisted:
      column: street
      storageClass: core
  - key: houseNumber
    valueType: string
    required: false
    label:
      en: House number
      nl: Huisnummer
    description:
      en: House or building number.
      nl: Huis- of gebouwnummer.
    validation:
      maxLength: 20
    persisted:
      column: house_number
      storageClass: core
  - key: houseNumberAddition
    valueType: string
    required: false
    label:
      en: House number addition
      nl: Huisnummertoevoeging
    description:
      en: Addition to the house number (e.g. A, bis, II).
      nl: Toevoeging bij het huisnummer (bijv. A, bis, II).
    validation:
      maxLength: 20
    persisted:
      column: house_number_addition
      storageClass: core
  - key: postalCode
    valueType: string
    required: false
    label:
      en: Postal code
      nl: Postcode
    description:
      en: Postal code or ZIP code.
      nl: Postcode.
    validation:
      maxLength: 20
    persisted:
      column: postal_code
      storageClass: core
  - key: city
    valueType: string
    required: true
    label:
      en: City
      nl: Plaats
    description:
      en: City or municipality name.
      nl: Plaatsnaam of gemeente.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: city
      storageClass: core
  - key: country
    valueType: string
    required: false
    label:
      en: Country
      nl: Land
    description:
      en: Country name or ISO country code.
      nl: Landnaam of ISO-landcode.
    validation:
      maxLength: 100
    persisted:
      column: country
      storageClass: core
  - key: latitude
    valueType: number
    required: false
    label:
      en: Latitude
      nl: Breedtegraad
    description:
      en: Geographic latitude coordinate.
      nl: Geografische breedtegraadcoördinaat.
    persisted:
      column: latitude
      storageClass: core
  - key: longitude
    valueType: number
    required: false
    label:
      en: Longitude
      nl: Lengtegraad
    description:
      en: Geographic longitude coordinate.
      nl: Geografische lengtegraadcoördinaat.
    persisted:
      column: longitude
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    semanticType: Relation
    relationship:
      ownership: reference
  - key: naturalPersonId
    label:
      en: Natural person
      nl: Natuurlijk persoon
    persisted:
      column: natural_person_id
      storageClass: core
    semanticType: NaturalPerson
    relationship:
      ownership: reference
  - key: legalEntityId
    label:
      en: Legal entity
      nl: Rechtspersoon
    persisted:
      column: legal_entity_id
      storageClass: core
    semanticType: LegalEntity
    relationship:
      ownership: reference
operations:
  list:
    name: List Address
    description: List Address records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Address
    description: Get Address records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Address
    description: Create Address records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Address records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /addresses
          nl: /adressen
        columns:
          - key: type
            sortable: true
          - key: street
            sortable: true
          - key: city
            sortable: true
          - key: postalCode
            sortable: true
        title:
          en: Addresses
          nl: Adressen
        defaultSort:
          key: city
          direction: asc
      record:
        routes:
          read:
            en: /addresses/:id
            nl: /adressen/:id
          create:
            en: /addresses/create
            nl: /adressen/aanmaken
        title: "{{street}} {{houseNumber}}{{houseNumberAddition}}, {{city}}"
        subtitle: "{{type}}"
        badges:
          - type
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Address
                    nl: Adres
                  fields:
                    - type
                    - street
                    - houseNumber
                    - houseNumberAddition
                    - postalCode
                    - city
                    - country
                - title:
                    en: Coordinates
                    nl: Coördinaten
                  fields:
                    - latitude
                    - longitude
        modes:
          create:
            title:
              en: Create address
              nl: Adres aanmaken
            groups:
              - title:
                  en: Address
                  nl: Adres
                fields:
                  - type
                  - street
                  - houseNumber
                  - houseNumberAddition
                  - postalCode
                  - city
                  - country
              - title:
                  en: Coordinates
                  nl: Coördinaten
                fields:
                  - latitude
                  - longitude
          update:
            title:
              en: Edit address
              nl: Adres bewerken
    fields:
      type:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ADDRESSTYPE
            clearable: false
      street:
        render:
          component: AddressAutocomplete
          props:
            provider: bag
            country: NL
      latitude:
        render:
          component: MapPicker
          props:
            defaultZoom: 13
            defaultCenter:
              - 52.0907
              - 5.1214
            geocodeProvider: nominatim
            coordinateField: latitude
      longitude:
        render:
          component: MapPicker
          props:
            defaultZoom: 13
            defaultCenter:
              - 52.0907
              - 5.1214
            geocodeProvider: nominatim
            coordinateField: longitude
