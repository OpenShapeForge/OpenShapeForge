schemaVersion: 2
kind: coreEntity
module: core
entity: Address
title: Address
description: A physical or postal address associated with a relation.
language: en
displayTemplate: "{{street}} {{houseNumber}}"
filterField: street
labels:
  en: Address
  nl: Adres
domains:
  - relations
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: type
    valueType: string
    required: true
    label:
      en: Type
      nl: Type
    description:
      en: Type of address (e.g. home, postal, visit, billing).
      nl: Type adres (bijv. woon, post, bezoek, factuur).
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ADDRESSTYPE
  - key: street
    valueType: string
    required: false
    label:
      en: Street
      nl: Straat
    description:
      en: Street name.
      nl: Straatnaam.
    validation:
      maxLength: 200
    persisted:
      column: street
      storageClass: core
  - key: houseNumber
    valueType: string
    required: false
    label:
      en: House number
      nl: Huisnummer
    description:
      en: House or building number.
      nl: Huis- of gebouwnummer.
    validation:
      maxLength: 20
    persisted:
      column: house_number
      storageClass: core
  - key: houseNumberAddition
    valueType: string
    required: false
    label:
      en: House number addition
      nl: Huisnummertoevoeging
    description:
      en: Addition to the house number (e.g. A, bis, II).
      nl: Toevoeging bij het huisnummer (bijv. A, bis, II).
    validation:
      maxLength: 20
    persisted:
      column: house_number_addition
      storageClass: core
  - key: postalCode
    valueType: string
    required: false
    label:
      en: Postal code
      nl: Postcode
    description:
      en: Postal code or ZIP code.
      nl: Postcode.
    validation:
      maxLength: 20
    persisted:
      column: postal_code
      storageClass: core
  - key: city
    valueType: string
    required: true
    label:
      en: City
      nl: Plaats
    description:
      en: City or municipality name.
      nl: Plaatsnaam of gemeente.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: city
      storageClass: core
  - key: country
    valueType: string
    required: false
    label:
      en: Country
      nl: Land
    description:
      en: Country name or ISO country code.
      nl: Landnaam of ISO-landcode.
    validation:
      maxLength: 100
    persisted:
      column: country
      storageClass: core
  - key: latitude
    valueType: number
    required: false
    label:
      en: Latitude
      nl: Breedtegraad
    description:
      en: Geographic latitude coordinate.
      nl: Geografische breedtegraadcoördinaat.
    persisted:
      column: latitude
      storageClass: core
  - key: longitude
    valueType: number
    required: false
    label:
      en: Longitude
      nl: Lengtegraad
    description:
      en: Geographic longitude coordinate.
      nl: Geografische lengtegraadcoördinaat.
    persisted:
      column: longitude
      storageClass: core
relationships:
  - key: relation
    kind: belongsTo
    target: Relation
    foreignKey: relation_id
    label:
      en: Relation
      nl: Relatie
  - key: naturalPerson
    kind: belongsTo
    target: NaturalPerson
    foreignKey: natural_person_id
    label:
      en: Natural person
      nl: Natuurlijk persoon
  - key: legalEntity
    kind: belongsTo
    target: LegalEntity
    foreignKey: legal_entity_id
    label:
      en: Legal entity
      nl: Rechtspersoon
operations:
  list:
    name: { en: List addresses, nl: Adressen tonen }
    description:
      en: Returns a filtered and sorted page of addresses.
      nl: Geeft een gefilterde en gesorteerde pagina met adressen terug.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  get:
    name: { en: Get address, nl: Adres ophalen }
    description:
      en: Returns one address by its canonical id.
      nl: Geeft één adres terug op basis van het canonieke id.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  create:
    name: { en: Create address, nl: Adres aanmaken }
    description:
      en: Creates one address after validating its canonical fields.
      nl: Maakt één adres aan na validatie van de canonieke velden.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    confirmation: { mode: none }
  update:
    name: { en: Update address, nl: Adres wijzigen }
    description:
      en: Updates one address while holding its server-issued edit lease and current version.
      nl: Wijzigt één adres met de server-uitgegeven bewerkingslease en actuele versie.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation: { mode: none }
  delete:
    name: { en: Delete address, nl: Adres verwijderen }
    description:
      en: Permanently deletes one address after a server-issued, version-bound confirmation challenge.
      nl: Verwijdert één adres definitief na een door de server uitgegeven, versiegebonden bevestigingsvraag.
    implementation: { type: entity, action: delete }
    effects: { data: delete, external: none }
    reliability:
      idempotency: { mode: natural }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation:
      mode: challenge
      challenge:
        kind: type-current-field
        field: city
        issuedBy: server
        bindTo: [subject, tenant, operation, target.id, target.version]
        expiresAfter: PT5M
        singleUse: true

interfaces:
  rest: {}
  graphql: {}
  mcp:
    # An address is reached through the relation it belongs to; the shared
    # osf_* tools cover that without spending dedicated tool slots on it.
    tools: generic
    operations:
      update:
        instructions:
          en: Acquire an edit lease first and submit its token with the version returned by get.
          nl: Vraag eerst een bewerkingslease aan en stuur het token mee met de versie uit get.
      delete:
        instructions:
          en: Acquire an edit lease first; request the confirmation challenge and answer it with the exact current city.
          nl: Vraag eerst een bewerkingslease en bevestigingsvraag aan en beantwoord die met exact de actuele plaatsnaam.
    resource:
      uri: app://addresses
      name: Addresses
      description: Read the addresses available to the signed-in identity.
      templateDescription: Read one address by its canonical id.
  web:
    views:
      collection:
        route: { en: /addresses, nl: /adressen }
        title: { en: Addresses, nl: Adressen }
        columns:
          - { key: type, sortable: true }
          - { key: street, sortable: true }
          - { key: city, sortable: true }
          - { key: postalCode, sortable: true }
        defaultSort: { key: city, direction: asc }
      record:
        routes:
          read: { en: /addresses/:id, nl: /adressen/:id }
          create: { en: /addresses/create, nl: /adressen/aanmaken }
        title: "{{street}} {{houseNumber}}{{houseNumberAddition}}, {{city}}"
        subtitle: "{{type}}"
        actions: [update, delete]
        layout:
          context:
            fields: [type]
            relationships: [relation]
          tabs:
            - id: overview
              label: { en: Overview, nl: Overzicht }
              groups:
                - title: { en: Address, nl: Adres }
                  fields: [type, street, houseNumber, houseNumberAddition, postalCode, city, country]
                - title: { en: Coordinates, nl: Coördinaten }
                  fields: [latitude, longitude]
        modes:
          create:
            title: { en: Create address, nl: Adres aanmaken }
            groups:
              - title: { en: Address, nl: Adres }
                fields: [type, street, houseNumber, houseNumberAddition, postalCode, city, country]
              - title: { en: Coordinates, nl: Coördinaten }
                fields: [latitude, longitude]
          update:
            title: { en: Edit address, nl: Adres bewerken }
