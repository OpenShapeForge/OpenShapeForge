schemaVersion: 3
kind: coreEntity
module: core
entity: AdminRegion
title: Administrative Region
description: Generic administrative geography (municipality, city district, district, neighborhood, place) organized as a hierarchy.
language: en
displayTemplate: "{{regionLevel}}: {{code}}"
filterField: code
labels:
  en: Administrative region
  nl: Bestuurlijk gebied
pluralLabels:
  en: Administrative regions
  nl: Bestuurlijke gebieden
domains:
  - asset
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique administrative region code.
      nl: Tenant-unieke code van het bestuurlijke gebied.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the region.
      nl: Menselijk leesbare naam van het gebied.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: regionLevel
    required: true
    label:
      en: Region level
      nl: Niveau
    description:
      en: Administrative level (municipality, city district, district, neighborhood, place).
      nl: Bestuurlijk niveau (gemeente, stadsdeel, wijk, buurt, plaats).
    persisted:
      column: region_level
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ADMINREGIONLEVEL
    osfType: referenceDataCode
  - key: validFrom
    osfType: date
    required: false
    label:
      en: Valid from
      nl: Geldig vanaf
    description:
      en: Date from which the region is effective.
      nl: Datum vanaf wanneer het gebied geldig is.
    persisted:
      column: valid_from
      storageClass: core
  - key: validTo
    osfType: date
    required: false
    label:
      en: Valid to
      nl: Geldig tot
    description:
      en: Date until which the region is effective.
      nl: Datum tot wanneer het gebied geldig is.
    persisted:
      column: valid_to
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the region in an external context.
      nl: Functionele of zakelijke code van het gebied in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: parentAdminRegionId
    label:
      en: Parent admin region
      nl: Bovenliggend gebied
    persisted:
      column: parent_admin_region_id
      storageClass: core
    osfType: AdminRegion
    relationship:
      ownership: reference
      inverse:
        key: childAdminRegions
        label:
          en: Child admin regions
          nl: Onderliggende gebieden
authorization:
  roles:
    read:
      - RealEstate.All.Read
      - RealEstate.All.ReadWrite
    create:
      - RealEstate.All.ReadWrite
    update:
      - RealEstate.All.ReadWrite
    delete:
      - RealEstate.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Administrative Region
    description: List AdminRegion records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Administrative Region
    description: Get AdminRegion records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Administrative Region
    description: Create AdminRegion records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update AdminRegion records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /admin-regions
          nl: /bestuurlijke-gebieden
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: regionLevel
            sortable: true
        title:
          en: Admin regions
          nl: Bestuurlijke gebieden
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /admin-regions/:id
            nl: /bestuurlijke-gebieden/:id
          create:
            en: /admin-regions/create
            nl: /bestuurlijke-gebieden/aanmaken
        title: "{{regionLevel}}: {{code}}"
        subtitle: "{{name}}"
        badges:
          - regionLevel
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Region details
                    nl: Gebiedsgegevens
                  fields:
                    - code
                    - name
                    - regionLevel
                    - validFrom
                    - validTo
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create admin region
              nl: Bestuurlijk gebied aanmaken
            groups:
              - title:
                  en: Region details
                  nl: Gebiedsgegevens
                fields:
                  - code
                  - name
                  - regionLevel
                  - validFrom
                  - validTo
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit admin region
              nl: Bestuurlijk gebied bewerken
    fields:
      regionLevel:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ADMINREGIONLEVEL
            clearable: false
      validFrom:
        render:
          component: DatePicker
          props: {}
      validTo:
        render:
          component: DatePicker
          props: {}
