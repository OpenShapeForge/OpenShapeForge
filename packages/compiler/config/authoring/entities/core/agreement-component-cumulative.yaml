interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /agreement-component-cumulatives
          nl: /component-cumulatieven
        columns:
          - key: postedAt
            sortable: true
          - key: quantity
            sortable: true
          - key: amountBase
            sortable: true
          - key: amountVat
            sortable: true
          - key: amountTotal
            sortable: true
        title:
          en: Component cumulatives
          nl: Component cumulatieven
        defaultSort:
          key: postedAt
          direction: desc
      record:
        routes:
          read:
            en: /agreement-component-cumulatives/:id
            nl: /component-cumulatieven/:id
          create:
            en: /agreement-component-cumulatives/create
            nl: /component-cumulatieven/aanmaken
        title: "{{postedAt}}"
        subtitle: "{{amountTotal}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Cumulative details
                    nl: Cumulatiegegevens
                  fields:
                    - postedAt
                    - quantity
                    - unitId
                    - unitPrice
                - title:
                    en: Amounts
                    nl: Bedragen
                  fields:
                    - amountBase
                    - amountVat
                    - amountTotal
        modes:
          create:
            title:
              en: Create component cumulative
              nl: Component cumulatief aanmaken
            groups:
              - title:
                  en: Cumulative details
                  nl: Cumulatiegegevens
                fields:
                  - postedAt
                  - quantity
                  - unitId
                  - unitPrice
              - title:
                  en: Amounts
                  nl: Bedragen
                fields:
                  - amountBase
