schemaVersion: 3
kind: coreEntity
module: core
entity: AgreementComponentCumulative
title: Agreement Component Cumulative
description: Projection — cumulative invoiced amount per agreement component, fiscal period, and source invoice.
  Populated by the audit/timeline service from invoice events. UIs must never write directly.
language: en
displayTemplate: "{{postedAt}}"
filterField: id
labels:
  en: Component cumulative
  nl: Component cumulatief
domains:
  - finance
  - contracts
fields:
  - key: quantity
    osfType: number
    required: false
    label:
      en: Quantity
      nl: Aantal
    description:
      en: Cumulative quantity invoiced for the component in the period.
      nl: Cumulatief aantal gefactureerd voor de component in de periode.
    persisted:
      column: quantity
      storageClass: core
  - key: unitId
    osfType: string
    required: false
    label:
      en: Unit
      nl: Eenheid
    description:
      en: Free-form unit identifier carried over from the component (e.g. "Day", "Hour").
      nl: Vrije eenheidsaanduiding overgenomen van de component (bv. "Dag", "Uur").
    validation:
      maxLength: 50
    persisted:
      column: unit_id
      storageClass: core
  - key: unitPrice
    required: false
    label:
      en: Unit price
      nl: Eenheidsprijs
    description:
      en: Effective unit price reflected in the projection row.
      nl: Effectieve eenheidsprijs die in de projectierij is vastgelegd.
    osfType: currency
    persisted:
      column: unit_price
      storageClass: core
  - key: amountBase
    required: false
    label:
      en: Base amount
      nl: Basisbedrag
    description:
      en: Cumulative net amount excluding VAT.
      nl: Cumulatief nettobedrag exclusief BTW.
    osfType: currency
    persisted:
      column: amount_base
      storageClass: core
  - key: amountVat
    required: false
    label:
      en: VAT amount
      nl: BTW-bedrag
    description:
      en: Cumulative VAT amount.
      nl: Cumulatief BTW-bedrag.
    osfType: currency
    persisted:
      column: amount_vat
      storageClass: core
  - key: amountTotal
    required: false
    label:
      en: Total amount
      nl: Totaalbedrag
    description:
      en: Cumulative total amount including VAT.
      nl: Cumulatief totaalbedrag inclusief BTW.
    osfType: currency
    persisted:
      column: amount_total
      storageClass: core
  - key: postedAt
    osfType: datetime
    required: false
    label:
      en: Posted at
      nl: Geboekt op
    description:
      en: Timestamp at which this projection row was posted by the audit/timeline service.
      nl: Tijdstip waarop deze projectierij door de audit/timeline-service is geboekt.
    persisted:
      column: posted_at
      storageClass: core
  - key: agreementId
    label:
      en: Agreement
      nl: Overeenkomst
    persisted:
      column: agreement_id
      storageClass: core
    osfType: Agreement
    relationship:
      ownership: reference
  - key: agreementComponentId
    label:
      en: Agreement component
      nl: Overeenkomstcomponent
    persisted:
      column: agreement_component_id
      storageClass: core
    osfType: AgreementComponent
    relationship:
      ownership: reference
  - key: fiscalPeriodId
    label:
      en: Fiscal period
      nl: Boekjaarperiode
    persisted:
      column: fiscal_period_id
      storageClass: core
    osfType: FiscalPeriod
    relationship:
      ownership: reference
  - key: invoiceId
    label:
      en: Invoice
      nl: Factuur
    persisted:
      column: invoice_id
      storageClass: core
    osfType: Invoice
    relationship:
      ownership: reference
  - key: vatRateId
    label:
      en: VAT rate
      nl: BTW-tarief
    persisted:
      column: vat_rate_id
      storageClass: core
    osfType: VatRate
    relationship:
      ownership: reference
  - key: ledgerAccountId
    label:
      en: Ledger account
      nl: Grootboekrekening
    persisted:
      column: ledger_account_id
      storageClass: core
    osfType: LedgerAccount
    relationship:
      ownership: reference
  - key: componentDimensionId
    label:
      en: Component dimension
      nl: Componentdimensie
    persisted:
      column: component_dimension_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
  - key: dimension1Id
    label:
      en: Cost dimension 1
      nl: Kostendimensie 1
    persisted:
      column: dimension_1_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
  - key: dimension2Id
    label:
      en: Cost dimension 2
      nl: Kostendimensie 2
    persisted:
      column: dimension_2_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
  - key: vatDimensionId
    label:
      en: VAT dimension
      nl: BTW-dimensie
    persisted:
      column: vat_dimension_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
