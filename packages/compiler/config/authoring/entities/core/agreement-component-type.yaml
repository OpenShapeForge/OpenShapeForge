schemaVersion: 3
kind: coreEntity
module: core
entity: AgreementComponentType
title: Agreement Component Type
description: Catalog of component types (e.g. main rent, service fee, insurance) carrying the GL account pair that lines
  of this type post to.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Agreement component type
  nl: Overeenkomstcomponenttype
domains:
  - finance
  - contracts
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique component-type code.
      nl: Tenant-unieke componenttypecode.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the component type.
      nl: Menselijk leesbare naam van het componenttype.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the component type.
      nl: Optionele omschrijving of zakelijke betekenis van het componenttype.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: unitId
    osfType: string
    required: false
    label:
      en: Unit
      nl: Eenheid
    description:
      en: Free-form unit identifier (e.g. "Number", "Day", "Hour") describing the unit of measure for this component type.
      nl: Vrije eenheidsaanduiding (bv. "Aantal", "Dag", "Uur") die de meetwaarde van dit componenttype beschrijft.
    validation:
      maxLength: 50
    persisted:
      column: unit_id
      storageClass: core
  - key: applicableToAgreementTypes
    osfType: string
    required: false
    label:
      en: Applicable to agreement types
      nl: Toepasbaar op overeenkomsttypen
    description:
      en: Optional whitelist of AGREEMENTTYPE values for which this component type may be selected. Empty/null means no
        restriction.
      nl: Optionele whitelist van AGREEMENTTYPE-waarden waarvoor dit componenttype kan worden gekozen. Leeg/null betekent geen
        beperking.
    persisted:
      column: applicable_to_agreement_types
      storageClass: core
    cardinality:
      min: 0
      max: unbounded
    item:
      key: agreementType
      required: false
      label:
        en: Agreement type
        nl: Overeenkomsttype
      options:
        type: referentiedata
        referentieGroep: AGREEMENTTYPE
      osfType: referenceDataCode
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the component type in an external context.
      nl: Functionele of zakelijke code van het componenttype in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: debitLedgerAccountId
    label:
      en: Debit ledger account
      nl: Debet grootboekrekening
    persisted:
      column: debit_ledger_account_id
      storageClass: core
    osfType: LedgerAccount
    relationship:
      ownership: reference
      inverse: false
  - key: creditLedgerAccountId
    label:
      en: Credit ledger account
      nl: Credit grootboekrekening
    persisted:
      column: credit_ledger_account_id
      storageClass: core
    osfType: LedgerAccount
    relationship:
      ownership: reference
      inverse: false
  - key: defaultCostDimensionId
    label:
      en: Default cost dimension
      nl: Standaard kostendimensie
    persisted:
      column: default_cost_dimension_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Agreements.All.Read
      - Agreements.All.ReadWrite
    create:
      - Agreements.All.ReadWrite
    update:
      - Agreements.All.ReadWrite
    delete:
      - Agreements.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Agreement Component Type
    description: List AgreementComponentType records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Agreement Component Type
    description: Get AgreementComponentType records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Agreement Component Type
    description: Create AgreementComponentType records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update AgreementComponentType records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /agreement-component-types
          nl: /overeenkomstcomponenttypen
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: unitId
            sortable: true
        title:
          en: Agreement component types
          nl: Overeenkomstcomponenttypen
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /agreement-component-types/:id
            nl: /overeenkomstcomponenttypen/:id
          create:
            en: /agreement-component-types/create
            nl: /overeenkomstcomponenttypen/aanmaken
        title: "{{code}} {{name}}"
        subtitle: "{{unitId}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Component type details
                    nl: Componenttypegegevens
                  fields:
                    - code
                    - name
                    - unitId
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create agreement component type
              nl: Overeenkomstcomponenttype aanmaken
            groups:
              - title:
                  en: Component type details
                  nl: Componenttypegegevens
                fields:
                  - code
                  - name
                  - unitId
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit agreement component type
              nl: Overeenkomstcomponenttype bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
      applicableToAgreementTypes.agreementType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: AGREEMENTTYPE
            clearable: false
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
