schemaVersion: 3
kind: coreEntity
module: core
entity: AgreementComponent
title: Agreement Component
description: Line item on an agreement, typed by an agreement component type, with quantities, unit amounts, and per-line VAT rate.
language: en
displayTemplate: "{{description}}"
filterField: description
labels:
  en: Agreement component
  nl: Overeenkomstcomponent
pluralLabels:
  en: Agreement components
  nl: Overeenkomstcomponenten
domains:
  - finance
  - contracts
fields:
  - key: description
    required: true
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Human-readable description of this line on the agreement.
      nl: Menselijk leesbare omschrijving van deze regel op de overeenkomst.
    validation:
      minLength: 1
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which this component is effective on the agreement.
      nl: Datum vanaf wanneer deze component op de overeenkomst geldig is.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which this component is effective on the agreement.
      nl: Datum tot wanneer deze component op de overeenkomst geldig is.
    persisted:
      column: end_date
      storageClass: core
  - key: nextProlongationDate
    osfType: date
    required: false
    label:
      en: Next prolongation date
      nl: Volgende prolongatiedatum
    description:
      en: Cursor — next date the prolongation worker should pick up this component.
      nl: Cursor — volgende datum waarop de prolongatie-worker deze component moet oppakken.
    persisted:
      column: next_prolongation_date
      storageClass: core
  - key: endProlongationDate
    osfType: date
    required: false
    label:
      en: End prolongation date
      nl: Einde prolongatiedatum
    description:
      en: Cursor — date through which prolongation has already produced invoices for this component.
      nl: Cursor — datum tot waar prolongatie al facturen heeft geproduceerd voor deze component.
    persisted:
      column: end_prolongation_date
      storageClass: core
  - key: quantity
    osfType: number
    required: false
    label:
      en: Quantity
      nl: Aantal
    description:
      en: Quantity for this component (multiplied by unit amount to compute base).
      nl: Aantal voor deze component (vermenigvuldigd met eenheidsbedrag voor basisbedrag).
    persisted:
      column: quantity
      storageClass: core
  - key: unitId
    osfType: string
    required: false
    label:
      en: Unit
      nl: Eenheid
    description:
      en: Free-form unit identifier for this component (e.g. "Day", "Hour").
      nl: Vrije eenheidsaanduiding voor deze component (bv. "Dag", "Uur").
    validation:
      maxLength: 50
    persisted:
      column: unit_id
      storageClass: core
  - key: unitAmount
    required: false
    label:
      en: Unit amount
      nl: Eenheidsbedrag
    description:
      en: Amount per unit (excluding VAT).
      nl: Bedrag per eenheid (excl. BTW).
    osfType: currency
    persisted:
      column: unit_amount
      storageClass: core
  - key: amountBase
    required: false
    label:
      en: Base amount
      nl: Basisbedrag
    description:
      en: Net amount excluding VAT for this component line.
      nl: Nettobedrag excl. BTW voor deze componentregel.
    osfType: currency
    persisted:
      column: amount_base
      storageClass: core
  - key: amountVat
    required: false
    label:
      en: VAT amount
      nl: BTW-bedrag
    description:
      en: VAT amount for this component line.
      nl: BTW-bedrag voor deze componentregel.
    osfType: currency
    persisted:
      column: amount_vat
      storageClass: core
  - key: amountTotal
    required: false
    label:
      en: Total amount
      nl: Totaalbedrag
    description:
      en: Total amount including VAT for this component line.
      nl: Totaalbedrag incl. BTW voor deze componentregel.
    osfType: currency
    persisted:
      column: amount_total
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the component in an external context.
      nl: Functionele of zakelijke code van de component in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: agreementId
    label:
      en: Agreement
      nl: Overeenkomst
    persisted:
      column: agreement_id
      storageClass: core
    osfType: Agreement
    relationship:
      ownership: reference
  - key: agreementComponentTypeId
    label:
      en: Component type
      nl: Componenttype
    persisted:
      column: agreement_component_type_id
      storageClass: core
    osfType: AgreementComponentType
    relationship:
      ownership: reference
  - key: vatRateId
    label:
      en: VAT rate
      nl: BTW-tarief
    persisted:
      column: vat_rate_id
      storageClass: core
    osfType: VatRate
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Agreements.All.Read
      - Agreements.All.ReadWrite
    create:
      - Agreements.All.ReadWrite
    update:
      - Agreements.All.ReadWrite
    delete:
      - Agreements.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Agreement Component
    description: List AgreementComponent records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Agreement Component
    description: Get AgreementComponent records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Agreement Component
    description: Create AgreementComponent records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update AgreementComponent records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /agreement-components
          nl: /overeenkomstcomponenten
        columns:
          - key: description
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
          - key: amountTotal
            sortable: true
        title:
          en: Agreement components
          nl: Overeenkomstcomponenten
        defaultSort:
          key: startDate
          direction: desc
      record:
        routes:
          read:
            en: /agreement-components/:id
            nl: /overeenkomstcomponenten/:id
          create:
            en: /agreement-components/create
            nl: /overeenkomstcomponenten/aanmaken
        title: "{{description}}"
        subtitle: "{{amountTotal}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Component details
                    nl: Componentgegevens
                  fields:
                    - description
                    - startDate
                    - endDate
                    - quantity
                    - unitId
                    - unitAmount
                - title:
                    en: Amounts
                    nl: Bedragen
                  fields:
                    - amountBase
                    - amountVat
                    - amountTotal
                - title:
                    en: Prolongation
                    nl: Prolongatie
                  fields:
                    - nextProlongationDate
                    - endProlongationDate
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create agreement component
              nl: Overeenkomstcomponent aanmaken
            groups:
              - title:
                  en: Component details
                  nl: Componentgegevens
                fields:
                  - description
                  - startDate
                  - endDate
                  - quantity
                  - unitId
                  - unitAmount
              - title:
                  en: Amounts
                  nl: Bedragen
                fields:
                  - amountBase
                  - amountVat
                  - amountTotal
              - title:
                  en: Prolongation
                  nl: Prolongatie
                fields:
                  - nextProlongationDate
                  - endProlongationDate
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit agreement component
              nl: Overeenkomstcomponent bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 2000
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
      nextProlongationDate:
        render:
          component: DatePicker
          props: {}
      endProlongationDate:
        render:
          component: DatePicker
          props: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
