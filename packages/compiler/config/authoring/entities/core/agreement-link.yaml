schemaVersion: 3
kind: coreEntity
module: core
entity: AgreementLink
title: Agreement Link
description: Typed link between two agreements (e.g. parent, replaces, derived-from).
language: en
displayTemplate: "{{linkType}}"
filterField: linkType
labels:
  en: Agreement link
  nl: Overeenkomstkoppeling
domains:
  - contracts
fields:
  - key: linkType
    required: true
    label:
      en: Link type
      nl: Koppelingstype
    description:
      en: Type of link between the two agreements (parent, replaces, replaced-by, derived-from).
      nl: Type koppeling tussen de twee overeenkomsten (bovenliggend, vervangt, vervangen door, afgeleid van).
    persisted:
      column: link_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: AGREEMENTLINKTYPE
    osfType: referenceDataCode
  - key: validFrom
    osfType: date
    required: false
    label:
      en: Valid from
      nl: Geldig vanaf
    description:
      en: Date from which the link is effective.
      nl: Datum vanaf wanneer de koppeling geldig is.
    persisted:
      column: valid_from
      storageClass: core
  - key: validTo
    osfType: date
    required: false
    label:
      en: Valid until
      nl: Geldig tot
    description:
      en: Date until which the link is effective.
      nl: Datum tot wanneer de koppeling geldig is.
    persisted:
      column: valid_to
      storageClass: core
  - key: fromAgreementId
    label:
      en: From agreement
      nl: Van overeenkomst
    persisted:
      column: from_agreement_id
      storageClass: core
    osfType: Agreement
    relationship:
      ownership: reference
      inverse: false
  - key: toAgreementId
    label:
      en: To agreement
      nl: Naar overeenkomst
    persisted:
      column: to_agreement_id
      storageClass: core
    osfType: Agreement
    relationship:
      ownership: reference
      inverse: false
authorization:
  roles:
    read:
      - Agreements.All.Read
      - Agreements.All.ReadWrite
    create:
      - Agreements.All.ReadWrite
    update:
      - Agreements.All.ReadWrite
    delete:
      - Agreements.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Agreement Link
    description: List AgreementLink records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Agreement Link
    description: Get AgreementLink records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Agreement Link
    description: Create AgreementLink records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update AgreementLink records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /agreement-links
          nl: /overeenkomstkoppelingen
        columns:
          - key: linkType
            sortable: true
          - key: validFrom
            sortable: true
          - key: validTo
            sortable: true
        title:
          en: Agreement links
          nl: Overeenkomstkoppelingen
        defaultSort:
          key: validFrom
          direction: desc
      record:
        routes:
          read:
            en: /agreement-links/:id
            nl: /overeenkomstkoppelingen/:id
          create:
            en: /agreement-links/create
            nl: /overeenkomstkoppelingen/aanmaken
        title: "{{linkType}}"
        subtitle: "{{validFrom}}"
        badges:
          - linkType
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Link details
                    nl: Koppelingsgegevens
                  fields:
                    - linkType
                    - validFrom
                    - validTo
        modes:
          create:
            title:
              en: Create agreement link
              nl: Overeenkomstkoppeling aanmaken
            groups:
              - title:
                  en: Link details
                  nl: Koppelingsgegevens
                fields:
                  - linkType
                  - validFrom
                  - validTo
          update:
            title:
              en: Edit agreement link
              nl: Overeenkomstkoppeling bewerken
    fields:
      linkType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: AGREEMENTLINKTYPE
            clearable: false
      validFrom:
        render:
          component: DatePicker
          props: {}
      validTo:
        render:
          component: DatePicker
          props: {}
