schemaVersion: 3
kind: coreEntity
module: core
entity: AgreementParty
title: Agreement Party
description: Party assigned to an agreement, scoped to a role and a validity period (canonical role pattern).
language: en
displayTemplate: "{{partyRole}}"
filterField: partyRole
labels:
  en: Agreement party
  nl: Overeenkomstpartij
domains:
  - contracts
authorization:
  roles:
    read:
      - Agreements.All.Read
      - Agreements.All.ReadWrite
    create:
      - Agreements.All.ReadWrite
    update:
      - Agreements.All.ReadWrite
    delete:
      - Agreements.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: agreementId
    required: true
    immutable: true
    osfType: Agreement
    label:
      en: Agreement
      nl: Overeenkomst
    description:
      en: Agreement this party takes part in. Set on creation and immutable afterwards.
      nl: Overeenkomst waaraan deze partij deelneemt. Wordt bij aanmaken gezet en kan daarna niet wijzigen.
    validation:
      format: uuid
    persisted:
      column: agreement_id
      storageClass: core
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
      inverse:
        key: parties
        label:
          en: Parties
          nl: Partijen
  - key: relationId
    required: true
    immutable: true
    osfType: Relation
    label:
      en: Relation
      nl: Relatie
    description:
      en: Relation that is the party. Set on creation and immutable afterwards; end this party and add another to change who
        takes part.
      nl: Relatie die de partij is. Wordt bij aanmaken gezet en kan daarna niet wijzigen; beëindig deze partij en voeg een
        nieuwe toe om de deelnemer te wijzigen.
    validation:
      format: uuid
    persisted:
      column: relation_id
      storageClass: core
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
  - key: partyRole
    osfType: string
    required: true
    label:
      en: Party role
      nl: Partijrol
    description:
      en: Role this party plays on the agreement (contractant, payer, representative, etc.).
      nl: Rol die deze partij op de overeenkomst vervult (contractant, betaler, vertegenwoordiger, etc.).
    persisted:
      column: party_role
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: AGREEMENTPARTYROLE
  - key: status
    osfType: string
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of this role assignment.
      nl: Levenscyclusstatus van deze roltoewijzing.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ROLEASSIGNMENTSTATUS
  - key: name
    osfType: string
    required: false
    label:
      en: Name
      nl: Naam
    description:
      en: Optional human-readable name of the role assignment.
      nl: Optionele menselijk leesbare naam van de roltoewijzing.
    validation:
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    osfType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the assignment.
      nl: Optionele omschrijving of zakelijke betekenis van de toewijzing.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which this party is effective on the agreement.
      nl: Datum vanaf wanneer deze partij geldig is op de overeenkomst.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which this party is effective on the agreement.
      nl: Datum tot wanneer deze partij geldig is op de overeenkomst.
    persisted:
      column: end_date
      storageClass: core
  - key: sharePercentage
    osfType: number
    required: false
    label:
      en: Share percentage
      nl: Aandeelpercentage
    description:
      en: Percentage of the agreement this party is responsible for (0-100). For role=payer parties on a billable
        sub-agreement, the active payer shares MUST sum to 100 within rounding tolerance; rounding remainders are
        absorbed by the primary payer.
      nl: Percentage van de overeenkomst waarvoor deze partij verantwoordelijk is (0-100). Voor partijen met rol=payer op een
        factureerbare subovereenkomst MOETEN de actieve aandelen tot 100 sommeren binnen afrondingstolerantie;
        afrondingsverschillen worden opgevangen door de primaire betaler.
    validation:
      min: 0
      max: 100
    persisted:
      column: share_percentage
      storageClass: core
  - key: primaryPayer
    osfType: boolean
    required: false
    label:
      en: Primary payer
      nl: Primaire betaler
    description:
      en: When true, this payer absorbs split-rounding remainders so per-payer collection totals add up to the invoice total
        exactly. Exactly one active payer per billable sub-agreement should be flagged primary.
      nl: Indien aangevinkt vangt deze betaler afrondingsverschillen op zodat de som van debiteurensplits exact gelijk is aan
        het factuurtotaal. Per factureerbare subovereenkomst is precies één actieve betaler primair.
    defaultValue: false
    persisted:
      column: primary_payer
      storageClass: core
  - key: paymentDay
    osfType: integer
    required: false
    label:
      en: Payment day
      nl: Betaaldag
    description:
      en: Preferred day-of-month (1-31) for collection from this party.
      nl: Voorkeursdag van de maand (1-31) voor incasso bij deze partij.
    validation:
      min: 1
      max: 31
    persisted:
      column: payment_day
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the role assignment in an external context.
      nl: Functionele of zakelijke code van de roltoewijzing in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: contractAddressId
    label:
      en: Contract address
      nl: Contractadres
    persisted:
      column: contract_address_id
      storageClass: core
    osfType: Address
    relationship:
      ownership: reference
  - key: addressAssignmentId
    label:
      en: Address assignment
      nl: Adrestoewijzing
    persisted:
      column: address_assignment_id
      storageClass: core
    osfType: AddressAssignment
    relationship:
      ownership: reference
  - key: paymentDetailId
    label:
      en: Payment detail
      nl: Betaalgegevens
    persisted:
      column: payment_detail_id
      storageClass: core
    osfType: PaymentDetail
    relationship:
      ownership: reference
  - key: preferredPaymentMethodId
    label:
      en: Preferred payment method
      nl: Voorkeursbetaalwijze
    persisted:
      column: preferred_payment_method_id
      storageClass: core
    osfType: PaymentMethod
    relationship:
      ownership: reference
operations:
  list:
    name: { en: List agreement parties, nl: Overeenkomstpartijen tonen }
    description:
      en: Returns a filtered and sorted page of agreement parties.
      nl: Geeft een gefilterde en gesorteerde pagina met overeenkomstpartijen terug.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  get:
    name: { en: Get agreement party, nl: Overeenkomstpartij ophalen }
    description:
      en: Returns one agreement party by its canonical id.
      nl: Geeft één overeenkomstpartij terug op basis van het canonieke id.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  create:
    name: { en: Create agreement party, nl: Overeenkomstpartij aanmaken }
    description:
      en: Adds one relation to one agreement in a party role after validating its canonical fields.
      nl: Voegt één relatie in een partijrol toe aan één overeenkomst na validatie van de canonieke velden.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    confirmation: { mode: none }
  update:
    name: { en: Update agreement party, nl: Overeenkomstpartij wijzigen }
    description:
      en: Updates one agreement party while holding its server-issued edit lease and current version.
      nl: Wijzigt één overeenkomstpartij met de server-uitgegeven bewerkingslease en actuele versie.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation: { mode: none }
  delete:
    name: { en: Delete agreement party, nl: Overeenkomstpartij verwijderen }
    description:
      en: Permanently deletes one agreement party after a server-issued, version-bound confirmation challenge.
      nl: Verwijdert één overeenkomstpartij definitief na een door de server uitgegeven, versiegebonden bevestigingsvraag.
    implementation: { type: entity, action: delete }
    effects: { data: delete, external: none }
    reliability:
      idempotency: { mode: natural }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation:
      mode: challenge
      challenge:
        kind: type-current-field
        field: partyRole
        issuedBy: server
        bindTo: [ subject, tenant, operation, target.id, target.version ]
        expiresAfter: PT5M
        singleUse: true

interfaces:
  rest: {}
  graphql: {}
  mcp:
    tools: generic
    operations:
      update:
        instructions:
          en: Acquire an edit lease first and submit its token with the version returned by get.
          nl: Vraag eerst een bewerkingslease aan en stuur het token mee met de versie uit get.
      delete:
        instructions:
          en: Acquire an edit lease first; request the confirmation challenge and answer it with the exact current party role.
          nl: Vraag eerst een bewerkingslease en bevestigingsvraag aan en beantwoord die met exact de actuele partijrol.
    resource:
      uri: app://agreement-parties
      name: Agreement parties
      description: Read the agreement parties available to the signed-in identity.
      templateDescription: Read one agreement party by its canonical id.
  web:
    views:
      collection:
        route:
          en: /agreement-parties
          nl: /overeenkomstpartijen
        title:
          en: Agreement parties
          nl: Overeenkomstpartijen
        columns:
          - key: partyRole
            sortable: true
          - key: name
            sortable: true
          - key: status
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
        defaultSort:
          key: startDate
          direction: desc
      record:
        routes:
          read:
            en: /agreement-parties/:id
            nl: /overeenkomstpartijen/:id
          create:
            en: /agreement-parties/create
            nl: /overeenkomstpartijen/aanmaken
        title: "{{name || partyRole}}"
        subtitle: "{{status}}"
        actions:
          - update
          - delete
        layout:
          context:
            fields:
              - partyRole
              - status
            relationships:
              - agreementId
              - relationId
              - contractAddressId
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Participation
                    nl: Deelname
                  fields:
                    - agreementId
                    - relationId
                - title:
                    en: Role details
                    nl: Rolgegevens
                  fields:
                    - partyRole
                    - status
                    - name
                    - startDate
                    - endDate
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Share and payment
                    nl: Aandeel en betaling
                  fields:
                    - sharePercentage
                    - primaryPayer
                    - paymentDay
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create agreement party
              nl: Overeenkomstpartij aanmaken
            groups:
              - title:
                  en: Participation
                  nl: Deelname
                fields:
                  - agreementId
                  - relationId
              - title:
                  en: Role details
                  nl: Rolgegevens
                fields:
                  - partyRole
                  - status
                  - name
                  - startDate
                  - endDate
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Share and payment
                  nl: Aandeel en betaling
                fields:
                  - sharePercentage
                  - primaryPayer
                  - paymentDay
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit agreement party
              nl: Overeenkomstpartij bewerken
            groups:
              - title:
                  en: Role details
                  nl: Rolgegevens
                fields:
                  - partyRole
                  - status
                  - name
                  - startDate
                  - endDate
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Share and payment
                  nl: Aandeel en betaling
                fields:
                  - sharePercentage
                  - primaryPayer
                  - paymentDay
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
