schemaVersion: 3
kind: coreEntity
module: core
entity: AgreementParty
title: Agreement Party
description: Party assigned to an agreement, scoped to a role and a validity period (canonical role pattern).
language: en
displayTemplate: "{{partyRole}}"
filterField: partyRole
labels:
  en: Agreement party
  nl: Overeenkomstpartij
domains:
  - contracts
fields:
  - key: partyRole
    valueType: string
    required: true
    label:
      en: Party role
      nl: Partijrol
    description:
      en: Role this party plays on the agreement (contractant, payer, representative, etc.).
      nl: Rol die deze partij op de overeenkomst vervult (contractant, betaler, vertegenwoordiger, etc.).
    persisted:
      column: party_role
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: AGREEMENTPARTYROLE
    semanticType: referenceDataCode
  - key: status
    valueType: string
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of this role assignment.
      nl: Levenscyclusstatus van deze roltoewijzing.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ROLEASSIGNMENTSTATUS
    semanticType: referenceDataCode
  - key: name
    valueType: string
    required: false
    label:
      en: Name
      nl: Naam
    description:
      en: Optional human-readable name of the role assignment.
      nl: Optionele menselijk leesbare naam van de roltoewijzing.
    validation:
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the assignment.
      nl: Optionele omschrijving of zakelijke betekenis van de toewijzing.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    semanticType: multilineText
  - key: startDate
    valueType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which this party is effective on the agreement.
      nl: Datum vanaf wanneer deze partij geldig is op de overeenkomst.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    valueType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which this party is effective on the agreement.
      nl: Datum tot wanneer deze partij geldig is op de overeenkomst.
    persisted:
      column: end_date
      storageClass: core
  - key: sharePercentage
    valueType: number
    required: false
    label:
      en: Share percentage
      nl: Aandeelpercentage
    description:
      en: Percentage of the agreement this party is responsible for (0-100). For role=payer parties on a billable
        sub-agreement, the active payer shares MUST sum to 100 within rounding tolerance; rounding remainders are
        absorbed by the primary payer.
      nl: Percentage van de overeenkomst waarvoor deze partij verantwoordelijk is (0-100). Voor partijen met rol=payer op een
        factureerbare subovereenkomst MOETEN de actieve aandelen tot 100 sommeren binnen afrondingstolerantie;
        afrondingsverschillen worden opgevangen door de primaire betaler.
    validation:
      min: 0
      max: 100
    persisted:
      column: share_percentage
      storageClass: core
  - key: primaryPayer
    valueType: boolean
    required: false
    label:
      en: Primary payer
      nl: Primaire betaler
    description:
      en: When true, this payer absorbs split-rounding remainders so per-payer collection totals add up to the invoice total
        exactly. Exactly one active payer per billable sub-agreement should be flagged primary.
      nl: Indien aangevinkt vangt deze betaler afrondingsverschillen op zodat de som van debiteurensplits exact gelijk is aan
        het factuurtotaal. Per factureerbare subovereenkomst is precies één actieve betaler primair.
    defaultValue: false
    persisted:
      column: primary_payer
      storageClass: core
  - key: paymentDay
    valueType: integer
    required: false
    label:
      en: Payment day
      nl: Betaaldag
    description:
      en: Preferred day-of-month (1-31) for collection from this party.
      nl: Voorkeursdag van de maand (1-31) voor incasso bij deze partij.
    validation:
      min: 1
      max: 31
    persisted:
      column: payment_day
      storageClass: core
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the role assignment in an external context.
      nl: Functionele of zakelijke code van de roltoewijzing in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: agreementId
    label:
      en: Agreement
      nl: Overeenkomst
    persisted:
      column: agreement_id
      storageClass: core
    semanticType: Agreement
    relationship:
      ownership: reference
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    semanticType: Relation
    relationship:
      ownership: reference
  - key: addressAssignmentId
    label:
      en: Address assignment
      nl: Adrestoewijzing
    persisted:
      column: address_assignment_id
      storageClass: core
    semanticType: AddressAssignment
    relationship:
      ownership: reference
  - key: paymentDetailId
    label:
      en: Payment detail
      nl: Betaalgegevens
    persisted:
      column: payment_detail_id
      storageClass: core
    semanticType: PaymentDetail
    relationship:
      ownership: reference
  - key: preferredPaymentMethodId
    label:
      en: Preferred payment method
      nl: Voorkeursbetaalwijze
    persisted:
      column: preferred_payment_method_id
      storageClass: core
    semanticType: PaymentMethod
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Agreements.All.Read
      - Agreements.All.ReadWrite
    create:
      - Agreements.All.ReadWrite
    update:
      - Agreements.All.ReadWrite
    delete:
      - Agreements.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Agreement Party
    description: List AgreementParty records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Agreement Party
    description: Get AgreementParty records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Agreement Party
    description: Create AgreementParty records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update AgreementParty records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /agreement-parties
          nl: /overeenkomstpartijen
        columns:
          - key: partyRole
            sortable: true
          - key: name
            sortable: true
          - key: status
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
        title:
          en: Agreement parties
          nl: Overeenkomstpartijen
        defaultSort:
          key: startDate
          direction: desc
      record:
        routes:
          read:
            en: /agreement-parties/:id
            nl: /overeenkomstpartijen/:id
          create:
            en: /agreement-parties/create
            nl: /overeenkomstpartijen/aanmaken
        title: "{{name || partyRole}}"
        subtitle: "{{status}}"
        badges:
          - partyRole
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Role details
                    nl: Rolgegevens
                  fields:
                    - partyRole
                    - status
                    - name
                    - startDate
                    - endDate
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Share and payment
                    nl: Aandeel en betaling
                  fields:
                    - sharePercentage
                    - paymentDay
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create agreement party
              nl: Overeenkomstpartij aanmaken
            groups:
              - title:
                  en: Role details
                  nl: Rolgegevens
                fields:
                  - partyRole
                  - status
                  - name
                  - startDate
                  - endDate
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Share and payment
                  nl: Aandeel en betaling
                fields:
                  - sharePercentage
                  - paymentDay
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit agreement party
              nl: Overeenkomstpartij bewerken
    fields:
      partyRole:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: AGREEMENTPARTYROLE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ROLEASSIGNMENTSTATUS
            clearable: true
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
