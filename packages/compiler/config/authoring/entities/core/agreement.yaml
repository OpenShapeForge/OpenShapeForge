schemaVersion: 3
kind: coreEntity
module: core
entity: Agreement
title: Agreement
description: Canonical contract-management agreement linked to a primary relation and optionally to a parent agreement.
  Hierarchy is strict — every billable agreement is a sub agreement (role=sub) hanging under a non-billable master
  umbrella (role=master). Billing schedules and components attach only to sub agreements.
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Agreement
  nl: Overeenkomst
domains:
  - contracts
authorization:
  roles:
    read:
      - Agreements.All.Read
      - Agreements.All.ReadWrite
    create:
      - Agreements.All.ReadWrite
    update:
      - Agreements.All.ReadWrite
    delete:
      - Agreements.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    valueType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Human-used agreement code for search, display, and correspondence.
      nl: Door mensen gebruikte overeenkomstcode voor zoeken, weergave en correspondentie.
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: code
      storageClass: core
  - key: role
    valueType: string
    required: true
    label:
      en: Hierarchy role
      nl: Hierarchierol
    description:
      en: Whether this agreement is a non-billable master umbrella or a billable sub agreement under a master.
      nl: Bepaalt of dit een niet-factureerbare hoofdovereenkomst (master) is of een factureerbare subovereenkomst (sub) onder
        een master.
    defaultValue: sub
    persisted:
      column: role
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: AGREEMENTROLE
  - key: agreementType
    valueType: string
    required: true
    label:
      en: Agreement type
      nl: Overeenkomsttype
    description:
      en: Canonical type of agreement, such as lease, service, sale, or employment.
      nl: Canoniek type overeenkomst, zoals huur, service, koop of arbeid.
    persisted:
      column: agreement_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: AGREEMENTTYPE
  - key: agreementSubType
    valueType: string
    required: false
    label:
      en: Agreement subtype
      nl: Overeenkomstsubtype
    description:
      en: More detailed classification of the agreement inside the chosen type.
      nl: Nadere classificatie van de overeenkomst binnen het gekozen type.
    validation:
      maxLength: 100
    persisted:
      column: agreement_sub_type
      storageClass: core
  - key: status
    valueType: string
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Current lifecycle status of the agreement.
      nl: Huidige levenscyclusstatus van de overeenkomst.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: AGREEMENTSTATUS
  - key: startDate
    valueType: date
    required: false
    label:
      en: Start date
      nl: Begindatum
    description:
      en: Effective start date of the agreement.
      nl: Ingangsdatum van de overeenkomst.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    valueType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Effective end date of the agreement.
      nl: Einddatum van de overeenkomst.
    persisted:
      column: end_date
      storageClass: core
  - key: billingStartDate
    valueType: date
    required: false
    label:
      en: Billing start date
      nl: Facturatiebegindatum
    description:
      en: Date from which invoicing starts for the agreement.
      nl: Datum vanaf wanneer de facturatie voor de overeenkomst start.
    persisted:
      column: billing_start_date
      storageClass: core
  - key: billingEndDate
    valueType: date
    required: false
    label:
      en: Billing end date
      nl: Facturatieeinddatum
    description:
      en: Date until which invoicing applies for the agreement.
      nl: Datum tot wanneer facturatie voor de overeenkomst van toepassing is.
    persisted:
      column: billing_end_date
      storageClass: core
  - key: conceptSentAt
    valueType: datetime
    required: false
    label:
      en: Concept sent at
      nl: Concept verstuurd op
    description:
      en: Timestamp when a concept version of the agreement was sent.
      nl: Tijdstip waarop een conceptversie van de overeenkomst is verstuurd.
    persisted:
      column: concept_sent_at
      storageClass: core
  - key: sentAt
    valueType: datetime
    required: false
    label:
      en: Sent at
      nl: Verstuurd op
    description:
      en: Timestamp when the agreement was formally sent.
      nl: Tijdstip waarop de overeenkomst formeel is verstuurd.
    persisted:
      column: sent_at
      storageClass: core
  - key: dispatchStatus
    valueType: string
    required: false
    label:
      en: Dispatch status
      nl: Verstuurstatus
    description:
      en: Operational status of dispatching or delivering the agreement.
      nl: Operationele status van het versturen of afleveren van de overeenkomst.
    validation:
      maxLength: 100
    persisted:
      column: dispatch_status
      storageClass: core
  - key: noticeDate
    valueType: date
    required: false
    label:
      en: Notice date
      nl: Opzegdatum
    description:
      en: Date on which notice was given for the agreement.
      nl: Datum waarop de overeenkomst is opgezegd.
    persisted:
      column: notice_date
      storageClass: core
  - key: noticeTerm
    valueType: string
    required: false
    label:
      en: Notice term
      nl: Opzegtermijn
    description:
      en: Applicable notice term for terminating the agreement.
      nl: Geldende opzegtermijn voor het beëindigen van de overeenkomst.
    validation:
      maxLength: 100
    persisted:
      column: notice_term
      storageClass: core
  - key: terminationReason
    valueType: string
    required: false
    label:
      en: Termination reason
      nl: Beëindigingsreden
    description:
      en: Main reason for ending the agreement.
      nl: Hoofdreden voor het beëindigen van de overeenkomst.
    validation:
      maxLength: 100
    persisted:
      column: termination_reason
      storageClass: core
  - key: terminationReasonDetail
    valueType: string
    required: false
    label:
      en: Termination reason detail
      nl: Detail beëindigingsreden
    description:
      en: More detailed termination reason for the agreement.
      nl: Nader gespecificeerde beëindigingsreden van de overeenkomst.
    validation:
      maxLength: 100
    persisted:
      column: termination_reason_detail
      storageClass: core
  - key: sequenceNumber
    valueType: string
    required: false
    label:
      en: Sequence number
      nl: Volgnummer
    description:
      en: Functional sequence number of the agreement within its lifecycle.
      nl: Functioneel volgnummer van de overeenkomst binnen de levenscyclus.
    validation:
      maxLength: 50
    persisted:
      column: sequence_number
      storageClass: core
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the agreement in an external context.
      nl: Functionele of zakelijke code van de overeenkomst in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    semanticType: Relation
    relationship:
      ownership: reference
  - key: caseId
    label:
      en: Case
      nl: Zaak
    persisted:
      column: case_id
      storageClass: core
    semanticType: Case
    relationship:
      ownership: reference
  - key: parentAgreementId
    label:
      en: Parent agreement
      nl: Bovenliggende overeenkomst
    persisted:
      column: parent_agreement_id
      storageClass: core
    semanticType: Agreement
    relationship:
      ownership: reference
  - key: childAgreements
    label:
      en: Child agreements
      nl: Onderliggende overeenkomsten
    semanticType: Agreement
    cardinality: collection
    relationship:
      inverse: parentAgreementId
      ownership: reference
operations:
  list:
    name: { en: List agreements, nl: Overeenkomsten tonen }
    description:
      en: Returns a filtered and sorted page of agreements.
      nl: Geeft een gefilterde en gesorteerde pagina met overeenkomsten terug.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  get:
    name: { en: Get agreement, nl: Overeenkomst ophalen }
    description:
      en: Returns one agreement by its canonical id.
      nl: Geeft één overeenkomst terug op basis van het canonieke id.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  create:
    name: { en: Create agreement, nl: Overeenkomst aanmaken }
    description:
      en: Creates one agreement after validating its canonical fields.
      nl: Maakt één overeenkomst aan na validatie van de canonieke velden.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    confirmation: { mode: none }
  update:
    name: { en: Update agreement, nl: Overeenkomst wijzigen }
    description:
      en: Updates one agreement while holding its server-issued edit lease and current version.
      nl: Wijzigt één overeenkomst met de server-uitgegeven bewerkingslease en actuele versie.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation: { mode: none }
  delete:
    name: { en: Delete agreement, nl: Overeenkomst verwijderen }
    description:
      en: Permanently deletes one agreement after a server-issued, version-bound confirmation challenge.
      nl: Verwijdert één overeenkomst definitief na een door de server uitgegeven, versiegebonden bevestigingsvraag.
    implementation: { type: entity, action: delete }
    effects: { data: delete, external: none }
    reliability:
      idempotency: { mode: natural }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation:
      mode: challenge
      challenge:
        kind: type-current-field
        field: code
        issuedBy: server
        bindTo: [ subject, tenant, operation, target.id, target.version ]
        expiresAfter: PT5M
        singleUse: true

interfaces:
  rest: {}
  graphql: {}
  mcp:
    tools: generic
  web:
    views:
      collection:
        route: { en: /agreements, nl: /overeenkomsten }
        title: { en: Agreements, nl: Overeenkomsten }
        columns:
          - { key: code, sortable: true }
          - { key: agreementType, sortable: true }
          - { key: role, sortable: true }
          - { key: status, sortable: true }
          - { key: startDate, sortable: true }
          - { key: endDate, sortable: true }
        defaultSort: { key: code, direction: asc }
      record:
        routes:
          read: { en: /agreements/:id, nl: /overeenkomsten/:id }
          create: { en: /agreements/new, nl: /overeenkomsten/nieuw }
        title: "{{code}}"
        subtitle: "{{agreementType}}"
        actions: [ update, delete ]
        layout:
          context:
            fields: [ status, role, startDate, endDate ]
            relationships: [ relationId, caseId, parentAgreementId ]
          tabs:
            - id: overview
              label: { en: Overview, nl: Overzicht }
              groups:
                - title: { en: Agreement, nl: Overeenkomst }
                  fields: [ code, role, agreementType, agreementSubType, status ]
                - title: { en: Term, nl: Looptijd }
                  fields: [ startDate, endDate, billingStartDate, billingEndDate, noticeDate, noticeTerm ]
                - title: { en: Dispatch, nl: Verzending }
                  fields: [ conceptSentAt, sentAt, dispatchStatus ]
                - title: { en: Termination, nl: Beëindiging }
                  fields: [ terminationReason, terminationReasonDetail ]
                - title: { en: References, nl: Referenties }
                  fields: [ sequenceNumber, externalCode ]
            - id: childAgreements
              label: { en: Child agreements, nl: Onderliggende overeenkomsten }
              relationship: childAgreements
        modes:
          create:
            title: { en: Create agreement, nl: Overeenkomst aanmaken }
            groups:
              - title: { en: Agreement, nl: Overeenkomst }
                fields: [ code, role, agreementType, agreementSubType, status ]
              - title: { en: Term, nl: Looptijd }
                fields: [ startDate, endDate, billingStartDate, billingEndDate, noticeDate, noticeTerm ]
              - title: { en: Dispatch, nl: Verzending }
                fields: [ conceptSentAt, sentAt, dispatchStatus ]
              - title: { en: Termination, nl: Beëindiging }
                fields: [ terminationReason, terminationReasonDetail ]
              - title: { en: References, nl: Referenties }
                fields: [ sequenceNumber, externalCode ]
          update:
            title: { en: Update agreement, nl: Overeenkomst wijzigen }
