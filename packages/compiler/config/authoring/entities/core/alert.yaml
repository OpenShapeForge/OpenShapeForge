schemaVersion: 3
kind: coreEntity
module: core
entity: Alert
title: Alert
description: Generic CRM alert or signal indicating that something needs attention on a relation, agreement, case,
  asset, or other subject.
language: en
displayTemplate: "{{code}} {{title}}"
filterField: code
labels:
  en: Alert
  nl: Melding
domains:
  - crm
  - relations
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique alert code.
      nl: Tenant-unieke meldingscode.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: title
    osfType: string
    required: true
    label:
      en: Title
      nl: Titel
    description:
      en: Short title summarizing the alert.
      nl: Korte titel die de melding samenvat.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: title
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Detailed description of the alert.
      nl: Uitgebreide omschrijving van de melding.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: severity
    required: true
    label:
      en: Severity
      nl: Ernst
    description:
      en: Severity classification of the alert.
      nl: Ernstclassificatie van de melding.
    persisted:
      column: severity
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ALERTSEVERITY
    osfType: referenceDataCode
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the alert.
      nl: Levenscyclusstatus van de melding.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ALERTSTATUS
    osfType: referenceDataCode
  - key: raisedAt
    osfType: datetime
    required: true
    label:
      en: Raised at
      nl: Aangemaakt op
    description:
      en: Date and time when the alert was raised.
      nl: Datum en tijd waarop de melding is aangemaakt.
    persisted:
      column: raised_at
      storageClass: core
  - key: resolvedAt
    osfType: datetime
    required: false
    label:
      en: Resolved at
      nl: Opgelost op
    description:
      en: Date and time when the alert was resolved.
      nl: Datum en tijd waarop de melding is opgelost.
    persisted:
      column: resolved_at
      storageClass: core
  - key: dueDate
    osfType: date
    required: false
    label:
      en: Due date
      nl: Streefdatum
    description:
      en: Date by which the alert should be addressed.
      nl: Datum waarvoor de melding moet worden afgehandeld.
    persisted:
      column: due_date
      storageClass: core
  - key: subjectType
    osfType: string
    required: false
    label:
      en: Subject type
      nl: Type onderwerp
    description:
      en: Discriminator describing what kind of entity the alert refers to (e.g. relation, agreement, case, asset, invoice).
      nl: Discriminator die aangeeft op welk soort entiteit de melding betrekking heeft (bijv. relatie, overeenkomst, zaak,
        object, factuur).
    validation:
      maxLength: 100
    persisted:
      column: subject_type
      storageClass: core
  - key: subjectId
    osfType: string
    required: false
    label:
      en: Subject ID
      nl: Onderwerp-id
    description:
      en: Identifier of the subject record (loose pointer; resolved via subject type).
      nl: Identificatie van het onderwerp (losse verwijzing; wordt opgelost via type onderwerp).
    persisted:
      column: subject_id
      storageClass: core
    validation:
      format: uuid
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the alert in an external context.
      nl: Functionele of zakelijke code van de melding in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse: false
  - key: assignedToId
    label:
      en: Assigned to
      nl: Toegewezen aan
    persisted:
      column: assigned_to_relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse: false
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Alert
    description: List Alert records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Alert
    description: Get Alert records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Alert
    description: Create Alert records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Alert records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /alerts
          nl: /meldingen
        columns:
          - key: code
            sortable: true
          - key: title
            sortable: true
          - key: severity
            sortable: true
          - key: status
            sortable: true
          - key: raisedAt
            sortable: true
          - key: dueDate
            sortable: true
        title:
          en: Alerts
          nl: Meldingen
        defaultSort:
          key: raisedAt
          direction: desc
      record:
        routes:
          read:
            en: /alerts/:id
            nl: /meldingen/:id
          create:
            en: /alerts/create
            nl: /meldingen/aanmaken
        title: "{{code}} {{title}}"
        subtitle: "{{severity}}"
        badges:
          - severity
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Alert details
                    nl: Meldinggegevens
                  fields:
                    - code
                    - title
                    - severity
                    - status
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Timing
                    nl: Tijdlijn
                  fields:
                    - raisedAt
                    - dueDate
                    - resolvedAt
                - title:
                    en: Subject
                    nl: Onderwerp
                  fields:
                    - subjectType
                    - subjectId
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create alert
              nl: Melding aanmaken
            groups:
              - title:
                  en: Alert details
                  nl: Meldinggegevens
                fields:
                  - code
                  - title
                  - severity
                  - status
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Timing
                  nl: Tijdlijn
                fields:
                  - raisedAt
                  - dueDate
                  - resolvedAt
              - title:
                  en: Subject
                  nl: Onderwerp
                fields:
                  - subjectType
                  - subjectId
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit alert
              nl: Melding bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
      severity:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ALERTSEVERITY
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ALERTSTATUS
            clearable: false
      raisedAt:
        render:
          component: DateTimePicker
          props: {}
      resolvedAt:
        render:
          component: DateTimePicker
          props: {}
      dueDate:
        render:
          component: DatePicker
          props: {}
