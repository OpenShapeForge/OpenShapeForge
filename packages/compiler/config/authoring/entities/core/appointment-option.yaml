schemaVersion: 3
kind: coreEntity
module: core
entity: AppointmentOption
title: Appointment Option
description: A candidate time slot offered as part of an appointment request, that can be accepted to produce an appointment.
language: en
displayTemplate: "#{{optionNumber}} {{startsAt}}"
filterField: id
labels:
  en: Appointment option
  nl: Afspraakoptie
pluralLabels:
  en: Appointment options
  nl: Afspraakopties
domains:
  - crm
  - relations
fields:
  - key: optionNumber
    osfType: integer
    required: true
    label:
      en: Option number
      nl: Optienummer
    description:
      en: Sequential option number within the appointment request.
      nl: Volgnummer van de optie binnen het afspraakverzoek.
    persisted:
      column: option_number
      storageClass: core
  - key: startsAt
    osfType: datetime
    required: true
    label:
      en: Starts at
      nl: Start op
    description:
      en: Date and time when the candidate slot starts.
      nl: Datum en tijd waarop het voorgestelde tijdvak start.
    persisted:
      column: starts_at
      storageClass: core
  - key: endsAt
    osfType: datetime
    required: true
    label:
      en: Ends at
      nl: Eindigt op
    description:
      en: Date and time when the candidate slot ends.
      nl: Datum en tijd waarop het voorgestelde tijdvak eindigt.
    persisted:
      column: ends_at
      storageClass: core
  - key: location
    osfType: string
    required: false
    label:
      en: Location
      nl: Locatie
    description:
      en: Location where the appointment would take place if this option is accepted.
      nl: Locatie waar de afspraak zou plaatsvinden als deze optie wordt geaccepteerd.
    validation:
      maxLength: 500
    persisted:
      column: location
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the appointment option.
      nl: Levenscyclusstatus van de afspraakoptie.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: APPOINTMENTOPTIONSTATUS
    osfType: referenceDataCode
  - key: notes
    required: false
    label:
      en: Notes
      nl: Notities
    description:
      en: Free-form notes about this appointment option.
      nl: Vrije notities over deze afspraakoptie.
    validation:
      maxLength: 1000
    persisted:
      column: notes
      storageClass: core
    osfType: multilineText
  - key: appointmentRequestId
    label:
      en: Appointment request
      nl: Afspraakverzoek
    persisted:
      column: appointment_request_id
      storageClass: core
    osfType: AppointmentRequest
    relationship:
      ownership: reference
      inverse:
        key: options
        label:
          en: Options
          nl: Opties
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Appointment Option
    description: List AppointmentOption records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Appointment Option
    description: Get AppointmentOption records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Appointment Option
    description: Create AppointmentOption records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update AppointmentOption records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /appointment-options
          nl: /afspraakopties
        columns:
          - key: optionNumber
            sortable: true
          - key: startsAt
            sortable: true
          - key: endsAt
            sortable: true
          - key: status
            sortable: true
          - key: location
            sortable: false
        title:
          en: Appointment options
          nl: Afspraakopties
        defaultSort:
          key: startsAt
          direction: asc
      record:
        routes:
          read:
            en: /appointment-options/:id
            nl: /afspraakopties/:id
          create:
            en: /appointment-options/create
            nl: /afspraakopties/aanmaken
        title: "#{{optionNumber}} {{startsAt}}"
        subtitle: "{{status}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Option details
                    nl: Optiegegevens
                  fields:
                    - optionNumber
                    - status
                    - location
                - title:
                    en: Schedule
                    nl: Planning
                  fields:
                    - startsAt
                    - endsAt
                - title:
                    en: Notes
                    nl: Notities
                  fields:
                    - notes
        modes:
          create:
            title:
              en: Create appointment option
              nl: Afspraakoptie aanmaken
            groups:
              - title:
                  en: Option details
                  nl: Optiegegevens
                fields:
                  - optionNumber
                  - status
                  - location
              - title:
                  en: Schedule
                  nl: Planning
                fields:
                  - startsAt
                  - endsAt
              - title:
                  en: Notes
                  nl: Notities
                fields:
                  - notes
          update:
            title:
              en: Edit appointment option
              nl: Afspraakoptie bewerken
    fields:
      startsAt:
        render:
          component: DateTimePicker
          props: {}
      endsAt:
        render:
          component: DateTimePicker
          props: {}
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: APPOINTMENTOPTIONSTATUS
            clearable: false
      notes:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 1000
