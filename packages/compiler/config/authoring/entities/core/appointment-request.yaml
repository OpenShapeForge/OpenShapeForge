schemaVersion: 3
kind: coreEntity
module: core
entity: AppointmentRequest
title: Appointment Request
description: A request to schedule an appointment, typically resulting in a list of candidate time slots that can be
  accepted into an appointment.
language: en
displayTemplate: "{{code}} {{title}}"
filterField: code
labels:
  en: Appointment request
  nl: Afspraakverzoek
pluralLabels:
  en: Appointment requests
  nl: Afspraakverzoeken
domains:
  - crm
  - relations
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique appointment request code.
      nl: Tenant-unieke code van het afspraakverzoek.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: title
    osfType: string
    required: true
    label:
      en: Title
      nl: Titel
    description:
      en: Short title summarizing the appointment request.
      nl: Korte titel die het afspraakverzoek samenvat.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: title
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Detailed description or context of the appointment request.
      nl: Uitgebreide omschrijving of context van het afspraakverzoek.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the appointment request.
      nl: Levenscyclusstatus van het afspraakverzoek.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: APPOINTMENTREQUESTSTATUS
    osfType: referenceDataCode
  - key: requestedAt
    osfType: datetime
    required: true
    label:
      en: Requested at
      nl: Aangevraagd op
    description:
      en: Date and time when the appointment request was created.
      nl: Datum en tijd waarop het afspraakverzoek is aangemaakt.
    persisted:
      column: requested_at
      storageClass: core
  - key: respondedAt
    osfType: datetime
    required: false
    label:
      en: Responded at
      nl: Beantwoord op
    description:
      en: Date and time when the appointment request was responded to.
      nl: Datum en tijd waarop op het afspraakverzoek is gereageerd.
    persisted:
      column: responded_at
      storageClass: core
  - key: subjectType
    osfType: string
    required: false
    label:
      en: Subject type
      nl: Type onderwerp
    description:
      en: Discriminator describing what kind of entity the appointment request refers to (e.g. agreement, case, maintenance
        order).
      nl: Discriminator die aangeeft op welk soort entiteit het afspraakverzoek betrekking heeft (bijv. overeenkomst, zaak,
        onderhoudsorder).
    validation:
      maxLength: 100
    persisted:
      column: subject_type
      storageClass: core
  - key: subjectId
    osfType: string
    required: false
    label:
      en: Subject ID
      nl: Onderwerp-id
    description:
      en: Identifier of the subject record (loose pointer; resolved via subject type).
      nl: Identificatie van het onderwerp (losse verwijzing; wordt opgelost via type onderwerp).
    persisted:
      column: subject_id
      storageClass: core
    validation:
      format: uuid
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the appointment request in an external context.
      nl: Functionele of zakelijke code van het afspraakverzoek in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  # System-written by scheduling: the appointment this request became, not an input.
  - key: appointmentId
    readOnly: true
    label:
      en: Appointment
      nl: Afspraak
    persisted:
      column: appointment_id
      storageClass: core
    osfType: Appointment
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Appointment Request
    description: List AppointmentRequest records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Appointment Request
    description: Get AppointmentRequest records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Appointment Request
    description: Create AppointmentRequest records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update AppointmentRequest records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /appointment-requests
          nl: /afspraakverzoeken
        columns:
          - key: code
            sortable: true
          - key: title
            sortable: true
          - key: status
            sortable: true
          - key: requestedAt
            sortable: true
          - key: respondedAt
            sortable: true
        title:
          en: Appointment requests
          nl: Afspraakverzoeken
        defaultSort:
          key: requestedAt
          direction: desc
      record:
        routes:
          read:
            en: /appointment-requests/:id
            nl: /afspraakverzoeken/:id
          create:
            en: /appointment-requests/create
            nl: /afspraakverzoeken/aanmaken
        title: "{{code}} {{title}}"
        subtitle: "{{status}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Request details
                    nl: Verzoekgegevens
                  fields:
                    - code
                    - title
                    - status
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Timing
                    nl: Tijdlijn
                  fields:
                    - requestedAt
                    - respondedAt
                - title:
                    en: Subject
                    nl: Onderwerp
                  fields:
                    - subjectType
                    - subjectId
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
            - id: options
              label:
                en: Options
                nl: Opties
              relationship: options
        modes:
          create:
            title:
              en: Create appointment request
              nl: Afspraakverzoek aanmaken
            groups:
              - title:
                  en: Request details
                  nl: Verzoekgegevens
                fields:
                  - code
                  - title
                  - status
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Timing
                  nl: Tijdlijn
                fields:
                  - requestedAt
                  - respondedAt
              - title:
                  en: Subject
                  nl: Onderwerp
                fields:
                  - subjectType
                  - subjectId
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit appointment request
              nl: Afspraakverzoek bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: APPOINTMENTREQUESTSTATUS
            clearable: false
      requestedAt:
        render:
          component: DateTimePicker
          props: {}
      respondedAt:
        render:
          component: DateTimePicker
          props: {}
