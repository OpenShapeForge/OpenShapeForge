schemaVersion: 3
kind: coreEntity
module: core
entity: Appointment
title: Appointment
description: A scheduled appointment or meeting associated with a relation.
language: en
displayTemplate: "{{subject}}"
filterField: subject
labels:
  en: Appointment
  nl: Afspraak
authorization:
  roles:
    read:
      - General.All.Read
      - General.All.ReadWrite
    create:
      - General.All.ReadWrite
    update:
      - General.All.ReadWrite
    delete:
      - General.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: subject
    osfType: string
    required: true
    label:
      en: Subject
      nl: Onderwerp
    description:
      en: Subject or title of the appointment.
      nl: Onderwerp of titel van de afspraak.
    validation:
      minLength: 1
      maxLength: 300
    persisted:
      column: subject
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Beschrijving
    description:
      en: Detailed description or agenda of the appointment.
      nl: Gedetailleerde beschrijving of agenda van de afspraak.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: startDateTime
    osfType: datetime
    required: true
    label:
      en: Start date/time
      nl: Startdatum/-tijd
    description:
      en: Date and time when the appointment starts.
      nl: Datum en tijd waarop de afspraak begint.
    persisted:
      column: start_date_time
      storageClass: core
  - key: endDateTime
    osfType: datetime
    required: false
    label:
      en: End date/time
      nl: Einddatum/-tijd
    description:
      en: Date and time when the appointment ends.
      nl: Datum en tijd waarop de afspraak eindigt.
    persisted:
      column: end_date_time
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Current status of the appointment (e.g. scheduled, completed, cancelled).
      nl: Huidige status van de afspraak (bijv. gepland, afgerond, geannuleerd).
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: APPOINTMENTSTATUS
    osfType: referenceDataCode
  - key: location
    osfType: string
    required: false
    label:
      en: Location
      nl: Locatie
    description:
      en: Location where the appointment takes place.
      nl: Locatie waar de afspraak plaatsvindt.
    validation:
      maxLength: 300
    persisted:
      column: location
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  - key: caseId
    label:
      en: Case
      nl: Zaak
    persisted:
      column: case_id
      storageClass: core
    osfType: Case
    relationship:
      ownership: reference
      inverse:
        label:
          en: Appointments
          nl: Afspraken
operations:
  list:
    name: List Appointment
    description: List Appointment records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Appointment
    description: Get Appointment records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Appointment
    description: Create Appointment records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Appointment records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /appointments
          nl: /afspraken
        columns:
          - key: subject
            sortable: true
          - key: startDateTime
            sortable: true
          - key: status
            sortable: true
          - key: location
            sortable: false
        title:
          en: Appointments
          nl: Afspraken
        defaultSort:
          key: startDateTime
          direction: desc
      record:
        routes:
          read:
            en: /appointments/:id
            nl: /afspraken/:id
          create:
            en: /appointments/create
            nl: /afspraken/aanmaken
        title: "{{subject}}"
        subtitle: "{{startDateTime}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Appointment details
                    nl: Afspraakgegevens
                  fields:
                    - subject
                    - description
                    - status
                    - location
                - title:
                    en: Schedule
                    nl: Planning
                  fields:
                    - startDateTime
                    - endDateTime
            - id: tasks
              label:
                en: Tasks
                nl: Taken
              relationship: tasks
        modes:
          create:
            title:
              en: Create appointment
              nl: Afspraak aanmaken
            groups:
              - title:
                  en: Appointment details
                  nl: Afspraakgegevens
                fields:
                  - subject
                  - description
                  - status
                  - location
              - title:
                  en: Schedule
                  nl: Planning
                fields:
                  - startDateTime
                  - endDateTime
          update:
            title:
              en: Edit appointment
              nl: Afspraak bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
      startDateTime:
        render:
          component: DateTimePicker
          props: {}
      endDateTime:
        render:
          component: DateTimePicker
          props: {}
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: APPOINTMENTSTATUS
            clearable: false
