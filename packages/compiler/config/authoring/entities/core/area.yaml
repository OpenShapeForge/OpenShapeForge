schemaVersion: 3
kind: coreEntity
module: core
entity: Area
title: Area
description: Surface-area record optionally bound to an asset, building, or space.
language: en
displayTemplate: "{{value}} {{unitId}}"
filterField: id
labels:
  en: Area
  nl: Oppervlakte
pluralLabels:
  en: Areas
  nl: Oppervlakten
domains:
  - asset
fields:
  - key: value
    osfType: number
    required: true
    label:
      en: Value
      nl: Waarde
    description:
      en: Numeric area value.
      nl: Numerieke oppervlaktewaarde.
    persisted:
      column: value
      storageClass: core
  - key: unitId
    osfType: string
    required: true
    label:
      en: Unit
      nl: Eenheid
    description:
      en: Unit of measurement for the area (default "m2").
      nl: Meeteenheid voor de oppervlakte (standaard "m2").
    defaultValue: m2
    validation:
      minLength: 1
      maxLength: 20
    persisted:
      column: unit_id
      storageClass: core
  - key: measuredAt
    osfType: date
    required: false
    label:
      en: Measured at
      nl: Gemeten op
    description:
      en: Date on which the area was measured.
      nl: Datum waarop de oppervlakte is gemeten.
    persisted:
      column: measured_at
      storageClass: core
  - key: methodCode
    osfType: string
    required: false
    label:
      en: Method code
      nl: Meetmethode
    description:
      en: Optional code identifying the measurement method.
      nl: Optionele code die de meetmethode identificeert.
    validation:
      maxLength: 50
    persisted:
      column: method_code
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the area in an external context.
      nl: Functionele of zakelijke code van de oppervlakte in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: assetId
    label:
      en: Asset
      nl: Object
    persisted:
      column: asset_id
      storageClass: core
    osfType: Asset
    relationship:
      ownership: reference
  - key: buildingId
    label:
      en: Building
      nl: Pand
    persisted:
      column: building_id
      storageClass: core
    osfType: Building
    relationship:
      ownership: reference
  - key: spaceId
    label:
      en: Space
      nl: Ruimte
    persisted:
      column: space_id
      storageClass: core
    osfType: Space
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - RealEstate.All.Read
      - RealEstate.All.ReadWrite
    create:
      - RealEstate.All.ReadWrite
    update:
      - RealEstate.All.ReadWrite
    delete:
      - RealEstate.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Area
    description: List Area records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Area
    description: Get Area records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Area
    description: Create Area records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Area records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /areas
          nl: /oppervlakten
        columns:
          - key: value
            sortable: true
          - key: unitId
            sortable: true
          - key: measuredAt
            sortable: true
          - key: methodCode
            sortable: true
        title:
          en: Areas
          nl: Oppervlakten
        defaultSort:
          key: measuredAt
          direction: desc
      record:
        routes:
          read:
            en: /areas/:id
            nl: /oppervlakten/:id
          create:
            en: /areas/create
            nl: /oppervlakten/aanmaken
        title: "{{value}} {{unitId}}"
        subtitle: "{{measuredAt}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Area details
                    nl: Oppervlaktegegevens
                  fields:
                    - value
                    - unitId
                    - measuredAt
                    - methodCode
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create area
              nl: Oppervlakte aanmaken
            groups:
              - title:
                  en: Area details
                  nl: Oppervlaktegegevens
                fields:
                  - value
                  - unitId
                  - measuredAt
                  - methodCode
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit area
              nl: Oppervlakte bewerken
    fields:
      measuredAt:
        render:
          component: DatePicker
          props: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
