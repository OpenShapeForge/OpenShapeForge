schemaVersion: 1
kind: coreEntity
module: core
entity: AssetCondition
title: Asset Condition
description: Periodic condition observation for an asset, scoring against a configurable scale.
language: en
displayTemplate: "{{assessedAt}}"
filterField: id
labels:
  en: Asset condition
  nl: Conditie
domains:
  - asset
fields:
  - key: assessedAt
    valueType: datetime
    required: true
    label:
      en: Assessed at
      nl: Beoordeeld op
    description:
      en: Timestamp when the condition was assessed.
      nl: Tijdstip waarop de conditie is beoordeeld.
    persisted:
      column: assessed_at
      storageClass: core
    render:
      component: DateTimePicker
      props: {}
  - key: score
    valueType: number
    required: false
    label:
      en: Score
      nl: Score
    description:
      en: Numeric condition score.
      nl: Numerieke conditiescore.
    persisted:
      column: score
      storageClass: core
  - key: scoreScale
    valueType: string
    required: false
    label:
      en: Score scale
      nl: Scoreschaal
    description:
      en: Scale on which the score is expressed.
      nl: Schaal waarop de score is uitgedrukt.
    persisted:
      column: score_scale
      storageClass: core
    render:
      component: ReferenceSelect
      props:
        referentieGroep: ASSESSMENTSCALE
        clearable: true
  - key: notes
    valueType: string
    required: false
    label:
      en: Notes
      nl: Notities
    description:
      en: Free-form notes about the condition.
      nl: Vrije notities over de conditie.
    validation:
      maxLength: 5000
    persisted:
      column: notes
      storageClass: core
    render:
      component: Textarea
      props:
        rows: 4
        maxLength: 5000
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the condition in an external context.
      nl: Functionele of zakelijke code van de conditie in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
relationships:
  - key: asset
    kind: belongsTo
    target: Asset
    foreignKey: asset_id
    label:
      en: Asset
      nl: Object
  - key: assessedBy
    kind: belongsTo
    target: Relation
    foreignKey: assessed_by_relation_id
    label:
      en: Assessed by
      nl: Beoordeeld door
ui:
  routes:
    list:
      en: /asset-conditions
      nl: /condities
    detail:
      en: /asset-conditions/:id
      nl: /condities/:id
    create:
      en: /asset-conditions/create
      nl: /condities/aanmaken
    edit:
      en: /asset-conditions/:id/edit
      nl: /condities/:id/bewerken
    delete:
      en: /asset-conditions/:id/delete
      nl: /condities/:id/verwijderen
  presentations:
    list:
      title:
        en: Asset conditions
        nl: Condities
      columns:
        - key: assessedAt
          sortable: true
        - key: score
          sortable: true
        - key: scoreScale
          sortable: true
      defaultSort:
        key: assessedAt
        direction: desc
      rowLink:
        en: /asset-conditions/:id
        nl: /condities/:id
    detail:
      header:
        title: "{{assessedAt}}"
        subtitle: "{{score}}"
      actions:
        - key: edit
          label:
            en: Edit
            nl: Bewerken
          route: edit
        - key: delete
          label:
            en: Delete
            nl: Verwijderen
          confirm:
            en: Are you sure?
            nl: Weet je het zeker?
          mutation: delete
      groups:
        - id: overview
          label:
            en: Overview
            nl: Overzicht
          groups:
            - title:
                en: Condition details
                nl: Conditiegegevens
              fields:
                - assessedAt
                - score
                - scoreScale
            - title:
                en: Notes
                nl: Notities
              fields:
                - notes
            - title:
                en: Source
                nl: Herkomst
              fields:
                - externalId
                - externalCode
                - sourceAuthority
                - sourceOrganization
                - sourceAdministration
    form:
      variants:
        create:
          title:
            en: Create asset condition
            nl: Conditie aanmaken
          groups:
            - title:
                en: Condition details
                nl: Conditiegegevens
              fields:
                - assessedAt
                - score
                - scoreScale
            - title:
                en: Notes
                nl: Notities
              fields:
                - notes
            - title:
                en: Source
                nl: Herkomst
              fields:
                - externalId
                - externalCode
                - sourceAuthority
                - sourceOrganization
                - sourceAdministration
        edit:
          extends: create
          title:
            en: Edit asset condition
            nl: Conditie bewerken
workflow:
  nodes:
    actions:
      create: true
      getOne: true
      list: true
      update: true
      delete: true
authorization:
  roles:
    read:
      - RealEstate.All.Read
      - RealEstate.All.ReadWrite
    create:
      - RealEstate.All.ReadWrite
    update:
      - RealEstate.All.ReadWrite
    delete:
      - RealEstate.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
