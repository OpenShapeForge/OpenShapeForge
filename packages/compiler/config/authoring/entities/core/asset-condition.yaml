schemaVersion: 3
kind: coreEntity
module: core
entity: AssetCondition
title: Asset Condition
description: Periodic condition observation for an asset, scoring against a configurable scale.
language: en
displayTemplate: "{{assessedAt}}"
filterField: id
labels:
  en: Asset condition
  nl: Conditie
pluralLabels:
  en: Asset conditions
  nl: Condities
domains:
  - asset
fields:
  - key: assessedAt
    osfType: datetime
    required: true
    label:
      en: Assessed at
      nl: Beoordeeld op
    description:
      en: Timestamp when the condition was assessed.
      nl: Tijdstip waarop de conditie is beoordeeld.
    persisted:
      column: assessed_at
      storageClass: core
  - key: score
    osfType: number
    required: false
    label:
      en: Score
      nl: Score
    description:
      en: Numeric condition score.
      nl: Numerieke conditiescore.
    persisted:
      column: score
      storageClass: core
  - key: scoreScale
    required: false
    label:
      en: Score scale
      nl: Scoreschaal
    description:
      en: Scale on which the score is expressed.
      nl: Schaal waarop de score is uitgedrukt.
    persisted:
      column: score_scale
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ASSESSMENTSCALE
    osfType: referenceDataCode
  - key: notes
    required: false
    label:
      en: Notes
      nl: Notities
    description:
      en: Free-form notes about the condition.
      nl: Vrije notities over de conditie.
    validation:
      maxLength: 5000
    persisted:
      column: notes
      storageClass: core
    osfType: multilineText
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the condition in an external context.
      nl: Functionele of zakelijke code van de conditie in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: assetId
    label:
      en: Asset
      nl: Object
    persisted:
      column: asset_id
      storageClass: core
    osfType: Asset
    relationship:
      ownership: reference
  - key: assessedById
    label:
      en: Assessed by
      nl: Beoordeeld door
    persisted:
      column: assessed_by_relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - RealEstate.All.Read
      - RealEstate.All.ReadWrite
    create:
      - RealEstate.All.ReadWrite
    update:
      - RealEstate.All.ReadWrite
    delete:
      - RealEstate.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Asset Condition
    description: List AssetCondition records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Asset Condition
    description: Get AssetCondition records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Asset Condition
    description: Create AssetCondition records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update AssetCondition records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /asset-conditions
          nl: /condities
        columns:
          - key: assessedAt
            sortable: true
          - key: score
            sortable: true
          - key: scoreScale
            sortable: true
        title:
          en: Asset conditions
          nl: Condities
        defaultSort:
          key: assessedAt
          direction: desc
      record:
        routes:
          read:
            en: /asset-conditions/:id
            nl: /condities/:id
          create:
            en: /asset-conditions/create
            nl: /condities/aanmaken
        title: "{{assessedAt}}"
        subtitle: "{{score}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Condition details
                    nl: Conditiegegevens
                  fields:
                    - assessedAt
                    - score
                    - scoreScale
                - title:
                    en: Notes
                    nl: Notities
                  fields:
                    - notes
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create asset condition
              nl: Conditie aanmaken
            groups:
              - title:
                  en: Condition details
                  nl: Conditiegegevens
                fields:
                  - assessedAt
                  - score
                  - scoreScale
              - title:
                  en: Notes
                  nl: Notities
                fields:
                  - notes
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit asset condition
              nl: Conditie bewerken
    fields:
      assessedAt:
        render:
          component: DateTimePicker
          props: {}
      scoreScale:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ASSESSMENTSCALE
            clearable: true
      notes:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
