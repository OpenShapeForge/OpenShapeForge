schemaVersion: 3
kind: coreEntity
module: core
entity: AssetGroup
title: Asset Group
description: Hierarchical group of assets used for portfolio segmentation, reporting, and authorization scoping.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Asset group
  nl: Objectgroep
pluralLabels:
  en: Asset groups
  nl: Objectgroepen
domains:
  - asset
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique asset group code.
      nl: Tenant-unieke objectgroepcode.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the asset group.
      nl: Menselijk leesbare naam van de objectgroep.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description of the asset group.
      nl: Optionele omschrijving van de objectgroep.
    validation:
      maxLength: 1000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the asset group in an external context.
      nl: Functionele of zakelijke code van de objectgroep in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: parentAssetGroupId
    label:
      en: Parent asset group
      nl: Bovenliggende objectgroep
    persisted:
      column: parent_asset_group_id
      storageClass: core
    osfType: AssetGroup
    relationship:
      ownership: reference
      inverse:
        key: childAssetGroups
        label:
          en: Child asset groups
          nl: Onderliggende objectgroepen
authorization:
  roles:
    read:
      - RealEstate.All.Read
      - RealEstate.All.ReadWrite
    create:
      - RealEstate.All.ReadWrite
    update:
      - RealEstate.All.ReadWrite
    delete:
      - RealEstate.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Asset Group
    description: List AssetGroup records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Asset Group
    description: Get AssetGroup records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Asset Group
    description: Create AssetGroup records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update AssetGroup records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /asset-groups
          nl: /objectgroepen
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
        title:
          en: Asset groups
          nl: Objectgroepen
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /asset-groups/:id
            nl: /objectgroepen/:id
          create:
            en: /asset-groups/create
            nl: /objectgroepen/aanmaken
        title: "{{code}} {{name}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Asset group details
                    nl: Objectgroepgegevens
                  fields:
                    - code
                    - name
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create asset group
              nl: Objectgroep aanmaken
            groups:
              - title:
                  en: Asset group details
                  nl: Objectgroepgegevens
                fields:
                  - code
                  - name
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit asset group
              nl: Objectgroep bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 1000
