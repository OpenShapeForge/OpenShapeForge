schemaVersion: 3
kind: coreEntity
module: core
entity: Asset
title: Asset
description: Generic manageable asset (unit, building, vehicle, machine, equipment) — sector-neutral core slice; VERA
  partials map sector-specific Eenheid into this.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Asset
  nl: Object
pluralLabels:
  en: Assets
  nl: Objecten
domains:
  - asset
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique asset code.
      nl: Tenant-unieke objectcode.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the asset.
      nl: Menselijk leesbare naam van het object.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: assetKind
    required: true
    label:
      en: Asset kind
      nl: Objectsoort
    description:
      en: Classification of the asset (unit, room, building, vehicle, machine, equipment, other).
      nl: Classificatie van het object (eenheid, ruimte, pand, voertuig, machine, apparatuur, anders).
    persisted:
      column: asset_kind
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ASSETKIND
    osfType: referenceDataCode
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form description of the asset.
      nl: Vrije omschrijving van het object.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: acquiredAt
    osfType: date
    required: false
    label:
      en: Acquired at
      nl: Verworven op
    description:
      en: Date the asset was acquired.
      nl: Datum waarop het object is verworven.
    persisted:
      column: acquired_at
      storageClass: core
  - key: decommissionedAt
    osfType: date
    required: false
    label:
      en: Decommissioned at
      nl: Buitengebruik gesteld op
    description:
      en: Date the asset was decommissioned.
      nl: Datum waarop het object buiten gebruik is gesteld.
    persisted:
      column: decommissioned_at
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the asset in an external context.
      nl: Functionele of zakelijke code van het object in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: parentAssetId
    label:
      en: Parent asset
      nl: Bovenliggend object
    persisted:
      column: parent_asset_id
      storageClass: core
    osfType: Asset
    relationship:
      ownership: reference
      inverse:
        key: childAssets
        label:
          en: Child assets
          nl: Onderliggende objecten
  - key: assetGroupId
    label:
      en: Asset group
      nl: Objectgroep
    persisted:
      column: asset_group_id
      storageClass: core
    osfType: AssetGroup
    relationship:
      ownership: reference
  - key: buildingId
    label:
      en: Building
      nl: Pand
    persisted:
      column: building_id
      storageClass: core
    osfType: Building
    relationship:
      ownership: reference
  - key: spaceId
    label:
      en: Space
      nl: Ruimte
    persisted:
      column: space_id
      storageClass: core
    osfType: Space
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - RealEstate.All.Read
      - RealEstate.All.ReadWrite
    create:
      - RealEstate.All.ReadWrite
    update:
      - RealEstate.All.ReadWrite
    delete:
      - RealEstate.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Asset
    description: List Asset records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Asset
    description: Get Asset records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Asset
    description: Create Asset records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Asset records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /assets
          nl: /objecten
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: assetKind
            sortable: true
          - key: acquiredAt
            sortable: true
        title:
          en: Assets
          nl: Objecten
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /assets/:id
            nl: /objecten/:id
          create:
            en: /assets/create
            nl: /objecten/aanmaken
        title: "{{code}} {{name}}"
        subtitle: "{{assetKind}}"
        badges:
          - assetKind
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Asset details
                    nl: Objectgegevens
                  fields:
                    - code
                    - name
                    - assetKind
                    - acquiredAt
                    - decommissionedAt
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create asset
              nl: Object aanmaken
            groups:
              - title:
                  en: Asset details
                  nl: Objectgegevens
                fields:
                  - code
                  - name
                  - assetKind
                  - acquiredAt
                  - decommissionedAt
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit asset
              nl: Object bewerken
    fields:
      assetKind:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ASSETKIND
            clearable: false
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
      acquiredAt:
        render:
          component: DatePicker
          props: {}
      decommissionedAt:
        render:
          component: DatePicker
          props: {}
