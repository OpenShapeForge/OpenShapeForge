schemaVersion: 3
kind: coreEntity
module: core
entity: Assignment
title: Assignment
description: A queue or user assignment history record for a case.
language: en
displayTemplate: "{{reason}}"
filterField: reason
labels:
  en: Assignment
  nl: Toewijzing
pluralLabels:
  en: Assignments
  nl: Toewijzingen
domains:
  - cases
  - service
authorization:
  roles:
    read:
      - Cases.All.Read
      - Cases.All.ReadWrite
    create:
      - Cases.All.ReadWrite
    update:
      - Cases.All.ReadWrite
    delete:
      - Cases.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ASSIGNMENTSTATUS
    osfType: referenceDataCode
  - key: assignedAt
    osfType: datetime
    required: true
    label:
      en: Assigned at
      nl: Toegewezen op
    persisted:
      column: assigned_at
      storageClass: core
  - key: acceptedAt
    osfType: datetime
    required: false
    label:
      en: Accepted at
      nl: Geaccepteerd op
    persisted:
      column: accepted_at
      storageClass: core
  - key: releasedAt
    osfType: datetime
    required: false
    label:
      en: Released at
      nl: Vrijgegeven op
    persisted:
      column: released_at
      storageClass: core
  - key: reason
    osfType: string
    required: false
    label:
      en: Reason
      nl: Reden
    validation:
      maxLength: 500
    persisted:
      column: reason
      storageClass: core
  - key: skillProfile
    osfType: string
    required: false
    label:
      en: Skill profile
      nl: Skillprofiel
    validation:
      maxLength: 200
    persisted:
      column: skill_profile
      storageClass: core
  - key: note
    required: false
    label:
      en: Note
      nl: Notitie
    validation:
      maxLength: 2000
    persisted:
      column: note
      storageClass: core
    osfType: multilineText
  - key: caseId
    label:
      en: Case
      nl: Zaak
    persisted:
      column: case_id
      storageClass: core
    osfType: Case
    relationship:
      ownership: reference
  - key: queueId
    label:
      en: Queue
      nl: Queue
    persisted:
      column: work_queue_id
      storageClass: core
    osfType: WorkQueue
    relationship:
      ownership: reference
  - key: assigneeId
    label:
      en: Assignee
      nl: Behandelaar
    persisted:
      column: assignee_account_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse: false
  - key: assignedById
    label:
      en: Assigned by
      nl: Toegewezen door
    persisted:
      column: assigned_by_account_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse: false
operations:
  list:
    name: List Assignment
    description: List Assignment records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Assignment
    description: Get Assignment records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Assignment
    description: Create Assignment records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Assignment
    description: Update Assignment records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Assignment
    description: Delete Assignment records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  web:
    fields:
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ASSIGNMENTSTATUS
            clearable: false
      assignedAt:
        render:
          component: DateTimePicker
          props: {}
      acceptedAt:
        render:
          component: DateTimePicker
          props: {}
      releasedAt:
        render:
          component: DateTimePicker
          props: {}
      note:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 2000
