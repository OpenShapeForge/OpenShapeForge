schemaVersion: 3
kind: coreEntity
module: core
entity: Attachment
title: Attachment
description: A lightweight file attachment (image, document, or other media) linked to a parent entity such as a support issue.
language: en
displayTemplate: "{{fileName}}"
filterField: fileName
labels:
  en: Attachment
  nl: Bijlage
domains:
  - attachments
authorization:
  roles:
    read:
      - General.All.Read
      - General.All.ReadWrite
    create:
      - General.All.ReadWrite
    update:
      - General.All.ReadWrite
    delete:
      - General.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: fileName
    osfType: string
    required: true
    readOnly: true
    label:
      en: File name
      nl: Bestandsnaam
    description:
      en: Original name of the uploaded file.
      nl: Oorspronkelijke naam van het geüploade bestand.
    validation:
      maxLength: 255
    persisted:
      column: file_name
      storageClass: core
  - key: mimeType
    osfType: string
    required: true
    readOnly: true
    label:
      en: MIME type
      nl: MIME-type
    description:
      en: Media type of the stored file (e.g. image/png).
      nl: Mediatype van het bestand (bijv. image/png).
    validation:
      maxLength: 150
    persisted:
      column: mime_type
      storageClass: core
  - key: sizeBytes
    osfType: integer
    required: false
    readOnly: true
    label:
      en: Size (bytes)
      nl: Grootte (bytes)
    description:
      en: File size in bytes.
      nl: Bestandsgrootte in bytes.
    persisted:
      column: size_bytes
      storageClass: core
  - key: storageLocation
    osfType: string
    required: true
    label:
      en: File
      nl: Bestand
    description:
      en: Storage pointer to the uploaded file (object store key or path token).
      nl: Opslagpointer naar het bestand (objectstore-sleutel of pad-token).
    validation:
      maxLength: 1000
    persisted:
      column: storage_location
      storageClass: core
  - key: checksum
    osfType: string
    required: false
    readOnly: true
    label:
      en: Checksum
      nl: Checksum
    description:
      en: SHA-256 checksum of the stored file.
      nl: SHA-256-checksum van het bestand.
    validation:
      maxLength: 128
    persisted:
      column: checksum
      storageClass: core
  - key: supportIssueId
    label:
      en: Support issue
      nl: Supportverzoek
    persisted:
      column: support_issue_id
      storageClass: core
    osfType: SupportIssue
    relationship:
      ownership: reference
      inverse:
        label:
          en: Attachments
          nl: Bijlagen
operations:
  list:
    name: List Attachment
    description: List Attachment records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Attachment
    description: Get Attachment records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Attachment
    description: Create Attachment records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Attachment
    description: Update Attachment records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /attachments
          nl: /attachments
        columns:
          - key: fileName
            sortable: true
          - key: mimeType
            sortable: true
          - key: sizeBytes
            sortable: true
          - key: createdAt
            sortable: true
        title:
          en: Attachments
          nl: Bijlagen
        defaultSort:
          key: createdAt
          direction: desc
      record:
        routes:
          read:
            en: /attachments/:id
            nl: /attachments/:id
          create:
            en: /attachments/create
            nl: /attachments/aanmaken
        title: "{{fileName}}"
        subtitle: "{{mimeType}}"
        badges:
          - mimeType
        actions:
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: File
                    nl: Bestand
                  fields:
                    - fileName
                    - mimeType
                    - sizeBytes
                    - storageLocation
                    - checksum
                    - createdAt
        modes:
          create:
            title:
              en: Upload attachment
              nl: Bijlage uploaden
            groups:
              - title:
                  en: File
                  nl: Bestand
                fields:
                  - storageLocation
          update:
            title:
              en: Edit attachment
              nl: Bijlage bewerken
    fields:
      storageLocation:
        render:
          component: FileUpload
          props:
            fileNameField: fileName
            mimeTypeField: mimeType
            checksumField: checksum
