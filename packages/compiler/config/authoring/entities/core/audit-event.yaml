schemaVersion: 3
kind: coreEntity
module: core
entity: AuditEvent
title: Audit event
language: en
labels: { en: Audit event, nl: Auditgebeurtenis }
pluralLabels: { en: Audit events, nl: Auditgebeurtenissen }
description: Append-only organization history. Read metadata with list and the recorded, redacted details with get. A record timeline filters subjects by the entityType and recordId tuple; subjects include explicitly relevant ancestors, even after removal or reparenting. Missing historic facts remain unknown.
domains: [audit]
displayTemplate: "{{eventType}}"
filterField: eventType
source:
  kind: operations
  query:
    mode: structured
    filterFields: [id, entityType, recordId, eventType, occurredAt, actorId, actorKind, operationId, correlationId, changedFields, subjects]
    sortFields: [id, occurredAt, entityType, recordId, eventType, actorId, operationId, correlationId]
authorization:
  roles:
    read: [Audit.Logs.All, Audit.Logs.ReadAll]
fields:
  - { key: id, osfType: string, required: true, readOnly: true, validation: { format: uuid }, label: { en: Event, nl: Gebeurtenis } }
  - { key: entityType, osfType: string, required: true, readOnly: true, label: { en: Entity type, nl: Entiteitstype } }
  - { key: recordId, osfType: string, required: true, readOnly: true, label: { en: Record, nl: Record } }
  - { key: eventType, osfType: string, required: true, readOnly: true, label: { en: Event type, nl: Gebeurtenistype } }
  - { key: occurredAt, osfType: datetime, required: true, readOnly: true, label: { en: Time, nl: Tijdstip } }
  - { key: actorId, osfType: string, readOnly: true, label: { en: Actor, nl: Actor } }
  - { key: actorKind, osfType: string, readOnly: true, label: { en: Actor kind, nl: Actorsoort } }
  - { key: operationId, osfType: string, readOnly: true, label: { en: Operation, nl: Operation } }
  - { key: correlationId, osfType: string, readOnly: true, label: { en: Correlation, nl: Samenhang } }
  - { key: changedFields, osfType: string, cardinality: collection, required: true, readOnly: true, label: { en: Changed fields, nl: Gewijzigde velden } }
  - key: subjects
    osfType: object
    cardinality: collection
    required: true
    readOnly: true
    label: { en: Timeline subjects, nl: Tijdlijnonderwerpen }
    children:
      - { key: entityType, osfType: string, required: true, label: { en: Entity type, nl: Entiteitstype } }
      - { key: recordId, osfType: string, required: true, label: { en: Record, nl: Record } }
  - { key: beforeValues, osfType: object, readOnly: true, label: { en: Recorded previous values, nl: Vastgelegde vorige waarden } }
  - { key: afterValues, osfType: object, readOnly: true, label: { en: Recorded new values, nl: Vastgelegde nieuwe waarden } }
  - { key: rawData, osfType: object, readOnly: true, label: { en: Recorded redacted payload, nl: Vastgelegde geredigeerde payload } }
operations:
  list:
    name: { en: List audit events, nl: Auditgebeurtenissen tonen }
    description: Combine typed and/or filters, exact or multiple entity/record IDs, time bounds, actor, Operation, correlation and changed fields. For a timeline use filter.subjects.contains with an exact entityType/recordId object. All results remain organization-scoped. Details are returned by AuditEvent.get.
    implementation: { type: plugin, plugin: osf-audit, handler: list, action: list }
    input: { schema: {} }
    output: { schema: {} }
    errors: []
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  get:
    name: { en: Read audit event, nl: Auditgebeurtenis lezen }
    description: Read one recorded audit event with its redacted before/after values and raw payload. Secrets and protected field values are not retained; absent historical details are not reconstructed. Explicit organization-wide audit read permission is required.
    implementation: { type: plugin, plugin: osf-audit, handler: get, action: get }
    input: { schema: {} }
    output: { schema: {} }
    errors: []
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
interfaces:
  rest:
    operations:
      list: { method: POST, path: /api/audit-events/list }
      get: { method: GET, path: /api/audit-events/:id }
  mcp: {}
