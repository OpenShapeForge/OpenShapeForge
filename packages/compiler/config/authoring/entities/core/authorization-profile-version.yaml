schemaVersion: 3
kind: coreEntity
module: core
entity: AuthorizationProfileVersion
title: Authorization profile version
description: An immutable published authorization profile snapshot.
language: en
labels:
  en: Authorization profile version
  nl: Authorization profile version
pluralLabels:
  en: Authorization profile versions
  nl: Authorization profile versions
domains:
  - organization
authorization:
  roles:
    read:
      - Organization.Security.Manage
    create:
      - Organization.Security.Manage
    update:
      - Organization.Security.Manage
    delete:
      - Organization.Security.Manage
  rowAccess:
    enabled: true
    empty: public
displayTemplate: "{{versionNumber}}"
indexes:
  - name: authorization_profile_versions_number_uidx
    fields:
      - tenantId
      - profile
      - versionNumber
    unique: true
fields:
  - key: profile
    osfType: AuthorizationProfile
    required: true
    immutable: true
    relationship:
      inverse:
        key: versions
        label:
          en: Versions
          nl: Versies
        ownership: owned
  - key: versionNumber
    osfType: integer
    required: true
    immutable: true
    validation:
      min: 1
    label:
      en: Version
      nl: Versie
    persisted:
      column: version_number
      storageClass: core
  - key: status
    osfType: string
    required: true
    immutable: true
    defaultValue: published
    description:
      en: A profile version exists only as a published snapshot, so this is always
        published. The editable draft state lives on the profile itself.
      nl: Een profielversie bestaat alleen als gepubliceerde snapshot, dus dit is
        altijd gepubliceerd. De bewerkbare conceptstatus staat op het profiel
        zelf.
    options:
      type: static
      items:
        - value: published
          label:
            en: Published
            nl: Gepubliceerd
    persisted:
      column: status
      storageClass: core
  - key: snapshot
    osfType: object
    required: true
    immutable: true
    label:
      en: Frozen content
      nl: Vastgelegde inhoud
    description:
      en: The template with its variants and blocks exactly as publication froze them.
        Every materialization of this version resolves from this content, which
        is never updated afterwards.
      nl: De template met zijn varianten en blokken precies zoals de publicatie ze
        heeft vastgelegd. Iedere materialisatie van deze versie wordt hieruit
        opgelost; deze inhoud wordt daarna nooit gewijzigd.
    persisted:
      column: snapshot
      storageClass: core
  - key: contentHash
    osfType: string
    required: true
    immutable: true
    validation:
      pattern: ^[a-f0-9]{64}$
    label:
      en: Content checksum
      nl: Inhoudschecksum
    description:
      en: Checksum over the frozen content, so identical content stays recognisable
        across versions. It proves consistency, not approval or permission to
        deliver.
      nl: Controlesom over de vastgelegde inhoud, zodat identieke inhoud over versies
        herkenbaar blijft. Die bewijst consistentie, geen goedkeuring of
        toestemming voor verzending.
    persisted:
      column: content_hash
      storageClass: core
  - key: publishedBy
    osfType: string
    required: true
    immutable: true
    validation:
      format: uuid
    label:
      en: Published by
      nl: Gepubliceerd door
    persisted:
      column: published_by
      storageClass: core
  - key: publishedAt
    osfType: datetime
    required: true
    immutable: true
    label:
      en: Published at
      nl: Gepubliceerd op
    persisted:
      column: published_at
      storageClass: core
operations:
  list:
    name: list Authorization profile
    description: list a tenant-owned authorization profile.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: get Authorization profile
    description: get a tenant-owned authorization profile.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  mcp:
    tools: generic
