schemaVersion: 3
kind: coreEntity
module: core
entity: BankReconciliation
title: Bank Reconciliation
description: Match between a bank statement line and an invoice payment (or, in a later phase, a ledger posting line).
language: en
displayTemplate: "{{matchedAt}}"
filterField: id
labels:
  en: Bank reconciliation
  nl: Aflettering
pluralLabels:
  en: Bank reconciliations
  nl: Afletteringen
domains:
  - finance
fields:
  - key: matchedAt
    osfType: datetime
    required: true
    label:
      en: Matched at
      nl: Afgeletterd op
    description:
      en: Timestamp at which the match was established.
      nl: Tijdstip waarop de aflettering is vastgelegd.
    persisted:
      column: matched_at
      storageClass: core
  - key: matchedBy
    osfType: string
    required: false
    label:
      en: Matched by
      nl: Afgeletterd door
    description:
      en: Identifier of the user or process that established the match.
      nl: Identificatie van de gebruiker of het proces dat de aflettering heeft vastgelegd.
    validation:
      maxLength: 200
    persisted:
      column: matched_by
      storageClass: core
  - key: bankStatementLineId
    label:
      en: Bank statement line
      nl: Bankafschriftregel
    persisted:
      column: bank_statement_line_id
      storageClass: core
    osfType: BankStatementLine
    relationship:
      ownership: reference
  - key: invoicePaymentId
    label:
      en: Invoice payment
      nl: Factuurbetaling
    persisted:
      column: invoice_payment_id
      storageClass: core
    osfType: InvoicePayment
    relationship:
      ownership: reference
  - key: ledgerPostingLineId
    label:
      en: Ledger posting line
      nl: Boekingsregel
    persisted:
      column: ledger_posting_line_id
      storageClass: core
    osfType: LedgerPostingLine
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Bank Reconciliation
    description: List BankReconciliation records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Bank Reconciliation
    description: Get BankReconciliation records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Bank Reconciliation
    description: Create BankReconciliation records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update BankReconciliation records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /bank-reconciliations
          nl: /afletteringen
        columns:
          - key: matchedAt
            sortable: true
          - key: matchedBy
            sortable: true
        title:
          en: Bank reconciliations
          nl: Afletteringen
        defaultSort:
          key: matchedAt
          direction: desc
      record:
        routes:
          read:
            en: /bank-reconciliations/:id
            nl: /afletteringen/:id
          create:
            en: /bank-reconciliations/create
            nl: /afletteringen/aanmaken
        title: "{{matchedAt}}"
        subtitle: "{{matchedBy}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Match details
                    nl: Afletteringsgegevens
                  fields:
                    - matchedAt
                    - matchedBy
        modes:
          create:
            title:
              en: Create bank reconciliation
              nl: Aflettering aanmaken
            groups:
              - title:
                  en: Match details
                  nl: Afletteringsgegevens
                fields:
                  - matchedAt
                  - matchedBy
          update:
            title:
              en: Edit bank reconciliation
              nl: Aflettering bewerken
    fields:
      matchedAt:
        render:
          component: DateTimePicker
          props: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
