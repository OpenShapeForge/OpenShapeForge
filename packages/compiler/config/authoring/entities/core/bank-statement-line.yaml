schemaVersion: 3
kind: coreEntity
module: core
entity: BankStatementLine
title: Bank Statement Line
description: Single line on a bank statement representing one debit or credit movement.
language: en
displayTemplate: "{{counterpartyName}}: {{amount}}"
filterField: counterpartyName
labels:
  en: Bank statement line
  nl: Bankafschriftregel
pluralLabels:
  en: Bank statement lines
  nl: Bankafschriftregels
domains:
  - finance
fields:
  - key: valueDate
    osfType: date
    required: true
    label:
      en: Value date
      nl: Valutadatum
    description:
      en: Value date on which this movement is booked by the bank.
      nl: Valutadatum waarop deze mutatie door de bank is geboekt.
    persisted:
      column: value_date
      storageClass: core
  - key: amount
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Amount of the movement (always positive; sign is determined by direction).
      nl: Bedrag van de mutatie (altijd positief; teken volgt uit richting).
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: direction
    required: true
    label:
      en: Direction
      nl: Richting
    description:
      en: Side of the movement — debit or credit.
      nl: Zijde van de mutatie — debet of credit.
    persisted:
      column: direction
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: LEDGERSIDE
    osfType: referenceDataCode
  - key: counterpartyName
    osfType: string
    required: false
    label:
      en: Counterparty name
      nl: Naam tegenpartij
    description:
      en: Name of the counterparty as reported by the bank.
      nl: Naam van de tegenpartij zoals gerapporteerd door de bank.
    validation:
      maxLength: 200
    persisted:
      column: counterparty_name
      storageClass: core
  - key: counterpartyIban
    osfType: string
    required: false
    label:
      en: Counterparty IBAN
      nl: IBAN tegenpartij
    description:
      en: IBAN of the counterparty.
      nl: IBAN van de tegenpartij.
    validation:
      maxLength: 34
    persisted:
      column: counterparty_iban
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-text description of the movement (typically the bank narrative).
      nl: Vrije omschrijving van de mutatie (meestal de banktekst).
    validation:
      maxLength: 1000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: endToEndId
    osfType: string
    required: false
    label:
      en: End-to-end ID
      nl: End-to-end-id
    description:
      en: SEPA end-to-end identifier carried by the underlying transaction (max 35 characters).
      nl: SEPA end-to-end-identificatie van de onderliggende transactie (max 35 tekens).
    validation:
      maxLength: 35
    persisted:
      column: end_to_end_id
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Reconciliation status of the line.
      nl: Aflettering-status van de regel.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: BANKSTATEMENTLINESTATUS
    osfType: referenceDataCode
  - key: bankStatementId
    label:
      en: Bank statement
      nl: Bankafschrift
    persisted:
      column: bank_statement_id
      storageClass: core
    osfType: BankStatement
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Bank Statement Line
    description: List BankStatementLine records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Bank Statement Line
    description: Get BankStatementLine records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Bank Statement Line
    description: Create BankStatementLine records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update BankStatementLine records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /bank-statement-lines
          nl: /bankafschriftregels
        columns:
          - key: valueDate
            sortable: true
          - key: counterpartyName
            sortable: true
          - key: amount
            sortable: true
          - key: direction
            sortable: true
          - key: status
            sortable: true
        title:
          en: Bank statement lines
          nl: Bankafschriftregels
        defaultSort:
          key: valueDate
          direction: desc
      record:
        routes:
          read:
            en: /bank-statement-lines/:id
            nl: /bankafschriftregels/:id
          create:
            en: /bank-statement-lines/create
            nl: /bankafschriftregels/aanmaken
        title: "{{counterpartyName}}: {{amount}}"
        subtitle: "{{valueDate}}"
        badges:
          - direction
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Movement
                    nl: Mutatie
                  fields:
                    - valueDate
                    - amount
                    - direction
                    - status
                - title:
                    en: Counterparty
                    nl: Tegenpartij
                  fields:
                    - counterpartyName
                    - counterpartyIban
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                    - endToEndId
        modes:
          create:
            title:
              en: Create bank statement line
              nl: Bankafschriftregel aanmaken
            groups:
              - title:
                  en: Movement
                  nl: Mutatie
                fields:
                  - valueDate
                  - amount
                  - direction
                  - status
              - title:
                  en: Counterparty
                  nl: Tegenpartij
                fields:
                  - counterpartyName
                  - counterpartyIban
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
                  - endToEndId
          update:
            title:
              en: Edit bank statement line
              nl: Bankafschriftregel bewerken
    fields:
      valueDate:
        render:
          component: DatePicker
          props: {}
      direction:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: LEDGERSIDE
            clearable: false
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 1000
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: BANKSTATEMENTLINESTATUS
            clearable: false
