schemaVersion: 3
kind: coreEntity
module: core
entity: BankStatement
title: Bank Statement
description: Bank statement header for an account, with opening and closing balances on a given statement date.
language: en
displayTemplate: "{{accountIban}} #{{statementNumber}}"
filterField: statementNumber
labels:
  en: Bank statement
  nl: Bankafschrift
pluralLabels:
  en: Bank statements
  nl: Bankafschriften
domains:
  - finance
fields:
  - key: accountIban
    osfType: string
    required: true
    label:
      en: Account IBAN
      nl: Rekening-IBAN
    description:
      en: IBAN of the bank account this statement belongs to.
      nl: IBAN van de bankrekening waartoe dit afschrift behoort.
    validation:
      maxLength: 34
    persisted:
      column: account_iban
      storageClass: core
  - key: statementNumber
    osfType: string
    required: true
    label:
      en: Statement number
      nl: Afschriftnummer
    description:
      en: Statement number issued by the bank, unique within the account IBAN.
      nl: Afschriftnummer toegekend door de bank, uniek binnen de rekening-IBAN.
    persisted:
      column: statement_number
      storageClass: core
  - key: statementDate
    osfType: date
    required: true
    label:
      en: Statement date
      nl: Afschriftdatum
    description:
      en: Date of the statement as issued by the bank.
      nl: Afschriftdatum zoals afgegeven door de bank.
    persisted:
      column: statement_date
      storageClass: core
  - key: openingBalance
    required: true
    label:
      en: Opening balance
      nl: Beginsaldo
    description:
      en: Opening balance of the account at the start of the statement period.
      nl: Beginsaldo van de rekening aan het begin van de afschriftperiode.
    osfType: currency
    persisted:
      column: opening_balance
      storageClass: core
  - key: closingBalance
    required: true
    label:
      en: Closing balance
      nl: Eindsaldo
    description:
      en: Closing balance of the account at the end of the statement period.
      nl: Eindsaldo van de rekening aan het einde van de afschriftperiode.
    osfType: currency
    persisted:
      column: closing_balance
      storageClass: core
  - key: currencyCode
    osfType: string
    required: true
    label:
      en: Currency
      nl: Valuta
    description:
      en: ISO 4217 currency code in which the balances are denominated.
      nl: ISO 4217 valutacode waarin de saldi luiden.
    defaultValue: EUR
    validation:
      minLength: 3
      maxLength: 3
    persisted:
      column: currency_code
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the statement in an external context.
      nl: Functionele of zakelijke code van het afschrift in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Bank Statement
    description: List BankStatement records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Bank Statement
    description: Get BankStatement records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Bank Statement
    description: Create BankStatement records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update BankStatement records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /bank-statements
          nl: /bankafschriften
        columns:
          - key: accountIban
            sortable: true
          - key: statementNumber
            sortable: true
          - key: statementDate
            sortable: true
          - key: openingBalance
            sortable: true
          - key: closingBalance
            sortable: true
        title:
          en: Bank statements
          nl: Bankafschriften
        defaultSort:
          key: statementDate
          direction: desc
      record:
        routes:
          read:
            en: /bank-statements/:id
            nl: /bankafschriften/:id
          create:
            en: /bank-statements/create
            nl: /bankafschriften/aanmaken
        title: "{{accountIban}} #{{statementNumber}}"
        subtitle: "{{statementDate}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Statement details
                    nl: Afschriftgegevens
                  fields:
                    - accountIban
                    - statementNumber
                    - statementDate
                    - currencyCode
                - title:
                    en: Balances
                    nl: Saldi
                  fields:
                    - openingBalance
                    - closingBalance
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create bank statement
              nl: Bankafschrift aanmaken
            groups:
              - title:
                  en: Statement details
                  nl: Afschriftgegevens
                fields:
                  - accountIban
                  - statementNumber
                  - statementDate
                  - currencyCode
              - title:
                  en: Balances
                  nl: Saldi
                fields:
                  - openingBalance
                  - closingBalance
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit bank statement
              nl: Bankafschrift bewerken
    fields:
      statementDate:
        render:
          component: DatePicker
          props: {}
