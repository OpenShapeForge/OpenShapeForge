schemaVersion: 3
kind: coreEntity
module: core
entity: BillingRunItem
title: Billing Run Item
description: Per-agreement/per-period idempotency ledger for one BillingRun. Enforces append-only financial semantics —
  one immutable result per (run, agreement, period, mode). Replays of the same run resume unfinished items and return
  existing invoice ids for completed items.
language: en
displayTemplate: "{{periodStart}} → {{periodEnd}}"
filterField: idempotencyKey
labels:
  en: Billing run item
  nl: Facturatie-run-item
pluralLabels:
  en: Billing run items
  nl: Facturatie-run-items
domains:
  - finance
indexes:
  - name: billing_run_items_tenant_idempotency_uidx
    fields:
      - tenantId
      - idempotencyKey
    unique: true
fields:
  - key: idempotencyKey
    osfType: string
    required: true
    label:
      en: Idempotency key
      nl: Idempotentiesleutel
    description:
      en: Stable key over (tenant, run, agreement, schedule, periodStart, periodEnd, mode). Unique within tenant; protects
        against duplicate financial artifacts on retry.
      nl: Stabiele sleutel over (tenant, run, overeenkomst, schema, periodStart, periodEnd, modus). Uniek binnen tenant;
        voorkomt dubbele financiële boekingen bij herhaling.
    validation:
      minLength: 1
      maxLength: 300
    persisted:
      column: idempotency_key
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    defaultValue: planned
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: BILLINGRUNITEMSTATUS
    osfType: referenceDataCode
  - key: mode
    required: true
    label:
      en: Mode
      nl: Modus
    defaultValue: prolongation
    persisted:
      column: mode
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: BILLINGRUNMODE
    osfType: referenceDataCode
  - key: periodStart
    osfType: date
    required: false
    label:
      en: Period start
      nl: Periode start
    description:
      en: Inclusive start of the billing period covered by this item. Null for mode = milestone, which bills a single event
        rather than a period.
      nl: Inclusieve startdatum van de facturatieperiode van dit item. Leeg bij modus = mijlpaal, die een eenmalige
        gebeurtenis factureert in plaats van een periode.
    persisted:
      column: period_start
      storageClass: core
  - key: periodEnd
    osfType: date
    required: false
    label:
      en: Period end
      nl: Periode einde
    description:
      en: Inclusive end of the billing period covered by this item. Null for mode = milestone, which bills a single event
        rather than a period.
      nl: Inclusieve einddatum van de facturatieperiode van dit item. Leeg bij modus = mijlpaal, die een eenmalige gebeurtenis
        factureert in plaats van een periode.
    persisted:
      column: period_end
      storageClass: core
  - key: lockedAt
    osfType: datetime
    required: false
    label:
      en: Locked at
      nl: Vergrendeld op
    description:
      en: Timestamp at which a worker took the lock on this item; cleared on completion or release.
      nl: Tijdstip waarop een worker dit item heeft vergrendeld; wordt gewist bij afronding of vrijgave.
    persisted:
      column: locked_at
      storageClass: core
  - key: lockedBy
    osfType: string
    required: false
    label:
      en: Locked by
      nl: Vergrendeld door
    description:
      en: Worker identifier holding the lock.
      nl: Identificatie van de worker die de vergrendeling vasthoudt.
    validation:
      maxLength: 200
    persisted:
      column: locked_by
      storageClass: core
  - key: completedAt
    osfType: datetime
    required: false
    label:
      en: Completed at
      nl: Afgerond op
    persisted:
      column: completed_at
      storageClass: core
  - key: failureCode
    osfType: string
    required: false
    label:
      en: Failure code
      nl: Foutcode
    validation:
      maxLength: 100
    persisted:
      column: failure_code
      storageClass: core
  - key: failureMessage
    required: false
    label:
      en: Failure message
      nl: Foutmelding
    validation:
      maxLength: 2000
    persisted:
      column: failure_message
      storageClass: core
    osfType: multilineText
  - key: failureContext
    osfType: object
    required: false
    label:
      en: Failure context
      nl: Foutcontext
    description:
      en: Optional structured payload with diagnostic context (e.g. invalid component ids, missing payer split).
      nl: Optionele gestructureerde context met diagnostische informatie (bv. ongeldige componentregels, ontbrekende
        debiteurensplit).
    persisted:
      column: failure_context
      storageClass: core
  - key: amountTotal
    required: false
    label:
      en: Amount total
      nl: Totaalbedrag
    description:
      en: Total amount of the invoice produced for this item (or 0 when skipped/failed).
      nl: Totaalbedrag van de factuur die voor dit item is geproduceerd (of 0 bij overgeslagen/mislukt).
    osfType: currency
    persisted:
      column: amount_total
      storageClass: core
  - key: billingRunId
    label:
      en: Billing run
      nl: Facturatie-run
    persisted:
      column: billing_run_id
      storageClass: core
    osfType: BillingRun
    relationship:
      ownership: reference
  - key: agreementId
    label:
      en: Agreement
      nl: Overeenkomst
    persisted:
      column: agreement_id
      storageClass: core
    osfType: Agreement
    relationship:
      ownership: reference
  - key: billingScheduleId
    label:
      en: Billing schedule
      nl: Facturatieschema
    persisted:
      column: billing_schedule_id
      storageClass: core
    osfType: BillingSchedule
    relationship:
      ownership: reference
  - key: agreementMilestoneId
    label:
      en: Agreement milestone
      nl: Overeenkomstmijlpaal
    persisted:
      column: agreement_milestone_id
      storageClass: core
    osfType: AgreementMilestone
    relationship:
      ownership: reference
  # System-written by the billing run: the invoice it produced, not an input.
  - key: producedInvoiceId
    readOnly: true
    writtenBy: [BillingRun.execute]
    label:
      en: Produced invoice
      nl: Geproduceerde factuur
    persisted:
      column: produced_invoice_id
      storageClass: core
    osfType: Invoice
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Billing Run Item
    description: List BillingRunItem records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Billing Run Item
    description: Get BillingRunItem records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Billing Run Item
    description: Create BillingRunItem records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update BillingRunItem records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Billing Run Item
    description: Delete BillingRunItem records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /billing-run-items
          nl: /facturatie-run-items
        columns:
          - key: status
            sortable: true
          - key: mode
            sortable: true
          - key: periodStart
            sortable: true
          - key: periodEnd
            sortable: true
          - key: amountTotal
            sortable: true
          - key: completedAt
            sortable: true
        title:
          en: Billing run items
          nl: Facturatie-run-items
        defaultSort:
          key: periodStart
          direction: desc
      record:
        routes:
          read:
            en: /billing-run-items/:id
            nl: /facturatie-run-items/:id
          create:
            en: /billing-run-items/create
            nl: /facturatie-run-items/aanmaken
        title: "{{periodStart}} → {{periodEnd}}"
        subtitle: "{{status}}"
        badges:
          - mode
          - status
        actions:
          - update
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Item details
                    nl: Item-gegevens
                  fields:
                    - status
                    - mode
                    - periodStart
                    - periodEnd
                    - amountTotal
                    - idempotencyKey
                - title:
                    en: Lock and timing
                    nl: Vergrendeling en tijdstippen
                  fields:
                    - lockedAt
                    - lockedBy
                    - completedAt
                - title:
                    en: Failure
                    nl: Mislukking
                  fields:
                    - failureCode
                    - failureMessage
                    - failureContext
        modes:
          create:
            title:
              en: Create billing run item
              nl: Facturatie-run-item aanmaken
            groups:
              - title:
                  en: Item details
                  nl: Item-gegevens
                fields:
                  - status
                  - mode
                  - periodStart
                  - periodEnd
                  - amountTotal
                  - idempotencyKey
          update:
            title:
              en: Edit billing run item
              nl: Facturatie-run-item bewerken
    fields:
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: BILLINGRUNITEMSTATUS
            clearable: false
      mode:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: BILLINGRUNMODE
            clearable: false
      periodStart:
        render:
          component: DatePicker
          props: {}
      periodEnd:
        render:
          component: DatePicker
          props: {}
      failureMessage:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 2000
