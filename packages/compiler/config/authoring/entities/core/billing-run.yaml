schemaVersion: 3
kind: coreEntity
module: core
entity: BillingRun
title: Billing Run
description: Durable run-level ledger for one execution of the billing engine. Holds request-level idempotency,
  summary counts/totals, and aggregated failure payload. Per-agreement decisions live in BillingRunItem. The
  milestone mode is executable here as the Operation BillingRun.execute, implemented by the core osf-billing module.
language: en
displayTemplate: "{{mode}} @ {{billUpToDate}}"
filterField: idempotencyKey
labels:
  en: Billing run
  nl: Facturatie-run
pluralLabels:
  en: Billing runs
  nl: Facturatie-runs
domains:
  - finance
indexes:
  - name: billing_runs_tenant_idempotency_uidx
    fields:
      - tenantId
      - idempotencyKey
    unique: true
fields:
  - key: idempotencyKey
    osfType: string
    required: true
    label:
      en: Idempotency key
      nl: Idempotentiesleutel
    description:
      en: Stable request-level key. Replays of the same key resolve to the same BillingRun (status and summaries are
        append-only after completion).
      nl: Stabiele sleutel op verzoekniveau. Herhalingen met dezelfde sleutel vinden dezelfde BillingRun terug (status en
        samenvattingen zijn append-only na afronding).
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: idempotency_key
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the run.
      nl: Levenscyclusstatus van de run.
    defaultValue: queued
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: BILLINGRUNSTATUS
    osfType: referenceDataCode
  - key: mode
    required: true
    label:
      en: Mode
      nl: Modus
    description:
      en: Operating mode — prolongation, void, or reissue (TWK).
      nl: Modus — prolongatie, storneren of hercreatie (TWK).
    defaultValue: prolongation
    persisted:
      column: mode
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: BILLINGRUNMODE
    osfType: referenceDataCode
  - key: billUpToDate
    osfType: date
    required: true
    label:
      en: Bill up to date
      nl: Factureren tot en met
    description:
      en: Inclusive boundary — agreements due on or before this date are eligible.
      nl: Inclusieve bovengrens — overeenkomsten met prolongatiedatum op of voor deze datum komen in aanmerking.
    persisted:
      column: bill_up_to_date
      storageClass: core
  - key: agreementFilter
    osfType: object
    required: false
    label:
      en: Agreement filter
      nl: Overeenkomstenfilter
    description:
      en: Snapshot of the condition-builder expression that selected eligible agreements (frozen at run start for replay).
      nl: Snapshot van de condition-builder-expressie waarmee de in aanmerking komende overeenkomsten zijn geselecteerd (bij
        runstart vastgezet voor herhaling).
    persisted:
      column: agreement_filter
      storageClass: core
  - key: dryRun
    osfType: boolean
    required: false
    label:
      en: Dry run
      nl: Proefrun
    description:
      en: When true, the run plans and computes but does not persist invoices, GL postings, or schedule cursor advances.
      nl: Indien true plant en berekent de run wel maar worden facturen, grootboekposten en cursor-updates niet opgeslagen.
    defaultValue: false
    persisted:
      column: dry_run
      storageClass: core
  - key: maxAgreementsPerWorker
    osfType: integer
    required: false
    label:
      en: Max agreements per worker
      nl: Max overeenkomsten per worker
    description:
      en: Soft sharding hint — the planner divides the eligible agreement set into work batches of this size.
      nl: Zachte sharding-hint — de planner verdeelt de geselecteerde overeenkomsten in batches van deze grootte.
    validation:
      min: 1
      max: 10000
    persisted:
      column: max_agreements_per_worker
      storageClass: core
  - key: agreementsPlanned
    osfType: integer
    required: false
    label:
      en: Agreements planned
      nl: Geplande overeenkomsten
    description:
      en: Total agreements selected by the planner.
      nl: Totaal aantal overeenkomsten dat de planner heeft geselecteerd.
    persisted:
      column: agreements_planned
      storageClass: core
  - key: agreementsCompleted
    osfType: integer
    required: false
    label:
      en: Agreements completed
      nl: Afgeronde overeenkomsten
    persisted:
      column: agreements_completed
      storageClass: core
  - key: agreementsFailed
    osfType: integer
    required: false
    label:
      en: Agreements failed
      nl: Mislukte overeenkomsten
    persisted:
      column: agreements_failed
      storageClass: core
  - key: invoicesProduced
    osfType: integer
    required: false
    label:
      en: Invoices produced
      nl: Geproduceerde facturen
    persisted:
      column: invoices_produced
      storageClass: core
  - key: totalAmount
    required: false
    label:
      en: Total amount
      nl: Totaalbedrag
    description:
      en: Sum of invoice totals produced by this run.
      nl: Som van factuurtotalen die deze run heeft opgeleverd.
    osfType: currency
    persisted:
      column: total_amount
      storageClass: core
  - key: failures
    osfType: object
    required: false
    label:
      en: Failures
      nl: Mislukkingen
    description:
      en: Aggregated failure payload (per-agreement summaries) for partial/failed runs.
      nl: Geaggregeerd mislukkings-payload (samenvattingen per overeenkomst) voor deels/volledig mislukte runs.
    persisted:
      column: failures
      storageClass: core
  - key: startedAt
    osfType: datetime
    required: false
    label:
      en: Started at
      nl: Gestart op
    persisted:
      column: started_at
      storageClass: core
  - key: completedAt
    osfType: datetime
    required: false
    label:
      en: Completed at
      nl: Afgerond op
    persisted:
      column: completed_at
      storageClass: core
  - key: triggeredBy
    osfType: string
    required: false
    label:
      en: Triggered by
      nl: Gestart door
    description:
      en: User account, workflow instance id, or system process that triggered the run.
      nl: Gebruikersaccount, workflow-instantie-id of systeemproces dat de run heeft gestart.
    validation:
      maxLength: 200
    persisted:
      column: triggered_by
      storageClass: core
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Billing Run
    description: List BillingRun records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Billing Run
    description: Get BillingRun records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Billing Run
    description: Create BillingRun records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update BillingRun records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Billing Run
    description: Delete BillingRun records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  # The milestone billing run as a described Operation. One call invoices
  # every triggered AgreementMilestone of the tenant (or of one agreement):
  # per milestone one Invoice with one InvoiceLine, numbered from the
  # tenant's sales InvoiceSequence, one BillingRunItem recording the
  # decision, and the milestone moved to invoiced through its `invoice`
  # transition. The whole run is one transaction under the caller's
  # idempotency key: a replay with the same key returns the first result
  # through the core receipt, and never invoices twice.
  execute:
    name: { en: Run milestone billing, nl: Mijlpaalfacturatie draaien }
    description:
      en: Invoices every triggered agreement milestone, optionally of one agreement, in one billing run. Requires an idempotency key; a replay returns the first result.
      nl: Factureert elke getriggerde overeenkomstmijlpaal, desgewenst van één overeenkomst, in één facturatierun. Vereist een idempotentiesleutel; een herhaling geeft het eerste resultaat terug.
    implementation: { type: plugin, plugin: osf-billing, handler: executeBillingRun }
    target: { scope: collection }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [idempotencyKey]
        properties:
          idempotencyKey:
            type: string
            minLength: 1
            maxLength: 200
            x-osf-i18n: { title: { en: Idempotency key, nl: Idempotentiesleutel } }
          agreementId:
            type: string
            format: uuid
            x-osf-reference: { entity: Agreement }
            x-osf-i18n:
              title: { en: Agreement, nl: Overeenkomst }
              description: { en: Invoice only the triggered milestones of this agreement., nl: Factureer alleen de getriggerde mijlpalen van deze overeenkomst. }
          dryRun:
            type: boolean
            default: false
            x-osf-i18n:
              title: { en: Dry run, nl: Proefrun }
              description: { en: Plan and count the milestones without producing invoices., nl: Plan en tel de mijlpalen zonder facturen te maken. }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [id, status, mode, dryRun, agreementsPlanned, agreementsCompleted, invoicesProduced, totalAmount, items]
        properties:
          id: { type: string, format: uuid, x-osf-i18n: { title: { en: Billing run, nl: Facturatierun } } }
          status: { type: string, x-osf-i18n: { title: { en: Status, nl: Status } } }
          mode: { type: string, x-osf-i18n: { title: { en: Mode, nl: Modus } } }
          dryRun: { type: boolean, x-osf-i18n: { title: { en: Dry run, nl: Proefrun } } }
          agreementsPlanned: { type: integer, x-osf-i18n: { title: { en: Agreements planned, nl: Geplande overeenkomsten } } }
          agreementsCompleted: { type: integer, x-osf-i18n: { title: { en: Agreements invoiced, nl: Gefactureerde overeenkomsten } } }
          invoicesProduced: { type: integer, x-osf-i18n: { title: { en: Invoices produced, nl: Geproduceerde facturen } } }
          totalAmount: { type: number, x-osf-i18n: { title: { en: Total amount, nl: Totaalbedrag } } }
          items:
            type: array
            x-osf-i18n: { title: { en: Items, nl: Regels } }
            items:
              type: object
              additionalProperties: false
              required: [agreementMilestoneId, agreementId, invoiceId, invoiceNumber, amount]
              properties:
                agreementMilestoneId: { type: string, format: uuid, x-osf-i18n: { title: { en: Milestone, nl: Mijlpaal } } }
                agreementId: { type: string, format: uuid, x-osf-i18n: { title: { en: Agreement, nl: Overeenkomst } } }
                invoiceId: { type: [string, "null"], format: uuid, x-osf-i18n: { title: { en: Invoice, nl: Factuur } } }
                invoiceNumber: { type: [integer, "null"], x-osf-i18n: { title: { en: Invoice number, nl: Factuurnummer } } }
                amount: { type: number, x-osf-i18n: { title: { en: Amount, nl: Bedrag } } }
    auth: { mode: session, roles: [Finance.All.ReadWrite] }
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: keyed, inputField: idempotencyKey } }
    confirmation: { mode: none }
    errors:
      - { status: 400, code: VALIDATION, description: The run input is invalid. }
      - { status: 401, code: UNAUTHENTICATED, description: An authenticated tenant session is required. }
      - { status: 403, code: FORBIDDEN, description: The caller may not run billing. }
      - { status: 404, code: REFERENCE_NOT_FOUND, description: The agreement does not exist in this tenant. }
      - { status: 409, code: ALREADY_EXISTS, description: Another caller already ran billing under this idempotency key. }
interfaces:
  rest:
    operations:
      execute: { method: POST, path: /api/rest/v1/billing-runs/execute }
  graphql: {}
  mcp:
    tools: generic
  workflow:
    nodes:
      actions:
        getOne: true
        list: true
  web:
    views:
      collection:
        route:
          en: /billing-runs
          nl: /facturatie-runs
        columns:
          - key: status
            sortable: true
          - key: mode
            sortable: true
          - key: billUpToDate
            sortable: true
          - key: agreementsPlanned
            sortable: true
          - key: invoicesProduced
            sortable: true
          - key: totalAmount
            sortable: true
          - key: startedAt
            sortable: true
        title:
          en: Billing runs
          nl: Facturatie-runs
        defaultSort:
          key: startedAt
          direction: desc
      record:
        routes:
          read:
            en: /billing-runs/:id
            nl: /facturatie-runs/:id
          create:
            en: /billing-runs/create
            nl: /facturatie-runs/aanmaken
        title: "{{mode}}"
        subtitle: "{{status}}"
        badges:
          - mode
          - status
        actions:
          - update
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Run details
                    nl: Run-gegevens
                  fields:
                    - status
                    - mode
                    - billUpToDate
                    - dryRun
                    - maxAgreementsPerWorker
                    - idempotencyKey
                    - triggeredBy
                - title:
                    en: Counts
                    nl: Aantallen
                  fields:
                    - agreementsPlanned
                    - agreementsCompleted
                    - agreementsFailed
                    - invoicesProduced
                    - totalAmount
                - title:
                    en: Timeline
                    nl: Tijdlijn
                  fields:
                    - startedAt
                    - completedAt
                - title:
                    en: Filter snapshot
                    nl: Filter-snapshot
                  fields:
                    - agreementFilter
                - title:
                    en: Failures
                    nl: Mislukkingen
                  fields:
                    - failures
        modes:
          create:
            title:
              en: Create billing run
              nl: Facturatie-run aanmaken
            groups:
              - title:
                  en: Run details
                  nl: Run-gegevens
                fields:
                  - status
                  - mode
                  - billUpToDate
                  - dryRun
                  - maxAgreementsPerWorker
                  - idempotencyKey
                  - triggeredBy
          update:
            title:
              en: Edit billing run
              nl: Facturatie-run bewerken
    fields:
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: BILLINGRUNSTATUS
            clearable: false
      mode:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: BILLINGRUNMODE
            clearable: false
      billUpToDate:
        render:
          component: DatePicker
          props: {}
