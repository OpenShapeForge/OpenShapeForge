schemaVersion: 3
kind: coreEntity
module: core
entity: BillingSchedule
title: Billing Schedule
description: Cadence and run-cursor configuration that drives prolongation for a billable sub-agreement. One
  BillingSchedule per active billable agreement; controls when the prolongation engine considers the agreement due.
  Line-level billed-through cursors stay on AgreementComponent.
language: en
displayTemplate: "{{period}}"
filterField: period
labels:
  en: Billing schedule
  nl: Facturatieschema
pluralLabels:
  en: Billing schedules
  nl: "Facturatieschema's"
domains:
  - finance
  - contracts
fields:
  - key: period
    required: true
    label:
      en: Billing period
      nl: Facturatieperiode
    description:
      en: Cadence at which the prolongation engine emits a new invoice for this agreement.
      nl: Cadans waarmee de prolongatiemotor een nieuwe factuur genereert voor deze overeenkomst.
    defaultValue: monthly
    persisted:
      column: period
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: BILLINGPERIOD
    osfType: referenceDataCode
  - key: startDay
    osfType: integer
    required: false
    label:
      en: Start day of month
      nl: Startdag van de maand
    description:
      en: Day-of-month (1-31) at which each billing period starts. Defaults to the agreement start day when null.
      nl: Dag van de maand (1-31) waarop elke facturatieperiode begint. Standaard de startdag van de overeenkomst als leeg.
    validation:
      min: 1
      max: 31
    persisted:
      column: start_day
      storageClass: core
  - key: variableDays
    osfType: integer
    required: false
    label:
      en: Variable period length (days)
      nl: Variabele periodelengte (dagen)
    description:
      en: Optional period length in days, used only when period = variable.
      nl: Optionele periodelengte in dagen, alleen gebruikt wanneer periode = variabel.
    validation:
      min: 1
      max: 366
    persisted:
      column: variable_days
      storageClass: core
  - key: invoiceMode
    required: true
    label:
      en: Invoice amount mode
      nl: Factuurbedragmodus
    description:
      en: Per-period vs per-day amount mode used when slicing partial periods (BILLINGAMOUNTTYPE).
      nl: Per-periode of per-dag bedragmodus die wordt gebruikt bij het splitsen van deelperiodes (BILLINGAMOUNTTYPE).
    defaultValue: perPeriod
    persisted:
      column: invoice_mode
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: BILLINGAMOUNTTYPE
    osfType: referenceDataCode
  - key: nextProlongationDate
    osfType: date
    required: false
    label:
      en: Next prolongation date
      nl: Volgende prolongatiedatum
    description:
      en: Agreement-level due-run cursor. The prolongation engine selects this schedule when nextProlongationDate <=
        billUpToDate.
      nl: Cursor voor volgende prolongatie op overeenkomstniveau. De prolongatiemotor selecteert dit schema wanneer volgende
        prolongatiedatum <= bill-up-to datum.
    persisted:
      column: next_prolongation_date
      storageClass: core
  - key: endProlongationDate
    osfType: date
    required: false
    label:
      en: End prolongation date
      nl: Einddatum prolongatie
    description:
      en: Optional hard stop after which the prolongation engine should not produce further invoices for this agreement.
      nl: Optionele harde einddatum waarna de prolongatiemotor geen facturen meer maakt voor deze overeenkomst.
    persisted:
      column: end_prolongation_date
      storageClass: core
  - key: lastProlongationAt
    osfType: datetime
    required: false
    label:
      en: Last prolongation at
      nl: Laatste prolongatie op
    description:
      en: Timestamp of the last successful prolongation run that advanced the cursor.
      nl: Tijdstip van de laatste geslaagde prolongatie-run die de cursor heeft doorgezet.
    persisted:
      column: last_prolongation_at
      storageClass: core
  - key: source
    osfType: string
    required: false
    label:
      en: Source
      nl: Bron
    description:
      en: Optional human-readable source/owner label (e.g. "import", "manual", "billing-engine").
      nl: Optioneel leesbaar bron/eigenaar-label (bv. "import", "handmatig", "facturatiemotor").
    validation:
      maxLength: 100
    persisted:
      column: source
      storageClass: core
  - key: agreementId
    label:
      en: Agreement
      nl: Overeenkomst
    persisted:
      column: agreement_id
      storageClass: core
    osfType: Agreement
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Billing Schedule
    description: List BillingSchedule records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Billing Schedule
    description: Get BillingSchedule records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Billing Schedule
    description: Create BillingSchedule records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update BillingSchedule records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /billing-schedules
          nl: /facturatieschemas
        columns:
          - key: period
            sortable: true
          - key: nextProlongationDate
            sortable: true
          - key: endProlongationDate
            sortable: true
          - key: lastProlongationAt
            sortable: true
        title:
          en: Billing schedules
          nl: Facturatieschemas
        defaultSort:
          key: nextProlongationDate
          direction: asc
      record:
        routes:
          read:
            en: /billing-schedules/:id
            nl: /facturatieschemas/:id
          create:
            en: /billing-schedules/create
            nl: /facturatieschemas/aanmaken
        title: "{{period}}"
        subtitle: "{{nextProlongationDate}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Cadence
                    nl: Cadans
                  fields:
                    - period
                    - startDay
                    - variableDays
                    - invoiceMode
                - title:
                    en: Cursors
                    nl: Cursors
                  fields:
                    - nextProlongationDate
                    - endProlongationDate
                    - lastProlongationAt
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - source
        modes:
          create:
            title:
              en: Create billing schedule
              nl: Facturatieschema aanmaken
            groups:
              - title:
                  en: Cadence
                  nl: Cadans
                fields:
                  - period
                  - startDay
                  - variableDays
                  - invoiceMode
              - title:
                  en: Cursors
                  nl: Cursors
                fields:
                  - nextProlongationDate
                  - endProlongationDate
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - source
          update:
            title:
              en: Edit billing schedule
              nl: Facturatieschema bewerken
    fields:
      period:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: BILLINGPERIOD
            clearable: false
      invoiceMode:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: BILLINGAMOUNTTYPE
            clearable: false
      nextProlongationDate:
        render:
          component: DatePicker
          props: {}
      endProlongationDate:
        render:
          component: DatePicker
          props: {}
