schemaVersion: 3
kind: coreEntity
module: core
entity: Block
title: Block
language: en
labels: { en: Block, nl: Block }
pluralLabels: { en: Blocks, nl: Blocks }
domains: [documents]
authorization:
  roles:
    # Document roles read document-owned blocks only; the owner axis below
    # separates the owners at the database. Writes stay template-only: a
    # document editor writes through DocumentVariant.*Block.
    read:
      [
        Templates.Read,
        Organization.All.ReadWrite,
        General.All.Read,
        General.All.ReadWrite,
        CaseFile.All.Read,
        CaseFile.All.ReadWrite
      ]
    create: [Organization.All.ReadWrite]
    update: [Organization.All.ReadWrite]
    delete: [Organization.All.ReadWrite]
  # One table, two owners: a template-owned block is readable with
  # TemplateVariant's read roles, a document-owned block with DocumentVariant's,
  # as those entities author them (compiled to the restrictive policy
  # blocks_owner_read). The documents commands (link | follow) mark their
  # transaction with app.document_command and read every owner's rows: a
  # template publisher need not hold a document role to re-seed the documents
  # tracking the template.
  ownerAxis:
    fields: [variant, documentVariant]
    command: { setting: app.document_command, values: [link, follow] }
displayTemplate: "{{definitionKey}}"
fields:
  # Exactly one owner is set; the compiler emits num_nonnulls(document_variant_id, variant_id) = 1.
  - key: variant
    label: { en: Template variant, nl: Templatevariant }
    osfType: TemplateVariant
    required: false
    immutable: true
    relationship:
      inverse:
        label:
          en: Blocks
          nl: Blokken
        ownership: owned
        sortable: true
        allowedDefinitions:
          - TextBlock
          - YouTubeEmbed
          - TemplateBlock
  - key: documentVariant
    label: { en: Document variant, nl: Documentvariant }
    osfType: DocumentVariant
    required: false
    immutable: true
    relationship:
      # A document editor holds no Block role; the variant's collection
      # Operations carry the document editor's authority to its blocks. A block
      # copied from a locked template block refuses updateBlock, moveBlock and
      # removeBlock; the follow rule always overwrites it. Keep
      # allowedDefinitions identical to the template variant's: a plugin
      # entityPatch targets one entity, so a plugin adding a definition
      # patches both.
      inverse:
        label:
          en: Blocks
          nl: Blokken
        ownership: owned
        sortable: true
        childAuthorization: owner
        childLock: locked
        allowedDefinitions:
          - TextBlock
          - YouTubeEmbed
          - TemplateBlock
  - key: definitionKey
    osfType: string
    required: true
    immutable: true
    label: { en: Block type, nl: Bloktype }
    persisted: { column: definition_key, storageClass: core }
  - key: definitionVersion
    label: { en: Definition version, nl: Definitieversie }
    osfType: integer
    required: true
    defaultValue: 1
    immutable: true
    persisted: { column: definition_version, storageClass: core }
  - key: values
    osfType: entityValue
    entityValue: { definitionField: definitionKey, parameterBindings: true }
    required: true
    label: { en: Values, nl: Waarden }
    persisted: { column: values, storageClass: core }
  - key: origin
    label: { en: Origin, nl: Herkomst }
    description:
      en: Whether a document block was seeded from its template or added locally. Always local on a template variant.
      nl: Of een documentblok uit de template komt of lokaal is toegevoegd. Op een templatevariant altijd lokaal.
    osfType: string
    required: true
    readOnly: true
    writtenBy: [Document.linkTemplate, Template.publish]
    defaultValue: local
    options:
      type: static
      items:
        - { value: template, label: { en: Template, nl: Template } }
        - { value: local, label: { en: Local, nl: Lokaal } }
    persisted: { column: origin, storageClass: core }
  - key: templateBlockId
    label: { en: Template block, nl: Templateblok }
    description:
      en: Id of the block inside the template snapshot this document block was seeded from.
      nl: Id van het blok in de templatesnapshot waaruit dit documentblok is overgenomen.
    osfType: string
    required: false
    readOnly: true
    writtenBy: [Document.linkTemplate, Template.publish]
    validation: { format: uuid }
    persisted: { column: template_block_id, storageClass: core }
  - key: diverged
    label: { en: Diverged from template, nl: Afwijkend van template }
    description:
      en: Set when the template was republished but this block kept a local edit.
      nl: Gezet als de template opnieuw is gepubliceerd maar dit blok een lokale wijziging behield.
    osfType: boolean
    required: true
    defaultValue: false
    readOnly: true
    writtenBy: [Template.publish]
    persisted: { column: diverged, storageClass: core }
  - key: locked
    label: { en: Locked, nl: Vergrendeld }
    description:
      en: Authored on a template block. A document block copied from a locked template block cannot be edited, moved or removed and always follows the template.
      nl: Ingesteld op een templateblok. Een documentblok dat uit een vergrendeld templateblok is overgenomen kan niet worden bewerkt, verplaatst of verwijderd en volgt altijd de template.
    osfType: boolean
    required: true
    defaultValue: false
    persisted: { column: locked, storageClass: core }
operations:
  list:
    name: List block
    description: Read accessible block records.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  get:
    name: Read block
    description: Read one accessible block record.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  create:
    name: Create block
    description: Create a block record.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: none }
  update:
    name: Update block
    description: Update a block draft.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
interfaces:
  rest: {}
  graphql: {}
  mcp: { tools: generic }
  web:
    views:
      named:
        previewStack: { kind: collection, collectionLayout: stack, itemView: preview }
        preview: { kind: record, fields: [values] }
      collection:
        route: /blocks
        title: { en: Blocks, nl: Blokken }
        columns: [{ key: definitionKey }, { key: values }]
      record:
        routes: { read: "/blocks/:id", create: /blocks/new }
        title: "{{definitionKey}}"
        # TextBlock values may opt in through their canonical field metadata.
        # Keep the reusable tenant values on the enclosing record view so every
        # interface projection can resolve the same `{{chips.<key>}}` contract.
        variableSources:
          - key: chips
            resolver: chips
        layout:
          tabs:
            - id: values
              label: { en: Content, nl: Inhoud }
              groups: [{ title: { en: Block, nl: Blok }, fields: [variant, documentVariant, definitionKey, values, origin, diverged, locked] }]
        modes:
          create:
            title: { en: Add block, nl: Blok toevoegen }
            groups: [{ title: { en: Block, nl: Blok }, fields: [variant, documentVariant, definitionKey, values, locked] }]
          update:
            title: { en: Edit block, nl: Blok bewerken }
            groups: [{ title: { en: Content, nl: Inhoud }, fields: [values, locked] }]
