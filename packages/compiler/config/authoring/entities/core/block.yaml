schemaVersion: 3
kind: coreEntity
module: core
entity: Block
title: Block
language: en
labels: { en: Block, nl: Block }
domains: [documents]
authorization:
  roles:
    # Document roles read revision-owned blocks only; the restrictive database
    # policy blocks_owner_read separates the owners. Writes stay template-only.
    read:
      [
        Templates.Read,
        Organization.All.ReadWrite,
        General.All.Read,
        General.All.ReadWrite,
        CaseFile.All.Read,
        CaseFile.All.ReadWrite
      ]
    create: [Organization.All.ReadWrite]
    update: [Organization.All.ReadWrite]
    delete: [Organization.All.ReadWrite]
displayTemplate: "{{definitionKey}}"
fields:
  # Exactly one owner is set; the compiler emits num_nonnulls(revision_id, variant_id) = 1.
  - key: variant
    label: { en: Template variant, nl: Templatevariant }
    osfType: TemplateVariant
    required: false
    immutable: true
    relationship:
      inverse:
        label:
          en: Blocks
          nl: Blokken
        ownership: owned
        sortable: true
        allowedDefinitions:
          - TextBlock
          - YouTubeEmbed
          - TemplateBlock
  - key: revision
    label: { en: Document revision, nl: Documentrevisie }
    osfType: DocumentRevision
    required: false
    immutable: true
    relationship:
      inverse:
        label:
          en: Blocks
          nl: Blokken
        ownership: owned
        sortable: true
        childAuthorization: owner
        allowedDefinitions:
          - TextBlock
          - YouTubeEmbed
          - TemplateBlock
  - key: definitionKey
    osfType: string
    required: true
    immutable: true
    label: { en: Block type, nl: Bloktype }
    persisted: { column: definition_key, storageClass: core }
  - key: definitionVersion
    label: { en: Definition version, nl: Definitieversie }
    osfType: integer
    required: true
    defaultValue: 1
    immutable: true
    persisted: { column: definition_version, storageClass: core }
  - key: values
    osfType: entityValue
    entityValue: { definitionField: definitionKey, parameterBindings: true }
    required: true
    label: { en: Values, nl: Waarden }
    persisted: { column: values, storageClass: core }
  - key: origin
    label: { en: Origin, nl: Herkomst }
    description:
      en: Whether a revision block was seeded from its template or added locally. Always local on a template variant.
      nl: Of een revisieblok uit de template komt of lokaal is toegevoegd. Op een templatevariant altijd lokaal.
    osfType: string
    required: true
    readOnly: true
    writtenBy: [Document.startRevision, Template.publish]
    defaultValue: local
    options:
      type: static
      items:
        - { value: template, label: { en: Template, nl: Template } }
        - { value: local, label: { en: Local, nl: Lokaal } }
    persisted: { column: origin, storageClass: core }
  - key: templateBlockId
    label: { en: Template block, nl: Templateblok }
    description:
      en: Id of the block inside the template snapshot this revision block was seeded from.
      nl: Id van het blok in de templatesnapshot waaruit dit revisieblok is overgenomen.
    osfType: string
    required: false
    readOnly: true
    writtenBy: [Document.startRevision, Template.publish]
    validation: { format: uuid }
    persisted: { column: template_block_id, storageClass: core }
  - key: diverged
    label: { en: Diverged from template, nl: Afwijkend van template }
    description:
      en: Set when the template was republished but this block kept a local edit.
      nl: Gezet als de template opnieuw is gepubliceerd maar dit blok een lokale wijziging behield.
    osfType: boolean
    required: true
    defaultValue: false
    readOnly: true
    writtenBy: [Template.publish]
    persisted: { column: diverged, storageClass: core }
operations:
  list:
    name: List block
    description: Read accessible block records.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  get:
    name: Read block
    description: Read one accessible block record.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  create:
    name: Create block
    description: Create a block record.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: none }
  update:
    name: Update block
    description: Update a block draft.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
interfaces:
  rest: {}
  graphql: {}
  mcp: { tools: generic }
  web:
    views:
      collection:
        route: /blocks
        title: { en: Blocks, nl: Blokken }
        columns: [{ key: definitionKey }, { key: values }]
      record:
        routes: { read: "/blocks/:id", create: /blocks/new }
        title: "{{definitionKey}}"
        layout:
          tabs:
            - id: values
              label: { en: Content, nl: Inhoud }
              groups: [{ title: { en: Block, nl: Blok }, fields: [variant, revision, definitionKey, values, origin, diverged] }]
        modes:
          create:
            title: { en: Add block, nl: Blok toevoegen }
            groups: [{ title: { en: Block, nl: Blok }, fields: [variant, revision, definitionKey, values] }]
          update:
            title: { en: Edit block, nl: Blok bewerken }
            groups: [{ title: { en: Content, nl: Inhoud }, fields: [values] }]
