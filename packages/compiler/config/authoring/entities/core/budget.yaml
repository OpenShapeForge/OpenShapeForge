schemaVersion: 3
kind: coreEntity
module: core
entity: Budget
title: Budget
description: Annual budget container scoped to a fiscal year. Holds budget lines per ledger account, fiscal period, and
  optional cost dimension.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Budget
  nl: Begroting
domains:
  - finance
fields:
  - key: code
    valueType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique short code identifying the budget.
      nl: Tenant-unieke korte code die de begroting identificeert.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    valueType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the budget.
      nl: Menselijk leesbare naam van de begroting.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: status
    valueType: string
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the budget.
      nl: Levenscyclusstatus van de begroting.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: BUDGETSTATUS
    semanticType: referenceDataCode
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form description of the budget.
      nl: Vrije omschrijving van de begroting.
    validation:
      maxLength: 1000
    persisted:
      column: description
      storageClass: core
    semanticType: multilineText
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the budget in an external context.
      nl: Functionele of zakelijke code van de begroting in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: fiscalYearId
    label:
      en: Fiscal year
      nl: Boekjaar
    persisted:
      column: fiscal_year_id
      storageClass: core
    semanticType: FiscalYear
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Budget
    description: List Budget records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Budget
    description: Get Budget records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Budget
    description: Create Budget records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Budget records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /budgets
          nl: /begrotingen
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: status
            sortable: true
        title:
          en: Budgets
          nl: Begrotingen
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /budgets/:id
            nl: /begrotingen/:id
          create:
            en: /budgets/create
            nl: /begrotingen/aanmaken
        title: "{{name}}"
        subtitle: "{{code}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Budget details
                    nl: Begrotingsgegevens
                  fields:
                    - code
                    - name
                    - status
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create budget
              nl: Begroting aanmaken
            groups:
              - title:
                  en: Budget details
                  nl: Begrotingsgegevens
                fields:
                  - code
                  - name
                  - status
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit budget
              nl: Begroting bewerken
    fields:
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: BUDGETSTATUS
            clearable: false
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 1000
