schemaVersion: 3
kind: coreEntity
module: core
entity: BuildingPart
title: Building Part
description: Structural element of a building (roof, facade, foundation). Code is unique within the parent building.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Building part
  nl: Bouwdeel
domains:
  - asset
fields:
  - key: code
    valueType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Code of the building part, unique within the parent building.
      nl: Code van het bouwdeel, uniek binnen het bovenliggende pand.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    valueType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the building part.
      nl: Menselijk leesbare naam van het bouwdeel.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form description of the building part.
      nl: Vrije omschrijving van het bouwdeel.
    persisted:
      column: description
      storageClass: core
    semanticType: multilineText
  - key: installedAt
    valueType: date
    required: false
    label:
      en: Installed at
      nl: Geïnstalleerd op
    description:
      en: Date the building part was installed.
      nl: Datum waarop het bouwdeel is geïnstalleerd.
    persisted:
      column: installed_at
      storageClass: core
  - key: replacedAt
    valueType: date
    required: false
    label:
      en: Replaced at
      nl: Vervangen op
    description:
      en: Date the building part was replaced.
      nl: Datum waarop het bouwdeel is vervangen.
    persisted:
      column: replaced_at
      storageClass: core
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the building part in an external context.
      nl: Functionele of zakelijke code van het bouwdeel in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: buildingId
    label:
      en: Building
      nl: Pand
    persisted:
      column: building_id
      storageClass: core
    semanticType: Building
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - RealEstate.All.Read
      - RealEstate.All.ReadWrite
    create:
      - RealEstate.All.ReadWrite
    update:
      - RealEstate.All.ReadWrite
    delete:
      - RealEstate.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Building Part
    description: List BuildingPart records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Building Part
    description: Get BuildingPart records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Building Part
    description: Create BuildingPart records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update BuildingPart records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /building-parts
          nl: /bouwdelen
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: installedAt
            sortable: true
        title:
          en: Building parts
          nl: Bouwdelen
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /building-parts/:id
            nl: /bouwdelen/:id
          create:
            en: /building-parts/create
            nl: /bouwdelen/aanmaken
        title: "{{code}} {{name}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Building part details
                    nl: Bouwdeelgegevens
                  fields:
                    - code
                    - name
                    - installedAt
                    - replacedAt
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create building part
              nl: Bouwdeel aanmaken
            groups:
              - title:
                  en: Building part details
                  nl: Bouwdeelgegevens
                fields:
                  - code
                  - name
                  - installedAt
                  - replacedAt
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit building part
              nl: Bouwdeel bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
      installedAt:
        render:
          component: DatePicker
          props: {}
      replacedAt:
        render:
          component: DatePicker
          props: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
