schemaVersion: 3
kind: coreEntity
module: core
entity: Building
title: Building
description: Generic building (a Pand-equivalent in the VERA profile) — a physical structure that may host multiple
  assets and spaces.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Building
  nl: Pand
domains:
  - asset
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique building code.
      nl: Tenant-unieke pandcode.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the building.
      nl: Menselijk leesbare naam van het pand.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form description of the building.
      nl: Vrije omschrijving van het pand.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: constructionYear
    osfType: integer
    required: false
    label:
      en: Construction year
      nl: Bouwjaar
    description:
      en: Year of original construction.
      nl: Oorspronkelijk bouwjaar.
    validation:
      min: 1000
      max: 9999
    persisted:
      column: construction_year
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the building in an external context.
      nl: Functionele of zakelijke code van het pand in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: addressId
    label:
      en: Address
      nl: Adres
    persisted:
      column: address_id
      storageClass: core
    osfType: Address
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - RealEstate.All.Read
      - RealEstate.All.ReadWrite
    create:
      - RealEstate.All.ReadWrite
    update:
      - RealEstate.All.ReadWrite
    delete:
      - RealEstate.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Building
    description: List Building records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Building
    description: Get Building records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Building
    description: Create Building records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Building records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /buildings
          nl: /panden
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: constructionYear
            sortable: true
        title:
          en: Buildings
          nl: Panden
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /buildings/:id
            nl: /panden/:id
          create:
            en: /buildings/create
            nl: /panden/aanmaken
        title: "{{code}} {{name}}"
        subtitle: "{{constructionYear}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Building details
                    nl: Pandgegevens
                  fields:
                    - code
                    - name
                    - constructionYear
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create building
              nl: Pand aanmaken
            groups:
              - title:
                  en: Building details
                  nl: Pandgegevens
                fields:
                  - code
                  - name
                  - constructionYear
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit building
              nl: Pand bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
