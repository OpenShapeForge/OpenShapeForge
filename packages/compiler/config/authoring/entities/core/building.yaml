schemaVersion: 1
kind: coreEntity
module: core
entity: Building
title: Building
description: Generic building (a Pand-equivalent in the VERA profile) — a physical structure that may host multiple assets and spaces.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Building
  nl: Pand
domains:
  - asset
fields:
  - key: code
    valueType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique building code.
      nl: Tenant-unieke pandcode.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    valueType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the building.
      nl: Menselijk leesbare naam van het pand.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form description of the building.
      nl: Vrije omschrijving van het pand.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    render:
      component: Textarea
      props:
        rows: 4
        maxLength: 5000
  - key: constructionYear
    valueType: integer
    required: false
    label:
      en: Construction year
      nl: Bouwjaar
    description:
      en: Year of original construction.
      nl: Oorspronkelijk bouwjaar.
    validation:
      min: 1000
      max: 9999
    persisted:
      column: construction_year
      storageClass: core
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the building in an external context.
      nl: Functionele of zakelijke code van het pand in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
relationships:
  - key: address
    kind: belongsTo
    target: Address
    foreignKey: address_id
    label:
      en: Address
      nl: Adres
ui:
  routes:
    list:
      en: /buildings
      nl: /panden
    detail:
      en: /buildings/:id
      nl: /panden/:id
    create:
      en: /buildings/create
      nl: /panden/aanmaken
    edit:
      en: /buildings/:id/edit
      nl: /panden/:id/bewerken
    delete:
      en: /buildings/:id/delete
      nl: /panden/:id/verwijderen
  presentations:
    list:
      title:
        en: Buildings
        nl: Panden
      columns:
        - key: code
          sortable: true
        - key: name
          sortable: true
        - key: constructionYear
          sortable: true
      defaultSort:
        key: code
        direction: asc
      rowLink:
        en: /buildings/:id
        nl: /panden/:id
    detail:
      header:
        title: "{{code}} {{name}}"
        subtitle: "{{constructionYear}}"
      actions:
        - key: edit
          label:
            en: Edit
            nl: Bewerken
          route: edit
        - key: delete
          label:
            en: Delete
            nl: Verwijderen
          confirm:
            en: Are you sure?
            nl: Weet je het zeker?
          mutation: delete
      groups:
        - id: overview
          label:
            en: Overview
            nl: Overzicht
          groups:
            - title:
                en: Building details
                nl: Pandgegevens
              fields:
                - code
                - name
                - constructionYear
            - title:
                en: Description
                nl: Omschrijving
              fields:
                - description
            - title:
                en: Source
                nl: Herkomst
              fields:
                - externalId
                - externalCode
                - sourceAuthority
                - sourceOrganization
                - sourceAdministration
    form:
      variants:
        create:
          title:
            en: Create building
            nl: Pand aanmaken
          groups:
            - title:
                en: Building details
                nl: Pandgegevens
              fields:
                - code
                - name
                - constructionYear
            - title:
                en: Description
                nl: Omschrijving
              fields:
                - description
            - title:
                en: Source
                nl: Herkomst
              fields:
                - externalId
                - externalCode
                - sourceAuthority
                - sourceOrganization
                - sourceAdministration
        edit:
          extends: create
          title:
            en: Edit building
            nl: Pand bewerken
workflow:
  nodes:
    actions:
      create: true
      getOne: true
      list: true
      update: true
      delete: true
authorization:
  roles:
    read:
      - RealEstate.All.Read
      - RealEstate.All.ReadWrite
    create:
      - RealEstate.All.ReadWrite
    update:
      - RealEstate.All.ReadWrite
    delete:
      - RealEstate.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
