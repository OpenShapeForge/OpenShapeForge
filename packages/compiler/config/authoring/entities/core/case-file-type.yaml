schemaVersion: 3
kind: coreEntity
module: core
entity: CaseFileType
title: Case file type
description: A managed case file type definition with archival defaults.
language: en
displayTemplate: "{{name}}"
filterField: name
labels:
  en: Case file type
  nl: Dossiertype
domains:
  - cases
  - governance
authorization:
  roles:
    read:
      - CaseFile.All.Read
      - CaseFile.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Beschrijving
    validation:
      maxLength: 4000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: defaultConfidentiality
    required: false
    label:
      en: Default confidentiality
      nl: Standaardvertrouwelijkheid
    persisted:
      column: default_confidentiality
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEFILECONFIDENTIALITY
    osfType: referenceDataCode
  - key: archiveProfile
    osfType: string
    required: false
    label:
      en: Archive profile
      nl: Archiefprofiel
    validation:
      maxLength: 200
    persisted:
      column: archive_profile
      storageClass: core
  - key: retentionYears
    osfType: integer
    required: false
    label:
      en: Retention years
      nl: Bewaarjaren
    persisted:
      column: retention_years
      storageClass: core
operations:
  list:
    name: List Case file type
    description: List CaseFileType records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Case file type
    description: Get CaseFileType records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Case file type
    description: Create CaseFileType records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Case file type
    description: Update CaseFileType records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Case file type
    description: Delete CaseFileType records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 4000
      defaultConfidentiality:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASEFILECONFIDENTIALITY
            clearable: true
