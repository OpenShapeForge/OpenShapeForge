schemaVersion: 3
kind: coreEntity
module: core
entity: CaseFile
title: Case file
description: A governed case file that groups cases, documents, and archival context.
language: en
displayTemplate: "{{title}}"
filterField: title
labels:
  en: Case file
  nl: Dossier
domains:
  - cases
  - records
retention:
  mode: policyRef
  policy: records-archive-7y
  scope: record
  startsFrom:
    strategy: firstNonNull
    fields:
      - closedAt
      - openedAt
authorization:
  roles:
    read:
      - CaseFile.All.Read
      - CaseFile.All.ReadWrite
    create:
      - CaseFile.All.ReadWrite
    update:
      - CaseFile.All.ReadWrite
    delete:
      - CaseFile.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    valueType: string
    required: true
    label:
      en: Code
      nl: Code
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: code
      storageClass: core
  - key: title
    valueType: string
    required: true
    label:
      en: Title
      nl: Titel
    validation:
      minLength: 1
      maxLength: 300
    persisted:
      column: title
      storageClass: core
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Beschrijving
    validation:
      maxLength: 8000
    persisted:
      column: description
      storageClass: core
    semanticType: multilineText
  - key: caseFileType
    valueType: string
    required: true
    label:
      en: Case file type
      nl: Dossiertype
    persisted:
      column: case_file_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEFILETYPE
    semanticType: referenceDataCode
  - key: status
    valueType: string
    required: true
    label:
      en: Status
      nl: Status
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEFILESTATUS
    semanticType: referenceDataCode
  - key: confidentiality
    valueType: string
    required: false
    label:
      en: Confidentiality
      nl: Vertrouwelijkheid
    persisted:
      column: confidentiality
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEFILECONFIDENTIALITY
    semanticType: referenceDataCode
  - key: archiveStatus
    valueType: string
    required: false
    label:
      en: Archive status
      nl: Archiefstatus
    persisted:
      column: archive_status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEFILEARCHIVESTATUS
    semanticType: referenceDataCode
  - key: openedAt
    valueType: datetime
    required: false
    label:
      en: Opened at
      nl: Geopend op
    persisted:
      column: opened_at
      storageClass: core
  - key: closedAt
    valueType: datetime
    required: false
    label:
      en: Closed at
      nl: Gesloten op
    persisted:
      column: closed_at
      storageClass: core
  - key: archiveActionAt
    valueType: datetime
    required: false
    label:
      en: Archive action at
      nl: Archiefactie op
    persisted:
      column: archive_action_at
      storageClass: core
  - key: retentionUntil
    valueType: date
    required: false
    label:
      en: Retention until
      nl: Bewaren tot
    persisted:
      column: retention_until
      storageClass: core
  - key: aiSummary
    valueType: string
    required: false
    readOnly: true
    label:
      en: AI summary
      nl: AI-samenvatting
    validation:
      maxLength: 8000
    persisted:
      column: ai_summary
      storageClass: core
    semanticType: multilineText
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: primaryRelationId
    label:
      en: Primary relation
      nl: Primaire relatie
    persisted:
      column: relation_id
      storageClass: core
    semanticType: Relation
    relationship:
      ownership: reference
  - key: parentCaseFileId
    label:
      en: Parent case file
      nl: Hoofddossier
    persisted:
      column: parent_case_file_id
      storageClass: core
    semanticType: CaseFile
    relationship:
      ownership: reference
  - key: childCaseFiles
    label:
      en: Child case files
      nl: Onderliggende dossiers
    semanticType: CaseFile
    cardinality: collection
    relationship:
      inverse: parentCaseFileId
      ownership: reference
  - key: cases
    label:
      en: Cases
      nl: Zaken
    semanticType: Case
    cardinality: collection
    relationship:
      inverse: caseFileId
      ownership: reference
  - key: processes
    label:
      en: Processes
      nl: Processen
    semanticType: Process
    cardinality: collection
    relationship:
      inverse: caseFileId
      ownership: reference
  - key: documents
    label:
      en: Documents
      nl: Documenten
    semanticType: Document
    cardinality: collection
    relationship:
      inverse: caseFileId
      ownership: reference
operations:
  list:
    name: List Case file
    description: List CaseFile records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Case file
    description: Get CaseFile records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Case file
    description: Create CaseFile records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Case file
    description: Update CaseFile records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Case file
    description: Delete CaseFile records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
        wait: true
  web:
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 5
            maxLength: 8000
      caseFileType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASEFILETYPE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASEFILESTATUS
            clearable: false
      confidentiality:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASEFILECONFIDENTIALITY
            clearable: true
      archiveStatus:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASEFILEARCHIVESTATUS
            clearable: true
      openedAt:
        render:
          component: DateTimePicker
          props: {}
      closedAt:
        render:
          component: DateTimePicker
          props: {}
      archiveActionAt:
        render:
          component: DateTimePicker
          props: {}
      retentionUntil:
        render:
          component: DatePicker
          props: {}
      aiSummary:
        render:
          component: Textarea
          props:
            rows: 6
            maxLength: 8000
