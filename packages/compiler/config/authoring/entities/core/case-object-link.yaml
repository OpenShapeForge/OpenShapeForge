schemaVersion: 3
kind: coreEntity
module: core
entity: CaseObjectLink
title: Case Object Link
description: A typed link from a case to another business object.
language: en
displayTemplate: "{{objectLabel}}"
filterField: objectLabel
labels:
  en: Case Object Link
  nl: Zaakobjectkoppeling
domains:
  - cases
authorization:
  roles:
    read:
      - Cases.All.Read
      - Cases.All.ReadWrite
    create:
      - Cases.All.ReadWrite
    update:
      - Cases.All.ReadWrite
    delete:
      - Cases.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: objectType
    required: true
    label:
      en: Object type
      nl: Objecttype
    persisted:
      column: object_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEOBJECTTYPE
    osfType: referenceDataCode
  - key: objectLabel
    osfType: string
    required: false
    label:
      en: Object label
      nl: Objectlabel
    validation:
      maxLength: 300
    persisted:
      column: object_label
      storageClass: core
  - key: objectUri
    osfType: string
    required: false
    label:
      en: Object URI
      nl: Object-URI
    validation:
      maxLength: 1000
    persisted:
      column: object_uri
      storageClass: core
  - key: isPrimary
    osfType: boolean
    required: true
    label:
      en: Primary
      nl: Primair
    defaultValue: false
    persisted:
      column: is_primary
      storageClass: core
  - key: note
    required: false
    label:
      en: Note
      nl: Notitie
    validation:
      maxLength: 2000
    persisted:
      column: note
      storageClass: core
    osfType: multilineText
  - key: caseId
    label:
      en: Case
      nl: Zaak
    persisted:
      column: case_id
      storageClass: core
    osfType: Case
    relationship:
      ownership: reference
      inverse:
        key: objectLinks
        label:
          en: Linked objects
          nl: Gekoppelde objecten
