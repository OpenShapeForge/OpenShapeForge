schemaVersion: 3
kind: coreEntity
module: core
entity: CaseParty
title: Case Party
description: A participating party and role on a case.
language: en
displayTemplate: "{{displayName}}"
filterField: displayName
labels:
  en: Case Party
  nl: Zaakbetrokkene
domains:
  - cases
authorization:
  roles:
    read:
      - Cases.All.Read
      - Cases.All.ReadWrite
    create:
      - Cases.All.ReadWrite
    update:
      - Cases.All.ReadWrite
    delete:
      - Cases.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: role
    valueType: string
    required: true
    label:
      en: Role
      nl: Rol
    persisted:
      column: role
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEPARTYROLE
    semanticType: referenceDataCode
  - key: displayName
    valueType: string
    required: false
    label:
      en: Display name
      nl: Weergavenaam
    validation:
      maxLength: 200
    persisted:
      column: display_name
      storageClass: core
  - key: isPrimary
    valueType: boolean
    required: true
    label:
      en: Primary
      nl: Primair
    defaultValue: false
    persisted:
      column: is_primary
      storageClass: core
  - key: startDate
    valueType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    valueType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    persisted:
      column: end_date
      storageClass: core
  - key: note
    valueType: string
    required: false
    label:
      en: Note
      nl: Notitie
    validation:
      maxLength: 2000
    persisted:
      column: note
      storageClass: core
    semanticType: multilineText
  - key: caseId
    label:
      en: Case
      nl: Zaak
    persisted:
      column: case_id
      storageClass: core
    semanticType: Case
    relationship:
      ownership: reference
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    semanticType: Relation
    relationship:
      ownership: reference
  - key: relationRoleId
    label:
      en: Relation role
      nl: Relatierol
    persisted:
      column: relation_role_id
      storageClass: core
    semanticType: RelationRole
    relationship:
      ownership: reference
operations:
  list:
    name: List Case Party
    description: List CaseParty records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Case Party
    description: Get CaseParty records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Case Party
    description: Create CaseParty records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Case Party
    description: Update CaseParty records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Case Party
    description: Delete CaseParty records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    fields:
      role:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASEPARTYROLE
            clearable: false
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
      note:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 2000
