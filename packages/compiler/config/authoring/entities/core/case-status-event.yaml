schemaVersion: 3
kind: coreEntity
module: core
entity: CaseStatusEvent
title: Case Status Event
description: A historical status transition on a case.
language: en
displayTemplate: "{{actorType}}"
filterField: actorId
labels:
  en: Case Status Event
  nl: Zaakstatusgebeurtenis
domains:
  - cases
authorization:
  roles:
    read:
      - Cases.All.Read
      - Cases.All.ReadWrite
    create:
      - Cases.All.ReadWrite
    update:
      - Cases.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASESTATUS
    osfType: referenceDataCode
  - key: statusReason
    osfType: string
    required: false
    label:
      en: Status reason
      nl: Statusreden
    validation:
      maxLength: 300
    persisted:
      column: status_reason
      storageClass: core
  - key: enteredAt
    osfType: datetime
    required: true
    label:
      en: Entered at
      nl: Bereikt op
    persisted:
      column: entered_at
      storageClass: core
  - key: exitedAt
    osfType: datetime
    required: false
    label:
      en: Exited at
      nl: Verlopen op
    persisted:
      column: exited_at
      storageClass: core
  - key: actorId
    osfType: string
    required: false
    label:
      en: Actor ID
      nl: Actor-ID
    validation:
      format: uuid
    persisted:
      column: actor_id
      storageClass: core
  - key: actorType
    required: false
    label:
      en: Actor type
      nl: Actortype
    persisted:
      column: actor_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEACTORTYPE
    osfType: referenceDataCode
  - key: source
    required: false
    label:
      en: Source
      nl: Bron
    persisted:
      column: source
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASESTATUSEVENTSOURCE
    osfType: referenceDataCode
  - key: note
    required: false
    label:
      en: Note
      nl: Notitie
    validation:
      maxLength: 4000
    persisted:
      column: note
      storageClass: core
    osfType: multilineText
  - key: caseId
    label:
      en: Case
      nl: Zaak
    persisted:
      column: case_id
      storageClass: core
    osfType: Case
    relationship:
      ownership: reference
      inverse:
        key: statusEvents
        label:
          en: Status events
          nl: Statusgebeurtenissen
  - key: accountId
    label:
      en: Account
      nl: Account
    persisted:
      column: account_id
      storageClass: core
    osfType: Account
    relationship:
      ownership: reference
operations:
  list:
    name: List Case Status Event
    description: List CaseStatusEvent records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Case Status Event
    description: Get CaseStatusEvent records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Case Status Event
    description: Create CaseStatusEvent records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Case Status Event
    description: Update CaseStatusEvent records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Case Status Event
    description: Delete CaseStatusEvent records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    fields:
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASESTATUS
            clearable: false
      enteredAt:
        render:
          component: DateTimePicker
          props: {}
      exitedAt:
        render:
          component: DateTimePicker
          props: {}
      actorType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASEACTORTYPE
            clearable: true
      source:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASESTATUSEVENTSOURCE
            clearable: true
      note:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 4000
