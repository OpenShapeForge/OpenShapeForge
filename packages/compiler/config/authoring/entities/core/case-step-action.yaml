schemaVersion: 3
kind: coreEntity
module: core
entity: CaseStepAction
title: Case Step Action
description: Runtime action inside a case step. An action is one unit of work the step owns, such as a human task; a plugin may contribute other kinds.
language: en
displayTemplate: "{{actionKey}}"
filterField: actionKey
labels:
  en: Case Step Action
  nl: Zaakstapactie
pluralLabels:
  en: Case step actions
  nl: Zaakstapacties
domains:
  - cases
authorization:
  roles:
    read:
      - Cases.All.Read
      - Cases.All.ReadWrite
    create:
      - Cases.All.ReadWrite
    update:
      - Cases.All.ReadWrite
    delete:
      - Cases.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
indexes:
  - name: case_step_actions_tenant_process_order_idx
    fields:
      - tenantId
      - processId
      - sequenceNumber
      - id
fields:
  - key: processId
    required: true
    readOnly: true
    label:
      en: Case step ID
      nl: Zaakstap-ID
    description:
      en: Canonical runtime case-step container that owns this action.
      nl: Canonieke runtime zaakstapcontainer die deze actie bezit.
    validation:
      format: uuid
    persisted:
      column: process_id
      storageClass: core
    osfType: Process
    relationship:
      ownership: reference
  - key: actionKey
    osfType: string
    required: true
    label:
      en: Action key
      nl: Actiesleutel
    validation:
      minLength: 1
      maxLength: 120
    persisted:
      column: action_key
      storageClass: core
  - key: sequenceNumber
    osfType: integer
    required: true
    label:
      en: Sequence number
      nl: Volgnummer
    persisted:
      column: sequence_number
      storageClass: core
  - key: kind
    required: true
    label:
      en: Kind
      nl: Soort
    persisted:
      column: kind
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASESTEPACTIONKIND
    osfType: referenceDataCode
  - key: required
    osfType: boolean
    required: true
    label:
      en: Required
      nl: Verplicht
    defaultValue: true
    persisted:
      column: required
      storageClass: core
  - key: startMode
    required: true
    label:
      en: Start mode
      nl: Startmodus
    defaultValue: auto
    persisted:
      column: start_mode
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASESTEPACTIONSTARTMODE
    osfType: referenceDataCode
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    defaultValue: pending
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASESTEPACTIONSTATUS
    osfType: referenceDataCode
  - key: taskTemplate
    osfType: object
    required: false
    label:
      en: Task template
      nl: Taaksjabloon
    persisted:
      column: task_template
      storageClass: core
  - key: result
    osfType: object
    required: false
    label:
      en: Result
      nl: Resultaat
    persisted:
      column: result
      storageClass: core
  - key: failureDetails
    osfType: object
    required: false
    label:
      en: Failure details
      nl: Foutdetails
    persisted:
      column: failure_details
      storageClass: core
  - key: activatedAt
    osfType: datetime
    required: false
    label:
      en: Activated at
      nl: Geactiveerd op
    persisted:
      column: activated_at
      storageClass: core
  - key: completedAt
    osfType: datetime
    required: false
    label:
      en: Completed at
      nl: Afgerond op
    persisted:
      column: completed_at
      storageClass: core
  - key: cancelledAt
    osfType: datetime
    required: false
    label:
      en: Cancelled at
      nl: Geannuleerd op
    persisted:
      column: cancelled_at
      storageClass: core
  - key: caseStepTemplateId
    label:
      en: Case step template
      nl: Zaakstapsjabloon
    persisted:
      column: case_step_template_id
      storageClass: core
    osfType: CaseStepTemplate
    relationship:
      ownership: reference
  - key: taskId
    label:
      en: Task
      nl: Taak
    persisted:
      column: task_id
      storageClass: core
    osfType: Task
    relationship:
      ownership: reference
operations: {}
interfaces:
  graphql: {}
  web:
    fields:
      kind:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASESTEPACTIONKIND
            clearable: false
      startMode:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASESTEPACTIONSTARTMODE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASESTEPACTIONSTATUS
            clearable: false
      taskTemplate:
        render:
          component: JsonFieldEditor
      result:
        render:
          component: JsonFieldEditor
      failureDetails:
        render:
          component: JsonFieldEditor
