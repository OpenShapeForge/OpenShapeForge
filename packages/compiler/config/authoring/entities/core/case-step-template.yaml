schemaVersion: 3
kind: coreEntity
module: core
entity: CaseStepTemplate
title: Case Step Template
description: A reusable case-step template inside a case template. Defines the expected step order, execution policy,
  completion policy, and ordered actions. Discretionary steps are available but only activated on demand by a case
  worker.
language: en
displayTemplate: "{{name}}"
filterField: name
labels:
  en: Case Step Template
  nl: Zaakstapsjabloon
pluralLabels:
  en: Case step templates
  nl: Zaakstapsjablonen
domains:
  - cases
  - workflow
authorization:
  roles:
    read:
      - Cases.All.Read
      - Cases.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: key
    osfType: string
    required: true
    label:
      en: Step key
      nl: Stapsleutel
    description:
      en: Unique identifier for this step within the template
      nl: Unieke sleutel voor deze stap binnen het sjabloon
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: key
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Beschrijving
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: stepType
    required: true
    label:
      en: Step type
      nl: Staptype
    persisted:
      column: step_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PROCESSSTEPTYPE
    osfType: referenceDataCode
  - key: sequenceNumber
    osfType: integer
    required: true
    label:
      en: Sequence number
      nl: Volgnummer
    persisted:
      column: sequence_number
      storageClass: core
  - key: executionStyle
    required: true
    label:
      en: Execution style
      nl: Uitvoeringsstijl
    description:
      en: Determines how automatic actions inside this step are started and waited for.
      nl: Bepaalt hoe automatische acties binnen deze stap worden gestart en afgewacht.
    defaultValue: sequential
    persisted:
      column: execution_style
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASESTEPEXECUTIONSTYLE
    osfType: referenceDataCode
  - key: completionMode
    required: true
    label:
      en: Completion mode
      nl: Afrondingsmodus
    description:
      en: Automatic steps complete when required actions are done. Manual approval steps wait for Complete step authorization
        inherited from the case template.
      nl: Automatische stappen ronden af wanneer verplichte acties klaar zijn. Stappen met handmatige goedkeuring wachten op
        de Afronden-bevoegdheid vanuit het zaaksjabloon.
    defaultValue: automatic
    persisted:
      column: completion_mode
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASESTEPCOMPLETIONMODE
    osfType: referenceDataCode
  - key: isMilestone
    osfType: boolean
    required: true
    label:
      en: Is milestone
      nl: Is mijlpaal
    defaultValue: false
    persisted:
      column: is_milestone
      storageClass: core
  - key: isBlocking
    osfType: boolean
    required: true
    label:
      en: Is blocking
      nl: Is blokkerend
    defaultValue: true
    persisted:
      column: is_blocking
      storageClass: core
  - key: isDiscretionary
    osfType: boolean
    required: true
    label:
      en: Discretionary
      nl: Optioneel
    description:
      en: Discretionary steps are available but not automatically created when instantiating the template. A case worker can
        activate them when needed.
      nl: Optionele stappen zijn beschikbaar maar worden niet automatisch aangemaakt bij instantiatie. Een medewerker kan ze
        activeren wanneer nodig.
    defaultValue: false
    persisted:
      column: is_discretionary
      storageClass: core
  - key: assignedRole
    osfType: string
    required: false
    label:
      en: Assigned role
      nl: Toegewezen rol
    validation:
      maxLength: 200
    persisted:
      column: assigned_role
      storageClass: core
  - key: defaultWorkQueueId
    required: false
    osfType: WorkQueue
    label:
      en: Default work queue
      nl: Standaard werkqueue
    description:
      en: Default queue for this case step and its task templates. If empty, the case-template queue is used.
      nl: Standaardqueue voor deze zaakstap en bijbehorende taaksjablonen. Indien leeg wordt de queue van het zaaksjabloon
        gebruikt.
    validation:
      format: uuid
    options:
      type: remote
      remoteUrl: /api/workflow/designer/core-entity-options?entity=work-queue
    persisted:
      column: default_work_queue_id
      storageClass: core
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
  - key: defaultDueOffsetHours
    osfType: integer
    required: false
    label:
      en: Default due offset (hours)
      nl: Standaard doorlooptijd (uren)
    description:
      en: Hours after step activation to set as due date
      nl: Uren na activering als deadline
    persisted:
      column: default_due_offset_hours
      storageClass: core
  - key: predecessorStepKey
    osfType: string
    required: false
    label:
      en: Predecessor step key
      nl: Voorganger stapsleutel
    description:
      en: Key of the step that must complete before this step can start
      nl: Sleutel van de stap die afgerond moet zijn voordat deze stap kan starten
    validation:
      maxLength: 100
    persisted:
      column: predecessor_step_key
      storageClass: core
  - key: conditionExpression
    required: false
    label:
      en: Condition expression
      nl: Conditie-expressie
    description:
      en: Optional expression. If set the step is only created when the expression evaluates to true. Example - case.priority
        === 'urgent'
      nl: Optionele expressie. Stap wordt alleen aangemaakt als expressie waar is.
    validation:
      maxLength: 1000
    persisted:
      column: condition_expression
      storageClass: core
    osfType: multilineText
  - key: actions
    osfType: object
    required: false
    label:
      en: Actions
      nl: Acties
    description:
      en: Ordered inline action templates for this step. Each action has a stable key, sequenceNumber, kind, required,
        startMode, and task or workflow configuration.
      nl: Geordende inline actiesjablonen voor deze stap. Elke actie heeft een stabiele sleutel, volgnummer, type,
        verplichting, startmodus en taak- of workflowconfiguratie.
    persisted:
      column: actions
      storageClass: core
    layoutFraction: 1
    cardinality:
      min: 0
      max: unbounded
    item:
      key: action
      osfType: object
      children:
        - key: key
          osfType: string
          required: true
          label:
            en: Action key
            nl: Actiesleutel
        - key: sequenceNumber
          osfType: integer
          required: true
          label:
            en: Sequence number
            nl: Volgnummer
        - key: kind
          required: true
          label:
            en: Kind
            nl: Soort
          options:
            type: referentiedata
            referentieGroep: CASESTEPACTIONKIND
          osfType: referenceDataCode
        - key: required
          osfType: boolean
          required: true
          label:
            en: Required
            nl: Verplicht
        - key: startMode
          required: true
          label:
            en: Start mode
            nl: Startmodus
          options:
            type: referentiedata
            referentieGroep: CASESTEPACTIONSTARTMODE
          osfType: referenceDataCode
        - key: taskTemplate
          osfType: object
          required: false
          label:
            en: Task template
            nl: Taaksjabloon
          children:
            - key: title
              osfType: string
              required: false
              label:
                en: Title
                nl: Titel
            - key: description
              required: false
              label:
                en: Description
                nl: Beschrijving
              osfType: multilineText
            - key: type
              required: false
              label:
                en: Type
                nl: Type
              options:
                type: referentiedata
                referentieGroep: TAAKTYPE
              osfType: referenceDataCode
            - key: priority
              required: false
              label:
                en: Priority
                nl: Prioriteit
              options:
                type: referentiedata
                referentieGroep: TAAKPRIORITEIT
              osfType: referenceDataCode
            - key: isBlocking
              osfType: boolean
              required: false
              label:
                en: Blocking
                nl: Blokkerend
            - key: dueOffsetHours
              osfType: integer
              required: false
              label:
                en: Due offset (hours)
                nl: Doorlooptijd (uren)
            - key: defaultWorkQueueId
              required: false
              osfType: workQueueId
              label:
                en: Work queue
                nl: Werkqueue
              options:
                type: remote
                remoteUrl: /api/workflow/designer/core-entity-options?entity=work-queue
            - key: assignedRole
              osfType: string
              required: false
              label:
                en: Assigned role
                nl: Toegewezen rol
            - key: assignmentMetadata
              osfType: object
              required: false
              label:
                en: Assignment metadata
                nl: Toewijzingsmetadata
            - key: formDefinition
              osfType: object
              required: false
              label:
                en: Form definition
                nl: Formulierdefinitie
        - key: workflow
          osfType: object
          required: false
          label:
            en: Workflow
            nl: Workflow
          children:
            - key: workflowDefinitionId
              required: false
              osfType: workflowDefinitionId
              label:
                en: Workflow definition
                nl: Workflowdefinitie
              options:
                type: remote
                remoteUrl: /api/workflow/designer/published-workflows/options?category=process
  - key: templateId
    label:
      en: Case template
      nl: Zaaksjabloon
    persisted:
      column: case_template_id
      storageClass: core
    osfType: CaseTemplate
    relationship:
      ownership: reference
      inverse:
        key: steps
        label:
          en: Case step templates
          nl: Zaakstapsjablonen
  - key: parentStepTemplateId
    label:
      en: Parent case step template
      nl: Bovenliggend zaakstapsjabloon
    persisted:
      column: parent_case_step_template_id
      storageClass: core
    osfType: CaseStepTemplate
    relationship:
      ownership: reference
      inverse:
        key: childStepTemplates
        label:
          en: Child case step templates
          nl: Child-zaakstapsjablonen
operations:
  list:
    name: List Case Step Template
    description: List CaseStepTemplate records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Case Step Template
    description: Get CaseStepTemplate records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Case Step Template
    description: Create CaseStepTemplate records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Case Step Template
    description: Update CaseStepTemplate records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Case Step Template
    description: Delete CaseStepTemplate records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
        wait: true
  web:
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
      stepType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PROCESSSTEPTYPE
            clearable: false
      executionStyle:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASESTEPEXECUTIONSTYLE
            clearable: false
      completionMode:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASESTEPCOMPLETIONMODE
            clearable: false
      defaultWorkQueueId:
        render:
          component: OptionVariablePicker
          props:
            valueMode: selectId
      conditionExpression:
        render:
          component: Textarea
          props:
            rows: 2
            maxLength: 1000
      actions.action.key:
        render:
          component: Input
      actions.action.sequenceNumber:
        render:
          component: NumberInput
      actions.action.kind:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASESTEPACTIONKIND
            clearable: false
      actions.action.required:
        render:
          component: Switch
      actions.action.startMode:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASESTEPACTIONSTARTMODE
            clearable: false
      actions.action.taskTemplate.title:
        render:
          component: Input
      actions.action.taskTemplate.description:
        render:
          component: Textarea
          props:
            rows: 3
      actions.action.taskTemplate.type:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: TAAKTYPE
            clearable: true
      actions.action.taskTemplate.priority:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: TAAKPRIORITEIT
            clearable: true
      actions.action.taskTemplate.isBlocking:
        render:
          component: Switch
      actions.action.taskTemplate.dueOffsetHours:
        render:
          component: NumberInput
      actions.action.taskTemplate.defaultWorkQueueId:
        render:
          component: OptionVariablePicker
          props:
            valueMode: selectId
            clearable: true
      actions.action.taskTemplate.assignedRole:
        render:
          component: Input
      actions.action.taskTemplate.assignmentMetadata:
        render:
          component: JsonFieldEditor
      actions.action.taskTemplate.formDefinition:
        render:
          component: JsonFieldEditor
      actions.action.workflow.workflowDefinitionId:
        render:
          component: OptionVariablePicker
          props:
            clearable: true
            expectedOsfType: workflowDefinitionId
            selectionSync: publishedWorkflow
            optionSectionLabel: Procesworkflows
