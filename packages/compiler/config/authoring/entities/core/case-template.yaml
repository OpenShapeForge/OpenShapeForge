schemaVersion: 3
kind: coreEntity
module: core
entity: CaseTemplate
title: Case Template
description: A reusable case template that defines the expected case steps, roles, variables, and structure. Functional
  administrators author templates; the system instantiates them when a case is started.
language: en
displayTemplate: "{{name}}"
filterField: name
labels:
  en: Case Template
  nl: Zaaksjabloon
domains:
  - cases
  - workflow
authorization:
  roles:
    read:
      - Cases.All.Read
      - Cases.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Beschrijving
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: caseType
    required: true
    label:
      en: Case type
      nl: Zaaktype
    persisted:
      column: case_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASETYPE
    osfType: referenceDataCode
  - key: version
    osfType: integer
    required: true
    label:
      en: Version
      nl: Versie
    defaultValue: 1
    persisted:
      column: version
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASETEMPLATESTATUS
    osfType: referenceDataCode
  - key: isDefault
    osfType: boolean
    required: true
    label:
      en: Default for case type
      nl: Standaard voor zaaktype
    description:
      en: When true this template is auto-selected when a case of this type is created
      nl: Indien waar wordt dit sjabloon automatisch geselecteerd bij het aanmaken van een zaak van dit type
    defaultValue: false
    persisted:
      column: is_default
      storageClass: core
  - key: allowAdHocSteps
    osfType: boolean
    required: true
    label:
      en: Allow ad-hoc steps
      nl: Ad-hoc stappen toestaan
    description:
      en: Whether case workers may add steps that are not part of the template
      nl: Of medewerkers stappen mogen toevoegen die niet in het sjabloon staan
    defaultValue: true
    persisted:
      column: allow_ad_hoc_steps
      storageClass: core
  - key: estimatedDurationHours
    osfType: integer
    required: false
    label:
      en: Estimated duration (hours)
      nl: Geschatte doorlooptijd (uren)
    description:
      en: Expected total case duration in hours
      nl: Verwachte totale zaakdoorlooptijd in uren
    persisted:
      column: estimated_duration_hours
      storageClass: core
  - key: defaultWorkQueueId
    required: false
    osfType: WorkQueue
    label:
      en: Default work queue
      nl: Standaard werkqueue
    description:
      en: Default triage queue for cases created from this template. Step templates can override this queue.
      nl: Standaard triagequeue voor zaken die vanuit dit sjabloon worden gemaakt. Stapdefinities kunnen deze queue
        overschrijven.
    validation:
      format: uuid
    options:
      type: remote
      remoteUrl: /api/workflow/designer/core-entity-options?entity=work-queue
    persisted:
      column: default_work_queue_id
      storageClass: core
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
  - key: completionApprovalGroupId
    required: false
    osfType: RelationGroup
    label:
      en: Completion approval group
      nl: Afrondingsgoedkeuringsgroep
    description:
      en: Relation group whose members may manually complete case steps that require approval.
      nl: Relatiegroep waarvan leden zaakstappen met handmatige goedkeuring mogen afronden.
    validation:
      format: uuid
    options:
      type: remote
      remoteUrl: /api/workflow/designer/core-entity-options?entity=relation-group
    persisted:
      column: completion_approval_group_id
      storageClass: core
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
  - key: fieldDefinitions
    label:
      en: Case variables
      nl: Zaakvariabelen
    description:
      en: Field definitions that become the variable contract for cases created from this definition.
      nl: Velddefinities die het variabelencontract vormen voor zaken die vanuit deze definitie worden gestart.
    persisted:
      column: field_definitions
      storageClass: core
    layoutFraction: 1
    cardinality:
      min: 0
      max: unbounded
    osfType: fieldDefinition
    authoring:
      profile: workflowInputField
operations:
  list:
    name: List Case Template
    description: List CaseTemplate records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Case Template
    description: Get CaseTemplate records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Case Template
    description: Create CaseTemplate records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Case Template
    description: Update CaseTemplate records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Case Template
    description: Delete CaseTemplate records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
        wait: true
  web:
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
      caseType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASETYPE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASETEMPLATESTATUS
            clearable: false
      defaultWorkQueueId:
        render:
          component: OptionVariablePicker
          props:
            valueMode: selectId
      completionApprovalGroupId:
        render:
          component: OptionVariablePicker
          props:
            valueMode: selectId
            clearable: true
