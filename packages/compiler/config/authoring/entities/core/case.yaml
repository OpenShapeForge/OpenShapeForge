schemaVersion: 3
kind: coreEntity
module: core
entity: Case
title: Case
description: A first-class operational case for service, housing, governance, and case-file-driven work.
language: en
displayTemplate: "{{title}}"
filterField: title
labels:
  en: Case
  nl: Zaak
domains:
  - cases
  - service
indexes:
  - name: cases_tenant_code_uidx
    fields:
      - tenantId
      - code
    unique: true
retention:
  mode: policyRef
  policy: case-delete-7y
  scope: record
  startsFrom:
    strategy: firstNonNull
    fields:
      - closedAt
      - registeredAt
authorization:
  roles:
    read:
      - Cases.All.Read
      - Cases.All.ReadWrite
    create:
      - Cases.All.ReadWrite
    update:
      - Cases.All.ReadWrite
    delete:
      - Cases.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Human-readable case code.
      nl: Menselijk leesbare zaakcode.
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: code
      storageClass: core
  - key: title
    osfType: string
    required: true
    label:
      en: Title
      nl: Titel
    description:
      en: Short title of the case.
      nl: Korte titel van de zaak.
    validation:
      minLength: 1
      maxLength: 300
    persisted:
      column: title
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Beschrijving
    description:
      en: Full case description and context.
      nl: Volledige omschrijving en context van de zaak.
    validation:
      maxLength: 10000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: category
    required: false
    label:
      en: Category
      nl: Categorie
    description:
      en: Functional category of the case.
      nl: Functionele categorie van de zaak.
    persisted:
      column: category
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASECATEGORY
    osfType: referenceDataCode
  - key: caseType
    required: true
    label:
      en: Case type
      nl: Zaaktype
    description:
      en: Main case type code.
      nl: Hoofdzaaktypecode.
    persisted:
      column: case_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASETYPE
    osfType: referenceDataCode
  - key: caseSubType
    osfType: string
    required: false
    label:
      en: Case subtype
      nl: Zaaksubtype
    description:
      en: More specific subtype inside the selected case type.
      nl: Meer specifiek subtype binnen het gekozen zaaktype.
    validation:
      maxLength: 100
    persisted:
      column: case_sub_type
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Current lifecycle status of the case.
      nl: Huidige levenscyclusstatus van de zaak.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASESTATUS
    osfType: referenceDataCode
  - key: routingStatus
    required: false
    label:
      en: Routing status
      nl: Routeringsstatus
    description:
      en: Current routing and operational handling stage.
      nl: Huidige routerings- en behandelfase.
    persisted:
      column: routing_status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEROUTINGSTATUS
    osfType: referenceDataCode
  - key: priority
    required: false
    label:
      en: Priority
      nl: Prioriteit
    description:
      en: Operational priority of the case.
      nl: Operationele prioriteit van de zaak.
    persisted:
      column: priority
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEPRIORITY
    osfType: referenceDataCode
  - key: originChannel
    required: false
    label:
      en: Origin channel
      nl: Herkomstkanaal
    description:
      en: Channel through which the case originated.
      nl: Kanaal waarlangs de zaak is ontstaan.
    persisted:
      column: origin_channel
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEORIGINCHANNEL
    osfType: referenceDataCode
  - key: fieldDefinitions
    label:
      en: Case variables
      nl: Zaakvariabelen
    description:
      en: Field definitions for case-scoped variables that process and case-step workflows can read and update.
      nl: Velddefinities voor zaakvariabelen die proces- en zaakstapworkflows kunnen lezen en bijwerken.
    persisted:
      column: field_definitions
      storageClass: core
    layoutFraction: 1
    cardinality:
      min: 0
      max: unbounded
    osfType: fieldDefinition
    authoring:
      profile: workflowInputField
  - key: confidentiality
    required: false
    label:
      en: Confidentiality
      nl: Vertrouwelijkheid
    description:
      en: Confidentiality classification of the case.
      nl: Vertrouwelijkheidsclassificatie van de zaak.
    persisted:
      column: confidentiality
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASECONFIDENTIALITY
    osfType: referenceDataCode
  - key: waitingReason
    required: false
    label:
      en: Waiting reason
      nl: Wachtrede
    description:
      en: Why the case is currently waiting or paused.
      nl: Waarom de zaak momenteel wacht of gepauzeerd is.
    persisted:
      column: waiting_reason
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEWAITINGREASON
    osfType: referenceDataCode
  - key: breachState
    required: false
    label:
      en: Breach state
      nl: SLA-status
    description:
      en: SLA risk or breach state of the case.
      nl: SLA-risico of overschrijdingsstatus van de zaak.
    persisted:
      column: breach_state
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEBREACHSTATE
    osfType: referenceDataCode
  - key: registeredAt
    osfType: datetime
    required: true
    label:
      en: Registered at
      nl: Geregistreerd op
    description:
      en: Timestamp when the case was registered.
      nl: Tijdstip waarop de zaak is geregistreerd.
    persisted:
      column: registered_at
      storageClass: core
  - key: startedAt
    osfType: datetime
    required: false
    label:
      en: Started at
      nl: Gestart op
    description:
      en: Timestamp when work on the case started.
      nl: Tijdstip waarop de behandeling van de zaak startte.
    persisted:
      column: started_at
      storageClass: core
  - key: routedAt
    osfType: datetime
    required: false
    label:
      en: Routed at
      nl: Gerouteerd op
    description:
      en: Timestamp when the case was routed to the active queue.
      nl: Tijdstip waarop de zaak naar de actieve queue is gerouteerd.
    persisted:
      column: routed_at
      storageClass: core
  - key: lastCustomerContactAt
    osfType: datetime
    required: false
    label:
      en: Last customer contact at
      nl: Laatste klantcontact op
    description:
      en: Timestamp of the latest meaningful customer contact.
      nl: Tijdstip van het laatste betekenisvolle klantcontact.
    persisted:
      column: last_customer_contact_at
      storageClass: core
  - key: nextActionAt
    osfType: datetime
    required: false
    label:
      en: Next action at
      nl: Volgende actie op
    description:
      en: Planned timestamp for the next operational action.
      nl: Gepland tijdstip voor de volgende operationele actie.
    persisted:
      column: next_action_at
      storageClass: core
  - key: plannedEndAt
    osfType: datetime
    required: false
    label:
      en: Planned end at
      nl: Geplande einddatum
    description:
      en: Planned completion timestamp.
      nl: Gepland afrondmoment.
    persisted:
      column: planned_end_at
      storageClass: core
  - key: dueAt
    osfType: datetime
    required: false
    label:
      en: Due at
      nl: Uiterste datum
    description:
      en: Deadline for the case.
      nl: Deadline van de zaak.
    persisted:
      column: due_at
      storageClass: core
  - key: firstResponseDueAt
    osfType: datetime
    required: false
    label:
      en: First response due at
      nl: Eerste reactie uiterlijk op
    description:
      en: Deadline for the first response milestone.
      nl: Deadline voor de eerste reactiemijlpaal.
    persisted:
      column: first_response_due_at
      storageClass: core
  - key: resolutionDueAt
    osfType: datetime
    required: false
    label:
      en: Resolution due at
      nl: Oplossing uiterlijk op
    description:
      en: Deadline for resolution of the case.
      nl: Deadline voor oplossing van de zaak.
    persisted:
      column: resolution_due_at
      storageClass: core
  - key: closedAt
    osfType: datetime
    required: false
    readOnly: true
    label:
      en: Closed at
      nl: Gesloten op
    description:
      en: Timestamp when the case was closed.
      nl: Tijdstip waarop de zaak is gesloten.
    persisted:
      column: closed_at
      storageClass: core
  - key: portalVisible
    osfType: boolean
    required: true
    label:
      en: Portal visible
      nl: Zichtbaar in portaal
    description:
      en: Whether the case is visible in customer-facing channels.
      nl: Of de zaak zichtbaar is in klantgerichte kanalen.
    defaultValue: true
    persisted:
      column: portal_visible
      storageClass: core
  - key: resultSummary
    osfType: string
    required: false
    label:
      en: Result summary
      nl: Resultaatsamenvatting
    description:
      en: Short summary of the achieved result.
      nl: Korte samenvatting van het behaalde resultaat.
    validation:
      maxLength: 500
    persisted:
      column: result_summary
      storageClass: core
  - key: resultDetails
    required: false
    label:
      en: Result details
      nl: Resultaattoelichting
    description:
      en: Detailed result or closure notes.
      nl: Gedetailleerde resultaat- of afsluitnotities.
    validation:
      maxLength: 4000
    persisted:
      column: result_details
      storageClass: core
    osfType: multilineText
  - key: aiSummary
    required: false
    readOnly: true
    label:
      en: AI summary
      nl: AI-samenvatting
    description:
      en: Cached AI-generated summary of the case context.
      nl: Opgeslagen AI-samenvatting van de zaakcontext.
    validation:
      maxLength: 8000
    persisted:
      column: ai_summary
      storageClass: core
    osfType: multilineText
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional code in a connected source system.
      nl: Functionele code in een gekoppeld bronsysteem.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: primaryRelationId
    label:
      en: Primary relation
      nl: Primaire relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse:
        label:
          en: Cases
          nl: Zaken
  - key: caseFileId
    label:
      en: Case file
      nl: Dossier
    persisted:
      column: case_file_id
      storageClass: core
    osfType: CaseFile
    relationship:
      ownership: reference
      inverse:
        label:
          en: Cases
          nl: Zaken
  - key: currentQueueId
    label:
      en: Current queue
      nl: Huidige queue
    persisted:
      column: work_queue_id
      storageClass: core
    osfType: WorkQueue
    relationship:
      ownership: reference
      inverse:
        label:
          en: Cases
          nl: Zaken
  - key: slaPolicyId
    label:
      en: SLA policy
      nl: SLA-beleid
    persisted:
      column: sla_policy_id
      storageClass: core
    osfType: SlaPolicy
    relationship:
      ownership: reference
      inverse:
        label:
          en: Cases
          nl: Zaken
  - key: parentCaseId
    label:
      en: Parent case
      nl: Hoofdzaak
    persisted:
      column: parent_case_id
      storageClass: core
    osfType: Case
    relationship:
      ownership: reference
      inverse:
        key: childCases
        label:
          en: Child cases
          nl: Deelzaken
operations:
  list:
    name: List Case
    description: List Case records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Case
    description: Get Case records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Case
    description: Create Case records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Case
    description: Update Case records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Case
    description: Delete Case records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
        wait: true
  web:
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 6
            maxLength: 10000
      category:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASECATEGORY
            clearable: true
      caseType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASETYPE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASESTATUS
            clearable: false
      routingStatus:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASEROUTINGSTATUS
            clearable: true
      priority:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASEPRIORITY
            clearable: true
      originChannel:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASEORIGINCHANNEL
            clearable: true
      confidentiality:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASECONFIDENTIALITY
            clearable: true
      waitingReason:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASEWAITINGREASON
            clearable: true
      breachState:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASEBREACHSTATE
            clearable: true
      registeredAt:
        render:
          component: DateTimePicker
          props: {}
      startedAt:
        render:
          component: DateTimePicker
          props: {}
      routedAt:
        render:
          component: DateTimePicker
          props: {}
      lastCustomerContactAt:
        render:
          component: DateTimePicker
          props: {}
      nextActionAt:
        render:
          component: DateTimePicker
          props: {}
      plannedEndAt:
        render:
          component: DateTimePicker
          props: {}
      dueAt:
        render:
          component: DateTimePicker
          props: {}
      firstResponseDueAt:
        render:
          component: DateTimePicker
          props: {}
      resolutionDueAt:
        render:
          component: DateTimePicker
          props: {}
      closedAt:
        render:
          component: DateTimePicker
          props: {}
      resultDetails:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 4000
      aiSummary:
        render:
          component: Textarea
          props:
            rows: 6
            maxLength: 8000
