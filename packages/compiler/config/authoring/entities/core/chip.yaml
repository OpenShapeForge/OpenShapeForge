schemaVersion: 3
kind: coreEntity
module: core
entity: Chip
title: Chip
description: A tenant-scoped reusable global text variable for authored messages, templates, and workflow configuration.
language: en
displayTemplate: "{{name}}"
filterField: name
labels:
  en: Chip
  nl: Chip
domains:
  - core
indexes:
  - name: chips_tenant_key_uidx
    fields:
      - tenantId
      - key
    unique: true
  - name: chips_tenant_active_category_name_idx
    fields:
      - tenantId
      - isActive
      - category
      - name
authorization:
  roles:
    read:
      - Organization.All.ReadWrite
      - General.All.Read
      - General.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
fields:
  - key: key
    osfType: string
    required: true
    label:
      en: Variable key
      nl: Variabele-sleutel
    description:
      en: Stable lower-case key used in templates as `{{chips.<key>}}`, for example `general.phone`.
      nl: Stabiele sleutel in kleine letters die in templates wordt gebruikt als `{{chips.<key>}}`, bijvoorbeeld
        `general.phone`.
    validation:
      minLength: 1
      maxLength: 160
      pattern: ^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$
    persisted:
      column: key
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: User-facing label shown in autocomplete and administration screens.
      nl: Leesbare naam in autocomplete en beheerschermen.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: value
    required: true
    label:
      en: Value
      nl: Waarde
    description:
      en: Plain text value inserted when this chip is rendered.
      nl: Platte tekstwaarde die wordt ingevoegd wanneer deze chip wordt gerenderd.
    validation:
      minLength: 1
      maxLength: 8000
    persisted:
      column: value
      storageClass: core
    osfType: multilineText
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional administrator note explaining where this variable is used.
      nl: Optionele beheernotitie over waar deze variabele wordt gebruikt.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: category
    osfType: string
    required: false
    label:
      en: Category
      nl: Categorie
    description:
      en: Optional grouping label for autocomplete.
      nl: Optioneel groepeerlabel voor autocomplete.
    validation:
      maxLength: 120
    persisted:
      column: category
      storageClass: core
  - key: isActive
    osfType: boolean
    required: true
    label:
      en: Active
      nl: Actief
    description:
      en: Inactive chips are hidden from autocomplete but still resolve in already-authored content.
      nl: Inactieve chips zijn verborgen in autocomplete, maar blijven oplossen in bestaande content.
    defaultValue: true
    persisted:
      column: is_active
      storageClass: core
operations:
  list:
    name: List Chip
    description: List Chip records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Chip
    description: Get Chip records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Chip
    description: Create Chip records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Chip
    description: Update Chip records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Chip
    description: Delete Chip records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    fields:
      value:
        render:
          component: InputMultiline
          props:
            rows: 5
            maxLength: 8000
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 500
