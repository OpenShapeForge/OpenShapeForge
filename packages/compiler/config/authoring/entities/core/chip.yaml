schemaVersion: 3
kind: coreEntity
module: core
entity: Chip
title: Chip
description: A tenant-scoped reusable global variable for authored messages, templates, and workflow configuration. Each
  variable stores the field definition that types its value, so what it may fill is decided by its own declared type.
language: en
displayTemplate: "{{name}}"
filterField: name
labels:
  en: Chip
  nl: Chip
pluralLabels:
  en: Chips
  nl: Chips
domains:
  - core
indexes:
  - name: chips_tenant_key_uidx
    fields:
      - tenantId
      - key
    unique: true
  - name: chips_tenant_active_category_name_idx
    fields:
      - tenantId
      - isActive
      - category
      - name
authorization:
  roles:
    read:
      - Organization.All.ReadWrite
      - General.All.Read
      - General.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
fields:
  - key: key
    osfType: string
    required: true
    label:
      en: Variable key
      nl: Variabele-sleutel
    description:
      en: Stable lower-case key used in templates as `{{chips.<key>}}`, for example `general.phone`.
      nl: Stabiele sleutel in kleine letters die in templates wordt gebruikt als `{{chips.<key>}}`, bijvoorbeeld
        `general.phone`.
    validation:
      minLength: 1
      maxLength: 160
      pattern: ^[a-z][a-z0-9]*(?:[.-][a-z0-9]+)*$
    persisted:
      column: key
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: User-facing label shown in autocomplete and administration screens.
      nl: Leesbare naam in autocomplete en beheerschermen.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: definition
    osfType: fieldDefinition
    required: true
    defaultValue: { key: value, osfType: string, required: false, validation: { minLength: 1, maxLength: 8000 } }
    authoring:
      profile: fullFieldDefinition
      lockedKeys: [key]
    label:
      en: Value type
      nl: Waardetype
    description:
      en: The field definition that types this variable's value. It is what a field the variable fills is checked
        against, so a text variable cannot fill a monetary field and the other way round. Its key is `value`.
      nl: De velddefinitie die de waarde van deze variabele typeert. Een veld dat de variabele invult wordt hiertegen
        gecontroleerd, dus een tekstvariabele kan geen geldbedrag invullen en omgekeerd. De sleutel is `value`.
    persisted:
      column: definition
      storageClass: core
  - key: value
    osfType: typedValue
    required: true
    typedBy:
      definitionField: definition
    label:
      en: Value
      nl: Waarde
    description:
      en: The variable's value, in the type its definition declares. Checked against that definition on every write.
      nl: De waarde van de variabele, in het type dat de definitie aangeeft. Wordt bij elke schrijfactie tegen die
        definitie gecontroleerd.
    persisted:
      column: value
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional administrator note explaining where this variable is used.
      nl: Optionele beheernotitie over waar deze variabele wordt gebruikt.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: category
    osfType: string
    required: false
    label:
      en: Category
      nl: Categorie
    description:
      en: Optional grouping label for autocomplete.
      nl: Optioneel groepeerlabel voor autocomplete.
    validation:
      maxLength: 120
    persisted:
      column: category
      storageClass: core
  - key: isActive
    osfType: boolean
    required: true
    label:
      en: Active
      nl: Actief
    description:
      en: Inactive chips are hidden from autocomplete but still resolve in already-authored content.
      nl: Inactieve chips zijn verborgen in autocomplete, maar blijven oplossen in bestaande content.
    defaultValue: true
    persisted:
      column: is_active
      storageClass: core
operations:
  list:
    name: List Chip
    description: List Chip records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Chip
    description: Get Chip records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Chip
    description: Create Chip records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Chip
    description: Update Chip records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Chip
    description: Delete Chip records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /chips
          nl: /chips
        title:
          en: Chips
          nl: Chips
        columns:
          - key: name
            sortable: true
          - key: value
          - key: category
            sortable: true
          - key: isActive
        defaultSort:
          key: name
          direction: asc
      record:
        routes:
          read:
            en: /chips/:id
            nl: /chips/:id
          create:
            en: /chips/new
            nl: /chips/new
        title: "{{name}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Variable
                    nl: Variabele
                  fields:
                    - key
                    - name
                    - definition
                    - value
                    - description
                    - category
                    - isActive
        modes:
          create:
            title:
              en: Create Chip
              nl: Chip aanmaken
            groups:
              - title:
                  en: Variable
                  nl: Variabele
                fields:
                  - key
                  - name
                  - definition
                  - value
                  - description
                  - category
                  - isActive
          update:
            title:
              en: Edit Chip
              nl: Chip bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 500
