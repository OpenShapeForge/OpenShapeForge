schemaVersion: 3
kind: coreEntity
module: core
entity: Comment
title: Comment
description: A textual comment attached to another entity (currently support issues), written by a human author or a
  workflow/AI node.
language: en
displayTemplate: "{{body}}"
filterField: body
labels:
  en: Comment
  nl: Opmerking
pluralLabels:
  en: Comments
  nl: Opmerkingen
domains:
  - comments
authorization:
  roles:
    read:
      - General.All.Read
      - General.All.ReadWrite
    create:
      - General.All.ReadWrite
    update:
      - General.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: body
    required: true
    label:
      en: Message
      nl: Bericht
    description:
      en: Body of the comment.
      nl: Inhoud van de opmerking.
    validation:
      minLength: 1
      maxLength: 5000
    persisted:
      column: body
      storageClass: core
    osfType: multilineText
  - key: source
    required: true
    label:
      en: Source
      nl: Bron
    description:
      en: Origin of the comment (human author, workflow AI node, or system).
      nl: Herkomst van de opmerking (menselijke auteur, AI-workflownode of systeem).
    defaultValue: human
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: source
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: COMMENTBRON
    osfType: referenceDataCode
  - key: supportIssueId
    label:
      en: Support issue
      nl: Supportverzoek
    persisted:
      column: support_issue_id
      storageClass: core
    osfType: SupportIssue
    relationship:
      ownership: reference
  # System-written attribution: the commenting user, not an input.
  - key: authorId
    readOnly: true
    label:
      en: Author
      nl: Auteur
    persisted:
      column: author_relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
operations:
  list:
    name: List Comment
    description: List Comment records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Comment
    description: Get Comment records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Comment
    description: Create Comment records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Comment records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /comments
          nl: /comments
        columns:
          - key: author
            sortable: false
            label:
              en: Author
              nl: Auteur
          - key: body
            sortable: false
          - key: source
            sortable: true
          - key: createdAt
            sortable: true
        title:
          en: Comments
          nl: Opmerkingen
        defaultSort:
          key: createdAt
          direction: desc
      record:
        routes:
          read:
            en: /comments/:id
            nl: /comments/:id
          create:
            en: /comments/create
            nl: /comments/aanmaken
        title: "{{body}}"
        subtitle: "{{source}}"
        badges:
          - source
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Comment
                    nl: Opmerking
                  fields:
                    - body
                    - source
        modes:
          create:
            title:
              en: New comment
              nl: Nieuwe opmerking
            groups:
              - title:
                  en: Comment
                  nl: Opmerking
                fields:
                  - body
                  - source
          update:
            title:
              en: Edit comment
              nl: Opmerking bewerken
    fields:
      body:
        render:
          component: Textarea
          props:
            rows: 5
            maxLength: 5000
      source:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: COMMENTBRON
            clearable: false
