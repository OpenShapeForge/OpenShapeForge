schemaVersion: 3
kind: coreEntity
module: core
entity: CommunicationPreference
title: Communication Preference
description: A business-level communication preference for a relation or contact detail, including preferred channel and
  consent state.
language: en
displayTemplate: "{{type}}"
filterField: type
labels:
  en: Communication Preference
  nl: Communicatievoorkeur
domains:
  - relations
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: type
    valueType: string
    required: true
    label:
      en: Purpose
      nl: Doel
    description:
      en: Communication purpose or notification type for which this preference applies.
      nl: Communicatiedoel of notificatietype waarvoor deze voorkeur geldt.
    validation:
      minLength: 1
      maxLength: 50
    options:
      type: referentiedata
      referentieGroep: COMMUNICATIONTYPE
    persisted:
      column: type
      storageClass: core
    semanticType: referenceDataCode
  - key: scope
    valueType: string
    required: true
    label:
      en: Scope
      nl: Scope
    description:
      en: Scope at which the preference applies, such as relation, contact detail, or tenant default.
      nl: Reikwijdte waarop de voorkeur geldt, zoals relatie, contactgegeven of tenant-standaard.
    defaultValue: relation
    validation:
      maxLength: 50
    options:
      type: referentiedata
      referentieGroep: COMMUNICATIONPREFERENCESCOPE
    persisted:
      column: scope
      storageClass: core
    semanticType: referenceDataCode
  - key: channel
    valueType: string
    required: true
    label:
      en: Channel
      nl: Kanaal
    description:
      en: Communication channel (e.g. email, phone, post).
      nl: Communicatiekanaal (bijv. e-mail, telefoon, post).
    validation:
      minLength: 1
      maxLength: 50
    options:
      type: referentiedata
      referentieGroep: COMMUNICATIONCHANNEL
    persisted:
      column: channel
      storageClass: core
    semanticType: referenceDataCode
  - key: status
    valueType: string
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the preference, such as active, expired, or revoked.
      nl: Levenscyclusstatus van de voorkeur, zoals actief, verlopen of ingetrokken.
    defaultValue: active
    validation:
      maxLength: 50
    options:
      type: referentiedata
      referentieGroep: COMMUNICATIONPREFERENCESTATUS
    persisted:
      column: status
      storageClass: core
    semanticType: referenceDataCode
  - key: isOptedIn
    valueType: boolean
    required: true
    label:
      en: Opted in
      nl: Toestemming
    description:
      en: Whether the relation has opted in to this communication.
      nl: Of de relatie toestemming heeft gegeven voor deze communicatie.
    persisted:
      column: is_opted_in
      storageClass: core
  - key: validFrom
    valueType: date
    required: false
    label:
      en: Valid from
      nl: Geldig vanaf
    description:
      en: Date from which this preference is effective.
      nl: Datum vanaf wanneer deze voorkeur geldig is.
    persisted:
      column: valid_from
      storageClass: core
  - key: validUntil
    valueType: date
    required: false
    label:
      en: Valid until
      nl: Geldig tot
    description:
      en: Date until which this preference remains effective.
      nl: Datum tot wanneer deze voorkeur geldig blijft.
    persisted:
      column: valid_until
      storageClass: core
  - key: source
    valueType: string
    required: false
    label:
      en: Source
      nl: Bron
    description:
      en: Source from which this preference originated, such as self-service, import, or operator update.
      nl: Bron waaruit deze voorkeur is ontstaan, zoals selfservice, import of handmatige wijziging.
    validation:
      maxLength: 100
    persisted:
      column: source
      storageClass: core
  - key: notes
    valueType: string
    required: false
    label:
      en: Notes
      nl: Notities
    description:
      en: Additional notes or context about this preference.
      nl: Aanvullende notities of context bij deze voorkeur.
    validation:
      maxLength: 2000
    persisted:
      column: notes
      storageClass: core
    semanticType: multilineText
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    semanticType: Relation
    relationship:
      ownership: reference
  - key: contactDetailId
    label:
      en: Contact detail
      nl: Contactgegeven
    persisted:
      column: contact_detail_id
      storageClass: core
    semanticType: ContactDetail
    relationship:
      ownership: reference
operations:
  list:
    name: List Communication Preference
    description: List CommunicationPreference records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Communication Preference
    description: Get CommunicationPreference records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Communication Preference
    description: Create CommunicationPreference records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update CommunicationPreference records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /communication-preferences
          nl: /communicatievoorkeuren
        columns:
          - key: type
            sortable: true
          - key: scope
            sortable: true
          - key: channel
            sortable: true
          - key: isOptedIn
            sortable: true
        title:
          en: Communication Preferences
          nl: Communicatievoorkeuren
        defaultSort:
          key: type
          direction: asc
      record:
        routes:
          read:
            en: /communication-preferences/:id
            nl: /communicatievoorkeuren/:id
          create:
            en: /communication-preferences/create
            nl: /communicatievoorkeuren/aanmaken
        title: "{{type}} — {{channel}}"
        subtitle: "{{scope}}"
        badges:
          - type
          - channel
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Preference details
                    nl: Voorkeurgegevens
                  fields:
                    - type
                    - scope
                    - channel
                    - status
                    - isOptedIn
                    - validFrom
                    - validUntil
                    - source
                    - notes
        modes:
          create:
            title:
              en: Create communication preference
              nl: Communicatievoorkeur aanmaken
            groups:
              - title:
                  en: Preference details
                  nl: Voorkeurgegevens
                fields:
                  - type
                  - scope
                  - channel
                  - status
                  - isOptedIn
                  - validFrom
                  - validUntil
                  - source
                  - notes
          update:
            title:
              en: Edit communication preference
              nl: Communicatievoorkeur bewerken
    fields:
      type:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: COMMUNICATIONTYPE
            clearable: false
      scope:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: COMMUNICATIONPREFERENCESCOPE
            clearable: false
      channel:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: COMMUNICATIONCHANNEL
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: COMMUNICATIONPREFERENCESTATUS
            clearable: false
      validFrom:
        render:
          component: DatePicker
          props: {}
      validUntil:
        render:
          component: DatePicker
          props: {}
      notes:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
