schemaVersion: 3
kind: coreEntity
module: core
entity: ConditionAssessment
title: Condition Assessment
description: Periodic assessment of an asset's condition, scoring against a configurable scale and optionally linked to
  an inspection report.
language: en
displayTemplate: "{{assessedAt}}"
filterField: id
labels:
  en: Condition assessment
  nl: Conditiemeting
domains:
  - quality
fields:
  - key: assessedAt
    valueType: datetime
    required: true
    label:
      en: Assessed at
      nl: Beoordeeld op
    description:
      en: Timestamp when the assessment was performed.
      nl: Tijdstip waarop de beoordeling is uitgevoerd.
    persisted:
      column: assessed_at
      storageClass: core
  - key: score
    valueType: number
    required: false
    label:
      en: Score
      nl: Score
    description:
      en: Numeric assessment score.
      nl: Numerieke beoordelingsscore.
    persisted:
      column: score
      storageClass: core
  - key: scoreScale
    valueType: string
    required: false
    label:
      en: Score scale
      nl: Scoreschaal
    description:
      en: Scale the score is expressed on.
      nl: Schaal waarop de score is uitgedrukt.
    persisted:
      column: score_scale
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ASSESSMENTSCALE
    semanticType: referenceDataCode
  - key: notes
    valueType: string
    required: false
    label:
      en: Notes
      nl: Notities
    description:
      en: Free-form notes about the assessment.
      nl: Vrije notities over de beoordeling.
    validation:
      maxLength: 5000
    persisted:
      column: notes
      storageClass: core
    semanticType: multilineText
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the assessment in an external context.
      nl: Functionele of zakelijke code van de beoordeling in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: assessedById
    label:
      en: Assessed by
      nl: Beoordeeld door
    persisted:
      column: assessed_by_relation_id
      storageClass: core
    semanticType: Relation
    relationship:
      ownership: reference
  - key: inspectionReportId
    label:
      en: Inspection report
      nl: Inspectierapport
    persisted:
      column: inspection_report_id
      storageClass: core
    semanticType: InspectionReport
    relationship:
      ownership: reference
  - key: assetId
    label:
      en: Asset
      nl: Object
    persisted:
      column: asset_reference
      storageClass: core
    semanticType: Asset
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Quality.All.Read
      - Quality.All.ReadWrite
    create:
      - Quality.All.ReadWrite
    update:
      - Quality.All.ReadWrite
    delete:
      - Quality.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Condition Assessment
    description: List ConditionAssessment records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Condition Assessment
    description: Get ConditionAssessment records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Condition Assessment
    description: Create ConditionAssessment records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update ConditionAssessment records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /condition-assessments
          nl: /conditiemetingen
        columns:
          - key: assessedAt
            sortable: true
          - key: score
            sortable: true
          - key: scoreScale
            sortable: true
        title:
          en: Condition assessments
          nl: Conditiemetingen
        defaultSort:
          key: assessedAt
          direction: desc
      record:
        routes:
          read:
            en: /condition-assessments/:id
            nl: /conditiemetingen/:id
          create:
            en: /condition-assessments/create
            nl: /conditiemetingen/aanmaken
        title: "{{assessedAt}}"
        subtitle: "{{score}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Assessment details
                    nl: Beoordelingsgegevens
                  fields:
                    - assessedAt
                    - score
                    - scoreScale
                - title:
                    en: Notes
                    nl: Notities
                  fields:
                    - notes
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create condition assessment
              nl: Conditiemeting aanmaken
            groups:
              - title:
                  en: Assessment details
                  nl: Beoordelingsgegevens
                fields:
                  - assessedAt
                  - score
                  - scoreScale
              - title:
                  en: Notes
                  nl: Notities
                fields:
                  - notes
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit condition assessment
              nl: Conditiemeting bewerken
    fields:
      assessedAt:
        render:
          component: DateTimePicker
          props: {}
      scoreScale:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ASSESSMENTSCALE
            clearable: true
      notes:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
