schemaVersion: 1
kind: coreEntity
module: core
entity: ContactDetail
title: Contact Detail
description: A contact detail such as a phone number, email address, or other reachability channel.
language: en
displayTemplate: "{{value}}"
filterField: value
labels:
  en: Contact Detail
  nl: Contactgegeven
domains:
  - relations
authorization:
  roles:
    read:
      - Relaties.All.Read
      - Relaties.All.ReadWrite
    create:
      - Relaties.All.ReadWrite
    update:
      - Relaties.All.ReadWrite
    delete:
      - Relaties.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: relationId
    valueType: string
    required: false
    label:
      en: Relation ID
      nl: Relatie ID
    description:
      en: Identifier of the related relation instance.
      nl: Identifier van de gerelateerde relatie-instantie.
    semanticType: relationId
    persisted:
      column: relation_id
      storageClass: core
    validation:
      format: uuid
  - key: type
    valueType: string
    required: true
    label:
      en: Type
      nl: Type
    description:
      en: Type of contact detail (e.g. phone, email, mobile, fax).
      nl: Type contactgegeven (bijv. telefoon, e-mail, mobiel, fax).
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: type
      storageClass: core
    render:
      component: ReferenceSelect
      props:
        referentieGroep: CONTACTGEGEVENSOORT
        clearable: false
  - key: value
    valueType: string
    required: true
    label:
      en: Value
      nl: Waarde
    description:
      en: The actual contact value (phone number, email address, etc.).
      nl: De daadwerkelijke contactwaarde (telefoonnummer, e-mailadres, etc.).
    validation:
      minLength: 1
      maxLength: 300
    persisted:
      column: value
      storageClass: core
    render:
      component: Input
      props: {}
  - key: detailType
    valueType: string
    required: false
    label:
      en: Detail type
      nl: Detailtype
    description:
      en: More specific subtype of the contact detail, such as private, work, mobile, or billing.
      nl: Meer specifiek subtype van het contactgegeven, zoals prive, werk, mobiel of facturatie.
    validation:
      maxLength: 100
    persisted:
      column: detail_type
      storageClass: core
  - key: status
    valueType: string
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Current status of this contact detail (e.g. active, inactive).
      nl: Huidige status van dit contactgegeven (bijv. actief, inactief).
    validation:
      maxLength: 50
    persisted:
      column: status
      storageClass: core
  - key: confidentiality
    valueType: string
    required: false
    label:
      en: Confidentiality
      nl: Vertrouwelijkheid
    description:
      en: Confidentiality level associated with this contact detail.
      nl: Vertrouwelijkheidsniveau dat hoort bij dit contactgegeven.
    validation:
      maxLength: 50
    persisted:
      column: confidentiality
      storageClass: core
  - key: isPrimary
    valueType: boolean
    required: false
    label:
      en: Primary
      nl: Primair
    description:
      en: Whether this is the primary contact detail of its type.
      nl: Of dit het primaire contactgegeven van dit type is.
    persisted:
      column: is_primary
      storageClass: core
  - key: preferenceRank
    valueType: integer
    required: false
    label:
      en: Preference rank
      nl: Voorkeursvolgorde
    description:
      en: Relative ranking among contact details of the same type.
      nl: Relatieve volgorde ten opzichte van andere contactgegevens van hetzelfde type.
    persisted:
      column: preference_rank
      storageClass: core
  - key: isReachable
    valueType: boolean
    required: false
    label:
      en: Reachable
      nl: Bereikbaar
    description:
      en: Whether this contact detail is currently considered reachable.
      nl: Of dit contactgegeven momenteel als bereikbaar wordt beschouwd.
    persisted:
      column: is_reachable
      storageClass: core
  - key: verifiedAt
    valueType: datetime
    required: false
    label:
      en: Verified at
      nl: Geverifieerd op
    description:
      en: Date and time when this contact detail was last verified.
      nl: Datum en tijd waarop dit contactgegeven voor het laatst is geverifieerd.
    persisted:
      column: verified_at
      storageClass: core
    render:
      component: DateTimePicker
      props: {}
  - key: consentStatus
    valueType: string
    required: false
    label:
      en: Consent status
      nl: Toestemmingsstatus
    description:
      en: Latest consent or permission state associated with using this contact detail.
      nl: Laatste toestemmings- of permissiestatus voor het gebruik van dit contactgegeven.
    validation:
      maxLength: 50
    options:
      type: referentiedata
      referentieGroep: CONTACTGEGEVENTOESTEMMINGSSTATUS
    persisted:
      column: consent_status
      storageClass: core
    render:
      component: ReferenceSelect
      props:
        referentieGroep: CONTACTGEGEVENTOESTEMMINGSSTATUS
        clearable: true
  - key: validFrom
    valueType: date
    required: false
    label:
      en: Valid from
      nl: Geldig vanaf
    description:
      en: Date from which this contact detail is valid.
      nl: Datum vanaf wanneer dit contactgegeven geldig is.
    persisted:
      column: valid_from
      storageClass: core
    render:
      component: DatePicker
      props: {}
  - key: validUntil
    valueType: date
    required: false
    label:
      en: Valid until
      nl: Geldig tot
    description:
      en: Date until which this contact detail is valid.
      nl: Datum tot wanneer dit contactgegeven geldig is.
    persisted:
      column: valid_until
      storageClass: core
    render:
      component: DatePicker
      props: {}
relationships:
  - key: relation
    kind: belongsTo
    target: Relation
    foreignKey: relation_id
    label:
      en: Relation
      nl: Relatie
  - key: relationRole
    kind: belongsTo
    target: RelationRole
    foreignKey: relation_role_id
    label:
      en: Relation role
      nl: Relatierol
ui:
  routes:
    list:
      en: /contact-details
      nl: /contactgegevens
    detail:
      en: /contact-details/:id
      nl: /contactgegevens/:id
    create:
      en: /contact-details/create
      nl: /contactgegevens/aanmaken
    edit:
      en: /contact-details/:id/edit
      nl: /contactgegevens/:id/bewerken
    delete:
      en: /contact-details/:id/delete
      nl: /contactgegevens/:id/verwijderen
  presentations:
    list:
      title:
        en: Contact Details
        nl: Contactgegevens
      columns:
        - key: type
          sortable: true
        - key: detailType
          sortable: true
        - key: value
          sortable: true
        - key: isPrimary
          sortable: true
      defaultSort:
        key: type
        direction: asc
      rowLink:
        en: /contact-details/:id
        nl: /contactgegevens/:id
    detail:
      header:
        title: "{{type}}: {{value}}"
        subtitle: "{{status}}"
      actions:
        - key: edit
          label:
            en: Edit
            nl: Bewerken
          route: edit
        - key: delete
          label:
            en: Delete
            nl: Verwijderen
          confirm:
            en: Are you sure?
            nl: Weet je het zeker?
          mutation: delete
      groups:
        - id: overview
          label:
            en: Overview
            nl: Overzicht
          groups:
            - title:
                en: Contact information
                nl: Contactinformatie
              fields:
                - type
                - detailType
                - value
                - status
                - confidentiality
                - isPrimary
                - preferenceRank
                - isReachable
                - consentStatus
                - validFrom
                - validUntil
                - verifiedAt
    form:
      variants:
        create:
          title:
            en: Create contact detail
            nl: Contactgegeven aanmaken
          groups:
            - title:
                en: Contact information
                nl: Contactinformatie
              fields:
                - type
                - detailType
                - value
                - status
                - confidentiality
                - isPrimary
                - preferenceRank
                - isReachable
                - consentStatus
                - verifiedAt
        edit:
          extends: create
          title:
            en: Edit contact detail
            nl: Contactgegeven bewerken
workflow:
  nodes:
    actions:
      create: true
      getOne: true
      list: true
      update: true
      delete: true
