schemaVersion: 3
kind: coreEntity
module: core
entity: ContactDetail
title: Contact Detail
description: A contact detail such as a phone number, email address, or other reachability channel.
language: en
displayTemplate: "{{value}}"
filterField: value
labels:
  en: Contact Detail
  nl: Contactgegeven
pluralLabels:
  en: Contact details
  nl: Contactgegevens
domains:
  - relations
authorization:
  roles:
    read:
      - Relations.Relation.ReadWrite
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: relationId
    required: false
    label:
      en: Relation ID
      nl: Relatie ID
    description:
      en: Identifier of the related relation instance.
      nl: Identifier van de gerelateerde relatie-instantie.
    osfType: Relation
    persisted:
      column: relation_id
      storageClass: core
    validation:
      format: uuid
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
  - key: type
    osfType: string
    required: true
    label:
      en: Type
      nl: Type
    description:
      en: Type of contact detail (e.g. phone, email, mobile, fax).
      nl: Type contactgegeven (bijv. telefoon, e-mail, mobiel, fax).
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CONTACTDETAILTYPE
  - key: value
    osfType: string
    required: true
    label:
      en: Value
      nl: Waarde
    description:
      en: The actual contact value (phone number, email address, etc.).
      nl: De daadwerkelijke contactwaarde (telefoonnummer, e-mailadres, etc.).
    validation:
      minLength: 1
      maxLength: 300
    persisted:
      column: value
      storageClass: core
  - key: detailType
    osfType: string
    required: false
    label:
      en: Detail type
      nl: Detailtype
    description:
      en: More specific subtype of the contact detail, such as private, work, mobile, or billing.
      nl: Meer specifiek subtype van het contactgegeven, zoals prive, werk, mobiel of facturatie.
    validation:
      maxLength: 100
    persisted:
      column: detail_type
      storageClass: core
  - key: status
    osfType: string
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Current status of this contact detail (e.g. active, inactive).
      nl: Huidige status van dit contactgegeven (bijv. actief, inactief).
    validation:
      maxLength: 50
    persisted:
      column: status
      storageClass: core
  - key: confidentiality
    osfType: string
    required: false
    label:
      en: Confidentiality
      nl: Vertrouwelijkheid
    description:
      en: Confidentiality level associated with this contact detail.
      nl: Vertrouwelijkheidsniveau dat hoort bij dit contactgegeven.
    validation:
      maxLength: 50
    persisted:
      column: confidentiality
      storageClass: core
  - key: isPrimary
    osfType: boolean
    required: false
    label:
      en: Primary
      nl: Primair
    description:
      en: Whether this is the primary contact detail of its type.
      nl: Of dit het primaire contactgegeven van dit type is.
    persisted:
      column: is_primary
      storageClass: core
  - key: preferenceRank
    osfType: integer
    required: false
    label:
      en: Preference rank
      nl: Voorkeursvolgorde
    description:
      en: Relative ranking among contact details of the same type.
      nl: Relatieve volgorde ten opzichte van andere contactgegevens van hetzelfde type.
    persisted:
      column: preference_rank
      storageClass: core
  - key: isReachable
    osfType: boolean
    required: false
    label:
      en: Reachable
      nl: Bereikbaar
    description:
      en: Whether this contact detail is currently considered reachable.
      nl: Of dit contactgegeven momenteel als bereikbaar wordt beschouwd.
    persisted:
      column: is_reachable
      storageClass: core
  - key: verifiedAt
    osfType: datetime
    required: false
    label:
      en: Verified at
      nl: Geverifieerd op
    description:
      en: Date and time when this contact detail was last verified.
      nl: Datum en tijd waarop dit contactgegeven voor het laatst is geverifieerd.
    persisted:
      column: verified_at
      storageClass: core
  - key: consentStatus
    osfType: string
    required: false
    label:
      en: Consent status
      nl: Toestemmingsstatus
    description:
      en: Latest consent or permission state associated with using this contact detail.
      nl: Laatste toestemmings- of permissiestatus voor het gebruik van dit contactgegeven.
    validation:
      maxLength: 50
    options:
      type: referentiedata
      referentieGroep: CONTACTDETAILCONSENTSTATUS
    persisted:
      column: consent_status
      storageClass: core
  - key: validFrom
    osfType: date
    required: false
    label:
      en: Valid from
      nl: Geldig vanaf
    description:
      en: Date from which this contact detail is valid.
      nl: Datum vanaf wanneer dit contactgegeven geldig is.
    persisted:
      column: valid_from
      storageClass: core
  - key: validUntil
    osfType: date
    required: false
    label:
      en: Valid until
      nl: Geldig tot
    description:
      en: Date until which this contact detail is valid.
      nl: Datum tot wanneer dit contactgegeven geldig is.
    persisted:
      column: valid_until
      storageClass: core
  - key: relationRoleId
    label:
      en: Relation role
      nl: Relatierol
    persisted:
      column: relation_role_id
      storageClass: core
    osfType: RelationRole
    relationship:
      ownership: reference
operations:
  list:
    name: { en: List contact details, nl: Contactgegevens tonen }
    description:
      en: Returns a filtered and sorted page of contact details.
      nl: Geeft een gefilterde en gesorteerde pagina met contactgegevens terug.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  get:
    name: { en: Get contact detail, nl: Contactgegeven ophalen }
    description:
      en: Returns one contact detail by its canonical id.
      nl: Geeft een contactgegeven terug op basis van het canonieke id.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  create:
    name: { en: Create contact detail, nl: Contactgegeven aanmaken }
    description:
      en: Creates one contact detail after validating its canonical fields.
      nl: Maakt een contactgegeven aan na validatie van de canonieke velden.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    confirmation: { mode: none }
  update:
    name: { en: Update contact detail, nl: Contactgegeven wijzigen }
    description:
      en: Updates one contact detail while holding its server-issued edit lease and current version.
      nl: Wijzigt een contactgegeven met de server-uitgegeven bewerkingslease en actuele versie.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation: { mode: none }
  delete:
    name: { en: Delete contact detail, nl: Contactgegeven verwijderen }
    description:
      en: Permanently deletes one contact detail after a server-issued, version-bound confirmation challenge.
      nl: Verwijdert een contactgegeven definitief na een door de server uitgegeven, versiegebonden bevestigingsvraag.
    implementation: { type: entity, action: delete }
    effects: { data: delete, external: none }
    reliability:
      idempotency: { mode: natural }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation:
      mode: challenge
      challenge:
        kind: type-current-field
        field: value
        issuedBy: server
        bindTo: [ subject, tenant, operation, target.id, target.version ]
        expiresAfter: PT5M
        singleUse: true

interfaces:
  rest:
    operations:
      list: {}
      get: {}
      create: {}
      update: {}
      delete: {}
  mcp:
    operations:
      list: {}
      get: {}
      create: {}
      update:
        instructions:
          en: Acquire an edit lease first and submit its token with the version returned by get.
          nl: Vraag eerst een bewerkingslease aan en stuur het token mee met de versie uit get.
      delete:
        instructions:
          en: Acquire an edit lease first; request the confirmation challenge and answer it with the exact current contact value.
          nl: Vraag eerst een bewerkingslease en bevestigingsvraag aan en beantwoord die met exact de actuele contactwaarde.
    resource:
      uri: app://contact-details
      name: Contact details
      description: Read the contact details available to the signed-in identity.
      templateDescription: Read one contact detail by its canonical id.
  web:
    operations:
      list: {}
      get: {}
      create: {}
      update: {}
      delete: {}
    views:
      collection:
        route: { en: /contact-details, nl: /contactgegevens }
        title: { en: Contact details, nl: Contactgegevens }
        columns:
          - { key: type, sortable: true }
          - { key: detailType, sortable: true }
          - { key: value, sortable: true }
          - { key: isPrimary, sortable: true }
        defaultSort: { key: type, direction: asc }
      record:
        routes:
          read: { en: /contact-details/:id, nl: /contactgegevens/:id }
          create: { en: /contact-details/new, nl: /contactgegevens/nieuw }
        title: "{{type}}: {{value}}"
        subtitle: "{{status}}"
        actions: [ update, delete ]
        layout:
          context:
            fields: [ isPrimary, isReachable, confidentiality, validUntil ]
            relationships: [ relationId, relationRoleId ]
          tabs:
            - id: overview
              label: { en: Overview, nl: Overzicht }
              groups:
                - title: { en: Contact information, nl: Contactinformatie }
                  fields: [ type, detailType, value, status ]
                - title: { en: Contact preferences, nl: Contactvoorkeuren }
                  fields: [ isPrimary, preferenceRank, isReachable ]
                - title: { en: Privacy and verification, nl: Privacy en verificatie }
                  fields: [ confidentiality, consentStatus, verifiedAt ]
                - title: { en: Validity, nl: Geldigheid }
                  fields: [ validFrom, validUntil ]
        modes:
          create:
            title: { en: Create contact detail, nl: Contactgegeven aanmaken }
            groups:
              - title: { en: Contact information, nl: Contactinformatie }
                fields:
                  [
                    relationId,
                    type,
                    detailType,
                    value,
                    status,
                    confidentiality,
                    isPrimary,
                    preferenceRank,
                    isReachable,
                    consentStatus,
                    validFrom,
                    validUntil,
                    verifiedAt
                  ]
          update:
            title: { en: Update contact detail, nl: Contactgegeven wijzigen }
            groups:
              - title: { en: Contact information, nl: Contactinformatie }
                fields:
                  [
                    type,
                    detailType,
                    value,
                    status,
                    confidentiality,
                    isPrimary,
                    preferenceRank,
                    isReachable,
                    consentStatus,
                    validFrom,
                    validUntil,
                    verifiedAt
                  ]
