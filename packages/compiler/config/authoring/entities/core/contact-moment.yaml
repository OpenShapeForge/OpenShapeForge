schemaVersion: 3
kind: coreEntity
module: core
entity: ContactMoment
title: Contact Moment
description: A recorded interaction with or about a relation, such as a phone call, email, or chat.
language: en
displayTemplate: "{{subject}}"
filterField: subject
labels:
  en: Contact Moment
  nl: Contactmoment
domains:
  - relations
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
retention:
  mode: policyRef
  policy: contact-moment-delete-2y
  scope: record
  startsFrom:
    strategy: field
    field: occurredAt
fields:
  - key: channel
    required: true
    label:
      en: Channel
      nl: Kanaal
    description:
      en: Communication channel used (e.g. phone, email, chat).
      nl: Gebruikte communicatiekanaal (bijv. telefoon, e-mail, chat).
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: channel
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: COMMUNICATIONCHANNEL
    osfType: referenceDataCode
  - key: type
    osfType: string
    required: false
    label:
      en: Type
      nl: Type
    description:
      en: Business type or topic of the contact moment.
      nl: Zakelijk type of onderwerp van het contactmoment.
    validation:
      maxLength: 100
    persisted:
      column: type
      storageClass: core
  - key: detailType
    osfType: string
    required: false
    label:
      en: Detail type
      nl: Detailtype
    description:
      en: More specific subtype of the contact moment.
      nl: Meer specifiek subtype van het contactmoment.
    validation:
      maxLength: 100
    persisted:
      column: detail_type
      storageClass: core
  - key: direction
    required: false
    label:
      en: Direction
      nl: Richting
    description:
      en: Direction of the communication (inbound or outbound).
      nl: Richting van de communicatie (inkomend of uitgaand).
    validation:
      maxLength: 20
    persisted:
      column: direction
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: COMMUNICATIONDIRECTION
    osfType: referenceDataCode
  - key: subject
    osfType: string
    required: false
    label:
      en: Subject
      nl: Onderwerp
    description:
      en: Subject or summary of the contact moment.
      nl: Onderwerp of samenvatting van het contactmoment.
    validation:
      maxLength: 300
    persisted:
      column: subject
      storageClass: core
  - key: content
    required: false
    label:
      en: Content
      nl: Inhoud
    description:
      en: Full content or notes of the contact moment.
      nl: Volledige inhoud of notities van het contactmoment.
    validation:
      maxLength: 10000
    persisted:
      column: content
      storageClass: core
    osfType: multilineText
  - key: occurredAt
    osfType: datetime
    required: true
    label:
      en: Occurred at
      nl: Plaatsgevonden op
    description:
      en: Date and time when the contact moment occurred.
      nl: Datum en tijd waarop het contactmoment plaatsvond.
    persisted:
      column: occurred_at
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse:
        label:
          en: Contact moments
          nl: Contactmomenten
  - key: relationRoleId
    label:
      en: Relation role
      nl: Relatierol
    persisted:
      column: relation_role_id
      storageClass: core
    osfType: RelationRole
    relationship:
      ownership: reference
      inverse:
        label:
          en: Contact moments
          nl: Contactmomenten
  - key: caseId
    label:
      en: Case
      nl: Zaak
    persisted:
      column: case_id
      storageClass: core
    osfType: Case
    relationship:
      ownership: reference
      inverse:
        label:
          en: Contact moments
          nl: Contactmomenten
operations:
  list:
    name: List Contact Moment
    description: List ContactMoment records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Contact Moment
    description: Get ContactMoment records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Contact Moment
    description: Create ContactMoment records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update ContactMoment records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /contact-moments
          nl: /contactmomenten
        columns:
          - key: type
            sortable: true
          - key: channel
            sortable: true
          - key: direction
            sortable: true
          - key: subject
            sortable: true
          - key: occurredAt
            sortable: true
        title:
          en: Contact Moments
          nl: Contactmomenten
        defaultSort:
          key: occurredAt
          direction: desc
      record:
        routes:
          read:
            en: /contact-moments/:id
            nl: /contactmomenten/:id
          create:
            en: /contact-moments/create
            nl: /contactmomenten/aanmaken
        title: "{{subject}}"
        subtitle: "{{channel}} — {{occurredAt}}"
        badges:
          - channel
          - direction
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Contact details
                    nl: Contactgegevens
                  fields:
                    - type
                    - detailType
                    - channel
                    - direction
                    - occurredAt
                    - subject
                - title:
                    en: Content
                    nl: Inhoud
                  fields:
                    - content
            - id: tasks
              label:
                en: Tasks
                nl: Taken
              relationship: tasks
        modes:
          create:
            title:
              en: Create contact moment
              nl: Contactmoment aanmaken
            groups:
              - title:
                  en: Contact details
                  nl: Contactgegevens
                fields:
                  - type
                  - detailType
                  - channel
                  - direction
                  - occurredAt
                  - subject
              - title:
                  en: Content
                  nl: Inhoud
                fields:
                  - content
          update:
            title:
              en: Edit contact moment
              nl: Contactmoment bewerken
    fields:
      channel:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: COMMUNICATIONCHANNEL
            clearable: false
      direction:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: COMMUNICATIONDIRECTION
            clearable: true
      content:
        render:
          component: Textarea
          props:
            rows: 6
            maxLength: 10000
      occurredAt:
        render:
          component: DateTimePicker
          props: {}
