schemaVersion: 3
kind: coreEntity
module: core
entity: CostDimension
title: Cost Dimension
description: Analytical dimension (cost center, project, segment, department) used for ledger-line analysis.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Cost dimension
  nl: Kostendimensie
pluralLabels:
  en: Cost dimensions
  nl: Kostendimensies
domains:
  - finance
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique cost-dimension code.
      nl: Tenant-unieke kostendimensiecode.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the cost dimension.
      nl: Menselijk leesbare naam van de kostendimensie.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the cost dimension in an external context.
      nl: Functionele of zakelijke code van de kostendimensie in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: parentCostDimensionId
    label:
      en: Parent cost dimension
      nl: Bovenliggende kostendimensie
    persisted:
      column: parent_cost_dimension_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse:
        key: childCostDimensions
        label:
          en: Child cost dimensions
          nl: Onderliggende kostendimensies
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Cost Dimension
    description: List CostDimension records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Cost Dimension
    description: Get CostDimension records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Cost Dimension
    description: Create CostDimension records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update CostDimension records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /cost-dimensions
          nl: /kostendimensies
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
        title:
          en: Cost dimensions
          nl: Kostendimensies
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /cost-dimensions/:id
            nl: /kostendimensies/:id
          create:
            en: /cost-dimensions/create
            nl: /kostendimensies/aanmaken
        title: "{{code}} {{name}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Cost dimension details
                    nl: Kostendimensiegegevens
                  fields:
                    - code
                    - name
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create cost dimension
              nl: Kostendimensie aanmaken
            groups:
              - title:
                  en: Cost dimension details
                  nl: Kostendimensiegegevens
                fields:
                  - code
                  - name
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit cost dimension
              nl: Kostendimensie bewerken
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
