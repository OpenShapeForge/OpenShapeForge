schemaVersion: 3
kind: coreEntity
module: core
entity: Creditor
title: Creditor
description: Accounts payable sub-ledger role on a Relation. Carries control account, payment terms, default payment
  method, and finance-specific identifiers.
language: en
displayTemplate: "{{creditorNumber}}"
filterField: creditorNumber
labels:
  en: Creditor
  nl: Crediteur
domains:
  - finance
fields:
  - key: creditorNumber
    osfType: string
    required: true
    label:
      en: Creditor number
      nl: Crediteurnummer
    description:
      en: Tenant-unique creditor number used in the AP sub-ledger.
      nl: Tenant-uniek crediteurnummer in de crediteurenadministratie.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: creditor_number
      storageClass: core
  - key: status
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the creditor role assignment.
      nl: Levenscyclusstatus van de crediteurroltoewijzing.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ROLEASSIGNMENTSTATUS
    osfType: referenceDataCode
  - key: paymentTerms
    required: false
    label:
      en: Payment terms
      nl: Betalingstermijn
    description:
      en: Default payment terms applied to invoices from this creditor.
      nl: Standaard betalingstermijn die wordt toegepast op facturen van deze crediteur.
    persisted:
      column: payment_terms
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PAYMENTTERMS
    osfType: referenceDataCode
  - key: defaultIban
    osfType: string
    required: false
    label:
      en: Default IBAN
      nl: Standaard IBAN
    description:
      en: IBAN to use for outgoing payments to this creditor by default.
      nl: IBAN die standaard wordt gebruikt voor uitgaande betalingen aan deze crediteur.
    validation:
      maxLength: 34
    persisted:
      column: default_iban
      storageClass: core
  - key: vatNumber
    osfType: string
    required: false
    label:
      en: VAT number
      nl: BTW-nummer
    description:
      en: VAT identification number of the creditor.
      nl: BTW-identificatienummer van de crediteur.
    validation:
      maxLength: 50
    persisted:
      column: vat_number
      storageClass: core
  - key: chamberOfCommerceNumber
    osfType: string
    required: false
    label:
      en: Chamber of commerce number
      nl: KvK-nummer
    description:
      en: Chamber of commerce registration number of the creditor.
      nl: Inschrijvingsnummer Kamer van Koophandel van de crediteur.
    validation:
      maxLength: 50
    persisted:
      column: chamber_of_commerce_number
      storageClass: core
  - key: creditLimit
    required: false
    label:
      en: Credit limit
      nl: Kredietlimiet
    description:
      en: Maximum outstanding amount allowed for this creditor.
      nl: Maximaal toegestaan openstaand bedrag voor deze crediteur.
    osfType: currency
    persisted:
      column: credit_limit
      storageClass: core
  - key: currentBalance
    required: false
    label:
      en: Current balance
      nl: Huidig saldo
    description:
      en: Current outstanding balance — projection populated by the audit/timeline service.
      nl: Huidig openstaand saldo — projectie die door de audit/timeline-service wordt bijgewerkt.
    osfType: currency
    persisted:
      column: current_balance
      storageClass: core
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which the creditor role assignment is effective.
      nl: Datum vanaf wanneer de crediteurroltoewijzing geldig is.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which the creditor role assignment is effective.
      nl: Datum tot wanneer de crediteurroltoewijzing geldig is.
    persisted:
      column: end_date
      storageClass: core
  - key: name
    osfType: string
    required: false
    label:
      en: Name
      nl: Naam
    description:
      en: Optional human-readable name of the creditor role.
      nl: Optionele menselijk leesbare naam van de crediteurrol.
    validation:
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the creditor role assignment.
      nl: Optionele omschrijving of zakelijke betekenis van de crediteurroltoewijzing.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the creditor in an external context.
      nl: Functionele of zakelijke code van de crediteur in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  - key: defaultLedgerAccountId
    label:
      en: Default ledger account
      nl: Standaard grootboekrekening
    persisted:
      column: default_ledger_account_id
      storageClass: core
    osfType: LedgerAccount
    relationship:
      ownership: reference
  - key: defaultPaymentMethodId
    label:
      en: Default payment method
      nl: Standaard betaalwijze
    persisted:
      column: default_payment_method_id
      storageClass: core
    osfType: PaymentMethod
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Creditor
    description: List Creditor records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Creditor
    description: Get Creditor records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Creditor
    description: Create Creditor records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Creditor records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /creditors
          nl: /crediteuren
        columns:
          - key: creditorNumber
            sortable: true
          - key: name
            sortable: true
          - key: status
            sortable: true
          - key: paymentTerms
            sortable: true
          - key: currentBalance
            sortable: true
        title:
          en: Creditors
          nl: Crediteuren
        defaultSort:
          key: creditorNumber
          direction: asc
      record:
        routes:
          read:
            en: /creditors/:id
            nl: /crediteuren/:id
          create:
            en: /creditors/create
            nl: /crediteuren/aanmaken
        title: "{{creditorNumber}}"
        subtitle: "{{name}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Creditor details
                    nl: Crediteurgegevens
                  fields:
                    - creditorNumber
                    - status
                    - paymentTerms
                    - name
                    - startDate
                    - endDate
                - title:
                    en: Banking and identifiers
                    nl: Bank en identificaties
                  fields:
                    - defaultIban
                    - vatNumber
                    - chamberOfCommerceNumber
                - title:
                    en: Credit position
                    nl: Kredietpositie
                  fields:
                    - creditLimit
                    - currentBalance
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create creditor
              nl: Crediteur aanmaken
            groups:
              - title:
                  en: Creditor details
                  nl: Crediteurgegevens
                fields:
                  - creditorNumber
                  - status
                  - paymentTerms
                  - name
                  - startDate
                  - endDate
              - title:
                  en: Banking and identifiers
                  nl: Bank en identificaties
                fields:
                  - defaultIban
                  - vatNumber
                  - chamberOfCommerceNumber
              - title:
                  en: Credit position
                  nl: Kredietpositie
                fields:
                  - creditLimit
                  - currentBalance
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit creditor
              nl: Crediteur bewerken
    fields:
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ROLEASSIGNMENTSTATUS
            clearable: true
      paymentTerms:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PAYMENTTERMS
            clearable: true
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
