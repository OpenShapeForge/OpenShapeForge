schemaVersion: 3
kind: coreEntity
module: core
entity: Debtor
title: Debtor
description: Accounts receivable sub-ledger role on a Relation. Carries control account, payment terms, default mandate,
  dispatch channel, and finance-specific identifiers.
language: en
displayTemplate: "{{debtorNumber}}"
filterField: debtorNumber
labels:
  en: Debtor
  nl: Debiteur
pluralLabels:
  en: Debtors
  nl: Debiteuren
domains:
  - finance
fields:
  - key: debtorNumber
    osfType: string
    required: true
    label:
      en: Debtor number
      nl: Debiteurnummer
    description:
      en: Tenant-unique debtor number used in the AR sub-ledger.
      nl: Tenant-uniek debiteurnummer in de debiteurenadministratie.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: debtor_number
      storageClass: core
  - key: status
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the debtor role assignment.
      nl: Levenscyclusstatus van de debiteurroltoewijzing.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ROLEASSIGNMENTSTATUS
    osfType: referenceDataCode
  - key: paymentTerms
    required: false
    label:
      en: Payment terms
      nl: Betalingstermijn
    description:
      en: Default payment terms applied to invoices for this debtor.
      nl: Standaard betalingstermijn die wordt toegepast op facturen voor deze debiteur.
    persisted:
      column: payment_terms
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PAYMENTTERMS
    osfType: referenceDataCode
  - key: defaultIban
    osfType: string
    required: false
    label:
      en: Default IBAN
      nl: Standaard IBAN
    description:
      en: IBAN to use for collections from this debtor by default.
      nl: IBAN die standaard wordt gebruikt voor incasso bij deze debiteur.
    validation:
      maxLength: 34
    persisted:
      column: default_iban
      storageClass: core
  - key: defaultDispatchChannel
    required: false
    label:
      en: Default dispatch channel
      nl: Standaard verzendkanaal
    description:
      en: Preferred channel through which invoices are dispatched to this debtor.
      nl: Voorkeurskanaal waarlangs facturen aan deze debiteur worden verzonden.
    persisted:
      column: default_dispatch_channel
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: INVOICEDISPATCHCHANNEL
    osfType: referenceDataCode
  - key: creditLimit
    required: false
    label:
      en: Credit limit
      nl: Kredietlimiet
    description:
      en: Maximum outstanding amount allowed for this debtor.
      nl: Maximaal toegestaan openstaand bedrag voor deze debiteur.
    osfType: currency
    persisted:
      column: credit_limit
      storageClass: core
  - key: currentBalance
    required: false
    label:
      en: Current balance
      nl: Huidig saldo
    description:
      en: Current outstanding balance — projection populated by the audit/timeline service.
      nl: Huidig openstaand saldo — projectie die door de audit/timeline-service wordt bijgewerkt.
    osfType: currency
    persisted:
      column: current_balance
      storageClass: core
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which the debtor role assignment is effective.
      nl: Datum vanaf wanneer de debiteurroltoewijzing geldig is.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which the debtor role assignment is effective.
      nl: Datum tot wanneer de debiteurroltoewijzing geldig is.
    persisted:
      column: end_date
      storageClass: core
  - key: name
    osfType: string
    required: false
    label:
      en: Name
      nl: Naam
    description:
      en: Optional human-readable name of the debtor role.
      nl: Optionele menselijk leesbare naam van de debiteurrol.
    validation:
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the debtor role assignment.
      nl: Optionele omschrijving of zakelijke betekenis van de debiteurroltoewijzing.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the debtor in an external context.
      nl: Functionele of zakelijke code van de debiteur in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  - key: defaultLedgerAccountId
    label:
      en: Default ledger account
      nl: Standaard grootboekrekening
    persisted:
      column: default_ledger_account_id
      storageClass: core
    osfType: LedgerAccount
    relationship:
      ownership: reference
  - key: defaultPaymentMethodId
    label:
      en: Default payment method
      nl: Standaard betaalwijze
    persisted:
      column: default_payment_method_id
      storageClass: core
    osfType: PaymentMethod
    relationship:
      ownership: reference
  - key: defaultMandateId
    label:
      en: Default mandate
      nl: Standaard machtiging
    persisted:
      column: default_mandate_id
      storageClass: core
    osfType: DirectDebitMandate
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Debtor
    description: List Debtor records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Debtor
    description: Get Debtor records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Debtor
    description: Create Debtor records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Debtor records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /debtors
          nl: /debiteuren
        columns:
          - key: debtorNumber
            sortable: true
          - key: name
            sortable: true
          - key: status
            sortable: true
          - key: paymentTerms
            sortable: true
          - key: currentBalance
            sortable: true
        title:
          en: Debtors
          nl: Debiteuren
        defaultSort:
          key: debtorNumber
          direction: asc
      record:
        routes:
          read:
            en: /debtors/:id
            nl: /debiteuren/:id
          create:
            en: /debtors/create
            nl: /debiteuren/aanmaken
        title: "{{debtorNumber}}"
        subtitle: "{{name}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Debtor details
                    nl: Debiteurgegevens
                  fields:
                    - debtorNumber
                    - status
                    - paymentTerms
                    - name
                    - startDate
                    - endDate
                - title:
                    en: Banking and dispatch
                    nl: Bank en verzending
                  fields:
                    - defaultIban
                    - defaultDispatchChannel
                - title:
                    en: Credit position
                    nl: Kredietpositie
                  fields:
                    - creditLimit
                    - currentBalance
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create debtor
              nl: Debiteur aanmaken
            groups:
              - title:
                  en: Debtor details
                  nl: Debiteurgegevens
                fields:
                  - debtorNumber
                  - status
                  - paymentTerms
                  - name
                  - startDate
                  - endDate
              - title:
                  en: Banking and dispatch
                  nl: Bank en verzending
                fields:
                  - defaultIban
                  - defaultDispatchChannel
              - title:
                  en: Credit position
                  nl: Kredietpositie
                fields:
                  - creditLimit
                  - currentBalance
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit debtor
              nl: Debiteur bewerken
    fields:
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ROLEASSIGNMENTSTATUS
            clearable: true
      paymentTerms:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PAYMENTTERMS
            clearable: true
      defaultDispatchChannel:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: INVOICEDISPATCHCHANNEL
            clearable: true
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
