schemaVersion: 3
kind: coreEntity
module: core
entity: DirectDebitMandate
title: Direct Debit Mandate
description: SEPA direct debit mandate signed by a debtor relation, authorising recurring or one-off collections.
language: en
displayTemplate: "{{mandateReference}}"
filterField: mandateReference
labels:
  en: Direct debit mandate
  nl: Incassomachtiging
pluralLabels:
  en: Direct debit mandates
  nl: Incassomachtigingen
domains:
  - finance
fields:
  - key: mandateReference
    osfType: string
    required: true
    label:
      en: Mandate reference
      nl: Machtigingskenmerk
    description:
      en: Unique SEPA mandate reference (max 35 characters per SEPA spec).
      nl: Uniek SEPA-machtigingskenmerk (maximaal 35 tekens volgens SEPA-specificatie).
    validation:
      maxLength: 35
    persisted:
      column: mandate_reference
      storageClass: core
  - key: iban
    osfType: string
    required: true
    label:
      en: IBAN
      nl: IBAN
    description:
      en: IBAN of the debtor account authorised for collection under this mandate.
      nl: IBAN van de debiteurrekening die onder deze machtiging mag worden geïncasseerd.
    validation:
      maxLength: 34
    persisted:
      column: iban
      storageClass: core
  - key: signedDate
    osfType: date
    required: true
    label:
      en: Signed date
      nl: Ondertekendatum
    description:
      en: Date on which the mandate was signed by the debtor.
      nl: Datum waarop de machtiging door de debiteur is ondertekend.
    persisted:
      column: signed_date
      storageClass: core
  - key: firstUsedDate
    osfType: date
    required: false
    label:
      en: First used date
      nl: Eerste gebruiksdatum
    description:
      en: Date on which the mandate was first used to collect.
      nl: Datum waarop de machtiging voor het eerst is gebruikt voor incasso.
    persisted:
      column: first_used_date
      storageClass: core
  - key: lastUsedDate
    osfType: date
    required: false
    label:
      en: Last used date
      nl: Laatste gebruiksdatum
    description:
      en: Date on which the mandate was most recently used to collect.
      nl: Datum waarop de machtiging voor het laatst is gebruikt voor incasso.
    persisted:
      column: last_used_date
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the mandate.
      nl: Levenscyclusstatus van de machtiging.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: MANDATESTATUS
    osfType: referenceDataCode
  - key: sequenceType
    required: true
    label:
      en: Sequence type
      nl: Volgtype
    description:
      en: SEPA sequence type — first, recurrent, one-off, or final.
      nl: SEPA-volgtype — eerste, terugkerend, eenmalig of laatste.
    persisted:
      column: sequence_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: SEPASEQUENCETYPE
    osfType: referenceDataCode
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the mandate in an external context.
      nl: Functionele of zakelijke code van de machtiging in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Direct Debit Mandate
    description: List DirectDebitMandate records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Direct Debit Mandate
    description: Get DirectDebitMandate records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Direct Debit Mandate
    description: Create DirectDebitMandate records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update DirectDebitMandate records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /direct-debit-mandates
          nl: /incassomachtigingen
        columns:
          - key: mandateReference
            sortable: true
          - key: iban
            sortable: true
          - key: status
            sortable: true
          - key: sequenceType
            sortable: true
          - key: signedDate
            sortable: true
          - key: lastUsedDate
            sortable: true
        title:
          en: Direct debit mandates
          nl: Incassomachtigingen
        defaultSort:
          key: signedDate
          direction: desc
      record:
        routes:
          read:
            en: /direct-debit-mandates/:id
            nl: /incassomachtigingen/:id
          create:
            en: /direct-debit-mandates/create
            nl: /incassomachtigingen/aanmaken
        title: "{{mandateReference}}"
        subtitle: "{{iban}}"
        badges:
          - status
          - sequenceType
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Mandate details
                    nl: Machtigingsgegevens
                  fields:
                    - mandateReference
                    - iban
                    - status
                    - sequenceType
                - title:
                    en: Lifecycle
                    nl: Levensloop
                  fields:
                    - signedDate
                    - firstUsedDate
                    - lastUsedDate
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create direct debit mandate
              nl: Incassomachtiging aanmaken
            groups:
              - title:
                  en: Mandate details
                  nl: Machtigingsgegevens
                fields:
                  - mandateReference
                  - iban
                  - status
                  - sequenceType
              - title:
                  en: Lifecycle
                  nl: Levensloop
                fields:
                  - signedDate
                  - firstUsedDate
                  - lastUsedDate
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit direct debit mandate
              nl: Incassomachtiging bewerken
    fields:
      signedDate:
        render:
          component: DatePicker
          props: {}
      firstUsedDate:
        render:
          component: DatePicker
          props: {}
      lastUsedDate:
        render:
          component: DatePicker
          props: {}
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: MANDATESTATUS
            clearable: false
      sequenceType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: SEPASEQUENCETYPE
            clearable: false
