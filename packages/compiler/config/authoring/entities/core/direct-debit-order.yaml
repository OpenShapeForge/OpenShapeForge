schemaVersion: 3
kind: coreEntity
module: core
entity: DirectDebitOrder
title: Direct Debit Order
description: Pending or executed SEPA direct debit collection, optionally batched into a payment order.
language: en
displayTemplate: "{{endToEndId}}"
filterField: endToEndId
labels:
  en: Direct debit order
  nl: Incasso-opdracht
domains:
  - finance
fields:
  - key: iban
    osfType: string
    required: true
    label:
      en: IBAN
      nl: IBAN
    description:
      en: IBAN from which the amount will be (or has been) collected.
      nl: IBAN waarvan het bedrag wordt (of is) geïncasseerd.
    validation:
      maxLength: 34
    persisted:
      column: iban
      storageClass: core
  - key: amount
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Amount to collect under this direct debit order.
      nl: Te incasseren bedrag voor deze incasso-opdracht.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: executionDate
    osfType: date
    required: true
    label:
      en: Execution date
      nl: Uitvoerdatum
    description:
      en: Target date on which the direct debit should be executed by the bank.
      nl: Beoogde datum waarop de incasso door de bank moet worden uitgevoerd.
    persisted:
      column: execution_date
      storageClass: core
  - key: sequenceType
    required: true
    label:
      en: Sequence type
      nl: Volgtype
    description:
      en: SEPA sequence type — first, recurrent, one-off, or final.
      nl: SEPA-volgtype — eerste, terugkerend, eenmalig of laatste.
    persisted:
      column: sequence_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: SEPASEQUENCETYPE
    osfType: referenceDataCode
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the direct debit order.
      nl: Levenscyclusstatus van de incasso-opdracht.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: DIRECTDEBITORDERSTATUS
    osfType: referenceDataCode
  - key: endToEndId
    osfType: string
    required: false
    label:
      en: End-to-end ID
      nl: End-to-end-id
    description:
      en: SEPA end-to-end identifier carried through to the bank statement (max 35 characters).
      nl: SEPA end-to-end-identificatie die wordt doorgegeven tot op het bankafschrift (max 35 tekens).
    validation:
      maxLength: 35
    persisted:
      column: end_to_end_id
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the order in an external context.
      nl: Functionele of zakelijke code van de opdracht in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: mandateId
    label:
      en: Mandate
      nl: Machtiging
    persisted:
      column: mandate_id
      storageClass: core
    osfType: DirectDebitMandate
    relationship:
      ownership: reference
  - key: paymentOrderId
    label:
      en: Payment order
      nl: Betaalopdracht
    persisted:
      column: payment_order_id
      storageClass: core
    osfType: PaymentOrder
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Direct Debit Order
    description: List DirectDebitOrder records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Direct Debit Order
    description: Get DirectDebitOrder records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Direct Debit Order
    description: Create DirectDebitOrder records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update DirectDebitOrder records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /direct-debit-orders
          nl: /incasso-opdrachten
        columns:
          - key: endToEndId
            sortable: true
          - key: iban
            sortable: true
          - key: amount
            sortable: true
          - key: executionDate
            sortable: true
          - key: status
            sortable: true
          - key: sequenceType
            sortable: true
        title:
          en: Direct debit orders
          nl: Incasso-opdrachten
        defaultSort:
          key: executionDate
          direction: desc
      record:
        routes:
          read:
            en: /direct-debit-orders/:id
            nl: /incasso-opdrachten/:id
          create:
            en: /direct-debit-orders/create
            nl: /incasso-opdrachten/aanmaken
        title: "{{endToEndId}}"
        subtitle: "{{amount}}"
        badges:
          - status
          - sequenceType
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Order details
                    nl: Opdrachtgegevens
                  fields:
                    - endToEndId
                    - iban
                    - amount
                    - executionDate
                    - status
                    - sequenceType
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create direct debit order
              nl: Incasso-opdracht aanmaken
            groups:
              - title:
                  en: Order details
                  nl: Opdrachtgegevens
                fields:
                  - endToEndId
                  - iban
                  - amount
                  - executionDate
                  - status
                  - sequenceType
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit direct debit order
              nl: Incasso-opdracht bewerken
    fields:
      executionDate:
        render:
          component: DatePicker
          props: {}
      sequenceType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: SEPASEQUENCETYPE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: DIRECTDEBITORDERSTATUS
            clearable: false
