  - key: artifactVersion
    osfType: integer
    required: true
    immutable: true
    label: { en: artifactVersion, nl: artifactVersion }
    persisted: { column: artifact_version, storageClass: core }
  - key: fileName
    osfType: string
    required: true
    immutable: true
    label: { en: fileName, nl: fileName }
    persisted: { column: file_name, storageClass: core }
  - key: mimeType
