schemaVersion: 3
kind: coreEntity
module: core
entity: DocumentRendition
title: Document representation
language: en
labels: { en: Document representation, nl: Documentrepresentatie }
pluralLabels: { en: Document representations, nl: Documentrepresentaties }
description: An immutable derived file of one source document version. Content variants remain channel and locale variants.
displayTemplate: "{{target}}"
authorization:
