    required: true
    immutable: true
    label: { en: Source version, nl: Bronversie }
    persisted: { column: source_document_version_id, storageClass: core }
    relationship:
      inverse: { key: renditions, label: { en: Representations, nl: Representaties }, ownership: owned }
  - key: target
    osfType: string
    required: true
    immutable: true
    label: { en: target, nl: target }
    persisted: { column: target, storageClass: core }
  - key: artifactId
    osfType: string
    required: true
    immutable: true
    label: { en: artifactId, nl: artifactId }
