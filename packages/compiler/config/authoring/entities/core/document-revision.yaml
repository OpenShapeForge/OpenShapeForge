schemaVersion: 3
kind: coreEntity
module: core
entity: DocumentRevision
title: Document revision
description: An editable draft of a document's content, seeded from a published template version and
  published to an immutable document version. See docs/document-revisions.md.
language: en
labels: { en: Document revision, nl: Documentrevisie }
domains: [documents]
authorization:
  roles:
    # Same roles as Document: a revision is part of its document, not of the template.
    read: [CaseFile.All.Read, CaseFile.All.ReadWrite]
    create: [CaseFile.All.ReadWrite]
    update: [CaseFile.All.ReadWrite]
    delete: [CaseFile.All.ReadWrite]
displayTemplate: "{{channel}} · {{locale}} · {{status}}"
indexes:
  - { name: document_revisions_tenant_document_idx, fields: [tenantId, document] }
  - { name: document_revisions_tenant_template_version_idx, fields: [tenantId, templateVersion] }
fields:
  - key: document
    label: { en: Document, nl: Document }
    semanticType: Document
    required: true
    immutable: true
  - key: templateVersion
    label: { en: Template version, nl: Templateversie }
    description:
      en: The published template version this draft currently tracks; moves forward when the template is republished.
      nl: De gepubliceerde templateversie die dit concept volgt; schuift op als de template opnieuw wordt gepubliceerd.
    semanticType: TemplateVersion
    required: false
    readOnly: true
    writtenBy: [Document.startRevision, Template.publish]
    persisted: { column: template_version_id, storageClass: core }
    relationship: { ownership: reference }
  - key: channel
    label: { en: Channel, nl: Kanaal }
    valueType: string
    required: true
    immutable: true
    options:
      type: static
      items:
        - { value: document, label: { en: Document, nl: Document } }
        - { value: email, label: { en: Email, nl: E-mail } }
        - { value: whatsapp, label: { en: WhatsApp, nl: WhatsApp } }
    persisted: { column: channel, storageClass: core }
  - key: locale
    valueType: string
    required: true
    immutable: true
    defaultValue: nl
    validation: { pattern: "^[a-z]{2}(-[A-Z]{2})?$" }
    label: { en: Content language, nl: Inhoudstaal }
    persisted: { column: locale, storageClass: core }
  - key: status
    label: { en: Status, nl: Status }
    valueType: string
    required: true
    defaultValue: draft
    options:
      type: static
      items:
        - { value: draft, label: { en: Draft, nl: Concept } }
        - { value: submitted, label: { en: Submitted, nl: Ingediend } }
        - { value: approved, label: { en: Approved, nl: Goedgekeurd } }
        - { value: rejected, label: { en: Rejected, nl: Afgekeurd } }
        - { value: published, label: { en: Published, nl: Gepubliceerd } }
        - { value: superseded, label: { en: Superseded, nl: Vervangen } }
    persisted: { column: status, storageClass: core }
  - key: parameters
    valueType: object
    required: false
    defaultValue: {}
    label: { en: Local values, nl: Lokale waarden }
    description:
      en: Values for the template's local variables, used when the revision is published.
      nl: Waarden voor de lokale variabelen van de template, gebruikt bij publiceren van de revisie.
    persisted: { column: parameters, storageClass: core }
  - key: publishedVersionId
    label: { en: Published document version, nl: Gepubliceerde documentversie }
    semanticType: DocumentVersion
    required: false
    readOnly: true
    writtenBy: [DocumentRevision.publish]
    validation: { format: uuid }
    persisted: { column: published_version_id, storageClass: core }
    relationship: { ownership: reference }
  - key: followError
    label: { en: Follow problem, nl: Volgprobleem }
    description:
      en: Why the last template republish could not be applied to this draft; cleared when a later republish succeeds.
      nl: Waarom de laatste herpublicatie van de template niet op dit concept kon worden toegepast; gewist zodra een latere herpublicatie slaagt.
    valueType: string
    required: false
    readOnly: true
    writtenBy: [Template.publish]
    validation: { maxLength: 2000 }
    persisted: { column: follow_error, storageClass: core }
  - key: blocks
    label: { en: Blocks, nl: Blokken }
    semanticType: Block
    cardinality: collection
    sortable: true
    relationship: { inverse: revision, ownership: owned }
    # A document editor holds no Block role; the revision's collection
    # Operations carry the document editor's authority to its blocks.
    childAuthorization: owner
    # Keep identical to TemplateVariant.blocks. A plugin entityPatch targets one
    # entity, so a plugin adding a definition patches both files.
    allowedDefinitions: [TextBlock, YouTubeEmbed, TemplateBlock]
operations:
  insertBlock:
    name: { en: Add block, nl: Blok toevoegen }
    description: Insert an allowed block into this revision atomically.
    implementation: { type: collection, action: insert, field: blocks }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  moveBlock:
    name: { en: Move block, nl: Blok verplaatsen }
    description: Move a block within this revision atomically.
    implementation: { type: collection, action: move, field: blocks }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  updateBlock:
    name: { en: Edit block, nl: Blok bewerken }
    description: Change the values of one block of this revision, authorized through the revision.
    implementation: { type: collection, action: update, field: blocks }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  removeBlock:
    name: { en: Remove block, nl: Blok verwijderen }
    description: Remove one block from this revision, authorized through the revision.
    implementation: { type: collection, action: remove, field: blocks }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  publish:
    name: { en: Publish revision, nl: Revisie publiceren }
    description:
      en: Materialize this revision's blocks into an immutable JSON artifact on a new document version.
      nl: Leg de blokken van deze revisie vast als onveranderlijk JSON-bestand bij een nieuwe documentversie.
    implementation: { type: plugin, plugin: documents, handler: publishRevision }
    target: { scope: record, inputField: id }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [id, version, idempotencyKey]
        properties:
          id:
            type: string
            format: uuid
            x-osf-i18n: { title: { en: Document revision, nl: Documentrevisie } }
          version:
            x-osf-entityInput:
              entity: DocumentVersion
              fields: [versionLabel, status, isMajorVersion, changeSummary, accountId]
            x-osf-i18n: { title: { en: Version, nl: Versie } }
          idempotencyKey:
            type: string
            minLength: 1
            maxLength: 200
            x-osf-i18n: { title: { en: Request reference, nl: Aanvraagreferentie } }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [revisionId, documentId, documentVersionId, artifactId, artifactVersion, fileName, mediaType, checksum, byteSize, compositionHash]
        properties:
          revisionId: { type: string, format: uuid, x-osf-i18n: { title: { en: Revision, nl: Revisie } } }
          documentId: { type: string, format: uuid, x-osf-i18n: { title: { en: Document, nl: Document } } }
          documentVersionId: { type: string, format: uuid, x-osf-i18n: { title: { en: Document version, nl: Documentversie } } }
          artifactId: { type: string, format: uuid, x-osf-i18n: { title: { en: File, nl: Bestand } } }
          artifactVersion: { type: integer, minimum: 1, x-osf-i18n: { title: { en: File version, nl: Bestandsversie } } }
          fileName: { type: string, x-osf-i18n: { title: { en: File name, nl: Bestandsnaam } } }
          mediaType: { type: string, const: application/json, x-osf-i18n: { title: { en: Media type, nl: Bestandstype } } }
          checksum: { type: string, pattern: "^[a-f0-9]{64}$", x-osf-i18n: { title: { en: Checksum, nl: Controlesom } } }
          byteSize: { type: integer, minimum: 0, x-osf-i18n: { title: { en: File size, nl: Bestandsgrootte } } }
          compositionHash: { type: string, pattern: "^[a-f0-9]{64}$", x-osf-i18n: { title: { en: Content fingerprint, nl: Inhoudsvingerafdruk } } }
    errors:
      - { status: 400, code: VALIDATION, description: The revision or version input is invalid. }
      - { status: 403, code: FORBIDDEN, description: The revision or its document is not accessible. }
      - { status: 404, code: NOT_FOUND, description: The revision no longer exists. }
      - { status: 409, code: INVALID_STATE, description: The revision is already published or superseded. }
      - { status: 409, code: ALREADY_EXISTS, description: The document version label already exists. }
      - { status: 503, code: STORAGE_UNAVAILABLE, description: Artifact storage is unavailable. }
      - { status: 503, code: OPERATION_UNAVAILABLE, description: A required canonical Operation is unavailable. }
    auth: { mode: session, roles: [CaseFile.All.ReadWrite, Organization.All.ReadWrite] }
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: keyed, inputField: idempotencyKey } }
    confirmation: { mode: none }
  list:
    name: List document revisions
    description: Read accessible document revision records.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  get:
    name: Read document revision
    description: Read one accessible document revision record.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  create:
    name: Create document revision
    description: Create an empty document revision record; prefer Document.startRevision to seed it from a template.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: none }
  update:
    name: Update document revision
    description: Update a document revision draft (status, local values).
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  delete:
    name: Delete document revision
    description: Delete an unpublished document revision and its blocks.
    implementation: { type: entity, action: delete }
    effects: { data: delete, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
interfaces:
  rest:
    operations:
      publish: { method: POST, path: "/api/document-content/revisions/:id/publish", response: { status: 201, kind: json } }
  graphql: {}
  mcp: { tools: generic }
  web:
    views:
      collection:
        route: /document-revisions
        title: { en: Document revisions, nl: Documentrevisies }
        columns: [{ key: channel }, { key: locale }, { key: status, sortable: true }]
      record:
        routes: { read: "/document-revisions/:id", create: /document-revisions/new }
        title: "{{channel}} · {{locale}}"
        subtitle: "{{status}}"
        actions: [publish]
        layout:
          tabs:
            - id: revision
              label: { en: Revision, nl: Revisie }
              groups: [{ title: { en: Revision, nl: Revisie }, fields: [document, templateVersion, channel, locale, status, parameters, followError] }]
            - id: blocks
              label: { en: Blocks, nl: Blokken }
              relationship: blocks
        modes:
          create:
            title: { en: Create, nl: Toevoegen }
            groups: [{ title: { en: Revision, nl: Revisie }, fields: [document, channel, locale] }]
          update:
            title: { en: Edit, nl: Bewerken }
            groups: [{ title: { en: Revision, nl: Revisie }, fields: [status, parameters] }]
