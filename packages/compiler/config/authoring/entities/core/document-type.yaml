schemaVersion: 2
kind: coreEntity
module: core
entity: DocumentType
title: Document Type
description: A managed document type definition with registration defaults.
language: en
displayTemplate: "{{name}}"
filterField: name
labels:
  en: Document Type
  nl: Documenttype
domains:
  - cases
  - governance
indexes:
  - name: document_types_tenant_code_uidx
    fields: [tenantId, code]
    unique: true
  - name: document_types_tenant_identity_uidx
    fields: [tenantId, id]
    unique: true
authorization:
  roles:
    read:
      - CaseFile.All.Read
      - CaseFile.All.ReadWrite
      - DocumentTypes.All.Delete
    create:
      - CaseFile.All.ReadWrite
    update:
      - CaseFile.All.ReadWrite
    delete:
      - DocumentTypes.All.Delete
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    valueType: string
    required: true
    label:
      en: Code
      nl: Code
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: code
      storageClass: core
  - key: name
    valueType: string
    required: true
    label:
      en: Name
      nl: Naam
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    valueType: string
    semanticType: multilineText
    required: false
    label:
      en: Description
      nl: Beschrijving
    validation:
      maxLength: 4000
    persisted:
      column: description
      storageClass: core
  - key: defaultConfidentiality
    valueType: string
    semanticType: referenceDataCode
    required: false
    label:
      en: Default confidentiality
      nl: Standaardvertrouwelijkheid
    persisted:
      column: default_confidentiality
      storageClass: core
    options: { type: referentiedata, referentieGroep: DOCUMENTCONFIDENTIALITY }
  - key: requiresRegistration
    valueType: boolean
    required: true
    label:
      en: Requires registration
      nl: Vereist registratie
    defaultValue: true
    persisted:
      column: requires_registration
      storageClass: core
  - key: allowsExternalPublication
    valueType: boolean
    required: true
    label:
      en: Allows external publication
      nl: Externe publicatie toegestaan
    defaultValue: false
    persisted:
      column: allows_external_publication
      storageClass: core
operations:
  list:
    name: { en: List document types, nl: Documenttypen tonen }
    description: Returns the document type catalog visible to this identity.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  get:
    name: { en: Get document type, nl: Documenttype ophalen }
    description: Returns one document type and its available actions.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  create:
    name: { en: Create document type, nl: Documenttype aanmaken }
    description: Creates a managed document type with its authored defaults.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: none }
  update:
    name: { en: Update document type, nl: Documenttype wijzigen }
    description: Updates a managed document type.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: none }
  delete:
    name: { en: Delete document type, nl: Documenttype verwijderen }
    description: Deletes an unreferenced document type with the separate delete right.
    implementation: { type: entity, action: delete }
    effects: { data: delete, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
interfaces:
  rest: {}
  graphql: {}
  mcp: {}
  web:
    views:
      collection:
        route: /document-types
        title: { en: Document types, nl: Documenttypen }
        columns:
          - { key: name, sortable: true }
          - { key: code, sortable: true }
        defaultSort: { key: name, direction: asc }
      record:
        routes:
          read: /document-types/:id
          create: /document-types/new
        title: "{{name}}"
        subtitle: "{{code}}"
        layout:
          context:
            fields: [defaultConfidentiality, requiresRegistration, allowsExternalPublication]
            relationships: []
          tabs:
            - id: overview
              label: { en: Overview, nl: Overzicht }
              groups:
                - title: { en: Document type, nl: Documenttype }
                  fields: [code, name, description]
                - title: { en: Registration and access, nl: Registratie en toegang }
                  fields: [defaultConfidentiality, requiresRegistration, allowsExternalPublication]
        modes:
          create:
            title: { en: Create document type, nl: Documenttype aanmaken }
            groups:
              - title: { en: Document type, nl: Documenttype }
                fields: [code, name, description, defaultConfidentiality, requiresRegistration, allowsExternalPublication]
