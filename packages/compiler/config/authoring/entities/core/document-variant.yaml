schemaVersion: 3
kind: coreEntity
module: core
entity: DocumentVariant
title: Document variant
description: One channel and language of a document's editable content, seeded from the linked template
  version's variant of the same channel and language. See docs/document-content.md.
language: en
labels: { en: Document variant, nl: Documentvariant }
pluralLabels: { en: Document variants, nl: Documentvarianten }
domains: [documents]
authorization:
  roles:
    # Same roles as Document: a variant is part of its document, not of the template.
    read: [CaseFile.All.Read, CaseFile.All.ReadWrite, Organization.All.Read, Organization.All.ReadWrite]
    create: [CaseFile.All.ReadWrite, Organization.All.ReadWrite]
    # The block Operations below derive their roles from this update list.
    update: [CaseFile.All.ReadWrite, Organization.All.ReadWrite]
    delete: [CaseFile.All.ReadWrite, Organization.All.ReadWrite]
displayTemplate: "{{channel}} · {{locale}}"
indexes:
  - { name: document_variants_tenant_document_channel_locale_uidx, fields: [tenantId, document, channel, locale], unique: true }
fields:
  - key: document
    label: { en: Document, nl: Document }
    osfType: Document
    required: true
    immutable: true
    relationship:
      inverse:
        key: variants
        label: { en: Content, nl: Inhoud }
        ownership: owned
  - key: channel
    label: { en: Channel, nl: Kanaal }
    osfType: string
    required: true
    immutable: true
    options:
      type: static
      items:
        - { value: document, label: { en: Document, nl: Document } }
        - { value: email, label: { en: Email, nl: E-mail } }
        - { value: whatsapp, label: { en: WhatsApp, nl: WhatsApp } }
    persisted: { column: channel, storageClass: core }
  - key: locale
    osfType: string
    required: true
    immutable: true
    defaultValue: nl
    validation: { pattern: "^[a-z]{2}(-[A-Z]{2})?$" }
    label: { en: Content language, nl: Inhoudstaal }
    persisted: { column: locale, storageClass: core }
  # The owned, sortable, lock-aware `blocks` collection is derived from
  # Block.documentVariant (entities/core/block.yaml), where its
  # allowedDefinitions, childAuthorization and childLock are declared.
  - key: pageLayout
    label: { en: Layout, nl: Indeling }
    description:
      en: Continuous is one flowing text without zones, as a knowledge base article. Pages gives every page a header, content and footer zone. Empty follows the template.
      nl: Doorlopend is één doorlopende tekst zonder zones, zoals een kennisbankartikel. Pagina's geeft elke pagina een koptekst, inhoud en voettekst. Leeg volgt het template.
    osfType: string
    required: false
    options:
      type: static
      items:
        - { value: continuous, label: { en: Continuous, nl: Doorlopend } }
        - { value: pages, label: { en: Pages, nl: "Pagina's" } }
    persisted: { column: page_layout, storageClass: core }
  - key: pageFormat
    label: { en: Page format, nl: Paginaformaat }
    description:
      en: Empty takes the format of the document theme, or A4 without a theme.
      nl: Leeg neemt het formaat van het documentthema, of A4 zonder thema.
    osfType: string
    required: false
    options:
      type: static
      items:
        - { value: a4, label: { en: A4, nl: A4 } }
        - { value: a5, label: { en: A5, nl: A5 } }
        - { value: letter, label: { en: Letter, nl: Letter } }
        - { value: custom, label: { en: Custom size, nl: Eigen maat } }
    persisted: { column: page_format, storageClass: core }
  - key: pageWidth
    label: { en: Page width (px), nl: Paginabreedte (px) }
    osfType: number
    required: false
    validation: { min: 100, max: 5000 }
    persisted: { column: page_width, storageClass: core }
  - key: pageHeight
    label: { en: Page height (px), nl: Paginahoogte (px) }
    osfType: number
    required: false
    validation: { min: 100, max: 5000 }
    persisted: { column: page_height, storageClass: core }
  - key: pageMargin
    label: { en: Page margin (px), nl: Paginamarge (px) }
    osfType: number
    required: false
    validation: { min: 0, max: 400 }
    persisted: { column: page_margin, storageClass: core }
  - key: pageGap
    label: { en: "Space between header, content and footer (px)", nl: "Ruimte tussen kop, inhoud en voet (px)" }
    osfType: number
    required: false
    validation: { min: 0, max: 400 }
    persisted: { column: page_gap, storageClass: core }
  - key: pageBlockGap
    label: { en: Space between blocks (px), nl: Ruimte tussen blokken (px) }
    osfType: number
    required: false
    validation: { min: 0, max: 400 }
    persisted: { column: page_block_gap, storageClass: core }
  - key: pageBackground
    label: { en: Background color, nl: Achtergrondkleur }
    description:
      en: A color of the organization's palette or one of the standard colors. Empty leaves the page white.
      nl: Een kleur uit het palet van de organisatie of een van de standaardkleuren. Leeg laat de pagina wit.
    osfType: color
    required: false
    persisted: { column: page_background, storageClass: core }
  - key: pageBackgroundImage
    label: { en: Background image, nl: Achtergrondbeeld }
    description:
      en: Key of an image of the document theme, stretched over the whole page.
      nl: Sleutel van een beeld uit het documentthema, uitgerekt over de hele pagina.
    osfType: string
    required: false
    validation: { pattern: "^[a-z][A-Za-z0-9-]{0,63}$", maxLength: 64 }
    persisted: { column: page_background_image, storageClass: core }
  - key: pageBodyAlignment
    label: { en: Content position, nl: Plaats van de inhoud }
    description:
      en: Where the content stands between header and footer on a page it does not fill.
      nl: Waar de inhoud staat tussen kop en voet op een pagina die ze niet vult.
    osfType: string
    required: false
    options:
      type: static
      items:
        - { value: top, label: { en: Top, nl: Bovenaan } }
        - { value: aboveCenter, label: { en: Above the middle, nl: Boven het midden } }
        - { value: center, label: { en: Middle, nl: Midden } }
        - { value: bottom, label: { en: Bottom, nl: Onderaan } }
    persisted: { column: page_body_alignment, storageClass: core }
operations:
  insertBlock:
    name: { en: Add block, nl: Blok toevoegen }
    description: Insert an allowed block into this variant atomically, at the end or before another block.
    implementation: { type: collection, action: insert, field: blocks }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  moveBlock:
    name: { en: Move block, nl: Blok verplaatsen }
    description: Move an unlocked block within this variant atomically.
    implementation: { type: collection, action: move, field: blocks }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  updateBlock:
    name: { en: Edit block, nl: Blok bewerken }
    description: Change the values of one unlocked block of this variant, authorized through the variant.
    implementation: { type: collection, action: update, field: blocks }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  removeBlock:
    name: { en: Remove block, nl: Blok verwijderen }
    description: Remove one unlocked block from this variant, authorized through the variant.
    implementation: { type: collection, action: remove, field: blocks }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  list:
    name: List document variants
    description: >-
      Returns a page of the document variants this session may read. Filter on document to see which channels
      and languages one document has; a variant's text is in its blocks, not in this record.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  get:
    name: Read document variant
    description: Read one accessible document variant record.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  create:
    name: Create document variant
    description: Add a channel and language to a document's content, without a template.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: none }
  update:
    name: Update document variant
    description: Internal-only; the block Operations above are the only writes. Kept because the collection machinery requires the child to be mutable.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
interfaces:
  rest:
    operations:
      update: false
  graphql:
    operations:
      update: false
  mcp:
    tools: generic
    operations:
      update: false
  web:
    operations:
      update: false
    views:
      tabbed: { kind: collection, collectionLayout: tabs, itemView: record, tabLabel: locale }
      collection:
        route: /document-variants
        title: { en: Document variants, nl: Documentvarianten }
        columns: [{ key: channel }, { key: locale }]
      record:
        routes: { read: "/document-variants/:id", create: /document-variants/new }
        title: "{{channel}} · {{locale}}"
        layout:
          tabs:
            - id: variant
              label: { en: Variant, nl: Variant }
              groups: [{ title: { en: Variant, nl: Variant }, fields: [document, channel, locale] }, { title: { en: Layout, nl: Indeling }, fields: [pageLayout] }, { title: { en: Page settings, nl: Pagina-instellingen }, visibleWhen: { conditions: [{ field: pageLayout, operator: eq, value: pages }] }, fields: [pageFormat, pageMargin, pageGap, pageBlockGap, pageBackground, pageBackgroundImage, pageBodyAlignment] }, { title: { en: Custom page size, nl: Eigen paginaformaat }, visibleWhen: { conditions: [{ field: pageLayout, operator: eq, value: pages }, { field: pageFormat, operator: eq, value: custom }] }, fields: [pageWidth, pageHeight] }]
            - id: blocks
              label: { en: Blocks, nl: Blokken }
              relationship: { name: blocks, view: previewStack }
        modes:
          create:
            title: { en: Create, nl: Toevoegen }
            groups: [{ title: { en: Variant, nl: Variant }, fields: [document, channel, locale] }, { title: { en: Layout, nl: Indeling }, fields: [pageLayout] }, { title: { en: Page settings, nl: Pagina-instellingen }, visibleWhen: { conditions: [{ field: pageLayout, operator: eq, value: pages }] }, fields: [pageFormat, pageMargin, pageGap, pageBlockGap, pageBackground, pageBackgroundImage, pageBodyAlignment] }, { title: { en: Custom page size, nl: Eigen paginaformaat }, visibleWhen: { conditions: [{ field: pageLayout, operator: eq, value: pages }, { field: pageFormat, operator: eq, value: custom }] }, fields: [pageWidth, pageHeight] }]
          update:
            title: { en: Edit, nl: Bewerken }
            groups: [{ title: { en: Layout, nl: Indeling }, fields: [pageLayout] }, { title: { en: Page settings, nl: Pagina-instellingen }, visibleWhen: { conditions: [{ field: pageLayout, operator: eq, value: pages }] }, fields: [pageFormat, pageMargin, pageGap, pageBlockGap, pageBackground, pageBackgroundImage, pageBodyAlignment] }, { title: { en: Custom page size, nl: Eigen paginaformaat }, visibleWhen: { conditions: [{ field: pageLayout, operator: eq, value: pages }, { field: pageFormat, operator: eq, value: custom }] }, fields: [pageWidth, pageHeight] }]
