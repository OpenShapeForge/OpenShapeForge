schemaVersion: 2
kind: coreEntity
module: core
entity: DocumentVersion
title: Document Version
description: An immutable binary or logical revision that is owned by exactly one document.
language: en
displayTemplate: "{{versionLabel}}"
filterField: versionLabel
labels:
  en: Document Version
  nl: Documentversie
domains:
  - cases
  - records
indexes:
  - name: document_versions_tenant_document_label_uidx
    fields:
      - tenantId
      - documentId
      - versionLabel
    unique: true
  - name: document_versions_tenant_document_identity_uidx
    fields:
      - tenantId
      - documentId
      - id
    unique: true
authorization:
  roles:
    read:
      - CaseFile.All.Read
      - CaseFile.All.ReadWrite
    create:
      - CaseFile.All.ReadWrite
    update:
      - CaseFile.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: versionLabel
    valueType: string
    required: true
    label:
      en: Version label
      nl: Versielabel
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: version_label
      storageClass: core
  - key: status
    valueType: string
    semanticType: referenceDataCode
    required: true
    label:
      en: Status
      nl: Status
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: DOCUMENTVERSIONSTATUS
  - key: createdBy
    valueType: string
    required: false
    label:
      en: Created by
      nl: Aangemaakt door
    validation:
      maxLength: 200
    persisted:
      column: created_by
      storageClass: core
  - key: fileName
    valueType: string
    required: false
    readOnly: true
    label:
      en: File name
      nl: Bestandsnaam
    validation:
      maxLength: 255
    persisted:
      column: file_name
      storageClass: core
  - key: mimeType
    valueType: string
    required: false
    readOnly: true
    label:
      en: MIME type
      nl: MIME-type
    validation:
      maxLength: 150
    persisted:
      column: mime_type
      storageClass: core
  - key: storageLocation
    valueType: string
    semanticType: fileStorageLocation
    required: false
    label:
      en: File
      nl: Bestand
    validation:
      maxLength: 1000
    persisted:
      column: storage_location
      storageClass: core
  - key: checksum
    valueType: string
    required: false
    readOnly: true
    label:
      en: Checksum
      nl: Checksum
    validation:
      maxLength: 128
    persisted:
      column: checksum
      storageClass: core
  - key: isMajorVersion
    valueType: boolean
    required: true
    label:
      en: Major version
      nl: Hoofdversie
    defaultValue: false
    persisted:
      column: is_major_version
      storageClass: core
  - key: changeSummary
    valueType: string
    semanticType: multilineText
    required: false
    label:
      en: Change summary
      nl: Wijzigingssamenvatting
    validation:
      maxLength: 4000
    persisted:
      column: change_summary
      storageClass: core
  - key: documentId
    valueType: string
    required: true
    readOnly: true
    immutable: true
    label:
      en: Document ID
      nl: Document-ID
    description:
      en: Immutable identifier of the document that owns this version.
      nl: Onveranderlijke identifier van het document waartoe deze versie behoort.
    semanticType: documentId
    validation:
      format: uuid
    persisted:
      column: document_id
      storageClass: core
relationships:
  - key: document
    kind: belongsTo
    target: Document
    foreignKey: document_id
    label:
      en: Document
      nl: Document
  - key: account
    kind: belongsTo
    target: Account
    foreignKey: account_id
    label:
      en: Account
      nl: Account
operations:
  list:
    name: { en: List document versions, nl: Documentversies tonen }
    description:
      en: Returns a filtered and sorted page of document versions.
      nl: Geeft een gefilterde en gesorteerde pagina met documentversies terug.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  get:
    name: { en: Get document version, nl: Documentversie ophalen }
    description:
      en: Returns one immutable document version by its canonical id.
      nl: Geeft één onveranderlijke documentversie terug op basis van het canonieke id.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }

interfaces:
  rest: {}
  graphql: {}
  mcp: {}
  web:
    views:
      collection:
        route: /document-versions
        title: { en: Document versions, nl: Documentversies }
        columns:
          - { key: versionLabel, sortable: true }
          - { key: status, sortable: true }
          - { key: fileName, sortable: true }
          - { key: createdBy, sortable: true }
        defaultSort: { key: versionLabel, direction: asc }
      record:
        routes:
          read: /document-versions/:id
        title: "{{versionLabel}}"
        subtitle: "{{status}}"
        layout:
          tabs:
            - id: overview
              label: { en: Overview, nl: Overzicht }
              fields:
                - versionLabel
                - status
                - createdBy
                - fileName
                - mimeType
                - storageLocation
                - checksum
                - isMajorVersion
                - changeSummary
                - documentId
