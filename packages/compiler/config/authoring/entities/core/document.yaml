schemaVersion: 2
kind: coreEntity
module: core
entity: Document
title: Document
description: A governed document container linked to a case file, optionally a case, and optionally a relation; version and artifact facts live on DocumentVersion.
language: en
displayTemplate: "{{title}}"
filterField: title
labels:
  en: Document
  nl: Document
domains:
  - cases
  - records
indexes:
  - name: documents_tenant_identity_uidx
    fields:
      - tenantId
      - id
    unique: true
retention:
  mode: policyRef
  policy: records-archive-7y
  scope: record
  startsFrom:
    strategy: firstNonNull
    fields:
      - publishedAt
      - registeredAt
      - receivedAt
authorization:
  roles:
    read:
      - CaseFile.All.Read
      - CaseFile.All.ReadWrite
    create:
      - CaseFile.All.ReadWrite
    update:
      - CaseFile.All.ReadWrite
    delete:
      - CaseFile.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    valueType: string
    required: false
    label:
      en: Code
      nl: Code
    description:
      en: Optional business or archive reference code for this document.
      nl: Optionele bedrijfs- of archiefreferentiecode voor dit document.
    help:
      en: Use a stable code from your records policy or source system when one exists.
      nl: Gebruik een vaste code uit jullie registratie of bronsysteem wanneer die bestaat.
    validation:
      maxLength: 100
    persisted:
      column: code
      storageClass: core
  - key: title
    valueType: string
    required: true
    label:
      en: Title
      nl: Titel
    description:
      en: Short title shown in lists, search, and overviews.
      nl: Korte titel in lijsten, zoekresultaten en overzichten.
    help:
      en: Prefer a concise phrase; the long explanation belongs in Description.
      nl: Houd het beknopt; uitgebreide toelichting hoort bij Beschrijving.
    validation:
      minLength: 1
      maxLength: 300
    persisted:
      column: title
      storageClass: core
  - key: description
    valueType: string
    semanticType: multilineText
    required: false
    label:
      en: Description
      nl: Beschrijving
    description:
      en: Free-text summary of the document purpose or contents.
      nl: Vrije tekst met het doel of de inhoud van het document.
    help:
      en: Use for context that does not fit the title, for example scope or key facts.
      nl: Gebruik voor context die niet in de titel past, bijvoorbeeld reikwijdte of kernfeiten.
    validation:
      maxLength: 8000
    persisted:
      column: description
      storageClass: core
  - key: documentType
    valueType: string
    semanticType: referenceDataCode
    required: true
    label:
      en: Document type
      nl: Documenttype
    description:
      en: Classification from the registered document type catalog.
      nl: Classificatie volgens het geregistreerde documenttype.
    help:
      en: May drive defaults such as confidentiality and registration requirements.
      nl: Kan standaarden sturen, zoals vertrouwelijkheid en registratievereisten.
    persisted:
      column: document_type
      storageClass: core
    options: { type: entity, source: DocumentType, valueField: code }
  - key: status
    valueType: string
    semanticType: referenceDataCode
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of this document record.
      nl: Levenscyclusstatus van dit documentrecord.
    help:
      en: Examples include draft, registered, published, or superseded—depending on your catalog.
      nl: Bijvoorbeeld concept, geregistreerd, gepubliceerd of vervangen—afhankelijk van de catalogus.
    persisted:
      column: status
      storageClass: core
    options: { type: referentiedata, referentieGroep: DOCUMENTSTATUS }
  - key: confidentiality
    valueType: string
    semanticType: referenceDataCode
    required: false
    label:
      en: Confidentiality
      nl: Vertrouwelijkheid
    description:
      en: Sensitivity of the document content for access control and handling.
      nl: Gevoeligheid van de inhoud voor toegang en omgang.
    help:
      en: Often defaulted from the document type; override only when the instance differs.
      nl: Vaak afgeleid van het documenttype; alleen afwijken als dit exemplaar anders is.
    persisted:
      column: confidentiality
      storageClass: core
    options: { type: referentiedata, referentieGroep: DOCUMENTCONFIDENTIALITY }
  - key: source
    valueType: string
    required: false
    label:
      en: Source
      nl: Bron
    description:
      en: Where the document came from (e.g. channel, batch, or system name).
      nl: Herkomst van het document (bijv. kanaal, batch of systeemnaam).
    help:
      en: Helps audits and traceability; examples include “Portal upload”, “E-mail”, “Scan”.
      nl: Ondersteunt audits en herleidbaarheid; bijv. “Portaalupload”, “E-mail”, “Scan”.
    validation:
      maxLength: 200
    persisted:
      column: source
      storageClass: core
  - key: author
    valueType: string
    required: false
    label:
      en: Author
      nl: Auteur
    description:
      en: Person or organisation that authored the content, if known.
      nl: Persoon of organisatie die de inhoud heeft opgesteld, indien bekend.
    help:
      en: Not always the uploader; use the original creator when the document states one.
      nl: Niet per se de uploader; gebruik de oorspronkelijke auteur als die in het document staat.
    validation:
      maxLength: 200
    persisted:
      column: author
      storageClass: core
  - key: isExternal
    valueType: boolean
    required: true
    label:
      en: External
      nl: Extern
    description:
      en: Whether the document originated outside your organisation.
      nl: Of het document van buiten de eigen organisatie afkomstig is.
    help:
      en: External documents may follow different handling, retention, or publication rules.
      nl: Externe documenten kunnen andere omgangs-, bewaar- of publicatieregels hebben.
    defaultValue: false
    persisted:
      column: is_external
      storageClass: core
  - key: registeredAt
    valueType: datetime
    required: false
    label:
      en: Registered at
      nl: Geregistreerd op
    description:
      en: When the document was formally registered in the records system.
      nl: Wanneer het document formeel in de registratie is opgenomen.
    help:
      en: Often used as a retention start date together with received and published timestamps.
      nl: Wordt vaak gebruikt als start voor bewaartermijnen, naast ontvangst- en publicatiedatum.
    persisted:
      column: registered_at
      storageClass: core
  - key: receivedAt
    valueType: datetime
    required: false
    label:
      en: Received at
      nl: Ontvangen op
    description:
      en: When the document was first received by your organisation.
      nl: Wanneer het document voor het eerst door de organisatie is ontvangen.
    help:
      en: May differ from registration or publication, e.g. mail received before formal filing.
      nl: Kan afwijken van registratie of publicatie, bijv. e-mail eerder dan formele registratie.
    persisted:
      column: received_at
      storageClass: core
  - key: publishedAt
    valueType: datetime
    required: false
    label:
      en: Published at
      nl: Gepubliceerd op
    description:
      en: When the document was finalized or made available to intended recipients.
      nl: Wanneer het document definitief is gemaakt of beschikbaar is voor de bedoelde ontvangers.
    help:
      en: Used for retention and disclosure timelines; optional if not applicable.
      nl: Gebruikt voor bewaar- en openbaarmakingslijnen; optioneel als niet van toepassing.
    persisted:
      column: published_at
      storageClass: core
  - key: currentVersionId
    valueType: string
    required: false
    readOnly: true
    immutable: true
    label:
      en: Current version ID
      nl: Huidige versie-ID
    description:
      en: Server-managed pointer to the latest version created through the document version command.
      nl: Door de server beheerde verwijzing naar de nieuwste versie die via het documentversiecommando is gemaakt.
    validation:
      format: uuid
    persisted:
      column: current_version_id
      storageClass: core
relationships:
  - key: caseFile
    kind: belongsTo
    target: CaseFile
    foreignKey: case_file_id
    label:
      en: Case file
      nl: Dossier
  - key: case
    kind: belongsTo
    target: Case
    foreignKey: case_id
    label:
      en: Case
      nl: Zaak
  - key: relation
    kind: belongsTo
    target: Relation
    foreignKey: relation_id
    label:
      en: Relation
      nl: Relatie
  - key: currentVersion
    kind: belongsTo
    target: DocumentVersion
    foreignKey: current_version_id
    label:
      en: Current version
      nl: Huidige versie
  - key: versions
    kind: hasMany
    target: DocumentVersion
    foreignKey: document_id
    label:
      en: Versions
      nl: Versies
operations:
  list:
    name: { en: List documents, nl: Documenten tonen }
    description: Returns the visible document collection.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  get:
    name: { en: Get document, nl: Document ophalen }
    description: Returns one visible document and its available actions.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  create:
    name: { en: Create document, nl: Document aanmaken }
    description:
      en: Create a document with its first version. You can attach a file.
      nl: Maak een document met de eerste versie. U kunt een bestand bijvoegen.

    implementation: { type: plugin, plugin: documents, handler: createDocument, action: create }
    target: { scope: collection }
    input:
      schema:
        type: object
        required:
          - document
          - version
          - idempotencyKey
        additionalProperties: false
        properties:
          idempotencyKey:
            type: string
            minLength: 1
            maxLength: 200
            x-osf-i18n:
              title:
                en: Idempotency Key
                nl: Aanvraagreferentie
          artifact:
            type: object
            x-osf-control: artifact-upload
            description: Optional storage-issued handle; file facts are verified server-side.
            required:
              - artifactId
              - expectedArtifactVersion
            additionalProperties: false
            properties:
              artifactId:
                type: string
                format: uuid
                x-osf-i18n:
                  title:
                    en: Artifact
                    nl: Bestand
              expectedArtifactVersion:
                type: integer
                minimum: 1
                maximum: 9007199254740991
                x-osf-i18n:
                  title:
                    en: Expected Artifact Version
                    nl: Verwachte bestandsversie
            x-osf-i18n:
              title:
                en: Artifact
                nl: Bestand
              description:
                en: Optionally attach a file to this version.
                nl: Voeg desgewenst een bestand aan deze versie toe.
          document:
            x-osf-entityInput:
              entity: Document
              fields:
                - code
                - title
                - description
                - documentType
                - status
                - confidentiality
                - source
                - author
                - isExternal
                - registeredAt
                - receivedAt
                - publishedAt
                - caseFileId
                - caseId
                - relationId
            x-osf-i18n:
              title:
                en: Document
                nl: Document
          version:
            x-osf-entityInput:
              entity: DocumentVersion
              fields:
                - versionLabel
                - status
                - isMajorVersion
                - changeSummary
                - accountId
            x-osf-i18n:
              title:
                en: Version
                nl: Versie
    output:
      schema:
        type: object
        required:
          - id
          - currentVersionId
        properties:
          id:
            type: string
            format: uuid
            x-osf-i18n:
              title:
                en: Record
                nl: Record
          currentVersionId:
            type: string
            format: uuid
            x-osf-i18n:
              title:
                en: Current Version
                nl: Huidige versie
        additionalProperties: true
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: keyed, inputField: idempotencyKey } }
    confirmation: { mode: none }
    errors:
      - { status: 400, code: VALIDATION, description: The document or version input is invalid. }
      - { status: 403, code: FORBIDDEN, description: The document is not accessible. }
      - { status: 503, code: STORAGE_UNAVAILABLE, description: No artifact storage provider is available. }
      - { status: 409, code: ALREADY_EXISTS, description: The document version label already exists. }
      - { status: 404, code: REFERENCE_NOT_FOUND, description: A referenced record is unavailable. }
  update:
    name: { en: Update document, nl: Document wijzigen }
    description: Updates the document metadata without changing its version pointer.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: none }
  delete:
    name: { en: Delete document, nl: Document verwijderen }
    description: Deletes a document subject to its canonical references and retention policy.
    implementation: { type: entity, action: delete }
    effects: { data: delete, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
interfaces:
  rest: {}
  graphql: {}
  mcp: {}
  web:
    views:
      collection:
        route: /documents
        title: { en: Documents, nl: Documenten }
        columns:
          - { key: title, sortable: true }
          - { key: documentType, sortable: true }
          - { key: status, sortable: true }
        defaultSort: { key: title, direction: asc }
      record:
        routes:
          read: /documents/:id
          edit: /documents/:id/edit
          create: /documents/new
        title: "{{title}}"
        subtitle: "{{status}}"
        layout:
          context:
            fields: [documentType, confidentiality, author, registeredAt]
            relationships: [relation, caseFile, case, currentVersion]
          tabs:
            - id: overview
              label: { en: Overview, nl: Overzicht }
              groups:
                - title: { en: Document, nl: Document }
                  fields: [code, title, description, documentType, status]
                - title: { en: Origin and access, nl: Herkomst en toegang }
                  fields: [author, source, isExternal, confidentiality]
                - title: { en: Registration and publication, nl: Registratie en publicatie }
                  fields: [receivedAt, registeredAt, publishedAt]
            - id: versions
              label: { en: Versions, nl: Versies }
              relationship: versions
        modes:
          create:
            title: { en: Create document, nl: Document aanmaken }
            groups:
              - title: { en: Document, nl: Document }
                fields: [title, documentType, status]
