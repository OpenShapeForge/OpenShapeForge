schemaVersion: 1
kind: coreEntity
module: core
entity: EmployeeBudget
title: Employee Budget
description: Budget entry assigned to an employee, valid over a date range (e.g. training, expenses).
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Employee budget
  nl: Medewerkerbudget
domains:
  - hr
fields:
  - key: code
    valueType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Code identifying the budget within an employee.
      nl: Code voor het budget binnen een medewerker.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    valueType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Display name of the budget.
      nl: Weergavenaam van het budget.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description of the budget.
      nl: Optionele omschrijving van het budget.
    validation:
      maxLength: 1000
    persisted:
      column: description
      storageClass: core
    render:
      component: Textarea
      props:
        rows: 4
        maxLength: 1000
  - key: amount
    valueType: number
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Total amount allocated to the budget.
      nl: Totaalbedrag dat is toegewezen aan het budget.
    semanticType: currency
    persisted:
      column: amount
      storageClass: core
  - key: currencyCode
    valueType: string
    required: true
    label:
      en: Currency code
      nl: Valutacode
    description:
      en: ISO 4217 currency code for the budget amount.
      nl: ISO 4217-valutacode voor het budgetbedrag.
    validation:
      maxLength: 3
    persisted:
      column: currency_code
      storageClass: core
  - key: validFrom
    valueType: date
    required: true
    label:
      en: Valid from
      nl: Geldig vanaf
    description:
      en: Date from which the budget is valid.
      nl: Datum vanaf wanneer het budget geldig is.
    persisted:
      column: valid_from
      storageClass: core
    render:
      component: DatePicker
      props: {}
  - key: validTo
    valueType: date
    required: false
    label:
      en: Valid to
      nl: Geldig tot
    description:
      en: Date until which the budget is valid.
      nl: Datum tot wanneer het budget geldig is.
    persisted:
      column: valid_to
      storageClass: core
    render:
      component: DatePicker
      props: {}
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the budget in an external context.
      nl: Functionele of zakelijke code van het budget in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
relationships:
  - key: employee
    kind: belongsTo
    target: Employee
    foreignKey: employee_id
    label:
      en: Employee
      nl: Medewerker
ui:
  routes:
    list:
      en: /employee-budgets
      nl: /medewerkerbudgetten
    detail:
      en: /employee-budgets/:id
      nl: /medewerkerbudgetten/:id
    create:
      en: /employee-budgets/create
      nl: /medewerkerbudgetten/aanmaken
    edit:
      en: /employee-budgets/:id/edit
      nl: /medewerkerbudgetten/:id/bewerken
    delete:
      en: /employee-budgets/:id/delete
      nl: /medewerkerbudgetten/:id/verwijderen
  presentations:
    list:
      title:
        en: Employee budgets
        nl: Medewerkerbudgetten
      columns:
        - key: code
          sortable: true
        - key: name
          sortable: true
        - key: amount
          sortable: true
        - key: validFrom
          sortable: true
        - key: validTo
          sortable: true
      defaultSort:
        key: validFrom
        direction: desc
      rowLink:
        en: /employee-budgets/:id
        nl: /medewerkerbudgetten/:id
    detail:
      header:
        title: "{{code}} {{name}}"
        subtitle: "{{amount}}"
      actions:
        - key: edit
          label:
            en: Edit
            nl: Bewerken
          route: edit
        - key: delete
          label:
            en: Delete
            nl: Verwijderen
          confirm:
            en: Are you sure?
            nl: Weet je het zeker?
          mutation: delete
      groups:
        - id: overview
          label:
            en: Overview
            nl: Overzicht
          groups:
            - title:
                en: Budget details
                nl: Budgetgegevens
              fields:
                - code
                - name
                - amount
                - currencyCode
                - validFrom
                - validTo
            - title:
                en: Description
                nl: Omschrijving
              fields:
                - description
            - title:
                en: Source
                nl: Herkomst
              fields:
                - externalId
                - externalCode
                - sourceAuthority
                - sourceOrganization
                - sourceAdministration
    form:
      variants:
        create:
          title:
            en: Create employee budget
            nl: Medewerkerbudget aanmaken
          groups:
            - title:
                en: Budget details
                nl: Budgetgegevens
              fields:
                - code
                - name
                - amount
                - currencyCode
                - validFrom
                - validTo
            - title:
                en: Description
                nl: Omschrijving
              fields:
                - description
            - title:
                en: Source
                nl: Herkomst
              fields:
                - externalId
                - externalCode
                - sourceAuthority
                - sourceOrganization
                - sourceAdministration
        edit:
          extends: create
          title:
            en: Edit employee budget
            nl: Medewerkerbudget bewerken
workflow:
  nodes:
    actions:
      create: true
      getOne: true
      list: true
      update: true
      delete: true
authorization:
  roles:
    read:
      - Organisatie.All.Read
      - Organisatie.All.ReadWrite
    create:
      - Organisatie.All.ReadWrite
    update:
      - Organisatie.All.ReadWrite
    delete:
      - Organisatie.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
