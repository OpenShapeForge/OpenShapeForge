schemaVersion: 3
kind: coreEntity
module: core
entity: EmployeeBudget
title: Employee Budget
description: Budget entry assigned to an employee, valid over a date range (e.g. training, expenses).
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Employee budget
  nl: Medewerkerbudget
pluralLabels:
  en: Employee budgets
  nl: Medewerkerbudgetten
domains:
  - hr
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Code identifying the budget within an employee.
      nl: Code voor het budget binnen een medewerker.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Display name of the budget.
      nl: Weergavenaam van het budget.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description of the budget.
      nl: Optionele omschrijving van het budget.
    validation:
      maxLength: 1000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: amount
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Total amount allocated to the budget.
      nl: Totaalbedrag dat is toegewezen aan het budget.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: currencyCode
    osfType: string
    required: true
    label:
      en: Currency code
      nl: Valutacode
    description:
      en: ISO 4217 currency code for the budget amount.
      nl: ISO 4217-valutacode voor het budgetbedrag.
    validation:
      maxLength: 3
    persisted:
      column: currency_code
      storageClass: core
  - key: validFrom
    osfType: date
    required: true
    label:
      en: Valid from
      nl: Geldig vanaf
    description:
      en: Date from which the budget is valid.
      nl: Datum vanaf wanneer het budget geldig is.
    persisted:
      column: valid_from
      storageClass: core
  - key: validTo
    osfType: date
    required: false
    label:
      en: Valid to
      nl: Geldig tot
    description:
      en: Date until which the budget is valid.
      nl: Datum tot wanneer het budget geldig is.
    persisted:
      column: valid_to
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the budget in an external context.
      nl: Functionele of zakelijke code van het budget in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: employeeId
    label:
      en: Employee
      nl: Medewerker
    persisted:
      column: employee_id
      storageClass: core
    osfType: Employee
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Organization.All.Read
      - Organization.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Employee Budget
    description: List EmployeeBudget records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Employee Budget
    description: Get EmployeeBudget records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Employee Budget
    description: Create EmployeeBudget records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update EmployeeBudget records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /employee-budgets
          nl: /medewerkerbudgetten
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: amount
            sortable: true
          - key: validFrom
            sortable: true
          - key: validTo
            sortable: true
        title:
          en: Employee budgets
          nl: Medewerkerbudgetten
        defaultSort:
          key: validFrom
          direction: desc
      record:
        routes:
          read:
            en: /employee-budgets/:id
            nl: /medewerkerbudgetten/:id
          create:
            en: /employee-budgets/create
            nl: /medewerkerbudgetten/aanmaken
        title: "{{code}} {{name}}"
        subtitle: "{{amount}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Budget details
                    nl: Budgetgegevens
                  fields:
                    - code
                    - name
                    - amount
                    - currencyCode
                    - validFrom
                    - validTo
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create employee budget
              nl: Medewerkerbudget aanmaken
            groups:
              - title:
                  en: Budget details
                  nl: Budgetgegevens
                fields:
                  - code
                  - name
                  - amount
                  - currencyCode
                  - validFrom
                  - validTo
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit employee budget
              nl: Medewerkerbudget bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 1000
      validFrom:
        render:
          component: DatePicker
          props: {}
      validTo:
        render:
          component: DatePicker
          props: {}
