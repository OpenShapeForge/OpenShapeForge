schemaVersion: 3
kind: coreEntity
module: core
entity: EmployeeRole
title: Employee Role
description: Role assignment for an employee — captures kind, position, org unit, manager line, allocation, and validity
  period (canonical role pattern, FK to Employee).
language: en
displayTemplate: "{{roleKind}}"
filterField: roleKind
labels:
  en: Employee role
  nl: Medewerkerrol
domains:
  - hr
fields:
  - key: roleKind
    required: true
    label:
      en: Role kind
      nl: Rolsoort
    description:
      en: Kind of role assigned to the employee (lead, member, manager, delegate, temporary).
      nl: Soort rol toegekend aan de medewerker (lead, lid, manager, gedelegeerde, tijdelijk).
    persisted:
      column: role_kind
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: EMPLOYEEROLEKIND
    osfType: referenceDataCode
  - key: status
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the role assignment.
      nl: Levenscyclusstatus van de roltoewijzing.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ROLEASSIGNMENTSTATUS
    osfType: referenceDataCode
  - key: name
    osfType: string
    required: false
    label:
      en: Name
      nl: Naam
    description:
      en: Optional human-readable name of the role assignment.
      nl: Optionele menselijk leesbare naam van de roltoewijzing.
    validation:
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the role assignment.
      nl: Optionele omschrijving of zakelijke betekenis van de roltoewijzing.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which the role assignment is effective.
      nl: Datum vanaf wanneer de roltoewijzing geldig is.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which the role assignment is effective.
      nl: Datum tot wanneer de roltoewijzing geldig is.
    persisted:
      column: end_date
      storageClass: core
  - key: allocationPercentage
    osfType: number
    required: false
    label:
      en: Allocation percentage
      nl: Inzetpercentage
    description:
      en: Percentage of the employee's time allocated to this role (0-100).
      nl: Percentage van de tijd van de medewerker dat aan deze rol is toegewezen (0-100).
    validation:
      min: 0
      max: 100
    persisted:
      column: allocation_percentage
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the role assignment in an external context.
      nl: Functionele of zakelijke code van de roltoewijzing in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: employeeId
    label:
      en: Employee
      nl: Medewerker
    persisted:
      column: employee_id
      storageClass: core
    osfType: Employee
    relationship:
      ownership: reference
      inverse:
        key: roles
        label:
          en: Roles
          nl: Rollen
  - key: orgUnitId
    label:
      en: Org unit
      nl: Organisatorische eenheid
    persisted:
      column: org_unit_id
      storageClass: core
    osfType: OrgUnit
    relationship:
      ownership: reference
      inverse:
        label:
          en: Employee roles
          nl: Medewerkerrollen
  - key: positionId
    label:
      en: Position
      nl: Functie
    persisted:
      column: position_id
      storageClass: core
    osfType: Position
    relationship:
      ownership: reference
      inverse:
        label:
          en: Employee roles
          nl: Medewerkerrollen
  - key: reportsToId
    label:
      en: Reports to
      nl: Rapporteert aan
    persisted:
      column: reports_to_employee_role_id
      storageClass: core
    osfType: EmployeeRole
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Organization.All.Read
      - Organization.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Employee Role
    description: List EmployeeRole records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Employee Role
    description: Get EmployeeRole records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Employee Role
    description: Create EmployeeRole records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update EmployeeRole records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /employee-roles
          nl: /medewerkerrollen
        columns:
          - key: roleKind
            sortable: true
          - key: name
            sortable: true
          - key: status
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
        title:
          en: Employee roles
          nl: Medewerkerrollen
        defaultSort:
          key: startDate
          direction: desc
      record:
        routes:
          read:
            en: /employee-roles/:id
            nl: /medewerkerrollen/:id
          create:
            en: /employee-roles/create
            nl: /medewerkerrollen/aanmaken
        title: "{{name || roleKind}}"
        subtitle: "{{status}}"
        badges:
          - roleKind
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Role details
                    nl: Rolgegevens
                  fields:
                    - roleKind
                    - status
                    - name
                    - startDate
                    - endDate
                    - allocationPercentage
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create employee role
              nl: Medewerkerrol aanmaken
            groups:
              - title:
                  en: Role details
                  nl: Rolgegevens
                fields:
                  - roleKind
                  - status
                  - name
                  - startDate
                  - endDate
                  - allocationPercentage
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit employee role
              nl: Medewerkerrol bewerken
    fields:
      roleKind:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: EMPLOYEEROLEKIND
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ROLEASSIGNMENTSTATUS
            clearable: true
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
