schemaVersion: 3
kind: coreEntity
module: core
entity: Employee
title: Employee
description: Employment carrier on a Relation. Tracks employee number, employment status, hire and termination dates.
language: en
displayTemplate: "{{employeeNumber}}"
filterField: employeeNumber
labels:
  en: Employee
  nl: Medewerker
domains:
  - hr
fields:
  - key: employeeNumber
    valueType: string
    required: true
    label:
      en: Employee number
      nl: Personeelsnummer
    description:
      en: Tenant-unique employee number used in HR.
      nl: Tenant-uniek personeelsnummer in HR.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: employee_number
      storageClass: core
  - key: status
    valueType: string
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the employment.
      nl: Levenscyclusstatus van de dienstbetrekking.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: EMPLOYMENTSTATUS
    semanticType: referenceDataCode
  - key: hireDate
    valueType: date
    required: false
    label:
      en: Hire date
      nl: Datum in dienst
    description:
      en: Date on which the employee was hired.
      nl: Datum waarop de medewerker in dienst is getreden.
    persisted:
      column: hire_date
      storageClass: core
  - key: terminationDate
    valueType: date
    required: false
    label:
      en: Termination date
      nl: Datum uit dienst
    description:
      en: Date on which the employment ended.
      nl: Datum waarop de dienstbetrekking is beëindigd.
    persisted:
      column: termination_date
      storageClass: core
  - key: name
    valueType: string
    required: false
    label:
      en: Name
      nl: Naam
    description:
      en: Optional human-readable name of the employment record.
      nl: Optionele menselijk leesbare naam van het dienstverband.
    validation:
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the employment record.
      nl: Optionele omschrijving of zakelijke betekenis van het dienstverband.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    semanticType: multilineText
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the employee in an external context.
      nl: Functionele of zakelijke code van de medewerker in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    semanticType: Relation
    relationship:
      ownership: reference
  - key: roles
    label:
      en: Roles
      nl: Rollen
    semanticType: EmployeeRole
    cardinality: collection
    relationship:
      inverse: employeeId
      ownership: reference
  - key: organizationPermissions
    label:
      en: Organization permissions
      nl: Organisatierechten
    semanticType: UserOrganizationPermission
    cardinality: collection
    relationship:
      inverse: employeeId
      ownership: reference
authorization:
  roles:
    read:
      - Organization.All.Read
      - Organization.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Employee
    description: List Employee records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Employee
    description: Get Employee records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Employee
    description: Create Employee records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Employee records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /employees
          nl: /medewerkers
        columns:
          - key: employeeNumber
            sortable: true
          - key: name
            sortable: true
          - key: status
            sortable: true
          - key: hireDate
            sortable: true
          - key: terminationDate
            sortable: true
        title:
          en: Employees
          nl: Medewerkers
        defaultSort:
          key: employeeNumber
          direction: asc
      record:
        routes:
          read:
            en: /employees/:id
            nl: /medewerkers/:id
          create:
            en: /employees/create
            nl: /medewerkers/aanmaken
        title: "{{employeeNumber}}"
        subtitle: "{{name}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Employee details
                    nl: Medewerkergegevens
                  fields:
                    - employeeNumber
                    - status
                    - hireDate
                    - terminationDate
                    - name
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create employee
              nl: Medewerker aanmaken
            groups:
              - title:
                  en: Employee details
                  nl: Medewerkergegevens
                fields:
                  - employeeNumber
                  - status
                  - hireDate
                  - terminationDate
                  - name
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit employee
              nl: Medewerker bewerken
    fields:
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: EMPLOYMENTSTATUS
            clearable: false
      hireDate:
        render:
          component: DatePicker
          props: {}
      terminationDate:
        render:
          component: DatePicker
          props: {}
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
