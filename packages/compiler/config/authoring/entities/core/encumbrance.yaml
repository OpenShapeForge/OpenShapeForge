schemaVersion: 3
kind: coreEntity
module: core
entity: Encumbrance
title: Encumbrance
description: Generic encumbrance on an asset (mortgage, lien, easement, pledge), held by a relation.
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Encumbrance
  nl: Zekerheid
pluralLabels:
  en: Encumbrances
  nl: Zekerheden
domains:
  - asset
fields:
  - key: encumbranceKind
    required: true
    label:
      en: Encumbrance kind
      nl: Soort zekerheid
    description:
      en: Kind of encumbrance (mortgage, lien, easement, pledge, other).
      nl: Soort zekerheid (hypotheek, beslag, erfdienstbaarheid, pandrecht, anders).
    persisted:
      column: encumbrance_kind
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ENCUMBRANCEKIND
    osfType: referenceDataCode
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique encumbrance code.
      nl: Tenant-unieke code van de zekerheid.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form description of the encumbrance.
      nl: Vrije omschrijving van de zekerheid.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: amount
    required: false
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Optional principal amount associated with the encumbrance.
      nl: Optioneel hoofdbedrag dat aan de zekerheid is verbonden.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: currencyCode
    osfType: string
    required: true
    label:
      en: Currency
      nl: Valuta
    description:
      en: ISO 4217 currency code in which the encumbrance amount is expressed.
      nl: ISO 4217 valutacode waarin het bedrag van de zekerheid is uitgedrukt.
    defaultValue: EUR
    validation:
      minLength: 3
      maxLength: 3
    persisted:
      column: currency_code
      storageClass: core
  - key: validFrom
    osfType: date
    required: true
    label:
      en: Valid from
      nl: Geldig vanaf
    description:
      en: Date from which the encumbrance is effective.
      nl: Datum vanaf wanneer de zekerheid geldig is.
    persisted:
      column: valid_from
      storageClass: core
  - key: validTo
    osfType: date
    required: false
    label:
      en: Valid to
      nl: Geldig tot
    description:
      en: Date until which the encumbrance is effective.
      nl: Datum tot wanneer de zekerheid geldig is.
    persisted:
      column: valid_to
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the encumbrance in an external context.
      nl: Functionele of zakelijke code van de zekerheid in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: assetId
    label:
      en: Asset
      nl: Object
    persisted:
      column: asset_id
      storageClass: core
    osfType: Asset
    relationship:
      ownership: reference
  - key: holderId
    label:
      en: Holder
      nl: Houder
    persisted:
      column: holder_relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - RealEstate.All.Read
      - RealEstate.All.ReadWrite
    create:
      - RealEstate.All.ReadWrite
    update:
      - RealEstate.All.ReadWrite
    delete:
      - RealEstate.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Encumbrance
    description: List Encumbrance records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Encumbrance
    description: Get Encumbrance records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Encumbrance
    description: Create Encumbrance records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Encumbrance records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /encumbrances
          nl: /zekerheden
        columns:
          - key: code
            sortable: true
          - key: encumbranceKind
            sortable: true
          - key: amount
            sortable: true
          - key: validFrom
            sortable: true
          - key: validTo
            sortable: true
        title:
          en: Encumbrances
          nl: Zekerheden
        defaultSort:
          key: validFrom
          direction: desc
      record:
        routes:
          read:
            en: /encumbrances/:id
            nl: /zekerheden/:id
          create:
            en: /encumbrances/create
            nl: /zekerheden/aanmaken
        title: "{{code}}"
        subtitle: "{{encumbranceKind}}"
        badges:
          - encumbranceKind
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Encumbrance details
                    nl: Zekerheidgegevens
                  fields:
                    - code
                    - encumbranceKind
                    - amount
                    - currencyCode
                    - validFrom
                    - validTo
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create encumbrance
              nl: Zekerheid aanmaken
            groups:
              - title:
                  en: Encumbrance details
                  nl: Zekerheidgegevens
                fields:
                  - code
                  - encumbranceKind
                  - amount
                  - currencyCode
                  - validFrom
                  - validTo
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit encumbrance
              nl: Zekerheid bewerken
    fields:
      encumbranceKind:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ENCUMBRANCEKIND
            clearable: false
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
      validFrom:
        render:
          component: DatePicker
          props: {}
      validTo:
        render:
          component: DatePicker
          props: {}
