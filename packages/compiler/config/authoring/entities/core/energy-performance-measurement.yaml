schemaVersion: 3
kind: coreEntity
module: core
entity: EnergyPerformanceMeasurement
title: Energy Performance Measurement
description: Individual measurement underpinning an energy performance certificate.
language: en
displayTemplate: "{{measuredAt}}: {{value}}"
filterField: id
labels:
  en: Energy performance measurement
  nl: Energieprestatiemeting
domains:
  - energy
fields:
  - key: measuredAt
    osfType: datetime
    required: true
    label:
      en: Measured at
      nl: Gemeten op
    description:
      en: Timestamp when the measurement was taken.
      nl: Tijdstip waarop de meting is uitgevoerd.
    persisted:
      column: measured_at
      storageClass: core
  - key: value
    osfType: number
    required: true
    label:
      en: Value
      nl: Waarde
    description:
      en: Measured value.
      nl: Gemeten waarde.
    persisted:
      column: value
      storageClass: core
  - key: unitId
    osfType: string
    required: false
    label:
      en: Unit
      nl: Eenheid
    description:
      en: Free-form unit identifier (e.g. "kWh", "m3").
      nl: Vrije eenheidsaanduiding (bv. "kWh", "m3").
    validation:
      maxLength: 50
    persisted:
      column: unit_id
      storageClass: core
  - key: notes
    required: false
    label:
      en: Notes
      nl: Notities
    description:
      en: Free-form notes about the measurement.
      nl: Vrije notities over de meting.
    validation:
      maxLength: 1000
    persisted:
      column: notes
      storageClass: core
    osfType: multilineText
  - key: energyPerformanceId
    label:
      en: Energy performance
      nl: Energieprestatie
    persisted:
      column: energy_performance_id
      storageClass: core
    osfType: EnergyPerformance
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Energy.All.Read
      - Energy.All.ReadWrite
    create:
      - Energy.All.ReadWrite
    update:
      - Energy.All.ReadWrite
    delete:
      - Energy.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Energy Performance Measurement
    description: List EnergyPerformanceMeasurement records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Energy Performance Measurement
    description: Get EnergyPerformanceMeasurement records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Energy Performance Measurement
    description: Create EnergyPerformanceMeasurement records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update EnergyPerformanceMeasurement records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /energy-performance-measurements
          nl: /energieprestatiemetingen
        columns:
          - key: measuredAt
            sortable: true
          - key: value
            sortable: true
          - key: unitId
            sortable: true
        title:
          en: Energy performance measurements
          nl: Energieprestatiemetingen
        defaultSort:
          key: measuredAt
          direction: desc
      record:
        routes:
          read:
            en: /energy-performance-measurements/:id
            nl: /energieprestatiemetingen/:id
          create:
            en: /energy-performance-measurements/create
            nl: /energieprestatiemetingen/aanmaken
        title: "{{measuredAt}}"
        subtitle: "{{value}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Measurement details
                    nl: Metinggegevens
                  fields:
                    - measuredAt
                    - value
                    - unitId
                - title:
                    en: Notes
                    nl: Notities
                  fields:
                    - notes
        modes:
          create:
            title:
              en: Create energy performance measurement
              nl: Energieprestatiemeting aanmaken
            groups:
              - title:
                  en: Measurement details
                  nl: Metinggegevens
                fields:
                  - measuredAt
                  - value
                  - unitId
              - title:
                  en: Notes
                  nl: Notities
                fields:
                  - notes
          update:
            title:
              en: Edit energy performance measurement
              nl: Energieprestatiemeting bewerken
    fields:
      measuredAt:
        render:
          component: DateTimePicker
          props: {}
      notes:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 1000
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
