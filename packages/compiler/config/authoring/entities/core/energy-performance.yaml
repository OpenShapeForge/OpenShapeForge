schemaVersion: 3
kind: coreEntity
module: core
entity: EnergyPerformance
title: Energy Performance
description: Energy performance certificate or label issued for an asset, scoped to a validity period.
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Energy performance
  nl: Energieprestatie
pluralLabels:
  en: Energy performances
  nl: Energieprestaties
domains:
  - energy
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique energy performance code.
      nl: Tenant-unieke code van de energieprestatie.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: validFrom
    osfType: date
    required: true
    label:
      en: Valid from
      nl: Geldig vanaf
    description:
      en: Date from which the energy performance is valid.
      nl: Datum vanaf wanneer de energieprestatie geldig is.
    persisted:
      column: valid_from
      storageClass: core
  - key: validTo
    osfType: date
    required: false
    label:
      en: Valid to
      nl: Geldig tot
    description:
      en: Date until which the energy performance is valid.
      nl: Datum tot wanneer de energieprestatie geldig is.
    persisted:
      column: valid_to
      storageClass: core
  - key: energyClass
    osfType: string
    required: false
    label:
      en: Energy class
      nl: Energieklasse
    description:
      en: Energy class label (e.g. "A", "A+", "G").
      nl: Energieklasselabel (bv. "A", "A+", "G").
    validation:
      maxLength: 10
    persisted:
      column: energy_class
      storageClass: core
  - key: energyIndex
    osfType: number
    required: false
    label:
      en: Energy index
      nl: Energie-index
    description:
      en: Numeric energy index value.
      nl: Numerieke energie-indexwaarde.
    persisted:
      column: energy_index
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the energy performance in an external context.
      nl: Functionele of zakelijke code van de energieprestatie in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: assetId
    label:
      en: Asset
      nl: Object
    persisted:
      column: asset_reference
      storageClass: core
    osfType: Asset
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Energy.All.Read
      - Energy.All.ReadWrite
    create:
      - Energy.All.ReadWrite
    update:
      - Energy.All.ReadWrite
    delete:
      - Energy.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Energy Performance
    description: List EnergyPerformance records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Energy Performance
    description: Get EnergyPerformance records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Energy Performance
    description: Create EnergyPerformance records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update EnergyPerformance records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /energy-performances
          nl: /energieprestaties
        columns:
          - key: code
            sortable: true
          - key: energyClass
            sortable: true
          - key: energyIndex
            sortable: true
          - key: validFrom
            sortable: true
          - key: validTo
            sortable: true
        title:
          en: Energy performances
          nl: Energieprestaties
        defaultSort:
          key: validFrom
          direction: desc
      record:
        routes:
          read:
            en: /energy-performances/:id
            nl: /energieprestaties/:id
          create:
            en: /energy-performances/create
            nl: /energieprestaties/aanmaken
        title: "{{code}}"
        subtitle: "{{energyClass}}"
        badges:
          - energyClass
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Performance details
                    nl: Prestatiegegevens
                  fields:
                    - code
                    - energyClass
                    - energyIndex
                    - validFrom
                    - validTo
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create energy performance
              nl: Energieprestatie aanmaken
            groups:
              - title:
                  en: Performance details
                  nl: Prestatiegegevens
                fields:
                  - code
                  - energyClass
                  - energyIndex
                  - validFrom
                  - validTo
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit energy performance
              nl: Energieprestatie bewerken
    fields:
      validFrom:
        render:
          component: DatePicker
          props: {}
      validTo:
        render:
          component: DatePicker
          props: {}
