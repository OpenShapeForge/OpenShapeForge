schemaVersion: 3
kind: coreEntity
module: core
entity: FiscalPeriod
title: Fiscal Period
description: Period within a fiscal year. Sequence is unique within fiscal year.
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Fiscal period
  nl: Boekjaarperiode
pluralLabels:
  en: Fiscal periods
  nl: Boekjaarperioden
domains:
  - finance
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Human-readable period code, typically "{fiscalYearCode}-{sequence}" (e.g. "2026-01").
      nl: Menselijk leesbare periodecode, doorgaans "{boekjaarcode}-{volgnummer}" (bijv. "2026-01").
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: sequence
    osfType: integer
    required: true
    label:
      en: Sequence
      nl: Volgnummer
    description:
      en: Ordinal position of this period within its fiscal year (typically 1-12 for monthly cadence).
      nl: Volgorde van deze periode binnen het boekjaar (typisch 1-12 voor een maandelijkse cadans).
    validation:
      min: 1
      max: 366
    persisted:
      column: sequence
      storageClass: core
  - key: startDate
    osfType: date
    required: true
    label:
      en: Start date
      nl: Begindatum
    description:
      en: First date covered by this period.
      nl: Eerste datum die deze periode omvat.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: true
    label:
      en: End date
      nl: Einddatum
    description:
      en: Last date covered by this period.
      nl: Laatste datum die deze periode omvat.
    persisted:
      column: end_date
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the period (open, closing, closed).
      nl: Levenscyclusstatus van de periode (open, afsluitend, afgesloten).
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: FISCALPERIODSTATUS
    osfType: referenceDataCode
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the period in an external context.
      nl: Functionele of zakelijke code van de periode in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: fiscalYearId
    label:
      en: Fiscal year
      nl: Boekjaar
    persisted:
      column: fiscal_year_id
      storageClass: core
    osfType: FiscalYear
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Fiscal Period
    description: List FiscalPeriod records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Fiscal Period
    description: Get FiscalPeriod records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Fiscal Period
    description: Create FiscalPeriod records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update FiscalPeriod records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /fiscal-periods
          nl: /boekjaarperioden
        columns:
          - key: code
            sortable: true
          - key: sequence
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
          - key: status
            sortable: true
        title:
          en: Fiscal periods
          nl: Boekjaarperioden
        defaultSort:
          key: code
          direction: desc
      record:
        routes:
          read:
            en: /fiscal-periods/:id
            nl: /boekjaarperioden/:id
          create:
            en: /fiscal-periods/create
            nl: /boekjaarperioden/aanmaken
        title: "{{code}}"
        subtitle: "{{status}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Period details
                    nl: Periodegegevens
                  fields:
                    - code
                    - sequence
                    - startDate
                    - endDate
                    - status
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create fiscal period
              nl: Boekjaarperiode aanmaken
            groups:
              - title:
                  en: Period details
                  nl: Periodegegevens
                fields:
                  - code
                  - sequence
                  - startDate
                  - endDate
                  - status
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit fiscal period
              nl: Boekjaarperiode bewerken
    fields:
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: FISCALPERIODSTATUS
            clearable: false
