schemaVersion: 3
kind: coreEntity
module: core
entity: FiscalYear
title: Fiscal Year
description: Fiscal year container, scoping fiscal periods and reporting windows.
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Fiscal year
  nl: Boekjaar
domains:
  - finance
fields:
  - key: code
    valueType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique fiscal-year code (typically the calendar year, e.g. "2026").
      nl: Tenant-unieke boekjaarcode (meestal het kalenderjaar, bijv. "2026").
    validation:
      minLength: 1
      maxLength: 20
    persisted:
      column: code
      storageClass: core
  - key: startDate
    valueType: date
    required: true
    label:
      en: Start date
      nl: Begindatum
    description:
      en: First date covered by this fiscal year.
      nl: Eerste datum die dit boekjaar omvat.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    valueType: date
    required: true
    label:
      en: End date
      nl: Einddatum
    description:
      en: Last date covered by this fiscal year.
      nl: Laatste datum die dit boekjaar omvat.
    persisted:
      column: end_date
      storageClass: core
  - key: status
    valueType: string
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the fiscal year (open, closing, closed).
      nl: Levenscyclusstatus van het boekjaar (open, afsluitend, afgesloten).
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: FISCALPERIODSTATUS
    semanticType: referenceDataCode
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the fiscal year in an external context.
      nl: Functionele of zakelijke code van het boekjaar in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Fiscal Year
    description: List FiscalYear records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Fiscal Year
    description: Get FiscalYear records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Fiscal Year
    description: Create FiscalYear records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update FiscalYear records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /fiscal-years
          nl: /boekjaren
        columns:
          - key: code
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
          - key: status
            sortable: true
        title:
          en: Fiscal years
          nl: Boekjaren
        defaultSort:
          key: code
          direction: desc
      record:
        routes:
          read:
            en: /fiscal-years/:id
            nl: /boekjaren/:id
          create:
            en: /fiscal-years/create
            nl: /boekjaren/aanmaken
        title: "{{code}}"
        subtitle: "{{status}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Fiscal year details
                    nl: Boekjaargegevens
                  fields:
                    - code
                    - startDate
                    - endDate
                    - status
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create fiscal year
              nl: Boekjaar aanmaken
            groups:
              - title:
                  en: Fiscal year details
                  nl: Boekjaargegevens
                fields:
                  - code
                  - startDate
                  - endDate
                  - status
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit fiscal year
              nl: Boekjaar bewerken
    fields:
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: FISCALPERIODSTATUS
            clearable: false
