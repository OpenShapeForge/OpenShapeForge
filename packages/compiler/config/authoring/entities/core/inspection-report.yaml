schemaVersion: 3
kind: coreEntity
module: core
entity: InspectionReport
title: Inspection Report
description: Report capturing the outcome of an inspection performed on an asset.
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Inspection report
  nl: Inspectierapport
domains:
  - maintenance
fields:
  - key: code
    valueType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique inspection report code.
      nl: Tenant-unieke code van het inspectierapport.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: inspectedAt
    valueType: datetime
    required: true
    label:
      en: Inspected at
      nl: Geïnspecteerd op
    description:
      en: Timestamp when the inspection was performed.
      nl: Tijdstip waarop de inspectie is uitgevoerd.
    persisted:
      column: inspected_at
      storageClass: core
  - key: summary
    valueType: string
    required: false
    label:
      en: Summary
      nl: Samenvatting
    description:
      en: Summary of inspection findings.
      nl: Samenvatting van de inspectiebevindingen.
    validation:
      maxLength: 5000
    persisted:
      column: summary
      storageClass: core
    semanticType: multilineText
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the inspection report in an external context.
      nl: Functionele of zakelijke code van het inspectierapport in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: inspectorId
    label:
      en: Inspector
      nl: Inspecteur
    persisted:
      column: inspector_relation_id
      storageClass: core
    semanticType: Relation
    relationship:
      ownership: reference
  - key: assetId
    label:
      en: Asset
      nl: Object
    persisted:
      column: asset_reference
      storageClass: core
    semanticType: Asset
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Maintenance.All.Read
      - Maintenance.All.ReadWrite
    create:
      - Maintenance.All.ReadWrite
    update:
      - Maintenance.All.ReadWrite
    delete:
      - Maintenance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Inspection Report
    description: List InspectionReport records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Inspection Report
    description: Get InspectionReport records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Inspection Report
    description: Create InspectionReport records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update InspectionReport records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /inspection-reports
          nl: /inspectierapporten
        columns:
          - key: code
            sortable: true
          - key: inspectedAt
            sortable: true
        title:
          en: Inspection reports
          nl: Inspectierapporten
        defaultSort:
          key: inspectedAt
          direction: desc
      record:
        routes:
          read:
            en: /inspection-reports/:id
            nl: /inspectierapporten/:id
          create:
            en: /inspection-reports/create
            nl: /inspectierapporten/aanmaken
        title: "{{code}}"
        subtitle: "{{inspectedAt}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Report details
                    nl: Rapportgegevens
                  fields:
                    - code
                    - inspectedAt
                - title:
                    en: Summary
                    nl: Samenvatting
                  fields:
                    - summary
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create inspection report
              nl: Inspectierapport aanmaken
            groups:
              - title:
                  en: Report details
                  nl: Rapportgegevens
                fields:
                  - code
                  - inspectedAt
              - title:
                  en: Summary
                  nl: Samenvatting
                fields:
                  - summary
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit inspection report
              nl: Inspectierapport bewerken
    fields:
      inspectedAt:
        render:
          component: DateTimePicker
          props: {}
      summary:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
