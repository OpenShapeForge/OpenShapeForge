schemaVersion: 3
kind: coreEntity
module: core
entity: InvoiceCollectionItem
title: Invoice Collection Item
description: Per-payer split of an invoice into mandate-keyed amounts. Allocates a portion of the invoice total to a
  specific agreement party (the payer), under a specific direct debit mandate and IBAN.
language: en
displayTemplate: "{{amount}}"
filterField: id
labels:
  en: Invoice collection item
  nl: Factuurincasso-regel
pluralLabels:
  en: Invoice collection items
  nl: Factuurincasso-regels
domains:
  - finance
fields:
  - key: iban
    osfType: string
    required: true
    label:
      en: IBAN
      nl: IBAN
    description:
      en: IBAN to use for collecting this share of the invoice.
      nl: IBAN waarvan dit aandeel van de factuur wordt geïncasseerd.
    validation:
      maxLength: 34
    persisted:
      column: iban
      storageClass: core
  - key: amount
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Amount allocated to this payer under this collection item.
      nl: Bedrag dat onder deze incasso-regel aan deze betaler is toegewezen.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: paymentDay
    osfType: integer
    required: false
    label:
      en: Payment day
      nl: Betaaldag
    description:
      en: Preferred day-of-month (1-31) on which collection should occur.
      nl: Voorkeursdag van de maand (1-31) waarop de incasso moet plaatsvinden.
    validation:
      min: 1
      max: 31
    persisted:
      column: payment_day
      storageClass: core
  - key: invoiceId
    label:
      en: Invoice
      nl: Factuur
    persisted:
      column: invoice_id
      storageClass: core
    osfType: Invoice
    relationship:
      ownership: reference
  - key: agreementPartyId
    label:
      en: Agreement party
      nl: Overeenkomstpartij
    persisted:
      column: agreement_party_id
      storageClass: core
    osfType: AgreementParty
    relationship:
      ownership: reference
  - key: mandateId
    label:
      en: Mandate
      nl: Machtiging
    persisted:
      column: mandate_id
      storageClass: core
    osfType: DirectDebitMandate
    relationship:
      ownership: reference
  - key: paymentMethodId
    label:
      en: Payment method
      nl: Betaalwijze
    persisted:
      column: payment_method_id
      storageClass: core
    osfType: PaymentMethod
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Invoice Collection Item
    description: List InvoiceCollectionItem records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Invoice Collection Item
    description: Get InvoiceCollectionItem records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Invoice Collection Item
    description: Create InvoiceCollectionItem records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update InvoiceCollectionItem records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /invoice-collection-items
          nl: /factuurincasso-regels
        columns:
          - key: iban
            sortable: true
          - key: amount
            sortable: true
          - key: paymentDay
            sortable: true
        title:
          en: Invoice collection items
          nl: Factuurincasso-regels
        defaultSort:
          key: amount
          direction: desc
      record:
        routes:
          read:
            en: /invoice-collection-items/:id
            nl: /factuurincasso-regels/:id
          create:
            en: /invoice-collection-items/create
            nl: /factuurincasso-regels/aanmaken
        title: "{{amount}}"
        subtitle: "{{iban}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Collection details
                    nl: Incassogegevens
                  fields:
                    - iban
                    - amount
                    - paymentDay
        modes:
          create:
            title:
              en: Create invoice collection item
              nl: Factuurincasso-regel aanmaken
            groups:
              - title:
                  en: Collection details
                  nl: Incassogegevens
                fields:
                  - iban
                  - amount
                  - paymentDay
          update:
            title:
              en: Edit invoice collection item
              nl: Factuurincasso-regel bewerken
