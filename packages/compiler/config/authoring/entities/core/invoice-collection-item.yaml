schemaVersion: 1
kind: coreEntity
module: core
entity: InvoiceCollectionItem
title: Invoice Collection Item
description: Per-payer split of an invoice into mandate-keyed amounts. Allocates a portion of the invoice total to a specific agreement party (the payer), under a specific direct debit mandate and IBAN.
language: en
displayTemplate: "{{amount}}"
filterField: id
labels:
  en: Invoice collection item
  nl: Factuurincasso-regel
domains:
  - finance
fields:
  - key: iban
    valueType: string
    required: true
    label:
      en: IBAN
      nl: IBAN
    description:
      en: IBAN to use for collecting this share of the invoice.
      nl: IBAN waarvan dit aandeel van de factuur wordt geïncasseerd.
    validation:
      maxLength: 34
    persisted:
      column: iban
      storageClass: core
  - key: amount
    valueType: number
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Amount allocated to this payer under this collection item.
      nl: Bedrag dat onder deze incasso-regel aan deze betaler is toegewezen.
    semanticType: currency
    persisted:
      column: amount
      storageClass: core
  - key: paymentDay
    valueType: integer
    required: false
    label:
      en: Payment day
      nl: Betaaldag
    description:
      en: Preferred day-of-month (1-31) on which collection should occur.
      nl: Voorkeursdag van de maand (1-31) waarop de incasso moet plaatsvinden.
    validation:
      min: 1
      max: 31
    persisted:
      column: payment_day
      storageClass: core
relationships:
  - key: invoice
    kind: belongsTo
    target: Invoice
    foreignKey: invoice_id
    label:
      en: Invoice
      nl: Factuur
  - key: agreementParty
    kind: belongsTo
    target: AgreementParty
    foreignKey: agreement_party_id
    label:
      en: Agreement party
      nl: Overeenkomstpartij
  - key: mandate
    kind: belongsTo
    target: DirectDebitMandate
    foreignKey: mandate_id
    label:
      en: Mandate
      nl: Machtiging
  - key: paymentMethod
    kind: belongsTo
    target: PaymentMethod
    foreignKey: payment_method_id
    label:
      en: Payment method
      nl: Betaalwijze
ui:
  routes:
    list:
      en: /invoice-collection-items
      nl: /factuurincasso-regels
    detail:
      en: /invoice-collection-items/:id
      nl: /factuurincasso-regels/:id
    create:
      en: /invoice-collection-items/create
      nl: /factuurincasso-regels/aanmaken
    edit:
      en: /invoice-collection-items/:id/edit
      nl: /factuurincasso-regels/:id/bewerken
    delete:
      en: /invoice-collection-items/:id/delete
      nl: /factuurincasso-regels/:id/verwijderen
  presentations:
    list:
      title:
        en: Invoice collection items
        nl: Factuurincasso-regels
      columns:
        - key: iban
          sortable: true
        - key: amount
          sortable: true
        - key: paymentDay
          sortable: true
      defaultSort:
        key: amount
        direction: desc
      rowLink:
        en: /invoice-collection-items/:id
        nl: /factuurincasso-regels/:id
    detail:
      header:
        title: "{{amount}}"
        subtitle: "{{iban}}"
      actions:
        - key: edit
          label:
            en: Edit
            nl: Bewerken
          route: edit
        - key: delete
          label:
            en: Delete
            nl: Verwijderen
          confirm:
            en: Are you sure?
            nl: Weet je het zeker?
          mutation: delete
      groups:
        - id: overview
          label:
            en: Overview
            nl: Overzicht
          groups:
            - title:
                en: Collection details
                nl: Incassogegevens
              fields:
                - iban
                - amount
                - paymentDay
    form:
      variants:
        create:
          title:
            en: Create invoice collection item
            nl: Factuurincasso-regel aanmaken
          groups:
            - title:
                en: Collection details
                nl: Incassogegevens
              fields:
                - iban
                - amount
                - paymentDay
        edit:
          extends: create
          title:
            en: Edit invoice collection item
            nl: Factuurincasso-regel bewerken
workflow:
  nodes:
    actions:
      create: true
      getOne: true
      list: true
      update: true
      delete: true
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
