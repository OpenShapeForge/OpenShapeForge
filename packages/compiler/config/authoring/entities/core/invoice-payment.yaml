schemaVersion: 3
kind: coreEntity
module: core
entity: InvoicePayment
title: Invoice Payment
description: Payment applied to an invoice. Distinct from a bank statement line — multiple payments can be applied to
  the same invoice over time.
language: en
displayTemplate: "{{amount}} @ {{paidAt}}"
filterField: id
labels:
  en: Invoice payment
  nl: Factuurbetaling
pluralLabels:
  en: Invoice payments
  nl: Factuurbetalingen
domains:
  - finance
fields:
  - key: paidAt
    osfType: datetime
    required: true
    label:
      en: Paid at
      nl: Betaald op
    description:
      en: Timestamp at which the payment was applied to the invoice.
      nl: Tijdstip waarop de betaling op de factuur is verwerkt.
    persisted:
      column: paid_at
      storageClass: core
  - key: amount
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Amount of the payment applied to the invoice.
      nl: Bedrag van de betaling dat op de factuur is verwerkt.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: invoiceId
    label:
      en: Invoice
      nl: Factuur
    persisted:
      column: invoice_id
      storageClass: core
    osfType: Invoice
    relationship:
      ownership: reference
  - key: paymentMethodId
    label:
      en: Payment method
      nl: Betaalwijze
    persisted:
      column: payment_method_id
      storageClass: core
    osfType: PaymentMethod
    relationship:
      ownership: reference
  # System-written by bank reconciliation (BankReconciliation is the authored match), not an input.
  - key: bankStatementLineId
    readOnly: true
    label:
      en: Bank statement line
      nl: Bankafschriftregel
    persisted:
      column: bank_statement_line_id
      storageClass: core
    osfType: BankStatementLine
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Invoice Payment
    description: List InvoicePayment records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Invoice Payment
    description: Get InvoicePayment records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Invoice Payment
    description: Create InvoicePayment records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update InvoicePayment records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /invoice-payments
          nl: /factuurbetalingen
        columns:
          - key: paidAt
            sortable: true
          - key: amount
            sortable: true
        title:
          en: Invoice payments
          nl: Factuurbetalingen
        defaultSort:
          key: paidAt
          direction: desc
      record:
        routes:
          read:
            en: /invoice-payments/:id
            nl: /factuurbetalingen/:id
          create:
            en: /invoice-payments/create
            nl: /factuurbetalingen/aanmaken
        title: "{{amount}}"
        subtitle: "{{paidAt}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Payment details
                    nl: Betaalgegevens
                  fields:
                    - paidAt
                    - amount
        modes:
          create:
            title:
              en: Create invoice payment
              nl: Factuurbetaling aanmaken
            groups:
              - title:
                  en: Payment details
                  nl: Betaalgegevens
                fields:
                  - paidAt
                  - amount
          update:
            title:
              en: Edit invoice payment
              nl: Factuurbetaling bewerken
    fields:
      paidAt:
        render:
          component: DateTimePicker
          props: {}
