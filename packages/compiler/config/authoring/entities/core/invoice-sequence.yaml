schemaVersion: 3
kind: coreEntity
module: core
entity: InvoiceSequence
title: Invoice Sequence
description: Atomic counter for invoice numbering, keyed by (tenant, kind, fiscal year). Not user-facing — the row is
  created and incremented only by the billing run (BillingRun.execute), in the same transaction as the invoice
  insert; no interface creates, edits or deletes a counter.
language: en
displayTemplate: "{{kind}} {{fiscalYearCode}}: {{lastNumber}}"
filterField: kind
labels:
  en: Invoice sequence
  nl: Factuurreeks
pluralLabels:
  en: Invoice sequences
  nl: Factuurreeksen
domains:
  - finance
# One counter per (tenant, kind, fiscal year): the unique index is what lets
# the billing run allocate a number with a single `insert ... on conflict`
# increment, so two concurrent first-of-year runs serialise on the row
# instead of both seeding it at 1.
indexes:
  - name: invoice_sequences_tenant_kind_fiscal_year_uidx
    fields:
      - tenantId
      - kind
      - fiscalYearCode
    unique: true
fields:
  - key: kind
    readOnly: true
    writtenBy: [BillingRun.execute]
    required: true
    label:
      en: Kind
      nl: Soort
    description:
      en: Invoice kind for which this sequence allocates numbers (sales, purchase, credit).
      nl: Factuursoort waarvoor deze reeks nummers uitdeelt (verkoop, inkoop, creditnota).
    persisted:
      column: kind
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: INVOICEKIND
    osfType: referenceDataCode
  - key: fiscalYearCode
    readOnly: true
    writtenBy: [BillingRun.execute]
    osfType: string
    required: true
    label:
      en: Fiscal year code
      nl: Boekjaarcode
    description:
      en: Fiscal year code that scopes this sequence (e.g. "2026"). Stored as string so the sequence can be bootstrapped
        before the fiscal-year row exists.
      nl: Boekjaarcode die deze reeks afbakent (bijv. "2026"). Wordt als tekst opgeslagen zodat de reeks geïnitialiseerd kan
        worden voordat het boekjaarrecord bestaat.
    validation:
      minLength: 1
      maxLength: 20
    persisted:
      column: fiscal_year_code
      storageClass: core
  - key: lastNumber
    readOnly: true
    writtenBy: [BillingRun.execute]
    osfType: integer
    required: true
    label:
      en: Last number
      nl: Laatste nummer
    description:
      en: The atomic counter — the most recently allocated invoice number within (kind, fiscal year).
      nl: De atomische teller — het laatst uitgedeelde factuurnummer binnen (soort, boekjaar).
    defaultValue: 0
    validation:
      min: 0
    persisted:
      column: last_number
      storageClass: core
  - key: lastIssuedAt
    readOnly: true
    writtenBy: [BillingRun.execute]
    osfType: datetime
    required: false
    label:
      en: Last issued at
      nl: Laatst uitgegeven op
    description:
      en: Timestamp at which the last number was allocated.
      nl: Tijdstip waarop het laatste nummer is uitgedeeld.
    persisted:
      column: last_issued_at
      storageClass: core
  - key: format
    osfType: string
    required: false
    label:
      en: Format
      nl: Notatie
    description:
      en: printf-style format string applied to (fiscalYearCode, lastNumber) when rendering the invoice number (e.g.
        "%s-%05d").
      nl: printf-stijl notatie toegepast op (boekjaarcode, laatste nummer) bij het weergeven van het factuurnummer (bijv.
        "%s-%05d").
    defaultValue: "%s-%05d"
    validation:
      maxLength: 50
    persisted:
      column: format
      storageClass: core
  - key: resetPolicy
    osfType: string
    required: false
    label:
      en: Reset policy
      nl: Resetbeleid
    description:
      en: When the counter resets — "never" or "yearly".
      nl: Wanneer de teller wordt gereset — "never" (nooit) of "yearly" (jaarlijks).
    validation:
      maxLength: 20
    persisted:
      column: reset_policy
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the sequence in an external context.
      nl: Functionele of zakelijke code van de reeks in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create: []
    update: []
    delete: []
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Invoice Sequence
    description: List InvoiceSequence records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Invoice Sequence
    description: Get InvoiceSequence records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        getOne: true
        list: true
  web:
    views:
      collection:
        route:
          en: /invoice-sequences
          nl: /factuurreeksen
        columns:
          - key: kind
            sortable: true
          - key: fiscalYearCode
            sortable: true
          - key: lastNumber
            sortable: true
          - key: lastIssuedAt
            sortable: true
        title:
          en: Invoice sequences
          nl: Factuurreeksen
        defaultSort:
          key: fiscalYearCode
          direction: desc
      record:
        routes:
          read:
            en: /invoice-sequences/:id
            nl: /factuurreeksen/:id
        title: "{{kind}} {{fiscalYearCode}}"
        subtitle: "{{lastNumber}}"
        badges:
          - kind
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Sequence details
                    nl: Reeksgegevens
                  fields:
                    - kind
                    - fiscalYearCode
                    - lastNumber
                    - lastIssuedAt
                    - format
                    - resetPolicy
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
    fields:
      kind:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: INVOICEKIND
            clearable: false
      lastIssuedAt:
        render:
          component: DateTimePicker
          props: {}
