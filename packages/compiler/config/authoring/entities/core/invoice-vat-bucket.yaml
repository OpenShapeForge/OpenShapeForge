schemaVersion: 3
kind: coreEntity
module: core
entity: InvoiceVatBucket
title: Invoice VAT Bucket
description: Per-rate persisted VAT bucket on an invoice — one row per VatRate referenced on the lines. Persisted
  snapshot stays stable even if the VatRate is later edited.
language: en
displayTemplate: "{{vatRate.code}}"
filterField: id
labels:
  en: Invoice VAT bucket
  nl: BTW-totaal
domains:
  - finance
fields:
  - key: amountBase
    required: true
    label:
      en: Base amount
      nl: Basisbedrag
    description:
      en: Sum of net (excl. VAT) amounts for invoice lines at this VAT rate.
      nl: Som van de nettobedragen (excl. BTW) van de factuurregels op dit BTW-tarief.
    osfType: currency
    persisted:
      column: amount_base
      storageClass: core
  - key: amountVat
    required: true
    label:
      en: VAT amount
      nl: BTW-bedrag
    description:
      en: Sum of VAT amounts for invoice lines at this VAT rate.
      nl: Som van de BTW-bedragen van de factuurregels op dit BTW-tarief.
    osfType: currency
    persisted:
      column: amount_vat
      storageClass: core
  - key: invoiceId
    label:
      en: Invoice
      nl: Factuur
    persisted:
      column: invoice_id
      storageClass: core
    osfType: Invoice
    relationship:
      ownership: reference
  - key: vatRateId
    label:
      en: VAT rate
      nl: BTW-tarief
    persisted:
      column: vat_rate_id
      storageClass: core
    osfType: VatRate
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Invoice VAT Bucket
    description: List InvoiceVatBucket records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Invoice VAT Bucket
    description: Get InvoiceVatBucket records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Invoice VAT Bucket
    description: Create InvoiceVatBucket records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update InvoiceVatBucket records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /invoice-vat-buckets
          nl: /btw-totalen
        columns:
          - key: amountBase
            sortable: true
          - key: amountVat
            sortable: true
        title:
          en: Invoice VAT buckets
          nl: BTW-totalen
        defaultSort:
          key: amountBase
          direction: desc
      record:
        routes:
          read:
            en: /invoice-vat-buckets/:id
            nl: /btw-totalen/:id
          create:
            en: /invoice-vat-buckets/create
            nl: /btw-totalen/aanmaken
        title: "{{amountVat}}"
        subtitle: "{{amountBase}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Bucket totals
                    nl: Totalen per BTW-tarief
                  fields:
                    - amountBase
                    - amountVat
        modes:
          create:
            title:
              en: Create invoice VAT bucket
              nl: BTW-totaal aanmaken
            groups:
              - title:
                  en: Bucket totals
                  nl: Totalen per BTW-tarief
                fields:
                  - amountBase
                  - amountVat
          update:
            title:
              en: Edit invoice VAT bucket
              nl: BTW-totaal bewerken
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
