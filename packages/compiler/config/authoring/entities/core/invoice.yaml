schemaVersion: 3
kind: coreEntity
module: core
entity: Invoice
title: Invoice
description: Invoice header. Sales, purchase and credit invoices share this shape; they are distinguished by `invoiceKind`.
language: en
displayTemplate: "{{invoiceKind}} {{invoiceNumber}}"
filterField: invoiceNumber
labels:
  en: Invoice
  nl: Factuur
domains:
  - finance
fields:
  - key: invoiceKind
    valueType: string
    required: true
    label:
      en: Invoice kind
      nl: Factuursoort
    description:
      en: Kind of invoice — sales, purchase, or credit.
      nl: Factuursoort — verkoop, inkoop of creditnota.
    persisted:
      column: invoice_kind
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: INVOICEKIND
    semanticType: referenceDataCode
  - key: invoiceStatus
    valueType: string
    required: true
    label:
      en: Invoice status
      nl: Factuurstatus
    description:
      en: Lifecycle status of the invoice.
      nl: Levenscyclusstatus van de factuur.
    persisted:
      column: invoice_status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: INVOICESTATUS
    semanticType: referenceDataCode
  - key: invoiceNumber
    valueType: integer
    required: true
    label:
      en: Invoice number
      nl: Factuurnummer
    description:
      en: Sequential invoice number, unique within (invoice kind, fiscal period).
      nl: Volgnummer van de factuur, uniek binnen (factuursoort, boekjaarperiode).
    validation:
      min: 1
    persisted:
      column: invoice_number
      storageClass: core
  - key: issueDate
    valueType: date
    required: true
    label:
      en: Issue date
      nl: Factuurdatum
    description:
      en: Date the invoice was issued.
      nl: Datum waarop de factuur is uitgegeven.
    persisted:
      column: issue_date
      storageClass: core
  - key: dueDate
    valueType: date
    required: false
    label:
      en: Due date
      nl: Vervaldatum
    description:
      en: Date by which the invoice is due for payment.
      nl: Datum waarop de factuur uiterlijk betaald moet zijn.
    persisted:
      column: due_date
      storageClass: core
  - key: currencyCode
    valueType: string
    required: true
    label:
      en: Currency
      nl: Valuta
    description:
      en: ISO 4217 currency code in which the invoice is denominated.
      nl: ISO 4217 valutacode waarin de factuur luidt.
    defaultValue: EUR
    validation:
      minLength: 3
      maxLength: 3
    persisted:
      column: currency_code
      storageClass: core
  - key: amountBase
    valueType: number
    required: false
    label:
      en: Base amount
      nl: Basisbedrag
    description:
      en: Sum of line base amounts, excluding VAT.
      nl: Som van de basisbedragen van de regels, exclusief BTW.
    semanticType: currency
    persisted:
      column: amount_base
      storageClass: core
  - key: amountVat
    valueType: number
    required: false
    label:
      en: VAT amount
      nl: BTW-bedrag
    description:
      en: Sum of VAT amounts on the invoice.
      nl: Som van de BTW-bedragen op de factuur.
    semanticType: currency
    persisted:
      column: amount_vat
      storageClass: core
  - key: amountTotal
    valueType: number
    required: false
    label:
      en: Total amount
      nl: Totaalbedrag
    description:
      en: Total invoice amount including VAT.
      nl: Totaalbedrag van de factuur inclusief BTW.
    semanticType: currency
    persisted:
      column: amount_total
      storageClass: core
  - key: balance
    valueType: number
    required: false
    label:
      en: Balance
      nl: Saldo
    description:
      en: Outstanding balance on this invoice (total minus payments applied).
      nl: Openstaand saldo op deze factuur (totaal minus betalingen).
    semanticType: currency
    persisted:
      column: balance
      storageClass: core
  - key: iban
    valueType: string
    required: false
    label:
      en: IBAN
      nl: IBAN
    description:
      en: IBAN to which payment for this invoice should be made (for sales) or from which it was paid (for purchase).
      nl: IBAN waarop de factuur betaald moet worden (voor verkoop) of waarvan is betaald (voor inkoop).
    validation:
      maxLength: 34
    persisted:
      column: iban
      storageClass: core
  - key: email
    valueType: string
    required: false
    label:
      en: Email
      nl: E-mail
    description:
      en: Email address used for invoice dispatch.
      nl: E-mailadres dat is gebruikt voor het versturen van de factuur.
    validation:
      maxLength: 320
    persisted:
      column: email
      storageClass: core
  - key: dispatchChannel
    valueType: string
    required: false
    label:
      en: Dispatch channel
      nl: Verzendkanaal
    description:
      en: Channel used to dispatch the invoice (email, letter, sms, portal).
      nl: Kanaal waarmee de factuur is verstuurd (e-mail, brief, sms, portaal).
    persisted:
      column: dispatch_channel
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: INVOICEDISPATCHCHANNEL
    semanticType: referenceDataCode
  - key: descriptionLine1
    valueType: string
    required: false
    label:
      en: Description line 1
      nl: Omschrijvingsregel 1
    description:
      en: First free-text description line printed on the invoice.
      nl: Eerste vrije omschrijvingsregel die op de factuur wordt afgedrukt.
    validation:
      maxLength: 200
    persisted:
      column: description_line_1
      storageClass: core
  - key: descriptionLine2
    valueType: string
    required: false
    label:
      en: Description line 2
      nl: Omschrijvingsregel 2
    description:
      en: Second free-text description line printed on the invoice.
      nl: Tweede vrije omschrijvingsregel die op de factuur wordt afgedrukt.
    validation:
      maxLength: 200
    persisted:
      column: description_line_2
      storageClass: core
  - key: descriptionLine3
    valueType: string
    required: false
    label:
      en: Description line 3
      nl: Omschrijvingsregel 3
    description:
      en: Third free-text description line printed on the invoice.
      nl: Derde vrije omschrijvingsregel die op de factuur wordt afgedrukt.
    validation:
      maxLength: 200
    persisted:
      column: description_line_3
      storageClass: core
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the invoice in an external context.
      nl: Functionele of zakelijke code van de factuur in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    semanticType: Relation
    relationship:
      ownership: reference
  - key: agreementId
    label:
      en: Agreement
      nl: Overeenkomst
    persisted:
      column: agreement_id
      storageClass: core
    semanticType: Agreement
    relationship:
      ownership: reference
  - key: fiscalPeriodId
    label:
      en: Fiscal period
      nl: Boekjaarperiode
    persisted:
      column: fiscal_period_id
      storageClass: core
    semanticType: FiscalPeriod
    relationship:
      ownership: reference
  - key: controlLedgerAccountId
    label:
      en: Control ledger account
      nl: Tussenrekening
    persisted:
      column: control_ledger_account_id
      storageClass: core
    semanticType: LedgerAccount
    relationship:
      ownership: reference
  - key: paymentMethodId
    label:
      en: Payment method
      nl: Betaalwijze
    persisted:
      column: payment_method_id
      storageClass: core
    semanticType: PaymentMethod
    relationship:
      ownership: reference
  - key: mandateId
    label:
      en: Mandate
      nl: Machtiging
    persisted:
      column: mandate_id
      storageClass: core
    semanticType: DirectDebitMandate
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Invoice
    description: List Invoice records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Invoice
    description: Get Invoice records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Invoice
    description: Create Invoice records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Invoice records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /invoices
          nl: /facturen
        columns:
          - key: invoiceKind
            sortable: true
          - key: invoiceNumber
            sortable: true
          - key: invoiceStatus
            sortable: true
          - key: issueDate
            sortable: true
          - key: dueDate
            sortable: true
          - key: amountTotal
            sortable: true
          - key: balance
            sortable: true
        title:
          en: Invoices
          nl: Facturen
        defaultSort:
          key: issueDate
          direction: desc
      record:
        routes:
          read:
            en: /invoices/:id
            nl: /facturen/:id
          create:
            en: /invoices/create
            nl: /facturen/aanmaken
        title: "{{invoiceKind}} {{invoiceNumber}}"
        subtitle: "{{amountTotal}}"
        badges:
          - invoiceKind
          - invoiceStatus
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Invoice details
                    nl: Factuurgegevens
                  fields:
                    - invoiceKind
                    - invoiceStatus
                    - invoiceNumber
                    - issueDate
                    - dueDate
                    - currencyCode
                - title:
                    en: Amounts
                    nl: Bedragen
                  fields:
                    - amountBase
                    - amountVat
                    - amountTotal
                    - balance
                - title:
                    en: Dispatch
                    nl: Verzending
                  fields:
                    - iban
                    - email
                    - dispatchChannel
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - descriptionLine1
                    - descriptionLine2
                    - descriptionLine3
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create invoice
              nl: Factuur aanmaken
            groups:
              - title:
                  en: Invoice details
                  nl: Factuurgegevens
                fields:
                  - invoiceKind
                  - invoiceStatus
                  - invoiceNumber
                  - issueDate
                  - dueDate
                  - currencyCode
              - title:
                  en: Amounts
                  nl: Bedragen
                fields:
                  - amountBase
                  - amountVat
                  - amountTotal
                  - balance
              - title:
                  en: Dispatch
                  nl: Verzending
                fields:
                  - iban
                  - email
                  - dispatchChannel
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - descriptionLine1
                  - descriptionLine2
                  - descriptionLine3
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit invoice
              nl: Factuur bewerken
    fields:
      invoiceKind:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: INVOICEKIND
            clearable: false
      invoiceStatus:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: INVOICESTATUS
            clearable: false
      issueDate:
        render:
          component: DatePicker
          props: {}
      dueDate:
        render:
          component: DatePicker
          props: {}
      dispatchChannel:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: INVOICEDISPATCHCHANNEL
            clearable: true
