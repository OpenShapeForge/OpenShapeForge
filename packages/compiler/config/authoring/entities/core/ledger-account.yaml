schemaVersion: 3
kind: coreEntity
module: core
entity: LedgerAccount
title: Ledger Account
description: General-ledger account in the chart of accounts. Distinct from `Account` (relation-account / user-account).
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Ledger account
  nl: Grootboekrekening
domains:
  - finance
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique chart-of-accounts code.
      nl: Tenant-unieke grootboekrekening-code.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the ledger account.
      nl: Menselijk leesbare naam van de grootboekrekening.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: accountType
    required: true
    label:
      en: Account type
      nl: Rekeningsoort
    description:
      en: Classification of the account (asset, liability, equity, revenue, expense, control account).
      nl: Classificatie van de rekening (activa, passiva, eigen vermogen, opbrengsten, kosten, tussenrekening).
    persisted:
      column: account_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: LEDGERACCOUNTTYPE
    osfType: referenceDataCode
  - key: isPostable
    osfType: boolean
    label:
      en: Postable
      nl: Boekbaar
    description:
      en: Whether journal entries can post directly to this account (true) or only to its children (false).
      nl: Of journaalposten direct op deze rekening kunnen worden geboekt (waar) of alleen op onderliggende rekeningen
        (onwaar).
    defaultValue: true
    persisted:
      column: is_postable
      storageClass: core
  - key: currencyCode
    osfType: string
    required: true
    label:
      en: Currency
      nl: Valuta
    description:
      en: ISO 4217 currency code in which postings on this account are denominated.
      nl: ISO 4217 valutacode waarin boekingen op deze rekening luiden.
    defaultValue: EUR
    validation:
      minLength: 3
      maxLength: 3
    persisted:
      column: currency_code
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the account.
      nl: Optionele omschrijving of zakelijke betekenis van de rekening.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the account in an external context.
      nl: Functionele of zakelijke code van de rekening in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: parentLedgerAccountId
    label:
      en: Parent ledger account
      nl: Bovenliggende grootboekrekening
    persisted:
      column: parent_ledger_account_id
      storageClass: core
    osfType: LedgerAccount
    relationship:
      ownership: reference
      inverse:
        key: childLedgerAccounts
        label:
          en: Child ledger accounts
          nl: Onderliggende grootboekrekeningen
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Ledger Account
    description: List LedgerAccount records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Ledger Account
    description: Get LedgerAccount records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Ledger Account
    description: Create LedgerAccount records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update LedgerAccount records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /ledger-accounts
          nl: /grootboekrekeningen
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: accountType
            sortable: true
          - key: isPostable
            sortable: true
          - key: currencyCode
            sortable: true
        title:
          en: Ledger accounts
          nl: Grootboekrekeningen
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /ledger-accounts/:id
            nl: /grootboekrekeningen/:id
          create:
            en: /ledger-accounts/create
            nl: /grootboekrekeningen/aanmaken
        title: "{{code}} {{name}}"
        subtitle: "{{accountType}}"
        badges:
          - accountType
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Account details
                    nl: Rekeninggegevens
                  fields:
                    - code
                    - name
                    - accountType
                    - isPostable
                    - currencyCode
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create ledger account
              nl: Grootboekrekening aanmaken
            groups:
              - title:
                  en: Account details
                  nl: Rekeninggegevens
                fields:
                  - code
                  - name
                  - accountType
                  - isPostable
                  - currencyCode
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit ledger account
              nl: Grootboekrekening bewerken
    fields:
      accountType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: LEDGERACCOUNTTYPE
            clearable: false
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
