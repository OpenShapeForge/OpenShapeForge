schemaVersion: 3
kind: coreEntity
module: core
entity: LedgerPostingLine
title: Ledger Posting Line
description: Journal entry line. Single debit or credit movement against a ledger account, optionally tagged with
  analytical dimensions.
language: en
displayTemplate: "{{lineNumber}}: {{amount}}"
filterField: description
labels:
  en: Ledger posting line
  nl: Boekingsregel
domains:
  - finance
fields:
  - key: lineNumber
    osfType: integer
    required: true
    label:
      en: Line number
      nl: Regelnummer
    description:
      en: Sequential line number within the ledger posting.
      nl: Volgnummer van de regel binnen de boeking.
    validation:
      min: 1
    persisted:
      column: line_number
      storageClass: core
  - key: side
    required: true
    label:
      en: Side
      nl: Zijde
    description:
      en: Whether this line is a debit or credit.
      nl: Of deze regel een debet- of creditboeking is.
    persisted:
      column: side
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: LEDGERSIDE
    osfType: referenceDataCode
  - key: amount
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Monetary amount of the line.
      nl: Geldbedrag van de regel.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: description
    osfType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-text description of the line.
      nl: Vrije omschrijving van de regel.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
  - key: ledgerPostingId
    label:
      en: Ledger posting
      nl: Boeking
    persisted:
      column: ledger_posting_id
      storageClass: core
    osfType: LedgerPosting
    relationship:
      ownership: reference
  - key: ledgerAccountId
    label:
      en: Ledger account
      nl: Grootboekrekening
    persisted:
      column: ledger_account_id
      storageClass: core
    osfType: LedgerAccount
    relationship:
      ownership: reference
  - key: agreementId
    label:
      en: Agreement
      nl: Overeenkomst
    persisted:
      column: agreement_id
      storageClass: core
    osfType: Agreement
    relationship:
      ownership: reference
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  - key: dimension1Id
    label:
      en: Cost dimension 1
      nl: Kostendimensie 1
    persisted:
      column: dimension_1_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
  - key: dimension2Id
    label:
      en: Cost dimension 2
      nl: Kostendimensie 2
    persisted:
      column: dimension_2_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
  - key: vatDimensionId
    label:
      en: VAT dimension
      nl: BTW-dimensie
    persisted:
      column: vat_dimension_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Ledger Posting Line
    description: List LedgerPostingLine records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Ledger Posting Line
    description: Get LedgerPostingLine records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Ledger Posting Line
    description: Create LedgerPostingLine records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update LedgerPostingLine records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /ledger-posting-lines
          nl: /boekingsregels
        columns:
          - key: lineNumber
            sortable: true
          - key: side
            sortable: true
          - key: amount
            sortable: true
          - key: description
            sortable: true
        title:
          en: Ledger posting lines
          nl: Boekingsregels
        defaultSort:
          key: lineNumber
          direction: asc
      record:
        routes:
          read:
            en: /ledger-posting-lines/:id
            nl: /boekingsregels/:id
          create:
            en: /ledger-posting-lines/create
            nl: /boekingsregels/aanmaken
        title: "{{lineNumber}}: {{amount}}"
        subtitle: "{{description}}"
        badges:
          - side
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Line details
                    nl: Regelgegevens
                  fields:
                    - lineNumber
                    - side
                    - amount
                    - description
        modes:
          create:
            title:
              en: Create ledger posting line
              nl: Boekingsregel aanmaken
            groups:
              - title:
                  en: Line details
                  nl: Regelgegevens
                fields:
                  - lineNumber
                  - side
                  - amount
                  - description
          update:
            title:
              en: Edit ledger posting line
              nl: Boekingsregel bewerken
    fields:
      side:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: LEDGERSIDE
            clearable: false
