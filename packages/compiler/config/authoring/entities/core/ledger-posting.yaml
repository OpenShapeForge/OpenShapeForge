schemaVersion: 3
kind: coreEntity
module: core
entity: LedgerPosting
title: Ledger Posting
description: Journal entry header. Groups one or more LedgerPostingLine rows that together form a balanced posting in
  the general ledger.
language: en
displayTemplate: "{{description}}"
filterField: description
labels:
  en: Ledger posting
  nl: Boeking
domains:
  - finance
fields:
  - key: postingDate
    osfType: date
    required: true
    label:
      en: Posting date
      nl: Boekdatum
    description:
      en: Date on which the journal entry is posted.
      nl: Datum waarop de boeking wordt verwerkt.
    persisted:
      column: posting_date
      storageClass: core
  - key: description
    osfType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-text description of the journal entry.
      nl: Vrije omschrijving van de boeking.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the journal entry.
      nl: Levenscyclusstatus van de boeking.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: LEDGERPOSTINGSTATUS
    osfType: referenceDataCode
  - key: sourceType
    osfType: string
    required: true
    label:
      en: Source type
      nl: Bronsoort
    description:
      en: Kind of source that produced the posting (e.g. invoice, payment, manual, reconciliation).
      nl: Soort bron die de boeking heeft veroorzaakt (bv. factuur, betaling, handmatig, aflettering).
    validation:
      maxLength: 50
    persisted:
      column: source_type
      storageClass: core
  - key: sourceId
    osfType: string
    required: false
    label:
      en: Source ID
      nl: Bron-id
    description:
      en: Loose pointer to the source entity row that produced the posting.
      nl: Losse verwijzing naar het bronentiteitrecord dat de boeking heeft veroorzaakt.
    persisted:
      column: source_id
      storageClass: core
    validation:
      format: uuid
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the posting in an external context.
      nl: Functionele of zakelijke code van de boeking in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: fiscalPeriodId
    label:
      en: Fiscal period
      nl: Boekjaarperiode
    persisted:
      column: fiscal_period_id
      storageClass: core
    osfType: FiscalPeriod
    relationship:
      ownership: reference
  - key: reversalOfId
    label:
      en: Reversal of
      nl: Tegenboeking van
    persisted:
      column: reversal_of_id
      storageClass: core
    osfType: LedgerPosting
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Ledger Posting
    description: List LedgerPosting records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Ledger Posting
    description: Get LedgerPosting records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Ledger Posting
    description: Create LedgerPosting records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update LedgerPosting records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /ledger-postings
          nl: /boekingen
        columns:
          - key: postingDate
            sortable: true
          - key: description
            sortable: true
          - key: status
            sortable: true
          - key: sourceType
            sortable: true
        title:
          en: Ledger postings
          nl: Boekingen
        defaultSort:
          key: postingDate
          direction: desc
      record:
        routes:
          read:
            en: /ledger-postings/:id
            nl: /boekingen/:id
          create:
            en: /ledger-postings/create
            nl: /boekingen/aanmaken
        title: "{{description}}"
        subtitle: "{{postingDate}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Posting details
                    nl: Boekingsgegevens
                  fields:
                    - postingDate
                    - description
                    - status
                - title:
                    en: Source
                    nl: Bron
                  fields:
                    - sourceType
                    - sourceId
                - title:
                    en: Provenance
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create ledger posting
              nl: Boeking aanmaken
            groups:
              - title:
                  en: Posting details
                  nl: Boekingsgegevens
                fields:
                  - postingDate
                  - description
                  - status
              - title:
                  en: Source
                  nl: Bron
                fields:
                  - sourceType
                  - sourceId
              - title:
                  en: Provenance
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit ledger posting
              nl: Boeking bewerken
    fields:
      postingDate:
        render:
          component: DatePicker
          props: {}
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: LEDGERPOSTINGSTATUS
            clearable: false
