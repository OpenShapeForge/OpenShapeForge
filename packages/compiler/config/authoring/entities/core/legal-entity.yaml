schemaVersion: 3
kind: coreEntity
module: core
entity: LegalEntity
title: Legal Entity
description: A legal entity such as a company, foundation, or government body. Shared reachability and business contact
  state should be modeled on the related Relation aggregate.
language: en
displayTemplate: "{{name}}"
filterField: name
labels:
  en: Legal Entity
  nl: Rechtspersoon
pluralLabels:
  en: Legal entities
  nl: Rechtspersonen
domains:
  - relations
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Official registered name of the legal entity.
      nl: Officieel geregistreerde naam van de rechtspersoon.
    validation:
      minLength: 1
      maxLength: 300
    persisted:
      column: name
      storageClass: core
  - key: registrationNumber
    osfType: string
    required: false
    label:
      en: Registration number
      nl: KvK-nummer
    description:
      en: Chamber of Commerce or company registration number.
      nl: Kamer van Koophandel-nummer of handelsregisternummer.
    validation:
      maxLength: 50
    persisted:
      column: registration_number
      storageClass: core
  - key: vatNumber
    osfType: string
    required: false
    label:
      en: VAT number
      nl: BTW-nummer
    description:
      en: Value Added Tax identification number.
      nl: BTW-identificatienummer.
    validation:
      maxLength: 50
    persisted:
      column: vat_number
      storageClass: core
  - key: globalLocationNumber
    osfType: string
    required: false
    label:
      en: Global Location Number
      nl: GLN-nummer
    description:
      en: Global Location Number (GLN) for identification in supply chains.
      nl: Global Location Number (GLN) voor identificatie in toeleveringsketens.
    validation:
      maxLength: 13
    persisted:
      column: global_location_number
      storageClass: core
  - key: legalForm
    required: false
    label:
      en: Legal form
      nl: Rechtsvorm
    description:
      en: Legal form of the entity (e.g. BV, NV, Stichting).
      nl: Rechtsvorm van de entiteit (bijv. BV, NV, Stichting).
    validation:
      maxLength: 100
    persisted:
      column: legal_form
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: LEGALFORM
    osfType: referenceDataCode
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  - key: contactMoments
    label:
      en: Contact moments
      nl: Contactmomenten
    osfType: ContactMoment
    cardinality: collection
    relationship:
      inverse: relationId
      ownership: reference
      via: relationId
operations:
  list:
    name: List Legal Entity
    description: List LegalEntity records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Legal Entity
    description: Get LegalEntity records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Legal Entity
    description: Create LegalEntity records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update LegalEntity records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /legal-entities
          nl: /rechtspersonen
        columns:
          - key: name
            sortable: true
          - key: registrationNumber
            sortable: true
          - key: legalForm
            sortable: true
          - key: vatNumber
            sortable: false
        title:
          en: Legal Entities
          nl: Rechtspersonen
        defaultSort:
          key: name
          direction: asc
      record:
        routes:
          read:
            en: /legal-entities/:id
            nl: /rechtspersonen/:id
          create:
            en: /legal-entities/create
            nl: /rechtspersonen/aanmaken
        title: "{{name}}"
        subtitle: "{{legalForm}}"
        badges:
          - legalForm
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: General
                    nl: Algemeen
                  fields:
                    - name
                    - legalForm
                - title:
                    en: Registration
                    nl: Registratie
                  fields:
                    - registrationNumber
                    - vatNumber
                    - globalLocationNumber
        modes:
          create:
            title:
              en: Create legal entity
              nl: Rechtspersoon aanmaken
            groups:
              - title:
                  en: General
                  nl: Algemeen
                fields:
                  - name
                  - legalForm
              - title:
                  en: Registration
                  nl: Registratie
                fields:
                  - registrationNumber
                  - vatNumber
                  - globalLocationNumber
          update:
            title:
              en: Edit legal entity
              nl: Rechtspersoon bewerken
    fields:
      legalForm:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: LEGALFORM
            clearable: true
