schemaVersion: 3
kind: coreEntity
module: core
entity: MaintenanceOrderParty
title: Maintenance Order Party
description: Party assigned to a maintenance order, scoped to a role and validity period (canonical role pattern).
language: en
displayTemplate: "{{roleType}}"
filterField: roleType
labels:
  en: Maintenance order party
  nl: Partij op onderhoudsorder
domains:
  - maintenance
fields:
  - key: roleType
    required: true
    label:
      en: Role type
      nl: Roltype
    description:
      en: Role this party plays on the maintenance order (executor, supervisor, etc.).
      nl: Rol die deze partij vervult op de onderhoudsorder (uitvoerder, toezichthouder, etc.).
    persisted:
      column: role_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: MAINTENANCEORDERPARTYROLE
    osfType: referenceDataCode
  - key: status
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of this role assignment.
      nl: Levenscyclusstatus van deze roltoewijzing.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ROLEASSIGNMENTSTATUS
    osfType: referenceDataCode
  - key: name
    osfType: string
    required: false
    label:
      en: Name
      nl: Naam
    description:
      en: Optional human-readable name of the role assignment.
      nl: Optionele menselijk leesbare naam van de roltoewijzing.
    validation:
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the role assignment.
      nl: Optionele omschrijving of zakelijke betekenis van de roltoewijzing.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which this party is effective on the maintenance order.
      nl: Datum vanaf wanneer deze partij geldig is op de onderhoudsorder.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which this party is effective on the maintenance order.
      nl: Datum tot wanneer deze partij geldig is op de onderhoudsorder.
    persisted:
      column: end_date
      storageClass: core
  - key: estimatedHours
    osfType: number
    required: false
    label:
      en: Estimated hours
      nl: Geraamde uren
    description:
      en: Estimated hours this party will spend on the order.
      nl: Geraamde uren die deze partij aan de order besteedt.
    persisted:
      column: estimated_hours
      storageClass: core
  - key: actualHours
    osfType: number
    required: false
    label:
      en: Actual hours
      nl: Werkelijke uren
    description:
      en: Actual hours this party spent on the order.
      nl: Werkelijke uren die deze partij aan de order heeft besteed.
    persisted:
      column: actual_hours
      storageClass: core
  - key: hourlyRate
    required: false
    label:
      en: Hourly rate
      nl: Uurtarief
    description:
      en: Hourly rate charged by this party.
      nl: Uurtarief dat door deze partij wordt gehanteerd.
    osfType: currency
    persisted:
      column: hourly_rate
      storageClass: core
  - key: workCompletedAt
    osfType: datetime
    required: false
    label:
      en: Work completed at
      nl: Werk afgerond op
    description:
      en: Timestamp when this party completed their work.
      nl: Tijdstip waarop deze partij het werk heeft afgerond.
    persisted:
      column: work_completed_at
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the role assignment in an external context.
      nl: Functionele of zakelijke code van de roltoewijzing in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: maintenanceOrderId
    label:
      en: Maintenance order
      nl: Onderhoudsorder
    persisted:
      column: maintenance_order_id
      storageClass: core
    osfType: MaintenanceOrder
    relationship:
      ownership: reference
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Maintenance.All.Read
      - Maintenance.All.ReadWrite
    create:
      - Maintenance.All.ReadWrite
    update:
      - Maintenance.All.ReadWrite
    delete:
      - Maintenance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Maintenance Order Party
    description: List MaintenanceOrderParty records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Maintenance Order Party
    description: Get MaintenanceOrderParty records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Maintenance Order Party
    description: Create MaintenanceOrderParty records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update MaintenanceOrderParty records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /maintenance-order-parties
          nl: /onderhoudsorderpartijen
        columns:
          - key: roleType
            sortable: true
          - key: name
            sortable: true
          - key: status
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
        title:
          en: Maintenance order parties
          nl: Partijen op onderhoudsorders
        defaultSort:
          key: startDate
          direction: desc
      record:
        routes:
          read:
            en: /maintenance-order-parties/:id
            nl: /onderhoudsorderpartijen/:id
          create:
            en: /maintenance-order-parties/create
            nl: /onderhoudsorderpartijen/aanmaken
        title: "{{name || roleType}}"
        subtitle: "{{status}}"
        badges:
          - roleType
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Role details
                    nl: Rolgegevens
                  fields:
                    - roleType
                    - status
                    - name
                    - startDate
                    - endDate
                - title:
                    en: Hours and rate
                    nl: Uren en tarief
                  fields:
                    - estimatedHours
                    - actualHours
                    - hourlyRate
                    - workCompletedAt
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create maintenance order party
              nl: Partij op onderhoudsorder aanmaken
            groups:
              - title:
                  en: Role details
                  nl: Rolgegevens
                fields:
                  - roleType
                  - status
                  - name
                  - startDate
                  - endDate
              - title:
                  en: Hours and rate
                  nl: Uren en tarief
                fields:
                  - estimatedHours
                  - actualHours
                  - hourlyRate
                  - workCompletedAt
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit maintenance order party
              nl: Partij op onderhoudsorder bewerken
    fields:
      roleType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: MAINTENANCEORDERPARTYROLE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ROLEASSIGNMENTSTATUS
            clearable: true
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
      workCompletedAt:
        render:
          component: DateTimePicker
          props: {}
