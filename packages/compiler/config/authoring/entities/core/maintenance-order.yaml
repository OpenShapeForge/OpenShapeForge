schemaVersion: 3
kind: coreEntity
module: core
entity: MaintenanceOrder
title: Maintenance Order
description: Order to execute maintenance work; may originate from a maintenance request and bill against an agreement.
language: en
displayTemplate: "{{code}} {{title}}"
filterField: code
labels:
  en: Maintenance order
  nl: Onderhoudsorder
pluralLabels:
  en: Maintenance orders
  nl: Onderhoudsorders
domains:
  - maintenance
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique maintenance order code.
      nl: Tenant-unieke code van de onderhoudsorder.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: title
    osfType: string
    required: true
    label:
      en: Title
      nl: Titel
    description:
      en: Short title describing the maintenance order.
      nl: Korte titel die de onderhoudsorder omschrijft.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: title
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Detailed description of the work to be performed.
      nl: Uitgebreide omschrijving van het uit te voeren werk.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the maintenance order.
      nl: Levenscyclusstatus van de onderhoudsorder.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: MAINTENANCEORDERSTATUS
    osfType: referenceDataCode
  - key: issueDate
    osfType: date
    required: true
    label:
      en: Issue date
      nl: Uitgiftedatum
    description:
      en: Date the order was issued.
      nl: Datum waarop de order is uitgegeven.
    persisted:
      column: issue_date
      storageClass: core
  - key: plannedStartDate
    osfType: date
    required: false
    label:
      en: Planned start date
      nl: Geplande startdatum
    description:
      en: Date on which the work is planned to start.
      nl: Datum waarop het werk gepland staat te starten.
    persisted:
      column: planned_start_date
      storageClass: core
  - key: plannedEndDate
    osfType: date
    required: false
    label:
      en: Planned end date
      nl: Geplande einddatum
    description:
      en: Date on which the work is planned to end.
      nl: Datum waarop het werk gepland staat te eindigen.
    persisted:
      column: planned_end_date
      storageClass: core
  - key: actualStartDate
    osfType: date
    required: false
    label:
      en: Actual start date
      nl: Werkelijke startdatum
    description:
      en: Date on which the work actually started.
      nl: Datum waarop het werk daadwerkelijk is gestart.
    persisted:
      column: actual_start_date
      storageClass: core
  - key: actualEndDate
    osfType: date
    required: false
    label:
      en: Actual end date
      nl: Werkelijke einddatum
    description:
      en: Date on which the work actually ended.
      nl: Datum waarop het werk daadwerkelijk is geëindigd.
    persisted:
      column: actual_end_date
      storageClass: core
  - key: currencyCode
    osfType: string
    required: true
    label:
      en: Currency
      nl: Valuta
    description:
      en: ISO 4217 currency code for the order amounts.
      nl: ISO 4217 valutacode voor de bedragen op de order.
    defaultValue: EUR
    validation:
      minLength: 3
      maxLength: 3
    persisted:
      column: currency_code
      storageClass: core
  - key: estimatedAmount
    required: false
    label:
      en: Estimated amount
      nl: Geraamd bedrag
    description:
      en: Estimated total amount for the order.
      nl: Geraamd totaalbedrag voor de order.
    osfType: currency
    persisted:
      column: estimated_amount
      storageClass: core
  - key: actualAmount
    required: false
    label:
      en: Actual amount
      nl: Werkelijk bedrag
    description:
      en: Actual total amount realized for the order.
      nl: Werkelijk gerealiseerd totaalbedrag voor de order.
    osfType: currency
    persisted:
      column: actual_amount
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the maintenance order in an external context.
      nl: Functionele of zakelijke code van de onderhoudsorder in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: maintenanceRequestId
    label:
      en: Maintenance request
      nl: Onderhoudsverzoek
    persisted:
      column: maintenance_request_id
      storageClass: core
    osfType: MaintenanceRequest
    relationship:
      ownership: reference
  - key: agreementId
    label:
      en: Agreement
      nl: Overeenkomst
    persisted:
      column: agreement_id
      storageClass: core
    osfType: Agreement
    relationship:
      ownership: reference
  - key: assetId
    label:
      en: Asset
      nl: Object
    persisted:
      column: asset_reference
      storageClass: core
    osfType: Asset
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Maintenance.All.Read
      - Maintenance.All.ReadWrite
    create:
      - Maintenance.All.ReadWrite
    update:
      - Maintenance.All.ReadWrite
    delete:
      - Maintenance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Maintenance Order
    description: List MaintenanceOrder records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Maintenance Order
    description: Get MaintenanceOrder records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Maintenance Order
    description: Create MaintenanceOrder records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update MaintenanceOrder records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /maintenance-orders
          nl: /onderhoudsorders
        columns:
          - key: code
            sortable: true
          - key: title
            sortable: true
          - key: status
            sortable: true
          - key: issueDate
            sortable: true
          - key: plannedStartDate
            sortable: true
        title:
          en: Maintenance orders
          nl: Onderhoudsorders
        defaultSort:
          key: issueDate
          direction: desc
      record:
        routes:
          read:
            en: /maintenance-orders/:id
            nl: /onderhoudsorders/:id
          create:
            en: /maintenance-orders/create
            nl: /onderhoudsorders/aanmaken
        title: "{{code}} {{title}}"
        subtitle: "{{status}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Order details
                    nl: Ordergegevens
                  fields:
                    - code
                    - title
                    - status
                    - issueDate
                - title:
                    en: Planning
                    nl: Planning
                  fields:
                    - plannedStartDate
                    - plannedEndDate
                    - actualStartDate
                    - actualEndDate
                - title:
                    en: Amounts
                    nl: Bedragen
                  fields:
                    - currencyCode
                    - estimatedAmount
                    - actualAmount
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create maintenance order
              nl: Onderhoudsorder aanmaken
            groups:
              - title:
                  en: Order details
                  nl: Ordergegevens
                fields:
                  - code
                  - title
                  - status
                  - issueDate
              - title:
                  en: Planning
                  nl: Planning
                fields:
                  - plannedStartDate
                  - plannedEndDate
                  - actualStartDate
                  - actualEndDate
              - title:
                  en: Amounts
                  nl: Bedragen
                fields:
                  - currencyCode
                  - estimatedAmount
                  - actualAmount
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit maintenance order
              nl: Onderhoudsorder bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: MAINTENANCEORDERSTATUS
            clearable: false
      issueDate:
        render:
          component: DatePicker
          props: {}
      plannedStartDate:
        render:
          component: DatePicker
          props: {}
      plannedEndDate:
        render:
          component: DatePicker
          props: {}
      actualStartDate:
        render:
          component: DatePicker
          props: {}
      actualEndDate:
        render:
          component: DatePicker
          props: {}
