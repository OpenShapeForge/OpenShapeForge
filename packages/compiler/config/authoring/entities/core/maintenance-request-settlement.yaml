schemaVersion: 3
kind: coreEntity
module: core
entity: MaintenanceRequestSettlement
title: Maintenance Request Settlement
description: Charge-back of a maintenance request to a relation, optionally linking the generated invoice.
language: en
displayTemplate: "{{description}}: {{amount}}"
filterField: description
labels:
  en: Maintenance request settlement
  nl: Onderhoudsverzoek-verrekening
domains:
  - maintenance
fields:
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Description of the settlement.
      nl: Omschrijving van de verrekening.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
    semanticType: multilineText
  - key: amount
    valueType: number
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Settled amount.
      nl: Verrekend bedrag.
    semanticType: currency
    persisted:
      column: amount
      storageClass: core
  - key: settledAt
    valueType: date
    required: true
    label:
      en: Settled at
      nl: Verrekend op
    description:
      en: Date on which the settlement was made.
      nl: Datum waarop de verrekening is gemaakt.
    persisted:
      column: settled_at
      storageClass: core
  - key: maintenanceRequestId
    label:
      en: Maintenance request
      nl: Onderhoudsverzoek
    persisted:
      column: maintenance_request_id
      storageClass: core
    semanticType: MaintenanceRequest
    relationship:
      ownership: reference
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    semanticType: Relation
    relationship:
      ownership: reference
  - key: invoiceId
    label:
      en: Invoice
      nl: Factuur
    persisted:
      column: invoice_id
      storageClass: core
    semanticType: Invoice
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Maintenance.All.Read
      - Maintenance.All.ReadWrite
    create:
      - Maintenance.All.ReadWrite
    update:
      - Maintenance.All.ReadWrite
    delete:
      - Maintenance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Maintenance Request Settlement
    description: List MaintenanceRequestSettlement records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Maintenance Request Settlement
    description: Get MaintenanceRequestSettlement records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Maintenance Request Settlement
    description: Create MaintenanceRequestSettlement records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update MaintenanceRequestSettlement records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /maintenance-request-settlements
          nl: /onderhoudsverzoek-verrekeningen
        columns:
          - key: description
            sortable: true
          - key: amount
            sortable: true
          - key: settledAt
            sortable: true
        title:
          en: Maintenance request settlements
          nl: Onderhoudsverzoek-verrekeningen
        defaultSort:
          key: settledAt
          direction: desc
      record:
        routes:
          read:
            en: /maintenance-request-settlements/:id
            nl: /onderhoudsverzoek-verrekeningen/:id
          create:
            en: /maintenance-request-settlements/create
            nl: /onderhoudsverzoek-verrekeningen/aanmaken
        title: "{{description}}"
        subtitle: "{{amount}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Settlement details
                    nl: Verrekeninggegevens
                  fields:
                    - description
                    - amount
                    - settledAt
        modes:
          create:
            title:
              en: Create maintenance request settlement
              nl: Onderhoudsverzoek-verrekening aanmaken
            groups:
              - title:
                  en: Settlement details
                  nl: Verrekeninggegevens
                fields:
                  - description
                  - amount
                  - settledAt
          update:
            title:
              en: Edit maintenance request settlement
              nl: Onderhoudsverzoek-verrekening bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 500
      settledAt:
        render:
          component: DatePicker
          props: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
