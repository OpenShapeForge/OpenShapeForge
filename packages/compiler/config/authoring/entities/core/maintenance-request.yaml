schemaVersion: 3
kind: coreEntity
module: core
entity: MaintenanceRequest
title: Maintenance Request
description: A reported maintenance issue that may be triaged, scheduled, and executed against an asset.
language: en
displayTemplate: "{{code}} {{title}}"
filterField: code
labels:
  en: Maintenance request
  nl: Onderhoudsverzoek
pluralLabels:
  en: Maintenance requests
  nl: Onderhoudsverzoeken
domains:
  - maintenance
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique maintenance request code.
      nl: Tenant-unieke code van het onderhoudsverzoek.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: title
    osfType: string
    required: true
    label:
      en: Title
      nl: Titel
    description:
      en: Short title describing the maintenance request.
      nl: Korte titel die het onderhoudsverzoek omschrijft.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: title
      storageClass: core
  - key: description
    osfType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Detailed description of the issue or request.
      nl: Uitgebreide omschrijving van het probleem of verzoek.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
  - key: priority
    required: false
    label:
      en: Priority
      nl: Prioriteit
    description:
      en: Priority level of the maintenance request.
      nl: Prioriteitsniveau van het onderhoudsverzoek.
    persisted:
      column: priority
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: MAINTENANCEPRIORITY
    osfType: referenceDataCode
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the maintenance request.
      nl: Levenscyclusstatus van het onderhoudsverzoek.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: MAINTENANCEREQUESTSTATUS
    osfType: referenceDataCode
  - key: reportedAt
    osfType: datetime
    required: true
    label:
      en: Reported at
      nl: Gemeld op
    description:
      en: Timestamp when the maintenance request was reported.
      nl: Tijdstip waarop het onderhoudsverzoek is gemeld.
    persisted:
      column: reported_at
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the maintenance request in an external context.
      nl: Functionele of zakelijke code van het onderhoudsverzoek in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  # System-written attribution: the reporting user, not an input.
  - key: reportedById
    readOnly: true
    label:
      en: Reported by
      nl: Gemeld door
    persisted:
      column: reported_by_relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  - key: assetId
    label:
      en: Asset
      nl: Object
    persisted:
      column: asset_reference
      storageClass: core
    osfType: Asset
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Maintenance.All.Read
      - Maintenance.All.ReadWrite
    create:
      - Maintenance.All.ReadWrite
    update:
      - Maintenance.All.ReadWrite
    delete:
      - Maintenance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Maintenance Request
    description: List MaintenanceRequest records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Maintenance Request
    description: Get MaintenanceRequest records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Maintenance Request
    description: Create MaintenanceRequest records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update MaintenanceRequest records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /maintenance-requests
          nl: /onderhoudsverzoeken
        columns:
          - key: code
            sortable: true
          - key: title
            sortable: true
          - key: status
            sortable: true
          - key: priority
            sortable: true
          - key: reportedAt
            sortable: true
        title:
          en: Maintenance requests
          nl: Onderhoudsverzoeken
        defaultSort:
          key: reportedAt
          direction: desc
      record:
        routes:
          read:
            en: /maintenance-requests/:id
            nl: /onderhoudsverzoeken/:id
          create:
            en: /maintenance-requests/create
            nl: /onderhoudsverzoeken/aanmaken
        title: "{{code}} {{title}}"
        subtitle: "{{status}}"
        badges:
          - priority
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Request details
                    nl: Verzoekgegevens
                  fields:
                    - code
                    - title
                    - priority
                    - status
                    - reportedAt
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create maintenance request
              nl: Onderhoudsverzoek aanmaken
            groups:
              - title:
                  en: Request details
                  nl: Verzoekgegevens
                fields:
                  - code
                  - title
                  - priority
                  - status
                  - reportedAt
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit maintenance request
              nl: Onderhoudsverzoek bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
            variableTokens: true
      priority:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: MAINTENANCEPRIORITY
            clearable: true
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: MAINTENANCEREQUESTSTATUS
            clearable: false
      reportedAt:
        render:
          component: DateTimePicker
          props: {}
