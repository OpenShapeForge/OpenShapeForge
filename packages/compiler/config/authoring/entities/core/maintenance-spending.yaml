schemaVersion: 3
kind: coreEntity
module: core
entity: MaintenanceSpending
title: Maintenance Spending
description: Actual cost recorded against a maintenance order, posted to a ledger account and optional cost dimension.
language: en
displayTemplate: "{{description}}: {{amount}}"
filterField: description
labels:
  en: Maintenance spending
  nl: Onderhoudsbesteding
pluralLabels:
  en: Maintenance spendings
  nl: Onderhoudsbestedingen
domains:
  - maintenance
fields:
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Description of the spending entry.
      nl: Omschrijving van de bestedingsregel.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: spentAt
    osfType: date
    required: true
    label:
      en: Spent at
      nl: Besteed op
    description:
      en: Date on which the cost was incurred.
      nl: Datum waarop de kosten zijn gemaakt.
    persisted:
      column: spent_at
      storageClass: core
  - key: amount
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Spent amount.
      nl: Besteed bedrag.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: invoiceReference
    osfType: string
    required: false
    label:
      en: Invoice reference
      nl: Factuurreferentie
    description:
      en: Free-form reference to the originating purchase invoice (number or external id).
      nl: Vrije referentie naar de oorspronkelijke inkoopfactuur (nummer of externe id).
    validation:
      maxLength: 100
    persisted:
      column: invoice_reference
      storageClass: core
  - key: maintenanceOrderId
    label:
      en: Maintenance order
      nl: Onderhoudsorder
    persisted:
      column: maintenance_order_id
      storageClass: core
    osfType: MaintenanceOrder
    relationship:
      ownership: reference
  - key: ledgerAccountId
    label:
      en: Ledger account
      nl: Grootboekrekening
    persisted:
      column: ledger_account_id
      storageClass: core
    osfType: LedgerAccount
    relationship:
      ownership: reference
  - key: costDimensionId
    label:
      en: Cost dimension
      nl: Kostendimensie
    persisted:
      column: cost_dimension_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Maintenance.All.Read
      - Maintenance.All.ReadWrite
    create:
      - Maintenance.All.ReadWrite
    update:
      - Maintenance.All.ReadWrite
    delete:
      - Maintenance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Maintenance Spending
    description: List MaintenanceSpending records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Maintenance Spending
    description: Get MaintenanceSpending records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Maintenance Spending
    description: Create MaintenanceSpending records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update MaintenanceSpending records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /maintenance-spendings
          nl: /onderhoudsbestedingen
        columns:
          - key: description
            sortable: true
          - key: spentAt
            sortable: true
          - key: amount
            sortable: true
        title:
          en: Maintenance spending
          nl: Onderhoudsbestedingen
        defaultSort:
          key: spentAt
          direction: desc
      record:
        routes:
          read:
            en: /maintenance-spendings/:id
            nl: /onderhoudsbestedingen/:id
          create:
            en: /maintenance-spendings/create
            nl: /onderhoudsbestedingen/aanmaken
        title: "{{description}}"
        subtitle: "{{amount}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Spending details
                    nl: Bestedingsgegevens
                  fields:
                    - description
                    - spentAt
                    - amount
                    - invoiceReference
        modes:
          create:
            title:
              en: Create maintenance spending
              nl: Onderhoudsbesteding aanmaken
            groups:
              - title:
                  en: Spending details
                  nl: Bestedingsgegevens
                fields:
                  - description
                  - spentAt
                  - amount
                  - invoiceReference
          update:
            title:
              en: Edit maintenance spending
              nl: Onderhoudsbesteding bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 500
      spentAt:
        render:
          component: DatePicker
          props: {}
