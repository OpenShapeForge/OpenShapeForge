                  - unitId
                  - unitPrice
                  - amount
          update:
            title:
              en: Edit maintenance task calculation
              nl: Onderhoudstaak voorcalculatie bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 500
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
