schemaVersion: 3
kind: coreEntity
module: core
entity: MaintenanceTaskCalculation
title: Maintenance Task Calculation
description: Pre-execution cost estimate for a maintenance task, optionally referencing a standard price.
language: en
displayTemplate: "{{description}}"
filterField: description
labels:
  en: Maintenance task calculation
  nl: Onderhoudstaak voorcalculatie
domains:
  - maintenance
fields:
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Description of the calculation line.
      nl: Omschrijving van de calculatieregel.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: quantity
    osfType: number
    required: false
    label:
      en: Quantity
      nl: Aantal
    description:
      en: Quantity for this calculation line.
      nl: Aantal voor deze calculatieregel.
    persisted:
      column: quantity
      storageClass: core
  - key: unitId
    osfType: string
    required: false
    label:
      en: Unit
      nl: Eenheid
    description:
      en: Free-form unit identifier (e.g. "Hour", "Piece").
      nl: Vrije eenheidsaanduiding (bv. "Uur", "Stuk").
    validation:
      maxLength: 50
    persisted:
      column: unit_id
      storageClass: core
  - key: unitPrice
    required: false
    label:
      en: Unit price
      nl: Eenheidsprijs
    description:
      en: Price per unit for this calculation line.
      nl: Prijs per eenheid voor deze calculatieregel.
    osfType: currency
    persisted:
      column: unit_price
      storageClass: core
  - key: amount
    required: false
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Total amount for this calculation line.
      nl: Totaalbedrag voor deze calculatieregel.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: maintenanceTaskId
    label:
      en: Maintenance task
      nl: Onderhoudstaak
    persisted:
      column: maintenance_task_id
      storageClass: core
    osfType: MaintenanceTask
    relationship:
      ownership: reference
  - key: standardPriceId
    label:
      en: Standard price
      nl: Standaardprijs
    persisted:
      column: standard_price_id
      storageClass: core
    osfType: StandardPrice
    relationship:
      ownership: reference
authorization:
