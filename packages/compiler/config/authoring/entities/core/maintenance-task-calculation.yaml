  graphql: {}
  web:
    views:
      collection:
        route:
          en: /maintenance-task-calculations
          nl: /onderhoudstaak-voorcalculaties
        columns:
          - key: description
            sortable: true
          - key: quantity
            sortable: true
          - key: unitPrice
            sortable: true
          - key: amount
            sortable: true
        title:
          en: Maintenance task calculations
          nl: Onderhoudstaak voorcalculaties
        defaultSort:
          key: description
          direction: asc
      record:
        routes:
          read:
            en: /maintenance-task-calculations/:id
            nl: /onderhoudstaak-voorcalculaties/:id
