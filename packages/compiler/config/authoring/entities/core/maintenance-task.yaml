schemaVersion: 3
kind: coreEntity
module: core
entity: MaintenanceTask
title: Maintenance Task
description: Line item on a maintenance order representing a single task to be performed.
language: en
displayTemplate: "{{description}}"
filterField: description
labels:
  en: Maintenance task
  nl: Onderhoudstaak
domains:
  - maintenance
fields:
  - key: lineNumber
    osfType: integer
    required: true
    label:
      en: Line number
      nl: Regelnummer
    description:
      en: Sequential line number within the maintenance order.
      nl: Volgnummer van de regel binnen de onderhoudsorder.
    validation:
      min: 1
    persisted:
      column: line_number
      storageClass: core
  - key: description
    required: true
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Description of the task to be performed.
      nl: Omschrijving van de uit te voeren taak.
    validation:
      minLength: 1
      maxLength: 500
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the maintenance task.
      nl: Levenscyclusstatus van de onderhoudstaak.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: MAINTENANCETASKSTATUS
    osfType: referenceDataCode
  - key: quantity
    osfType: number
    required: false
    label:
      en: Quantity
      nl: Aantal
    description:
      en: Quantity for this task (multiplied by unit price to compute amount).
      nl: Aantal voor deze taak (vermenigvuldigd met eenheidsprijs voor bedrag).
    persisted:
      column: quantity
      storageClass: core
  - key: unitId
    osfType: string
    required: false
    label:
      en: Unit
      nl: Eenheid
    description:
      en: Free-form unit identifier for this task (e.g. "Hour", "Piece").
      nl: Vrije eenheidsaanduiding voor deze taak (bv. "Uur", "Stuk").
    validation:
      maxLength: 50
    persisted:
      column: unit_id
      storageClass: core
  - key: unitPrice
    required: false
    label:
      en: Unit price
      nl: Eenheidsprijs
    description:
      en: Price per unit for this task.
      nl: Prijs per eenheid voor deze taak.
    osfType: currency
    persisted:
      column: unit_price
      storageClass: core
  - key: amount
    required: false
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Total amount for this task.
      nl: Totaalbedrag voor deze taak.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: maintenanceOrderId
    label:
      en: Maintenance order
      nl: Onderhoudsorder
    persisted:
      column: maintenance_order_id
      storageClass: core
    osfType: MaintenanceOrder
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Maintenance.All.Read
      - Maintenance.All.ReadWrite
    create:
      - Maintenance.All.ReadWrite
    update:
      - Maintenance.All.ReadWrite
    delete:
      - Maintenance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Maintenance Task
    description: List MaintenanceTask records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Maintenance Task
    description: Get MaintenanceTask records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Maintenance Task
    description: Create MaintenanceTask records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update MaintenanceTask records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /maintenance-tasks
          nl: /onderhoudstaken
        columns:
          - key: lineNumber
            sortable: true
          - key: description
            sortable: true
          - key: status
            sortable: true
          - key: quantity
            sortable: true
          - key: amount
            sortable: true
        title:
          en: Maintenance tasks
          nl: Onderhoudstaken
        defaultSort:
          key: lineNumber
          direction: asc
      record:
        routes:
          read:
            en: /maintenance-tasks/:id
            nl: /onderhoudstaken/:id
          create:
            en: /maintenance-tasks/create
            nl: /onderhoudstaken/aanmaken
        title: "{{description}}"
        subtitle: "{{status}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Task details
                    nl: Taakgegevens
                  fields:
                    - lineNumber
                    - description
                    - status
                - title:
                    en: Amounts
                    nl: Bedragen
                  fields:
                    - quantity
                    - unitId
                    - unitPrice
                    - amount
        modes:
          create:
            title:
              en: Create maintenance task
              nl: Onderhoudstaak aanmaken
            groups:
              - title:
                  en: Task details
                  nl: Taakgegevens
                fields:
                  - lineNumber
                  - description
                  - status
              - title:
                  en: Amounts
                  nl: Bedragen
                fields:
                  - quantity
                  - unitId
                  - unitPrice
                  - amount
          update:
            title:
              en: Edit maintenance task
              nl: Onderhoudstaak bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 500
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: MAINTENANCETASKSTATUS
            clearable: false
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
