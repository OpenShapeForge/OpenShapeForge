schemaVersion: 3
kind: coreEntity
module: core
entity: Milestone
title: Milestone
description: A deadline-bearing milestone within a case lifecycle.
language: en
displayTemplate: "{{name}}"
filterField: name
labels:
  en: Milestone
  nl: Mijlpaal
pluralLabels:
  en: Milestones
  nl: Mijlpalen
domains:
  - cases
  - service
authorization:
  roles:
    read:
      - Cases.All.Read
      - Cases.All.ReadWrite
    create:
      - Cases.All.ReadWrite
    update:
      - Cases.All.ReadWrite
    delete:
      - Cases.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: milestoneType
    required: true
    label:
      en: Milestone type
      nl: Mijlpaaltype
    persisted:
      column: milestone_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: MILESTONETYPE
    osfType: referenceDataCode
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: MILESTONESTATUS
    osfType: referenceDataCode
  - key: startedAt
    osfType: datetime
    required: false
    label:
      en: Started at
      nl: Gestart op
    persisted:
      column: started_at
      storageClass: core
  - key: dueAt
    osfType: datetime
    required: false
    label:
      en: Due at
      nl: Uiterlijk op
    persisted:
      column: due_at
      storageClass: core
  - key: pausedAt
    osfType: datetime
    required: false
    label:
      en: Paused at
      nl: Gepauzeerd op
    persisted:
      column: paused_at
      storageClass: core
  - key: completedAt
    osfType: datetime
    required: false
    label:
      en: Completed at
      nl: Afgerond op
    persisted:
      column: completed_at
      storageClass: core
  - key: breachedAt
    osfType: datetime
    required: false
    label:
      en: Breached at
      nl: Overschreden op
    persisted:
      column: breached_at
      storageClass: core
  - key: pauseReason
    osfType: string
    required: false
    label:
      en: Pause reason
      nl: Pauzereden
    validation:
      maxLength: 300
    persisted:
      column: pause_reason
      storageClass: core
  - key: note
    required: false
    label:
      en: Note
      nl: Notitie
    validation:
      maxLength: 2000
    persisted:
      column: note
      storageClass: core
    osfType: multilineText
  - key: caseId
    label:
      en: Case
      nl: Zaak
    persisted:
      column: case_id
      storageClass: core
    osfType: Case
    relationship:
      ownership: reference
      inverse:
        label:
          en: Milestones
          nl: Mijlpalen
  - key: slaPolicyId
    label:
      en: SLA policy
      nl: SLA-beleid
    persisted:
      column: sla_policy_id
      storageClass: core
    osfType: SlaPolicy
    relationship:
      ownership: reference
      inverse:
        label:
          en: Milestones
          nl: Mijlpalen
  - key: ownerId
    label:
      en: Owner
      nl: Eigenaar
    persisted:
      column: owner_account_id
      storageClass: core
    osfType: Account
    relationship:
      ownership: reference
operations:
  list:
    name: List Milestone
    description: List Milestone records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Milestone
    description: Get Milestone records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Milestone
    description: Create Milestone records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Milestone
    description: Update Milestone records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Milestone
    description: Delete Milestone records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    fields:
      milestoneType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: MILESTONETYPE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: MILESTONESTATUS
            clearable: false
      startedAt:
        render:
          component: DateTimePicker
          props: {}
      dueAt:
        render:
          component: DateTimePicker
          props: {}
      pausedAt:
        render:
          component: DateTimePicker
          props: {}
      completedAt:
        render:
          component: DateTimePicker
          props: {}
      breachedAt:
        render:
          component: DateTimePicker
          props: {}
      note:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 2000
