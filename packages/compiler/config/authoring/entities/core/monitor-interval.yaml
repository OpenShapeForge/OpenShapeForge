schemaVersion: 3
kind: coreEntity
module: core
entity: MonitorInterval
title: Monitor Interval
description: Catalogued sampling interval used by monitor measurements (e.g. "every 15 minutes").
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Monitor interval
  nl: Monitorinterval
pluralLabels:
  en: Monitor intervals
  nl: Monitorintervallen
domains:
  - energy
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique monitor interval code.
      nl: Tenant-unieke code van het monitorinterval.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: intervalSeconds
    osfType: integer
    required: true
    label:
      en: Interval (seconds)
      nl: Interval (seconden)
    description:
      en: Sampling interval expressed in seconds.
      nl: Bemonsteringsinterval uitgedrukt in seconden.
    validation:
      min: 1
    persisted:
      column: interval_seconds
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description of the monitor interval.
      nl: Optionele omschrijving van het monitorinterval.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
authorization:
  roles:
    read:
      - Energy.All.Read
      - Energy.All.ReadWrite
    create:
      - Energy.All.ReadWrite
    update:
      - Energy.All.ReadWrite
    delete:
      - Energy.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Monitor Interval
    description: List MonitorInterval records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Monitor Interval
    description: Get MonitorInterval records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Monitor Interval
    description: Create MonitorInterval records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update MonitorInterval records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /monitor-intervals
          nl: /monitorintervallen
        columns:
          - key: code
            sortable: true
          - key: intervalSeconds
            sortable: true
        title:
          en: Monitor intervals
          nl: Monitorintervallen
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /monitor-intervals/:id
            nl: /monitorintervallen/:id
          create:
            en: /monitor-intervals/create
            nl: /monitorintervallen/aanmaken
        title: "{{code}}"
        subtitle: "{{intervalSeconds}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Interval details
                    nl: Intervalgegevens
                  fields:
                    - code
                    - intervalSeconds
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
        modes:
          create:
            title:
              en: Create monitor interval
              nl: Monitorinterval aanmaken
            groups:
              - title:
                  en: Interval details
                  nl: Intervalgegevens
                fields:
                  - code
                  - intervalSeconds
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
          update:
            title:
              en: Edit monitor interval
              nl: Monitorinterval bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 500
