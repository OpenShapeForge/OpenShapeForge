schemaVersion: 3
kind: coreEntity
module: core
entity: MonitorLogEntry
title: Monitor Log Entry
description: Individual log line within a monitor log session.
language: en
displayTemplate: "{{loggedAt}}: {{message}}"
filterField: message
labels:
  en: Monitor log entry
  nl: Monitorlogregel
domains:
  - energy
fields:
  - key: loggedAt
    osfType: datetime
    required: true
    label:
      en: Logged at
      nl: Gelogd op
    description:
      en: Timestamp when the log entry was recorded.
      nl: Tijdstip waarop de logregel is vastgelegd.
    persisted:
      column: logged_at
      storageClass: core
  - key: level
    osfType: string
    required: false
    label:
      en: Level
      nl: Niveau
    description:
      en: Log level (e.g. info, warning, error).
      nl: Logniveau (bv. info, warning, error).
    validation:
      maxLength: 50
    persisted:
      column: level
      storageClass: core
  - key: message
    required: true
    label:
      en: Message
      nl: Bericht
    description:
      en: Log message content.
      nl: Inhoud van de logregel.
    validation:
      minLength: 1
      maxLength: 1000
    persisted:
      column: message
      storageClass: core
    osfType: multilineText
  - key: monitorLogId
    label:
      en: Monitor log
      nl: Monitorlog
    persisted:
      column: monitor_log_id
      storageClass: core
    osfType: MonitorLog
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Energy.All.Read
      - Energy.All.ReadWrite
    create:
      - Energy.All.ReadWrite
    update:
      - Energy.All.ReadWrite
    delete:
      - Energy.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Monitor Log Entry
    description: List MonitorLogEntry records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Monitor Log Entry
    description: Get MonitorLogEntry records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Monitor Log Entry
    description: Create MonitorLogEntry records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update MonitorLogEntry records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /monitor-log-entries
          nl: /monitorlogregels
        columns:
          - key: loggedAt
            sortable: true
          - key: level
            sortable: true
          - key: message
            sortable: true
        title:
          en: Monitor log entries
          nl: Monitorlogregels
        defaultSort:
          key: loggedAt
          direction: desc
      record:
        routes:
          read:
            en: /monitor-log-entries/:id
            nl: /monitorlogregels/:id
          create:
            en: /monitor-log-entries/create
            nl: /monitorlogregels/aanmaken
        title: "{{loggedAt}}"
        subtitle: "{{level}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Entry details
                    nl: Regelgegevens
                  fields:
                    - loggedAt
                    - level
                    - message
        modes:
          create:
            title:
              en: Create monitor log entry
              nl: Monitorlogregel aanmaken
            groups:
              - title:
                  en: Entry details
                  nl: Regelgegevens
                fields:
                  - loggedAt
                  - level
                  - message
          update:
            title:
              en: Edit monitor log entry
              nl: Monitorlogregel bewerken
    fields:
      loggedAt:
        render:
          component: DateTimePicker
          props: {}
      message:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 1000
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
