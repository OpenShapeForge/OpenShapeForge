schemaVersion: 3
kind: coreEntity
module: core
entity: MonitorLog
title: Monitor Log
description: Logging session associated with an asset, capturing measurements and entries during a time window.
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Monitor log
  nl: Monitorlog
pluralLabels:
  en: Monitor logs
  nl: Monitorlogs
domains:
  - energy
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique monitor log code.
      nl: Tenant-unieke code van het monitorlog.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the monitor log.
      nl: Levenscyclusstatus van het monitorlog.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: MONITORLOGSTATUS
    osfType: referenceDataCode
  - key: startedAt
    osfType: datetime
    required: true
    label:
      en: Started at
      nl: Gestart op
    description:
      en: Timestamp when the log started.
      nl: Tijdstip waarop het log is gestart.
    persisted:
      column: started_at
      storageClass: core
  - key: endedAt
    osfType: datetime
    required: false
    label:
      en: Ended at
      nl: Geëindigd op
    description:
      en: Timestamp when the log ended.
      nl: Tijdstip waarop het log is geëindigd.
    persisted:
      column: ended_at
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the monitor log in an external context.
      nl: Functionele of zakelijke code van het monitorlog in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: assetId
    label:
      en: Asset
      nl: Object
    persisted:
      column: asset_reference
      storageClass: core
    osfType: Asset
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Energy.All.Read
      - Energy.All.ReadWrite
    create:
      - Energy.All.ReadWrite
    update:
      - Energy.All.ReadWrite
    delete:
      - Energy.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Monitor Log
    description: List MonitorLog records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Monitor Log
    description: Get MonitorLog records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Monitor Log
    description: Create MonitorLog records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update MonitorLog records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /monitor-logs
          nl: /monitorlogs
        columns:
          - key: code
            sortable: true
          - key: status
            sortable: true
          - key: startedAt
            sortable: true
          - key: endedAt
            sortable: true
        title:
          en: Monitor logs
          nl: Monitorlogs
        defaultSort:
          key: startedAt
          direction: desc
      record:
        routes:
          read:
            en: /monitor-logs/:id
            nl: /monitorlogs/:id
          create:
            en: /monitor-logs/create
            nl: /monitorlogs/aanmaken
        title: "{{code}}"
        subtitle: "{{status}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Log details
                    nl: Loggegevens
                  fields:
                    - code
                    - status
                    - startedAt
                    - endedAt
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create monitor log
              nl: Monitorlog aanmaken
            groups:
              - title:
                  en: Log details
                  nl: Loggegevens
                fields:
                  - code
                  - status
                  - startedAt
                  - endedAt
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit monitor log
              nl: Monitorlog bewerken
    fields:
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: MONITORLOGSTATUS
            clearable: false
      startedAt:
        render:
          component: DateTimePicker
          props: {}
      endedAt:
        render:
          component: DateTimePicker
          props: {}
