schemaVersion: 3
kind: coreEntity
module: core
entity: MonitorMeasurement
title: Monitor Measurement
description: Sampled measurement captured by a monitor, optionally tied to an interval and a log.
language: en
displayTemplate: "{{measuredAt}}"
filterField: id
labels:
  en: Monitor measurement
  nl: Monitormeting
pluralLabels:
  en: Monitor measurements
  nl: Monitormetingen
domains:
  - energy
fields:
  - key: measuredAt
    osfType: datetime
    required: true
    label:
      en: Measured at
      nl: Gemeten op
    description:
      en: Timestamp when the measurement was taken.
      nl: Tijdstip waarop de meting is uitgevoerd.
    persisted:
      column: measured_at
      storageClass: core
  - key: value
    osfType: number
    required: true
    label:
      en: Value
      nl: Waarde
    description:
      en: Measured value.
      nl: Gemeten waarde.
    persisted:
      column: value
      storageClass: core
  - key: unitId
    osfType: string
    required: false
    label:
      en: Unit
      nl: Eenheid
    description:
      en: Free-form unit identifier (e.g. "kWh", "m3").
      nl: Vrije eenheidsaanduiding (bv. "kWh", "m3").
    validation:
      maxLength: 50
    persisted:
      column: unit_id
      storageClass: core
  - key: monitorIntervalId
    label:
      en: Monitor interval
      nl: Monitorinterval
    persisted:
      column: monitor_interval_id
      storageClass: core
    osfType: MonitorInterval
    relationship:
      ownership: reference
  - key: monitorLogId
    label:
      en: Monitor log
      nl: Monitorlog
    persisted:
      column: monitor_log_id
      storageClass: core
    osfType: MonitorLog
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Energy.All.Read
      - Energy.All.ReadWrite
    create:
      - Energy.All.ReadWrite
    update:
      - Energy.All.ReadWrite
    delete:
      - Energy.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Monitor Measurement
    description: List MonitorMeasurement records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Monitor Measurement
    description: Get MonitorMeasurement records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Monitor Measurement
    description: Create MonitorMeasurement records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update MonitorMeasurement records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /monitor-measurements
          nl: /monitormetingen
        columns:
          - key: measuredAt
            sortable: true
          - key: value
            sortable: true
          - key: unitId
            sortable: true
        title:
          en: Monitor measurements
          nl: Monitormetingen
        defaultSort:
          key: measuredAt
          direction: desc
      record:
        routes:
          read:
            en: /monitor-measurements/:id
            nl: /monitormetingen/:id
          create:
            en: /monitor-measurements/create
            nl: /monitormetingen/aanmaken
        title: "{{measuredAt}}"
        subtitle: "{{value}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Measurement details
                    nl: Metinggegevens
                  fields:
                    - measuredAt
                    - value
                    - unitId
        modes:
          create:
            title:
              en: Create monitor measurement
              nl: Monitormeting aanmaken
            groups:
              - title:
                  en: Measurement details
                  nl: Metinggegevens
                fields:
                  - measuredAt
                  - value
                  - unitId
          update:
            title:
              en: Edit monitor measurement
              nl: Monitormeting bewerken
    fields:
      measuredAt:
        render:
          component: DateTimePicker
          props: {}
