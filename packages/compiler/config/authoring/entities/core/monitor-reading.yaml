schemaVersion: 3
kind: coreEntity
module: core
entity: MonitorReading
title: Monitor Reading
description: Individual reading derived from a monitor measurement.
language: en
displayTemplate: "{{readAt}}: {{value}}"
filterField: id
labels:
  en: Monitor reading
  nl: Monitorwaarde
domains:
  - energy
fields:
  - key: readAt
    osfType: datetime
    required: true
    label:
      en: Read at
      nl: Gelezen op
    description:
      en: Timestamp when the reading was taken.
      nl: Tijdstip waarop de waarde is gelezen.
    persisted:
      column: read_at
      storageClass: core
  - key: value
    osfType: number
    required: true
    label:
      en: Value
      nl: Waarde
    description:
      en: Read value.
      nl: Gelezen waarde.
    persisted:
      column: value
      storageClass: core
  - key: unitId
    osfType: string
    required: false
    label:
      en: Unit
      nl: Eenheid
    description:
      en: Free-form unit identifier (e.g. "kWh", "m3").
      nl: Vrije eenheidsaanduiding (bv. "kWh", "m3").
    validation:
      maxLength: 50
    persisted:
      column: unit_id
      storageClass: core
  - key: monitorMeasurementId
    label:
      en: Monitor measurement
      nl: Monitormeting
    persisted:
      column: monitor_measurement_id
      storageClass: core
    osfType: MonitorMeasurement
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Energy.All.Read
      - Energy.All.ReadWrite
    create:
      - Energy.All.ReadWrite
    update:
      - Energy.All.ReadWrite
    delete:
      - Energy.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Monitor Reading
    description: List MonitorReading records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Monitor Reading
    description: Get MonitorReading records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Monitor Reading
    description: Create MonitorReading records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update MonitorReading records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /monitor-readings
          nl: /monitorwaarden
        columns:
          - key: readAt
            sortable: true
          - key: value
            sortable: true
          - key: unitId
            sortable: true
        title:
          en: Monitor readings
          nl: Monitorwaarden
        defaultSort:
          key: readAt
          direction: desc
      record:
        routes:
          read:
            en: /monitor-readings/:id
            nl: /monitorwaarden/:id
          create:
            en: /monitor-readings/create
            nl: /monitorwaarden/aanmaken
        title: "{{readAt}}"
        subtitle: "{{value}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Reading details
                    nl: Waardegegevens
                  fields:
                    - readAt
                    - value
                    - unitId
        modes:
          create:
            title:
              en: Create monitor reading
              nl: Monitorwaarde aanmaken
            groups:
              - title:
                  en: Reading details
                  nl: Waardegegevens
                fields:
                  - readAt
                  - value
                  - unitId
          update:
            title:
              en: Edit monitor reading
              nl: Monitorwaarde bewerken
    fields:
      readAt:
        render:
          component: DateTimePicker
          props: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
