schemaVersion: 3
kind: coreEntity
module: core
entity: OrgUnit
title: Organizational Unit
description: A unit in the organizational structure (department, team, division). Self-referential parent supports a hierarchy.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Org unit
  nl: Organisatorische eenheid
pluralLabels:
  en: Org units
  nl: Organisatorische eenheden
domains:
  - hr
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique code identifying the org unit.
      nl: Tenant-unieke code voor de organisatorische eenheid.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Display name of the org unit.
      nl: Weergavenaam van de organisatorische eenheid.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description of the org unit.
      nl: Optionele omschrijving van de organisatorische eenheid.
    validation:
      maxLength: 1000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: establishedAt
    osfType: date
    required: false
    label:
      en: Established at
      nl: Opgericht op
    description:
      en: Date on which the org unit was established.
      nl: Datum waarop de organisatorische eenheid is opgericht.
    persisted:
      column: established_at
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the org unit in an external context.
      nl: Functionele of zakelijke code van de organisatorische eenheid in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: parentOrgUnitId
    label:
      en: Parent org unit
      nl: Bovenliggende eenheid
    persisted:
      column: parent_org_unit_id
      storageClass: core
    osfType: OrgUnit
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Organization.All.Read
      - Organization.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Organizational Unit
    description: List OrgUnit records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Organizational Unit
    description: Get OrgUnit records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Organizational Unit
    description: Create OrgUnit records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update OrgUnit records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /org-units
          nl: /organisatorische-eenheden
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: establishedAt
            sortable: true
        title:
          en: Org units
          nl: Organisatorische eenheden
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /org-units/:id
            nl: /organisatorische-eenheden/:id
          create:
            en: /org-units/create
            nl: /organisatorische-eenheden/aanmaken
        title: "{{code}} {{name}}"
        subtitle: "{{description}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Unit details
                    nl: Eenheidgegevens
                  fields:
                    - code
                    - name
                    - establishedAt
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create org unit
              nl: Organisatorische eenheid aanmaken
            groups:
              - title:
                  en: Unit details
                  nl: Eenheidgegevens
                fields:
                  - code
                  - name
                  - establishedAt
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit org unit
              nl: Organisatorische eenheid bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 1000
      establishedAt:
        render:
          component: DatePicker
          props: {}
