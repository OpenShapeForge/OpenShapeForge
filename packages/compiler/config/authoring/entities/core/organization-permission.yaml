schemaVersion: 3
kind: coreEntity
module: core
entity: OrganizationPermission
title: Organization Permission
description: Explicit permission configured for a tenant root or organizational unit scope.
language: en
displayTemplate: "{{clientId}} {{permissionName}}"
filterField: permissionName
labels:
  en: Organization permission
  nl: Organisatierecht
pluralLabels:
  en: Organization permissions
  nl: Organisatierechten
domains:
  - core
  - hr
authorization:
  roles:
    read:
      - Organization.All.Read
      - Organization.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: targetScopeKind
    osfType: string
    required: true
    label:
      en: Target scope kind
      nl: Type doelscope
    description:
      en: Scope kind targeted by this permission, either tenant or org_unit.
      nl: Type scope waarop dit recht van toepassing is, tenant of org_unit.
    defaultValue: org_unit
    validation:
      maxLength: 50
    persisted:
      column: target_scope_kind
      storageClass: core
  - key: clientId
    osfType: string
    required: true
    label:
      en: Client ID
      nl: Client-id
    description:
      en: Keycloak client that owns the permission role.
      nl: Keycloak-client die de permissierol bezit.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: client_id
      storageClass: core
  - key: permissionName
    osfType: string
    required: true
    label:
      en: Permission name
      nl: Permissienaam
    description:
      en: Name of the permission role within the client.
      nl: Naam van de permissierol binnen de client.
    validation:
      minLength: 1
      maxLength: 300
    persisted:
      column: permission_name
      storageClass: core
  - key: effect
    osfType: string
    required: true
    label:
      en: Effect
      nl: Effect
    description:
      en: Permission effect. The initial identity model supports allow.
      nl: Effect van het recht. Het initiële identiteitsmodel ondersteunt allow.
    defaultValue: allow
    validation:
      maxLength: 50
    persisted:
      column: effect
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional code of the permission configuration in the source system.
      nl: Functionele code van de permissieconfiguratie in het bronsysteem.
    validation:
      maxLength: 200
    persisted:
      column: external_code
      storageClass: core
  - key: targetTenantId
    label:
      en: Target tenant
      nl: Doeltenant
    persisted:
      column: target_tenant_id
      storageClass: core
    osfType: Tenant
    relationship:
      ownership: reference
      inverse:
        label:
          en: Organization permissions
          nl: Organisatierechten
  - key: targetOrgUnitId
    label:
      en: Target org unit
      nl: Doeleenheid
    persisted:
      column: target_org_unit_id
      storageClass: core
    osfType: OrgUnit
    relationship:
      ownership: reference
      inverse:
        label:
          en: Organization permissions
          nl: Organisatierechten
operations:
  list:
    name: List Organization Permission
    description: List OrganizationPermission records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Organization Permission
    description: Get OrganizationPermission records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Organization Permission
    description: Create OrganizationPermission records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Organization Permission
    description: Update OrganizationPermission records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Organization Permission
    description: Delete OrganizationPermission records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /organization-permissions
          nl: /organisatierechten
        columns:
          - key: clientId
            sortable: true
          - key: permissionName
            sortable: true
          - key: targetScopeKind
            sortable: true
        title:
          en: Organization permissions
          nl: Organisatierechten
        defaultSort:
          key: permissionName
          direction: asc
      record:
        routes:
          read:
            en: /organization-permissions/:id
            nl: /organisatierechten/:id
          create:
            en: /organization-permissions/create
            nl: /organisatierechten/aanmaken
        title: "{{permissionName}}"
        subtitle: "{{clientId}}"
        badges:
          - effect
          - targetScopeKind
        actions: []
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Permission
                    nl: Recht
                  fields:
                    - targetScopeKind
                    - clientId
                    - permissionName
                    - effect
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
        modes:
          create:
            title:
              en: Create organization permission
              nl: Organisatierecht aanmaken
            groups:
              - title:
                  en: Permission
                  nl: Recht
                fields:
                  - targetScopeKind
                  - clientId
                  - permissionName
                  - effect
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
          update:
            title:
              en: Edit organization permission
              nl: Organisatierecht bewerken
            groups:
              - title:
                  en: Permission
                  nl: Recht
                fields:
                  - targetScopeKind
                  - clientId
                  - permissionName
                  - effect
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
