schemaVersion: 1
kind: coreEntity
module: core
entity: OrganizationPermission
title: Organization Permission
description: Explicit permission configured for a tenant root or organizational unit scope.
language: en
displayTemplate: "{{clientId}} {{permissionName}}"
filterField: permissionName
labels:
  en: Organization permission
  nl: Organisatierecht
domains:
  - core
  - hr
authorization:
  roles:
    read:
      - Organisatie.All.ReadWrite
    create:
      - Organisatie.All.ReadWrite
    update:
      - Organisatie.All.ReadWrite
    delete:
      - Organisatie.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: targetScopeKind
    valueType: string
    required: true
    label:
      en: Target scope kind
      nl: Type doelscope
    description:
      en: Scope kind targeted by this permission, either tenant or org_unit.
      nl: Type scope waarop dit recht van toepassing is, tenant of org_unit.
    defaultValue: org_unit
    validation:
      maxLength: 50
    persisted:
      column: target_scope_kind
      storageClass: core
  - key: clientId
    valueType: string
    required: true
    label:
      en: Client ID
      nl: Client-id
    description:
      en: Keycloak client that owns the permission role.
      nl: Keycloak-client die de permissierol bezit.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: client_id
      storageClass: core
  - key: permissionName
    valueType: string
    required: true
    label:
      en: Permission name
      nl: Permissienaam
    description:
      en: Name of the permission role within the client.
      nl: Naam van de permissierol binnen de client.
    validation:
      minLength: 1
      maxLength: 300
    persisted:
      column: permission_name
      storageClass: core
  - key: effect
    valueType: string
    required: true
    label:
      en: Effect
      nl: Effect
    description:
      en: Permission effect. The initial identity model supports allow.
      nl: Effect van het recht. Het initiële identiteitsmodel ondersteunt allow.
    defaultValue: allow
    validation:
      maxLength: 50
    persisted:
      column: effect
      storageClass: core
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional code of the permission configuration in the source system.
      nl: Functionele code van de permissieconfiguratie in het bronsysteem.
    validation:
      maxLength: 200
    persisted:
      column: external_code
      storageClass: core
relationships:
  - key: targetTenant
    kind: belongsTo
    target: Tenant
    foreignKey: target_tenant_id
    label:
      en: Target tenant
      nl: Doeltenant
  - key: targetOrgUnit
    kind: belongsTo
    target: OrgUnit
    foreignKey: target_org_unit_id
    label:
      en: Target org unit
      nl: Doeleenheid
ui:
  routes:
    list:
      en: /organization-permissions
      nl: /organisatierechten
    detail:
      en: /organization-permissions/:id
      nl: /organisatierechten/:id
    create:
      en: /organization-permissions/create
      nl: /organisatierechten/aanmaken
    edit:
      en: /organization-permissions/:id/edit
      nl: /organisatierechten/:id/bewerken
    delete:
      en: /organization-permissions/:id/delete
      nl: /organisatierechten/:id/verwijderen
  presentations:
    list:
      title:
        en: Organization permissions
        nl: Organisatierechten
      columns:
        - key: clientId
          sortable: true
        - key: permissionName
          sortable: true
        - key: targetScopeKind
          sortable: true
      defaultSort:
        key: permissionName
        direction: asc
      rowLink:
        en: /organization-permissions/:id
        nl: /organisatierechten/:id
    detail:
      header:
        title: "{{permissionName}}"
        subtitle: "{{clientId}}"
        badges:
          - effect
          - targetScopeKind
      groups:
        - id: overview
          label:
            en: Overview
            nl: Overzicht
          groups:
            - title:
                en: Permission
                nl: Recht
              fields:
                - targetScopeKind
                - clientId
                - permissionName
                - effect
            - title:
                en: Source
                nl: Herkomst
              fields:
                - externalId
                - externalCode
                - sourceAuthority
                - sourceOrganization
    form:
      variants:
        create:
          title:
            en: Create organization permission
            nl: Organisatierecht aanmaken
          groups:
            - title:
                en: Permission
                nl: Recht
              fields:
                - targetScopeKind
                - clientId
                - permissionName
                - effect
            - title:
                en: Source
                nl: Herkomst
              fields:
                - externalId
                - externalCode
                - sourceAuthority
                - sourceOrganization
        edit:
          title:
            en: Edit organization permission
            nl: Organisatierecht bewerken
          groups:
            - title:
                en: Permission
                nl: Recht
              fields:
                - targetScopeKind
                - clientId
                - permissionName
                - effect
            - title:
                en: Source
                nl: Herkomst
              fields:
                - externalId
                - externalCode
                - sourceAuthority
                - sourceOrganization
