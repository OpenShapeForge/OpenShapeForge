schemaVersion: 3
kind: coreEntity
module: core
entity: PaymentDetail
title: Payment Detail
description: Bank account or payment information associated with a relation.
language: en
displayTemplate: "{{iban}}"
filterField: iban
labels:
  en: Payment Detail
  nl: Betaalgegevens
domains:
  - relations
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
retention:
  mode: policyRef
  policy: payment-detail-retain-7y
  scope: record
  startsFrom:
    strategy: firstNonNull
    fields:
      - validUntil
      - validFrom
fields:
  - key: type
    valueType: string
    required: true
    label:
      en: Type
      nl: Type
    description:
      en: Type of payment detail (e.g. bank account, direct debit).
      nl: Type betaalgegevens (bijv. bankrekening, automatische incasso).
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PAYMENTDETAILTYPE
  - key: iban
    valueType: string
    required: false
    label:
      en: IBAN
      nl: IBAN
    description:
      en: International Bank Account Number.
      nl: Internationaal bankrekeningnummer (IBAN).
    semanticType: iban
    validation:
      maxLength: 34
    persisted:
      column: iban
      storageClass: core
    retention:
      mode: fieldOverride
      scope: field
      duration: P7Y
      startsFrom:
        strategy: firstNonNull
        fields:
          - validUntil
          - validFrom
      disposition:
        action: anonymize
  - key: bic
    valueType: string
    required: false
    label:
      en: BIC
      nl: BIC
    description:
      en: Bank Identifier Code (SWIFT/BIC).
      nl: Bank Identifier Code (SWIFT/BIC).
    validation:
      maxLength: 11
    persisted:
      column: bic
      storageClass: core
  - key: accountHolder
    valueType: string
    required: false
    label:
      en: Account holder
      nl: Rekeninghouder
    description:
      en: Name of the account holder.
      nl: Naam van de rekeninghouder.
    validation:
      maxLength: 200
    persisted:
      column: account_holder
      storageClass: core
  - key: status
    valueType: string
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of this payment detail.
      nl: Levenscyclusstatus van deze betaalgegevens.
    validation:
      maxLength: 50
    persisted:
      column: status
      storageClass: core
  - key: isPrimary
    valueType: boolean
    required: false
    label:
      en: Primary
      nl: Primair
    description:
      en: Whether this is the primary payment detail for the relation.
      nl: Of dit de primaire betaalmethode van de relatie is.
    persisted:
      column: is_primary
      storageClass: core
  - key: validFrom
    valueType: date
    required: false
    label:
      en: Valid from
      nl: Geldig vanaf
    description:
      en: Date from which this payment detail is valid.
      nl: Datum vanaf wanneer deze betaalgegevens geldig zijn.
    persisted:
      column: valid_from
      storageClass: core
  - key: validUntil
    valueType: date
    required: false
    label:
      en: Valid until
      nl: Geldig tot
    description:
      en: Date until which this payment detail is valid.
      nl: Datum tot wanneer deze betaalgegevens geldig zijn.
    persisted:
      column: valid_until
      storageClass: core
  - key: relationId
    required: false
    immutable: true
    label:
      en: Relation ID
      nl: Relatie ID
    description:
      en: Identifier of the related relation instance.
      nl: Identifier van de gerelateerde relatie-instantie.
    semanticType: Relation
    persisted:
      column: relation_id
      storageClass: core
    validation:
      format: uuid
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
operations:
  list:
    name: { en: List payment details, nl: Betaalgegevens tonen }
    description:
      en: Returns a filtered and sorted page of payment details.
      nl: Geeft een gefilterde en gesorteerde pagina met betaalgegevens terug.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  get:
    name: { en: Get payment detail, nl: Betaalgegeven ophalen }
    description:
      en: Returns one payment detail by its canonical id.
      nl: Geeft een betaalgegeven terug op basis van het canonieke id.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  create:
    name: { en: Create payment detail, nl: Betaalgegeven aanmaken }
    description:
      en: Creates one payment detail after validating its canonical fields.
      nl: Maakt een betaalgegeven aan na validatie van de canonieke velden.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    confirmation: { mode: none }
  update:
    name: { en: Update payment detail, nl: Betaalgegeven wijzigen }
    description:
      en: Updates one payment detail while holding its server-issued edit lease and current version.
      nl: Wijzigt een betaalgegeven met de server-uitgegeven bewerkingslease en actuele versie.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation: { mode: none }
  delete:
    name: { en: Delete payment detail, nl: Betaalgegeven verwijderen }
    description:
      en: Permanently deletes one payment detail after a server-issued, version-bound confirmation challenge.
      nl: Verwijdert een betaalgegeven definitief na een door de server uitgegeven, versiegebonden bevestigingsvraag.
    implementation: { type: entity, action: delete }
    effects: { data: delete, external: none }
    reliability:
      idempotency: { mode: natural }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation:
      mode: challenge
      challenge:
        kind: type-current-field
        field: type
        issuedBy: server
        bindTo: [ subject, tenant, operation, target.id, target.version ]
        expiresAfter: PT5M
        singleUse: true

interfaces:
  rest:
    operations:
      list: {}
      get: {}
      create: {}
      update: {}
      delete: {}
  mcp:
    operations:
      list: {}
      get: {}
      create: {}
      update:
        instructions:
          en: Acquire an edit lease first and submit its token with the version returned by get.
          nl: Vraag eerst een bewerkingslease aan en stuur het token mee met de versie uit get.
      delete:
        instructions:
          en: Acquire an edit lease first; request the confirmation challenge and answer it with the exact current payment-detail
            type.
          nl: Vraag eerst een bewerkingslease en bevestigingsvraag aan en beantwoord die met exact het actuele type betaalgegeven.
    resource:
      uri: app://payment-details
      name: Payment details
      description: Read the payment details available to the signed-in identity.
      templateDescription: Read one payment detail by its canonical id.
  web:
    operations:
      list: {}
      get: {}
      create: {}
      update: {}
      delete: {}
    views:
      collection:
        route: { en: /payment-details, nl: /betaalgegevens }
        title: { en: Payment details, nl: Betaalgegevens }
        columns:
          - { key: type, sortable: true }
          - { key: iban, sortable: true }
          - { key: accountHolder, sortable: true }
          - { key: status, sortable: true }
        defaultSort: { key: type, direction: asc }
      record:
        routes:
          read: { en: /payment-details/:id, nl: /betaalgegevens/:id }
          create: { en: /payment-details/new, nl: /betaalgegevens/nieuw }
        title: "{{iban}}"
        subtitle: "{{accountHolder}}"
        actions: [ update, delete ]
        layout:
          context:
            fields: [ type, status, isPrimary, validUntil ]
            relationships: [ relationId ]
          tabs:
            - id: overview
              label: { en: Overview, nl: Overzicht }
              groups:
                - title: { en: Payment information, nl: Betaalinformatie }
                  fields: [ type, iban, bic, accountHolder ]
                - title: { en: Usage and validity, nl: Gebruik en geldigheid }
                  fields: [ status, isPrimary, validFrom, validUntil ]
        modes:
          create:
            title: { en: Create payment detail, nl: Betaalgegeven aanmaken }
            groups:
              - title: { en: Payment information, nl: Betaalinformatie }
                fields: [ relationId, type, iban, bic, accountHolder, status, isPrimary, validFrom, validUntil ]
          update:
            title: { en: Update payment detail, nl: Betaalgegeven wijzigen }
