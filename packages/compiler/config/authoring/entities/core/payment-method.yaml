schemaVersion: 3
kind: coreEntity
module: core
entity: PaymentMethod
title: Payment Method
description: Catalog of payment methods (e.g. direct debit, e-mail, SMS, letter, acceptgiro).
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Payment method
  nl: Betaalwijze
pluralLabels:
  en: Payment methods
  nl: Betaalwijzen
domains:
  - finance
fields:
  - key: code
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique payment-method code (REF PAYMENTMETHODCODE).
      nl: Tenant-unieke betaalwijzecode (REF PAYMENTMETHODCODE).
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PAYMENTMETHODCODE
    osfType: referenceDataCode
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the payment method.
      nl: Menselijk leesbare naam van de betaalwijze.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: requiresIban
    osfType: boolean
    label:
      en: Requires IBAN
      nl: IBAN vereist
    description:
      en: Whether using this payment method requires an IBAN to be on file.
      nl: Of voor deze betaalwijze een IBAN beschikbaar moet zijn.
    defaultValue: false
    persisted:
      column: requires_iban
      storageClass: core
  - key: requiresMandate
    osfType: boolean
    label:
      en: Requires mandate
      nl: Machtiging vereist
    description:
      en: Whether using this payment method requires a SEPA direct-debit mandate.
      nl: Of voor deze betaalwijze een SEPA-incassomachtiging nodig is.
    defaultValue: false
    persisted:
      column: requires_mandate
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the payment method in an external context.
      nl: Functionele of zakelijke code van de betaalwijze in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Payment Method
    description: List PaymentMethod records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Payment Method
    description: Get PaymentMethod records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Payment Method
    description: Create PaymentMethod records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update PaymentMethod records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /payment-methods
          nl: /betaalwijzen
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: requiresIban
            sortable: true
          - key: requiresMandate
            sortable: true
        title:
          en: Payment methods
          nl: Betaalwijzen
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /payment-methods/:id
            nl: /betaalwijzen/:id
          create:
            en: /payment-methods/create
            nl: /betaalwijzen/aanmaken
        title: "{{name}}"
        subtitle: "{{code}}"
        badges:
          - code
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Payment method details
                    nl: Betaalwijzegegevens
                  fields:
                    - code
                    - name
                    - requiresIban
                    - requiresMandate
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create payment method
              nl: Betaalwijze aanmaken
            groups:
              - title:
                  en: Payment method details
                  nl: Betaalwijzegegevens
                fields:
                  - code
                  - name
                  - requiresIban
                  - requiresMandate
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit payment method
              nl: Betaalwijze bewerken
    fields:
      code:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PAYMENTMETHODCODE
            clearable: false
