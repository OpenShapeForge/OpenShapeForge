schemaVersion: 3
kind: coreEntity
module: core
entity: PaymentOrder
title: Payment Order
description: Outgoing payment instruction batch (e.g. SEPA pain.001 file or aggregated direct debit run) sent to a bank.
language: en
displayTemplate: "{{referenceNumber}}"
filterField: referenceNumber
labels:
  en: Payment order
  nl: Betaalopdracht
domains:
  - finance
fields:
  - key: referenceNumber
    osfType: string
    required: true
    label:
      en: Reference number
      nl: Referentienummer
    description:
      en: Unique reference number for this payment order, used in correspondence with the bank.
      nl: Uniek referentienummer voor deze betaalopdracht, gebruikt in correspondentie met de bank.
    persisted:
      column: reference_number
      storageClass: core
  - key: executionDate
    osfType: date
    required: true
    label:
      en: Execution date
      nl: Uitvoerdatum
    description:
      en: Target date on which the bank should execute the payment order.
      nl: Beoogde datum waarop de bank de betaalopdracht moet uitvoeren.
    persisted:
      column: execution_date
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the payment order.
      nl: Levenscyclusstatus van de betaalopdracht.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PAYMENTORDERSTATUS
    osfType: referenceDataCode
  - key: totalAmount
    required: false
    label:
      en: Total amount
      nl: Totaalbedrag
    description:
      en: Sum of all instructions in this payment order.
      nl: Som van alle instructies in deze betaalopdracht.
    osfType: currency
    persisted:
      column: total_amount
      storageClass: core
  - key: description
    osfType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-text description of the payment order for internal reference.
      nl: Vrije omschrijving van de betaalopdracht voor interne referentie.
    validation:
      maxLength: 200
    persisted:
      column: description
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the order in an external context.
      nl: Functionele of zakelijke code van de opdracht in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: paymentMethodId
    label:
      en: Payment method
      nl: Betaalwijze
    persisted:
      column: payment_method_id
      storageClass: core
    osfType: PaymentMethod
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Payment Order
    description: List PaymentOrder records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Payment Order
    description: Get PaymentOrder records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Payment Order
    description: Create PaymentOrder records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update PaymentOrder records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /payment-orders
          nl: /betaalopdrachten
        columns:
          - key: referenceNumber
            sortable: true
          - key: executionDate
            sortable: true
          - key: status
            sortable: true
          - key: totalAmount
            sortable: true
        title:
          en: Payment orders
          nl: Betaalopdrachten
        defaultSort:
          key: executionDate
          direction: desc
      record:
        routes:
          read:
            en: /payment-orders/:id
            nl: /betaalopdrachten/:id
          create:
            en: /payment-orders/create
            nl: /betaalopdrachten/aanmaken
        title: "{{referenceNumber}}"
        subtitle: "{{totalAmount}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Order details
                    nl: Opdrachtgegevens
                  fields:
                    - referenceNumber
                    - executionDate
                    - status
                    - totalAmount
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create payment order
              nl: Betaalopdracht aanmaken
            groups:
              - title:
                  en: Order details
                  nl: Opdrachtgegevens
                fields:
                  - referenceNumber
                  - executionDate
                  - status
                  - totalAmount
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit payment order
              nl: Betaalopdracht bewerken
    fields:
      executionDate:
        render:
          component: DatePicker
          props: {}
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PAYMENTORDERSTATUS
            clearable: false
