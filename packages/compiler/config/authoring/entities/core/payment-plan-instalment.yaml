schemaVersion: 3
kind: coreEntity
module: core
entity: PaymentPlanInstalment
title: Payment Plan Instalment
description: Single instalment within a payment plan, with due date, amount, and optional link to the actual payment
  that settled it.
language: en
displayTemplate: "#{{instalmentNumber}}: {{amount}}"
filterField: instalmentNumber
labels:
  en: Payment plan instalment
  nl: Termijn
pluralLabels:
  en: Payment plan instalments
  nl: Termijnen
domains:
  - finance
fields:
  - key: instalmentNumber
    osfType: integer
    required: true
    label:
      en: Instalment number
      nl: Termijnnummer
    description:
      en: Sequential instalment number within the payment plan.
      nl: Volgnummer van de termijn binnen de betalingsregeling.
    validation:
      min: 1
    persisted:
      column: instalment_number
      storageClass: core
  - key: dueDate
    osfType: date
    required: true
    label:
      en: Due date
      nl: Vervaldatum
    description:
      en: Date by which this instalment must be paid.
      nl: Datum waarop deze termijn moet zijn betaald.
    persisted:
      column: due_date
      storageClass: core
  - key: amount
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Amount due for this instalment.
      nl: Verschuldigd bedrag voor deze termijn.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: paidAt
    osfType: datetime
    required: false
    label:
      en: Paid at
      nl: Betaald op
    description:
      en: Timestamp at which this instalment was settled, if known.
      nl: Tijdstip waarop deze termijn is voldaan, indien bekend.
    persisted:
      column: paid_at
      storageClass: core
  - key: paymentPlanId
    label:
      en: Payment plan
      nl: Betalingsregeling
    persisted:
      column: payment_plan_id
      storageClass: core
    osfType: PaymentPlan
    relationship:
      ownership: reference
  # System-written by payment settlement: the payment that covered this instalment, not an input.
  - key: invoicePaymentId
    readOnly: true
    label:
      en: Invoice payment
      nl: Factuurbetaling
    persisted:
      column: invoice_payment_id
      storageClass: core
    osfType: InvoicePayment
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Payment Plan Instalment
    description: List PaymentPlanInstalment records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Payment Plan Instalment
    description: Get PaymentPlanInstalment records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Payment Plan Instalment
    description: Create PaymentPlanInstalment records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update PaymentPlanInstalment records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /payment-plan-instalments
          nl: /termijnen
        columns:
          - key: instalmentNumber
            sortable: true
          - key: dueDate
            sortable: true
          - key: amount
            sortable: true
          - key: paidAt
            sortable: true
        title:
          en: Payment plan instalments
          nl: Termijnen
        defaultSort:
          key: dueDate
          direction: asc
      record:
        routes:
          read:
            en: /payment-plan-instalments/:id
            nl: /termijnen/:id
          create:
            en: /payment-plan-instalments/create
            nl: /termijnen/aanmaken
        title: "#{{instalmentNumber}}"
        subtitle: "{{amount}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Instalment details
                    nl: Termijngegevens
                  fields:
                    - instalmentNumber
                    - dueDate
                    - amount
                    - paidAt
        modes:
          create:
            title:
              en: Create payment plan instalment
              nl: Termijn aanmaken
            groups:
              - title:
                  en: Instalment details
                  nl: Termijngegevens
                fields:
                  - instalmentNumber
                  - dueDate
                  - amount
                  - paidAt
          update:
            title:
              en: Edit payment plan instalment
              nl: Termijn bewerken
    fields:
      dueDate:
        render:
          component: DatePicker
          props: {}
