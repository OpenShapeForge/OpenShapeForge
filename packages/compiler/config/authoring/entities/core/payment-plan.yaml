schemaVersion: 3
kind: coreEntity
module: core
entity: PaymentPlan
title: Payment Plan
description: Negotiated payment schedule for a debtor relation. Splits an outstanding balance into a series of instalments.
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Payment plan
  nl: Betalingsregeling
pluralLabels:
  en: Payment plans
  nl: Betalingsregelingen
domains:
  - finance
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique short code identifying the payment plan.
      nl: Tenant-unieke korte code die de betalingsregeling identificeert.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the payment plan.
      nl: Levenscyclusstatus van de betalingsregeling.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PAYMENTPLANSTATUS
    osfType: referenceDataCode
  - key: startDate
    osfType: date
    required: true
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date on which the payment plan begins.
      nl: Datum waarop de betalingsregeling start.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date on which the payment plan is scheduled to end.
      nl: Datum waarop de betalingsregeling gepland is te eindigen.
    persisted:
      column: end_date
      storageClass: core
  - key: totalAmount
    required: false
    label:
      en: Total amount
      nl: Totaalbedrag
    description:
      en: Total amount covered by the payment plan.
      nl: Totaalbedrag waarvoor de betalingsregeling is afgesloten.
    osfType: currency
    persisted:
      column: total_amount
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form description of the payment plan.
      nl: Vrije omschrijving van de betalingsregeling.
    validation:
      maxLength: 1000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the payment plan in an external context.
      nl: Functionele of zakelijke code van de betalingsregeling in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Payment Plan
    description: List PaymentPlan records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Payment Plan
    description: Get PaymentPlan records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Payment Plan
    description: Create PaymentPlan records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update PaymentPlan records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /payment-plans
          nl: /betalingsregelingen
        columns:
          - key: code
            sortable: true
          - key: status
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
          - key: totalAmount
            sortable: true
        title:
          en: Payment plans
          nl: Betalingsregelingen
        defaultSort:
          key: startDate
          direction: desc
      record:
        routes:
          read:
            en: /payment-plans/:id
            nl: /betalingsregelingen/:id
          create:
            en: /payment-plans/create
            nl: /betalingsregelingen/aanmaken
        title: "{{code}}"
        subtitle: "{{totalAmount}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Plan details
                    nl: Regelinggegevens
                  fields:
                    - code
                    - status
                    - startDate
                    - endDate
                    - totalAmount
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create payment plan
              nl: Betalingsregeling aanmaken
            groups:
              - title:
                  en: Plan details
                  nl: Regelinggegevens
                fields:
                  - code
                  - status
                  - startDate
                  - endDate
                  - totalAmount
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit payment plan
              nl: Betalingsregeling bewerken
    fields:
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PAYMENTPLANSTATUS
            clearable: false
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 1000
