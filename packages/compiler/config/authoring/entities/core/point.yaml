schemaVersion: 3
kind: coreEntity
module: core
entity: Point
title: Point
description: GIS point (latitude/longitude) optionally bound to an asset or a building.
language: en
displayTemplate: "{{latitude}}, {{longitude}}"
filterField: id
labels:
  en: Point
  nl: Punt
domains:
  - asset
fields:
  - key: latitude
    valueType: number
    required: true
    label:
      en: Latitude
      nl: Breedtegraad
    description:
      en: Latitude in decimal degrees.
      nl: Breedtegraad in decimale graden.
    validation:
      min: -90
      max: 90
    persisted:
      column: latitude
      storageClass: core
  - key: longitude
    valueType: number
    required: true
    label:
      en: Longitude
      nl: Lengtegraad
    description:
      en: Longitude in decimal degrees.
      nl: Lengtegraad in decimale graden.
    validation:
      min: -180
      max: 180
    persisted:
      column: longitude
      storageClass: core
  - key: srid
    valueType: integer
    required: false
    label:
      en: SRID
      nl: SRID
    description:
      en: Spatial reference system identifier (default 4326 / WGS84).
      nl: Spatial reference system identifier (standaard 4326 / WGS84).
    persisted:
      column: srid
      storageClass: core
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description of the point.
      nl: Optionele omschrijving van het punt.
    validation:
      maxLength: 200
    persisted:
      column: description
      storageClass: core
  - key: assetId
    label:
      en: Asset
      nl: Object
    persisted:
      column: asset_id
      storageClass: core
    semanticType: Asset
    relationship:
      ownership: reference
  - key: buildingId
    label:
      en: Building
      nl: Pand
    persisted:
      column: building_id
      storageClass: core
    semanticType: Building
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - RealEstate.All.Read
      - RealEstate.All.ReadWrite
    create:
      - RealEstate.All.ReadWrite
    update:
      - RealEstate.All.ReadWrite
    delete:
      - RealEstate.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Point
    description: List Point records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Point
    description: Get Point records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Point
    description: Create Point records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Point records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /points
          nl: /punten
        columns:
          - key: latitude
            sortable: true
          - key: longitude
            sortable: true
          - key: description
            sortable: true
        title:
          en: Points
          nl: Punten
        defaultSort:
          key: latitude
          direction: asc
      record:
        routes:
          read:
            en: /points/:id
            nl: /punten/:id
          create:
            en: /points/create
            nl: /punten/aanmaken
        title: "{{latitude}}, {{longitude}}"
        subtitle: "{{description}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Point details
                    nl: Puntgegevens
                  fields:
                    - latitude
                    - longitude
                    - srid
                    - description
        modes:
          create:
            title:
              en: Create point
              nl: Punt aanmaken
            groups:
              - title:
                  en: Point details
                  nl: Puntgegevens
                fields:
                  - latitude
                  - longitude
                  - srid
                  - description
          update:
            title:
              en: Edit point
              nl: Punt bewerken
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
