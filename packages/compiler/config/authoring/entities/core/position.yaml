schemaVersion: 3
kind: coreEntity
module: core
entity: Position
title: Position
description: Job position (function) within the organization, optionally placed in an org unit and carrying salary range.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Position
  nl: Functie
pluralLabels:
  en: Positions
  nl: Functies
domains:
  - hr
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique code identifying the position.
      nl: Tenant-unieke code voor de functie.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Display name of the position.
      nl: Weergavenaam van de functie.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description of the position.
      nl: Optionele omschrijving van de functie.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: salaryRangeMin
    required: false
    label:
      en: Salary range min
      nl: Salarisrange minimum
    description:
      en: Lower bound of the salary range for the position.
      nl: Ondergrens van de salarisrange voor de functie.
    osfType: currency
    persisted:
      column: salary_range_min
      storageClass: core
  - key: salaryRangeMax
    required: false
    label:
      en: Salary range max
      nl: Salarisrange maximum
    description:
      en: Upper bound of the salary range for the position.
      nl: Bovengrens van de salarisrange voor de functie.
    osfType: currency
    persisted:
      column: salary_range_max
      storageClass: core
  - key: currencyCode
    osfType: string
    required: true
    label:
      en: Currency code
      nl: Valutacode
    description:
      en: ISO 4217 currency code for the salary range.
      nl: ISO 4217-valutacode voor de salarisrange.
    validation:
      maxLength: 3
    persisted:
      column: currency_code
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the position in an external context.
      nl: Functionele of zakelijke code van de functie in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: orgUnitId
    label:
      en: Org unit
      nl: Organisatorische eenheid
    persisted:
      column: org_unit_id
      storageClass: core
    osfType: OrgUnit
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Organization.All.Read
      - Organization.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Position
    description: List Position records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Position
    description: Get Position records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Position
    description: Create Position records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Position records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /positions
          nl: /functies
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: salaryRangeMin
            sortable: true
          - key: salaryRangeMax
            sortable: true
        title:
          en: Positions
          nl: Functies
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /positions/:id
            nl: /functies/:id
          create:
            en: /positions/create
            nl: /functies/aanmaken
        title: "{{code}} {{name}}"
        subtitle: "{{description}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Position details
                    nl: Functiegegevens
                  fields:
                    - code
                    - name
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Compensation
                    nl: Beloning
                  fields:
                    - salaryRangeMin
                    - salaryRangeMax
                    - currencyCode
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create position
              nl: Functie aanmaken
            groups:
              - title:
                  en: Position details
                  nl: Functiegegevens
                fields:
                  - code
                  - name
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Compensation
                  nl: Beloning
                fields:
                  - salaryRangeMin
                  - salaryRangeMax
                  - currencyCode
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit position
              nl: Functie bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 6
            maxLength: 5000
