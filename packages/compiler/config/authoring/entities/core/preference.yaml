schemaVersion: 3
kind: coreEntity
module: core
entity: Preference
title: Preference
description: A generic scoped preference for user interface state, defaults, or other account, relation, and tenant settings.
language: en
displayTemplate: "{{key}}"
filterField: key
labels:
  en: Preference
  nl: Voorkeur
pluralLabels:
  en: Preferences
  nl: Voorkeuren
domains:
  - core
authorization:
  roles:
    read:
      - General.All.Read
      - General.All.ReadWrite
    create:
      - General.All.ReadWrite
    update:
      - General.All.ReadWrite
    delete:
      - General.All.ReadWrite
  # Tenant-scoped only, where the origin repo predicated rows on the owning
  # account (`account_id` = `app.current_account_id`). Neither half of that
  # carries over: this runtime exposes only `app.current_user_id()`, which
  # holds the Keycloak `sub` (claims.ts), while `account_id` is an Account
  # row id — Account keeps the subject in its own `keycloak_sub` column, so
  # the two are different identifiers and comparing them would silently match
  # nothing. Adding a `user_id` column instead would isolate per user but
  # break the entity: `ownerScope` is account | relation | tenant, and an
  # owner axis forces `empty: restricted`, hiding every tenant-scoped
  # preference from everyone.
  #
  # So preferences are currently visible tenant-wide. Restoring per-user
  # isolation needs a modelling decision first — most likely splitting the
  # account-scoped rows into their own entity that can carry a real owner
  # column, rather than widening rowAccess.
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: ownerScope
    required: true
    label:
      en: Owner scope
      nl: Eigenaarsniveau
    description:
      en: Scope that owns this preference, such as account, relation, or tenant.
      nl: Niveau dat eigenaar is van deze voorkeur, zoals account, relatie of tenant.
    defaultValue: account
    options:
      type: referentiedata
      referentieGroep: PREFERENCEOWNERSCOPE
    persisted:
      column: owner_scope
      storageClass: core
    osfType: referenceDataCode
  - key: namespace
    osfType: string
    required: true
    label:
      en: Namespace
      nl: Namespace
    description:
      en: Functional namespace that groups related preferences, such as ui.workflow or messaging.defaults.
      nl: Functionele namespace die verwante voorkeuren groepeert, zoals ui.workflow of messaging.defaults.
    validation:
      minLength: 1
      maxLength: 120
    persisted:
      column: namespace
      storageClass: core
  - key: key
    osfType: string
    required: true
    label:
      en: Key
      nl: Sleutel
    description:
      en: Stable preference key within the namespace.
      nl: Stabiele voorkeurssleutel binnen de namespace.
    validation:
      minLength: 1
      maxLength: 120
    persisted:
      column: key
      storageClass: core
  - key: valueJson
    osfType: object
    required: false
    label:
      en: Value
      nl: Waarde
    description:
      en: Structured JSON value for this preference.
      nl: Gestructureerde JSON-waarde voor deze voorkeur.
    persisted:
      column: value_json
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional explanation of what this preference controls.
      nl: Optionele uitleg van wat deze voorkeur regelt.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: accountId
    label:
      en: Account
      nl: Account
    persisted:
      column: account_id
      storageClass: core
    osfType: Account
    relationship:
      ownership: reference
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
operations:
  list:
    name: List Preference
    description: List Preference records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Preference
    description: Get Preference records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Preference
    description: Create Preference records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Preference records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /preferences
          nl: /voorkeuren
        columns:
          - key: ownerScope
            sortable: true
          - key: namespace
            sortable: true
          - key: key
            sortable: true
        title:
          en: Preferences
          nl: Voorkeuren
        defaultSort:
          key: namespace
          direction: asc
      record:
        routes:
          read:
            en: /preferences/:id
            nl: /voorkeuren/:id
          create:
            en: /preferences/create
            nl: /voorkeuren/aanmaken
        title: "{{key}}"
        subtitle: "{{namespace}}"
        badges:
          - ownerScope
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Preference details
                    nl: Voorkeurgegevens
                  fields:
                    - ownerScope
                    - namespace
                    - key
                    - valueJson
                    - description
        modes:
          create:
            title:
              en: Create preference
              nl: Voorkeur aanmaken
            groups:
              - title:
                  en: Preference details
                  nl: Voorkeurgegevens
                fields:
                  - ownerScope
                  - namespace
                  - key
                  - valueJson
                  - description
          update:
            title:
              en: Edit preference
              nl: Voorkeur bewerken
    fields:
      ownerScope:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PREFERENCEOWNERSCOPE
            clearable: false
      valueJson:
        render:
          component: JsonFieldEditor
          props:
            rows: 10
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 500
