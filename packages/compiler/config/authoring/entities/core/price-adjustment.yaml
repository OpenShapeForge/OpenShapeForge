schemaVersion: 3
kind: coreEntity
module: core
entity: PriceAdjustment
title: Price Adjustment
description: Indexation or manual price adjustment rule (e.g. CPI indexation, regulatory uplift, manual override)
  applied as of an effective date.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Price adjustment
  nl: Prijsaanpassing
pluralLabels:
  en: Price adjustments
  nl: Prijsaanpassingen
domains:
  - finance
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique short code identifying the price adjustment rule.
      nl: Tenant-unieke korte code die de prijsaanpassingsregel identificeert.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the price adjustment rule.
      nl: Menselijk leesbare naam van de prijsaanpassingsregel.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: kind
    required: true
    label:
      en: Kind
      nl: Soort
    description:
      en: Kind of price adjustment (CPI indexation, manual, regulatory).
      nl: Soort prijsaanpassing (CPI-indexering, handmatig, wettelijk).
    persisted:
      column: kind
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PRICEADJUSTMENTKIND
    osfType: referenceDataCode
  - key: effectiveDate
    osfType: date
    required: true
    label:
      en: Effective date
      nl: Ingangsdatum
    description:
      en: Date on which the price adjustment becomes effective.
      nl: Datum waarop de prijsaanpassing van kracht wordt.
    persisted:
      column: effective_date
      storageClass: core
  - key: percentage
    osfType: number
    required: false
    label:
      en: Percentage
      nl: Percentage
    description:
      en: Percentage uplift or reduction applied by this adjustment.
      nl: Percentage van de verhoging of verlaging die deze aanpassing toepast.
    persisted:
      column: percentage
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form description of the price adjustment rule.
      nl: Vrije omschrijving van de prijsaanpassingsregel.
    validation:
      maxLength: 1000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the price adjustment in an external context.
      nl: Functionele of zakelijke code van de prijsaanpassing in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Price Adjustment
    description: List PriceAdjustment records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Price Adjustment
    description: Get PriceAdjustment records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Price Adjustment
    description: Create PriceAdjustment records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update PriceAdjustment records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /price-adjustments
          nl: /prijsaanpassingen
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: kind
            sortable: true
          - key: effectiveDate
            sortable: true
          - key: percentage
            sortable: true
        title:
          en: Price adjustments
          nl: Prijsaanpassingen
        defaultSort:
          key: effectiveDate
          direction: desc
      record:
        routes:
          read:
            en: /price-adjustments/:id
            nl: /prijsaanpassingen/:id
          create:
            en: /price-adjustments/create
            nl: /prijsaanpassingen/aanmaken
        title: "{{name}}"
        subtitle: "{{code}}"
        badges:
          - kind
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Adjustment details
                    nl: Aanpassingsgegevens
                  fields:
                    - code
                    - name
                    - kind
                    - effectiveDate
                    - percentage
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create price adjustment
              nl: Prijsaanpassing aanmaken
            groups:
              - title:
                  en: Adjustment details
                  nl: Aanpassingsgegevens
                fields:
                  - code
                  - name
                  - kind
                  - effectiveDate
                  - percentage
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit price adjustment
              nl: Prijsaanpassing bewerken
    fields:
      kind:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PRICEADJUSTMENTKIND
            clearable: false
      effectiveDate:
        render:
          component: DatePicker
          props: {}
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 1000
