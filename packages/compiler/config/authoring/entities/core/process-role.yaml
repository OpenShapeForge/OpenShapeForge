schemaVersion: 3
kind: coreEntity
module: core
entity: ProcessRole
title: Process Role
description: Role assigned to a relation in the context of a process (canonical role pattern).
language: en
displayTemplate: "{{roleType}}"
filterField: roleType
labels:
  en: Process role
  nl: Procesrol
pluralLabels:
  en: Process roles
  nl: Procesrollen
domains:
  - cases
fields:
  - key: roleType
    required: true
    label:
      en: Role type
      nl: Roltype
    description:
      en: Role this party plays in the process (initiator, owner, executor, reviewer, approver, observer).
      nl: Rol die deze partij in het proces vervult (initiator, eigenaar, uitvoerder, reviewer, goedkeurder, toeschouwer).
    persisted:
      column: role_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PROCESSROLE
    osfType: referenceDataCode
  - key: status
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of this role assignment.
      nl: Levenscyclusstatus van deze roltoewijzing.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ROLEASSIGNMENTSTATUS
    osfType: referenceDataCode
  - key: name
    osfType: string
    required: false
    label:
      en: Name
      nl: Naam
    description:
      en: Optional human-readable name of the role assignment.
      nl: Optionele menselijk leesbare naam van de roltoewijzing.
    validation:
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the role assignment.
      nl: Optionele omschrijving of zakelijke betekenis van de roltoewijzing.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which this role assignment is effective.
      nl: Datum vanaf wanneer deze roltoewijzing geldig is.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which this role assignment is effective.
      nl: Datum tot wanneer deze roltoewijzing geldig is.
    persisted:
      column: end_date
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the role assignment in an external context.
      nl: Functionele of zakelijke code van de roltoewijzing in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: processId
    label:
      en: Process
      nl: Proces
    persisted:
      column: process_id
      storageClass: core
    osfType: Process
    relationship:
      ownership: reference
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - CaseFile.All.Read
      - CaseFile.All.ReadWrite
    create:
      - CaseFile.All.ReadWrite
    update:
      - CaseFile.All.ReadWrite
    delete:
      - CaseFile.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Process Role
    description: List ProcessRole records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Process Role
    description: Get ProcessRole records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Process Role
    description: Create ProcessRole records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update ProcessRole records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /process-roles
          nl: /procesrollen
        columns:
          - key: roleType
            sortable: true
          - key: name
            sortable: true
          - key: status
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
        title:
          en: Process roles
          nl: Procesrollen
        defaultSort:
          key: startDate
          direction: desc
      record:
        routes:
          read:
            en: /process-roles/:id
            nl: /procesrollen/:id
          create:
            en: /process-roles/create
            nl: /procesrollen/aanmaken
        title: "{{name || roleType}}"
        subtitle: "{{status}}"
        badges:
          - roleType
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Role details
                    nl: Rolgegevens
                  fields:
                    - roleType
                    - status
                    - name
                    - startDate
                    - endDate
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create process role
              nl: Procesrol aanmaken
            groups:
              - title:
                  en: Role details
                  nl: Rolgegevens
                fields:
                  - roleType
                  - status
                  - name
                  - startDate
                  - endDate
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit process role
              nl: Procesrol bewerken
    fields:
      roleType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PROCESSROLE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ROLEASSIGNMENTSTATUS
            clearable: true
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
