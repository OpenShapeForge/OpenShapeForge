schemaVersion: 1
kind: coreEntity
module: core
entity: ProcessRole
title: Process Role
description: Role assigned to a relation in the context of a process (canonical role pattern).
language: en
displayTemplate: "{{roleType}}"
filterField: roleType
labels:
  en: Process role
  nl: Procesrol
domains:
  - cases
fields:
  - key: roleType
    valueType: string
    required: true
    label:
      en: Role type
      nl: Roltype
    description:
      en: Role this party plays in the process (initiator, owner, executor, reviewer, approver, observer).
      nl: Rol die deze partij in het proces vervult (initiator, eigenaar, uitvoerder, reviewer, goedkeurder, toeschouwer).
    persisted:
      column: role_type
      storageClass: core
    render:
      component: ReferenceSelect
      props:
        referentieGroep: PROCESSROLE
        clearable: false
  - key: status
    valueType: string
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of this role assignment.
      nl: Levenscyclusstatus van deze roltoewijzing.
    persisted:
      column: status
      storageClass: core
    render:
      component: ReferenceSelect
      props:
        referentieGroep: ROLEASSIGNMENTSTATUS
        clearable: true
  - key: name
    valueType: string
    required: false
    label:
      en: Name
      nl: Naam
    description:
      en: Optional human-readable name of the role assignment.
      nl: Optionele menselijk leesbare naam van de roltoewijzing.
    validation:
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the role assignment.
      nl: Optionele omschrijving of zakelijke betekenis van de roltoewijzing.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    render:
      component: Textarea
      props:
        rows: 4
        maxLength: 2000
  - key: startDate
    valueType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which this role assignment is effective.
      nl: Datum vanaf wanneer deze roltoewijzing geldig is.
    persisted:
      column: start_date
      storageClass: core
    render:
      component: DatePicker
      props: {}
  - key: endDate
    valueType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which this role assignment is effective.
      nl: Datum tot wanneer deze roltoewijzing geldig is.
    persisted:
      column: end_date
      storageClass: core
    render:
      component: DatePicker
      props: {}
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the role assignment in an external context.
      nl: Functionele of zakelijke code van de roltoewijzing in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
relationships:
  - key: process
    kind: belongsTo
    target: Process
    foreignKey: process_id
    label:
      en: Process
      nl: Proces
  - key: relation
    kind: belongsTo
    target: Relation
    foreignKey: relation_id
    label:
      en: Relation
      nl: Relatie
ui:
  routes:
    list:
      en: /process-roles
      nl: /procesrollen
    detail:
      en: /process-roles/:id
      nl: /procesrollen/:id
    create:
      en: /process-roles/create
      nl: /procesrollen/aanmaken
    edit:
      en: /process-roles/:id/edit
      nl: /procesrollen/:id/bewerken
    delete:
      en: /process-roles/:id/delete
      nl: /procesrollen/:id/verwijderen
  presentations:
    list:
      title:
        en: Process roles
        nl: Procesrollen
      columns:
        - key: roleType
          sortable: true
        - key: name
          sortable: true
        - key: status
          sortable: true
        - key: startDate
          sortable: true
        - key: endDate
          sortable: true
      defaultSort:
        key: startDate
        direction: desc
      rowLink:
        en: /process-roles/:id
        nl: /procesrollen/:id
    detail:
      header:
        title: "{{name || roleType}}"
        subtitle: "{{status}}"
        badges:
          - roleType
      actions:
        - key: edit
          label:
            en: Edit
            nl: Bewerken
          route: edit
        - key: delete
          label:
            en: Delete
            nl: Verwijderen
          confirm:
            en: Are you sure?
            nl: Weet je het zeker?
          mutation: delete
      groups:
        - id: overview
          label:
            en: Overview
            nl: Overzicht
          groups:
            - title:
                en: Role details
                nl: Rolgegevens
              fields:
                - roleType
                - status
                - name
                - startDate
                - endDate
            - title:
                en: Description
                nl: Omschrijving
              fields:
                - description
            - title:
                en: Source
                nl: Herkomst
              fields:
                - externalId
                - externalCode
                - sourceAuthority
                - sourceOrganization
                - sourceAdministration
    form:
      variants:
        create:
          title:
            en: Create process role
            nl: Procesrol aanmaken
          groups:
            - title:
                en: Role details
                nl: Rolgegevens
              fields:
                - roleType
                - status
                - name
                - startDate
                - endDate
            - title:
                en: Description
                nl: Omschrijving
              fields:
                - description
            - title:
                en: Source
                nl: Herkomst
              fields:
                - externalId
                - externalCode
                - sourceAuthority
                - sourceOrganization
                - sourceAdministration
        edit:
          extends: create
          title:
            en: Edit process role
            nl: Procesrol bewerken
workflow:
  nodes:
    actions:
      create: true
      getOne: true
      list: true
      update: true
      delete: true
authorization:
  roles:
    read:
      - CaseFile.All.Read
      - CaseFile.All.ReadWrite
    create:
      - CaseFile.All.ReadWrite
    update:
      - CaseFile.All.ReadWrite
    delete:
      - CaseFile.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
