schemaVersion: 3
kind: coreEntity
module: core
entity: ProcessStep
title: Process Step
description: A business-visible step of a runtime case step container.
language: en
displayTemplate: "{{name}}"
filterField: name
labels:
  en: Process Step
  nl: Processtap
pluralLabels:
  en: Process steps
  nl: Processtappen
domains:
  - cases
authorization:
  roles:
    read:
      - Cases.All.Read
      - Cases.All.ReadWrite
    create:
      - Cases.All.ReadWrite
    update:
      - Cases.All.ReadWrite
    delete:
      - Cases.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: key
    osfType: string
    required: true
    label:
      en: Key
      nl: Sleutel
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: key
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Beschrijving
    validation:
      maxLength: 4000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: stepType
    required: true
    label:
      en: Step type
      nl: Staptype
    persisted:
      column: step_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PROCESSSTEPTYPE
    osfType: referenceDataCode
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PROCESSSTEPSTATUS
    osfType: referenceDataCode
  - key: sequenceNumber
    osfType: integer
    required: false
    label:
      en: Sequence number
      nl: Volgnummer
    persisted:
      column: sequence_number
      storageClass: core
  - key: isMilestone
    osfType: boolean
    required: true
    label:
      en: Is milestone
      nl: Is mijlpaal
    defaultValue: false
    persisted:
      column: is_milestone
      storageClass: core
  - key: isBlocking
    osfType: boolean
    required: true
    label:
      en: Is blocking
      nl: Is blokkerend
    defaultValue: true
    persisted:
      column: is_blocking
      storageClass: core
  - key: requiredInput
    osfType: object
    required: false
    readOnly: true
    writeSource: caller
    label:
      en: Required input
      nl: Benodigde input
    description:
      en: Field definitions or prompt metadata currently needed to continue this process step.
      nl: Velddefinities of promptmetadata die nu nodig zijn om deze processtap voort te zetten.
    persisted:
      column: required_input
      storageClass: core
  - key: startedAt
    osfType: datetime
    required: false
    label:
      en: Started at
      nl: Gestart op
    persisted:
      column: started_at
      storageClass: core
  - key: dueAt
    osfType: datetime
    required: false
    label:
      en: Due at
      nl: Uiterlijk op
    persisted:
      column: due_at
      storageClass: core
  - key: completedAt
    osfType: datetime
    required: false
    label:
      en: Completed at
      nl: Afgerond op
    persisted:
      column: completed_at
      storageClass: core
  - key: completedByAccountId
    required: false
    osfType: Account
    label:
      en: Completed by
      nl: Afgerond door
    description:
      en: Account that manually completed this process step.
      nl: Account dat deze processtap handmatig heeft afgerond.
    validation:
      format: uuid
    persisted:
      column: completed_by_account_id
      storageClass: core
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      inverse: false
  - key: completionApprovalComment
    required: false
    label:
      en: Completion approval comment
      nl: Afrondingsgoedkeuringsopmerking
    validation:
      maxLength: 2000
    persisted:
      column: completion_approval_comment
      storageClass: core
    osfType: multilineText
  - key: waitReason
    osfType: string
    required: false
    label:
      en: Wait reason
      nl: Wachtrede
    validation:
      maxLength: 300
    persisted:
      column: wait_reason
      storageClass: core
  - key: resultCode
    osfType: string
    required: false
    label:
      en: Result code
      nl: Resultaatcode
    validation:
      maxLength: 100
    persisted:
      column: result_code
      storageClass: core
  - key: note
    required: false
    label:
      en: Note
      nl: Notitie
    validation:
      maxLength: 4000
    persisted:
      column: note
      storageClass: core
    osfType: multilineText
  - key: isAdHoc
    osfType: boolean
    required: true
    label:
      en: Ad-hoc step
      nl: Ad-hoc stap
    description:
      en: Step was added manually by a case worker and is not part of the original template
      nl: Stap is handmatig toegevoegd door een medewerker en maakt geen deel uit van het originele sjabloon
    defaultValue: false
    persisted:
      column: is_ad_hoc
      storageClass: core
  - key: templateStepKey
    osfType: string
    required: false
    label:
      en: Process step template key
      nl: Processtapsjabloon sleutel
    description:
      en: Reference to the process step template this was instantiated from
      nl: Verwijzing naar het processtapsjabloon waarvan dit een instantie is
    validation:
      maxLength: 100
    persisted:
      column: template_step_key
      storageClass: core
  - key: processId
    label:
      en: Process
      nl: Proces
    persisted:
      column: process_id
      storageClass: core
    osfType: Process
    relationship:
      ownership: reference
      inverse:
        key: steps
  - key: ownerId
    label:
      en: Owner
      nl: Eigenaar
    persisted:
      column: owner_account_id
      storageClass: core
    osfType: Account
    relationship:
      ownership: reference
      inverse: false
  - key: assignedGroupId
    label:
      en: Assigned group
      nl: Toegewezen groep
    persisted:
      column: assigned_group_id
      storageClass: core
    osfType: RelationGroup
    relationship:
      ownership: reference
  - key: predecessorStepId
    label:
      en: Predecessor step
      nl: Vorige stap
    persisted:
      column: predecessor_step_id
      storageClass: core
    osfType: ProcessStep
    relationship:
      ownership: reference
      inverse:
        key: nextSteps
        label:
          en: Next steps
          nl: Vervolgstappen
operations:
  list:
    name: List Process Step
    description: List ProcessStep records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Process Step
    description: Get ProcessStep records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Process Step
    description: Create ProcessStep records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Process Step
    description: Update ProcessStep records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Process Step
    description: Delete ProcessStep records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  web:
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 4000
      stepType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PROCESSSTEPTYPE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PROCESSSTEPSTATUS
            clearable: false
      requiredInput:
        render:
          component: JsonEditor
      startedAt:
        render:
          component: DateTimePicker
          props: {}
      dueAt:
        render:
          component: DateTimePicker
          props: {}
      completedAt:
        render:
          component: DateTimePicker
          props: {}
      completionApprovalComment:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 2000
      note:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 4000
