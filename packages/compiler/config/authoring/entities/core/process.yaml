schemaVersion: 3
kind: coreEntity
module: core
entity: Process
title: Case Step Container
description: Technical container for runtime case steps. Kept on the existing process table until the runtime tables are renamed.
language: en
displayTemplate: "{{name}}"
filterField: name
labels:
  en: Case Step Container
  nl: Zaakstapcontainer
domains:
  - cases
  - records
  - workflow
authorization:
  roles:
    read:
      - Cases.All.Read
      - Cases.All.ReadWrite
    create:
      - Cases.All.ReadWrite
    update:
      - Cases.All.ReadWrite
    delete:
      - Cases.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    valueType: string
    required: true
    label:
      en: Code
      nl: Code
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: code
      storageClass: core
  - key: name
    valueType: string
    required: true
    label:
      en: Name
      nl: Naam
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Beschrijving
    validation:
      maxLength: 4000
    persisted:
      column: description
      storageClass: core
    semanticType: multilineText
  - key: processType
    valueType: string
    required: true
    label:
      en: Process type
      nl: Procestype
    persisted:
      column: process_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PROCESSTYPE
    semanticType: referenceDataCode
  - key: status
    valueType: string
    required: true
    label:
      en: Status
      nl: Status
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PROCESSSTATUS
    semanticType: referenceDataCode
  - key: phase
    valueType: string
    required: false
    label:
      en: Phase
      nl: Fase
    validation:
      maxLength: 100
    persisted:
      column: phase
      storageClass: core
  - key: currentStepKey
    valueType: string
    required: false
    label:
      en: Current step key
      nl: Huidige stapsleutel
    validation:
      maxLength: 100
    persisted:
      column: current_step_key
      storageClass: core
  - key: currentStepLabel
    valueType: string
    required: false
    label:
      en: Current step label
      nl: Huidige staplabel
    validation:
      maxLength: 200
    persisted:
      column: current_step_label
      storageClass: core
  - key: workflowTemplate
    valueType: string
    required: false
    label:
      en: Workflow template
      nl: Workflowtemplate
    validation:
      maxLength: 200
    persisted:
      column: workflow_template
      storageClass: core
  - key: workflowInstanceRef
    valueType: string
    required: false
    label:
      en: Workflow instance reference
      nl: Workflow-instance referentie
    validation:
      maxLength: 200
    persisted:
      column: workflow_instance_ref
      storageClass: core
  - key: priority
    valueType: string
    required: false
    label:
      en: Priority
      nl: Prioriteit
    persisted:
      column: priority
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEPRIORITY
    semanticType: referenceDataCode
  - key: startedAt
    valueType: datetime
    required: false
    label:
      en: Started at
      nl: Gestart op
    persisted:
      column: started_at
      storageClass: core
  - key: dueAt
    valueType: datetime
    required: false
    label:
      en: Due at
      nl: Uiterlijk op
    persisted:
      column: due_at
      storageClass: core
  - key: completedAt
    valueType: datetime
    required: false
    label:
      en: Completed at
      nl: Afgerond op
    persisted:
      column: completed_at
      storageClass: core
  - key: completedByAccountId
    valueType: string
    required: false
    semanticType: Account
    label:
      en: Completed by
      nl: Afgerond door
    description:
      en: Account that manually completed this case step container.
      nl: Account dat deze zaakstapcontainer handmatig heeft afgerond.
    validation:
      format: uuid
    persisted:
      column: completed_by_account_id
      storageClass: core
    classification:
      sensitivity: internal
      category: workflow
  - key: completionApprovalComment
    valueType: string
    required: false
    label:
      en: Completion approval comment
      nl: Afrondingsgoedkeuringsopmerking
    validation:
      maxLength: 2000
    persisted:
      column: completion_approval_comment
      storageClass: core
    semanticType: multilineText
  - key: cancelledAt
    valueType: datetime
    required: false
    label:
      en: Cancelled at
      nl: Geannuleerd op
    persisted:
      column: cancelled_at
      storageClass: core
  - key: note
    valueType: string
    required: false
    label:
      en: Note
      nl: Notitie
    validation:
      maxLength: 4000
    persisted:
      column: note
      storageClass: core
    semanticType: multilineText
  - key: templateId
    label:
      en: Template
      nl: Sjabloon
    persisted:
      column: case_template_id
      storageClass: core
    semanticType: CaseTemplate
    relationship:
      ownership: reference
  - key: caseId
    label:
      en: Case
      nl: Zaak
    persisted:
      column: case_id
      storageClass: core
    semanticType: Case
    relationship:
      ownership: reference
  - key: caseFileId
    label:
      en: Case file
      nl: Dossier
    persisted:
      column: case_file_id
      storageClass: core
    semanticType: CaseFile
    relationship:
      ownership: reference
  - key: ownerId
    label:
      en: Owner
      nl: Proceseigenaar
    persisted:
      column: owner_account_id
      storageClass: core
    semanticType: Account
    relationship:
      ownership: reference
  - key: parentProcessId
    label:
      en: Parent process
      nl: Hoofdproces
    persisted:
      column: parent_process_id
      storageClass: core
    semanticType: Process
    relationship:
      ownership: reference
  - key: childProcesses
    label:
      en: Child processes
      nl: Deelprocessen
    semanticType: Process
    cardinality: collection
    relationship:
      inverse: parentProcessId
      ownership: reference
  - key: steps
    label:
      en: Process steps
      nl: Processtappen
    semanticType: ProcessStep
    cardinality: collection
    relationship:
      inverse: processId
      ownership: reference
operations:
  list:
    name: List Case Step Container
    description: List Process records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Case Step Container
    description: Get Process records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Case Step Container
    description: Create Process records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Case Step Container
    description: Update Process records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Case Step Container
    description: Delete Process records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
        wait: true
  web:
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 4000
      processType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PROCESSTYPE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PROCESSSTATUS
            clearable: false
      priority:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASEPRIORITY
            clearable: true
      startedAt:
        render:
          component: DateTimePicker
          props: {}
      dueAt:
        render:
          component: DateTimePicker
          props: {}
      completedAt:
        render:
          component: DateTimePicker
          props: {}
      completionApprovalComment:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 2000
      cancelledAt:
        render:
          component: DateTimePicker
          props: {}
      note:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 4000
