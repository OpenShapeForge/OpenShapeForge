schemaVersion: 3
kind: coreEntity
module: core
entity: ProjectBudgetLine
title: Project Budget Line
description: Budget allocation per ledger account, fiscal period, and optional cost dimension within a project budget.
language: en
displayTemplate: "{{description}}: {{amount}}"
filterField: description
labels:
  en: Project budget line
  nl: Projectbudgetregel
domains:
  - project
fields:
  - key: lineNumber
    osfType: integer
    required: true
    label:
      en: Line number
      nl: Regelnummer
    description:
      en: Sequential line number within the project budget.
      nl: Volgnummer van de regel binnen het projectbudget.
    validation:
      min: 1
    persisted:
      column: line_number
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form description of the budget allocation.
      nl: Vrije omschrijving van de budgetallocatie.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: amount
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Budgeted amount for this line.
      nl: Begroot bedrag voor deze regel.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: projectId
    label:
      en: Project
      nl: Project
    persisted:
      column: project_id
      storageClass: core
    osfType: Project
    relationship:
      ownership: reference
  - key: fiscalPeriodId
    label:
      en: Fiscal period
      nl: Boekjaarperiode
    persisted:
      column: fiscal_period_id
      storageClass: core
    osfType: FiscalPeriod
    relationship:
      ownership: reference
  - key: ledgerAccountId
    label:
      en: Ledger account
      nl: Grootboekrekening
    persisted:
      column: ledger_account_id
      storageClass: core
    osfType: LedgerAccount
    relationship:
      ownership: reference
  - key: costDimensionId
    label:
      en: Cost dimension
      nl: Kostendimensie
    persisted:
      column: cost_dimension_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - ProjectDevelopment.All.Read
      - ProjectDevelopment.All.ReadWrite
    create:
      - ProjectDevelopment.All.ReadWrite
    update:
      - ProjectDevelopment.All.ReadWrite
    delete:
      - ProjectDevelopment.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Project Budget Line
    description: List ProjectBudgetLine records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Project Budget Line
    description: Get ProjectBudgetLine records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Project Budget Line
    description: Create ProjectBudgetLine records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update ProjectBudgetLine records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /project-budget-lines
          nl: /projectbudgetregels
        columns:
          - key: lineNumber
            sortable: true
          - key: description
            sortable: true
          - key: amount
            sortable: true
        title:
          en: Project budget lines
          nl: Projectbudgetregels
        defaultSort:
          key: lineNumber
          direction: asc
      record:
        routes:
          read:
            en: /project-budget-lines/:id
            nl: /projectbudgetregels/:id
          create:
            en: /project-budget-lines/create
            nl: /projectbudgetregels/aanmaken
        title: "{{description}}"
        subtitle: "{{amount}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Line details
                    nl: Regelgegevens
                  fields:
                    - lineNumber
                    - description
                    - amount
        modes:
          create:
            title:
              en: Create project budget line
              nl: Projectbudgetregel aanmaken
            groups:
              - title:
                  en: Line details
                  nl: Regelgegevens
                fields:
                  - lineNumber
                  - description
                  - amount
          update:
            title:
              en: Edit project budget line
              nl: Projectbudgetregel bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 500
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
