schemaVersion: 3
kind: coreEntity
module: core
entity: ProjectObjective
title: Project Objective
description: Stated objective for a project, optionally with a target value and target date.
language: en
displayTemplate: "{{code}} {{description}}"
filterField: code
labels:
  en: Project objective
  nl: Projectdoelstelling
domains:
  - project
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Objective code, unique within the project.
      nl: Doelstellingcode, uniek binnen het project.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: description
    required: true
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Description of the objective.
      nl: Omschrijving van de doelstelling.
    validation:
      minLength: 1
      maxLength: 1000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: targetValue
    osfType: string
    required: false
    label:
      en: Target value
      nl: Streefwaarde
    description:
      en: Free-form target value (objectives may be qualitative).
      nl: Vrije streefwaarde (doelstellingen kunnen kwalitatief zijn).
    validation:
      maxLength: 200
    persisted:
      column: target_value
      storageClass: core
  - key: actualValue
    osfType: string
    required: false
    label:
      en: Actual value
      nl: Werkelijke waarde
    description:
      en: Free-form realised value of the objective.
      nl: Vrije gerealiseerde waarde van de doelstelling.
    validation:
      maxLength: 200
    persisted:
      column: actual_value
      storageClass: core
  - key: targetDate
    osfType: date
    required: false
    label:
      en: Target date
      nl: Streefdatum
    description:
      en: Date by which the objective is meant to be achieved.
      nl: Datum waarop de doelstelling behaald moet zijn.
    persisted:
      column: target_date
      storageClass: core
  - key: achievedAt
    osfType: date
    required: false
    label:
      en: Achieved at
      nl: Behaald op
    description:
      en: Date on which the objective was actually achieved.
      nl: Datum waarop de doelstelling daadwerkelijk is behaald.
    persisted:
      column: achieved_at
      storageClass: core
  - key: projectId
    label:
      en: Project
      nl: Project
    persisted:
      column: project_id
      storageClass: core
    osfType: Project
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - ProjectDevelopment.All.Read
      - ProjectDevelopment.All.ReadWrite
    create:
      - ProjectDevelopment.All.ReadWrite
    update:
      - ProjectDevelopment.All.ReadWrite
    delete:
      - ProjectDevelopment.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Project Objective
    description: List ProjectObjective records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Project Objective
    description: Get ProjectObjective records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Project Objective
    description: Create ProjectObjective records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update ProjectObjective records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /project-objectives
          nl: /projectdoelstellingen
        columns:
          - key: code
            sortable: true
          - key: description
            sortable: true
          - key: targetDate
            sortable: true
          - key: achievedAt
            sortable: true
        title:
          en: Project objectives
          nl: Projectdoelstellingen
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /project-objectives/:id
            nl: /projectdoelstellingen/:id
          create:
            en: /project-objectives/create
            nl: /projectdoelstellingen/aanmaken
        title: "{{code}} {{description}}"
        subtitle: "{{targetValue}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Objective details
                    nl: Doelgegevens
                  fields:
                    - code
                    - description
                - title:
                    en: Target and result
                    nl: Streefwaarde en resultaat
                  fields:
                    - targetValue
                    - actualValue
                    - targetDate
                    - achievedAt
        modes:
          create:
            title:
              en: Create project objective
              nl: Projectdoelstelling aanmaken
            groups:
              - title:
                  en: Objective details
                  nl: Doelgegevens
                fields:
                  - code
                  - description
              - title:
                  en: Target and result
                  nl: Streefwaarde en resultaat
                fields:
                  - targetValue
                  - actualValue
                  - targetDate
                  - achievedAt
          update:
            title:
              en: Edit project objective
              nl: Projectdoelstelling bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 1000
      targetDate:
        render:
          component: DatePicker
          props: {}
      achievedAt:
        render:
          component: DatePicker
          props: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
