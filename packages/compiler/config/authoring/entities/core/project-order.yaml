schemaVersion: 3
kind: coreEntity
module: core
entity: ProjectOrder
title: Project Order
description: Work order issued from a project to a supplier; may be linked to a generated purchase order.
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Project order
  nl: Projectopdracht
domains:
  - project
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique project order code.
      nl: Tenant-unieke code van de projectopdracht.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Detailed description of the work covered by the order.
      nl: Uitgebreide omschrijving van het werk dat onder de opdracht valt.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the project order.
      nl: Levenscyclusstatus van de projectopdracht.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PROJECTORDERSTATUS
    osfType: referenceDataCode
  - key: issueDate
    osfType: date
    required: true
    label:
      en: Issue date
      nl: Uitgiftedatum
    description:
      en: Date the order was issued.
      nl: Datum waarop de opdracht is uitgegeven.
    persisted:
      column: issue_date
      storageClass: core
  - key: amount
    required: false
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Total amount of the project order.
      nl: Totaalbedrag van de projectopdracht.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the project order in an external context.
      nl: Functionele of zakelijke code van de projectopdracht in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: projectId
    label:
      en: Project
      nl: Project
    persisted:
      column: project_id
      storageClass: core
    osfType: Project
    relationship:
      ownership: reference
  - key: relationId
    label:
      en: Supplier
      nl: Leverancier
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  - key: purchaseOrderId
    label:
      en: Purchase order
      nl: Inkooporder
    persisted:
      column: purchase_order_id
      storageClass: core
    osfType: PurchaseOrder
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - ProjectDevelopment.All.Read
      - ProjectDevelopment.All.ReadWrite
    create:
      - ProjectDevelopment.All.ReadWrite
    update:
      - ProjectDevelopment.All.ReadWrite
    delete:
      - ProjectDevelopment.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Project Order
    description: List ProjectOrder records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Project Order
    description: Get ProjectOrder records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Project Order
    description: Create ProjectOrder records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update ProjectOrder records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /project-orders
          nl: /projectopdrachten
        columns:
          - key: code
            sortable: true
          - key: status
            sortable: true
          - key: issueDate
            sortable: true
          - key: amount
            sortable: true
        title:
          en: Project orders
          nl: Projectopdrachten
        defaultSort:
          key: issueDate
          direction: desc
      record:
        routes:
          read:
            en: /project-orders/:id
            nl: /projectopdrachten/:id
          create:
            en: /project-orders/create
            nl: /projectopdrachten/aanmaken
        title: "{{code}}"
        subtitle: "{{status}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Order details
                    nl: Opdrachtgegevens
                  fields:
                    - code
                    - status
                    - issueDate
                    - amount
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create project order
              nl: Projectopdracht aanmaken
            groups:
              - title:
                  en: Order details
                  nl: Opdrachtgegevens
                fields:
                  - code
                  - status
                  - issueDate
                  - amount
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit project order
              nl: Projectopdracht bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PROJECTORDERSTATUS
            clearable: false
      issueDate:
        render:
          component: DatePicker
          props: {}
