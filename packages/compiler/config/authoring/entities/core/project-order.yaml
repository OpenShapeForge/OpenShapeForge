schemaVersion: 1
kind: coreEntity
module: core
entity: ProjectOrder
title: Project Order
description: Work order issued from a project to a supplier; may be linked to a generated purchase order.
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Project order
  nl: Projectopdracht
domains:
  - project
fields:
  - key: code
    valueType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique project order code.
      nl: Tenant-unieke code van de projectopdracht.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Detailed description of the work covered by the order.
      nl: Uitgebreide omschrijving van het werk dat onder de opdracht valt.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    render:
      component: Textarea
      props:
        rows: 4
        maxLength: 5000
  - key: status
    valueType: string
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the project order.
      nl: Levenscyclusstatus van de projectopdracht.
    persisted:
      column: status
      storageClass: core
    render:
      component: ReferenceSelect
      props:
        referentieGroep: PROJECTORDERSTATUS
        clearable: false
  - key: issueDate
    valueType: date
    required: true
    label:
      en: Issue date
      nl: Uitgiftedatum
    description:
      en: Date the order was issued.
      nl: Datum waarop de opdracht is uitgegeven.
    persisted:
      column: issue_date
      storageClass: core
    render:
      component: DatePicker
      props: {}
  - key: amount
    valueType: number
    required: false
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Total amount of the project order.
      nl: Totaalbedrag van de projectopdracht.
    semanticType: currency
    persisted:
      column: amount
      storageClass: core
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the project order in an external context.
      nl: Functionele of zakelijke code van de projectopdracht in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
relationships:
  - key: project
    kind: belongsTo
    target: Project
    foreignKey: project_id
    label:
      en: Project
      nl: Project
  - key: relation
    kind: belongsTo
    target: Relation
    foreignKey: relation_id
    label:
      en: Supplier
      nl: Leverancier
  - key: purchaseOrder
    kind: belongsTo
    target: PurchaseOrder
    foreignKey: purchase_order_id
    label:
      en: Purchase order
      nl: Inkooporder
ui:
  routes:
    list:
      en: /project-orders
      nl: /projectopdrachten
    detail:
      en: /project-orders/:id
      nl: /projectopdrachten/:id
    create:
      en: /project-orders/create
      nl: /projectopdrachten/aanmaken
    edit:
      en: /project-orders/:id/edit
      nl: /projectopdrachten/:id/bewerken
    delete:
      en: /project-orders/:id/delete
      nl: /projectopdrachten/:id/verwijderen
  presentations:
    list:
      title:
        en: Project orders
        nl: Projectopdrachten
      columns:
        - key: code
          sortable: true
        - key: status
          sortable: true
        - key: issueDate
          sortable: true
        - key: amount
          sortable: true
      defaultSort:
        key: issueDate
        direction: desc
      rowLink:
        en: /project-orders/:id
        nl: /projectopdrachten/:id
    detail:
      header:
        title: "{{code}}"
        subtitle: "{{status}}"
        badges:
          - status
      actions:
        - key: edit
          label:
            en: Edit
            nl: Bewerken
          route: edit
        - key: delete
          label:
            en: Delete
            nl: Verwijderen
          confirm:
            en: Are you sure?
            nl: Weet je het zeker?
          mutation: delete
      groups:
        - id: overview
          label:
            en: Overview
            nl: Overzicht
          groups:
            - title:
                en: Order details
                nl: Opdrachtgegevens
              fields:
                - code
                - status
                - issueDate
                - amount
            - title:
                en: Description
                nl: Omschrijving
              fields:
                - description
            - title:
                en: Source
                nl: Herkomst
              fields:
                - externalId
                - externalCode
                - sourceAuthority
                - sourceOrganization
                - sourceAdministration
    form:
      variants:
        create:
          title:
            en: Create project order
            nl: Projectopdracht aanmaken
          groups:
            - title:
                en: Order details
                nl: Opdrachtgegevens
              fields:
                - code
                - status
                - issueDate
                - amount
            - title:
                en: Description
                nl: Omschrijving
              fields:
                - description
            - title:
                en: Source
                nl: Herkomst
              fields:
                - externalId
                - externalCode
                - sourceAuthority
                - sourceOrganization
                - sourceAdministration
        edit:
          extends: create
          title:
            en: Edit project order
            nl: Projectopdracht bewerken
workflow:
  nodes:
    actions:
      create: true
      getOne: true
      list: true
      update: true
      delete: true
authorization:
  roles:
    read:
      - Projectontwikkeling.All.Read
      - Projectontwikkeling.All.ReadWrite
    create:
      - Projectontwikkeling.All.ReadWrite
    update:
      - Projectontwikkeling.All.ReadWrite
    delete:
      - Projectontwikkeling.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
