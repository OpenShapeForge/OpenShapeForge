schemaVersion: 3
kind: coreEntity
module: core
entity: ProjectPhaseDecision
title: Project Phase Decision
description: Recorded decision marking a transition or outcome of a project phase (e.g. proceed, pause, cancel).
language: en
displayTemplate: "{{outcome}}"
filterField: outcome
labels:
  en: Project phase decision
  nl: Projectfasebesluit
domains:
  - project
fields:
  - key: decidedAt
    osfType: datetime
    required: true
    label:
      en: Decided at
      nl: Besloten op
    description:
      en: Timestamp on which the decision was taken.
      nl: Tijdstip waarop het besluit is genomen.
    persisted:
      column: decided_at
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form motivation or notes for the decision.
      nl: Vrije onderbouwing of toelichting bij het besluit.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: outcome
    required: true
    label:
      en: Outcome
      nl: Uitkomst
    description:
      en: Outcome of the decision (proceed, conditional, pause, cancel).
      nl: Uitkomst van het besluit (doorgaan, voorwaardelijk, pauzeren, stoppen).
    persisted:
      column: outcome
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PROJECTPHASEDECISION
    osfType: referenceDataCode
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the decision in an external context.
      nl: Functionele of zakelijke code van het besluit in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: projectPhaseId
    label:
      en: Project phase
      nl: Projectfase
    persisted:
      column: project_phase_id
      storageClass: core
    osfType: ProjectPhase
    relationship:
      ownership: reference
  # System-written approval attribution: who decided, not an input.
  - key: decidedById
    readOnly: true
    label:
      en: Decided by
      nl: Besloten door
    persisted:
      column: decided_by_relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - ProjectDevelopment.All.Read
      - ProjectDevelopment.All.ReadWrite
    create:
      - ProjectDevelopment.All.ReadWrite
    update:
      - ProjectDevelopment.All.ReadWrite
    delete:
      - ProjectDevelopment.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Project Phase Decision
    description: List ProjectPhaseDecision records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Project Phase Decision
    description: Get ProjectPhaseDecision records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Project Phase Decision
    description: Create ProjectPhaseDecision records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update ProjectPhaseDecision records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /project-phase-decisions
          nl: /projectfasebesluiten
        columns:
          - key: outcome
            sortable: true
          - key: decidedAt
            sortable: true
        title:
          en: Project phase decisions
          nl: Projectfasebesluiten
        defaultSort:
          key: decidedAt
          direction: desc
      record:
        routes:
          read:
            en: /project-phase-decisions/:id
            nl: /projectfasebesluiten/:id
          create:
            en: /project-phase-decisions/create
            nl: /projectfasebesluiten/aanmaken
        title: "{{outcome}}"
        subtitle: "{{decidedAt}}"
        badges:
          - outcome
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Decision details
                    nl: Besluitgegevens
                  fields:
                    - outcome
                    - decidedAt
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create project phase decision
              nl: Projectfasebesluit aanmaken
            groups:
              - title:
                  en: Decision details
                  nl: Besluitgegevens
                fields:
                  - outcome
                  - decidedAt
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit project phase decision
              nl: Projectfasebesluit bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
      outcome:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PROJECTPHASEDECISION
            clearable: false
