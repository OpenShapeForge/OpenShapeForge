schemaVersion: 3
kind: coreEntity
module: core
entity: ProjectPhase
title: Project Phase
description: Sequenced phase within a project (e.g. initiation, definition, design, preparation, realisation, closure).
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Project phase
  nl: Projectfase
pluralLabels:
  en: Project phases
  nl: Projectfasen
domains:
  - project
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Phase code, unique within the project.
      nl: Fasecode, uniek binnen het project.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the phase.
      nl: Menselijk leesbare naam van de fase.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form description of the phase.
      nl: Vrije omschrijving van de fase.
    validation:
      maxLength: 1000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the phase.
      nl: Levenscyclusstatus van de fase.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PROJECTPHASESTATUS
    osfType: referenceDataCode
  - key: sequence
    osfType: integer
    required: true
    label:
      en: Sequence
      nl: Volgorde
    description:
      en: Sequential order of the phase within the project.
      nl: Volgnummer van de fase binnen het project.
    validation:
      min: 1
    persisted:
      column: sequence
      storageClass: core
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Planned or actual start date of the phase.
      nl: Geplande of werkelijke startdatum van de fase.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Planned or actual end date of the phase.
      nl: Geplande of werkelijke einddatum van de fase.
    persisted:
      column: end_date
      storageClass: core
  - key: projectId
    label:
      en: Project
      nl: Project
    persisted:
      column: project_id
      storageClass: core
    osfType: Project
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - ProjectDevelopment.All.Read
      - ProjectDevelopment.All.ReadWrite
    create:
      - ProjectDevelopment.All.ReadWrite
    update:
      - ProjectDevelopment.All.ReadWrite
    delete:
      - ProjectDevelopment.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Project Phase
    description: List ProjectPhase records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Project Phase
    description: Get ProjectPhase records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Project Phase
    description: Create ProjectPhase records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update ProjectPhase records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /project-phases
          nl: /projectfasen
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: sequence
            sortable: true
          - key: status
            sortable: true
          - key: startDate
            sortable: true
        title:
          en: Project phases
          nl: Projectfasen
        defaultSort:
          key: sequence
          direction: asc
      record:
        routes:
          read:
            en: /project-phases/:id
            nl: /projectfasen/:id
          create:
            en: /project-phases/create
            nl: /projectfasen/aanmaken
        title: "{{code}} {{name}}"
        subtitle: "{{status}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Phase details
                    nl: Fasegegevens
                  fields:
                    - code
                    - name
                    - status
                    - sequence
                - title:
                    en: Period
                    nl: Periode
                  fields:
                    - startDate
                    - endDate
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
        modes:
          create:
            title:
              en: Create project phase
              nl: Projectfase aanmaken
            groups:
              - title:
                  en: Phase details
                  nl: Fasegegevens
                fields:
                  - code
                  - name
                  - status
                  - sequence
              - title:
                  en: Period
                  nl: Periode
                fields:
                  - startDate
                  - endDate
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
          update:
            title:
              en: Edit project phase
              nl: Projectfase bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 1000
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PROJECTPHASESTATUS
            clearable: false
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
