schemaVersion: 3
kind: coreEntity
module: core
entity: ProjectRole
title: Project Role
description: Role assignment of a relation on a project, scoped to a role type and a validity period (canonical role pattern).
language: en
displayTemplate: "{{roleType}}"
filterField: roleType
labels:
  en: Project role
  nl: Projectrol
pluralLabels:
  en: Project roles
  nl: Projectrollen
domains:
  - project
fields:
  - key: roleType
    required: true
    label:
      en: Role type
      nl: Roltype
    description:
      en: Role this relation plays on the project (sponsor, lead, member, advisor, observer, stakeholder).
      nl: Rol die deze relatie op het project vervult (opdrachtgever, projectleider, lid, adviseur, toeschouwer, stakeholder).
    persisted:
      column: role_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PROJECTROLE
    osfType: referenceDataCode
  - key: status
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of this role assignment.
      nl: Levenscyclusstatus van deze roltoewijzing.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ROLEASSIGNMENTSTATUS
    osfType: referenceDataCode
  - key: name
    osfType: string
    required: false
    label:
      en: Name
      nl: Naam
    description:
      en: Optional human-readable name of the role assignment.
      nl: Optionele menselijk leesbare naam van de roltoewijzing.
    validation:
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the assignment.
      nl: Optionele omschrijving of zakelijke betekenis van de toewijzing.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which this role is effective on the project.
      nl: Datum vanaf wanneer deze rol op het project geldig is.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which this role is effective on the project.
      nl: Datum tot wanneer deze rol op het project geldig is.
    persisted:
      column: end_date
      storageClass: core
  - key: allocationPercentage
    osfType: number
    required: false
    label:
      en: Allocation percentage
      nl: Inzetpercentage
    description:
      en: Percentage of this relation's time allocated to this project role (0-100).
      nl: Percentage van de tijd van deze relatie dat aan deze projectrol is toegewezen (0-100).
    validation:
      min: 0
      max: 100
    persisted:
      column: allocation_percentage
      storageClass: core
  - key: hourlyRate
    required: false
    label:
      en: Hourly rate
      nl: Uurtarief
    description:
      en: Hourly rate for this role assignment, when timesheets feed billing.
      nl: Uurtarief voor deze roltoewijzing, wanneer urenstaten doorlopen naar facturering.
    osfType: currency
    persisted:
      column: hourly_rate
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the role assignment in an external context.
      nl: Functionele of zakelijke code van de roltoewijzing in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: projectId
    label:
      en: Project
      nl: Project
    persisted:
      column: project_id
      storageClass: core
    osfType: Project
    relationship:
      ownership: reference
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - ProjectDevelopment.All.Read
      - ProjectDevelopment.All.ReadWrite
    create:
      - ProjectDevelopment.All.ReadWrite
    update:
      - ProjectDevelopment.All.ReadWrite
    delete:
      - ProjectDevelopment.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Project Role
    description: List ProjectRole records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Project Role
    description: Get ProjectRole records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Project Role
    description: Create ProjectRole records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update ProjectRole records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /project-roles
          nl: /projectrollen
        columns:
          - key: roleType
            sortable: true
          - key: name
            sortable: true
          - key: status
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
        title:
          en: Project roles
          nl: Projectrollen
        defaultSort:
          key: startDate
          direction: desc
      record:
        routes:
          read:
            en: /project-roles/:id
            nl: /projectrollen/:id
          create:
            en: /project-roles/create
            nl: /projectrollen/aanmaken
        title: "{{name || roleType}}"
        subtitle: "{{status}}"
        badges:
          - roleType
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Role details
                    nl: Rolgegevens
                  fields:
                    - roleType
                    - status
                    - name
                    - startDate
                    - endDate
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Allocation and rate
                    nl: Inzet en tarief
                  fields:
                    - allocationPercentage
                    - hourlyRate
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create project role
              nl: Projectrol aanmaken
            groups:
              - title:
                  en: Role details
                  nl: Rolgegevens
                fields:
                  - roleType
                  - status
                  - name
                  - startDate
                  - endDate
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Allocation and rate
                  nl: Inzet en tarief
                fields:
                  - allocationPercentage
                  - hourlyRate
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit project role
              nl: Projectrol bewerken
    fields:
      roleType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PROJECTROLE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ROLEASSIGNMENTSTATUS
            clearable: true
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
