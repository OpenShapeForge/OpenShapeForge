schemaVersion: 3
kind: coreEntity
module: core
entity: ProjectSpending
title: Project Spending
description: Actual cost recorded against a project, optionally tied to a project task and a cost dimension.
language: en
displayTemplate: "{{description}}: {{amount}}"
filterField: description
labels:
  en: Project spending
  nl: Projectbesteding
pluralLabels:
  en: Project spendings
  nl: Projectbestedingen
domains:
  - project
fields:
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form description of the spending.
      nl: Vrije omschrijving van de besteding.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: spentAt
    osfType: date
    required: true
    label:
      en: Spent at
      nl: Bestedingsdatum
    description:
      en: Date on which the cost was incurred.
      nl: Datum waarop de kosten zijn gemaakt.
    persisted:
      column: spent_at
      storageClass: core
  - key: amount
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Actual amount spent on this line.
      nl: Werkelijk besteed bedrag voor deze regel.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: projectId
    label:
      en: Project
      nl: Project
    persisted:
      column: project_id
      storageClass: core
    osfType: Project
    relationship:
      ownership: reference
  - key: projectTaskId
    label:
      en: Project task
      nl: Projecttaak
    persisted:
      column: project_task_id
      storageClass: core
    osfType: ProjectTask
    relationship:
      ownership: reference
  - key: ledgerAccountId
    label:
      en: Ledger account
      nl: Grootboekrekening
    persisted:
      column: ledger_account_id
      storageClass: core
    osfType: LedgerAccount
    relationship:
      ownership: reference
  - key: costDimensionId
    label:
      en: Cost dimension
      nl: Kostendimensie
    persisted:
      column: cost_dimension_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - ProjectDevelopment.All.Read
      - ProjectDevelopment.All.ReadWrite
    create:
      - ProjectDevelopment.All.ReadWrite
    update:
      - ProjectDevelopment.All.ReadWrite
    delete:
      - ProjectDevelopment.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Project Spending
    description: List ProjectSpending records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Project Spending
    description: Get ProjectSpending records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Project Spending
    description: Create ProjectSpending records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update ProjectSpending records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /project-spendings
          nl: /projectbestedingen
        columns:
          - key: spentAt
            sortable: true
          - key: description
            sortable: true
          - key: amount
            sortable: true
        title:
          en: Project spendings
          nl: Projectbestedingen
        defaultSort:
          key: spentAt
          direction: desc
      record:
        routes:
          read:
            en: /project-spendings/:id
            nl: /projectbestedingen/:id
          create:
            en: /project-spendings/create
            nl: /projectbestedingen/aanmaken
        title: "{{description}}"
        subtitle: "{{amount}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Spending details
                    nl: Bestedingsgegevens
                  fields:
                    - description
                    - spentAt
                    - amount
        modes:
          create:
            title:
              en: Create project spending
              nl: Projectbesteding aanmaken
            groups:
              - title:
                  en: Spending details
                  nl: Bestedingsgegevens
                fields:
                  - description
                  - spentAt
                  - amount
          update:
            title:
              en: Edit project spending
              nl: Projectbesteding bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 500
      spentAt:
        render:
          component: DatePicker
          props: {}
