schemaVersion: 3
kind: coreEntity
module: core
entity: ProjectTask
title: Project Task
description: Task within a project, optionally scoped to a phase and assigned to a relation.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Project task
  nl: Projecttaak
domains:
  - project
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Task code, unique within the project.
      nl: Taakcode, uniek binnen het project.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the task.
      nl: Menselijk leesbare naam van de taak.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Detailed description of the task.
      nl: Uitgebreide omschrijving van de taak.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the task.
      nl: Levenscyclusstatus van de taak.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PROJECTTASKSTATUS
    osfType: referenceDataCode
  - key: priority
    required: false
    label:
      en: Priority
      nl: Prioriteit
    description:
      en: Priority of the task.
      nl: Prioriteit van de taak.
    persisted:
      column: priority
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: MAINTENANCEPRIORITY
    osfType: referenceDataCode
  - key: plannedStartDate
    osfType: date
    required: false
    label:
      en: Planned start date
      nl: Geplande startdatum
    description:
      en: Date on which the task is planned to start.
      nl: Datum waarop de taak gepland staat te starten.
    persisted:
      column: planned_start_date
      storageClass: core
  - key: plannedEndDate
    osfType: date
    required: false
    label:
      en: Planned end date
      nl: Geplande einddatum
    description:
      en: Date on which the task is planned to end.
      nl: Datum waarop de taak gepland staat te eindigen.
    persisted:
      column: planned_end_date
      storageClass: core
  - key: actualStartDate
    osfType: date
    required: false
    label:
      en: Actual start date
      nl: Werkelijke startdatum
    description:
      en: Date on which the task actually started.
      nl: Datum waarop de taak daadwerkelijk is gestart.
    persisted:
      column: actual_start_date
      storageClass: core
  - key: actualEndDate
    osfType: date
    required: false
    label:
      en: Actual end date
      nl: Werkelijke einddatum
    description:
      en: Date on which the task actually ended.
      nl: Datum waarop de taak daadwerkelijk is geëindigd.
    persisted:
      column: actual_end_date
      storageClass: core
  - key: projectId
    label:
      en: Project
      nl: Project
    persisted:
      column: project_id
      storageClass: core
    osfType: Project
    relationship:
      ownership: reference
  - key: projectPhaseId
    label:
      en: Project phase
      nl: Projectfase
    persisted:
      column: project_phase_id
      storageClass: core
    osfType: ProjectPhase
    relationship:
      ownership: reference
  - key: assignedToId
    label:
      en: Assigned to
      nl: Toegewezen aan
    persisted:
      column: assigned_to_relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - ProjectDevelopment.All.Read
      - ProjectDevelopment.All.ReadWrite
    create:
      - ProjectDevelopment.All.ReadWrite
    update:
      - ProjectDevelopment.All.ReadWrite
    delete:
      - ProjectDevelopment.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Project Task
    description: List ProjectTask records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Project Task
    description: Get ProjectTask records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Project Task
    description: Create ProjectTask records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update ProjectTask records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /project-tasks
          nl: /projecttaken
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: status
            sortable: true
          - key: priority
            sortable: true
          - key: plannedStartDate
            sortable: true
        title:
          en: Project tasks
          nl: Projecttaken
        defaultSort:
          key: plannedStartDate
          direction: asc
      record:
        routes:
          read:
            en: /project-tasks/:id
            nl: /projecttaken/:id
          create:
            en: /project-tasks/create
            nl: /projecttaken/aanmaken
        title: "{{code}} {{name}}"
        subtitle: "{{status}}"
        badges:
          - status
          - priority
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Task details
                    nl: Taakgegevens
                  fields:
                    - code
                    - name
                    - status
                    - priority
                - title:
                    en: Planning
                    nl: Planning
                  fields:
                    - plannedStartDate
                    - plannedEndDate
                    - actualStartDate
                    - actualEndDate
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
        modes:
          create:
            title:
              en: Create project task
              nl: Projecttaak aanmaken
            groups:
              - title:
                  en: Task details
                  nl: Taakgegevens
                fields:
                  - code
                  - name
                  - status
                  - priority
              - title:
                  en: Planning
                  nl: Planning
                fields:
                  - plannedStartDate
                  - plannedEndDate
                  - actualStartDate
                  - actualEndDate
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
          update:
            title:
              en: Edit project task
              nl: Projecttaak bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PROJECTTASKSTATUS
            clearable: false
      priority:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: MAINTENANCEPRIORITY
            clearable: true
      plannedStartDate:
        render:
          component: DatePicker
          props: {}
      plannedEndDate:
        render:
          component: DatePicker
          props: {}
      actualStartDate:
        render:
          component: DatePicker
          props: {}
      actualEndDate:
        render:
          component: DatePicker
          props: {}
