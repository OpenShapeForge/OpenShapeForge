schemaVersion: 3
kind: coreEntity
module: core
entity: Project
title: Project
description: Project — top-level container for project-development work, with phases, tasks, roles, budget, and orders.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Project
  nl: Project
domains:
  - project
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique short code identifying the project.
      nl: Tenant-unieke korte code die het project identificeert.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the project.
      nl: Menselijk leesbare naam van het project.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form description of the project.
      nl: Vrije omschrijving van het project.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: status
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Current project status (mirrors the active phase status).
      nl: Huidige projectstatus (spiegelt de status van de actieve fase).
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PROJECTPHASESTATUS
    osfType: referenceDataCode
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Planned or actual start date of the project.
      nl: Geplande of werkelijke startdatum van het project.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Planned or actual end date of the project.
      nl: Geplande of werkelijke einddatum van het project.
    persisted:
      column: end_date
      storageClass: core
  - key: currencyCode
    osfType: string
    required: true
    label:
      en: Currency
      nl: Valuta
    description:
      en: ISO 4217 currency code for the project amounts.
      nl: ISO 4217 valutacode voor de bedragen op het project.
    defaultValue: EUR
    validation:
      minLength: 3
      maxLength: 3
    persisted:
      column: currency_code
      storageClass: core
  - key: budgetTotal
    required: false
    label:
      en: Budget total
      nl: Totaalbudget
    description:
      en: Total budgeted amount for the project.
      nl: Totaal begroot bedrag voor het project.
    osfType: currency
    persisted:
      column: budget_total
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the project in an external context.
      nl: Functionele of zakelijke code van het project in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: parentProjectId
    label:
      en: Parent project
      nl: Bovenliggend project
    persisted:
      column: parent_project_id
      storageClass: core
    osfType: Project
    relationship:
      ownership: reference
  - key: costDimensionId
    label:
      en: Cost dimension
      nl: Kostendimensie
    persisted:
      column: cost_dimension_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - ProjectDevelopment.All.Read
      - ProjectDevelopment.All.ReadWrite
    create:
      - ProjectDevelopment.All.ReadWrite
    update:
      - ProjectDevelopment.All.ReadWrite
    delete:
      - ProjectDevelopment.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Project
    description: List Project records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Project
    description: Get Project records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Project
    description: Create Project records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Project records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /projects
          nl: /projecten
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: status
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
        title:
          en: Projects
          nl: Projecten
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /projects/:id
            nl: /projecten/:id
          create:
            en: /projects/create
            nl: /projecten/aanmaken
        title: "{{name}}"
        subtitle: "{{code}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Project details
                    nl: Projectgegevens
                  fields:
                    - code
                    - name
                    - status
                - title:
                    en: Period
                    nl: Periode
                  fields:
                    - startDate
                    - endDate
                - title:
                    en: Budget
                    nl: Budget
                  fields:
                    - currencyCode
                    - budgetTotal
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create project
              nl: Project aanmaken
            groups:
              - title:
                  en: Project details
                  nl: Projectgegevens
                fields:
                  - code
                  - name
                  - status
              - title:
                  en: Period
                  nl: Periode
                fields:
                  - startDate
                  - endDate
              - title:
                  en: Budget
                  nl: Budget
                fields:
                  - currencyCode
                  - budgetTotal
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit project
              nl: Project bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PROJECTPHASESTATUS
            clearable: true
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
