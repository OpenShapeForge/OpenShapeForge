schemaVersion: 3
kind: coreEntity
module: core
entity: PurchaseOrderLine
title: Purchase Order Line
description: Line item on a purchase order — same shape as an invoice line, with FK to PurchaseOrder instead of Invoice.
language: en
displayTemplate: "{{description}}"
filterField: description
labels:
  en: Purchase order line
  nl: Inkoopopdrachtregel
pluralLabels:
  en: Purchase order lines
  nl: Inkoopopdrachtregels
domains:
  - finance
fields:
  - key: lineNumber
    osfType: integer
    required: true
    label:
      en: Line number
      nl: Regelnummer
    description:
      en: Sequential line number within the purchase order.
      nl: Volgnummer van de regel binnen de inkoopopdracht.
    validation:
      min: 1
    persisted:
      column: line_number
      storageClass: core
  - key: description
    required: true
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Description of what is being purchased on this line.
      nl: Omschrijving van wat op deze regel wordt ingekocht.
    validation:
      minLength: 1
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: quantity
    osfType: number
    required: false
    label:
      en: Quantity
      nl: Aantal
    description:
      en: Quantity for this line (multiplied by unit price to compute base).
      nl: Aantal voor deze regel (vermenigvuldigd met eenheidsprijs voor basisbedrag).
    persisted:
      column: quantity
      storageClass: core
  - key: unitId
    osfType: string
    required: false
    label:
      en: Unit
      nl: Eenheid
    description:
      en: Free-form unit identifier for this line (e.g. "Day", "Hour").
      nl: Vrije eenheidsaanduiding voor deze regel (bv. "Dag", "Uur").
    validation:
      maxLength: 50
    persisted:
      column: unit_id
      storageClass: core
  - key: unitPrice
    required: false
    label:
      en: Unit price
      nl: Eenheidsprijs
    description:
      en: Price per unit, excluding VAT.
      nl: Prijs per eenheid, exclusief BTW.
    osfType: currency
    persisted:
      column: unit_price
      storageClass: core
  - key: amountBase
    required: false
    label:
      en: Base amount
      nl: Basisbedrag
    description:
      en: Net amount excluding VAT for this line.
      nl: Nettobedrag excl. BTW voor deze regel.
    osfType: currency
    persisted:
      column: amount_base
      storageClass: core
  - key: amountVat
    required: false
    label:
      en: VAT amount
      nl: BTW-bedrag
    description:
      en: VAT amount for this line.
      nl: BTW-bedrag voor deze regel.
    osfType: currency
    persisted:
      column: amount_vat
      storageClass: core
  - key: amountTotal
    required: false
    label:
      en: Total amount
      nl: Totaalbedrag
    description:
      en: Total amount including VAT for this line.
      nl: Totaalbedrag incl. BTW voor deze regel.
    osfType: currency
    persisted:
      column: amount_total
      storageClass: core
  - key: purchaseOrderId
    label:
      en: Purchase order
      nl: Inkoopopdracht
    persisted:
      column: purchase_order_id
      storageClass: core
    osfType: PurchaseOrder
    relationship:
      ownership: reference
  - key: agreementComponentId
    label:
      en: Agreement component
      nl: Overeenkomstcomponent
    persisted:
      column: agreement_component_id
      storageClass: core
    osfType: AgreementComponent
    relationship:
      ownership: reference
  - key: vatRateId
    label:
      en: VAT rate
      nl: BTW-tarief
    persisted:
      column: vat_rate_id
      storageClass: core
    osfType: VatRate
    relationship:
      ownership: reference
  - key: ledgerAccountId
    label:
      en: Ledger account
      nl: Grootboekrekening
    persisted:
      column: ledger_account_id
      storageClass: core
    osfType: LedgerAccount
    relationship:
      ownership: reference
  - key: componentDimensionId
    label:
      en: Component dimension
      nl: Componentdimensie
    persisted:
      column: component_dimension_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
  - key: dimension1Id
    label:
      en: Cost dimension 1
      nl: Kostendimensie 1
    persisted:
      column: dimension_1_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
  - key: dimension2Id
    label:
      en: Cost dimension 2
      nl: Kostendimensie 2
    persisted:
      column: dimension_2_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
  - key: vatDimensionId
    label:
      en: VAT dimension
      nl: BTW-dimensie
    persisted:
      column: vat_dimension_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Purchase Order Line
    description: List PurchaseOrderLine records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Purchase Order Line
    description: Get PurchaseOrderLine records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Purchase Order Line
    description: Create PurchaseOrderLine records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update PurchaseOrderLine records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /purchase-order-lines
          nl: /inkoopopdrachtregels
        columns:
          - key: lineNumber
            sortable: true
          - key: description
            sortable: true
          - key: quantity
            sortable: true
          - key: unitPrice
            sortable: true
          - key: amountTotal
            sortable: true
        title:
          en: Purchase order lines
          nl: Inkoopopdrachtregels
        defaultSort:
          key: lineNumber
          direction: asc
      record:
        routes:
          read:
            en: /purchase-order-lines/:id
            nl: /inkoopopdrachtregels/:id
          create:
            en: /purchase-order-lines/create
            nl: /inkoopopdrachtregels/aanmaken
        title: "{{description}}"
        subtitle: "{{amountTotal}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Line details
                    nl: Regelgegevens
                  fields:
                    - lineNumber
                    - description
                    - quantity
                    - unitId
                    - unitPrice
                - title:
                    en: Amounts
                    nl: Bedragen
                  fields:
                    - amountBase
                    - amountVat
                    - amountTotal
        modes:
          create:
            title:
              en: Create purchase order line
              nl: Inkoopopdrachtregel aanmaken
            groups:
              - title:
                  en: Line details
                  nl: Regelgegevens
                fields:
                  - lineNumber
                  - description
                  - quantity
                  - unitId
                  - unitPrice
              - title:
                  en: Amounts
                  nl: Bedragen
                fields:
                  - amountBase
                  - amountVat
                  - amountTotal
          update:
            title:
              en: Edit purchase order line
              nl: Inkoopopdrachtregel bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 2000
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
