schemaVersion: 3
kind: coreEntity
module: core
entity: PurchaseOrder
title: Purchase Order
description: Outgoing purchase order to a supplier relation, optionally linked to an agreement. Mirrors the Quote
  workflow on the supplier side.
language: en
displayTemplate: "{{purchaseOrderNumber}}"
filterField: purchaseOrderNumber
labels:
  en: Purchase order
  nl: Inkoopopdracht
pluralLabels:
  en: Purchase orders
  nl: Inkoopopdrachten
domains:
  - finance
fields:
  - key: purchaseOrderStatus
    required: true
    label:
      en: Purchase order status
      nl: Inkoopopdrachtstatus
    description:
      en: Lifecycle status of the purchase order.
      nl: Levenscyclusstatus van de inkoopopdracht.
    persisted:
      column: purchase_order_status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: PURCHASEORDERSTATUS
    osfType: referenceDataCode
  - key: purchaseOrderNumber
    osfType: string
    required: true
    label:
      en: Purchase order number
      nl: Inkoopopdrachtnummer
    description:
      en: Tenant-unique purchase order number. Stored as a string so the format may differ from invoice numbers.
      nl: Tenant-uniek inkoopopdrachtnummer. Wordt als tekst opgeslagen zodat het formaat kan afwijken van factuurnummers.
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: purchase_order_number
      storageClass: core
  - key: issueDate
    osfType: date
    required: true
    label:
      en: Issue date
      nl: Opdrachtdatum
    description:
      en: Date the purchase order was issued.
      nl: Datum waarop de inkoopopdracht is uitgegeven.
    persisted:
      column: issue_date
      storageClass: core
  - key: expectedDeliveryDate
    osfType: date
    required: false
    label:
      en: Expected delivery date
      nl: Verwachte leverdatum
    description:
      en: Date on which delivery is expected from the supplier.
      nl: Datum waarop levering door de leverancier wordt verwacht.
    persisted:
      column: expected_delivery_date
      storageClass: core
  - key: currencyCode
    osfType: string
    required: true
    label:
      en: Currency
      nl: Valuta
    description:
      en: ISO 4217 currency code in which the purchase order is denominated.
      nl: ISO 4217 valutacode waarin de inkoopopdracht luidt.
    defaultValue: EUR
    validation:
      minLength: 3
      maxLength: 3
    persisted:
      column: currency_code
      storageClass: core
  - key: amountBase
    required: false
    label:
      en: Base amount
      nl: Basisbedrag
    description:
      en: Sum of line base amounts, excluding VAT.
      nl: Som van de basisbedragen van de regels, exclusief BTW.
    osfType: currency
    persisted:
      column: amount_base
      storageClass: core
  - key: amountVat
    required: false
    label:
      en: VAT amount
      nl: BTW-bedrag
    description:
      en: Sum of VAT amounts on the purchase order.
      nl: Som van de BTW-bedragen op de inkoopopdracht.
    osfType: currency
    persisted:
      column: amount_vat
      storageClass: core
  - key: amountTotal
    required: false
    label:
      en: Total amount
      nl: Totaalbedrag
    description:
      en: Total purchase order amount including VAT.
      nl: Totaalbedrag van de inkoopopdracht inclusief BTW.
    osfType: currency
    persisted:
      column: amount_total
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form description of the purchase order.
      nl: Vrije omschrijving van de inkoopopdracht.
    validation:
      maxLength: 1000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the purchase order in an external context.
      nl: Functionele of zakelijke code van de inkoopopdracht in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  - key: agreementId
    label:
      en: Agreement
      nl: Overeenkomst
    persisted:
      column: agreement_id
      storageClass: core
    osfType: Agreement
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Purchase Order
    description: List PurchaseOrder records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Purchase Order
    description: Get PurchaseOrder records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Purchase Order
    description: Create PurchaseOrder records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update PurchaseOrder records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /purchase-orders
          nl: /inkoopopdrachten
        columns:
          - key: purchaseOrderNumber
            sortable: true
          - key: purchaseOrderStatus
            sortable: true
          - key: issueDate
            sortable: true
          - key: expectedDeliveryDate
            sortable: true
          - key: amountTotal
            sortable: true
        title:
          en: Purchase orders
          nl: Inkoopopdrachten
        defaultSort:
          key: issueDate
          direction: desc
      record:
        routes:
          read:
            en: /purchase-orders/:id
            nl: /inkoopopdrachten/:id
          create:
            en: /purchase-orders/create
            nl: /inkoopopdrachten/aanmaken
        title: "{{purchaseOrderNumber}}"
        subtitle: "{{amountTotal}}"
        badges:
          - purchaseOrderStatus
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Purchase order details
                    nl: Inkoopopdrachtgegevens
                  fields:
                    - purchaseOrderStatus
                    - purchaseOrderNumber
                    - issueDate
                    - expectedDeliveryDate
                    - currencyCode
                - title:
                    en: Amounts
                    nl: Bedragen
                  fields:
                    - amountBase
                    - amountVat
                    - amountTotal
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create purchase order
              nl: Inkoopopdracht aanmaken
            groups:
              - title:
                  en: Purchase order details
                  nl: Inkoopopdrachtgegevens
                fields:
                  - purchaseOrderStatus
                  - purchaseOrderNumber
                  - issueDate
                  - expectedDeliveryDate
                  - currencyCode
              - title:
                  en: Amounts
                  nl: Bedragen
                fields:
                  - amountBase
                  - amountVat
                  - amountTotal
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit purchase order
              nl: Inkoopopdracht bewerken
    fields:
      purchaseOrderStatus:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: PURCHASEORDERSTATUS
            clearable: false
      issueDate:
        render:
          component: DatePicker
          props: {}
      expectedDeliveryDate:
        render:
          component: DatePicker
          props: {}
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 1000
