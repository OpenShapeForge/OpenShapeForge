schemaVersion: 3
kind: coreEntity
module: core
entity: QualityMeasurementRequest
title: Quality Measurement Request
description: A request to perform a quality measurement, linking a relation to a research assignment and its results.
language: en
displayTemplate: "{{title}}"
filterField: title
labels:
  en: Quality Measurement Request
  nl: Kwaliteitsmetingsverzoek
pluralLabels:
  en: Quality measurement requests
  nl: Kwaliteitsmetingsverzoeken
domains:
  - quality
retention:
  mode: policyRef
  policy: quality-retain-7y
  scope: record
  startsFrom:
    strategy: firstNonNull
    fields:
      - closedAt
      - createdAt
authorization:
  roles:
    read:
      - Quality.All.Read
      - Quality.All.ReadWrite
    create:
      - Quality.All.ReadWrite
    update:
      - Quality.All.ReadWrite
    delete:
      - Quality.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Human-readable request code.
      nl: Menselijk leesbare verzoekcode.
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: code
      storageClass: core
  - key: title
    osfType: string
    required: false
    label:
      en: Title
      nl: Titel
    description:
      en: Short title of the measurement request.
      nl: Korte titel van het metingsverzoek.
    validation:
      maxLength: 300
    persisted:
      column: title
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Detailed description of the quality measurement request.
      nl: Uitgebreide omschrijving van het kwaliteitsmetingsverzoek.
    validation:
      maxLength: 4000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: measurementKind
    required: false
    label:
      en: Kind
      nl: Soort
    description:
      en: Classification of the measurement request.
      nl: Classificatie van het metingsverzoek.
    persisted:
      column: measurement_kind
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: QUALITYMEASUREMENTKIND
    osfType: referenceDataCode
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Current lifecycle status of the measurement request.
      nl: Huidige levenscyclusstatus van het metingsverzoek.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: QUALITYMEASUREMENTSTATUS
    osfType: referenceDataCode
  - key: closedAt
    osfType: datetime
    required: false
    readOnly: true
    label:
      en: Closed at
      nl: Gesloten op
    description:
      en: Timestamp when the request was closed.
      nl: Tijdstip waarop het verzoek is gesloten.
    persisted:
      column: closed_at
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional code in a connected source system.
      nl: Functionele code in een gekoppeld bronsysteem.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: targetRelationId
    label:
      en: Target relation
      nl: Te enquêteren relatie
    persisted:
      column: target_relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  - key: researchAssignmentId
    label:
      en: Research assignment
      nl: Onderzoeksopdracht
    persisted:
      column: research_assignment_id
      storageClass: core
    osfType: ResearchAssignment
    relationship:
      ownership: reference
      inverse:
        key: measurementRequests
        label:
          en: Measurement requests
          nl: Metingsverzoeken
  - key: measurementResultId
    label:
      en: Measurement result
      nl: Metingsresultaat
    persisted:
      column: measurement_result_id
      storageClass: core
    osfType: QualityMeasurementResult
    relationship:
      ownership: reference
  - key: caseId
    label:
      en: Related case
      nl: Gerelateerde zaak
    persisted:
      column: case_id
      storageClass: core
    osfType: Case
    relationship:
      ownership: reference
  - key: contactMomentId
    label:
      en: Contact moment
      nl: Contactmoment
    persisted:
      column: contact_moment_id
      storageClass: core
    osfType: ContactMoment
    relationship:
      ownership: reference
operations:
  list:
    name: List Quality Measurement Request
    description: List QualityMeasurementRequest records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Quality Measurement Request
    description: Get QualityMeasurementRequest records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Quality Measurement Request
    description: Create QualityMeasurementRequest records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Quality Measurement Request
    description: Update QualityMeasurementRequest records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Quality Measurement Request
    description: Delete QualityMeasurementRequest records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
        wait: true
  web:
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 4000
      measurementKind:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: QUALITYMEASUREMENTKIND
            clearable: true
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: QUALITYMEASUREMENTSTATUS
            clearable: false
      closedAt:
        render:
          component: DateTimePicker
          props: {}
