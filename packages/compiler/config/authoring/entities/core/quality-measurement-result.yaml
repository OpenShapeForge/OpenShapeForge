schemaVersion: 3
kind: coreEntity
module: core
entity: QualityMeasurementResult
title: Quality Measurement Result
description: The outcome of a quality measurement, capturing assessment scale, value, and response status.
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Quality Measurement Result
  nl: Kwaliteitsmetingsresultaat
pluralLabels:
  en: Quality measurement results
  nl: Kwaliteitsmetingsresultaten
domains:
  - quality
retention:
  mode: policyRef
  policy: quality-retain-7y
  scope: record
  startsFrom:
    strategy: field
    field: responseDate
authorization:
  roles:
    read:
      - Quality.All.Read
      - Quality.All.ReadWrite
    create:
      - Quality.All.ReadWrite
    update:
      - Quality.All.ReadWrite
    delete:
      - Quality.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    osfType: string
    required: false
    label:
      en: Code
      nl: Code
    description:
      en: Human-readable result code.
      nl: Menselijk leesbare resultaatcode.
    validation:
      maxLength: 100
    persisted:
      column: code
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Brief description of the measurement result.
      nl: Beknopte omschrijving van het metingsresultaat.
    validation:
      maxLength: 4000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: assessmentScale
    required: false
    label:
      en: Assessment scale
      nl: Beoordelingsschaal
    description:
      en: Scale or method used to measure the response.
      nl: Schaal of methodiek waarmee de reactie is gemeten.
    persisted:
      column: assessment_scale
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ASSESSMENTSCALE
    osfType: referenceDataCode
  - key: assessmentValue
    osfType: string
    required: false
    label:
      en: Assessment value
      nl: Beoordelingswaarde
    description:
      en: Measured value on the specified assessment scale.
      nl: Gemeten waarde op de opgegeven beoordelingsschaal.
    validation:
      maxLength: 200
    persisted:
      column: assessment_value
      storageClass: core
  - key: responseDate
    osfType: date
    required: false
    label:
      en: Response date
      nl: Reactiedatum
    description:
      en: Date when the response was received.
      nl: Datum waarop de reactie is ontvangen.
    persisted:
      column: response_date
      storageClass: core
  - key: responseStatus
    required: false
    label:
      en: Response status
      nl: Reactiestatus
    description:
      en: Response completeness status.
      nl: Reactiecompleetheidstatus.
    persisted:
      column: response_status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: RESULTRESPONSE
    osfType: referenceDataCode
  - key: assessmentExplanation
    required: false
    label:
      en: Explanation
      nl: Toelichting
    description:
      en: Brief explanation of the assessment.
      nl: Korte toelichting bij de beoordeling.
    validation:
      maxLength: 4000
    persisted:
      column: assessment_explanation
      storageClass: core
    osfType: multilineText
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional code in a connected source system.
      nl: Functionele code in een gekoppeld bronsysteem.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: measurementRequestId
    label:
      en: Measurement request
      nl: Metingsverzoek
    persisted:
      column: measurement_request_id
      storageClass: core
    osfType: QualityMeasurementRequest
    relationship:
      ownership: reference
  - key: researchAssignmentId
    label:
      en: Research assignment
      nl: Onderzoeksopdracht
    persisted:
      column: research_assignment_id
      storageClass: core
    osfType: ResearchAssignment
    relationship:
      ownership: reference
operations:
  list:
    name: List Quality Measurement Result
    description: List QualityMeasurementResult records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Quality Measurement Result
    description: Get QualityMeasurementResult records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Quality Measurement Result
    description: Create QualityMeasurementResult records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Quality Measurement Result
    description: Update QualityMeasurementResult records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Quality Measurement Result
    description: Delete QualityMeasurementResult records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  web:
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 4000
      assessmentScale:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ASSESSMENTSCALE
            clearable: true
      responseDate:
        render:
          component: DatePicker
          props: {}
      responseStatus:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: RESULTRESPONSE
            clearable: true
      assessmentExplanation:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 4000
