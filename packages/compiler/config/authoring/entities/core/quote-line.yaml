schemaVersion: 3
kind: coreEntity
module: core
entity: QuoteLine
title: Quote Line
description: Line item on a quote — same shape as an invoice line, with FK to Quote instead of Invoice.
language: en
displayTemplate: "{{description}}"
filterField: description
labels:
  en: Quote line
  nl: Offerteregel
pluralLabels:
  en: Quote lines
  nl: Offerteregels
domains:
  - finance
fields:
  - key: lineNumber
    osfType: integer
    required: true
    label:
      en: Line number
      nl: Regelnummer
    description:
      en: Sequential line number within the quote.
      nl: Volgnummer van de regel binnen de offerte.
    validation:
      min: 1
    persisted:
      column: line_number
      storageClass: core
  - key: description
    osfType: multilineText
    required: true
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Description of what is being quoted on this line.
      nl: Omschrijving van wat op deze regel wordt geoffreerd.
    validation:
      minLength: 1
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
  - key: quantity
    osfType: number
    required: false
    label:
      en: Quantity
      nl: Aantal
    description:
      en: Quantity for this line (multiplied by unit price to compute base).
      nl: Aantal voor deze regel (vermenigvuldigd met eenheidsprijs voor basisbedrag).
    persisted:
      column: quantity
      storageClass: core
  - key: unitId
    osfType: string
    required: false
    label:
      en: Unit
      nl: Eenheid
    description:
      en: Free-form unit identifier for this line (e.g. "Day", "Hour").
      nl: Vrije eenheidsaanduiding voor deze regel (bv. "Dag", "Uur").
    validation:
      maxLength: 50
    persisted:
      column: unit_id
      storageClass: core
  - key: unitPrice
    required: false
    label:
      en: Unit price
      nl: Eenheidsprijs
    description:
      en: Price per unit, excluding VAT.
      nl: Prijs per eenheid, exclusief BTW.
    osfType: currency
    persisted:
      column: unit_price
      storageClass: core
  - key: amountBase
    required: false
    label:
      en: Base amount
      nl: Basisbedrag
    description:
      en: Net amount excluding VAT for this line.
      nl: Nettobedrag excl. BTW voor deze regel.
    osfType: currency
    persisted:
      column: amount_base
      storageClass: core
  - key: amountVat
    required: false
    label:
      en: VAT amount
      nl: BTW-bedrag
    description:
      en: VAT amount for this line.
      nl: BTW-bedrag voor deze regel.
    osfType: currency
    persisted:
      column: amount_vat
      storageClass: core
  - key: amountTotal
    required: false
    label:
      en: Total amount
      nl: Totaalbedrag
    description:
      en: Total amount including VAT for this line.
      nl: Totaalbedrag incl. BTW voor deze regel.
    osfType: currency
    persisted:
      column: amount_total
      storageClass: core
  - key: quoteId
    label:
      en: Quote
      nl: Offerte
    persisted:
      column: quote_id
      storageClass: core
    osfType: Quote
    relationship:
      ownership: reference
  - key: agreementComponentId
    label:
      en: Agreement component
      nl: Overeenkomstcomponent
    persisted:
      column: agreement_component_id
      storageClass: core
    osfType: AgreementComponent
    relationship:
      ownership: reference
  - key: vatRateId
    label:
      en: VAT rate
      nl: BTW-tarief
    persisted:
      column: vat_rate_id
      storageClass: core
    osfType: VatRate
    relationship:
      ownership: reference
  - key: ledgerAccountId
    label:
      en: Ledger account
      nl: Grootboekrekening
    persisted:
      column: ledger_account_id
      storageClass: core
    osfType: LedgerAccount
    relationship:
      ownership: reference
  - key: componentDimensionId
    label:
      en: Component dimension
      nl: Componentdimensie
    persisted:
      column: component_dimension_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
  - key: dimension1Id
    label:
      en: Cost dimension 1
      nl: Kostendimensie 1
    persisted:
      column: dimension_1_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
  - key: dimension2Id
    label:
      en: Cost dimension 2
      nl: Kostendimensie 2
    persisted:
      column: dimension_2_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
  - key: vatDimensionId
    label:
      en: VAT dimension
      nl: BTW-dimensie
    persisted:
      column: vat_dimension_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
      inverse: false
operations:
  list:
    name: { en: List quote lines, nl: Offerteregels tonen }
    description:
      {
        en: Returns a filtered and sorted page of quote lines.,
        nl: Geeft een gefilterde en gesorteerde pagina met offerteregels terug.
      }
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  get:
    name: { en: Get quote line, nl: Offerteregel ophalen }
    description: { en: Returns one quote line by its canonical id., nl: Geeft één offerteregel terug op basis van het canonieke id. }
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  create:
    name: { en: Create quote line, nl: Offerteregel aanmaken }
    description:
      {
        en: Creates one quote line after validating its canonical fields.,
        nl: Maakt één offerteregel aan na validatie van de canonieke velden.
      }
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    confirmation: { mode: none }
  update:
    name: { en: Update quote line, nl: Offerteregel wijzigen }
    description:
      {
        en: Updates one quote line while holding its server-issued edit lease and current version.,
        nl: Wijzigt één offerteregel met de server-uitgegeven bewerkingslease en actuele versie.
      }
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation: { mode: none }
  delete:
    name: { en: Delete quote line, nl: Offerteregel verwijderen }
    description:
      {
        en: Permanently deletes one quote line after a server-issued version-bound confirmation challenge.,
        nl: Verwijdert één offerteregel definitief na een server-uitgegeven versiegebonden bevestigingsvraag.
      }
    implementation: { type: entity, action: delete }
    effects: { data: delete, external: none }
    reliability:
      idempotency: { mode: natural }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation:
      mode: challenge
      challenge:
        kind: type-current-field
        field: description
        issuedBy: server
        bindTo: [ subject, tenant, operation, target.id, target.version ]
        expiresAfter: PT5M
        singleUse: true

interfaces:
  rest: {}
  graphql: {}
  mcp:
    tools: generic
    resource:
      uri: app://quote-lines
      name: Quote lines
      description: Read the quote lines available to the signed-in identity.
      templateDescription: Read one quote line by its canonical id.
  web:
    views:
      collection:
        route: { en: /quote-lines, nl: /offerteregels }
        title: { en: Quote lines, nl: Offerteregels }
        columns:
          - { key: lineNumber, sortable: true }
          - { key: description, sortable: true }
          - { key: quantity, sortable: true }
          - { key: unitPrice, sortable: true }
          - { key: amountTotal, sortable: true }
        defaultSort: { key: lineNumber, direction: asc }
      record:
        routes:
          read: { en: /quote-lines/:id, nl: /offerteregels/:id }
          create: { en: /quote-lines/new, nl: /offerteregels/nieuw }
        title: "{{description}}"
        subtitle: "{{amountTotal}}"
        actions: [ update, delete ]
        layout:
          context:
            fields: [ lineNumber, quantity, unitPrice, amountTotal ]
            relationships: [ quoteId, agreementComponentId, vatRateId ]
          tabs:
            - id: overview
              label: { en: Overview, nl: Overzicht }
              groups:
                - title: { en: Line details, nl: Regelgegevens }
                  fields: [ lineNumber, description, quantity, unitId, unitPrice ]
                - title: { en: Amounts, nl: Bedragen }
                  fields: [ amountBase, amountVat, amountTotal ]
        modes:
          create:
            title: { en: Create quote line, nl: Offerteregel aanmaken }
            groups:
              - title: { en: Line details, nl: Regelgegevens }
                fields: [ lineNumber, description, quantity, unitId, unitPrice ]
              - title: { en: Amounts, nl: Bedragen }
                fields: [ amountBase, amountVat, amountTotal ]
          update:
            title: { en: Update quote line, nl: Offerteregel wijzigen }
            groups:
              - title: { en: Line details, nl: Regelgegevens }
                fields: [ lineNumber, description, quantity, unitId, unitPrice ]
              - title: { en: Amounts, nl: Bedragen }
                fields: [ amountBase, amountVat, amountTotal ]
# Finance.QuoteLines.Read / Finance.QuoteLines.ReadWrite are the per-entity roles the realm already
# emits; listing them here is what makes them mean something. A caller that
# writes quote lines without being all of Finance — a host-authored role or a
# plugin operation — holds the
# ReadWrite one.
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
      - Finance.QuoteLines.Read
      - Finance.QuoteLines.ReadWrite
    create:
      - Finance.All.ReadWrite
      - Finance.QuoteLines.ReadWrite
    update:
      - Finance.All.ReadWrite
      - Finance.QuoteLines.ReadWrite
    delete:
      - Finance.All.ReadWrite
      - Finance.QuoteLines.ReadWrite
  rowAccess:
    enabled: true
    empty: public
