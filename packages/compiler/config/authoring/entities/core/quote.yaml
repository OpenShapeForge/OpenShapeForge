schemaVersion: 3
kind: coreEntity
module: core
entity: Quote
title: Quote
description: Outgoing quote to a relation, optionally linked to an agreement. Lighter status workflow than an invoice.
language: en
displayTemplate: "{{quoteNumber}}"
filterField: quoteNumber
labels:
  en: Quote
  nl: Offerte
domains:
  - finance
fields:
  - key: quoteStatus
    valueType: string
    semanticType: referenceDataCode
    required: true
    label:
      en: Quote status
      nl: Offertestatus
    description:
      en: Lifecycle status of the quote.
      nl: Levenscyclusstatus van de offerte.
    persisted:
      column: quote_status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: QUOTESTATUS
  - key: quoteNumber
    valueType: string
    required: true
    label:
      en: Quote number
      nl: Offertenummer
    description:
      en: Tenant-unique quote number. Kept as a string so the format may differ from invoice numbers.
      nl: Tenant-uniek offertenummer. Wordt als tekst opgeslagen zodat het formaat kan afwijken van factuurnummers.
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: quote_number
      storageClass: core
  - key: issueDate
    valueType: date
    required: true
    label:
      en: Issue date
      nl: Offertedatum
    description:
      en: Date the quote was issued.
      nl: Datum waarop de offerte is uitgegeven.
    persisted:
      column: issue_date
      storageClass: core
  - key: expiresAt
    valueType: date
    required: false
    label:
      en: Expires at
      nl: Geldig tot
    description:
      en: Date on which the quote expires if not accepted.
      nl: Datum waarop de offerte vervalt indien niet geaccepteerd.
    persisted:
      column: expires_at
      storageClass: core
  - key: currencyCode
    valueType: string
    required: true
    label:
      en: Currency
      nl: Valuta
    description:
      en: ISO 4217 currency code in which the quote is denominated.
      nl: ISO 4217 valutacode waarin de offerte luidt.
    defaultValue: EUR
    validation:
      minLength: 3
      maxLength: 3
    persisted:
      column: currency_code
      storageClass: core
  - key: amountBase
    valueType: number
    required: false
    label:
      en: Base amount
      nl: Basisbedrag
    description:
      en: Sum of line base amounts, excluding VAT.
      nl: Som van de basisbedragen van de regels, exclusief BTW.
    semanticType: currency
    persisted:
      column: amount_base
      storageClass: core
  - key: amountVat
    valueType: number
    required: false
    label:
      en: VAT amount
      nl: BTW-bedrag
    description:
      en: Sum of VAT amounts on the quote.
      nl: Som van de BTW-bedragen op de offerte.
    semanticType: currency
    persisted:
      column: amount_vat
      storageClass: core
  - key: amountTotal
    valueType: number
    required: false
    label:
      en: Total amount
      nl: Totaalbedrag
    description:
      en: Total quote amount including VAT.
      nl: Totaalbedrag van de offerte inclusief BTW.
    semanticType: currency
    persisted:
      column: amount_total
      storageClass: core
  - key: description
    valueType: string
    semanticType: multilineText
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Free-form description of the quote.
      nl: Vrije omschrijving van de offerte.
    validation:
      maxLength: 1000
    persisted:
      column: description
      storageClass: core
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the quote in an external context.
      nl: Functionele of zakelijke code van de offerte in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    semanticType: Relation
    relationship:
      ownership: reference
  - key: agreementId
    label:
      en: Agreement
      nl: Overeenkomst
    persisted:
      column: agreement_id
      storageClass: core
    semanticType: Agreement
    relationship:
      ownership: reference
  - key: document
    label:
      en: Document
      nl: Document
    description:
      en: The document that carries this record's content, when it has one.
      nl: Het document dat de inhoud van dit record draagt, als dat er is.
    persisted:
      column: document_id
      storageClass: core
    semanticType: Document
    relationship:
      ownership: reference
operations:
  list:
    name: { en: List quotes, nl: Offertes tonen }
    description:
      {
        en: Returns a filtered and sorted page of quotes.,
        nl: Geeft een gefilterde en gesorteerde pagina met offertes terug.
      }
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  get:
    name: { en: Get quote, nl: Offerte ophalen }
    description: { en: Returns one quote by its canonical id., nl: Geeft één offerte terug op basis van het canonieke id. }
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  create:
    name: { en: Create quote, nl: Offerte aanmaken }
    description:
      {
        en: Creates one quote after validating its canonical fields.,
        nl: Maakt één offerte aan na validatie van de canonieke velden.
      }
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    confirmation: { mode: none }
  update:
    name: { en: Update quote, nl: Offerte wijzigen }
    description:
      {
        en: Updates one quote while holding its server-issued edit lease and current version.,
        nl: Wijzigt één offerte met de server-uitgegeven bewerkingslease en actuele versie.
      }
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation: { mode: none }
  delete:
    name: { en: Delete quote, nl: Offerte verwijderen }
    description:
      {
        en: Permanently deletes one quote after a server-issued version-bound confirmation challenge.,
        nl: Verwijdert één offerte definitief na een server-uitgegeven versiegebonden bevestigingsvraag.
      }
    implementation: { type: entity, action: delete }
    effects: { data: delete, external: none }
    reliability:
      idempotency: { mode: natural }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation:
      mode: challenge
      challenge:
        kind: type-current-field
        field: quoteNumber
        issuedBy: server
        bindTo: [ subject, tenant, operation, target.id, target.version ]
        expiresAfter: PT5M
        singleUse: true

interfaces:
  rest: {}
  graphql: {}
  mcp:
    tools: generic
    resource:
      uri: app://quotes
      name: Quotes
      description: Read the quotes available to the signed-in identity.
      templateDescription: Read one quote by its canonical id.
  web:
    views:
      collection:
        route: { en: /quotes, nl: /offertes }
        title: { en: Quotes, nl: Offertes }
        columns:
          - { key: quoteNumber, sortable: true }
          - { key: quoteStatus, sortable: true }
          - { key: issueDate, sortable: true }
          - { key: expiresAt, sortable: true }
          - { key: amountTotal, sortable: true }
        defaultSort: { key: issueDate, direction: desc }
      record:
        routes:
          read: { en: /quotes/:id, nl: /offertes/:id }
          create: { en: /quotes/new, nl: /offertes/nieuw }
        title: "{{quoteNumber}}"
        subtitle: "{{amountTotal}}"
        actions: [ update, delete ]
        layout:
          context:
            fields: [ quoteStatus, amountTotal, currencyCode, expiresAt ]
            relationships: [ relationId, agreementId, document ]
          tabs:
            - id: overview
              label: { en: Overview, nl: Overzicht }
              groups:
                - title: { en: Quote details, nl: Offertegegevens }
                  fields: [ quoteStatus, quoteNumber, issueDate, expiresAt, currencyCode ]
                - title: { en: Amounts, nl: Bedragen }
                  fields: [ amountBase, amountVat, amountTotal ]
                - title: { en: Description, nl: Omschrijving }
                  fields: [ description ]
                - title: { en: Source, nl: Herkomst }
                  fields: [ externalId, externalCode, sourceAuthority, sourceOrganization, sourceAdministration ]
        modes:
          create:
            title: { en: Create quote, nl: Offerte aanmaken }
            groups:
              - title: { en: Quote details, nl: Offertegegevens }
                fields: [ quoteStatus, quoteNumber, issueDate, expiresAt, currencyCode ]
              - title: { en: Amounts, nl: Bedragen }
                fields: [ amountBase, amountVat, amountTotal ]
              - title: { en: Description, nl: Omschrijving }
                fields: [ description ]
              - title: { en: Source, nl: Herkomst }
                fields: [ externalId, externalCode, sourceAuthority, sourceOrganization, sourceAdministration ]
          update:
            title: { en: Update quote, nl: Offerte wijzigen }
            groups:
              - title: { en: Quote details, nl: Offertegegevens }
                fields: [ quoteStatus, quoteNumber, issueDate, expiresAt, currencyCode ]
              - title: { en: Amounts, nl: Bedragen }
                fields: [ amountBase, amountVat, amountTotal ]
              - title: { en: Description, nl: Omschrijving }
                fields: [ description ]
              - title: { en: Source, nl: Herkomst }
                fields: [ externalId, externalCode, sourceAuthority, sourceOrganization, sourceAdministration ]
# Finance.Quotes.Read / Finance.Quotes.ReadWrite are the per-entity roles the realm already
# emits; listing them here is what makes them mean something. A caller that
# writes quotes without being all of Finance — a host-authored role or a plugin
# operation — holds the
# ReadWrite one.
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
      - Finance.Quotes.Read
      - Finance.Quotes.ReadWrite
    create:
      - Finance.All.ReadWrite
      - Finance.Quotes.ReadWrite
    update:
      - Finance.All.ReadWrite
      - Finance.Quotes.ReadWrite
    delete:
      - Finance.All.ReadWrite
      - Finance.Quotes.ReadWrite
  rowAccess:
    enabled: true
    empty: public
