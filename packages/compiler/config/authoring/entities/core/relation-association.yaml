schemaVersion: 3
kind: coreEntity
module: core
entity: RelationAssociation
title: Relation Association
description: A typed association between two relations, optionally scoped to a context relation.
language: en
displayTemplate: "{{associationKind}}"
filterField: associationKind
labels:
  en: Relation Association
  nl: Relatiekoppeling
pluralLabels:
  en: Relation associations
  nl: Relatiekoppelingen
domains:
  - relations
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: type
    osfType: string
    required: true
    label:
      en: Type
      nl: Type
    description:
      en: Type of association between two relations, such as memberOf, contactPersonOf, or guarantorFor.
      nl: Type koppeling tussen twee relaties, zoals memberOf, contactpersoonVan of borgVoor.
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: type
      storageClass: core
  - key: status
    osfType: string
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the association.
      nl: Levenscyclusstatus van de koppeling.
    validation:
      maxLength: 50
    persisted:
      column: status
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business context for the association.
      nl: Optionele omschrijving of zakelijke context van de koppeling.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which the association is effective.
      nl: Datum vanaf wanneer de koppeling geldig is.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which the association is effective.
      nl: Datum tot wanneer de koppeling geldig is.
    persisted:
      column: end_date
      storageClass: core
  - key: isPrimary
    osfType: boolean
    required: false
    label:
      en: Primary
      nl: Primair
    description:
      en: Whether this is the primary association of its type within the given context.
      nl: Of dit de primaire koppeling van dit type is binnen de gegeven context.
    persisted:
      column: is_primary
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse:
        key: associations
        label:
          en: Associations
          nl: Koppelingen
  - key: relatedRelationId
    label:
      en: Related relation
      nl: Gerelateerde relatie
    persisted:
      column: related_relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse:
        key: relatedAssociations
        label:
          en: Related associations
          nl: Gerelateerde koppelingen
  - key: contextRelationId
    label:
      en: Context relation
      nl: Contextrelatie
    persisted:
      column: context_relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse:
        key: contextAssociations
        label:
          en: Context associations
          nl: Contextkoppelingen
operations:
  list:
    name: List Relation Association
    description: List RelationAssociation records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Relation Association
    description: Get RelationAssociation records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Relation Association
    description: Create RelationAssociation records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update RelationAssociation records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /relation-associations
          nl: /relatiekoppelingen
        columns:
          - key: type
            sortable: true
          - key: status
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
        title:
          en: Relation Associations
          nl: Relatiekoppelingen
        defaultSort:
          key: type
          direction: asc
      record:
        routes:
          read:
            en: /relation-associations/:id
            nl: /relatiekoppelingen/:id
          create:
            en: /relation-associations/create
            nl: /relatiekoppelingen/aanmaken
        title: "{{type}}"
        subtitle: "{{status}}"
        badges:
          - type
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Association
                    nl: Koppeling
                  fields:
                    - type
                    - status
                    - startDate
                    - endDate
                    - isPrimary
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
        modes:
          create:
            title:
              en: Create relation association
              nl: Relatiekoppeling aanmaken
            groups:
              - title:
                  en: Association
                  nl: Koppeling
                fields:
                  - type
                  - status
                  - startDate
                  - endDate
                  - isPrimary
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
          update:
            title:
              en: Edit relation association
              nl: Relatiekoppeling bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
