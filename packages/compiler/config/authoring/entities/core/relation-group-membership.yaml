schemaVersion: 2
kind: coreEntity
module: core
entity: RelationGroupMembership
title: Relation Group Membership
description:
  en: Explicit membership of one relation in one typed relation group.
  nl: Expliciet lidmaatschap van een relatie in een getypeerde relatiegroep.
language: en
displayTemplate: "{{relationId}} - {{relationGroupId}}"
filterField: status
labels:
  en: Relation Group Membership
  nl: Relatiegroepslidmaatschap
domains:
  - relations
indexes:
  - name: relation_group_memberships_tenant_relation_group_uidx
    fields:
      - tenantId
      - relationId
      - relationGroupId
    unique: true
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
      - Relations.RelationGroups.ReadWrite
    create:
      - Relations.RelationGroups.ReadWrite
    update:
      - Relations.RelationGroups.ReadWrite
    delete:
      - Relations.RelationGroups.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: relationId
    valueType: string
    required: true
    immutable: true
    semanticType: relationId
    label:
      en: Relation
      nl: Relatie
    description:
      en: Relation that belongs to the group. Set on creation and immutable afterwards.
      nl: Relatie die bij de groep hoort. Wordt bij aanmaken gezet en kan daarna niet wijzigen.
    validation:
      format: uuid
    persisted:
      column: relation_id
      storageClass: core
  - key: relationGroupId
    valueType: string
    required: true
    immutable: true
    semanticType: relationGroupId
    label:
      en: Relation group
      nl: Relatiegroep
    description:
      en: Group that contains the relation. Set on creation and immutable afterwards.
      nl: Groep waarin de relatie zit. Wordt bij aanmaken gezet en kan daarna niet wijzigen.
    validation:
      format: uuid
    persisted:
      column: relation_group_id
      storageClass: core
  - key: status
    valueType: string
    required: true
    defaultValue: active
    label:
      en: Status
      nl: Status
    description:
      en: Whether this membership currently participates in explicitly granted group access.
      nl: Of dit lidmaatschap momenteel meetelt voor expliciet toegekende groepstoegang.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: RELATIONGROUPSTATUS
relationships:
  - key: relation
    kind: belongsTo
    target: Relation
    foreignKey: relation_id
    label:
      en: Relation
      nl: Relatie
  - key: relationGroup
    kind: belongsTo
    target: RelationGroup
    foreignKey: relation_group_id
    label:
      en: Relation group
      nl: Relatiegroep
operations:
  list:
    name: { en: List relation group memberships, nl: Relatiegroepslidmaatschappen tonen }
    description:
      en: Returns a filtered and sorted page of relation group memberships.
      nl: Geeft een gefilterde en gesorteerde pagina met relatiegroepslidmaatschappen terug.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  get:
    name: { en: Get relation group membership, nl: Relatiegroepslidmaatschap ophalen }
    description:
      en: Returns one relation group membership by its canonical id.
      nl: Geeft een relatiegroepslidmaatschap terug op basis van het canonieke id.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  create:
    name: { en: Create relation group membership, nl: Relatiegroepslidmaatschap aanmaken }
    description:
      en: Adds one relation to one relation group.
      nl: Voegt één relatie toe aan één relatiegroep.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    confirmation: { mode: none }
  update:
    name: { en: Update relation group membership, nl: Relatiegroepslidmaatschap wijzigen }
    description:
      en: Changes the membership status while holding its server-issued edit lease and current version.
      nl: Wijzigt de lidmaatschapsstatus met de server-uitgegeven bewerkingslease en actuele versie.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation: { mode: none }
  delete:
    name: { en: Delete relation group membership, nl: Relatiegroepslidmaatschap verwijderen }
    description:
      en: Permanently deletes one membership after a server-issued, version-bound confirmation challenge.
      nl: Verwijdert één lidmaatschap definitief na een door de server uitgegeven, versiegebonden bevestigingsvraag.
    implementation: { type: entity, action: delete }
    effects: { data: delete, external: none }
    reliability:
      idempotency: { mode: natural }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation:
      mode: challenge
      challenge:
        kind: type-current-field
        field: relationGroupId
        issuedBy: server
        bindTo: [subject, tenant, operation, target.id, target.version]
        expiresAfter: PT5M
        singleUse: true

interfaces:
  rest: {}
  graphql: {}
  mcp:
    operations:
      update:
        instructions:
          en: Acquire an edit lease first and submit its token with the version returned by get.
          nl: Vraag eerst een bewerkingslease aan en stuur het token mee met de versie uit get.
      delete:
        instructions:
          en: Acquire an edit lease first; request the confirmation challenge and answer it with the exact current relation-group id.
          nl: Vraag eerst een bewerkingslease en bevestigingsvraag aan en beantwoord die met exact het actuele relatiegroep-id.
    resource:
      uri: app://relation-group-memberships
      name: Relation group memberships
      description: Read relation group memberships available to the signed-in identity.
      templateDescription: Read one relation group membership by its canonical id.
  web:
    views:
      collection:
        route: { en: /relation-group-memberships, nl: /relatiegroepslidmaatschappen }
        title: { en: Relation group memberships, nl: Relatiegroepslidmaatschappen }
        columns:
          - { key: relationId, sortable: true }
          - { key: relationGroupId, sortable: true }
          - { key: status, sortable: true }
        defaultSort: { key: relationGroupId, direction: asc }
      record:
        routes:
          read: { en: /relation-group-memberships/:id, nl: /relatiegroepslidmaatschappen/:id }
          create: { en: /relation-group-memberships/new, nl: /relatiegroepslidmaatschappen/nieuw }
        title: Group membership
        actions: [update, delete]
        layout:
          context:
            fields: [status]
            relationships: [relation, relationGroup]
          tabs:
            - id: overview
              label: { en: Overview, nl: Overzicht }
              groups:
                - title: { en: Membership, nl: Lidmaatschap }
                  fields: [relationId, relationGroupId, status]
        modes:
          create:
            title: { en: Add relation to group, nl: Relatie aan groep toevoegen }
            groups:
              - title: { en: Membership, nl: Lidmaatschap }
                fields: [relationId, relationGroupId, status]
          update:
            title: { en: Update membership, nl: Lidmaatschap wijzigen }
            groups:
              - title: { en: Status, nl: Status }
                fields: [status]
