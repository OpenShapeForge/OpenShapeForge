schemaVersion: 3
kind: coreEntity
module: core
entity: RelationGroupMembership
title: Relation Group Membership
description:
  en: Explicit, dated membership of one relation in one typed relation group. A relation can hold several memberships in
    the same group over time, each with its own role and period.
  nl: Expliciet, gedateerd lidmaatschap van een relatie in een getypeerde relatiegroep. Een relatie kan in dezelfde groep
    meerdere lidmaatschappen na elkaar hebben, elk met een eigen rol en periode.
language: en
displayTemplate: "{{relationId}} - {{relationGroupId}}"
filterField: status
labels:
  en: Relation Group Membership
  nl: Relatiegroepslidmaatschap
domains:
  - relations
indexes:
  # One membership per relation, group and start date: the same pair may
  # recur over time (a rejoined committee, a second term), so the period is
  # part of the identity rather than the pair alone.
  - name: relation_group_memberships_tenant_relation_group_period_uidx
    fields:
      - tenantId
      - relationId
      - relationGroupId
      - startDate
    unique: true
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
      - Relations.RelationGroups.ReadWrite
    create:
      - Relations.RelationGroups.ReadWrite
    update:
      - Relations.RelationGroups.ReadWrite
    delete:
      - Relations.RelationGroups.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: relationId
    required: true
    immutable: true
    osfType: Relation
    label:
      en: Relation
      nl: Relatie
    description:
      en: Relation that belongs to the group. Set on creation and immutable afterwards.
      nl: Relatie die bij de groep hoort. Wordt bij aanmaken gezet en kan daarna niet wijzigen.
    validation:
      format: uuid
    persisted:
      column: relation_id
      storageClass: core
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
      inverse:
        key: groupMemberships
        label:
          en: Group memberships
          nl: Groepslidmaatschappen
  - key: relationGroupId
    required: true
    immutable: true
    osfType: RelationGroup
    label:
      en: Relation group
      nl: Relatiegroep
    description:
      en: Group that contains the relation. Set on creation and immutable afterwards.
      nl: Groep waarin de relatie zit. Wordt bij aanmaken gezet en kan daarna niet wijzigen.
    validation:
      format: uuid
    persisted:
      column: relation_group_id
      storageClass: core
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
      inverse:
        key: memberships
        label:
          en: Memberships
          nl: Lidmaatschappen
  - key: status
    osfType: string
    required: true
    defaultValue: active
    label:
      en: Status
      nl: Status
    description:
      en: Whether this membership currently participates in explicitly granted group access.
      nl: Of dit lidmaatschap momenteel meetelt voor expliciet toegekende groepstoegang.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: RELATIONGROUPSTATUS
  - key: role
    osfType: string
    required: false
    label:
      en: Role in group
      nl: Rol in groep
    description:
      en: Functional role the relation holds within this group, such as chair, member or secretary.
      nl: Functionele rol van de relatie binnen deze groep, zoals voorzitter, lid of secretaris.
    validation:
      maxLength: 100
    persisted:
      column: role
      storageClass: core
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Begindatum
    description:
      en: First date on which the membership is valid. Part of the membership's identity, so the same relation can rejoin the
        same group for a later period.
      nl: Eerste datum waarop het lidmaatschap geldig is. Maakt deel uit van de identiteit van het lidmaatschap, zodat
        dezelfde relatie later opnieuw lid van dezelfde groep kan worden.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Last date on which the membership is valid; empty while the membership is open-ended.
      nl: Laatste datum waarop het lidmaatschap geldig is; leeg zolang het lidmaatschap doorloopt.
    persisted:
      column: end_date
      storageClass: core
  - key: isPrimary
    osfType: boolean
    required: true
    defaultValue: false
    label:
      en: Primary
      nl: Primair
    description:
      en: Whether this is the relation's primary membership for its role, when it holds several memberships in the same group.
      nl: Of dit het primaire lidmaatschap van de relatie voor deze rol is, wanneer zij meerdere lidmaatschappen in dezelfde
        groep heeft.
    persisted:
      column: is_primary
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Stable code of the membership in an external source or sector context.
      nl: Stabiele code van het lidmaatschap in een externe bron of sectorcontext.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
operations:
  list:
    name: { en: List relation group memberships, nl: Relatiegroepslidmaatschappen tonen }
    description:
      en: Returns a filtered and sorted page of relation group memberships.
      nl: Geeft een gefilterde en gesorteerde pagina met relatiegroepslidmaatschappen terug.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  get:
    name: { en: Get relation group membership, nl: Relatiegroepslidmaatschap ophalen }
    description:
      en: Returns one relation group membership by its canonical id.
      nl: Geeft een relatiegroepslidmaatschap terug op basis van het canonieke id.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  create:
    name: { en: Create relation group membership, nl: Relatiegroepslidmaatschap aanmaken }
    description:
      en: Adds one relation to one relation group for a role and period.
      nl: Voegt één relatie voor een rol en periode toe aan één relatiegroep.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    confirmation: { mode: none }
  update:
    name: { en: Update relation group membership, nl: Relatiegroepslidmaatschap wijzigen }
    description:
      en: Changes the membership's role, period, primacy or status while holding its server-issued edit lease and current
        version.
      nl: Wijzigt rol, periode, primair-markering of status van het lidmaatschap met de server-uitgegeven bewerkingslease en
        actuele versie.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation: { mode: none }
  delete:
    name: { en: Delete relation group membership, nl: Relatiegroepslidmaatschap verwijderen }
    description:
      en: Permanently deletes one membership after a server-issued, version-bound confirmation challenge.
      nl: Verwijdert één lidmaatschap definitief na een door de server uitgegeven, versiegebonden bevestigingsvraag.
    implementation: { type: entity, action: delete }
    effects: { data: delete, external: none }
    reliability:
      idempotency: { mode: natural }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation:
      mode: challenge
      challenge:
        kind: type-current-field
        field: relationGroupId
        issuedBy: server
        bindTo: [ subject, tenant, operation, target.id, target.version ]
        expiresAfter: PT5M
        singleUse: true

interfaces:
  rest: {}
  graphql: {}
  mcp:
    operations:
      update:
        instructions:
          en: Acquire an edit lease first and submit its token with the version returned by get.
          nl: Vraag eerst een bewerkingslease aan en stuur het token mee met de versie uit get.
      delete:
        instructions:
          en: Acquire an edit lease first; request the confirmation challenge and answer it with the exact current relation-group
            id.
          nl: Vraag eerst een bewerkingslease en bevestigingsvraag aan en beantwoord die met exact het actuele relatiegroep-id.
    resource:
      uri: app://relation-group-memberships
      name: Relation group memberships
      description: Read relation group memberships available to the signed-in identity.
      templateDescription: Read one relation group membership by its canonical id.
  web:
    views:
      collection:
        route:
          en: /relation-group-memberships
          nl: /relatiegroepslidmaatschappen
        title:
          en: Relation group memberships
          nl: Relatiegroepslidmaatschappen
        columns:
          - key: relationId
            sortable: true
          - key: relationGroupId
            sortable: true
          - key: role
            sortable: true
          - key: status
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
        defaultSort:
          key: relationGroupId
          direction: asc
      record:
        routes:
          read:
            en: /relation-group-memberships/:id
            nl: /relatiegroepslidmaatschappen/:id
          create:
            en: /relation-group-memberships/new
            nl: /relatiegroepslidmaatschappen/nieuw
        title: "{{relationId}}"
        subtitle: "{{relationGroupId}}"
        actions:
          - update
          - delete
        layout:
          context:
            fields:
              - status
              - isPrimary
            relationships:
              - relationId
              - relationGroupId
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Membership
                    nl: Lidmaatschap
                  fields:
                    - relationId
                    - relationGroupId
                    - role
                    - status
                    - isPrimary
                - title:
                    en: Period
                    nl: Periode
                  fields:
                    - startDate
                    - endDate
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalCode
        modes:
          create:
            title:
              en: Add relation to group
              nl: Relatie aan groep toevoegen
            groups:
              - title:
                  en: Membership
                  nl: Lidmaatschap
                fields:
                  - relationId
                  - relationGroupId
                  - role
                  - status
                  - isPrimary
              - title:
                  en: Period
                  nl: Periode
                fields:
                  - startDate
                  - endDate
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalCode
          update:
            title:
              en: Update membership
              nl: Lidmaatschap wijzigen
            groups:
              - title:
                  en: Membership
                  nl: Lidmaatschap
                fields:
                  - role
                  - status
                  - isPrimary
              - title:
                  en: Period
                  nl: Periode
                fields:
                  - startDate
                  - endDate
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalCode
