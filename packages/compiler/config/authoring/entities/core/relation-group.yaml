schemaVersion: 2
kind: coreEntity
module: core
entity: RelationGroup
title: Relation Group
description: A group that bundles multiple relations together.
language: en
displayTemplate: "{{name}}"
filterField: name
labels:
  en: Relation Group
  nl: Relatiegroep
domains:
  - relations
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
      - Relations.RelationGroups.ReadWrite
    create:
      - Relations.RelationGroups.ReadWrite
    update:
      - Relations.RelationGroups.ReadWrite
    delete:
      - Relations.RelationGroups.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: name
    valueType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Name of the relation group.
      nl: Naam van de relatiegroep.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description of the relation group.
      nl: Optionele omschrijving van de relatiegroep.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
  - key: groupType
    valueType: string
    required: true
    label:
      en: Group type
      nl: Groepstype
    description:
      en: Classification of this group, such as a department, team, project, or committee.
      nl: Classificatie van deze groep, zoals een afdeling, team, project of commissie.
    persisted:
      column: group_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: RELATIONGROUPTYPE
  - key: status
    valueType: string
    required: true
    defaultValue: active
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the relation group.
      nl: Levenscyclusstatus van de relatiegroep.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: RELATIONGROUPSTATUS
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional code of the group in an external context.
      nl: Functionele code van de groep in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
relationships:
  - key: relation
    kind: belongsTo
    target: Relation
    foreignKey: relation_id
    label:
      en: Relation
      nl: Relatie
  - key: memberships
    kind: hasMany
    target: RelationGroupMembership
    foreignKey: relation_group_id
    label:
      en: Memberships
      nl: Lidmaatschappen
  - key: orgUnit
    kind: belongsTo
    target: OrgUnit
    foreignKey: org_unit_id
    label:
      en: Org unit
      nl: Organisatorische eenheid
operations:
  list:
    name: { en: List relation groups, nl: Relatiegroepen tonen }
    description:
      en: Returns a filtered and sorted page of relation groups.
      nl: Geeft een gefilterde en gesorteerde pagina met relatiegroepen terug.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  get:
    name: { en: Get relation group, nl: Relatiegroep ophalen }
    description:
      en: Returns one relation group by its canonical id.
      nl: Geeft een relatiegroep terug op basis van het canonieke id.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  create:
    name: { en: Create relation group, nl: Relatiegroep aanmaken }
    description:
      en: Creates one relation group after validating its canonical fields.
      nl: Maakt een relatiegroep aan na validatie van de canonieke velden.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    confirmation: { mode: none }
  update:
    name: { en: Update relation group, nl: Relatiegroep wijzigen }
    description:
      en: Updates one relation group while holding its server-issued edit lease and current version.
      nl: Wijzigt een relatiegroep met de server-uitgegeven bewerkingslease en actuele versie.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation: { mode: none }
  delete:
    name: { en: Delete relation group, nl: Relatiegroep verwijderen }
    description:
      en: Permanently deletes one relation group after a server-issued, version-bound confirmation challenge.
      nl: Verwijdert een relatiegroep definitief na een door de server uitgegeven, versiegebonden bevestigingsvraag.
    implementation: { type: entity, action: delete }
    effects: { data: delete, external: none }
    reliability:
      idempotency: { mode: natural }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation:
      mode: challenge
      challenge:
        kind: type-current-field
        field: name
        issuedBy: server
        bindTo: [subject, tenant, operation, target.id, target.version]
        expiresAfter: PT5M
        singleUse: true

interfaces:
  rest:
    operations:
      list: {}
      get: {}
      create: {}
      update: {}
      delete: {}
  graphql: {}
  mcp:
    operations:
      list: {}
      get: {}
      create: {}
      update:
        instructions:
          en: Acquire an edit lease first and submit its token with the version returned by get.
          nl: Vraag eerst een bewerkingslease aan en stuur het token mee met de versie uit get.
      delete:
        instructions:
          en: Acquire an edit lease first; request the confirmation challenge and answer it with the exact current group name.
          nl: Vraag eerst een bewerkingslease en bevestigingsvraag aan en beantwoord die met exact de actuele groepsnaam.
    resource:
      uri: app://relation-groups
      name: Relation groups
      description: Read the relation groups available to the signed-in identity.
      templateDescription: Read one relation group by its canonical id.
  web:
    operations:
      list: {}
      get: {}
      create: {}
      update: {}
      delete: {}
    views:
      collection:
        route: { en: /relation-groups, nl: /relatiegroepen }
        title: { en: Relation groups, nl: Relatiegroepen }
        columns:
          - { key: name, sortable: true }
          - { key: groupType, sortable: true }
          - { key: status, sortable: true }
        defaultSort: { key: name, direction: asc }
      record:
        routes:
          read: { en: /relation-groups/:id, nl: /relatiegroepen/:id }
          create: { en: /relation-groups/new, nl: /relatiegroepen/nieuw }
        title: "{{name}}"
        actions: [update, delete]
        layout:
          tabs:
            - id: overview
              label: { en: Overview, nl: Overzicht }
              groups:
                - title: { en: General, nl: Algemeen }
                  fields: [name, groupType, status]
                - title: { en: Description, nl: Omschrijving }
                  fields: [description]
                - title: { en: Source, nl: Herkomst }
                  fields: [externalId, externalCode]
            - id: memberships
              label: { en: Memberships, nl: Lidmaatschappen }
              relationship: memberships
        modes:
          create:
            title: { en: Create relation group, nl: Relatiegroep aanmaken }
            groups:
              - title: { en: General, nl: Algemeen }
                fields: [name, groupType, status]
              - title: { en: Description, nl: Omschrijving }
                fields: [description]
              - title: { en: Source, nl: Herkomst }
                fields: [externalId, externalCode]
          update:
            title: { en: Update relation group, nl: Relatiegroep wijzigen }
            groups:
              - title: { en: General, nl: Algemeen }
                fields: [name, groupType, status]
              - title: { en: Description, nl: Omschrijving }
                fields: [description]
              - title: { en: Source, nl: Herkomst }
                fields: [externalCode]
