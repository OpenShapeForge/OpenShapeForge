schemaVersion: 3
kind: coreEntity
module: core
entity: RelationRole
title: Relation Role
description: A role assigned to a relation, such as customer, supplier, or employee.
language: en
displayTemplate: "{{type}}"
filterField: type
labels:
  en: Relation Role
  nl: Relatierol
domains:
  - relations
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: type
    required: true
    label:
      en: Type
      nl: Type
    description:
      en: Type of role (e.g. customer, supplier, employee).
      nl: Type rol (bijv. klant, leverancier, medewerker).
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: RELATIONROLETYPE
    osfType: referenceDataCode
  - key: name
    osfType: string
    required: false
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the role assignment.
      nl: Menselijk leesbare naam van de roltoewijzing.
    validation:
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the role.
      nl: Optionele omschrijving of zakelijke betekenis van de rol.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: status
    osfType: string
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the role assignment.
      nl: Levenscyclusstatus van de roltoewijzing.
    validation:
      maxLength: 50
    persisted:
      column: status
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional code of the role assignment in an external context.
      nl: Functionele code van de roltoewijzing in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which this role is effective.
      nl: Datum vanaf wanneer deze rol geldig is.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which this role is effective.
      nl: Datum tot wanneer deze rol geldig is.
    persisted:
      column: end_date
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse:
        key: roles
        label:
          en: Roles
          nl: Rollen
  - key: contextRelationId
    label:
      en: Context relation
      nl: Contextrelatie
    persisted:
      column: context_relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse: false
operations:
  list:
    name: List Relation Role
    description: List RelationRole records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Relation Role
    description: Get RelationRole records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Relation Role
    description: Create RelationRole records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update RelationRole records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /relation-roles
          nl: /relatierollen
        columns:
          - key: type
            sortable: true
          - key: name
            sortable: true
          - key: status
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
        title:
          en: Relation Roles
          nl: Relatierollen
        defaultSort:
          key: type
          direction: asc
      record:
        routes:
          read:
            en: /relation-roles/:id
            nl: /relatierollen/:id
          create:
            en: /relation-roles/create
            nl: /relatierollen/aanmaken
        title: "{{name || type}}"
        subtitle: "{{status}}"
        badges:
          - type
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Role details
                    nl: Rolgegevens
                  fields:
                    - type
                    - name
                    - status
                    - startDate
                    - endDate
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
        modes:
          create:
            title:
              en: Create relation role
              nl: Relatierol aanmaken
            groups:
              - title:
                  en: Role details
                  nl: Rolgegevens
                fields:
                  - type
                  - name
                  - status
                  - startDate
                  - endDate
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
          update:
            title:
              en: Edit relation role
              nl: Relatierol bewerken
    fields:
      type:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: RELATIONROLETYPE
            clearable: false
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
