schemaVersion: 2
kind: coreEntity
module: core
entity: Relation
title: Relation
description:
  en: Canonical ERP/CRM relation aggregate for the platform.
  nl: Canonieke ERP/CRM-relatie-aggregate voor het platform.
language: en
displayTemplate: "{{displayName}}"
filterField: displayName
labels:
  en: Relation
  nl: Relatie
domains:
  - relations
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
      - Relations.All.Delete
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.Delete
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: labels
    valueType: object
    semanticType: labelSet
    required: false
    readOnly: true
    label:
      en: Labels
      nl: Labels
    description:
      en: Runtime-resolved label rule outputs for this relation. Not persisted; computed per request from label_rules.
      nl: Runtime-afgeleide uitkomsten van labelregels voor deze relatie. Niet gepersisteerd; elke request opnieuw bepaald op basis van label_rules.
  - key: displayName
    valueType: string
    required: true
    label:
      en: Display name
      nl: Weergavenaam
    description:
      en: Shared human-readable label of the relation aggregate, used across lists, tasks, and integrations.
      nl: Gedeelde menselijk leesbare aanduiding van de relatie-aggregate, gebruikt in lijsten, taken en koppelingen.
    validation:
      minLength:
        value: 1
        message:
          en: Name is required
          nl: Naam is verplicht
      maxLength:
        value: 200
        message:
          en: Name must be at most 200 characters
          nl: Naam mag maximaal 200 tekens zijn
    persisted:
      column: display_name
      storageClass: core
  - key: relationType
    valueType: string
    required: true
    label:
      en: Relation type
      nl: Relatietype
    description:
      en: Compact cross-sector classification such as person, organization, or group.
      nl: Compacte sectoroverstijgende classificatie zoals persoon, organisatie of groep.
    persisted:
      column: relation_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: RELATIONTYPE
  - key: relationSubType
    valueType: string
    required: false
    label:
      en: Relation subtype
      nl: Relatiesubtype
    description:
      en: More specific cross-sector classification for the relation.
      nl: Meer specifieke sectoroverstijgende classificatie van de relatie.
    validation:
      maxLength: 100
    persisted:
      column: relation_sub_type
      storageClass: core
  - key: preferredContactChannel
    valueType: string
    required: false
    label:
      en: Preferred contact channel
      nl: Voorkeurskanaal
    description:
      en: Preferred communication channel for contacting this relation at a high level.
      nl: Voorkeurskanaal om deze relatie op hoofdlijnen te benaderen.
    validation:
      maxLength: 50
    persisted:
      column: preferred_contact_channel
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: COMMUNICATIONCHANNEL
  - key: status
    valueType: string
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the relation.
      nl: Levenscyclusstatus van de relatie.
    validation:
      maxLength: 50
    persisted:
      column: status
      storageClass: core
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the relation in a connected source or sector context.
      nl: Functionele of zakelijke code van de relatie in een gekoppelde bron- of sectorcontext.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: address
    valueType: string
    required: false
    label:
      en: Address
      nl: Adres
    description:
      en: Primary address of the relation.
      nl: Primair adres van de relatie.
    persisted:
      column: address
      storageClass: core
  - key: location
    valueType: string
    required: false
    label:
      en: Location
      nl: Locatie
    description:
      en: Geographic location of the relation.
      nl: Geografische locatie van de relatie.
    persisted:
      column: location
      storageClass: core
  - key: notes
    valueType: string
    required: false
    label:
      en: Notes
      nl: Notities
    description:
      en: Free text notes about this relation.
      nl: Vrije tekst notities over deze relatie.
    classification:
      sensitivity: confidential
    validation:
      maxLength: 2000
    persisted:
      column: notes
      storageClass: core
  - key: businessContext
    valueType: string
    required: false
    label:
      en: Business context
      nl: Bedrijfscontext
    description:
      en: Free-text business context for this organization or person, meant to help an assistant understand what it does — visible to anyone who can read this record, unlike the internal `notes` field.
      nl: Vrije tekst bedrijfscontext voor deze organisatie of persoon, bedoeld om een assistent te helpen begrijpen wat het doet — zichtbaar voor iedereen die dit record mag lezen, in tegenstelling tot het interne `notes`-veld.
    validation:
      maxLength: 4000
    persisted:
      column: business_context
      storageClass: core
  - key: relationGroupId
    valueType: string
    required: false
    readOnly: true
    immutable: true
    semanticType: relationGroupId
    label:
      en: Legacy relation group ID
      nl: Legacy relatiegroep-ID
    description:
      en: Retained legacy single-group reference. New and updated memberships use RelationGroupMembership instead.
      nl: Behouden verouderde verwijzing naar één relatiegroep. Nieuwe en gewijzigde lidmaatschappen gebruiken RelationGroupMembership.
    validation:
      format: uuid
    persisted:
      column: relation_group_id
      storageClass: core
relationships:
  - key: groupMemberships
    kind: hasMany
    target: RelationGroupMembership
    foreignKey: relation_id
    label:
      en: Group memberships
      nl: Groepslidmaatschappen
  - key: roles
    kind: hasMany
    target: RelationRole
    foreignKey: relation_id
    label:
      en: Roles
      nl: Rollen
  - key: addresses
    kind: hasMany
    target: Address
    foreignKey: relation_id
    label:
      en: Addresses
      nl: Adressen
  - key: addressAssignments
    kind: hasMany
    target: AddressAssignment
    foreignKey: relation_id
    label:
      en: Address assignments
      nl: Adrestoewijzingen
  - key: contactDetails
    kind: hasMany
    target: ContactDetail
    foreignKey: relation_id
    label:
      en: Contact details
      nl: Contactgegevens
  - key: communicationPreferences
    kind: hasMany
    target: CommunicationPreference
    foreignKey: relation_id
    label:
      en: Communication preferences
      nl: Communicatievoorkeuren
  - key: paymentDetails
    kind: hasMany
    target: PaymentDetail
    foreignKey: relation_id
    label:
      en: Payment details
      nl: Betaalgegevens
  - key: contactMoments
    kind: hasMany
    target: ContactMoment
    foreignKey: relation_id
    label:
      en: Contact moments
      nl: Contactmomenten
  - key: accounts
    kind: hasMany
    target: Account
    foreignKey: relation_id
    label:
      en: Accounts
      nl: Accounts
  - key: tasks
    kind: hasMany
    target: Task
    foreignKey: relation_id
    label:
      en: Tasks
      nl: Taken
  - key: agreements
    kind: hasMany
    target: Agreement
    foreignKey: relation_id
    label:
      en: Agreements
      nl: Overeenkomsten
  - key: cases
    kind: hasMany
    target: Case
    foreignKey: relation_id
    label:
      en: Cases
      nl: Zaken
  - key: caseFiles
    kind: hasMany
    target: CaseFile
    foreignKey: relation_id
    label:
      en: Case files
      nl: Dossiers
  - key: documents
    kind: hasMany
    target: Document
    foreignKey: relation_id
    label:
      en: Documents
      nl: Documenten
  - key: associations
    kind: hasMany
    target: RelationAssociation
    foreignKey: relation_id
    label:
      en: Associations
      nl: Koppelingen
  - key: relatedAssociations
    kind: hasMany
    target: RelationAssociation
    foreignKey: related_relation_id
    label:
      en: Related associations
      nl: Gerelateerde koppelingen
  - key: contextAssociations
    kind: hasMany
    target: RelationAssociation
    foreignKey: context_relation_id
    label:
      en: Context associations
      nl: Contextkoppelingen
operations:
  list:
    name: { en: List relations, nl: Relaties tonen }
    description:
      en: Returns a filtered and sorted page of relations.
      nl: Geeft een gefilterde en gesorteerde pagina met relaties terug.
    guidance:
      assistant:
        en: Use this operation to find relations; use get for one known id.
        nl: Gebruik deze operatie om relaties te zoeken; gebruik get voor één bekend id.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  get:
    name: { en: Get relation, nl: Relatie ophalen }
    description:
      en: Returns one relation by its canonical id.
      nl: Geeft één relatie terug op basis van het canonieke id.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability:
      idempotency: { mode: natural }
    confirmation: { mode: none }
  create:
    name: { en: Create relation, nl: Relatie aanmaken }
    description:
      en: Creates one relation after validating its canonical fields.
      nl: Maakt één relatie aan na validatie van de canonieke velden.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    confirmation: { mode: none }
  update:
    name: { en: Update relation, nl: Relatie wijzigen }
    description:
      en: Updates one relation while holding its server-issued edit lease and current version.
      nl: Wijzigt één relatie met de server-uitgegeven bewerkingslease en actuele versie.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation: { mode: none }
  delete:
    name: { en: Delete relation, nl: Relatie verwijderen }
    description:
      en: Permanently deletes one relation after a server-issued, version-bound confirmation challenge.
      nl: Verwijdert één relatie definitief na een door de server uitgegeven, versiegebonden bevestigingsvraag.
    implementation: { type: entity, action: delete }
    effects: { data: delete, external: none }
    reliability:
      idempotency: { mode: natural }
    concurrency:
      version: { mode: required, field: updatedAt }
      editLease: { mode: required, expiresAfterInactivity: PT15M }
    confirmation:
      mode: challenge
      challenge:
        kind: type-current-field
        field: displayName
        issuedBy: server
        bindTo: [subject, tenant, operation, target.id, target.version]
        expiresAfter: PT5M
        singleUse: true

interfaces:
  rest: {}
  graphql: {}
  mcp:
    operations:
      create:
        instructions:
          en: Ask for missing required fields before invoking this tool.
          nl: Vraag ontbrekende verplichte velden uit voordat je deze tool aanroept.
      update:
        instructions:
          en: Acquire an edit lease first and submit its token with the version returned by get.
          nl: Vraag eerst een bewerkingslease aan en stuur het token mee met de versie uit get.
      delete:
        instructions:
          en: First acquire an edit lease and submit id, expectedVersion, and leaseToken to request a challenge; then retry with the same controls, its token, and the exact requested current display name.
          nl: Vraag eerst een bewerkingslease aan en stuur id, expectedVersion en leaseToken om een bevestigingsvraag te krijgen; herhaal daarna met dezelfde controles, het bevestigingstoken en exact de gevraagde actuele weergavenaam.
    resource:
      uri: app://relations
      name: Relations
      description: Read the relations available to the signed-in identity.
      templateDescription: Read one relation by its canonical id.
  web:
    views:
      collection:
        route: { en: /relations, nl: /relaties }
        title: { en: Relations, nl: Relaties }
        columns:
          - { key: displayName, sortable: true }
          - { key: relationType, sortable: true }
          - { key: status, sortable: true }
        defaultSort: { key: displayName, direction: asc }
      record:
        routes:
          read: { en: /relations/:id, nl: /relaties/:id }
          create: { en: /relations/new, nl: /relaties/nieuw }
        title: "{{displayName}}"
        subtitle: "{{relationType}}"
        actions: [update, delete]
        layout:
          context:
            fields: [relationSubType, status, preferredContactChannel, location]
            relationships: [agreements, groupMemberships, tasks]
          tabs:
            - id: overview
              label: { en: Overview, nl: Overzicht }
              groups:
                - title: { en: Basics, nl: Basisgegevens }
                  fields: [displayName, relationType, relationSubType, preferredContactChannel, status]
                - title: { en: Location, nl: Locatie }
                  fields: [address, location]
                - title: { en: Business context, nl: Zakelijke context }
                  fields: [businessContext]
                - title: { en: Notes, nl: Notities }
                  fields: [notes]
            - id: source
              label: { en: Source, nl: Herkomst }
              groups:
                - title: { en: Identification, nl: Identificatie }
                  fields: [externalId, externalCode]
                - title: { en: Source, nl: Herkomst }
                  fields: [sourceAuthority, sourceOrganization, sourceAdministration]
            - id: agreements
              label: { en: Agreements, nl: Overeenkomsten }
              relationship: agreements
            - id: tasks
              label: { en: Tasks, nl: Taken }
              relationship: tasks
            - id: group-memberships
              label: { en: Groups, nl: Groepen }
              relationship: groupMemberships
        modes:
          create:
            title: { en: Create relation, nl: Relatie aanmaken }
            groups:
              - title: { en: Basics, nl: Basisgegevens }
                fields: [displayName, relationType, relationSubType, preferredContactChannel, status]
              - title: { en: Source, nl: Herkomst }
                fields: [externalId, externalCode, sourceAuthority, sourceOrganization, sourceAdministration]
              - title: { en: Location, nl: Locatie }
                fields: [address, location]
              - title: { en: Context, nl: Context }
                fields: [businessContext]
              - title: { en: Notes, nl: Notities }
                fields: [notes]
          update:
            title: { en: Update relation, nl: Relatie wijzigen }
