schemaVersion: 3
kind: coreEntity
module: core
entity: ResearchAssignment
title: Research Assignment
description: An assignment to conduct a survey with a specific relation through a designated channel.
language: en
displayTemplate: "{{title}}"
filterField: title
labels:
  en: Research Assignment
  nl: Onderzoeksopdracht
pluralLabels:
  en: Research assignments
  nl: Onderzoeksopdrachten
domains:
  - quality
retention:
  mode: policyRef
  policy: quality-retain-7y
  scope: record
  startsFrom:
    strategy: firstNonNull
    fields:
      - completedAt
      - createdAt
authorization:
  roles:
    read:
      - Quality.All.Read
      - Quality.All.ReadWrite
    create:
      - Quality.All.ReadWrite
    update:
      - Quality.All.ReadWrite
    delete:
      - Quality.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Human-readable assignment code.
      nl: Menselijk leesbare opdrachtcode.
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: code
      storageClass: core
  - key: title
    osfType: string
    required: false
    label:
      en: Title
      nl: Titel
    description:
      en: Short title of the research assignment.
      nl: Korte titel van de onderzoeksopdracht.
    validation:
      maxLength: 300
    persisted:
      column: title
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Detailed description of the research assignment.
      nl: Uitgebreide omschrijving van de onderzoeksopdracht.
    validation:
      maxLength: 4000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: assignmentKind
    required: false
    label:
      en: Kind
      nl: Soort
    description:
      en: Classification of the research assignment.
      nl: Classificatie van de onderzoeksopdracht.
    persisted:
      column: assignment_kind
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: RESEARCHASSIGNMENTKIND
    osfType: referenceDataCode
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Current status of the research assignment.
      nl: Huidige status van de onderzoeksopdracht.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: RESEARCHSTATUS
    osfType: referenceDataCode
  - key: channel
    required: false
    label:
      en: Channel
      nl: Kanaal
    description:
      en: Communication channel used for the research.
      nl: Communicatiekanaal waarmee het onderzoek wordt uitgevoerd.
    persisted:
      column: channel
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: COMMUNICATIONCHANNEL
    osfType: referenceDataCode
  - key: completedAt
    osfType: datetime
    required: false
    readOnly: true
    label:
      en: Completed at
      nl: Afgerond op
    description:
      en: Timestamp when the assignment was completed.
      nl: Tijdstip waarop de opdracht is afgerond.
    persisted:
      column: completed_at
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional code in a connected source system.
      nl: Functionele code in een gekoppeld bronsysteem.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  - key: surveyId
    label:
      en: Survey
      nl: Vragenlijst
    persisted:
      column: survey_id
      storageClass: core
    osfType: Survey
    relationship:
      ownership: reference
  - key: researchResultId
    label:
      en: Research result
      nl: Onderzoeksresultaat
    persisted:
      column: research_result_id
      storageClass: core
    osfType: ResearchResult
    relationship:
      ownership: reference
operations:
  list:
    name: List Research Assignment
    description: List ResearchAssignment records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Research Assignment
    description: Get ResearchAssignment records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Research Assignment
    description: Create ResearchAssignment records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Research Assignment
    description: Update ResearchAssignment records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Research Assignment
    description: Delete ResearchAssignment records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
        wait: true
  web:
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 4000
      assignmentKind:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: RESEARCHASSIGNMENTKIND
            clearable: true
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: RESEARCHSTATUS
            clearable: false
      channel:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: COMMUNICATIONCHANNEL
            clearable: true
      completedAt:
        render:
          component: DateTimePicker
          props: {}
