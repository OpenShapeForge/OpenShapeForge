schemaVersion: 3
kind: coreEntity
module: core
entity: ResearchResult
title: Research Result
description: The aggregated result of a research assignment, linking the assignment to its collected answers.
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Research Result
  nl: Onderzoeksresultaat
pluralLabels:
  en: Research results
  nl: Onderzoeksresultaten
domains:
  - quality
retention:
  mode: policyRef
  policy: quality-retain-7y
  scope: record
  startsFrom:
    strategy: field
    field: completedAt
authorization:
  roles:
    read:
      - Quality.All.Read
      - Quality.All.ReadWrite
    create:
      - Quality.All.ReadWrite
    update:
      - Quality.All.ReadWrite
    delete:
      - Quality.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    osfType: string
    required: false
    label:
      en: Code
      nl: Code
    description:
      en: Human-readable result code.
      nl: Menselijk leesbare resultaatcode.
    validation:
      maxLength: 100
    persisted:
      column: code
      storageClass: core
  - key: completedAt
    osfType: datetime
    required: false
    label:
      en: Completed at
      nl: Afgerond op
    description:
      en: Timestamp when the research result was finalized.
      nl: Tijdstip waarop het onderzoeksresultaat is afgerond.
    persisted:
      column: completed_at
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional code in a connected source system.
      nl: Functionele code in een gekoppeld bronsysteem.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: assignmentId
    label:
      en: Research assignment
      nl: Onderzoeksopdracht
    persisted:
      column: research_assignment_id
      storageClass: core
    osfType: ResearchAssignment
    relationship:
      ownership: reference
operations:
  list:
    name: List Research Result
    description: List ResearchResult records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Research Result
    description: Get ResearchResult records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Research Result
    description: Create ResearchResult records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Research Result
    description: Update ResearchResult records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Research Result
    description: Delete ResearchResult records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  web:
    fields:
      completedAt:
        render:
          component: DateTimePicker
          props: {}
