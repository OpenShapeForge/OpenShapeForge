schemaVersion: 3
kind: coreEntity
module: core
entity: SectionBreak
title: Section break
description: Starts a new section with its own page settings and independently authored header and footer.
language: en
labels: { en: Section break, nl: Sectie-einde }
pluralLabels: { en: Section breaks, nl: Sectie-eindes }
domains: [documents]
baseEntity: false
authorization:
  roles:
    read: [Templates.Read, Templates.Manage, General.All.Read, General.All.ReadWrite]
fields:
  - key: layout
    osfType: string
    required: true
    label: { en: Section key, nl: Sectiesleutel }
    validation: { pattern: "^[a-z][A-Za-z0-9-]{0,63}$", maxLength: 64 }
  - key: name
    osfType: string
    required: true
    defaultValue: Sectie
    label: { en: Section name, nl: Sectienaam }
    validation: { maxLength: 120 }
  - key: headerEnabled
    osfType: boolean
    defaultValue: true
    label: { en: Header on every page, nl: Koptekst op elke pagina }
  - key: footerEnabled
    osfType: boolean
    defaultValue: true
    label: { en: Footer on every page, nl: Voettekst op elke pagina }
  - key: format
    osfType: string
    defaultValue: a4
    label: { en: Page format, nl: Paginaformaat }
    options:
      type: static
      items:
        - { value: a4, label: { en: A4, nl: A4 } }
        - { value: a5, label: { en: A5, nl: A5 } }
        - { value: letter, label: { en: Letter, nl: Letter } }
        - { value: custom, label: { en: Custom, nl: Eigen formaat } }
  - key: width
    osfType: number
    label: { en: Width (px), nl: Breedte (px) }
    validation: { min: 200, max: 4000 }
  - key: height
    osfType: number
    label: { en: Height (px), nl: Hoogte (px) }
    validation: { min: 200, max: 4000 }
  - key: margin
    osfType: number
    defaultValue: 40
    label: { en: Margin (px), nl: Marge (px) }
    validation: { min: 0, max: 400 }
  - key: gap
    osfType: number
    defaultValue: 24
    label: { en: Header/footer gap (px), nl: Afstand kop en footer (px) }
    validation: { min: 0, max: 400 }
  - key: blockGap
    osfType: number
    defaultValue: 12
    label: { en: Block gap (px), nl: Blokafstand (px) }
    validation: { min: 0, max: 200 }
  - key: bodyAlignment
    osfType: string
    defaultValue: top
    label: { en: Body alignment, nl: Positie inhoud }
    options:
      type: static
      items:
        - { value: top, label: { en: Top, nl: Bovenaan } }
        - { value: aboveCenter, label: { en: Above center, nl: Boven het midden } }
        - { value: center, label: { en: Center, nl: Midden } }
        - { value: bottom, label: { en: Bottom, nl: Onderaan } }
operations:
  materialize:
    name: Materialize section break
    description: Validate the canonical page boundary without rendering configuration as content.
    implementation: { type: plugin, plugin: documents, handler: materializeFields }
    target: { scope: collection }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [definitionKey, values]
        properties:
          definitionKey: { type: string, const: SectionBreak }
          values: { type: object }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind: { type: string, const: block }
          value:
            x-osf-entityInput: { entity: SectionBreak, fields: [layout, name, headerEnabled, footerEnabled, format, width, height, margin, gap, blockGap, bodyAlignment] }
    errors: []
    auth: { mode: session, roles: [Templates.Read, Templates.Manage, General.All.Read, General.All.ReadWrite] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
interfaces:
  rest:
    operations:
      materialize: { method: POST, path: /api/content-blocks/section-break/materialize }
  mcp: { tools: generic }
