schemaVersion: 3
kind: coreEntity
module: core
entity: SlaPolicy
title: SLA Policy
description: A service level policy that drives deadlines and milestones.
language: en
displayTemplate: "{{name}}"
filterField: name
labels:
  en: SLA Policy
  nl: SLA-beleid
pluralLabels:
  en: SLA policies
  nl: SLA-beleid
domains:
  - cases
  - service
authorization:
  roles:
    read:
      - Cases.All.Read
      - Cases.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Beschrijving
    validation:
      maxLength: 4000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: SLAPOLICYSTATUS
    osfType: referenceDataCode
  - key: targetEntity
    required: true
    label:
      en: Target entity
      nl: Doelentiteit
    persisted:
      column: target_entity
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: SLAPOLICYTARGETENTITY
    osfType: referenceDataCode
  - key: firstResponseMinutes
    osfType: integer
    required: false
    label:
      en: First response minutes
      nl: Minuten tot eerste reactie
    persisted:
      column: first_response_minutes
      storageClass: core
  - key: resolutionMinutes
    osfType: integer
    required: false
    label:
      en: Resolution minutes
      nl: Minuten tot oplossing
    persisted:
      column: resolution_minutes
      storageClass: core
  - key: breachWarningMinutes
    osfType: integer
    required: false
    label:
      en: Breach warning minutes
      nl: Minuten voor waarschuwing
    persisted:
      column: breach_warning_minutes
      storageClass: core
  - key: escalationAfterMinutes
    osfType: integer
    required: false
    label:
      en: Escalation after minutes
      nl: Escaleren na minuten
    persisted:
      column: escalation_after_minutes
      storageClass: core
  - key: businessHoursProfile
    osfType: string
    required: false
    label:
      en: Business hours profile
      nl: Bedrijfsurenprofiel
    validation:
      maxLength: 200
    persisted:
      column: business_hours_profile
      storageClass: core
  - key: pauseOnWaitingCustomer
    osfType: boolean
    required: true
    label:
      en: Pause on waiting for customer
      nl: Pauzeren bij wachten op klant
    defaultValue: true
    persisted:
      column: pause_on_waiting_customer
      storageClass: core
  - key: pauseOnPendingExternal
    osfType: boolean
    required: true
    label:
      en: Pause on pending external dependency
      nl: Pauzeren bij externe afhankelijkheid
    defaultValue: true
    persisted:
      column: pause_on_pending_external
      storageClass: core
  - key: autoCloseOnResolution
    osfType: boolean
    required: true
    label:
      en: Auto-close on resolution
      nl: Automatisch sluiten na oplossing
    defaultValue: false
    persisted:
      column: auto_close_on_resolution
      storageClass: core
  - key: escalationQueueId
    label:
      en: Escalation queue
      nl: Escalatiequeue
    persisted:
      column: escalation_queue_id
      storageClass: core
    osfType: WorkQueue
    relationship:
      ownership: reference
operations:
  list:
    name: List SLA Policy
    description: List SlaPolicy records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get SLA Policy
    description: Get SlaPolicy records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create SLA Policy
    description: Create SlaPolicy records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update SLA Policy
    description: Update SlaPolicy records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete SLA Policy
    description: Delete SlaPolicy records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 4000
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: SLAPOLICYSTATUS
            clearable: false
      targetEntity:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: SLAPOLICYTARGETENTITY
            clearable: false
