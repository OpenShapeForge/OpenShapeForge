schemaVersion: 3
kind: coreEntity
module: core
entity: Space
title: Space
description: Sub-space within a building (room, floor, area). Code is unique within the parent building.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Space
  nl: Ruimte
pluralLabels:
  en: Spaces
  nl: Ruimten
domains:
  - asset
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Code of the space, unique within the parent building.
      nl: Code van de ruimte, uniek binnen het bovenliggende pand.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the space.
      nl: Menselijk leesbare naam van de ruimte.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: spaceKind
    osfType: string
    required: false
    label:
      en: Space kind
      nl: Ruimtesoort
    description:
      en: Kind of space (e.g. "room", "floor", "area").
      nl: Soort ruimte (bijv. "kamer", "verdieping", "gebied").
    validation:
      maxLength: 50
    persisted:
      column: space_kind
      storageClass: core
  - key: area
    osfType: number
    required: false
    label:
      en: Area
      nl: Oppervlakte
    description:
      en: Surface area of the space in square metres.
      nl: Oppervlakte van de ruimte in vierkante meters.
    persisted:
      column: area
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the space in an external context.
      nl: Functionele of zakelijke code van de ruimte in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: buildingId
    label:
      en: Building
      nl: Pand
    persisted:
      column: building_id
      storageClass: core
    osfType: Building
    relationship:
      ownership: reference
  - key: parentSpaceId
    label:
      en: Parent space
      nl: Bovenliggende ruimte
    persisted:
      column: parent_space_id
      storageClass: core
    osfType: Space
    relationship:
      ownership: reference
      inverse:
        key: childSpaces
        label:
          en: Child spaces
          nl: Onderliggende ruimten
authorization:
  roles:
    read:
      - RealEstate.All.Read
      - RealEstate.All.ReadWrite
    create:
      - RealEstate.All.ReadWrite
    update:
      - RealEstate.All.ReadWrite
    delete:
      - RealEstate.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Space
    description: List Space records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Space
    description: Get Space records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Space
    description: Create Space records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Space records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /spaces
          nl: /ruimten
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: spaceKind
            sortable: true
          - key: area
            sortable: true
        title:
          en: Spaces
          nl: Ruimten
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /spaces/:id
            nl: /ruimten/:id
          create:
            en: /spaces/create
            nl: /ruimten/aanmaken
        title: "{{code}} {{name}}"
        subtitle: "{{spaceKind}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Space details
                    nl: Ruimtegegevens
                  fields:
                    - code
                    - name
                    - spaceKind
                    - area
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create space
              nl: Ruimte aanmaken
            groups:
              - title:
                  en: Space details
                  nl: Ruimtegegevens
                fields:
                  - code
                  - name
                  - spaceKind
                  - area
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit space
              nl: Ruimte bewerken
