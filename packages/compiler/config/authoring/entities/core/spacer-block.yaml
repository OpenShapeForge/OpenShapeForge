schemaVersion: 3
kind: coreEntity
module: core
entity: SpacerBlock
title: Spacer
description: A block definition reserving a fixed amount of vertical space.
language: en
labels: { en: Spacer, nl: Witruimte }
pluralLabels: { en: Spacers, nl: Witruimtes }
domains: [documents]
# The Block placement supplies identity. This definition supplies its fields.
baseEntity: false
displayTemplate: "{{height}}"
authorization:
  roles:
    read: [Templates.Read, Templates.Manage, General.All.Read, General.All.ReadWrite]
fields:
  - key: height
    osfType: number
    required: true
    label: { en: Height (px), nl: Hoogte (px) }
    validation: { min: 0, max: 4000 }
operations:
  materialize:
    name: Materialize spacer
    description: Validate resolved values against the active entity definition.
    implementation: { type: plugin, plugin: documents, handler: materializeFields }
    target: { scope: collection }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [definitionKey, values]
        properties:
          definitionKey: { type: string, const: SpacerBlock }
          values: { type: object }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind: { type: string, const: block }
          value:
            x-osf-entityInput: { entity: SpacerBlock, fields: [height] }
    errors: []
    auth: { mode: session, roles: [Templates.Read, Templates.Manage, General.All.Read, General.All.ReadWrite] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
interfaces:
  rest:
    operations:
      materialize: { method: POST, path: /api/content-blocks/spacer/materialize }
  mcp: { tools: generic }
