schemaVersion: 3
kind: coreEntity
module: core
entity: StandardPrice
title: Standard Price
description: Reference price catalogue for maintenance task types, scoped to a validity period.
language: en
displayTemplate: "{{code}} {{name}}"
filterField: code
labels:
  en: Standard price
  nl: Standaardprijs
domains:
  - maintenance
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique standard price code.
      nl: Tenant-unieke standaardprijscode.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-readable name of the standard price entry.
      nl: Menselijk leesbare naam van de standaardprijs.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description of the standard price.
      nl: Optionele omschrijving van de standaardprijs.
    validation:
      maxLength: 1000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: unitId
    osfType: string
    required: false
    label:
      en: Unit
      nl: Eenheid
    description:
      en: Free-form unit identifier (e.g. "Hour", "Piece").
      nl: Vrije eenheidsaanduiding (bv. "Uur", "Stuk").
    validation:
      maxLength: 50
    persisted:
      column: unit_id
      storageClass: core
  - key: amount
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Standard price amount.
      nl: Standaardprijsbedrag.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: validFrom
    osfType: date
    required: true
    label:
      en: Valid from
      nl: Geldig vanaf
    description:
      en: Date from which the standard price is valid.
      nl: Datum vanaf wanneer de standaardprijs geldig is.
    persisted:
      column: valid_from
      storageClass: core
  - key: validTo
    osfType: date
    required: false
    label:
      en: Valid to
      nl: Geldig tot
    description:
      en: Date until which the standard price is valid.
      nl: Datum tot wanneer de standaardprijs geldig is.
    persisted:
      column: valid_to
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the standard price in an external context.
      nl: Functionele of zakelijke code van de standaardprijs in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
authorization:
  roles:
    read:
      - Maintenance.All.Read
      - Maintenance.All.ReadWrite
    create:
      - Maintenance.All.ReadWrite
    update:
      - Maintenance.All.ReadWrite
    delete:
      - Maintenance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Standard Price
    description: List StandardPrice records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Standard Price
    description: Get StandardPrice records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Standard Price
    description: Create StandardPrice records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update StandardPrice records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /standard-prices
          nl: /standaardprijzen
        columns:
          - key: code
            sortable: true
          - key: name
            sortable: true
          - key: amount
            sortable: true
          - key: validFrom
            sortable: true
          - key: validTo
            sortable: true
        title:
          en: Standard prices
          nl: Standaardprijzen
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /standard-prices/:id
            nl: /standaardprijzen/:id
          create:
            en: /standard-prices/create
            nl: /standaardprijzen/aanmaken
        title: "{{code}} {{name}}"
        subtitle: "{{amount}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Standard price details
                    nl: Standaardprijsgegevens
                  fields:
                    - code
                    - name
                    - unitId
                    - amount
                    - validFrom
                    - validTo
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create standard price
              nl: Standaardprijs aanmaken
            groups:
              - title:
                  en: Standard price details
                  nl: Standaardprijsgegevens
                fields:
                  - code
                  - name
                  - unitId
                  - amount
                  - validFrom
                  - validTo
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit standard price
              nl: Standaardprijs bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 1000
      validFrom:
        render:
          component: DatePicker
          props: {}
      validTo:
        render:
          component: DatePicker
          props: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
