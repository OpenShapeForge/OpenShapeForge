schemaVersion: 3
kind: coreEntity
module: core
entity: SupplierRole
title: Supplier Role
description: Procurement-side supplier role on a Relation. Carries supplier number, certifications, default IBAN, and rating.
language: en
displayTemplate: "{{supplierNumber}}"
filterField: supplierNumber
labels:
  en: Supplier
  nl: Leverancier
pluralLabels:
  en: Suppliers
  nl: Leveranciers
domains:
  - relations
fields:
  - key: supplierNumber
    osfType: string
    required: true
    label:
      en: Supplier number
      nl: Leveranciersnummer
    description:
      en: Tenant-unique supplier number.
      nl: Tenant-uniek leveranciersnummer.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: supplier_number
      storageClass: core
  - key: roleType
    required: true
    label:
      en: Role type
      nl: Roltype
    description:
      en: Type of supplier role (maintenance, materials, services, etc.).
      nl: Type leveranciersrol (onderhoud, materialen, diensten, etc.).
    persisted:
      column: role_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: SUPPLIERROLE
    osfType: referenceDataCode
  - key: status
    required: false
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the supplier role assignment.
      nl: Levenscyclusstatus van de leveranciersroltoewijzing.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: ROLEASSIGNMENTSTATUS
    osfType: referenceDataCode
  - key: vatNumber
    osfType: string
    required: false
    label:
      en: VAT number
      nl: BTW-nummer
    description:
      en: VAT identification number of the supplier.
      nl: BTW-identificatienummer van de leverancier.
    validation:
      maxLength: 50
    persisted:
      column: vat_number
      storageClass: core
  - key: chamberOfCommerceNumber
    osfType: string
    required: false
    label:
      en: Chamber of commerce number
      nl: KvK-nummer
    description:
      en: Chamber of commerce registration number of the supplier.
      nl: Inschrijvingsnummer Kamer van Koophandel van de leverancier.
    validation:
      maxLength: 50
    persisted:
      column: chamber_of_commerce_number
      storageClass: core
  - key: kvkVerified
    osfType: boolean
    required: false
    label:
      en: KvK verified
      nl: KvK geverifieerd
    description:
      en: Whether the supplier's chamber of commerce registration has been verified.
      nl: Of de KvK-inschrijving van de leverancier is geverifieerd.
    persisted:
      column: kvk_verified
      storageClass: core
  - key: defaultIban
    osfType: string
    required: false
    label:
      en: Default IBAN
      nl: Standaard IBAN
    description:
      en: IBAN to use for outgoing payments to this supplier by default.
      nl: IBAN die standaard wordt gebruikt voor uitgaande betalingen aan deze leverancier.
    validation:
      maxLength: 34
    persisted:
      column: default_iban
      storageClass: core
  - key: ratingAverage
    osfType: number
    required: false
    label:
      en: Rating average
      nl: Gemiddelde beoordeling
    description:
      en: Average rating for the supplier (1-5).
      nl: Gemiddelde beoordeling voor de leverancier (1-5).
    validation:
      min: 1
      max: 5
    persisted:
      column: rating_average
      storageClass: core
  - key: certifications
    osfType: string
    required: false
    label:
      en: Certifications
      nl: Certificeringen
    description:
      en: List of certifications held by the supplier (e.g. "VCA", "ISO9001").
      nl: Lijst van certificeringen van de leverancier (bv. "VCA", "ISO9001").
    persisted:
      column: certifications
      storageClass: core
    cardinality:
      min: 0
      max: unbounded
    item:
      key: certification
      osfType: string
      required: false
      label:
        en: Certification
        nl: Certificering
  - key: startDate
    osfType: date
    required: false
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which the supplier role assignment is effective.
      nl: Datum vanaf wanneer de leveranciersroltoewijzing geldig is.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: false
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which the supplier role assignment is effective.
      nl: Datum tot wanneer de leveranciersroltoewijzing geldig is.
    persisted:
      column: end_date
      storageClass: core
  - key: name
    osfType: string
    required: false
    label:
      en: Name
      nl: Naam
    description:
      en: Optional human-readable name of the supplier role.
      nl: Optionele menselijk leesbare naam van de leveranciersrol.
    validation:
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the supplier role assignment.
      nl: Optionele omschrijving of zakelijke betekenis van de leveranciersroltoewijzing.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the supplier in an external context.
      nl: Functionele of zakelijke code van de leverancier in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  - key: defaultPaymentMethodId
    label:
      en: Default payment method
      nl: Standaard betaalwijze
    persisted:
      column: default_payment_method_id
      storageClass: core
    osfType: PaymentMethod
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Relations.All.Read
      - Relations.All.ReadWrite
    create:
      - Relations.All.ReadWrite
    update:
      - Relations.All.ReadWrite
    delete:
      - Relations.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Supplier Role
    description: List SupplierRole records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Supplier Role
    description: Get SupplierRole records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Supplier Role
    description: Create SupplierRole records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update SupplierRole records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /supplier-roles
          nl: /leveranciers
        columns:
          - key: supplierNumber
            sortable: true
          - key: name
            sortable: true
          - key: roleType
            sortable: true
          - key: status
            sortable: true
          - key: ratingAverage
            sortable: true
        title:
          en: Suppliers
          nl: Leveranciers
        defaultSort:
          key: supplierNumber
          direction: asc
      record:
        routes:
          read:
            en: /supplier-roles/:id
            nl: /leveranciers/:id
          create:
            en: /supplier-roles/create
            nl: /leveranciers/aanmaken
        title: "{{supplierNumber}}"
        subtitle: "{{name}}"
        badges:
          - roleType
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Supplier details
                    nl: Leveranciersgegevens
                  fields:
                    - supplierNumber
                    - roleType
                    - status
                    - name
                    - startDate
                    - endDate
                - title:
                    en: Identifiers
                    nl: Identificaties
                  fields:
                    - vatNumber
                    - chamberOfCommerceNumber
                    - kvkVerified
                    - defaultIban
                - title:
                    en: Ratings and certifications
                    nl: Beoordelingen en certificeringen
                  fields:
                    - ratingAverage
                    - certifications
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create supplier
              nl: Leverancier aanmaken
            groups:
              - title:
                  en: Supplier details
                  nl: Leveranciersgegevens
                fields:
                  - supplierNumber
                  - roleType
                  - status
                  - name
                  - startDate
                  - endDate
              - title:
                  en: Identifiers
                  nl: Identificaties
                fields:
                  - vatNumber
                  - chamberOfCommerceNumber
                  - kvkVerified
                  - defaultIban
              - title:
                  en: Ratings and certifications
                  nl: Beoordelingen en certificeringen
                fields:
                  - ratingAverage
                  - certifications
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit supplier
              nl: Leverancier bewerken
    fields:
      roleType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: SUPPLIERROLE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: ROLEASSIGNMENTSTATUS
            clearable: true
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
