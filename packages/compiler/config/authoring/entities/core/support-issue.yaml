schemaVersion: 3
kind: coreEntity
module: core
entity: SupportIssue
title: Support issue
description: A user-reported support issue for questions, bugs, feature requests, or access problems.
language: en
displayTemplate: "{{subject}}"
filterField: subject
labels:
  en: Support issue
  nl: Supportverzoek
domains:
  - support
authorization:
  roles:
    read:
      - Support.Issues.ReadOwn
      - Support.Issues.ReadAll
      - Support.Issues.Manage
      - Support.Issues.All
    create:
      - Support.Issues.Create
      - Support.Issues.Manage
      - Support.Issues.All
    update:
      - Support.Issues.Manage
      - Support.Issues.All
    delete:
      - Support.Issues.Manage
      - Support.Issues.All
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: subject
    valueType: string
    required: true
    label:
      en: Subject
      nl: Onderwerp
    description:
      en: Short summary of the support issue.
      nl: Korte samenvatting van het supportverzoek.
    validation:
      minLength: 1
      maxLength: 300
    persisted:
      column: subject
      storageClass: core
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Beschrijving
    description:
      en: Detailed description of the problem, question, or request.
      nl: Gedetailleerde beschrijving van het probleem, de vraag of het verzoek.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    semanticType: multilineText
  - key: status
    valueType: string
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Current lifecycle status of the support issue.
      nl: Huidige levenscyclusstatus van het supportverzoek.
    defaultValue: open
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: SUPPORTSTATUS
    semanticType: referenceDataCode
  - key: priority
    valueType: string
    required: false
    label:
      en: Priority
      nl: Prioriteit
    description:
      en: Relative urgency or importance of the issue.
      nl: Relatieve urgentie of belangrijkheid van het verzoek.
    defaultValue: normal
    validation:
      maxLength: 50
    persisted:
      column: priority
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: SUPPORTPRIORITEIT
    semanticType: referenceDataCode
  - key: category
    valueType: string
    required: false
    label:
      en: Category
      nl: Categorie
    description:
      en: Functional category of the issue such as bug, question, or feature request.
      nl: Functionele categorie van het verzoek zoals bug, vraag of functieverzoek.
    validation:
      maxLength: 50
    persisted:
      column: category
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: SUPPORTCATEGORIE
    semanticType: referenceDataCode
  - key: resolvedAt
    valueType: datetime
    required: false
    readOnly: true
    label:
      en: Resolved at
      nl: Opgelost op
    description:
      en: Date and time when the issue was resolved.
      nl: Datum en tijd waarop het verzoek is opgelost.
    persisted:
      column: resolved_at
      storageClass: core
  - key: closedAt
    valueType: datetime
    required: false
    readOnly: true
    label:
      en: Closed at
      nl: Gesloten op
    description:
      en: Date and time when the issue was closed.
      nl: Datum en tijd waarop het verzoek is gesloten.
    persisted:
      column: closed_at
      storageClass: core
  - key: triageSummary
    valueType: string
    required: false
    label:
      en: Triage summary
      nl: Triage-samenvatting
    description:
      en: Short summary produced by the AI triage workflow.
      nl: Korte samenvatting gegenereerd door de AI-triage-workflow.
    validation:
      maxLength: 1000
    persisted:
      column: triage_summary
      storageClass: core
    semanticType: multilineText
  - key: triageSentiment
    valueType: string
    required: false
    label:
      en: Triage sentiment
      nl: Triage-sentiment
    description:
      en: AI-assessed tone of the reporter's message.
      nl: Door AI ingeschatte toon van de melding.
    validation:
      maxLength: 50
    persisted:
      column: triage_sentiment
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: TRIAGESENTIMENT
    semanticType: referenceDataCode
  - key: triageUrgency
    valueType: string
    required: false
    label:
      en: Triage urgency
      nl: Triage-urgentie
    description:
      en: AI-assessed urgency of the issue.
      nl: Door AI ingeschatte urgentie van het verzoek.
    validation:
      maxLength: 50
    persisted:
      column: triage_urgency
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: TRIAGEURGENTIE
    semanticType: referenceDataCode
  - key: triageAnalysis
    valueType: string
    required: false
    label:
      en: Triage analysis
      nl: Triage-analyse
    description:
      en: Free-form analysis produced by the AI triage workflow.
      nl: Vrije-tekst-analyse gegenereerd door de AI-triage-workflow.
    validation:
      maxLength: 5000
    persisted:
      column: triage_analysis
      storageClass: core
    semanticType: multilineText
  - key: triagedAt
    valueType: datetime
    required: false
    label:
      en: Triaged at
      nl: Getriageerd op
    description:
      en: Timestamp when the AI triage workflow last ran.
      nl: Tijdstip waarop de AI-triage-workflow voor het laatst is gedraaid.
    persisted:
      column: triaged_at
      storageClass: core
  - key: reporterId
    label:
      en: Reporter
      nl: Melder
    persisted:
      column: reporter_relation_id
      storageClass: core
    semanticType: Relation
    relationship:
      ownership: reference
  - key: assigneeId
    label:
      en: Assignee
      nl: Toegewezen aan
    persisted:
      column: assignee_account_id
      storageClass: core
    semanticType: Account
    relationship:
      ownership: reference
  - key: comments
    label:
      en: Comments
      nl: Opmerkingen
    semanticType: Comment
    cardinality: collection
    relationship:
      inverse: supportIssueId
      ownership: reference
  - key: attachments
    label:
      en: Attachments
      nl: Bijlagen
    semanticType: Attachment
    cardinality: collection
    relationship:
      inverse: supportIssueId
      ownership: reference
operations:
  list:
    name: List Support issue
    description: List SupportIssue records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Support issue
    description: Get SupportIssue records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Support issue
    description: Create SupportIssue records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update SupportIssue records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /support-issues
          nl: /support-issues
        columns:
          - key: subject
            sortable: true
          - key: status
            sortable: true
          - key: priority
            sortable: true
          - key: category
            sortable: true
        title:
          en: Support issues
          nl: Supportverzoeken
        defaultSort:
          key: status
          direction: asc
      record:
        routes:
          read:
            en: /support-issues/:id
            nl: /support-issues/:id
          create:
            en: /support-issues/create
            nl: /support-issues/aanmaken
        title: "{{subject}}"
        subtitle: "{{status}}"
        badges:
          - status
          - priority
          - category
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Issue
                    nl: Verzoek
                  fields:
                    - subject
                    - description
                    - status
                    - priority
                    - category
                - title:
                    en: Lifecycle
                    nl: Levenscyclus
                  fields:
                    - resolvedAt
                    - closedAt
            - id: comments
              relationship: comments
            - id: attachments
              relationship: attachments
        modes:
          create:
            title:
              en: Create support issue
              nl: Supportverzoek aanmaken
            groups:
              - title:
                  en: Issue
                  nl: Verzoek
                fields:
                  - subject
                  - description
                  - status
                  - priority
                  - category
          update:
            title:
              en: Edit support issue
              nl: Supportverzoek bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 6
            maxLength: 5000
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: SUPPORTSTATUS
            clearable: false
      priority:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: SUPPORTPRIORITEIT
            clearable: true
      category:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: SUPPORTCATEGORIE
            clearable: true
      resolvedAt:
        render:
          component: DateTimePicker
          props: {}
      closedAt:
        render:
          component: DateTimePicker
          props: {}
      triageSummary:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 1000
      triageSentiment:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: TRIAGESENTIMENT
            clearable: true
      triageUrgency:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: TRIAGEURGENTIE
            clearable: true
      triageAnalysis:
        render:
          component: Textarea
          props:
            rows: 6
            maxLength: 5000
      triagedAt:
        render:
          component: DateTimePicker
          props: {}
