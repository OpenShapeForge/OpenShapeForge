schemaVersion: 3
kind: coreEntity
module: core
entity: SurveyAnswer
title: Survey Answer
description: A respondent's answer to a survey question, including optional explanation.
language: en
displayTemplate: "{{answer}}"
filterField: answer
labels:
  en: Survey Answer
  nl: Vragenlijstantwoord
pluralLabels:
  en: Survey answers
  nl: Vragenlijstantwoorden
domains:
  - quality
retention:
  mode: policyRef
  policy: quality-retain-7y
  scope: record
  startsFrom:
    strategy: field
    field: answeredAt
authorization:
  roles:
    read:
      - Quality.All.Read
      - Quality.All.ReadWrite
    create:
      - Quality.All.ReadWrite
    update:
      - Quality.All.ReadWrite
    delete:
      - Quality.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    osfType: string
    required: false
    label:
      en: Code
      nl: Code
    description:
      en: Human-readable answer code.
      nl: Menselijk leesbare antwoordcode.
    validation:
      maxLength: 100
    persisted:
      column: code
      storageClass: core
  - key: answer
    required: false
    label:
      en: Answer
      nl: Antwoord
    description:
      en: The answer given by the respondent.
      nl: Het antwoord gegeven door de respondent.
    validation:
      maxLength: 4000
    persisted:
      column: answer
      storageClass: core
    osfType: multilineText
  - key: explanation
    required: false
    label:
      en: Explanation
      nl: Toelichting
    description:
      en: Additional explanation or context for the answer.
      nl: Aanvullende toelichting of context bij het antwoord.
    validation:
      maxLength: 4000
    persisted:
      column: explanation
      storageClass: core
    osfType: multilineText
  - key: answeredAt
    osfType: datetime
    required: false
    label:
      en: Answered at
      nl: Beantwoord op
    description:
      en: Timestamp when the answer was given.
      nl: Tijdstip waarop het antwoord is gegeven.
    persisted:
      column: answered_at
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional code in a connected source system.
      nl: Functionele code in een gekoppeld bronsysteem.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: questionId
    label:
      en: Question
      nl: Vraag
    persisted:
      column: survey_question_id
      storageClass: core
    osfType: SurveyQuestion
    relationship:
      ownership: reference
      inverse:
        key: answers
        label:
          en: Answers
          nl: Antwoorden
  - key: respondentId
    label:
      en: Respondent
      nl: Respondent
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  - key: researchResultId
    label:
      en: Research result
      nl: Onderzoeksresultaat
    persisted:
      column: research_result_id
      storageClass: core
    osfType: ResearchResult
    relationship:
      ownership: reference
      inverse:
        key: answers
        label:
          en: Answers
          nl: Antwoorden
operations:
  list:
    name: List Survey Answer
    description: List SurveyAnswer records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Survey Answer
    description: Get SurveyAnswer records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Survey Answer
    description: Create SurveyAnswer records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Survey Answer
    description: Update SurveyAnswer records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Survey Answer
    description: Delete SurveyAnswer records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    fields:
      answer:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 4000
      explanation:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 4000
      answeredAt:
        render:
          component: DateTimePicker
          props: {}
