schemaVersion: 3
kind: coreEntity
module: core
entity: SurveyQuestion
title: Survey Question
description: A single question within a survey, supporting various question types and conditional follow-up logic.
language: en
displayTemplate: "{{description}}"
filterField: description
labels:
  en: Survey Question
  nl: Vragenlijstregel
domains:
  - quality
retention:
  mode: policyRef
  policy: quality-retain-7y
  scope: record
  startsFrom:
    strategy: field
    field: createdAt
authorization:
  roles:
    read:
      - General.All.Read
      - General.All.ReadWrite
    create:
      - Quality.All.ReadWrite
    update:
      - Quality.All.ReadWrite
    delete:
      - Quality.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: code
    osfType: string
    required: false
    label:
      en: Code
      nl: Code
    description:
      en: Human-readable question code.
      nl: Menselijk leesbare vraagcode.
    validation:
      maxLength: 100
    persisted:
      column: code
      storageClass: core
  - key: questionKind
    required: false
    label:
      en: Question type
      nl: Vraagtype
    description:
      en: Type of question.
      nl: Type vraag.
    persisted:
      column: question_kind
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: SURVEYQUESTIONKIND
    osfType: referenceDataCode
  - key: description
    required: false
    label:
      en: Question text
      nl: Vraagtekst
    description:
      en: The question as presented to the respondent.
      nl: De vraag zoals voorgelegd aan de respondent.
    validation:
      maxLength: 4000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: subject
    required: false
    label:
      en: Subject
      nl: Onderwerp
    description:
      en: Thematic subject the question belongs to.
      nl: Thematisch onderwerp waar de vraag onder valt.
    persisted:
      column: subject
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: SURVEYQUESTIONSUBJECT
    osfType: referenceDataCode
  - key: origin
    required: false
    label:
      en: Origin
      nl: Herkomst
    description:
      en: Origin or source standard of the question.
      nl: Herkomst of bronstandaard van de vraag.
    persisted:
      column: origin
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: SURVEYQUESTIONORIGIN
    osfType: referenceDataCode
  - key: sequenceNumber
    osfType: integer
    required: false
    label:
      en: Sequence number
      nl: Volgordenummer
    description:
      en: Position of the question within the survey.
      nl: Positie van de vraag binnen de vragenlijst.
    persisted:
      column: sequence_number
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional code in a connected source system.
      nl: Functionele code in een gekoppeld bronsysteem.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: surveyId
    required: false
    label:
      en: Survey ID
      nl: Vragenlijst-id
    description:
      en: Identifier of the survey this question belongs to.
      nl: Identifier van de vragenlijst waar deze vraag bij hoort.
    osfType: Survey
    persisted:
      column: survey_id
      storageClass: core
    validation:
      format: uuid
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
      inverse:
        key: questions
        label:
          en: Questions
          nl: Vragen
  - key: parentQuestionId
    required: false
    label:
      en: Parent question ID
      nl: Bovenliggende vraag-id
    description:
      en: Identifier of the parent question for follow-up logic.
      nl: Identifier van de bovenliggende vraag voor vervolgvraag-logica.
    osfType: SurveyQuestion
    persisted:
      column: parent_question_id
      storageClass: core
    validation:
      format: uuid
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
      inverse:
        key: childQuestions
        label:
          en: Follow-up questions
          nl: Vervolgvragen
operations:
  list:
    name: List Survey Question
    description: List SurveyQuestion records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Survey Question
    description: Get SurveyQuestion records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Survey Question
    description: Create SurveyQuestion records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Survey Question
    description: Update SurveyQuestion records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Survey Question
    description: Delete SurveyQuestion records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list:
          enabled: true
          defaultSort:
            field: sequenceNumber
            direction: asc
        update: true
        delete: true
  web:
    fields:
      questionKind:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: SURVEYQUESTIONKIND
            clearable: true
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 4000
      subject:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: SURVEYQUESTIONSUBJECT
            clearable: true
      origin:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: SURVEYQUESTIONORIGIN
            clearable: true
