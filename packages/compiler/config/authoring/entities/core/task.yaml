schemaVersion: 3
kind: coreEntity
module: core
entity: Task
title: Task
description: A unit of work assigned to a user and optionally linked to a relation, appointment, or contact moment.
language: en
displayTemplate: "{{title}}"
filterField: title
labels:
  en: Task
  nl: Taak
pluralLabels:
  en: Tasks
  nl: Taken
domains:
  - tasks
authorization:
  roles:
    read:
      - General.All.Read
      - General.All.ReadWrite
    create:
      - General.All.ReadWrite
    update:
      - General.All.ReadWrite
    delete:
      - General.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: title
    osfType: string
    required: true
    label:
      en: Title
      nl: Titel
    description:
      en: Short task title.
      nl: Korte titel van de taak.
    validation:
      minLength: 1
      maxLength: 300
    persisted:
      column: title
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Beschrijving
    description:
      en: Detailed task instructions or context.
      nl: Gedetailleerde instructies of context voor de taak.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: type
    required: true
    label:
      en: Type
      nl: Type
    description:
      en: Functional task type such as follow-up, review, intake, or approval.
      nl: Functioneel taaktype zoals opvolging, beoordeling, intake of goedkeuring.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: TAAKTYPE
    osfType: referenceDataCode
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Current lifecycle status of the task.
      nl: Huidige levenscyclusstatus van de taak.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: TAAKSTATUS
    osfType: referenceDataCode
  - key: priority
    required: false
    label:
      en: Priority
      nl: Prioriteit
    description:
      en: Relative urgency or importance of the task.
      nl: Relatieve urgentie of belangrijkheid van de taak.
    validation:
      maxLength: 50
    persisted:
      column: priority
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: TAAKPRIORITEIT
    osfType: referenceDataCode
  - key: workQueueId
    required: false
    osfType: WorkQueue
    label:
      en: Work queue
      nl: Werkqueue
    description:
      en: Queue currently responsible for this task.
      nl: Queue die momenteel verantwoordelijk is voor deze taak.
    validation:
      format: uuid
    persisted:
      column: work_queue_id
      storageClass: core
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
  - key: startDateTime
    osfType: datetime
    required: false
    label:
      en: Start date/time
      nl: Startdatum/-tijd
    description:
      en: Planned start moment of the task.
      nl: Gepland startmoment van de taak.
    persisted:
      column: start_date_time
      storageClass: core
  - key: dueDateTime
    osfType: datetime
    required: false
    label:
      en: Due date/time
      nl: Uiterste datum/tijd
    description:
      en: Deadline for completing the task.
      nl: Deadline voor het afronden van de taak.
    persisted:
      column: due_date_time
      storageClass: core
  - key: completedAt
    osfType: datetime
    required: false
    readOnly: true
    writeSource: caller
    label:
      en: Completed at
      nl: Afgerond op
    description:
      en: Date and time when the task was completed.
      nl: Datum en tijd waarop de taak is afgerond.
    persisted:
      column: completed_at
      storageClass: core
  - key: estimatedMinutes
    osfType: integer
    required: false
    label:
      en: Estimated minutes
      nl: Geschatte minuten
    description:
      en: Estimated effort in minutes.
      nl: Geschatte inspanning in minuten.
    persisted:
      column: estimated_minutes
      storageClass: core
  - key: actualMinutes
    osfType: integer
    required: false
    label:
      en: Actual minutes
      nl: Werkelijke minuten
    description:
      en: Actual effort spent in minutes.
      nl: Werkelijke bestede inspanning in minuten.
    persisted:
      column: actual_minutes
      storageClass: core
  - key: outcome
    required: false
    label:
      en: Outcome
      nl: Resultaat
    description:
      en: Captured outcome, resolution, or completion note.
      nl: Vastgelegd resultaat, oplossing of afrondnotitie.
    validation:
      maxLength: 2000
    persisted:
      column: outcome
      storageClass: core
    osfType: multilineText
  - key: openUrl
    osfType: string
    required: false
    label:
      en: Open URL
      nl: Open-URL
    description:
      en: Primary URL or deeplink to open this task in context.
      nl: Primaire URL of deeplink om deze taak in context te openen.
    validation:
      maxLength: 1000
    persisted:
      column: open_url
      storageClass: core
  - key: metadata
    osfType: object
    required: false
    label:
      en: Metadata
      nl: Metadata
    description:
      en: Structured metadata for workflow context, assignment hints, and integration state.
      nl: Gestructureerde metadata voor workflowcontext, toewijzingshints en integratiestatus.
    persisted:
      column: metadata
      storageClass: core
    children:
      - key: source
        osfType: string
        required: false
        label:
          en: Source
          nl: Bron
      - key: label
        osfType: string
        required: false
        label:
          en: Label
          nl: Label
      - key: timeout
        osfType: string
        required: false
        label:
          en: Timeout
          nl: Time-out
      - key: assignmentTarget
        osfType: string
        required: false
        label:
          en: Assignment target
          nl: Toewijzingsdoel
      - key: allowedRoles
        osfType: string
        required: false
        label:
          en: Allowed roles
          nl: Toegestane rollen
        cardinality:
          min: 0
          max: unbounded
        item:
          key: role
          osfType: string
          required: false
          label:
            en: Role
            nl: Rol
  - key: formDefinition
    osfType: object
    required: false
    label:
      en: Form definition
      nl: Formulierdefinitie
    description:
      en: Structured form definition rendered when the task is opened or completed.
      nl: Gestructureerde formulierdefinitie die wordt getoond wanneer de taak wordt geopend of afgehandeld.
    persisted:
      column: form_definition
      storageClass: core
    children:
      - key: schemaVersion
        osfType: integer
        required: false
        label:
          en: Schema version
          nl: Schemaversie
      - key: id
        osfType: string
        required: false
        label:
          en: ID
          nl: Id
      - key: kind
        osfType: string
        required: false
        label:
          en: Kind
          nl: Soort
      - key: mode
        osfType: string
        required: false
        label:
          en: Mode
          nl: Modus
      - key: title
        osfType: string
        required: false
        label:
          en: Title
          nl: Titel
      - key: description
        required: false
        label:
          en: Description
          nl: Beschrijving
        osfType: multilineText
      - key: metadata
        osfType: object
        required: false
        label:
          en: Metadata
          nl: Metadata
      - key: presentation
        osfType: object
        required: false
        label:
          en: Presentation
          nl: Presentatie
        children:
          - key: surface
            osfType: string
            required: false
            label:
              en: Surface
              nl: Oppervlak
          - key: density
            osfType: string
            required: false
            label:
              en: Density
              nl: Dichtheid
          - key: groupInterpretation
            osfType: string
            required: false
            label:
              en: Group interpretation
              nl: Groepsinterpretatie
            cardinality:
              min: 0
              max: unbounded
            item:
              key: interpretation
              osfType: string
              required: false
              label:
                en: Interpretation
                nl: Interpretatie
          - key: layout
            osfType: object
            required: false
            label:
              en: Layout
              nl: Layout
            children:
              - key: columns
                osfType: integer
                required: false
                label:
                  en: Columns
                  nl: Kolommen
          - key: chrome
            osfType: object
            required: false
            label:
              en: Chrome
              nl: Chrome
            children:
              - key: showTitle
                osfType: boolean
                required: false
                label:
                  en: Show title
                  nl: Toon titel
              - key: showDescription
                osfType: boolean
                required: false
                label:
                  en: Show description
                  nl: Toon beschrijving
              - key: showGroupTitles
                osfType: boolean
                required: false
                label:
                  en: Show group titles
                  nl: Toon groepstitels
              - key: showGroupDescriptions
                osfType: boolean
                required: false
                label:
                  en: Show group descriptions
                  nl: Toon groepsbeschrijvingen
              - key: showActionBar
                osfType: boolean
                required: false
                label:
                  en: Show action bar
                  nl: Toon actiebalk
      - key: submission
        osfType: object
        required: false
        label:
          en: Submission
          nl: Indiening
        children:
          - key: successRoute
            osfType: string
            required: false
            label:
              en: Success route
              nl: Succesroute
          - key: successBehavior
            osfType: string
            required: false
            label:
              en: Success behavior
              nl: Succesgedrag
      - key: fields
        label:
          en: Fields
          nl: Velden
        cardinality:
          min: 0
          max: unbounded
        osfType: fieldDefinition
        authoring:
          profile: formDefinitionField
      - key: groups
        osfType: object
        required: false
        label:
          en: Groups
          nl: Groepen
        cardinality:
          min: 0
          max: unbounded
        item:
          key: group
          osfType: object
      - key: fieldConfig
        osfType: object
        required: false
        label:
          en: Field config
          nl: Veldconfiguratie
      - key: actions
        osfType: object
        required: false
        label:
          en: Actions
          nl: Acties
        cardinality:
          min: 0
          max: unbounded
        item:
          key: actionItem
          osfType: object
          children:
            - key: key
              osfType: string
              required: true
              label:
                en: Key
                nl: Sleutel
            - key: label
              osfType: string
              required: true
              label:
                en: Button label
                nl: Knop-label
              localized: true
            - key: description
              osfType: string
              required: false
              label:
                en: Helper text
                nl: Hulptekst
              localized: true
            - key: icon
              osfType: string
              required: false
              label:
                en: Icon
                nl: Icoon
            - key: tone
              required: false
              label:
                en: Tone
                nl: Uitstraling
              options:
                type: static
                items:
                  - value: primary
                    label:
                      en: Primary
                      nl: Primair
                  - value: default
                    label:
                      en: Default
                      nl: Standaard
                  - value: destructive
                    label:
                      en: Destructive
                      nl: Destructief
              osfType: referenceDataCode
            - key: visibleWhen
              osfType: object
              required: false
              label:
                en: Visible when
                nl: Zichtbaar wanneer
            - key: disabledWhen
              osfType: object
              required: false
              label:
                en: Disabled when
                nl: Uitgeschakeld wanneer
            - key: disabledMessage
              osfType: string
              required: false
              label:
                en: Disabled tooltip
                nl: Bericht bij uitgeschakeld
              localized: true
  - key: output
    osfType: object
    required: false
    label:
      en: Output
      nl: Uitvoer
    description:
      en: Structured values from the task form (e.g. workflow-defined fields). Omit on create unless importing; set via
        updateTask when the user submits or saves.
      nl: Gestructureerde waarden uit het taakformulier (bijv. workflowvelden). Bij aanmaken weglaten tenzij import; zetten
        via updateTask bij opslaan of afronden.
    persisted:
      column: output
      storageClass: core
  - key: isBlocking
    osfType: boolean
    required: false
    label:
      en: Blocking
      nl: Blokkerend
    description:
      en: Whether this task blocks further processing.
      nl: Of deze taak verdere verwerking blokkeert.
    defaultValue: false
    persisted:
      column: is_blocking
      storageClass: core
  - key: caseStepId
    required: false
    readOnly: true
    writeSource: caller
    osfType: ProcessStep
    label:
      en: Case step ID
      nl: Zaakstap-ID
    description:
      en: Runtime case step that created or owns this task. Technically references the current process-step table until the
        table is renamed.
      nl: Runtime zaakstap die deze taak heeft aangemaakt of bezit. Verwijst technisch naar de huidige processtaptabel totdat
        die tabel hernoemd wordt.
    validation:
      format: uuid
    persisted:
      column: case_step_id
      storageClass: core
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
  - key: caseStepActionId
    osfType: string
    required: false
    readOnly: true
    writeSource: caller
    label:
      en: Case step action ID
      nl: Zaakstapactie-ID
    description:
      en: Runtime case-step action that created or owns this task.
      nl: Runtime zaakstapactie die deze taak heeft aangemaakt of bezit.
    validation:
      format: uuid
    persisted:
      column: case_step_action_id
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  - key: assigneeId
    label:
      en: Assignee
      nl: Toegewezen aan
    persisted:
      column: assignee_account_id
      storageClass: core
    osfType: Account
    relationship:
      ownership: reference
      inverse: false
  - key: ownerId
    label:
      en: Owner
      nl: Eigenaar
    persisted:
      column: owner_account_id
      storageClass: core
    osfType: Account
    relationship:
      ownership: reference
      inverse: false
  - key: appointmentId
    label:
      en: Appointment
      nl: Afspraak
    persisted:
      column: appointment_id
      storageClass: core
    osfType: Appointment
    relationship:
      ownership: reference
  - key: contactMomentId
    label:
      en: Contact moment
      nl: Contactmoment
    persisted:
      column: contact_moment_id
      storageClass: core
    osfType: ContactMoment
    relationship:
      ownership: reference
  - key: caseId
    label:
      en: Case
      nl: Zaak
    persisted:
      column: case_id
      storageClass: core
    osfType: Case
    relationship:
      ownership: reference
  - key: parentTaskId
    label:
      en: Parent task
      nl: Hoofdtaak
    persisted:
      column: parent_task_id
      storageClass: core
    osfType: Task
    relationship:
      ownership: reference
      inverse:
        key: subtasks
        label:
          en: Subtasks
          nl: Subtaken
operations:
  list:
    name: List Task
    description: List Task records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Task
    description: Get Task records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Task
    description: Create Task records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Task records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /tasks
          nl: /taken
        columns:
          - key: title
            sortable: true
          - key: type
            sortable: true
          - key: status
            sortable: true
          - key: priority
            sortable: true
          - key: dueDateTime
            sortable: true
        title:
          en: Tasks
          nl: Taken
        defaultSort:
          key: dueDateTime
          direction: asc
      record:
        routes:
          read:
            en: /tasks/:id
            nl: /taken/:id
          create:
            en: /tasks/create
            nl: /taken/aanmaken
        title: "{{title}}"
        subtitle: "{{status}}"
        badges:
          - type
          - priority
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Task details
                    nl: Taakgegevens
                  fields:
                    - title
                    - description
                    - type
                    - status
                    - priority
                    - isBlocking
                - title:
                    en: Planning
                    nl: Planning
                  fields:
                    - startDateTime
                    - dueDateTime
                    - completedAt
                    - estimatedMinutes
                    - actualMinutes
                - title:
                    en: Outcome
                    nl: Resultaat
                  fields:
                    - outcome
                    - output
                - title:
                    en: Integration
                    nl: Integratie
                  fields:
                    - openUrl
                    - metadata
                    - formDefinition
            - id: subtasks
              label:
                en: Subtasks
                nl: Subtaken
              relationship: subtasks
        modes:
          create:
            title:
              en: Create task
              nl: Taak aanmaken
            groups:
              - title:
                  en: Task details
                  nl: Taakgegevens
                fields:
                  - title
                  - description
                  - type
                  - status
                  - priority
                  - isBlocking
              - title:
                  en: Planning
                  nl: Planning
                fields:
                  - startDateTime
                  - dueDateTime
                  - estimatedMinutes
              - title:
                  en: Outcome
                  nl: Resultaat
                fields:
                  - outcome
                  - output
              - title:
                  en: Integration
                  nl: Integratie
                fields:
                  - openUrl
                  - metadata
                  - formDefinition
          update:
            title:
              en: Edit task
              nl: Taak bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 5
            maxLength: 5000
      type:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: TAAKTYPE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: TAAKSTATUS
            clearable: false
      priority:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: TAAKPRIORITEIT
            clearable: true
      workQueueId:
        render:
          component: EntityReferenceDisplay
      startDateTime:
        render:
          component: DateTimePicker
          props: {}
      dueDateTime:
        render:
          component: DateTimePicker
          props: {}
      completedAt:
        render:
          component: DateTimePicker
          props: {}
      outcome:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 2000
      openUrl:
        render:
          component: Input
      formDefinition.description:
        render:
          component: Textarea
          props:
            rows: 3
      formDefinition.metadata:
        render:
          component: JsonFieldEditor
          props:
            rows: 8
      formDefinition.groups:
        render:
          component: JsonFieldEditor
          props:
            rows: 12
      formDefinition.fieldConfig:
        render:
          component: JsonFieldEditor
          props:
            rows: 10
      formDefinition.actions.actionItem.key:
        render:
          component: Input
      formDefinition.actions.actionItem.label:
        render:
          component: Input
      formDefinition.actions.actionItem.description:
        render:
          component: Input
      formDefinition.actions.actionItem.icon:
        render:
          component: IconPicker
      formDefinition.actions.actionItem.tone:
        render:
          component: ReferenceSelect
          props:
            clearable: false
      formDefinition.actions.actionItem.visibleWhen:
        render:
          component: JsonFieldEditor
      formDefinition.actions.actionItem.disabledWhen:
        render:
          component: JsonFieldEditor
      formDefinition.actions.actionItem.disabledMessage:
        render:
          component: Input
      output:
        render:
          component: JsonFieldEditor
          props:
            rows: 10
