schemaVersion: 3
kind: coreEntity
module: core
entity: Task
title: Task
description: A unit of work assigned to a user and optionally linked to a relation, appointment, or contact moment.
language: en
displayTemplate: "{{title}}"
filterField: title
labels:
  en: Task
  nl: Taak
pluralLabels:
  en: Tasks
  nl: Taken
domains:
  - tasks
authorization:
  roles:
    read:
      - General.All.Read
      - General.All.ReadWrite
      - Tasks.All.Read
    create:
      - General.All.ReadWrite
    update:
      - General.All.ReadWrite
    delete:
      - General.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: title
    osfType: string
    required: true
    label:
      en: Title
      nl: Titel
    description:
      en: Short task title.
      nl: Korte titel van de taak.
    validation:
      minLength: 1
      maxLength: 300
    persisted:
      column: title
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Beschrijving
    description:
      en: Detailed task instructions or context.
      nl: Gedetailleerde instructies of context voor de taak.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: type
    required: true
    label:
      en: Type
      nl: Type
    description:
      en: Functional task type such as follow-up, review, intake, or approval.
      nl: Functioneel taaktype zoals opvolging, beoordeling, intake of goedkeuring.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: TAAKTYPE
    osfType: referenceDataCode
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Current lifecycle status of the task.
      nl: Huidige levenscyclusstatus van de taak.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: TAAKSTATUS
    osfType: referenceDataCode
  - key: priority
    required: false
    label:
      en: Priority
      nl: Prioriteit
    description:
      en: Relative urgency or importance of the task.
      nl: Relatieve urgentie of belangrijkheid van de taak.
    validation:
      maxLength: 50
    persisted:
      column: priority
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: TAAKPRIORITEIT
    osfType: referenceDataCode
  - key: workQueueId
    required: false
    osfType: WorkQueue
    label:
      en: Work queue
      nl: Werkqueue
    description:
      en: Queue currently responsible for this task.
      nl: Queue die momenteel verantwoordelijk is voor deze taak.
    validation:
      format: uuid
    persisted:
      column: work_queue_id
      storageClass: core
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
  - key: startDateTime
    osfType: datetime
    required: false
    label:
      en: Start date/time
      nl: Startdatum/-tijd
    description:
      en: Planned start moment of the task.
      nl: Gepland startmoment van de taak.
    persisted:
      column: start_date_time
      storageClass: core
  - key: dueDateTime
    osfType: datetime
    required: false
    label:
      en: Due date/time
      nl: Uiterste datum/tijd
    description:
      en: Deadline for completing the task.
      nl: Deadline voor het afronden van de taak.
    persisted:
      column: due_date_time
      storageClass: core
  - key: completedAt
    osfType: datetime
    required: false
    readOnly: true
    writeSource: caller
    label:
      en: Completed at
      nl: Afgerond op
    description:
      en: Date and time when the task was completed.
      nl: Datum en tijd waarop de taak is afgerond.
    persisted:
      column: completed_at
      storageClass: core
  - key: estimatedMinutes
    osfType: integer
    required: false
    label:
      en: Estimated minutes
      nl: Geschatte minuten
    description:
      en: Estimated effort in minutes.
      nl: Geschatte inspanning in minuten.
    persisted:
      column: estimated_minutes
      storageClass: core
  - key: actualMinutes
    osfType: integer
    required: false
    label:
      en: Actual minutes
      nl: Werkelijke minuten
    description:
      en: Actual effort spent in minutes.
      nl: Werkelijke bestede inspanning in minuten.
    persisted:
      column: actual_minutes
      storageClass: core
  - key: outcome
    required: false
    label:
      en: Outcome
      nl: Resultaat
    description:
      en: Captured outcome, resolution, or completion note.
      nl: Vastgelegd resultaat, oplossing of afrondnotitie.
    validation:
      maxLength: 2000
    persisted:
      column: outcome
      storageClass: core
    osfType: multilineText
  - key: openUrl
    osfType: string
    required: false
    label:
      en: Open URL
      nl: Open-URL
    description:
      en: Primary URL or deeplink to open this task in context.
      nl: Primaire URL of deeplink om deze taak in context te openen.
    validation:
      maxLength: 1000
    persisted:
      column: open_url
      storageClass: core
  - key: metadata
    osfType: object
    required: false
    label:
      en: Metadata
      nl: Metadata
    description:
      en: Structured metadata for workflow context, assignment hints, and integration state.
      nl: Gestructureerde metadata voor workflowcontext, toewijzingshints en integratiestatus.
    persisted:
      column: metadata
      storageClass: core
    children:
      - key: source
        osfType: string
        required: false
        label:
          en: Source
          nl: Bron
      - key: label
        osfType: string
        required: false
        label:
          en: Label
          nl: Label
      - key: timeout
        osfType: string
        required: false
        label:
          en: Timeout
          nl: Time-out
      - key: assignmentTarget
        osfType: string
        required: false
        label:
          en: Assignment target
          nl: Toewijzingsdoel
      - key: allowedRoles
        osfType: string
        required: false
        label:
          en: Allowed roles
          nl: Toegestane rollen
        cardinality:
          min: 0
          max: unbounded
        item:
          key: role
          osfType: string
          required: false
          label:
            en: Role
            nl: Rol
  - key: isBlocking
    osfType: boolean
    required: false
    label:
      en: Blocking
      nl: Blokkerend
    description:
      en: Whether this task blocks further processing.
      nl: Of deze taak verdere verwerking blokkeert.
    defaultValue: false
    persisted:
      column: is_blocking
      storageClass: core
  - key: caseStepId
    required: false
    readOnly: true
    writeSource: caller
    osfType: ProcessStep
    label:
      en: Case step ID
      nl: Zaakstap-ID
    description:
      en: Runtime case step that created or owns this task. Technically references the current process-step table until the
        table is renamed.
      nl: Runtime zaakstap die deze taak heeft aangemaakt of bezit. Verwijst technisch naar de huidige processtaptabel totdat
        die tabel hernoemd wordt.
    validation:
      format: uuid
    persisted:
      column: case_step_id
      storageClass: core
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
  - key: caseStepActionId
    osfType: string
    required: false
    readOnly: true
    writeSource: caller
    label:
      en: Case step action ID
      nl: Zaakstapactie-ID
    description:
      en: Runtime case-step action that created or owns this task.
      nl: Runtime zaakstapactie die deze taak heeft aangemaakt of bezit.
    validation:
      format: uuid
    persisted:
      column: case_step_action_id
      storageClass: core
  - key: relationId
    label:
      en: Relation
      nl: Relatie
    persisted:
      column: relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse:
        key: tasks
  - key: assigneeId
    label:
      en: Assignee
      nl: Toegewezen aan
    persisted:
      column: assignee_account_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse: false
  - key: ownerId
    label:
      en: Owner
      nl: Eigenaar
    persisted:
      column: owner_account_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
      inverse: false
  - key: appointmentId
    label:
      en: Appointment
      nl: Afspraak
    persisted:
      column: appointment_id
      storageClass: core
    osfType: Appointment
    relationship:
      ownership: reference
  - key: contactMomentId
    label:
      en: Contact moment
      nl: Contactmoment
    persisted:
      column: contact_moment_id
      storageClass: core
    osfType: ContactMoment
    relationship:
      ownership: reference
  - key: caseId
    label:
      en: Case
      nl: Zaak
    persisted:
      column: case_id
      storageClass: core
    osfType: Case
    relationship:
      ownership: reference
  - key: parentTaskId
    label:
      en: Parent task
      nl: Hoofdtaak
    persisted:
      column: parent_task_id
      storageClass: core
    osfType: Task
    relationship:
      ownership: reference
      inverse:
        key: subtasks
        label:
          en: Subtasks
          nl: Subtaken
operations:
  list:
    name: List Task
    description: List Task records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Task
    description: Get Task records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Task
    description: Create Task records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Task records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  mcp:
    tools: generic
    operations:
      create: false
      update: false
      delete: false
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /tasks
          nl: /taken
        columns:
          - key: title
            sortable: true
          - key: type
            sortable: true
          - key: status
            sortable: true
          - key: priority
            sortable: true
          - key: dueDateTime
            sortable: true
        title:
          en: Tasks
          nl: Taken
        defaultSort:
          key: dueDateTime
          direction: asc
      record:
        routes:
          read:
            en: /tasks/:id
            nl: /taken/:id
          create:
            en: /tasks/create
            nl: /taken/aanmaken
        title: "{{title}}"
        subtitle: "{{status}}"
        badges:
          - type
          - priority
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Task details
                    nl: Taakgegevens
                  fields:
                    - title
                    - description
                    - type
                    - status
                    - priority
                    - isBlocking
                - title:
                    en: Planning
                    nl: Planning
                  fields:
                    - startDateTime
                    - dueDateTime
                    - completedAt
                    - estimatedMinutes
                    - actualMinutes
                - title:
                    en: Outcome
                    nl: Resultaat
                  fields:
                    - outcome
                - title:
                    en: Integration
                    nl: Integratie
                  fields:
                    - openUrl
                    - metadata
            - id: subtasks
              label:
                en: Subtasks
                nl: Subtaken
              relationship: subtasks
        modes:
          create:
            title:
              en: Create task
              nl: Taak aanmaken
            groups:
              - title:
                  en: Task details
                  nl: Taakgegevens
                fields:
                  - title
                  - description
                  - type
                  - status
                  - priority
                  - isBlocking
              - title:
                  en: Planning
                  nl: Planning
                fields:
                  - startDateTime
                  - dueDateTime
                  - estimatedMinutes
              - title:
                  en: Outcome
                  nl: Resultaat
                fields:
                  - outcome
              - title:
                  en: Integration
                  nl: Integratie
                fields:
                  - openUrl
                  - metadata
          update:
            title:
              en: Edit task
              nl: Taak bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 5
            maxLength: 5000
      type:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: TAAKTYPE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: TAAKSTATUS
            clearable: false
      priority:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: TAAKPRIORITEIT
            clearable: true
      workQueueId:
        render:
          component: EntityReferenceDisplay
      startDateTime:
        render:
          component: FieldDateAndTime
          props: {}
      dueDateTime:
        render:
          component: FieldDateAndTime
          props: {}
      completedAt:
        render:
          component: FieldDateAndTime
          props: {}
      outcome:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 2000
      openUrl:
        render:
          component: Input
