schemaVersion: 3
kind: coreEntity
module: core
entity: TemplateBlock
title: Template block
description: A block definition that includes another published template version in the content being composed,
  resolved from that version's frozen snapshot. It carries no identity of its own; the Block placement selecting this
  definition does.
language: en
labels: { en: Template block, nl: Templateblok }
pluralLabels: { en: Template blocks, nl: Templateblokken }
domains: [documents]
baseEntity: false
displayTemplate: "{{version}}"
authorization:
  roles:
    read: [Templates.Read, Templates.Manage, General.All.Read, General.All.ReadWrite]
fields:
  - key: version
    osfType: TemplateVersion
    required: true
    options: { type: entity, source: Template, valueField: publishedVersionId }
    label: { en: Template version, nl: Templateversie }
    description:
      en: The published template version this block includes. The inclusion resolves from that version's frozen
        snapshot, so republishing the included template does not change it.
      nl: De gepubliceerde templateversie die dit blok opneemt. De opname wordt opgelost uit de vastgelegde snapshot
        van die versie, dus opnieuw publiceren van de opgenomen template verandert hem niet.
  - key: parameters
    osfType: object
    valueFieldsFrom: { reference: version, field: parameters }
    # A value may name a variable of the including template, so a proposal's
    # own title can be handed on to the cover it includes: as text among other
    # text, or as the whole value, which keeps its type (a date stays a date).
    variables: both
    defaultValue: {}
    label: { en: Local values, nl: Lokale waarden }
    description:
      en: Values for the local variables of the included template version, used for this inclusion only. A value may
        hold a `{{…}}` token of the including template; it is resolved there and handed on as data.
      nl: Waarden voor de lokale variabelen van de opgenomen templateversie, alleen voor deze opname. Een waarde mag
        een `{{…}}`-token van de opnemende template bevatten; dat wordt daar opgelost en als data doorgegeven.
operations:
  materialize:
    name: Materialize included template
    description: Include the typed template reference using the same materialization cycle and size limits.
    implementation: { type: plugin, plugin: documents, handler: composeTemplate }
    target: { scope: collection }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [definitionKey, values, references, referenceField, parametersField]
        properties:
          definitionKey: { type: string, const: TemplateBlock }
          values: { type: object }
          references: { type: object }
          referenceField: { type: string, const: version }
          parametersField: { type: string, const: parameters }
    output: { schema: { type: object } }
    errors: []
    auth: { mode: session, roles: [Templates.Read, Templates.Manage, General.All.Read, General.All.ReadWrite] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
interfaces:
  rest:
    operations:
      materialize: { method: POST, path: /api/content-blocks/template/materialize }
  mcp: { tools: generic }
