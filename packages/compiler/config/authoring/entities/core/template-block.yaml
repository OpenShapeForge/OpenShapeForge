schemaVersion: 3
kind: coreEntity
module: core
entity: TemplateBlock
title: Template block
description: A block definition that includes another published template version in the content being composed, as
  a complete copy the server captures from that version's frozen snapshot. It carries no identity of its own; the
  Block placement selecting this definition does.
language: en
labels: { en: Template block, nl: Templateblok }
pluralLabels: { en: Template blocks, nl: Templateblokken }
domains: [documents]
baseEntity: false
displayTemplate: "{{version}}"
authorization:
  roles:
    read: [Templates.Read, Templates.Manage, General.All.Read, General.All.ReadWrite]
fields:
  - key: version
    osfType: TemplateVersion
    required: true
    options: { type: entity, source: Template, valueField: publishedVersionId }
    label: { en: Template version, nl: Templateversie }
    description:
      en: The published template version this block was captured from. Republishing the included template does not
        change the copy; choosing another version updates it and keeps local changes.
      nl: De gepubliceerde templateversie waaruit dit blok is overgenomen. Opnieuw publiceren van de opgenomen
        template verandert de kopie niet; een andere versie kiezen werkt haar bij en behoudt lokale wijzigingen.
  - key: parameters
    osfType: object
    valueFieldsFrom: { reference: version, field: parameters }
    # A value may name a variable of the including template, so a proposal's
    # own title can be handed on to the cover it includes: as text among other
    # text, or as the whole value, which keeps its type (a date stays a date).
    variables: both
    defaultValue: {}
    label: { en: Local values, nl: Lokale waarden }
    description:
      en: Values for the local variables of the included template version, used for this inclusion only. A value may
        hold a `{{…}}` token of the including template; what depends on it stays open until that template has the value.
      nl: Waarden voor de lokale variabelen van de opgenomen templateversie, alleen voor deze opname. Een waarde mag
        een `{{…}}`-token van de opnemende template bevatten; wat ervan afhangt blijft open tot die template de waarde heeft.
  - key: content
    osfType: object
    label: { en: Local block content, nl: Lokale blokinhoud }
    description:
      en: Complete host-owned content captured by the server on insertion or explicit update. Source locks remain protected.
      nl: Volledige eigen inhoud, door de server vastgelegd bij invoegen of expliciet bijwerken. Bronvergrendelingen blijven beschermd.
    children:
      - key: page
        osfType: object
      # The server's record of what was captured, one entry per source block in source order. `deferred` marks a
      # block that still names a variable of the including template, which binds it when it is read.
      - key: source
        osfType: object
        cardinality: collection
        required: true
        children:
          - { key: id, osfType: string, required: true }
          - { key: hash, osfType: string, required: true }
          - { key: locked, osfType: boolean }
          - { key: deferred, osfType: boolean }
      - key: blocks
        osfType: object
        cardinality: collection
        required: true
        children:
          - { key: id, osfType: string, required: true }
          - { key: definitionKey, osfType: string, required: true }
          - { key: schemaVersion, osfType: integer, required: true }
          - { key: values, osfType: object, required: true }
          - { key: references, osfType: object }
          - { key: region, osfType: string }
          - { key: layoutKey, osfType: string }
          - { key: locked, osfType: boolean }
operations:
  materialize:
    name: Prepare included template
    description: Prepare the complete copy an inclusion would store for the given template version, inputs and local
      draft, in the named host and optionally for a saved block or an inclusion nested in it. Reads only; saving the
      block is what stores a copy.
    implementation: { type: plugin, plugin: documents, handler: composeTemplate }
    target: { scope: collection }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [definitionKey, values, references, referenceField, parametersField, host]
        properties:
          definitionKey: { type: string, const: TemplateBlock }
          values: { type: object }
          references: { type: object }
          referenceField: { type: string, const: version }
          parametersField: { type: string, const: parameters }
          host:
            type: object
            additionalProperties: false
            required: [entity, id]
            properties:
              entity: { type: string, enum: [TemplateVariant, DocumentVariant] }
              id: { type: string, format: uuid }
          blockId: { type: string, format: uuid }
          path:
            type: array
            maxItems: 8
            items: { type: string, minLength: 1, maxLength: 128 }
    output: { schema: { type: object } }
    errors: []
    auth: { mode: session, roles: [Templates.Read, Templates.Manage, General.All.Read, General.All.ReadWrite] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
interfaces:
  rest:
    operations:
      materialize: { method: POST, path: /api/content-blocks/template/materialize }
  mcp: { tools: generic }
