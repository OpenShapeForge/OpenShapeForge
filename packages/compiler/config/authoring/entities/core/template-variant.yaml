schemaVersion: 3
kind: coreEntity
module: core
entity: TemplateVariant
title: Template variant
description: One channel and content language of a template's editable content, holding the ordered blocks for that
  combination. Materialization matches the channel exactly and serves the language by closest match, falling back to
  the variant marked default for the channel.
language: en
labels: { en: Template variant, nl: Template variant }
pluralLabels: { en: Template variants, nl: Templatevarianten }
domains: [documents]
authorization:
  roles:
    read: [Templates.Read, Templates.Manage, General.All.Read, General.All.ReadWrite]
    create: [Templates.Manage]
    update: [Templates.Manage]
    delete: [Templates.Manage]
displayTemplate: "{{channel}} · {{locale}}"
indexes:
  - { name: template_variants_tenant_channel_locale_uidx, fields: [tenantId, template, channel, locale], unique: true }
  # At most one default variant per channel of a template.
  - { name: template_variants_tenant_channel_default_uidx, fields: [tenantId, template, channel], unique: true, where: { field: isDefault, equals: true } }
fields:
  - key: template
    label: { en: Template, nl: Template }
    osfType: Template
    required: true
    immutable: true
    relationship:
      inverse:
        key: variants
        ownership: owned
  - key: channel
    label: { en: Channel, nl: Kanaal }
    description:
      en: Delivery channel this variant's content is for. Materialization matches the channel exactly; a variant of
        another channel is never substituted.
      nl: Afleverkanaal waarvoor de inhoud van deze variant bedoeld is. Materialisatie matcht het kanaal exact; een
        variant van een ander kanaal komt nooit in de plaats.
    osfType: string
    required: true
    options:
      type: static
      items:
        - { value: document, label: { en: Document, nl: Document } }
        - { value: email, label: { en: Email, nl: E-mail } }
        - { value: whatsapp, label: { en: WhatsApp, nl: WhatsApp } }
    persisted: { column: channel, storageClass: core }
  - key: locale
    osfType: string
    required: true
    defaultValue: nl
    validation: { pattern: "^[a-z]{2}(-[A-Z]{2})?$" }
    label: { en: Content language, nl: Inhoudstaal }
    description:
      en: Content language of this variant. A request is served by the exact language tag, else by a variant of the
        same language, else by the variant marked default for this channel.
      nl: Inhoudstaal van deze variant. Een aanvraag wordt bediend door de exacte taalcode, anders door een variant met
        dezelfde taal, anders door de variant die als standaard voor dit kanaal is gemarkeerd.
    persisted: { column: locale, storageClass: core }
  - key: isDefault
    label: { en: Default for channel, nl: Standaard voor kanaal }
    description:
      en: Served for this channel when no variant matches the requested language. At most one per channel.
      nl: Wordt voor dit kanaal geleverd als geen variant de gevraagde taal heeft. Hoogstens één per kanaal.
    osfType: boolean
    required: true
    defaultValue: false
    persisted: { column: is_default, storageClass: core }
  - key: pageLayout
    label: { en: Layout, nl: Indeling }
    description:
      en: Continuous is one flowing text without zones, as a knowledge base article. Pages gives every page a header, content and footer zone.
      nl: Doorlopend is één doorlopende tekst zonder zones, zoals een kennisbankartikel. Pagina's geeft elke pagina een koptekst, inhoud en voettekst.
    osfType: string
    required: true
    defaultValue: continuous
    options:
      type: static
      items:
        - { value: continuous, label: { en: Continuous, nl: Doorlopend } }
        - { value: pages, label: { en: Pages, nl: "Pagina's" } }
    persisted: { column: page_layout, storageClass: core }
  - key: pageFormat
    label: { en: Page format, nl: Paginaformaat }
    description:
      en: Empty takes the format of the document theme, or A4 without a theme.
      nl: Leeg neemt het formaat van het documentthema, of A4 zonder thema.
    osfType: string
    required: false
    options:
      type: static
      items:
        - { value: a4, label: { en: A4, nl: A4 } }
        - { value: a5, label: { en: A5, nl: A5 } }
        - { value: letter, label: { en: Letter, nl: Letter } }
        - { value: custom, label: { en: Custom size, nl: Eigen maat } }
    persisted: { column: page_format, storageClass: core }
  - key: pageWidth
    label: { en: Page width (px), nl: Paginabreedte (px) }
    osfType: number
    required: false
    validation: { min: 100, max: 5000 }
    persisted: { column: page_width, storageClass: core }
  - key: pageHeight
    label: { en: Page height (px), nl: Paginahoogte (px) }
    osfType: number
    required: false
    validation: { min: 100, max: 5000 }
    persisted: { column: page_height, storageClass: core }
  - key: pageMargin
    label: { en: Page margin (px), nl: Paginamarge (px) }
    osfType: number
    required: false
    validation: { min: 0, max: 400 }
    persisted: { column: page_margin, storageClass: core }
  - key: pageGap
    label: { en: "Space between header, content and footer (px)", nl: "Ruimte tussen kop, inhoud en voet (px)" }
    osfType: number
    required: false
    validation: { min: 0, max: 400 }
    persisted: { column: page_gap, storageClass: core }
  - key: pageBlockGap
    label: { en: Space between blocks (px), nl: Ruimte tussen blokken (px) }
    osfType: number
    required: false
    validation: { min: 0, max: 400 }
    persisted: { column: page_block_gap, storageClass: core }
  - key: pageBackground
    label: { en: Background color, nl: Achtergrondkleur }
    description:
      en: A color of the organization's palette or one of the standard colors. Empty leaves the page white.
      nl: Een kleur uit het palet van de organisatie of een van de standaardkleuren. Leeg laat de pagina wit.
    osfType: color
    required: false
    persisted: { column: page_background, storageClass: core }
  - key: pageBackgroundImage
    label: { en: Background image, nl: Achtergrondbeeld }
    description:
      en: Key of an image of the document theme, stretched over the whole page.
      nl: Sleutel van een beeld uit het documentthema, uitgerekt over de hele pagina.
    osfType: string
    required: false
    validation: { pattern: "^[a-z][A-Za-z0-9-]{0,63}$", maxLength: 64 }
    persisted: { column: page_background_image, storageClass: core }
  - key: pageBodyAlignment
    label: { en: Content position, nl: Plaats van de inhoud }
    description:
      en: Where the content stands between header and footer on a page it does not fill.
      nl: Waar de inhoud staat tussen kop en voet op een pagina die ze niet vult.
    osfType: string
    required: false
    options:
      type: static
      items:
        - { value: top, label: { en: Top, nl: Bovenaan } }
        - { value: aboveCenter, label: { en: Above the middle, nl: Boven het midden } }
        - { value: center, label: { en: Middle, nl: Midden } }
        - { value: bottom, label: { en: Bottom, nl: Onderaan } }
    persisted: { column: page_body_alignment, storageClass: core }
operations:
  insertBlock:
    name: { en: Add block, nl: Blok toevoegen }
    description: Insert an allowed block into this variant atomically.
    implementation: { type: collection, action: insert, field: blocks }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  moveBlock:
    name: { en: Move block, nl: Blok verplaatsen }
    description: Move a block within this variant atomically.
    implementation: { type: collection, action: move, field: blocks }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  updateBlock:
    name: { en: Edit block, nl: Blok bewerken }
    description: Change the values of one block of this variant, authorized through the variant.
    implementation: { type: collection, action: update, field: blocks }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  removeBlock:
    name: { en: Remove block, nl: Blok verwijderen }
    description: Remove one block from this variant, authorized through the variant.
    implementation: { type: collection, action: remove, field: blocks }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  list:
    name: List template variant
    description: Read accessible template variant records.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  get:
    name: Read template variant
    description: Read one accessible template variant record.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  create:
    name: Create template variant
    description: Create a template variant record.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: none }
  update:
    name: Update template variant
    description: Update a template variant draft.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
interfaces:
  rest: {}
  graphql: {}
  mcp: { tools: generic }
  web:
    views:
      collection:
        route: /template-variants
        title: { en: Template variants, nl: Templatevarianten }
        columns: [{ key: channel }, { key: locale }]
      record:
        routes: { read: "/template-variants/:id", create: /template-variants/new }
        title: "{{channel}} · {{locale}}"
        layout:
          tabs:
            - id: variant
              label: { en: Variant, nl: Variant }
              groups: [{ title: { en: Variant, nl: Variant }, fields: [template, channel, locale, isDefault] }, { title: { en: Layout, nl: Indeling }, fields: [pageLayout] }, { title: { en: Page settings, nl: Pagina-instellingen }, visibleWhen: { conditions: [{ field: pageLayout, operator: eq, value: pages }] }, fields: [pageFormat, pageMargin, pageGap, pageBlockGap, pageBackground, pageBackgroundImage, pageBodyAlignment] }, { title: { en: Custom page size, nl: Eigen paginaformaat }, visibleWhen: { conditions: [{ field: pageLayout, operator: eq, value: pages }, { field: pageFormat, operator: eq, value: custom }] }, fields: [pageWidth, pageHeight] }]
            - id: blocks
              label: { en: Blocks, nl: Blokken }
              relationship: blocks
        modes:
          create:
            title: { en: Create, nl: Toevoegen }
            groups: [{ title: { en: Variant, nl: Variant }, fields: [template, channel, locale, isDefault] }, { title: { en: Layout, nl: Indeling }, fields: [pageLayout] }, { title: { en: Page settings, nl: Pagina-instellingen }, visibleWhen: { conditions: [{ field: pageLayout, operator: eq, value: pages }] }, fields: [pageFormat, pageMargin, pageGap, pageBlockGap, pageBackground, pageBackgroundImage, pageBodyAlignment] }, { title: { en: Custom page size, nl: Eigen paginaformaat }, visibleWhen: { conditions: [{ field: pageLayout, operator: eq, value: pages }, { field: pageFormat, operator: eq, value: custom }] }, fields: [pageWidth, pageHeight] }]
          update:
            title: { en: Edit, nl: Bewerken }
            groups: [{ title: { en: Variant, nl: Variant }, fields: [channel, locale, isDefault] }, { title: { en: Layout, nl: Indeling }, fields: [pageLayout] }, { title: { en: Page settings, nl: Pagina-instellingen }, visibleWhen: { conditions: [{ field: pageLayout, operator: eq, value: pages }] }, fields: [pageFormat, pageMargin, pageGap, pageBlockGap, pageBackground, pageBackgroundImage, pageBodyAlignment] }, { title: { en: Custom page size, nl: Eigen paginaformaat }, visibleWhen: { conditions: [{ field: pageLayout, operator: eq, value: pages }, { field: pageFormat, operator: eq, value: custom }] }, fields: [pageWidth, pageHeight] }]
