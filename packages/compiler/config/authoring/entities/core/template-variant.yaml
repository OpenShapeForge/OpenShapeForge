schemaVersion: 3
kind: coreEntity
module: core
entity: TemplateVariant
title: Template variant
language: en
labels: { en: Template variant, nl: Template variant }
domains: [documents]
authorization:
  roles:
    read: [General.All.Read, General.All.ReadWrite]
    create: [Organization.All.ReadWrite]
    update: [Organization.All.ReadWrite]
    delete: [Organization.All.ReadWrite]
displayTemplate: "{{channel}} · {{locale}}"
indexes:
  - { name: template_variants_tenant_channel_locale_uidx, fields: [tenantId, version, channel, locale], unique: true }
fields:
  - key: version
    semanticType: TemplateVersion
    required: true
    immutable: true
  - key: channel
    valueType: string
    required: true
    options:
      type: static
      items:
        - { value: document, label: { en: Document, nl: Document } }
        - { value: email, label: { en: Email, nl: E-mail } }
        - { value: whatsapp, label: { en: WhatsApp, nl: WhatsApp } }
    persisted: { column: channel, storageClass: core }
  - key: locale
    valueType: string
    required: true
    defaultValue: nl
    validation: { pattern: "^[a-z]{2}(-[A-Z]{2})?$" }
    label: { en: Content language, nl: Inhoudstaal }
    persisted: { column: locale, storageClass: core }
  - key: blocks
    semanticType: Block
    cardinality: collection
    sortable: true
    relationship: { inverse: variant, ownership: owned }
operations:
  list:
    name: List template variant
    description: Read accessible template variant records.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  get:
    name: Read template variant
    description: Read one accessible template variant record.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  create:
    name: Create template variant
    description: Create a template variant record.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: none }
  update:
    name: Update template variant
    description: Update a template variant draft.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
interfaces:
  rest: {}
  graphql: {}
  mcp: { tools: generic }
  web:
    views:
      collection:
        route: /template-variants
        title: { en: Template variants, nl: Templatevarianten }
        columns: [{ key: channel }, { key: locale }]
      record:
        routes: { read: "/template-variants/:id", create: /template-variants/new }
        title: "{{channel}} · {{locale}}"
        layout:
          tabs:
            - id: variant
              label: { en: Variant, nl: Variant }
              groups: [{ title: { en: Variant, nl: Variant }, fields: [version, channel, locale] }]
        modes:
          create:
            title: { en: Create, nl: Toevoegen }
            groups: [{ title: { en: Variant, nl: Variant }, fields: [version, channel, locale] }]
          update:
            title: { en: Edit, nl: Bewerken }
            groups: [{ title: { en: Variant, nl: Variant }, fields: [channel, locale] }]
