schemaVersion: 3
kind: coreEntity
module: core
entity: TemplateVersion
title: Template version
language: en
labels: { en: Template version, nl: Template version }
domains: [documents]
authorization:
  roles:
    read: [Templates.Read, General.All.Read, General.All.ReadWrite, Organization.All.ReadWrite]
    create: [Organization.All.ReadWrite]
    update: [Organization.All.ReadWrite]
    delete: [Organization.All.ReadWrite]
displayTemplate: "{{versionNumber}}"
indexes:
  - { name: template_versions_tenant_number_uidx, fields: [tenantId, template, versionNumber], unique: true }
fields:
  - key: template
    semanticType: Template
    required: true
    immutable: true
  - key: versionNumber
    valueType: integer
    required: true
    immutable: true
    validation: { min: 1 }
    label: { en: Version, nl: Versie }
    persisted: { column: version_number, storageClass: core }
  - key: status
    valueType: string
    required: true
    immutable: true
    defaultValue: published
    options: { type: static, items: [{ value: published, label: { en: Published, nl: Gepubliceerd } }] }
    persisted: { column: status, storageClass: core }
  - key: snapshot
    valueType: object
    required: true
    immutable: true
    label: { en: Frozen content, nl: Vastgelegde inhoud }
    persisted: { column: snapshot, storageClass: core }
  - key: contentHash
    valueType: string
    required: true
    immutable: true
    validation: { pattern: "^[a-f0-9]{64}$" }
    label: { en: Content checksum, nl: Inhoudschecksum }
    persisted: { column: content_hash, storageClass: core }
  - key: publishedBy
    valueType: string
    required: true
    immutable: true
    validation: { format: uuid }
    label: { en: Published by, nl: Gepubliceerd door }
    persisted: { column: published_by, storageClass: core }
  - key: publishedAt
    valueType: datetime
    required: true
    immutable: true
    label: { en: Published at, nl: Gepubliceerd op }
    persisted: { column: published_at, storageClass: core }
operations:
  renderSnapshot:
    name: { en: Render frozen content, nl: Vastgelegde inhoud weergeven }
    description:
      en: Render a supplied immutable content snapshot to plain text for its selected channel without reading templates or source records. A checksum proves consistency, not approval or permission to deliver.
      nl: Geef een aangeleverde onveranderlijke inhoudssnapshot weer als tekst voor het gekozen kanaal, zonder templates of bronrecords te lezen. Een checksum bewijst consistentie, niet goedkeuring of toestemming voor verzending.
    implementation: { type: plugin, plugin: documents, handler: renderSnapshot }
    target: { scope: collection }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [snapshot]
        properties:
          snapshot:
            type: object
            x-osf-i18n: { title: { en: Frozen content, nl: Vastgelegde inhoud } }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [channel, locale, mediaType, body, snapshotHash, renderingVersion, contentHash]
        properties:
          channel:
            type: string
            enum: [document, email, whatsapp]
            x-osf-i18n:
              title: { en: Channel, nl: Kanaal }
              enum: { document: { en: Document, nl: Document }, email: { en: Email, nl: E-mail }, whatsapp: { en: WhatsApp, nl: WhatsApp } }
          locale:
            type: string
            x-osf-i18n: { title: { en: Language, nl: Taal } }
          mediaType: { type: string, const: text/plain }
          body:
            type: string
            x-osf-i18n: { title: { en: Content, nl: Inhoud } }
          snapshotHash:
            type: string
            pattern: "^[a-f0-9]{64}$"
            x-osf-i18n: { title: { en: Snapshot checksum, nl: Snapshotchecksum } }
          renderingVersion: { type: string, const: osf-entity-fields-text-v1 }
          contentHash:
            type: string
            pattern: "^[a-f0-9]{64}$"
            x-osf-i18n: { title: { en: Content checksum, nl: Inhoudschecksum } }
    errors: []
    auth: { mode: session, roles: [Templates.Read, General.All.Read, General.All.ReadWrite, Organization.All.ReadWrite] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  materialize:
    name: { en: Preview template, nl: Template bekijken }
    description: Resolve one channel and locale, preserving exact values and source versions without changing any stored content.
    implementation: { type: plugin, plugin: documents, handler: materializeTemplate }
    target: { scope: record, inputField: templateVersionId }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [templateVersionId, channel, locale]
        properties:
          templateVersionId:
            type: string
            format: uuid
            x-osf-i18n: { title: { en: Template version, nl: Templateversie } }
          channel:
            type: string
            enum: [document, email, whatsapp]
            x-osf-i18n:
              title: { en: Channel, nl: Kanaal }
              enum: { document: { en: Document, nl: Document }, email: { en: Email, nl: E-mail }, whatsapp: { en: WhatsApp, nl: WhatsApp } }
          locale:
            type: string
            pattern: "^[a-z]{2}(-[A-Z]{2})?$"
            x-osf-i18n: { title: { en: Language, nl: Taal } }
          parameters:
            type: object
            x-osf-i18n: { title: { en: Parameters, nl: Parameters } }
    output: { schema: { type: object } }
    errors: []
    auth: { mode: session, roles: [Templates.Read, General.All.Read, General.All.ReadWrite, Organization.All.ReadWrite] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  createDocument:
    name: { en: Create document, nl: Document aanmaken }
    description:
      en: Save exact resolved template content as an immutable JSON artifact on a new or existing document version.
      nl: Bewaar exact ingevulde template-inhoud als onveranderlijk JSON-bestand bij een nieuwe of bestaande documentversie.
    implementation: { type: plugin, plugin: documents, handler: createDocumentFromTemplate }
    target: { scope: record, inputField: templateVersionId }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [templateVersionId, channel, locale, version, idempotencyKey]
        oneOf:
          - properties:
              document: { x-osf-i18n: { title: { en: New document, nl: Nieuw document } } }
            required: [document]
          - properties:
              documentId: { x-osf-i18n: { title: { en: Existing document, nl: Bestaand document } } }
            required: [documentId]
        properties:
          templateVersionId:
            type: string
            format: uuid
            x-osf-i18n: { title: { en: Template version, nl: Templateversie } }
          channel:
            type: string
            enum: [document, email, whatsapp]
            x-osf-i18n:
              title: { en: Channel, nl: Kanaal }
              enum: { document: { en: Document, nl: Document }, email: { en: Email, nl: E-mail }, whatsapp: { en: WhatsApp, nl: WhatsApp } }
          locale:
            type: string
            pattern: "^[a-z]{2}(-[A-Z]{2})?$"
            x-osf-i18n: { title: { en: Language, nl: Taal } }
          parameters:
            type: object
            x-osf-i18n: { title: { en: Parameters, nl: Parameters } }
          documentId:
            type: string
            format: uuid
            x-osf-reference: { entity: Document }
            x-osf-i18n: { title: { en: Existing document, nl: Bestaand document } }
          document:
            x-osf-entityInput:
              entity: Document
              fields: [code, title, description, documentType, status, confidentiality, source, author, isExternal, registeredAt, receivedAt, publishedAt, caseFileId, caseId, relationId]
            x-osf-i18n: { title: { en: New document, nl: Nieuw document } }
          version:
            x-osf-entityInput:
              entity: DocumentVersion
              fields: [versionLabel, status, isMajorVersion, changeSummary, accountId]
            x-osf-i18n: { title: { en: Version, nl: Versie } }
          idempotencyKey:
            type: string
            minLength: 1
            maxLength: 200
            x-osf-i18n: { title: { en: Request reference, nl: Aanvraagreferentie } }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [documentId, documentVersionId, artifactId, artifactVersion, fileName, mediaType, checksum, byteSize, compositionHash]
        properties:
          documentId: { type: string, format: uuid, x-osf-i18n: { title: { en: Document, nl: Document } } }
          documentVersionId: { type: string, format: uuid, x-osf-i18n: { title: { en: Document version, nl: Documentversie } } }
          artifactId: { type: string, format: uuid, x-osf-i18n: { title: { en: File, nl: Bestand } } }
          artifactVersion: { type: integer, minimum: 1, x-osf-i18n: { title: { en: File version, nl: Bestandsversie } } }
          fileName: { type: string, x-osf-i18n: { title: { en: File name, nl: Bestandsnaam } } }
          mediaType: { type: string, const: application/json, x-osf-i18n: { title: { en: Media type, nl: Bestandstype } } }
          checksum: { type: string, pattern: "^[a-f0-9]{64}$", x-osf-i18n: { title: { en: Checksum, nl: Controlesom } } }
          byteSize: { type: integer, minimum: 0, x-osf-i18n: { title: { en: File size, nl: Bestandsgrootte } } }
          compositionHash: { type: string, pattern: "^[a-f0-9]{64}$", x-osf-i18n: { title: { en: Content fingerprint, nl: Inhoudsvingerafdruk } } }
    errors:
      - { status: 400, code: VALIDATION, description: The document or template input is invalid. }
      - { status: 403, code: FORBIDDEN, description: The source or destination is not accessible. }
      - { status: 503, code: STORAGE_UNAVAILABLE, description: Artifact storage is unavailable. }
      - { status: 503, code: OPERATION_UNAVAILABLE, description: A required canonical Operation is unavailable. }
      - { status: 409, code: ALREADY_EXISTS, description: The document version label already exists. }
    auth: { mode: session, roles: [CaseFile.All.ReadWrite, Organization.All.ReadWrite] }
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: keyed, inputField: idempotencyKey } }
    confirmation: { mode: none }
  list:
    name: List template version
    description: Read accessible template version records.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  get:
    name: Read template version
    description: Read one accessible template version record.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
interfaces:
  rest:
    operations:
      materialize: { method: POST, path: "/api/template-content/versions/:templateVersionId/materialize" }
      createDocument: { method: POST, path: "/api/template-content/versions/:templateVersionId/create-document", response: { status: 201, kind: json } }
      renderSnapshot: { method: POST, path: /api/template-content/render-snapshot }
  graphql: {}
  mcp: { tools: generic }
  web:
    operations:
      materialize: { resultRenderer: document.content }
    views:
      collection:
        route: /template-versions
        title: { en: Template versions, nl: Templateversies }
        columns: [{ key: versionNumber }, { key: status }]
      record:
        routes: { read: "/template-versions/:id" }
        title: "{{versionNumber}}"
        actions: [materialize, createDocument]
        layout:
          tabs:
            - id: version
              label: { en: Published version, nl: Gepubliceerde versie }
              groups: [{ title: { en: Version, nl: Versie }, fields: [template, versionNumber, status, publishedAt, publishedBy, contentHash] }]
