schemaVersion: 3
kind: coreEntity
module: core
entity: Template
title: Template
description: An editable template head whose channel and language variants hold the content blocks a document or
  message is composed from. Template.publish freezes the head with its variants and blocks into an immutable
  TemplateVersion and re-seeds the documents tracking this template; the head itself stays editable.
language: en
labels: { en: Template, nl: Template }
pluralLabels: { en: Templates, nl: Templates }
domains: [documents]
authorization:
  roles:
    read: [Templates.Read, Templates.Manage, General.All.Read, General.All.ReadWrite]
    create: [Templates.Manage]
    update: [Templates.Manage]
    delete: [Templates.Manage]
displayTemplate: "{{name}}"
filterField: name
indexes:
  - { name: templates_tenant_key_uidx, fields: [tenantId, key], unique: true }
versioning:
  strategy: publishedSnapshot
  versionEntity: TemplateVersion
  versionsField: versions
  snapshot: { ownedRelationships: recursive }
fields:
  - key: key
    label: { en: Key, nl: Sleutel }
    osfType: string
    required: true
    deriveOnCreate: { from: name, transform: slug, onConflict: suffix }
    validation: { pattern: "^[a-z][a-z0-9.-]*$", maxLength: 100 }
    persisted: { column: key, storageClass: core }
  - key: name
    osfType: string
    required: true
    label: { en: Name, nl: Naam }
    validation: { maxLength: 200 }
    persisted: { column: name, storageClass: core }
  - key: description
    osfType: string
    label: { en: Description, nl: Omschrijving }
    persisted: { column: description, storageClass: core }
  - key: documentThemeId
    label: { en: Document theme, nl: Documentthema }
    description:
      en: Theme every variant and document from this template inherits. A new template without a choice receives the tenant default. Variants do not select a theme.
      nl: Thema dat iedere variant en ieder document van deze template erft. Een nieuwe template zonder keuze krijgt het tenantstandaardthema. Varianten kiezen geen thema.
    required: false
    persisted: { column: document_theme_id, storageClass: core }
    osfType: DocumentTheme
    relationship:
      ownership: reference
      inverse:
        key: templates
        label: { en: Templates, nl: Templates }
  - key: parameters
    osfType: fieldDefinition
    cardinality: collection
    label: { en: Local variables, nl: Lokale variabelen }
    description:
      en: Local variables the blocks of this template may bind to, declared as field definitions. A document linked to
        a published version supplies their values; materialization validates supplied values against these declarations.
      nl: Lokale variabelen waaraan de blokken van deze template zich kunnen binden, vastgelegd als velddefinities. Een
        document dat aan een gepubliceerde versie is gekoppeld levert de waarden; materialisatie valideert aangeleverde
        waarden tegen deze declaraties.
    persisted: { column: parameters, storageClass: core }
operations:
  insertVariant:
    name: { en: Add channel variant, nl: Kanaalvariant toevoegen }
    description: Create an owned channel and language variant in the editable template.
    implementation: { type: collection, action: insert, field: variants }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  list:
    name: List template
    description: Read accessible template records.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  get:
    name: Read template
    description: Read one accessible template record.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  create:
    name: Create template
    description: Create a template record.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: none }
  update:
    name: Update template
    description: Update a template draft.
    guidance:
      assistant:
        en: Editing the head returns the template to draft and leaves published versions untouched; publish again to
          let the documents tracking this template pick the change up.
        nl: Een wijziging aan de kop zet de template terug op concept en laat gepubliceerde versies ongemoeid;
          publiceer opnieuw om de documenten die deze template volgen de wijziging te laten overnemen.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
interfaces:
  rest: {}
  graphql: {}
  mcp: { tools: generic }
  web:
    views:
      collection:
        route: /templates
        title: { en: Templates, nl: Templates }
        columns: [{ key: name, sortable: true }, { key: description }]
      record:
        routes: { read: "/templates/:id", create: /templates/new }
        title: "{{name}}"
        layout:
          tabs:
            - id: variants
              label: { en: Variants, nl: Varianten }
              relationship: variants
            - id: variables
              label: { en: Variables, nl: Variabelen }
              groups: [{ title: { en: Local variables, nl: Lokale variabelen }, fields: [parameters] }]
            - id: details
              label: { en: Details, nl: Details }
              groups: [{ title: { en: Template, nl: Template }, fields: [name, description, documentThemeId, lifecycleStatus, publishedVersion] }]
            - id: versions
              label: { en: Version history, nl: Versiehistorie }
              relationship: versions
        modes:
          create:
            title: { en: Create, nl: Toevoegen }
            groups: [{ title: { en: Template, nl: Template }, fields: [name, description, documentThemeId] }]
          update:
            title: { en: Edit, nl: Bewerken }
            groups:
              - { title: { en: Template, nl: Template }, fields: [name, description, documentThemeId] }
              - { title: { en: Local variables, nl: Lokale variabelen }, fields: [parameters] }
