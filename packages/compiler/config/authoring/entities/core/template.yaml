schemaVersion: 3
kind: coreEntity
module: core
entity: Template
title: Template
language: en
labels: { en: Template, nl: Template }
domains: [documents]
authorization:
  roles:
    read: [Templates.Read, Organization.All.ReadWrite, General.All.Read, General.All.ReadWrite]
    create: [Organization.All.ReadWrite]
    update: [Organization.All.ReadWrite]
    delete: [Organization.All.ReadWrite]
displayTemplate: "{{name}}"
filterField: name
indexes:
  - { name: templates_tenant_key_uidx, fields: [tenantId, key], unique: true }
fields:
  - key: key
    label: { en: Key, nl: Sleutel }
    valueType: string
    required: true
    deriveOnCreate: { from: name, transform: slug, onConflict: suffix }
    validation: { pattern: "^[a-z][a-z0-9.-]*$", maxLength: 100 }
    persisted: { column: key, storageClass: core }
  - key: name
    valueType: string
    required: true
    label: { en: Name, nl: Naam }
    validation: { maxLength: 200 }
    persisted: { column: name, storageClass: core }
  - key: description
    valueType: string
    label: { en: Description, nl: Omschrijving }
    persisted: { column: description, storageClass: core }
  - key: versions
    label: { en: Versions, nl: Versies }
    semanticType: TemplateVersion
    cardinality: collection
    relationship: { inverse: template, ownership: owned }
operations:
  insertVersion:
    name: { en: Add version, nl: Versie toevoegen }
    description: Create an owned template version atomically.
    implementation: { type: collection, action: insert, field: versions }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
  list:
    name: List template
    description: Read accessible template records.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  get:
    name: Read template
    description: Read one accessible template record.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  create:
    name: Create template
    description: Create a template record.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: none }
  update:
    name: Update template
    description: Update a template draft.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
interfaces:
  rest: {}
  graphql: {}
  mcp: { tools: generic }
  web:
    views:
      collection:
        route: /templates
        title: { en: Templates, nl: Templates }
        columns: [{ key: name, sortable: true }, { key: description }]
      record:
        routes: { read: "/templates/:id", create: /templates/new }
        title: "{{name}}"
        layout:
          tabs:
            - id: details
              label: { en: Details, nl: Details }
              groups: [{ title: { en: Template, nl: Template }, fields: [name, description] }]
            - id: versions
              label: { en: Versions, nl: Versies }
              relationship: versions
        modes:
          create:
            title: { en: Create, nl: Toevoegen }
            groups: [{ title: { en: Template, nl: Template }, fields: [name, description] }]
          update:
            title: { en: Edit, nl: Bewerken }
            groups: [{ title: { en: Template, nl: Template }, fields: [name, description] }]
