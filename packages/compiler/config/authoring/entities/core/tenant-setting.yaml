schemaVersion: 3
kind: coreEntity
module: core
entity: TenantSetting
title: Tenant Setting
description: A generic tenant-scoped setting that can store both plain values and secrets.
language: en
displayTemplate: "{{key}}"
filterField: key
labels:
  en: Tenant Setting
  nl: Tenantinstelling
pluralLabels:
  en: Tenant settings
  nl: Tenantinstellingen
domains:
  - core
authorization:
  roles:
    read:
      - Organization.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
fields:
  - key: namespace
    osfType: string
    required: true
    label:
      en: Namespace
      nl: Namespace
    description:
      en: Functional namespace that groups related settings, such as ai.providers.mistral.
      nl: Functionele namespace die verwante instellingen groepeert, zoals ai.providers.mistral.
    validation:
      minLength: 1
      maxLength: 120
    persisted:
      column: namespace
      storageClass: core
  - key: key
    osfType: string
    required: true
    label:
      en: Key
      nl: Sleutel
    description:
      en: Stable setting key within the namespace.
      nl: Stabiele instellingssleutel binnen de namespace.
    validation:
      minLength: 1
      maxLength: 120
    persisted:
      column: key
      storageClass: core
  - key: definition
    osfType: fieldDefinition
    required: true
    immutable: true
    label: { en: Definition, nl: Definitie }
    persisted: { column: definition, storageClass: core }
  - key: value
    osfType: typedValue
    typedBy:
      definitionField: definition
      documentField: documentValue
      encrypted: true
    label: { en: Value, nl: Waarde }
    persisted: { column: value, storageClass: core }
  - key: documentValue
    osfType: Document
    readOnly: true
    label: { en: Document, nl: Document }
    persisted: { column: document_value_id, storageClass: core }
    relationship: { ownership: reference, inverse: false }
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional explanation of what this setting controls.
      nl: Optionele uitleg van wat deze instelling regelt.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: tenantId
    osfType: Tenant
    readOnly: true
    required: false
    label: {en: Tenant, nl: Tenant}
    persisted: {column: tenant_id, storageClass: core}
    relationship: {ownership: reference}
operations: {}
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route: { en: /tenant-settings, nl: /tenant-settings }
        columns:
          - { key: key, sortable: true }
          - { key: description }
        title: { en: Tenant settings, nl: Tenantinstellingen }
        defaultSort: { key: key, direction: asc }
      record:
        routes:
          read: { en: /tenant-settings/:id, nl: /tenant-settings/:id }
          create: { en: /tenant-settings/create, nl: /tenant-settings/aanmaken }
        title: "{{key}}"
        subtitle: ""
        badges: []
        layout:
          tabs:
            - id: setting-details
              title: { en: Setting, nl: Instelling }
              fields: [value]
        modes:
          create:
            groups:
              - title: { en: Setting, nl: Instelling }
                fields: [namespace, key, definition, value, description]
          update:
            title: { en: Edit tenant setting, nl: Tenantinstelling bewerken }
            groups:
              - title: { en: Setting, nl: Instelling }
                fields: [value]
