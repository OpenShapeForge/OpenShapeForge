schemaVersion: 3
kind: coreEntity
module: core
entity: TenantSetting
title: Tenant Setting
description: A generic tenant-scoped setting that can store both plain values and secrets.
language: en
displayTemplate: "{{key}}"
filterField: key
labels:
  en: Tenant Setting
  nl: Tenantinstelling
pluralLabels:
  en: Tenant settings
  nl: Tenantinstellingen
domains:
  - core
authorization:
  roles:
    read:
      - Organization.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
fields:
  - key: namespace
    osfType: string
    required: true
    label:
      en: Namespace
      nl: Namespace
    description:
      en: Functional namespace that groups related settings, such as ai.providers.mistral.
      nl: Functionele namespace die verwante instellingen groepeert, zoals ai.providers.mistral.
    validation:
      minLength: 1
      maxLength: 120
    persisted:
      column: namespace
      storageClass: core
  - key: key
    osfType: string
    required: true
    label:
      en: Key
      nl: Sleutel
    description:
      en: Stable setting key within the namespace.
      nl: Stabiele instellingssleutel binnen de namespace.
    validation:
      minLength: 1
      maxLength: 120
    persisted:
      column: key
      storageClass: core
  - key: valueType
    required: true
    label:
      en: Value type
      nl: Waardetype
    description:
      en: Data shape used by the setting value.
      nl: Datastructuur die door de instellingswaarde wordt gebruikt.
    defaultValue: string
    validation:
      minLength: 1
      maxLength: 20
    options:
      type: referentiedata
      referentieGroep: TENANTSETTINGVALUETYPE
    persisted:
      column: value_type
      storageClass: core
    osfType: referenceDataCode
  - key: valueText
    osfType: string
    required: false
    label:
      en: Text value
      nl: Tekstwaarde
    description:
      en: Plain string value for text-based settings.
      nl: Eenvoudige tekenreekswaarde voor tekstinstellingen.
    validation:
      maxLength: 4000
    persisted:
      column: value_text
      storageClass: core
    visibility:
      conditions:
        - field: valueType
          operator: eq
          value: string
  - key: valueJson
    osfType: object
    required: false
    label:
      en: JSON value
      nl: JSON-waarde
    description:
      en: Structured JSON value for object-based settings.
      nl: Gestructureerde JSON-waarde voor objectgebaseerde instellingen.
    persisted:
      column: value_json
      storageClass: core
    visibility:
      conditions:
        - field: valueType
          operator: eq
          value: json
  - key: isSecret
    osfType: boolean
    required: true
    label:
      en: Secret
      nl: Geheim
    description:
      en: Whether the setting should be stored and handled as a secret.
      nl: Of de instelling als geheim moet worden opgeslagen en verwerkt.
    defaultValue: false
    persisted:
      column: is_secret
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional explanation of what this setting controls.
      nl: Optionele uitleg van wat deze instelling regelt.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: tenantId
    osfType: Tenant
    readOnly: true
    required: false
    label: {en: Tenant, nl: Tenant}
    persisted: {column: tenant_id, storageClass: core}
    relationship: {ownership: reference, inverse: {label: {en: Tenant settings, nl: Tenantinstellingen}}}
operations: {}
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /tenant-settings
          nl: /tenant-settings
        columns:
          - key: namespace
            sortable: true
          - key: key
            sortable: true
          - key: valueType
            sortable: true
          - key: isSecret
            sortable: true
        title:
          en: Tenant settings
          nl: Tenantinstellingen
        defaultSort:
          key: namespace
          direction: asc
      record:
        routes:
          read:
            en: /tenant-settings/:id
            nl: /tenant-settings/:id
          create:
            en: /tenant-settings/create
            nl: /tenant-settings/aanmaken
        title: "{{namespace}}.{{key}}"
        subtitle: "{{valueType}}"
        badges:
          - isSecret
        actions: []
        layout:
          tabs:
            - id: setting-details
              title:
                en: Setting details
                nl: Instellingsgegevens
              fields:
                - namespace
                - key
                - valueType
                - isSecret
                - description
        modes:
          create:
            title:
              en: Create tenant setting
              nl: Tenantinstelling aanmaken
            groups:
              - title:
                  en: Setting details
                  nl: Instellingsgegevens
                fields:
                  - namespace
                  - key
                  - valueType
                  - valueText
                  - valueJson
                  - isSecret
                  - description
          update:
            title:
              en: Edit tenant setting
              nl: Tenantinstelling bewerken
    fields:
      valueType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: TENANTSETTINGVALUETYPE
            clearable: false
      valueText:
        render:
          component: Input
          props:
            type: password
            autoComplete: off
      valueJson:
        render:
          component: JsonFieldEditor
          props:
            rows: 10
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 500
