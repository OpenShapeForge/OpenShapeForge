schemaVersion: 3
kind: coreEntity
module: core
entity: Tenant
title: Tenant
description: A tenant record that anchors tenant-scoped configuration and matches the platform tenant identifier.
language: en
displayTemplate: "{{slug}}"
filterField: slug
labels:
  en: Tenant
  nl: Tenant
pluralLabels:
  en: Tenants
  nl: Tenants
domains:
  - core
authorization:
  roles:
    read:
      - Organization.All.Read
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
fields:
  - key: slug
    osfType: string
    required: true
    label:
      en: Slug
      nl: Slug
    description:
      en: Stable tenant key that should match the platform tenant identifier and Keycloak organization alias.
      nl: Stabiele tenantsleutel die moet overeenkomen met de platform-tenantidentifier en de Keycloak-organisatiealias.
    validation:
      minLength: 1
      maxLength: 120
      pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
    persisted:
      column: slug
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    description:
      en: Human-friendly tenant name.
      nl: Mensvriendelijke tenantnaam.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the tenant.
      nl: Levenscyclusstatus van de tenant.
    defaultValue: active
    validation:
      minLength: 1
      maxLength: 50
    options:
      type: referentiedata
      referentieGroep: TENANTSTATUS
    persisted:
      column: status
      storageClass: core
    osfType: referenceDataCode
  - key: tenantKind
    osfType: string
    required: true
    label:
      en: Tenant kind
      nl: Tenantsoort
    description:
      en: Discriminator that separates customer tenants from blueprint tenants used as central template libraries.
      nl: Discriminator die klant-tenants onderscheidt van blueprint-tenants die als centrale templatebibliotheek dienen.
    defaultValue: customer
    validation:
      minLength: 1
      maxLength: 32
    persisted:
      column: tenant_kind
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional notes about the tenant.
      nl: Optionele notities over de tenant.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: avatarStorageLocation
    osfType: string
    required: false
    label:
      en: Avatar
      nl: Avatar
    description:
      en: Storage location for the tenant avatar image.
      nl: Opslaglocatie van de tenantavatar.
    validation:
      maxLength: 1000
    persisted:
      column: avatar_storage_location
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional code or alias of the tenant root organization in the source system.
      nl: Functionele code of alias van de tenant-hoofdorganisatie in het bronsysteem.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
# The registry row has exactly one write path: tenant provisioning
# (apps/api/src/control/provisioning.ts) inserts it beside the platform row,
# with id = tenant_id = the platform tenant's id, which CHECK (id = tenant_id)
# holds. No generic create or delete: a tenant neither creates nor removes
# itself, and a second creator would fight the check and the provisioner.
operations:
  list:
    name: List Tenant
    description: List Tenant records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Tenant
    description: Get Tenant records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Tenant records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: false
        getOne: false
        list: false
        update: false
        delete: false
  web:
    views:
      collection:
        route:
          en: /tenants
          nl: /tenants
        columns:
          - key: slug
            sortable: true
          - key: name
            sortable: true
          - key: status
            sortable: true
        title:
          en: Tenants
          nl: Tenants
        defaultSort:
          key: slug
          direction: asc
      record:
        routes:
          read:
            en: /tenants/:id
            nl: /tenants/:id
        title: "{{name}}"
        subtitle: "{{slug}}"
        badges:
          - status
        actions:
          - update
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Tenant details
                    nl: Tenantgegevens
                  fields:
                    - slug
                    - name
                    - status
                    - description
                    - avatarStorageLocation
            - id: settings
              label:
                en: Settings
                nl: Instellingen
              relationship: tenantSettings
        modes:
          update:
            title:
              en: Edit tenant
              nl: Tenant bewerken
            groups:
              - title:
                  en: Tenant details
                  nl: Tenantgegevens
                fields:
                  - slug
                  - name
                  - status
                  - description
                  - avatarStorageLocation
    fields:
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: TENANTSTATUS
            clearable: false
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 500
      avatarStorageLocation:
        render:
          component: FileUpload
