schemaVersion: 3
kind: coreEntity
module: core
entity: TextBlock
title: Text block
description: A block definition holding markdown text. It carries no identity of its own; the Block placement
  selecting this definition does.
language: en
labels: { en: Text, nl: Tekst }
pluralLabels: { en: Texts, nl: Teksten }
domains: [documents]
# The Block placement supplies identity. This definition supplies its fields.
baseEntity: false
displayTemplate: "{{markdown}}"
authorization:
  roles:
    read: [Templates.Read, Templates.Manage, General.All.Read, General.All.ReadWrite]
fields:
  - key: markdown
    osfType: markdown
    required: true
    variables: template
    label: { en: Text, nl: Tekst }
    description:
      en: Markdown text of this block. A `{{…}}` token names either a parameter of the template version as
        `local.<key>` or an organization Chip as `chips.<key>`. Materializing the template or document resolves it
        under the caller's own access and inserts the value as escaped text, not as markup; reading the block
        returns the stored token text unchanged.
      nl: Markdown-tekst van dit blok. Een `{{…}}`-token noemt een parameter van de sjabloonversie als
        `local.<sleutel>` of een Chip van de organisatie als `chips.<sleutel>`. Materialiseren van het sjabloon of
        document lost het op onder de eigen toegang van de aanroeper en voegt de waarde in als geëscapete tekst, niet
        als opmaak; het blok lezen geeft de opgeslagen tokentekst ongewijzigd terug.
    validation: { minLength: 1, maxLength: 20000 }
operations:
  materialize:
    name: Materialize text
    description: Validate resolved text values against the active entity definition.
    implementation: { type: plugin, plugin: documents, handler: materializeFields }
    target: { scope: collection }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [definitionKey, values]
        properties:
          definitionKey: { type: string, const: TextBlock }
          values: { type: object }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind: { type: string, const: block }
          value:
            x-osf-entityInput: { entity: TextBlock, fields: [markdown] }
    errors: []
    auth: { mode: session, roles: [Templates.Read, Templates.Manage, General.All.Read, General.All.ReadWrite] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
interfaces:
  rest:
    operations:
      materialize: { method: POST, path: /api/content-blocks/text/materialize }
  mcp: { tools: generic }
