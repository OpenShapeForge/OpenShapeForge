schemaVersion: 3
kind: coreEntity
module: core
entity: TextColumns
title: Text columns
description: A block definition holding up to three text columns in one row, each with its own text style.
language: en
labels: { en: Text columns, nl: Tekstkolommen }
pluralLabels: { en: Text columns, nl: Tekstkolommen }
domains: [documents]
# The Block placement supplies identity. This definition supplies its fields.
baseEntity: false
displayTemplate: "{{left}}"
authorization:
  roles:
    read: [Templates.Read, Templates.Manage, General.All.Read, General.All.ReadWrite]
fields:
  - key: left
    osfType: markdown
    required: false
    variables: template
    label: { en: Left text, nl: Tekst links }
    validation: { maxLength: 20000 }
  - key: leftStyle
    osfType: string
    required: false
    label: { en: Left text style, nl: Tekststijl links }
    validation: { pattern: "^[a-z][A-Za-z0-9-]{0,63}$", maxLength: 64 }
  - key: leftWidth
    osfType: number
    required: false
    label: { en: Left width (px), nl: Breedte links (px) }
    validation: { min: 1, max: 4000 }
  - key: center
    osfType: markdown
    required: false
    variables: template
    label: { en: Center text, nl: Tekst midden }
    validation: { maxLength: 20000 }
  - key: centerStyle
    osfType: string
    required: false
    label: { en: Center text style, nl: Tekststijl midden }
    validation: { pattern: "^[a-z][A-Za-z0-9-]{0,63}$", maxLength: 64 }
  - key: centerWidth
    osfType: number
    required: false
    label: { en: Center width (px), nl: Breedte midden (px) }
    validation: { min: 1, max: 4000 }
  - key: right
    osfType: markdown
    required: false
    variables: template
    label: { en: Right text, nl: Tekst rechts }
    validation: { maxLength: 20000 }
  - key: rightStyle
    osfType: string
    required: false
    label: { en: Right text style, nl: Tekststijl rechts }
    validation: { pattern: "^[a-z][A-Za-z0-9-]{0,63}$", maxLength: 64 }
  - key: rightWidth
    osfType: number
    required: false
    label: { en: Right width (px), nl: Breedte rechts (px) }
    validation: { min: 1, max: 4000 }
  - key: distribution
    osfType: string
    required: false
    defaultValue: fill
    label: { en: Distribution, nl: Verdeling }
    description:
      en: Fill shares the row between the columns and pushes the right column to the edge. Fit lets the left column
        take the room the other columns leave.
      nl: Vullen verdeelt de rij over de kolommen en zet de rechterkolom tegen de rand. Passend geeft de linkerkolom
        de ruimte die de andere kolommen overlaten.
    options:
      type: static
      items:
        - { value: fill, label: { en: Fill, nl: Vullen } }
        - { value: fit, label: { en: Fit, nl: Passend } }
  - key: verticalAlign
    osfType: string
    required: false
    defaultValue: top
    label: { en: Vertical alignment, nl: Verticale uitlijning }
    options:
      type: static
      items:
        - { value: top, label: { en: Top, nl: Boven } }
        - { value: center, label: { en: Center, nl: Midden } }
        - { value: bottom, label: { en: Bottom, nl: Onder } }
operations:
  materialize:
    name: Materialize text columns
    description: Validate resolved values against the active entity definition.
    implementation: { type: plugin, plugin: documents, handler: materializeFields }
    target: { scope: collection }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [definitionKey, values]
        properties:
          definitionKey: { type: string, const: TextColumns }
          values: { type: object }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [kind, value]
        properties:
          kind: { type: string, const: block }
          value:
            x-osf-entityInput: { entity: TextColumns, fields: [left, leftStyle, leftWidth, center, centerStyle, centerWidth, right, rightStyle, rightWidth, distribution, verticalAlign] }
    errors: []
    auth: { mode: session, roles: [Templates.Read, Templates.Manage, General.All.Read, General.All.ReadWrite] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
interfaces:
  rest:
    operations:
      materialize: { method: POST, path: /api/content-blocks/text-columns/materialize }
  mcp: { tools: generic }
