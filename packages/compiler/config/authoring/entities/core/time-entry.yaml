schemaVersion: 3
kind: coreEntity
module: core
entity: TimeEntry
title: Time Entry
description: Timesheet entry recording hours worked by an employee on a date, optionally billable to an agreement.
language: en
displayTemplate: "{{workedAt}}: {{hours}}h"
filterField: id
labels:
  en: Time entry
  nl: Tijdsbesteding
domains:
  - hr
fields:
  - key: workedAt
    osfType: date
    required: true
    label:
      en: Worked at
      nl: Werkdatum
    description:
      en: Date on which the hours were worked.
      nl: Datum waarop de uren zijn gewerkt.
    persisted:
      column: worked_at
      storageClass: core
  - key: hours
    osfType: number
    required: true
    label:
      en: Hours
      nl: Uren
    description:
      en: Number of hours worked on this entry.
      nl: Aantal gewerkte uren in deze regel.
    validation:
      min: 0
      max: 24
    persisted:
      column: hours
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description of the work performed.
      nl: Optionele omschrijving van de uitgevoerde werkzaamheden.
    validation:
      maxLength: 500
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: billable
    osfType: boolean
    required: false
    label:
      en: Billable
      nl: Factureerbaar
    description:
      en: Whether the time can be billed to a customer.
      nl: Of de tijd doorbelast kan worden aan een klant.
    persisted:
      column: billable
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the time entry in an external context.
      nl: Functionele of zakelijke code van de tijdsbesteding in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: employeeId
    label:
      en: Employee
      nl: Medewerker
    persisted:
      column: employee_id
      storageClass: core
    osfType: Employee
    relationship:
      ownership: reference
  - key: agreementId
    label:
      en: Agreement
      nl: Overeenkomst
    persisted:
      column: agreement_id
      storageClass: core
    osfType: Agreement
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Organization.All.Read
      - Organization.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Time Entry
    description: List TimeEntry records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Time Entry
    description: Get TimeEntry records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Time Entry
    description: Create TimeEntry records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update TimeEntry records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /time-entries
          nl: /tijdsbestedingen
        columns:
          - key: workedAt
            sortable: true
          - key: hours
            sortable: true
          - key: billable
            sortable: true
          - key: description
            sortable: false
        title:
          en: Time entries
          nl: Tijdsbestedingen
        defaultSort:
          key: workedAt
          direction: desc
      record:
        routes:
          read:
            en: /time-entries/:id
            nl: /tijdsbestedingen/:id
          create:
            en: /time-entries/create
            nl: /tijdsbestedingen/aanmaken
        title: "{{workedAt}}: {{hours}}h"
        subtitle: "{{description}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Time details
                    nl: Tijdgegevens
                  fields:
                    - workedAt
                    - hours
                    - billable
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create time entry
              nl: Tijdsbesteding aanmaken
            groups:
              - title:
                  en: Time details
                  nl: Tijdgegevens
                fields:
                  - workedAt
                  - hours
                  - billable
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit time entry
              nl: Tijdsbesteding bewerken
    fields:
      workedAt:
        render:
          component: DatePicker
          props: {}
      description:
        render:
          component: Textarea
          props:
            rows: 3
            maxLength: 500
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
