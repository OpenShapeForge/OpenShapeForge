schemaVersion: 3
kind: coreEntity
module: core
entity: UserOrganizationPermission
title: User Organization Permission
description: Explicit permission grant for a root-owned employee targeting a tenant root or organizational unit scope.
language: en
displayTemplate: "{{clientId}} {{permissionName}}"
filterField: permissionName
labels:
  en: User organization permission
  nl: Gebruikersrecht per organisatie
domains:
  - core
  - hr
authorization:
  roles:
    read:
      - Organization.All.Read
      - Organization.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: targetScopeKind
    valueType: string
    required: true
    label:
      en: Target scope kind
      nl: Type doelscope
    description:
      en: Scope kind targeted by this user grant, either tenant or org_unit.
      nl: Type scope waarop deze gebruikerstoekenning van toepassing is, tenant of org_unit.
    defaultValue: org_unit
    validation:
      maxLength: 50
    persisted:
      column: target_scope_kind
      storageClass: core
  - key: clientId
    valueType: string
    required: true
    label:
      en: Client ID
      nl: Client-id
    description:
      en: Keycloak client that owns the permission role.
      nl: Keycloak-client die de permissierol bezit.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: client_id
      storageClass: core
  - key: permissionName
    valueType: string
    required: true
    label:
      en: Permission name
      nl: Permissienaam
    description:
      en: Name of the permission role within the client.
      nl: Naam van de permissierol binnen de client.
    validation:
      minLength: 1
      maxLength: 300
    persisted:
      column: permission_name
      storageClass: core
  - key: effect
    valueType: string
    required: true
    label:
      en: Effect
      nl: Effect
    description:
      en: Permission effect. The initial identity model supports allow.
      nl: Effect van het recht. Het initiële identiteitsmodel ondersteunt allow.
    defaultValue: allow
    validation:
      maxLength: 50
    persisted:
      column: effect
      storageClass: core
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional code of the user permission grant in the source system.
      nl: Functionele code van de gebruikersrechtentoekenning in het bronsysteem.
    validation:
      maxLength: 200
    persisted:
      column: external_code
      storageClass: core
  - key: employeeId
    label:
      en: Employee
      nl: Medewerker
    persisted:
      column: employee_id
      storageClass: core
    semanticType: Employee
    relationship:
      ownership: reference
  - key: targetTenantId
    label:
      en: Target tenant
      nl: Doeltenant
    persisted:
      column: target_tenant_id
      storageClass: core
    semanticType: Tenant
    relationship:
      ownership: reference
  - key: targetOrgUnitId
    label:
      en: Target org unit
      nl: Doeleenheid
    persisted:
      column: target_org_unit_id
      storageClass: core
    semanticType: OrgUnit
    relationship:
      ownership: reference
operations:
  list:
    name: List User Organization Permission
    description: List UserOrganizationPermission records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get User Organization Permission
    description: Get UserOrganizationPermission records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create User Organization Permission
    description: Create UserOrganizationPermission records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update User Organization Permission
    description: Update UserOrganizationPermission records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete User Organization Permission
    description: Delete UserOrganizationPermission records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /user-organization-permissions
          nl: /gebruikersrechten-per-organisatie
        columns:
          - key: clientId
            sortable: true
          - key: permissionName
            sortable: true
          - key: targetScopeKind
            sortable: true
        title:
          en: User organization permissions
          nl: Gebruikersrechten per organisatie
        defaultSort:
          key: permissionName
          direction: asc
      record:
        routes:
          read:
            en: /user-organization-permissions/:id
            nl: /gebruikersrechten-per-organisatie/:id
          create:
            en: /user-organization-permissions/create
            nl: /gebruikersrechten-per-organisatie/aanmaken
        title: "{{permissionName}}"
        subtitle: "{{clientId}}"
        badges:
          - effect
          - targetScopeKind
        actions: []
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Permission
                    nl: Recht
                  fields:
                    - targetScopeKind
                    - clientId
                    - permissionName
                    - effect
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
        modes:
          create:
            title:
              en: Create user organization permission
              nl: Gebruikersrecht per organisatie aanmaken
            groups:
              - title:
                  en: Permission
                  nl: Recht
                fields:
                  - targetScopeKind
                  - clientId
                  - permissionName
                  - effect
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
          update:
            title:
              en: Edit user organization permission
              nl: Gebruikersrecht per organisatie bewerken
            groups:
              - title:
                  en: Permission
                  nl: Recht
                fields:
                  - targetScopeKind
                  - clientId
                  - permissionName
                  - effect
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
