schemaVersion: 3
kind: coreEntity
module: core
entity: Vacancy
title: Vacancy
description: Open job vacancy, optionally linked to a position and an org unit, with lifecycle tracking via status and timestamps.
language: en
displayTemplate: "{{code}} {{title}}"
filterField: code
labels:
  en: Vacancy
  nl: Vacature
domains:
  - hr
fields:
  - key: code
    valueType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique vacancy code.
      nl: Tenant-unieke vacaturecode.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: title
    valueType: string
    required: true
    label:
      en: Title
      nl: Titel
    description:
      en: Display title of the vacancy.
      nl: Weergavetitel van de vacature.
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: title
      storageClass: core
  - key: description
    valueType: string
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description of the vacancy.
      nl: Optionele omschrijving van de vacature.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    semanticType: multilineText
  - key: status
    valueType: string
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the vacancy.
      nl: Levenscyclusstatus van de vacature.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: VACANCYSTATUS
    semanticType: referenceDataCode
  - key: openedAt
    valueType: date
    required: true
    label:
      en: Opened at
      nl: Geopend op
    description:
      en: Date on which the vacancy was opened.
      nl: Datum waarop de vacature is geopend.
    persisted:
      column: opened_at
      storageClass: core
  - key: closedAt
    valueType: date
    required: false
    label:
      en: Closed at
      nl: Gesloten op
    description:
      en: Date on which the vacancy was closed.
      nl: Datum waarop de vacature is gesloten.
    persisted:
      column: closed_at
      storageClass: core
  - key: externalCode
    valueType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the vacancy in an external context.
      nl: Functionele of zakelijke code van de vacature in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: positionId
    label:
      en: Position
      nl: Functie
    persisted:
      column: position_id
      storageClass: core
    semanticType: Position
    relationship:
      ownership: reference
  - key: orgUnitId
    label:
      en: Org unit
      nl: Organisatorische eenheid
    persisted:
      column: org_unit_id
      storageClass: core
    semanticType: OrgUnit
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Organization.All.Read
      - Organization.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Vacancy
    description: List Vacancy records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Vacancy
    description: Get Vacancy records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Vacancy
    description: Create Vacancy records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Vacancy records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /vacancies
          nl: /vacatures
        columns:
          - key: code
            sortable: true
          - key: title
            sortable: true
          - key: status
            sortable: true
          - key: openedAt
            sortable: true
          - key: closedAt
            sortable: true
        title:
          en: Vacancies
          nl: Vacatures
        defaultSort:
          key: openedAt
          direction: desc
      record:
        routes:
          read:
            en: /vacancies/:id
            nl: /vacatures/:id
          create:
            en: /vacancies/create
            nl: /vacatures/aanmaken
        title: "{{code}} {{title}}"
        subtitle: "{{status}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Vacancy details
                    nl: Vacaturegegevens
                  fields:
                    - code
                    - title
                    - status
                    - openedAt
                    - closedAt
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create vacancy
              nl: Vacature aanmaken
            groups:
              - title:
                  en: Vacancy details
                  nl: Vacaturegegevens
                fields:
                  - code
                  - title
                  - status
                  - openedAt
                  - closedAt
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit vacancy
              nl: Vacature bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 6
            maxLength: 5000
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: VACANCYSTATUS
            clearable: false
      openedAt:
        render:
          component: DatePicker
          props: {}
      closedAt:
        render:
          component: DatePicker
          props: {}
