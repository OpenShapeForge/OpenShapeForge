schemaVersion: 3
kind: coreEntity
module: core
entity: Valuation
title: Valuation
description: Generic valuation header for an asset (market, appraisal, policy, tax) at a point in time.
language: en
displayTemplate: "{{valuationKind}}: {{amount}} @ {{valuedAt}}"
filterField: id
labels:
  en: Valuation
  nl: Waardering
pluralLabels:
  en: Valuations
  nl: Waarderingen
domains:
  - asset
fields:
  - key: valuationKind
    required: true
    label:
      en: Valuation kind
      nl: Waarderingsoort
    description:
      en: Kind of valuation (market, appraisal, policy, tax).
      nl: Soort waardering (markt, taxatie, beleid, fiscaal).
    persisted:
      column: valuation_kind
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: VALUATIONKIND
    osfType: referenceDataCode
  - key: valuedAt
    osfType: date
    required: true
    label:
      en: Valued at
      nl: Gewaardeerd op
    description:
      en: Date on which the valuation applies.
      nl: Datum waarop de waardering geldt.
    persisted:
      column: valued_at
      storageClass: core
  - key: amount
    required: true
    label:
      en: Amount
      nl: Bedrag
    description:
      en: Valuation amount.
      nl: Waarderingsbedrag.
    osfType: currency
    persisted:
      column: amount
      storageClass: core
  - key: currencyCode
    osfType: string
    required: true
    label:
      en: Currency
      nl: Valuta
    description:
      en: ISO 4217 currency code in which the valuation is expressed.
      nl: ISO 4217 valutacode waarin de waardering is uitgedrukt.
    defaultValue: EUR
    validation:
      minLength: 3
      maxLength: 3
    persisted:
      column: currency_code
      storageClass: core
  - key: notes
    required: false
    label:
      en: Notes
      nl: Notities
    description:
      en: Free-form notes about the valuation.
      nl: Vrije notities over de waardering.
    validation:
      maxLength: 5000
    persisted:
      column: notes
      storageClass: core
    osfType: multilineText
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the valuation in an external context.
      nl: Functionele of zakelijke code van de waardering in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: assetId
    label:
      en: Asset
      nl: Object
    persisted:
      column: asset_id
      storageClass: core
    osfType: Asset
    relationship:
      ownership: reference
  - key: valuerId
    label:
      en: Valuer
      nl: Taxateur
    persisted:
      column: valuer_relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - RealEstate.All.Read
      - RealEstate.All.ReadWrite
    create:
      - RealEstate.All.ReadWrite
    update:
      - RealEstate.All.ReadWrite
    delete:
      - RealEstate.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Valuation
    description: List Valuation records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Valuation
    description: Get Valuation records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Valuation
    description: Create Valuation records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Valuation records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /valuations
          nl: /waarderingen
        columns:
          - key: valuationKind
            sortable: true
          - key: valuedAt
            sortable: true
          - key: amount
            sortable: true
          - key: currencyCode
            sortable: true
        title:
          en: Valuations
          nl: Waarderingen
        defaultSort:
          key: valuedAt
          direction: desc
      record:
        routes:
          read:
            en: /valuations/:id
            nl: /waarderingen/:id
          create:
            en: /valuations/create
            nl: /waarderingen/aanmaken
        title: "{{valuationKind}}: {{amount}}"
        subtitle: "{{valuedAt}}"
        badges:
          - valuationKind
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Valuation details
                    nl: Waarderingsgegevens
                  fields:
                    - valuationKind
                    - valuedAt
                    - amount
                    - currencyCode
                - title:
                    en: Notes
                    nl: Notities
                  fields:
                    - notes
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create valuation
              nl: Waardering aanmaken
            groups:
              - title:
                  en: Valuation details
                  nl: Waarderingsgegevens
                fields:
                  - valuationKind
                  - valuedAt
                  - amount
                  - currencyCode
              - title:
                  en: Notes
                  nl: Notities
                fields:
                  - notes
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit valuation
              nl: Waardering bewerken
    fields:
      valuationKind:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: VALUATIONKIND
            clearable: false
      valuedAt:
        render:
          component: DatePicker
          props: {}
      notes:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
