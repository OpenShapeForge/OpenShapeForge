schemaVersion: 3
kind: coreEntity
module: core
entity: VatRate
title: VAT Rate
description: VAT rate by validity period, with a posting ledger account and optional cost-dimension dimension.
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: VAT rate
  nl: BTW-tarief
pluralLabels:
  en: VAT rates
  nl: BTW-tarieven
domains:
  - finance
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique VAT-rate code.
      nl: Tenant-unieke BTW-tariefcode.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: vatType
    required: true
    label:
      en: VAT type
      nl: BTW-soort
    description:
      en: Classification of the VAT rate (none, zero, low, high).
      nl: Classificatie van het BTW-tarief (geen, 0%, laag, hoog).
    persisted:
      column: vat_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: VATTYPE
    osfType: referenceDataCode
  - key: percentage
    osfType: number
    required: true
    label:
      en: Percentage
      nl: Percentage
    description:
      en: VAT percentage applied (e.g. 21 for 21%).
      nl: Toegepast BTW-percentage (bijv. 21 voor 21%).
    validation:
      min: 0
      max: 100
    persisted:
      column: percentage
      storageClass: core
  - key: validFrom
    osfType: date
    required: true
    label:
      en: Valid from
      nl: Geldig vanaf
    description:
      en: Date from which this rate is effective.
      nl: Datum vanaf wanneer dit tarief geldig is.
    persisted:
      column: valid_from
      storageClass: core
  - key: validTo
    osfType: date
    required: false
    label:
      en: Valid until
      nl: Geldig tot
    description:
      en: Date until which this rate is effective.
      nl: Datum tot wanneer dit tarief geldig is.
    persisted:
      column: valid_to
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Optional description or business meaning of the VAT rate.
      nl: Optionele omschrijving of zakelijke betekenis van het BTW-tarief.
    validation:
      maxLength: 2000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the VAT rate in an external context.
      nl: Functionele of zakelijke code van het BTW-tarief in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: ledgerAccountId
    label:
      en: Ledger account
      nl: Grootboekrekening
    persisted:
      column: ledger_account_id
      storageClass: core
    osfType: LedgerAccount
    relationship:
      ownership: reference
  - key: costDimensionId
    label:
      en: Cost dimension
      nl: Kostendimensie
    persisted:
      column: cost_dimension_id
      storageClass: core
    osfType: CostDimension
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List VAT Rate
    description: List VatRate records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get VAT Rate
    description: Get VatRate records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create VAT Rate
    description: Create VatRate records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update VatRate records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /vat-rates
          nl: /btw-tarieven
        columns:
          - key: code
            sortable: true
          - key: vatType
            sortable: true
          - key: percentage
            sortable: true
          - key: validFrom
            sortable: true
          - key: validTo
            sortable: true
        title:
          en: VAT rates
          nl: BTW-tarieven
        defaultSort:
          key: code
          direction: asc
      record:
        routes:
          read:
            en: /vat-rates/:id
            nl: /btw-tarieven/:id
          create:
            en: /vat-rates/create
            nl: /btw-tarieven/aanmaken
        title: "{{code}}"
        subtitle: "{{vatType}}"
        badges:
          - vatType
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: VAT rate details
                    nl: BTW-tariefgegevens
                  fields:
                    - code
                    - vatType
                    - percentage
                    - validFrom
                    - validTo
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create VAT rate
              nl: BTW-tarief aanmaken
            groups:
              - title:
                  en: VAT rate details
                  nl: BTW-tariefgegevens
                fields:
                  - code
                  - vatType
                  - percentage
                  - validFrom
                  - validTo
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit VAT rate
              nl: BTW-tarief bewerken
    fields:
      vatType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: VATTYPE
            clearable: false
      validFrom:
        render:
          component: DatePicker
          props: {}
      validTo:
        render:
          component: DatePicker
          props: {}
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 2000
