schemaVersion: 3
kind: coreEntity
module: core
entity: VatReturn
title: VAT Return
description: VAT declaration period. One return per fiscal period, recording payable/receivable amounts and submission status.
language: en
displayTemplate: "{{referenceNumber}}"
filterField: referenceNumber
labels:
  en: VAT return
  nl: BTW-aangifte
domains:
  - finance
fields:
  - key: submittedAt
    osfType: datetime
    required: false
    label:
      en: Submitted at
      nl: Ingediend op
    description:
      en: Timestamp at which the VAT return was submitted to the tax authority.
      nl: Tijdstip waarop de BTW-aangifte is ingediend bij de Belastingdienst.
    persisted:
      column: submitted_at
      storageClass: core
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    description:
      en: Lifecycle status of the VAT return.
      nl: Levenscyclusstatus van de BTW-aangifte.
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: VATRETURNSTATUS
    osfType: referenceDataCode
  - key: payableAmount
    required: false
    label:
      en: Payable amount
      nl: Te betalen bedrag
    description:
      en: Amount due to the tax authority for the period.
      nl: Aan de Belastingdienst verschuldigd bedrag voor de periode.
    osfType: currency
    persisted:
      column: payable_amount
      storageClass: core
  - key: receivableAmount
    required: false
    label:
      en: Receivable amount
      nl: Te ontvangen bedrag
    description:
      en: Amount to be received from the tax authority for the period.
      nl: Van de Belastingdienst te ontvangen bedrag voor de periode.
    osfType: currency
    persisted:
      column: receivable_amount
      storageClass: core
  - key: referenceNumber
    osfType: string
    required: false
    label:
      en: Reference number
      nl: Kenmerk
    description:
      en: Tenant-unique reference number assigned to the VAT return.
      nl: Tenant-uniek kenmerk dat aan de BTW-aangifte is toegekend.
    validation:
      maxLength: 100
    persisted:
      column: reference_number
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the VAT return in an external context.
      nl: Functionele of zakelijke code van de BTW-aangifte in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: fiscalPeriodId
    label:
      en: Fiscal period
      nl: Boekjaarperiode
    persisted:
      column: fiscal_period_id
      storageClass: core
    osfType: FiscalPeriod
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Finance.All.Read
      - Finance.All.ReadWrite
    create:
      - Finance.All.ReadWrite
    update:
      - Finance.All.ReadWrite
    delete:
      - Finance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List VAT Return
    description: List VatReturn records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get VAT Return
    description: Get VatReturn records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create VAT Return
    description: Create VatReturn records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update VatReturn records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    views:
      collection:
        route:
          en: /vat-returns
          nl: /btw-aangiftes
        columns:
          - key: referenceNumber
            sortable: true
          - key: status
            sortable: true
          - key: submittedAt
            sortable: true
          - key: payableAmount
            sortable: true
          - key: receivableAmount
            sortable: true
        title:
          en: VAT returns
          nl: BTW-aangiftes
        defaultSort:
          key: submittedAt
          direction: desc
      record:
        routes:
          read:
            en: /vat-returns/:id
            nl: /btw-aangiftes/:id
          create:
            en: /vat-returns/create
            nl: /btw-aangiftes/aanmaken
        title: "{{referenceNumber}}"
        subtitle: "{{submittedAt}}"
        badges:
          - status
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Return details
                    nl: Aangiftegegevens
                  fields:
                    - referenceNumber
                    - status
                    - submittedAt
                - title:
                    en: Amounts
                    nl: Bedragen
                  fields:
                    - payableAmount
                    - receivableAmount
                - title:
                    en: Provenance
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create VAT return
              nl: BTW-aangifte aanmaken
            groups:
              - title:
                  en: Return details
                  nl: Aangiftegegevens
                fields:
                  - referenceNumber
                  - status
                  - submittedAt
              - title:
                  en: Amounts
                  nl: Bedragen
                fields:
                  - payableAmount
                  - receivableAmount
              - title:
                  en: Provenance
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit VAT return
              nl: BTW-aangifte bewerken
    fields:
      submittedAt:
        render:
          component: DateTimePicker
          props: {}
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: VATRETURNSTATUS
            clearable: false
