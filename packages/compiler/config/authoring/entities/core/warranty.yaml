schemaVersion: 3
kind: coreEntity
module: core
entity: Warranty
title: Warranty
description: Warranty granted by a supplier on an asset, scoped to a validity period.
language: en
displayTemplate: "{{code}}"
filterField: code
labels:
  en: Warranty
  nl: Garantie
domains:
  - maintenance
fields:
  - key: code
    osfType: string
    required: true
    label:
      en: Code
      nl: Code
    description:
      en: Tenant-unique warranty code.
      nl: Tenant-unieke garantiecode.
    validation:
      minLength: 1
      maxLength: 50
    persisted:
      column: code
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Omschrijving
    description:
      en: Description of the warranty terms.
      nl: Omschrijving van de garantievoorwaarden.
    validation:
      maxLength: 5000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: startDate
    osfType: date
    required: true
    label:
      en: Start date
      nl: Startdatum
    description:
      en: Date from which the warranty is effective.
      nl: Datum vanaf wanneer de garantie geldig is.
    persisted:
      column: start_date
      storageClass: core
  - key: endDate
    osfType: date
    required: true
    label:
      en: End date
      nl: Einddatum
    description:
      en: Date until which the warranty is effective.
      nl: Datum tot wanneer de garantie geldig is.
    persisted:
      column: end_date
      storageClass: core
  - key: externalCode
    osfType: string
    required: false
    label:
      en: External code
      nl: Externe code
    description:
      en: Functional or business code of the warranty in an external context.
      nl: Functionele of zakelijke code van de garantie in een externe context.
    validation:
      maxLength: 100
    persisted:
      column: external_code
      storageClass: core
  - key: supplierId
    label:
      en: Supplier
      nl: Leverancier
    persisted:
      column: supplier_relation_id
      storageClass: core
    osfType: Relation
    relationship:
      ownership: reference
  - key: assetId
    label:
      en: Asset
      nl: Object
    persisted:
      column: asset_reference
      storageClass: core
    osfType: Asset
    relationship:
      ownership: reference
authorization:
  roles:
    read:
      - Maintenance.All.Read
      - Maintenance.All.ReadWrite
    create:
      - Maintenance.All.ReadWrite
    update:
      - Maintenance.All.ReadWrite
    delete:
      - Maintenance.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
operations:
  list:
    name: List Warranty
    description: List Warranty records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Warranty
    description: Get Warranty records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Warranty
    description: Create Warranty records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name:
      en: Edit
      nl: Bewerken
    description: Update Warranty records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name:
      en: Delete
      nl: Verwijderen
    description:
      en: Are you sure?
      nl: Weet je het zeker?
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
interfaces:
  rest: {}
  graphql: {}
  web:
    views:
      collection:
        route:
          en: /warranties
          nl: /garanties
        columns:
          - key: code
            sortable: true
          - key: startDate
            sortable: true
          - key: endDate
            sortable: true
        title:
          en: Warranties
          nl: Garanties
        defaultSort:
          key: endDate
          direction: asc
      record:
        routes:
          read:
            en: /warranties/:id
            nl: /garanties/:id
          create:
            en: /warranties/create
            nl: /garanties/aanmaken
        title: "{{code}}"
        subtitle: "{{endDate}}"
        actions:
          - update
          - delete
        layout:
          tabs:
            - id: overview
              label:
                en: Overview
                nl: Overzicht
              groups:
                - title:
                    en: Warranty details
                    nl: Garantiegegevens
                  fields:
                    - code
                    - startDate
                    - endDate
                - title:
                    en: Description
                    nl: Omschrijving
                  fields:
                    - description
                - title:
                    en: Source
                    nl: Herkomst
                  fields:
                    - externalId
                    - externalCode
                    - sourceAuthority
                    - sourceOrganization
                    - sourceAdministration
        modes:
          create:
            title:
              en: Create warranty
              nl: Garantie aanmaken
            groups:
              - title:
                  en: Warranty details
                  nl: Garantiegegevens
                fields:
                  - code
                  - startDate
                  - endDate
              - title:
                  en: Description
                  nl: Omschrijving
                fields:
                  - description
              - title:
                  en: Source
                  nl: Herkomst
                fields:
                  - externalId
                  - externalCode
                  - sourceAuthority
                  - sourceOrganization
                  - sourceAdministration
          update:
            title:
              en: Edit warranty
              nl: Garantie bewerken
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 5000
      startDate:
        render:
          component: DatePicker
          props: {}
      endDate:
        render:
          component: DatePicker
          props: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
