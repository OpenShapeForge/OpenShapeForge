schemaVersion: 3
kind: coreEntity
module: core
entity: WorkQueue
title: Work Queue
description: A queue that organizes cases and assignments awaiting handling.
language: en
displayTemplate: "{{name}}"
filterField: name
labels:
  en: Work Queue
  nl: Werkqueue
pluralLabels:
  en: Work queues
  nl: Werkqueues
domains:
  - cases
  - service
authorization:
  roles:
    read:
      - Cases.All.Read
      - Cases.All.ReadWrite
    create:
      - Organization.All.ReadWrite
    update:
      - Organization.All.ReadWrite
    delete:
      - Organization.All.ReadWrite
  rowAccess:
    enabled: true
    empty: public
fields:
  - key: key
    osfType: string
    required: true
    label:
      en: Key
      nl: Sleutel
    validation:
      minLength: 1
      maxLength: 100
    persisted:
      column: key
      storageClass: core
  - key: name
    osfType: string
    required: true
    label:
      en: Name
      nl: Naam
    validation:
      minLength: 1
      maxLength: 200
    persisted:
      column: name
      storageClass: core
  - key: description
    required: false
    label:
      en: Description
      nl: Beschrijving
    validation:
      maxLength: 4000
    persisted:
      column: description
      storageClass: core
    osfType: multilineText
  - key: queueType
    required: true
    label:
      en: Queue type
      nl: Queuetype
    persisted:
      column: queue_type
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: WORKQUEUETYPE
    osfType: referenceDataCode
  - key: status
    required: true
    label:
      en: Status
      nl: Status
    persisted:
      column: status
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: WORKQUEUESTATUS
    osfType: referenceDataCode
  - key: assignmentStrategy
    required: true
    label:
      en: Assignment strategy
      nl: Toewijzingsstrategie
    persisted:
      column: assignment_strategy
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: WORKQUEUESTRATEGY
    osfType: referenceDataCode
  - key: workingHoursProfile
    osfType: string
    required: false
    label:
      en: Working hours profile
      nl: Werkurenprofiel
    validation:
      maxLength: 200
    persisted:
      column: working_hours_profile
      storageClass: core
  - key: defaultPriority
    required: false
    label:
      en: Default priority
      nl: Standaardprioriteit
    persisted:
      column: default_priority
      storageClass: core
    options:
      type: referentiedata
      referentieGroep: CASEPRIORITY
    osfType: referenceDataCode
  - key: autoAssignEnabled
    osfType: boolean
    required: true
    label:
      en: Auto-assign enabled
      nl: Auto-toewijzing actief
    defaultValue: false
    persisted:
      column: auto_assign_enabled
      storageClass: core
  - key: visibilityRelationGroupId
    required: false
    label:
      en: Visibility group
      nl: Zichtbaarheidsgroep
    description:
      en: Relation group whose members can see conversations assigned to this queue. Existing queues may be empty during
        rollout; create and update APIs require this value.
      nl: Relatiegroep waarvan leden gesprekken in deze queue kunnen zien. Bestaande queues mogen tijdens rollout leeg zijn;
        create- en update-APIs vereisen deze waarde.
    osfType: RelationGroup
    persisted:
      column: visibility_relation_group_id
      storageClass: core
    validation:
      format: uuid
    classification:
      sensitivity: internal
      category: workflow
    relationship:
      ownership: reference
  - key: targetFirstResponseMinutes
    osfType: integer
    required: false
    label:
      en: Target first response minutes
      nl: Streefminuten eerste reactie
    persisted:
      column: target_first_response_minutes
      storageClass: core
  - key: targetResolutionMinutes
    osfType: integer
    required: false
    label:
      en: Target resolution minutes
      nl: Streefminuten oplossing
    persisted:
      column: target_resolution_minutes
      storageClass: core
  - key: escalationAfterMinutes
    osfType: integer
    required: false
    label:
      en: Escalation after minutes
      nl: Escaleren na minuten
    persisted:
      column: escalation_after_minutes
      storageClass: core
  - key: maxActiveAssignments
    osfType: integer
    required: false
    label:
      en: Max active assignments
      nl: Max actieve toewijzingen
    persisted:
      column: max_active_assignments
      storageClass: core
  - key: maxBacklogSize
    osfType: integer
    required: false
    label:
      en: Max backlog size
      nl: Max backloggrootte
    persisted:
      column: max_backlog_size
      storageClass: core
  - key: supportsEscalation
    osfType: boolean
    required: true
    label:
      en: Supports escalation
      nl: Ondersteunt escalatie
    defaultValue: true
    persisted:
      column: supports_escalation
      storageClass: core
  - key: escalationQueueId
    label:
      en: Escalation queue
      nl: Escalatiequeue
    persisted:
      column: escalation_queue_id
      storageClass: core
    osfType: WorkQueue
    relationship:
      ownership: reference
      inverse:
        key: incomingEscalations
        label:
          en: Incoming escalations
          nl: Inkomende escalaties
  - key: overflowQueueId
    label:
      en: Overflow queue
      nl: Overflowqueue
    persisted:
      column: overflow_queue_id
      storageClass: core
    osfType: WorkQueue
    relationship:
      ownership: reference
      inverse:
        key: incomingOverflows
        label:
          en: Inkomende overflows
          nl: Inkomende overflows
operations:
  list:
    name: List Work Queue
    description: List WorkQueue records.
    implementation:
      type: entity
      action: list
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  get:
    name: Get Work Queue
    description: Get WorkQueue records.
    implementation:
      type: entity
      action: get
    effects:
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
  create:
    name: Create Work Queue
    description: Create WorkQueue records.
    implementation:
      type: entity
      action: create
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  update:
    name: Update Work Queue
    description: Update WorkQueue records.
    implementation:
      type: entity
      action: update
    effects:
      data: write
      external: none
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: none
  delete:
    name: Delete Work Queue
    description: Delete WorkQueue records.
    implementation:
      type: entity
      action: delete
    effects:
      data: delete
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
interfaces:
  rest: {}
  graphql: {}
  workflow:
    nodes:
      actions:
        create: true
        getOne: true
        list: true
        update: true
        delete: true
  web:
    fields:
      description:
        render:
          component: Textarea
          props:
            rows: 4
            maxLength: 4000
      queueType:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: WORKQUEUETYPE
            clearable: false
      status:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: WORKQUEUESTATUS
            clearable: false
      assignmentStrategy:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: WORKQUEUESTRATEGY
            clearable: false
      defaultPriority:
        render:
          component: ReferenceSelect
          props:
            referentieGroep: CASEPRIORITY
            clearable: true
      visibilityRelationGroupId:
        render:
          component: OptionVariablePicker
          props:
            valueMode: selectId
