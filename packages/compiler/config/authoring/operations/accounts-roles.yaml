schemaVersion: 1
kind: operationCatalog
plugin: accounts
operations:
  listRoles:
    id: accounts.list-roles
    name: { en: List roles, nl: Rollen tonen }
    description: { en: List roles within the current organization., nl: Rollen tonen binnen de huidige organisatie. }
    implementation: { type: plugin, plugin: accounts, handler: listRoles }
    input: { schema: { type: object, additionalProperties: false, required: [], properties: {} } }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [ roles ]
        properties:
          roles:
            type: array
            items:
              type: object
              additionalProperties: false
              required: [ key, label, permissions ]
              properties:
                key: { type: string, x-osf-i18n: { title: { en: Role key, nl: Rolsleutel } } }
                label: { type: string, x-osf-i18n: { title: { en: Role, nl: Rol } } }
                permissions: { type: string, x-osf-i18n: { title: { en: Permissions, nl: Rechten } } }
                unavailablePermissions: { type: string, x-osf-i18n: { title: { en: Permissions no longer available, nl: Niet meer beschikbare rechten } } }
                source: { type: string, x-osf-i18n: { title: { en: Source, nl: Bron } } }
                version: { type: integer, x-osf-i18n: { title: { en: Revision, nl: Revisie } } }
            x-osf-i18n: { title: { en: Roles, nl: Rollen } }
    auth: { mode: session, roles: [ Organization.Access.Manage, Organization.Accounts.Manage ] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors:
      - { status: 401, code: UNAUTHENTICATED, description: Sign in first. }
      - { status: 403, code: FORBIDDEN, description: Organization administrator required. }
      - { status: 404, code: NOT_FOUND, description: The target is not available in this organization. }
      - { status: 409, code: CONFLICT, description: The assignment conflicts with the current organization state. }
  getRole:
    id: accounts.get-role
    name: { en: View, nl: Bekijken }
    description: { en: List roles within the current organization., nl: Rollen tonen binnen de huidige organisatie. }
    implementation: { type: plugin, plugin: accounts, handler: getRole }
    input: { schema: { type: object, additionalProperties: false, required: [ key ], properties: { key: { type: string, x-osf-i18n: { title: { en: Role key, nl: Rolsleutel } } } } } }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [ key, label, permissions ]
        properties:
          key: { type: string, x-osf-i18n: { title: { en: Role key, nl: Rolsleutel } } }
          label: { type: string, x-osf-i18n: { title: { en: Role, nl: Rol } } }
          permissions: { type: string, x-osf-i18n: { title: { en: Permissions, nl: Rechten } } }
          unavailablePermissions: { type: string, x-osf-i18n: { title: { en: Permissions no longer available, nl: Niet meer beschikbare rechten } } }
          source: { type: string, x-osf-i18n: { title: { en: Source, nl: Bron } } }
          version: { type: integer, x-osf-i18n: { title: { en: Revision, nl: Revisie } } }
    auth: { mode: session, roles: [ Organization.Access.Manage, Organization.Accounts.Manage ] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors:
      - { status: 401, code: UNAUTHENTICATED, description: Sign in first. }
      - { status: 403, code: FORBIDDEN, description: Organization administrator required. }
      - { status: 404, code: NOT_FOUND, description: The target is not available in this organization. }
      - { status: 409, code: CONFLICT, description: The assignment conflicts with the current organization state. }
  createRole:
    id: accounts.create-role
    name: { en: Create custom role, nl: Eigen rol maken }
    description: { en: Manage this organization's custom role. Default roles are read-only. Permissions apply on the next request., nl: Beheer een eigen rol. Standaardrollen zijn alleen-lezen. Rechten gelden vanaf het volgende verzoek. }
    implementation: { type: plugin, plugin: accounts, handler: createRole }
    input: { schema: { type: object, additionalProperties: false, required: [ label ], properties: { label: { type: string, x-osf-i18n: { title: { en: Name, nl: Naam } }, minLength: 1, maxLength: 100 } } } }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [ key, label, permissions ]
        properties:
          key: { type: string, x-osf-i18n: { title: { en: Role key, nl: Rolsleutel } } }
          label: { type: string, x-osf-i18n: { title: { en: Role, nl: Rol } } }
          permissions: { type: string, x-osf-i18n: { title: { en: Permissions, nl: Rechten } } }
          unavailablePermissions: { type: string, x-osf-i18n: { title: { en: Permissions no longer available, nl: Niet meer beschikbare rechten } } }
          source: { type: string, x-osf-i18n: { title: { en: Source, nl: Bron } } }
          version: { type: integer, x-osf-i18n: { title: { en: Revision, nl: Revisie } } }
    auth: { mode: session, roles: [ Organization.Access.Manage ] }
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: acknowledgement }
    errors:
      - { status: 400, code: VALIDATION, description: Invalid input. }
      - { status: 409, code: READ_ONLY_ROLE, description: Default roles are read-only. }
      - { status: 409, code: VERSION_CONFLICT, description: Refresh the role before editing. }
      - { status: 503, code: OPERATION_UNAVAILABLE, description: Database unavailable. }
      - { status: 401, code: UNAUTHENTICATED, description: Sign in first. }
      - { status: 403, code: FORBIDDEN, description: Organization administrator required. }
      - { status: 404, code: NOT_FOUND, description: The target is not available in this organization. }
      - { status: 409, code: CONFLICT, description: The assignment conflicts with the current organization state. }
  addRolePermission:
    id: accounts.add-role-permission
    name: { en: Add permission, nl: Recht toevoegen }
    description: { en: Manage this organization's custom role. Default roles are read-only. Permissions apply on the next request., nl: Beheer een eigen rol. Standaardrollen zijn alleen-lezen. Rechten gelden vanaf het volgende verzoek. }
    implementation: { type: plugin, plugin: accounts, handler: addRolePermission }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [ key, version, permission ]
        properties:
          key: { type: string, x-osf-i18n: { title: { en: Role key, nl: Rolsleutel } } }
          version: { type: integer, x-osf-sourceField: version, x-osf-i18n: { title: { en: Revision, nl: Revisie } }, minimum: 1 }
          permission: { type: string, x-osf-i18n: { title: { en: Permission, nl: Recht } }, x-osf-reference: { entity: AccessPermission, valueField: key } }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [ key, label, permissions ]
        properties:
          key: { type: string, x-osf-i18n: { title: { en: Role key, nl: Rolsleutel } } }
          label: { type: string, x-osf-i18n: { title: { en: Role, nl: Rol } } }
          permissions: { type: string, x-osf-i18n: { title: { en: Permissions, nl: Rechten } } }
          unavailablePermissions: { type: string, x-osf-i18n: { title: { en: Permissions no longer available, nl: Niet meer beschikbare rechten } } }
          source: { type: string, x-osf-i18n: { title: { en: Source, nl: Bron } } }
          version: { type: integer, x-osf-i18n: { title: { en: Revision, nl: Revisie } } }
    auth: { mode: session, roles: [ Organization.Access.Manage ] }
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: acknowledgement }
    errors:
      - { status: 400, code: VALIDATION, description: Invalid input. }
      - { status: 409, code: READ_ONLY_ROLE, description: Default roles are read-only. }
      - { status: 409, code: VERSION_CONFLICT, description: Refresh the role before editing. }
      - { status: 503, code: OPERATION_UNAVAILABLE, description: Database unavailable. }
      - { status: 401, code: UNAUTHENTICATED, description: Sign in first. }
      - { status: 403, code: FORBIDDEN, description: Organization administrator required. }
      - { status: 404, code: NOT_FOUND, description: The target is not available in this organization. }
      - { status: 409, code: CONFLICT, description: The assignment conflicts with the current organization state. }
  removeRolePermission:
    id: accounts.remove-role-permission
    name: { en: Remove permission, nl: Recht verwijderen }
    description: { en: Manage this organization's custom role. Default roles are read-only. Permissions apply on the next request., nl: Beheer een eigen rol. Standaardrollen zijn alleen-lezen. Rechten gelden vanaf het volgende verzoek. }
    implementation: { type: plugin, plugin: accounts, handler: removeRolePermission }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [ key, version, permission ]
        properties:
          key: { type: string, x-osf-i18n: { title: { en: Role key, nl: Rolsleutel } } }
          version: { type: integer, x-osf-sourceField: version, x-osf-i18n: { title: { en: Revision, nl: Revisie } }, minimum: 1 }
          permission: { type: string, x-osf-i18n: { title: { en: Permission, nl: Recht } }, x-osf-reference: { entity: AccessPermission, valueField: key } }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [ key, label, permissions ]
        properties:
          key: { type: string, x-osf-i18n: { title: { en: Role key, nl: Rolsleutel } } }
          label: { type: string, x-osf-i18n: { title: { en: Role, nl: Rol } } }
          permissions: { type: string, x-osf-i18n: { title: { en: Permissions, nl: Rechten } } }
          unavailablePermissions: { type: string, x-osf-i18n: { title: { en: Permissions no longer available, nl: Niet meer beschikbare rechten } } }
          source: { type: string, x-osf-i18n: { title: { en: Source, nl: Bron } } }
          version: { type: integer, x-osf-i18n: { title: { en: Revision, nl: Revisie } } }
    auth: { mode: session, roles: [ Organization.Access.Manage ] }
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: acknowledgement }
    errors:
      - { status: 400, code: VALIDATION, description: Invalid input. }
      - { status: 409, code: READ_ONLY_ROLE, description: Default roles are read-only. }
      - { status: 409, code: VERSION_CONFLICT, description: Refresh the role before editing. }
      - { status: 503, code: OPERATION_UNAVAILABLE, description: Database unavailable. }
      - { status: 401, code: UNAUTHENTICATED, description: Sign in first. }
      - { status: 403, code: FORBIDDEN, description: Organization administrator required. }
      - { status: 404, code: NOT_FOUND, description: The target is not available in this organization. }
      - { status: 409, code: CONFLICT, description: The assignment conflicts with the current organization state. }
  clearUnavailablePermissions:
    id: accounts.clear-unavailable-role-permissions
    name: { en: Remove unavailable permissions, nl: Niet meer beschikbare rechten verwijderen }
    description: { en: Remove from this custom role every stored permission the platform no longer offers (#943). They grant nothing today; removing them keeps a returning permission of the same name from silently granting again., nl: Verwijder uit deze eigen rol alle opgeslagen rechten die het platform niet meer aanbiedt (#943). Ze geven nu niets; verwijderen voorkomt dat een terugkerend recht met dezelfde naam ongemerkt weer geldt. }
    implementation: { type: plugin, plugin: accounts, handler: clearUnavailablePermissions }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [ key, version ]
        properties:
          key: { type: string, x-osf-i18n: { title: { en: Role key, nl: Rolsleutel } } }
          version: { type: integer, x-osf-sourceField: version, x-osf-i18n: { title: { en: Revision, nl: Revisie } }, minimum: 1 }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [ key, label, permissions ]
        properties:
          key: { type: string, x-osf-i18n: { title: { en: Role key, nl: Rolsleutel } } }
          label: { type: string, x-osf-i18n: { title: { en: Role, nl: Rol } } }
          permissions: { type: string, x-osf-i18n: { title: { en: Permissions, nl: Rechten } } }
          unavailablePermissions: { type: string, x-osf-i18n: { title: { en: Permissions no longer available, nl: Niet meer beschikbare rechten } } }
          source: { type: string, x-osf-i18n: { title: { en: Source, nl: Bron } } }
          version: { type: integer, x-osf-i18n: { title: { en: Revision, nl: Revisie } } }
    auth: { mode: session, roles: [ Organization.Access.Manage ] }
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: acknowledgement }
    errors:
      - { status: 400, code: VALIDATION, description: Invalid input. }
      - { status: 409, code: READ_ONLY_ROLE, description: Default roles are read-only. }
      - { status: 409, code: VERSION_CONFLICT, description: Refresh the role before editing. }
      - { status: 503, code: OPERATION_UNAVAILABLE, description: Database unavailable. }
      - { status: 401, code: UNAUTHENTICATED, description: Sign in first. }
      - { status: 403, code: FORBIDDEN, description: Organization administrator required. }
      - { status: 404, code: NOT_FOUND, description: The target is not available in this organization. }
      - { status: 409, code: CONFLICT, description: The assignment conflicts with the current organization state. }
interfaces:
  rest:
    operations:
      listRoles: { method: POST, path: /api/accounts/list-roles, response: { status: 200, kind: json } }
      getRole: { method: POST, path: /api/accounts/get-role, response: { status: 200, kind: json } }
      createRole: { method: POST, path: /api/accounts/create-role, response: { status: 200, kind: json } }
      addRolePermission: { method: POST, path: /api/accounts/add-role-permission, response: { status: 200, kind: json } }
      removeRolePermission: { method: POST, path: /api/accounts/remove-role-permission, response: { status: 200, kind: json } }
      clearUnavailablePermissions: { method: POST, path: /api/accounts/clear-unavailable-role-permissions, response: { status: 200, kind: json } }
  web:
    entities:
      AccessRole:
        title: { en: Roles, nl: Rollen }
        route: /access-roles
        idField: key
        displayField: label
        fields: [ key, label, permissions, unavailablePermissions, source, version ]
        columns: [ label, source, permissions ]
        operations: { list: { operation: listRoles, resultField: roles }, get: { operation: getRole, bindings: { key: key } }, create: { operation: createRole }, recordActions: [ addRolePermission, removeRolePermission, clearUnavailablePermissions ] }
        recordRoute: /access-roles/:key
