# The integration catalog as a customer administrator sees it: which external
# parties hold a credential against this organization, what each one is allowed
# to do, and which keys are live under it.
#
# Nothing here decides anything. Every Operation calls the one provisioning
# service (apps/api/src/auth/api-key/service.ts) and therefore the one privilege
# ceiling (ceiling.ts): creation or management permission as applicable,
# the caller's own role ceiling, and a verified interactive person. The existing
# REST and GraphQL surfaces call the same functions, so this catalog is a third
# projection of one authority rather than a second implementation.
#
# Deliberately generic. An "integration" is an external party with a service
# account and keys; nothing in this contract knows what that party does with
# them, so a workflow application, a reporting job and a partner integration all
# appear here as ordinary rows.
#
# The identifier is `platform.api_key_integrations.id` — a database uuid minted
# at creation and never rewritten, including by the realm reconciler
# (reconcile.ts), which rebuilds a missing Keycloak client under the SAME id.
# The derived Keycloak clientId and the service account's user id are therefore
# never exposed: they change, and they are realm internals.
#
# Confidential output is disclosed only in the private Operation app on MCP.
# Presentation remains FieldSecret; x-osf-classification owns disclosure.
schemaVersion: 1
kind: operationCatalog
plugin: osf-api-keys
operations:
  listIntegrations:
    id: api-keys.list-integrations
    name: { en: List integrations, nl: Integraties tonen }
    description:
      en: 'The organization''s API key integrations: name, lifecycle status, the roles their service account
        holds, and how many credentials are live under each. Never returns a credential or a client secret.'
      nl: 'De API-key-integraties van de organisatie: naam, status, de rollen van hun serviceaccount en hoeveel
        credentials er per integratie actief zijn. Geeft nooit een credential of clientsecret terug.'
    implementation: { type: plugin, plugin: osf-api-keys, handler: listIntegrations }
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          displayName:
            type: string
            maxLength: 200
            x-osf-i18n: { title: { en: Name, nl: Naam } }
          status: &integrationStatusFilter
            type: string
            enum: [pending, active, disabled]
            x-osf-i18n:
              title: { en: Status, nl: Status }
              enum: &integrationStatusLabels
                pending: { en: Pending, nl: In afwachting }
                active: { en: Active, nl: Actief }
                disabled: { en: Disabled, nl: Uitgeschakeld }
          sortField:
            type: string
            enum: [displayName, status, createdAt, updatedAt]
            default: displayName
            x-osf-i18n:
              title: { en: Sort field, nl: Sorteerveld }
              enum:
                displayName: { en: Name, nl: Naam }
                status: { en: Status, nl: Status }
                createdAt: { en: Created, nl: Aangemaakt }
                updatedAt: { en: Changed, nl: Gewijzigd }
          sortDirection: &sortDirection
            type: string
            enum: [asc, desc]
            default: asc
            x-osf-i18n:
              title: { en: Sort direction, nl: Sorteerrichting }
              enum:
                asc: { en: Ascending, nl: Oplopend }
                desc: { en: Descending, nl: Aflopend }
          first: &first
            type: integer
            minimum: 1
            maximum: 100
            default: 25
            x-osf-i18n: { title: { en: Page size, nl: Paginagrootte } }
          after: &after
            type: string
            # The opaque keyset cursor this listing issued. It names the
            # previous page's last row by id and by a 16-character digest of
            # that row's sort value, never by the value, so it is a fixed size
            # for every row — which is why a bound can be declared here at all.
            # A cursor that carried the value was as long as the value, and
            # `display_name` is unbounded `text`: a
            # 200-character bound refused the listing's own `nextCursor` at the
            # transport for any name past a short one, and no larger number
            # would have been right either, because the two older surfaces
            # accept a name of any length. The digest is what makes an anchor
            # that MOVED in the order a declared refusal rather than a silently
            # short page, and it is REQUIRED: a cursor this listing issued
            # before the digest existed is refused like a tampered one, so a
            # caller mid-walk across that deploy reads the listing again from
            # its first page. See docs/api.md. The decoder's own ceiling is derived
            # from the payload in apps/api/src/operations/api-key-cursor.ts
            # (MAX_CURSOR_LENGTH); this is the outer bound that stays above it,
            # pinned by a test in
            # apps/api/src/operations/api-key-operations.test.ts so the two
            # cannot cross.
            maxLength: 256
            x-osf-i18n: { title: { en: Cursor, nl: Cursor } }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [integrations, totalCount, nextCursor]
        properties:
          integrations:
            type: array
            items: &integration
              type: object
              additionalProperties: false
              required: [integrationId, displayName, status, grantedRoles, allowedIps, allowedOrigins, allowedEndpoints, credentialCount, activeCredentialCount, createdAt, updatedAt]
              properties:
                integrationId:
                  type: string
                  format: uuid
                  description: Stable database identifier. Unchanged when the realm service account is rebuilt.
                  x-osf-i18n: { title: { en: Integration, nl: Integratie } }
                displayName:
                  type: string
                  x-osf-i18n: { title: { en: Name, nl: Naam } }
                status:
                  type: string
                  enum: [pending, active, disabled]
                  x-osf-i18n:
                    title: { en: Status, nl: Status }
                    enum: *integrationStatusLabels
                grantedRoles:
                  type: array
                  items: { type: string }
                  description: Roles the integration's service account holds, as the provisioning caller authorized them.
                  x-osf-i18n: { title: { en: Roles, nl: Rollen } }
                allowedIps:
                  type: array
                  items: { type: string }
                  description: Network allowlist of IP addresses and CIDR ranges. Empty means any address.
                  x-osf-i18n: { title: { en: Allowed IP addresses, nl: Toegestane IP-adressen } }
                allowedOrigins:
                  type: array
                  items: { type: string }
                  description: Web sites (exact origins) whose pages may use this integration's keys. Non-empty makes them browser keys, limited to allowedEndpoints; empty means server keys.
                  x-osf-i18n: { title: { en: Allowed web sites, nl: Toegestane websites } }
                allowedEndpoints:
                  type: array
                  items: { type: string }
                  description: The only endpoints a browser key may call, as "<GET|POST> /api/<path>". Empty means none.
                  x-osf-i18n: { title: { en: Allowed endpoints, nl: Toegestane endpoints } }
                credentialCount:
                  type: integer
                  minimum: 0
                  x-osf-i18n: { title: { en: Credentials, nl: Credentials } }
                activeCredentialCount:
                  type: integer
                  minimum: 0
                  x-osf-i18n: { title: { en: Active credentials, nl: Actieve credentials } }
                createdAt:
                  type: string
                  format: date-time
                  x-osf-i18n: { title: { en: Created, nl: Aangemaakt } }
                updatedAt:
                  type: string
                  format: date-time
                  x-osf-i18n: { title: { en: Changed, nl: Gewijzigd } }
            x-osf-i18n: { title: { en: Integrations, nl: Integraties } }
          totalCount:
            type: integer
            minimum: 0
            x-osf-i18n: { title: { en: Total integrations, nl: Totaal integraties } }
          nextCursor:
            type: [string, 'null']
            x-osf-i18n: { title: { en: Next cursor, nl: Volgende cursor } }
    auth: &manageAuth { mode: session, roles: [Platform.ApiKeys.Manage] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors: &catalogErrors
      - { status: 400, code: VALIDATION, description: The input does not describe a valid request. }
      - { status: 401, code: UNAUTHENTICATED, description: An authenticated tenant session is required. }
      - { status: 403, code: FORBIDDEN, description: 'The session may not manage API keys: it lacks the management role, carries a role the caller does not hold, or is itself an API key.' }
      - { status: 404, code: NOT_FOUND, description: The integration or credential does not exist in this organization. }
      - { status: 503, code: NOT_CONFIGURED, description: 'This deployment has no API key provisioning configuration, so no integration can be managed here.' }
  getIntegration:
    id: api-keys.get-integration
    name: { en: View integration, nl: Integratie bekijken }
    description:
      en: One integration of this organization, with the same fields the integration list reports.
      nl: Eén integratie van deze organisatie, met dezelfde velden als de integratielijst.
    implementation: { type: plugin, plugin: osf-api-keys, handler: getIntegration }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [integrationId]
        properties:
          integrationId: &integrationIdInput
            type: string
            format: uuid
            x-osf-i18n: { title: { en: Integration, nl: Integratie } }
    output: { schema: *integration }
    auth: *manageAuth
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors: *catalogErrors
  listCredentials:
    id: api-keys.list-credentials
    name: { en: List credentials, nl: Credentials tonen }
    description:
      en: 'The credentials issued under one integration: name, lifecycle status, any role narrowing, expiry and
        last use. Metadata only — the key itself is hashed at rest and is never returned by a read.'
      nl: 'De credentials die onder één integratie zijn uitgegeven: naam, status, eventuele rolbeperking,
        vervaldatum en laatste gebruik. Alleen metadata — de key zelf is gehasht opgeslagen en komt nooit terug
        uit een leesactie.'
    implementation: { type: plugin, plugin: osf-api-keys, handler: listCredentials }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [integrationId]
        properties:
          integrationId: *integrationIdInput
          displayName:
            type: string
            maxLength: 200
            x-osf-i18n: { title: { en: Name, nl: Naam } }
          status: &credentialStatusFilter
            type: string
            enum: [active, expired, revoked]
            x-osf-i18n:
              title: { en: Status, nl: Status }
              enum: &credentialStatusLabels
                active: { en: Active, nl: Actief }
                expired: { en: Expired, nl: Verlopen }
                revoked: { en: Revoked, nl: Ingetrokken }
          sortField:
            type: string
            enum: [displayName, status, createdAt, expiresAt, lastUsedAt]
            default: createdAt
            x-osf-i18n:
              title: { en: Sort field, nl: Sorteerveld }
              enum:
                displayName: { en: Name, nl: Naam }
                status: { en: Status, nl: Status }
                createdAt: { en: Issued, nl: Uitgegeven }
                expiresAt: { en: Expires, nl: Verloopt }
                lastUsedAt: { en: Last used, nl: Laatst gebruikt }
          sortDirection:
            type: string
            enum: [asc, desc]
            default: desc
            x-osf-i18n:
              title: { en: Sort direction, nl: Sorteerrichting }
              enum:
                asc: { en: Ascending, nl: Oplopend }
                desc: { en: Descending, nl: Aflopend }
          first: *first
          after: *after
    output:
      schema:
        type: object
        additionalProperties: false
        required: [credentials, totalCount, nextCursor]
        properties:
          credentials:
            type: array
            items: &credential
              type: object
              additionalProperties: false
              required: [id, integrationId, integrationName, displayName, status, createdAt, expiresAt, revokedAt, lastUsedAt]
              properties:
                id:
                  type: string
                  format: uuid
                  x-osf-i18n: { title: { en: Credential, nl: Credential } }
                integrationId:
                  type: string
                  format: uuid
                  x-osf-type: ApiKeyIntegration
                  x-osf-reference: { entity: ApiKeyIntegration, valueField: integrationId }
                  x-osf-i18n: { title: { en: Integration, nl: Integratie } }
                integrationName:
                  type: string
                  x-osf-i18n: { title: { en: Integration, nl: Integratie } }
                displayName:
                  type: string
                  x-osf-i18n: { title: { en: Name, nl: Naam } }
                status:
                  type: string
                  enum: [active, expired, revoked]
                  x-osf-i18n:
                    title: { en: Status, nl: Status }
                    enum: *credentialStatusLabels
                roleSubset:
                  type: [array, 'null']
                  items: { type: string }
                  description: Null means the credential carries whatever its integration's service account holds. A list is intersected with those roles, never unioned.
                  x-osf-i18n: { title: { en: Role narrowing, nl: Rolbeperking } }
                createdAt:
                  type: string
                  format: date-time
                  x-osf-i18n: { title: { en: Issued, nl: Uitgegeven } }
                expiresAt:
                  type: [string, 'null']
                  format: date-time
                  x-osf-i18n: { title: { en: Expires, nl: Verloopt } }
                revokedAt:
                  type: [string, 'null']
                  format: date-time
                  x-osf-i18n: { title: { en: Revoked, nl: Ingetrokken } }
                lastUsedAt:
                  type: [string, 'null']
                  format: date-time
                  x-osf-i18n: { title: { en: Last used, nl: Laatst gebruikt } }
            x-osf-i18n: { title: { en: Credentials, nl: Credentials } }
          totalCount:
            type: integer
            minimum: 0
            x-osf-i18n: { title: { en: Total credentials, nl: Totaal credentials } }
          nextCursor:
            type: [string, 'null']
            x-osf-i18n: { title: { en: Next cursor, nl: Volgende cursor } }
    auth: *manageAuth
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors: *catalogErrors
  getCredential:
    id: api-keys.get-credential
    name: { en: View credential, nl: Credential bekijken }
    description:
      en: One credential of one integration, by both identifiers. Metadata only; the key is never returned.
      nl: Eén credential van één integratie, op beide identifiers. Alleen metadata; de key komt nooit terug.
    implementation: { type: plugin, plugin: osf-api-keys, handler: getCredential }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [id, integrationId]
        properties:
          id:
            type: string
            format: uuid
            x-osf-i18n: { title: { en: Credential, nl: Credential } }
          integrationId: *integrationIdInput
    output: { schema: *credential }
    auth: *manageAuth
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors: *catalogErrors
  createIntegration:
    id: api-keys.create-integration
    name: { en: Add an integration, nl: Integratie toevoegen }
    description:
      en: Create an integration and its first API key. Copy the key when it appears; you cannot view it again later.
      nl: Maak een integratie en de eerste API-sleutel aan. Kopieer de sleutel zodra deze verschijnt; je kunt hem later niet opnieuw bekijken.
    implementation: { type: plugin, plugin: osf-api-keys, handler: createIntegration }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [displayName, roles]
        properties:
          displayName:
            type: string
            minLength: 1
            maxLength: 200
            description: How this organization recognises the external party. Not an identifier; the realm client id is derived server-side.
            x-osf-i18n: { title: { en: Name, nl: Naam } }
          roles:
            type: array
            uniqueItems: true
            items: { type: string, minLength: 1 }
            description: Roles the integration's service account receives. Every one must already be held by the caller. An empty list grants no general roles; separately authorized record actions and operations open to authenticated sessions may still be available.
            x-osf-i18n:
              title: { en: Roles, nl: Rollen }
              description:
                en: Leave empty for no general roles. Set specific permissions after creating the integration.
                nl: Laat leeg voor geen algemene rollen. Stel specifieke rechten in nadat de integratie is aangemaakt.
          expiresInDays: &expiresInDays
            type: integer
            minimum: 1
            maximum: 366
            description: 'Omit for this deployment''s default lifetime. The ceiling is 366 days: a credential that
              never expires, or one that outlives a yearly review, is not something this contract can ask for. A
              deployment may declare a tighter maximum than 366; a request past it is refused and names that number.'
            x-osf-i18n: { title: { en: Lifetime in days, nl: Looptijd in dagen } }
          roleSubset:
            type: array
            minItems: 1
            uniqueItems: true
            items: { type: string, minLength: 1 }
            description: Narrows the FIRST credential to a subset of the integration's roles. Omit for the integration's full set; an empty list is refused rather than read as "no narrowing".
            x-osf-i18n: { title: { en: Role narrowing, nl: Rolbeperking } }
          allowedIps:
            type: array
            maxItems: 20
            uniqueItems: true
            items: { type: string, minLength: 2, maxLength: 64 }
            description: 'Optional network allowlist: IP addresses or CIDR ranges (IPv4 or IPv6), at most 20. A key
              used from any other address is refused with 403. Omit or leave empty for any address.'
            x-osf-i18n:
              title: { en: Allowed IP addresses, nl: Toegestane IP-adressen }
              description:
                en: Optional. Only these IP addresses or ranges (such as 203.0.113.7 or 203.0.113.0/24) may use the key.
                nl: Optioneel. Alleen deze IP-adressen of reeksen (zoals 203.0.113.7 of 203.0.113.0/24) mogen de sleutel gebruiken.
          allowedOrigins:
            type: array
            maxItems: 10
            uniqueItems: true
            items: { type: string, minLength: 8, maxLength: 255 }
            description: 'Optional web sites, as exact origins such as https://shop.example.com (https except for localhost; no paths or wildcards), at most 10. Non-empty makes every key of this integration a BROWSER key: usable only from pages on these sites, and only for the endpoints in allowedEndpoints. A key in a web page is public, so it can do nothing that is not listed there.'
            x-osf-i18n:
              title: { en: Allowed web sites, nl: Toegestane websites }
              description:
                en: Only for use in a web page. Keys with web sites can call only the endpoints listed below, because anyone visiting the site can see them.
                nl: Alleen voor gebruik in een webpagina. Sleutels met websites kunnen alleen de endpoints hieronder aanroepen, omdat iedere bezoeker van de site ze kan zien.
          allowedEndpoints:
            type: array
            maxItems: 50
            uniqueItems: true
            items: { type: string, minLength: 10, maxLength: 300 }
            description: 'The only endpoints a browser key may call, at most 50, each "<GET|POST> /api/<path>" where a segment written :name matches any one segment ("GET /api/rest/v1/relations/:id"). Empty means a browser key can call nothing. GraphQL, MCP, the control plane and key management can never be listed. Ignored for server keys.'
            x-osf-i18n:
              title: { en: Allowed endpoints, nl: Toegestane endpoints }
              description:
                en: For keys with web sites. One per line, such as GET /api/rest/v1/relations. Nothing else can be called.
                nl: Voor sleutels met websites. Eén per regel, zoals GET /api/rest/v1/relations. Verder kan niets worden aangeroepen.
    output:
      schema:
        type: object
        additionalProperties: false
        required: [integration, credential]
        properties:
          integration:
            type: object
            additionalProperties: false
            required: [integrationId, displayName, status, grantedRoles, allowedIps, allowedOrigins, allowedEndpoints, createdAt]
            description: Ordinary metadata, identical to what the integration list and read report.
            properties:
              integrationId:
                type: string
                format: uuid
                description: Stable database identifier. Unchanged when the realm service account is rebuilt.
                x-osf-i18n: { title: { en: Integration, nl: Integratie } }
              displayName:
                type: string
                x-osf-i18n: { title: { en: Name, nl: Naam } }
              status:
                type: string
                enum: [pending, active, disabled]
                x-osf-i18n:
                  title: { en: Status, nl: Status }
                  enum: *integrationStatusLabels
              grantedRoles:
                type: array
                items: { type: string }
                x-osf-i18n: { title: { en: Roles, nl: Rollen } }
              allowedIps:
                type: array
                items: { type: string }
                description: Network allowlist of IP addresses and CIDR ranges. Empty means any address.
                x-osf-i18n: { title: { en: Allowed IP addresses, nl: Toegestane IP-adressen } }
              allowedOrigins:
                type: array
                items: { type: string }
                description: Web sites (exact origins) whose pages may use this integration's keys. Non-empty makes them browser keys, limited to allowedEndpoints; empty means server keys.
                x-osf-i18n: { title: { en: Allowed web sites, nl: Toegestane websites } }
              allowedEndpoints:
                type: array
                items: { type: string }
                description: The only endpoints a browser key may call, as "<GET|POST> /api/<path>". Empty means none.
                x-osf-i18n: { title: { en: Allowed endpoints, nl: Toegestane endpoints } }
              createdAt:
                type: string
                format: date-time
                x-osf-i18n: { title: { en: Created, nl: Aangemaakt } }
            x-osf-i18n: { title: { en: Integration, nl: Integratie } }
          credential: &mintedCredential
            type: object
            additionalProperties: false
            required: [id, secret, expiresAt]
            description: 'CONFIDENTIAL. `secret` is a live credential, returned here and nowhere else, exactly
              once. Hand it to the external party; never store, log, cache or echo it. Every other read of this
              credential reports metadata only, because the stored half is a hash.'
            properties:
              id:
                type: string
                format: uuid
                x-osf-i18n: { title: { en: Credential, nl: Credential } }
              secret:
                type: string
                description: The credential itself, returned exactly once and never recoverable. Treat as a password, not as data.
                x-osf-i18n:
                  title: { en: API key, nl: API-sleutel }
                  description:
                    en: Copy this key now. You cannot view it again after closing.
                    nl: Kopieer deze sleutel nu. Na het sluiten kun je hem niet opnieuw bekijken.
                x-osf-classification: { sensitivity: confidential }
                x-osf-presentation: { component: FieldSecret }
              expiresAt:
                type: string
                format: date-time
                x-osf-i18n: { title: { en: Expires, nl: Verloopt } }
            x-osf-i18n: { title: { en: New credential, nl: Nieuwe credential } }
    auth: { mode: session, roles: [Platform.ApiKeys.Manage, Platform.ApiKeys.IntegrationCreate] }
    tenancy: { mode: required }
    # The realm is mutated: a service account is created and its roles granted.
    effects: { data: write, external: write }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: acknowledgement }
    errors:
      - { status: 400, code: VALIDATION, description: The input does not describe a valid request. }
      - { status: 401, code: UNAUTHENTICATED, description: An authenticated tenant session is required. }
      - { status: 403, code: FORBIDDEN, description: 'The session may not create the integration: it lacks the creation permission, asked for a role the caller does not hold, or is not a verified person.' }
      - { status: 404, code: NOT_FOUND, description: The integration or credential does not exist in this organization. }
      - { status: 502, code: PROVISIONING_FAILED, description: The identity provider refused or could not complete the service account; nothing usable was handed out and the attempt is left for the reconciler. }
      - { status: 503, code: NOT_CONFIGURED, description: 'This deployment has no API key provisioning configuration, so no integration can be managed here.' }
  createIntegrationProfile:
    id: api-keys.create-integration-profile
    name: { en: Create an integration profile, nl: Integratieprofiel maken }
    description:
      en: Creates a role-free integration for Operation and record grants. Configure its access before approving any account to issue its keys.
      nl: Maakt een integratie zonder rollen voor rechten op operations en records. Configureer de toegang voordat je accounts toestemming geeft om sleutels uit te geven.
    implementation: { type: plugin, plugin: osf-api-keys, handler: createIntegrationProfile }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [displayName]
        properties:
          displayName: { type: string, minLength: 1, maxLength: 200 }
    output:
      schema: &profileSummary
        type: object
        additionalProperties: false
        required: [integrationId, displayName]
        properties:
          integrationId: { type: string, format: uuid }
          displayName: { type: string }
    auth: &profileAdminAuth { mode: session, roles: [Organization.Security.Manage] }
    tenancy: { mode: required }
    effects: { data: write, external: write }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: acknowledgement }
    errors:
      - { status: 400, code: VALIDATION, description: The integration settings are invalid. }
      - { status: 401, code: UNAUTHENTICATED, description: An authenticated tenant session is required. }
      - { status: 403, code: FORBIDDEN, description: A verified person with organization security and API key management access is required. }
      - { status: 404, code: NOT_FOUND, description: The integration was removed or disabled during provisioning. }
      - { status: 502, code: PROVISIONING_FAILED, description: The identity provider could not provision the integration. }
      - { status: 503, code: NOT_CONFIGURED, description: API key provisioning is unavailable. }
  setIntegrationIssuers:
    id: api-keys.set-integration-issuers
    name: { en: Set approved key issuers, nl: Goedgekeurde sleuteluitgevers instellen }
    description:
      en: Replaces the accounts that can issue keys for this profile. An empty list removes all approvals. Existing keys keep working until revoked or expired.
      nl: Vervangt de accounts die sleutels voor dit profiel kunnen uitgeven. Een lege lijst trekt alle toestemmingen in. Bestaande sleutels werken totdat ze zijn ingetrokken of verlopen.
    implementation: { type: plugin, plugin: osf-api-keys, handler: setIntegrationIssuers }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [integrationId, accountIds]
        properties:
          integrationId: *integrationIdInput
          accountIds:
            type: array
            maxItems: 100
            items: { type: string, format: uuid }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [integrationId]
        properties:
          integrationId: { type: string, format: uuid }
    auth: *profileAdminAuth
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: acknowledgement }
    errors: *catalogErrors
  listApprovedIntegrations:
    id: api-keys.list-approved-integrations
    name: { en: List your approved key profiles, nl: Je goedgekeurde sleutelprofielen tonen }
    description:
      en: Lists the organization's integration profiles you can issue a key for. Select one and use api-keys.issue-credential with its integrationId.
      nl: Toont de integratieprofielen waarvoor je een sleutel kunt uitgeven. Kies een profiel en gebruik api-keys.issue-credential met de integrationId.
    implementation: { type: plugin, plugin: osf-api-keys, handler: listApprovedIntegrations }
    input:
      schema: { type: object, additionalProperties: false }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [integrations]
        properties:
          integrations:
            type: array
            items: *profileSummary
    auth: &integrationCreateAuth { mode: session, roles: [Platform.ApiKeys.Manage, Platform.ApiKeys.IntegrationCreate] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: none }
    errors: *catalogErrors
  issueCredential:
    id: api-keys.issue-credential
    name: { en: Issue a credential, nl: Credential uitgeven }
    description:
      en: Issue an API key for an integration you manage or a profile you have been approved to use. Find approved profiles with api-keys.list-approved-integrations. Copy the key when it appears. A profile key uses its configured Operation and record grants.
      nl: Geef een API-sleutel uit voor een integratie die je beheert of een goedgekeurd profiel. Vind je profielen met api-keys.list-approved-integrations. Kopieer de sleutel zodra hij verschijnt. Een profielsleutel gebruikt de ingestelde rechten op operations en records.
    implementation: { type: plugin, plugin: osf-api-keys, handler: issueCredential }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [integrationId, displayName]
        properties:
          integrationId: *integrationIdInput
          displayName:
            type: string
            minLength: 1
            maxLength: 200
            x-osf-i18n: { title: { en: Name, nl: Naam } }
          expiresInDays: *expiresInDays
          roleSubset:
            type: [array, 'null']
            minItems: 1
            items: { type: string, minLength: 1 }
            description: Narrows the credential to a subset of the integration's roles. Omit or null for the integration's full set. Every named role must be held by the caller.
            x-osf-i18n: { title: { en: Role narrowing, nl: Rolbeperking } }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [integrationId, credential]
        properties:
          integrationId:
            type: string
            format: uuid
            x-osf-i18n: { title: { en: Integration, nl: Integratie } }
          credential: *mintedCredential
    auth: *integrationCreateAuth
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: acknowledgement }
    errors: *catalogErrors
  revokeCredential:
    id: api-keys.revoke-credential
    name: { en: Revoke credential, nl: Credential intrekken }
    description:
      en: Revokes one credential so it authenticates nothing from the next request on. Idempotent, and never
        deletes the row — it is the only record that the credential existed and when it was last used.
      nl: Trekt één credential in, zodat die vanaf het volgende verzoek niets meer authenticeert. Idempotent en
        verwijdert de rij nooit — die is het enige bewijs dat de credential bestond en wanneer die laatst is
        gebruikt.
    implementation: { type: plugin, plugin: osf-api-keys, handler: revokeCredential }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [id]
        properties:
          id:
            type: string
            format: uuid
            x-osf-i18n: { title: { en: Credential, nl: Credential } }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [id, status, revokedAt]
        properties:
          id: { type: string, format: uuid, x-osf-i18n: { title: { en: Credential, nl: Credential } } }
          status:
            type: string
            enum: [active, expired, revoked]
            x-osf-i18n:
              title: { en: Status, nl: Status }
              enum: *credentialStatusLabels
          revokedAt:
            type: [string, 'null']
            format: date-time
            x-osf-i18n: { title: { en: Revoked, nl: Ingetrokken } }
    auth: *manageAuth
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: acknowledgement }
    errors: *catalogErrors
  disableIntegration:
    id: api-keys.disable-integration
    name: { en: Disable integration, nl: Integratie uitschakelen }
    description:
      en: Disables one integration and revokes every credential under it, and drops its cached access token so
        the change takes effect on the next request rather than at the end of the current token's life.
      nl: Schakelt één integratie uit, trekt elke credential eronder in en gooit het gecachte accesstoken weg,
        zodat de wijziging bij het volgende verzoek geldt en niet pas na de looptijd van het huidige token.
    implementation: { type: plugin, plugin: osf-api-keys, handler: disableIntegration }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [integrationId]
        properties:
          integrationId: *integrationIdInput
    output:
      schema:
        type: object
        additionalProperties: false
        required: [integrationId, status, revokedCredentials]
        properties:
          integrationId: { type: string, format: uuid, x-osf-i18n: { title: { en: Integration, nl: Integratie } } }
          status:
            type: string
            enum: [pending, active, disabled]
            x-osf-i18n:
              title: { en: Status, nl: Status }
              enum: *integrationStatusLabels
          revokedCredentials:
            type: integer
            minimum: 0
            description: Credentials that had not yet been revoked when the integration was disabled; an expired one is included, because expiry is not revocation.
            x-osf-i18n: { title: { en: Revoked credentials, nl: Ingetrokken credentials } }
    auth: *manageAuth
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: acknowledgement }
    errors: *catalogErrors
  updateIntegrationRoles:
    id: api-keys.update-integration-roles
    name: { en: Edit roles, nl: Rollen wijzigen }
    description:
      en: Replaces the roles of an active integration. Existing API keys keep working and carry the new roles from
        their next request on; a key narrowed to specific roles keeps only those that remain.
      nl: Vervangt de rollen van een actieve integratie. Bestaande API-sleutels blijven werken en krijgen de nieuwe
        rollen vanaf hun volgende verzoek; een sleutel die tot bepaalde rollen is beperkt houdt alleen de rollen die
        overblijven.
    implementation: { type: plugin, plugin: osf-api-keys, handler: updateIntegrationRoles }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [integrationId, roles]
        properties:
          integrationId: *integrationIdInput
          roles:
            type: array
            uniqueItems: true
            items: { type: string, minLength: 1 }
            description: The integration's complete new role set, not a delta. Roles left out are withdrawn. Every
              role in the set must already be held by the caller, exactly as at creation; an empty set grants no
              general roles.
            x-osf-sourceField: grantedRoles
            x-osf-i18n:
              title: { en: Roles, nl: Rollen }
              description:
                en: The complete set of roles. Roles you leave out are withdrawn from the integration and its keys.
                nl: De volledige set rollen. Rollen die je weglaat worden ingetrokken bij de integratie en haar sleutels.
    output: { schema: *integration }
    auth: *manageAuth
    tenancy: { mode: required }
    # The realm is mutated: the service account's client roles are set to the new set.
    effects: { data: write, external: write }
    # Setting a complete set is idempotent: repeating it changes nothing further.
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: acknowledgement }
    errors:
      - { status: 400, code: VALIDATION, description: The input does not describe a valid request. }
      - { status: 401, code: UNAUTHENTICATED, description: An authenticated tenant session is required. }
      - { status: 403, code: FORBIDDEN, description: 'The session may not manage API keys: it lacks the management role, asked for a role the caller does not hold, or is not a verified person.' }
      - { status: 404, code: NOT_FOUND, description: The integration does not exist or is not active in this organization. }
      - { status: 502, code: PROVISIONING_FAILED, description: 'The identity provider refused or could not complete the role change; the stored roles are unchanged and repeating the request converges the realm.' }
      - { status: 503, code: NOT_CONFIGURED, description: 'This deployment has no API key provisioning configuration, so no integration can be managed here.' }
  updateIntegrationRestrictions:
    id: api-keys.update-integration-restrictions
    name: { en: Edit where keys work, nl: Gebruiksplekken wijzigen }
    description:
      en: Replaces the IP addresses, web sites and browser endpoints of this integration's API keys. A list you leave
        out keeps its current value. Takes effect on the next request of every key.
      nl: Vervangt de IP-adressen, websites en browser-endpoints van de API-sleutels van deze integratie. Een lijst die
        je weglaat houdt de huidige waarde. Geldt vanaf het volgende verzoek van elke sleutel.
    implementation: { type: plugin, plugin: osf-api-keys, handler: updateIntegrationRestrictions }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [integrationId]
        properties:
          integrationId: *integrationIdInput
          allowedIps:
            type: array
            maxItems: 20
            uniqueItems: true
            items: { type: string, minLength: 2, maxLength: 64 }
            description: The complete new network allowlist; omit to keep the current one, leave empty for any address.
            x-osf-sourceField: allowedIps
            x-osf-i18n:
              title: { en: Allowed IP addresses, nl: Toegestane IP-adressen }
              description:
                en: Only these IP addresses or ranges (such as 203.0.113.7 or 203.0.113.0/24) may use the keys. Leave empty for any address.
                nl: Alleen deze IP-adressen of reeksen (zoals 203.0.113.7 of 203.0.113.0/24) mogen de sleutels gebruiken. Laat leeg voor elk adres.
          allowedOrigins:
            type: array
            maxItems: 10
            uniqueItems: true
            items: { type: string, minLength: 8, maxLength: 255 }
            description: The complete new list of web sites; omit to keep the current one, leave empty for server keys.
            x-osf-sourceField: allowedOrigins
            x-osf-i18n:
              title: { en: Allowed web sites, nl: Toegestane websites }
              description:
                en: Only for use in a web page. Keys with web sites can call only the endpoints listed below, because anyone visiting the site can see them.
                nl: Alleen voor gebruik in een webpagina. Sleutels met websites kunnen alleen de endpoints hieronder aanroepen, omdat iedere bezoeker van de site ze kan zien.
          allowedEndpoints:
            type: array
            maxItems: 50
            uniqueItems: true
            items: { type: string, minLength: 10, maxLength: 300 }
            description: The complete new list of endpoints; omit to keep the current one, leave empty for none.
            x-osf-sourceField: allowedEndpoints
            x-osf-i18n:
              title: { en: Allowed endpoints, nl: Toegestane endpoints }
              description:
                en: For keys with web sites. One per line, such as GET /api/rest/v1/relations. Nothing else can be called.
                nl: Voor sleutels met websites. Eén per regel, zoals GET /api/rest/v1/relations. Verder kan niets worden aangeroepen.
    output: { schema: *integration }
    auth: *manageAuth
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: acknowledgement }
    errors:
      - { status: 400, code: VALIDATION, description: 'An address, range, web site or endpoint is not valid, or a list is too long.' }
      - { status: 401, code: UNAUTHENTICATED, description: An authenticated tenant session is required. }
      - { status: 403, code: FORBIDDEN, description: 'The session may not manage API keys: it lacks the management role or is not a verified person.' }
      - { status: 404, code: NOT_FOUND, description: The integration does not exist in this organization. }
      - { status: 503, code: NOT_CONFIGURED, description: 'This deployment has no API key provisioning configuration, so no integration can be managed here.' }
interfaces:
  mcp: {}
  rest:
    operations:
      listIntegrations: { method: POST, path: /api/api-key-integrations/list, response: { status: 200, kind: json } }
      getIntegration: { method: POST, path: /api/api-key-integrations/get, response: { status: 200, kind: json } }
      listCredentials: { method: POST, path: /api/api-key-integrations/list-credentials, response: { status: 200, kind: json } }
      getCredential: { method: POST, path: /api/api-key-integrations/get-credential, response: { status: 200, kind: json } }
      createIntegration: { method: POST, path: /api/api-key-integrations/create, response: { status: 200, kind: json } }
      createIntegrationProfile: { method: POST, path: /api/api-key-integrations/create-profile, response: { status: 200, kind: json } }
      setIntegrationIssuers: { method: POST, path: /api/api-key-integrations/set-issuers, response: { status: 200, kind: json } }
      listApprovedIntegrations: { method: POST, path: /api/api-key-integrations/list-approved, response: { status: 200, kind: json } }
      issueCredential: { method: POST, path: /api/api-key-integrations/issue-credential, response: { status: 200, kind: json } }
      revokeCredential: { method: POST, path: /api/api-key-integrations/revoke-credential, response: { status: 200, kind: json } }
      disableIntegration: { method: POST, path: /api/api-key-integrations/disable, response: { status: 200, kind: json } }
      updateIntegrationRoles: { method: POST, path: /api/api-key-integrations/update-roles, response: { status: 200, kind: json } }
      updateIntegrationRestrictions: { method: POST, path: /api/api-key-integrations/update-restrictions, response: { status: 200, kind: json } }
  web:
    entities:
      ApiKeyIntegration:
        title: { en: API integrations, nl: API-integraties }
        route: /api-key-integrations
        recordRoute: /api-key-integrations/:integrationId
        idField: integrationId
        displayField: displayName
        fields: [integrationId, displayName, status, grantedRoles, allowedIps, allowedOrigins, allowedEndpoints, activeCredentialCount, credentialCount, createdAt, updatedAt]
        columns: [displayName, status, activeCredentialCount, createdAt]
        operations:
          list: { operation: listIntegrations, resultField: integrations }
          get: { operation: getIntegration, bindings: { integrationId: integrationId } }
          create: { operation: createIntegration }
          recordActions:
            - issueCredential
            # Only a live integration can be edited; the service refuses the rest as well.
            - operation: updateIntegrationRoles
              visibleWhen: { conditions: [{ field: status, operator: eq, value: active }] }
            - operation: updateIntegrationRestrictions
              visibleWhen: { conditions: [{ field: status, operator: eq, value: active }] }
            - disableIntegration
        related:
          - { entity: ApiKeyCredential, label: { en: Credentials, nl: Credentials }, route: /api-key-integrations/:integrationId/credentials }
          - { entity: RecordActionAssignment, label: { en: Permissions, nl: Rechten }, route: /integrations/:integrationId/record-actions }
      ApiKeyCredential:
        title: { en: Credentials, nl: Credentials }
        route: /api-key-integrations/:integrationId/credentials
        recordRoute: /api-key-integrations/:integrationId/credentials/:id
        recordLayout:
          preset: main-context
          tabs:
            - id: overview
              label: { en: Overview, nl: Overzicht }
              groups:
                - id: details
                  title: { en: Credential, nl: Credential }
                  fields: [displayName, status, integrationId]
                - id: validity
                  title: { en: Validity and use, nl: Geldigheid en gebruik }
                  fields: [createdAt, expiresAt, lastUsedAt, revokedAt, roleSubset]
        idField: id
        displayField: displayName
        fields: [displayName, status, integrationId, createdAt, expiresAt, lastUsedAt, revokedAt, roleSubset, id]
        columns: [displayName, status, expiresAt, lastUsedAt]
        operations:
          list: { operation: listCredentials, resultField: credentials, bindings: { integrationId: integrationId } }
          get: { operation: getCredential, bindings: { id: id, integrationId: integrationId } }
          recordActions: [revokeCredential]
