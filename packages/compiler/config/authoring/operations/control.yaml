# The platform's own administration as canonical Operations.
#
# One operation per thing a platform operator does — tenants, organisations,
# the Service catalog, update notices, reconciliation, audit — bound to the
# core `osf-control` runtime module, projected to REST (the web talks here),
# to MCP (`/admin/mcp`, the assistant talks here) and to web pages. Every
# operation is `auth.mode: control`: the bearer is verified against the
# platform's control realm and must hold one of the listed realm roles;
# `platform_admin` holds the catalog, `platform-operator` the tenant
# lifecycle, and both may see the registry. No tenant context ever exists.
#
# Confirmation `acknowledgement` marks the operations whose blast radius is a
# tenant's access or every tenant at once: a caller passes `confirmed: true`
# after saying so to the person. The web and MCP projections carry that field.
schemaVersion: 1
kind: operationCatalog
plugin: osf-control
operations:
  whoami:
    id: control.whoami
    name:
      en: Who am I
      nl: Wie ben ik
    description:
      en: 'Describes the signed-in platform operator: name, role, scope (the whole platform), how many tenants exist
        and when the sign-in expires. Takes no arguments.'
      nl: 'Beschrijft de aangemelde platformbeheerder: naam, rol, reikwijdte (het hele platform), aantal tenants
        en wanneer de aanmelding verloopt. Zonder argumenten.'
    implementation:
      type: plugin
      plugin: osf-control
      handler: whoami
    input:
      schema:
        type: object
        additionalProperties: false
    output:
      schema:
        type: object
        additionalProperties: true
        properties:
          name:
            type: string
          role:
            type: string
          scope:
            type: string
          tenants:
            type: integer
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: &id001
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: &id002
    - status: 400
      code: VALIDATION
      description: The input does not describe a valid request.
    - status: 401
      code: UNAUTHENTICATED
      description: A control-realm operator token is required.
    - status: 403
      code: FORBIDDEN
      description: The operator lacks a required control-realm role.
    - status: 404
      code: NOT_FOUND
      description: The tenant, organization, entry or notice does not exist.
    - status: 409
      code: CONFLICT
      description: The request contradicts the current platform state.
    - status: 502
      code: IDENTITY_PROVIDER_ERROR
      description: The identity provider refused or failed the request.
    - status: 503
      code: CONTROL_PLANE_NOT_CONFIGURED
      description: The control plane is not configured on this deployment.
  platformGuide:
    id: control.platform-guide
    name:
      en: Platform administration guide
      nl: Gids platformbeheer
    description:
      en: 'The fixed process for administering the Service catalog: what an entry is, how a new version reaches
        tenants, when to force an update, how retirement behaves, and what never to do.'
      nl: 'Het vaste proces voor het beheren van de Service-catalogus: wat een entry is, hoe een nieuwe versie tenants
        bereikt, wanneer je een update forceert, hoe intrekken werkt en wat je nooit doet.'
    implementation:
      type: plugin
      plugin: osf-control
      handler: platformGuide
    input:
      schema:
        type: object
        additionalProperties: false
    output:
      schema:
        type: object
        additionalProperties: false
        properties:
          guide:
            type: string
        required:
        - guide
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id001
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  listTenants:
    id: control.list-tenants
    name:
      en: List tenants
      nl: Tenants
    description:
      en: 'Every tenant of the deployment: slug, display name, lifecycle status, Keycloak organization alias, and
        how many catalog entries it has installed, overridden and pending. Never returns tenant data.'
      nl: 'Alle tenants van deze omgeving: slug, naam, status, Keycloak-organisatie en hoeveel catalogus-entries
        geïnstalleerd, overschreven en in afwachting zijn. Geeft nooit tenantdata terug.'
    implementation:
      type: plugin
      plugin: osf-control
      handler: listTenants
    input:
      schema:
        type: object
        additionalProperties: false
    output:
      schema:
        type: object
        additionalProperties: false
        properties:
          tenants:
            type: array
            items: &id003
              type: object
              additionalProperties: true
        required:
        - tenants
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id001
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  getTenant:
    id: control.get-tenant
    name:
      en: Get tenant
      nl: Tenant opvragen
    description:
      en: One tenant by slug with the same fields list_tenants shows.
      nl: Eén tenant op slug, met dezelfde velden als de tenantlijst.
    implementation:
      type: plugin
      plugin: osf-control
      handler: getTenant
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: &id004
            type: string
            pattern: ^[a-z][a-z0-9-]*$
            description: The tenant's slug as list_tenants reports it (e.g. acme-dev).
        required:
        - slug
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id001
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  createTenant:
    id: control.create-tenant
    name:
      en: Create tenant
      nl: Tenant aanmaken
    description:
      en: Creates or safely replays ONE tenant in the platform registry and its root Keycloak Organization. Use
        a stable kebab-case slug and a human display name. A replay returns the existing tenant and repairs an incomplete
        Keycloak projection; it never deletes or replaces a tenant.
      nl: Maakt ÉÉN tenant aan in het platformregister met zijn Keycloak-hoofdorganisatie, of herhaalt dat veilig.
        Gebruik een stabiele kebab-case slug en een leesbare naam. Een herhaling geeft de bestaande tenant terug
        en herstelt een onvolledige Keycloak-projectie; verwijdert of vervangt nooit.
    implementation:
      type: plugin
      plugin: osf-control
      handler: createTenant
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id004
          name:
            type: string
            minLength: 1
            description: Human display name.
        required:
        - slug
        - name
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: &id005
      data: write
      external: write
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  updateTenant:
    id: control.update-tenant
    name:
      en: Update tenant
      nl: Tenant wijzigen
    description:
      en: Renames ONE tenant and/or changes its lifecycle status. The slug stays immutable. Setting inactive or
        suspended disables the root Keycloak Organization and can interrupt access. Repeating the same state is
        a no-op.
      nl: Hernoemt ÉÉN tenant en/of wijzigt zijn status. De slug blijft onveranderlijk. Inactief of geschorst zetten
        schakelt de Keycloak-hoofdorganisatie uit en kan toegang onderbreken. Dezelfde status herhalen doet niets.
    implementation:
      type: plugin
      plugin: osf-control
      handler: updateTenant
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id004
          name:
            type: string
            minLength: 1
          status:
            type: string
            enum:
            - active
            - inactive
            - suspended
        required:
        - slug
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id005
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
    errors: *id002
  getBlueprintLibrary:
    id: control.get-blueprint-library
    name:
      en: Get blueprint library
      nl: Blueprintbibliotheek opvragen
    description:
      en: Which tenant's published blueprints ONE tenant may copy from, or null when none is assigned.
      nl: Van welke tenant ÉÉN tenant gepubliceerde blueprints mag kopiëren, of null als er geen is toegewezen.
    implementation:
      type: plugin
      plugin: osf-control
      handler: getBlueprintLibrary
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id004
        required:
        - slug
    output:
      schema:
        type: object
        additionalProperties: true
        properties:
          tenant:
            type: string
          blueprintTenant:
            type:
            - string
            - 'null'
        required:
        - tenant
        - blueprintTenant
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id001
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  assignBlueprintLibrary:
    id: control.assign-blueprint-library
    name:
      en: Assign blueprint library
      nl: Blueprintbibliotheek toewijzen
    description:
      en: Marks ONE active tenant as the blueprint library another tenant copies from. Pass null to clear the assignment.
        Existing copies keep their recorded source; a tenant cannot be its own library.
      nl: Markeert ÉÉN actieve tenant als de blueprintbibliotheek waaruit een andere tenant kopieert. Geef null
        om de toewijzing te wissen. Bestaande kopieën houden hun bron; een tenant kan niet zijn eigen bibliotheek
        zijn.
    implementation:
      type: plugin
      plugin: osf-control
      handler: assignBlueprintLibrary
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id004
          blueprintTenantSlug:
            anyOf:
            - type: string
              pattern: ^[a-z][a-z0-9-]*$
            - type: 'null'
            description: The library tenant's slug, or null to clear.
        required:
        - slug
        - blueprintTenantSlug
    output:
      schema:
        type: object
        additionalProperties: true
        properties:
          tenant:
            type: string
          blueprintTenant:
            type:
            - string
            - 'null'
          changed:
            type: boolean
        required:
        - tenant
        - blueprintTenant
        - changed
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: &id009
      data: write
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  inviteFirstTenantAdmin:
    id: control.invite-first-tenant-admin
    name:
      en: Invite first tenant administrator
      nl: Eerste tenantbeheerder uitnodigen
    description:
      en: Invites the first org_admin by email for ONE existing active tenant, through the Keycloak organization
        invitation flow. Repeating the same request reuses the invitation without resending. Refuses a different
        first administrator once one exists or is pending.
      nl: Nodigt per e-mail de eerste org_admin uit voor ÉÉN bestaande actieve tenant, via de Keycloak-organisatie-uitnodiging.
        Herhalen hergebruikt de uitnodiging zonder opnieuw te versturen. Weigert een andere eerste beheerder zodra
        er één bestaat of in afwachting is.
    implementation:
      type: plugin
      plugin: osf-control
      handler: inviteFirstTenantAdmin
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id004
          email:
            type: string
            format: email
        required:
        - slug
        - email
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id005
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
    errors: *id002
  getTenantOrganizationTree:
    id: control.get-tenant-organization-tree
    name:
      en: Get organization tree
      nl: Organisatieboom opvragen
    description:
      en: The complete bounded sub-organization tree of ONE tenant beneath its Keycloak Organization, with the opaque
        org-unit ids used to create or move children. Never returns members or credentials.
      nl: De volledige boom van suborganisaties van ÉÉN tenant onder zijn Keycloak-organisatie, met de org-unit-ids
        om kinderen aan te maken of te verplaatsen. Geeft nooit leden of inloggegevens terug.
    implementation:
      type: plugin
      plugin: osf-control
      handler: getTenantOrganizationTree
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id004
        required:
        - slug
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: &id006
      data: read
      external: read
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  createTenantOrganization:
    id: control.create-tenant-organization
    name:
      en: Create organization
      nl: Organisatie aanmaken
    description:
      en: Creates or safely replays ONE sub-organization beneath a tenant root or an explicit parent org unit, and
        provisions its Keycloak Organization and MCP audience scope.
      nl: Maakt ÉÉN suborganisatie aan onder de tenantroot of een expliciete bovenliggende org-unit, of herhaalt
        dat veilig, inclusief Keycloak-organisatie en MCP-audience-scope.
    implementation:
      type: plugin
      plugin: osf-control
      handler: createTenantOrganization
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          tenantSlug: *id004
          slug:
            type: string
            pattern: ^[a-z][a-z0-9-]*$
            description: Immutable kebab-case path segment.
          name:
            type: string
            minLength: 1
            description: Human display name.
          parentOrgUnitId:
            type: string
            format: uuid
            description: Opaque parent org-unit id; omit for the tenant root.
        required:
        - tenantSlug
        - slug
        - name
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id005
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  updateTenantOrganization:
    id: control.update-tenant-organization
    name:
      en: Update organization
      nl: Organisatie wijzigen
    description:
      en: Renames and/or reparents ONE existing sub-organization inside its tenant. Reparenting reprojects every
        descendant path in Keycloak and can affect access; null moves the unit directly beneath the tenant root.
      nl: Hernoemt en/of verplaatst ÉÉN bestaande suborganisatie binnen zijn tenant. Verplaatsen projecteert alle
        onderliggende paden opnieuw in Keycloak en kan toegang beïnvloeden; null zet de unit direct onder de tenantroot.
    implementation:
      type: plugin
      plugin: osf-control
      handler: updateTenantOrganization
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          tenantSlug: *id004
          orgUnitId:
            type: string
            format: uuid
          name:
            type: string
            minLength: 1
          parentOrgUnitId:
            anyOf:
            - type: string
              format: uuid
            - type: 'null'
            description: New parent id, or null for the tenant root; omit to keep the current parent.
        required:
        - tenantSlug
        - orgUnitId
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id005
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
    errors: *id002
  getReconciliationReport:
    id: control.get-reconciliation-report
    name:
      en: Reconciliation report
      nl: Reconciliatierapport
    description:
      en: Compares the authoritative tenant and organization registry with its Keycloak projection and returns every
        bounded drift finding, including safe non-repairable ones. Inspect this before reapplying.
      nl: Vergelijkt het gezaghebbende tenant- en organisatieregister met de Keycloak-projectie en geeft elke afwijking
        terug, ook de veilige niet-herstelbare. Bekijk dit voordat je opnieuw toepast.
    implementation:
      type: plugin
      plugin: osf-control
      handler: getReconciliationReport
    input:
      schema:
        type: object
        additionalProperties: false
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id006
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  reapplyReconciliation:
    id: control.reapply-reconciliation
    name:
      en: Reapply reconciliation
      nl: Reconciliatie opnieuw toepassen
    description:
      en: Pushes authoritative registry state back into Keycloak for repairable drift, for ONE tenant slug or for
        every affected tenant when omitted. It never deletes unclaimed Organizations; replay may change identity
        access.
      nl: Zet de gezaghebbende registerstaat terug in Keycloak voor herstelbare afwijkingen, voor ÉÉN tenant of
        voor alle betrokken tenants als je geen slug geeft. Verwijdert nooit niet-opgeëiste organisaties; kan toegang
        veranderen.
    implementation:
      type: plugin
      plugin: osf-control
      handler: reapplyReconciliation
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          tenantSlug: *id004
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id005
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
    errors: *id002
  listPlatformAudit:
    id: control.list-platform-audit
    name:
      en: Platform audit
      nl: Platformaudit
    description:
      en: 'Recent audited platform actions, newest first: actor, time, action, target and result. Filter by exact
        actor or action, result and a time window; pass nextCursor back as cursor to continue. Never returns tokens,
        credentials or request bodies.'
      nl: 'Recente geauditeerde platformacties, nieuwste eerst: actor, tijd, actie, doel en resultaat. Filter op
        actor, actie, resultaat en tijdvenster; geef nextCursor terug als cursor om verder te bladeren. Geeft nooit
        tokens, inloggegevens of request-bodies terug.'
    implementation:
      type: plugin
      plugin: osf-control
      handler: listPlatformAudit
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          actor:
            type: string
            description: Exact audited actor subject.
          action:
            type: string
            description: Exact action name, such as publishCatalogEntry.
          result:
            type: string
            enum:
            - succeeded
            - failed
            - in_progress
          since:
            type: string
            format: date-time
          until:
            type: string
            format: date-time
          cursor:
            type: string
          limit:
            type: integer
            minimum: 1
            maximum: 200
            description: Page size, default 50.
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id001
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  listCatalogEntries:
    id: control.list-catalog-entries
    name:
      en: Service catalog
      nl: Servicecatalogus
    description:
      en: 'The Service catalog, newest version per key, with per-tenant installation state: installed version, whether
        the tenant overrode it, and whether an update is pending. Filter by kind and/or key; paged.'
      nl: 'De Servicecatalogus, nieuwste versie per sleutel, met per tenant de installatiestand: geïnstalleerde
        versie, overschreven of niet, update in afwachting. Filter op soort en/of sleutel; gepagineerd.'
    implementation:
      type: plugin
      plugin: osf-control
      handler: listCatalogEntries
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          kind: &id007
            type: string
            enum:
            - service
            - adapter
            - capability
            description: Catalog entry kind.
          key: &id008
            type: string
            pattern: ^[a-z][a-z0-9-]*$
            description: Stable catalog key, kebab-case.
          cursor:
            type: string
          limit:
            type: integer
            minimum: 1
            maximum: 200
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id001
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  getCatalogEntry:
    id: control.get-catalog-entry
    name:
      en: Get catalog entry
      nl: Catalogus-entry opvragen
    description:
      en: 'One catalog entry by kind and key: its definition and every tenant''s installation state.'
      nl: 'Eén catalogus-entry op soort en sleutel: de definitie en de installatiestand per tenant.'
    implementation:
      type: plugin
      plugin: osf-control
      handler: getCatalogEntry
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          kind: *id007
          key: *id008
        required:
        - kind
        - key
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id001
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  publishCatalogEntry:
    id: control.publish-catalog-entry
    name:
      en: Publish catalog entry
      nl: Catalogus-entry publiceren
    description:
      en: 'Publishes a new version of ONE catalog entry to every tenant: tenants that did not override it are updated,
        overridden tenants are flagged. There is no dry run; every tenant is affected.'
      nl: 'Publiceert een nieuwe versie van ÉÉN catalogus-entry naar alle tenants: tenants zonder eigen overschrijving
        worden bijgewerkt, overschreven tenants worden gemarkeerd. Geen proefdraai; elke tenant wordt geraakt.'
    implementation:
      type: plugin
      plugin: osf-control
      handler: publishCatalogEntry
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          kind: *id007
          key: *id008
          definition:
            type: object
            additionalProperties: true
            description: The complete entry definition, exactly as the catalog stores it.
          authority:
            type: string
            enum:
            - platform
            - tenant
            description: Who owns changes after publication.
        required:
        - kind
        - key
        - definition
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id009
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: acknowledgement
    errors: *id002
  retireCatalogEntry:
    id: control.retire-catalog-entry
    name:
      en: Retire catalog entry
      nl: Catalogus-entry intrekken
    description:
      en: 'Publishes a version marked retired: the Service becomes draft for every tenant that did not override
        it; overridden tenants are flagged and keep it until the update is applied.'
      nl: 'Publiceert een versie gemarkeerd als ingetrokken: de Service wordt concept voor elke tenant zonder overschrijving;
        overschreven tenants worden gemarkeerd en houden hem tot de update is toegepast.'
    implementation:
      type: plugin
      plugin: osf-control
      handler: retireCatalogEntry
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          kind: *id007
          key: *id008
        required:
        - kind
        - key
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id009
    reliability:
      idempotency:
        mode: none
    confirmation:
      mode: acknowledgement
    errors: *id002
  applyCatalogUpdateForTenant:
    id: control.apply-catalog-update-for-tenant
    name:
      en: Apply catalog update for tenant
      nl: Catalogus-update toepassen voor tenant
    description:
      en: Forces the latest published version of ONE entry onto ONE tenant that overrode it, discarding the tenant's
        override.
      nl: Forceert de nieuwste gepubliceerde versie van ÉÉN entry op ÉÉN tenant die hem overschreef, en gooit de
        overschrijving van de tenant weg.
    implementation:
      type: plugin
      plugin: osf-control
      handler: applyCatalogUpdateForTenant
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id004
          kind: *id007
          key: *id008
        required:
        - slug
        - kind
        - key
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id009
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
    errors: *id002
  publishUpdateNotice:
    id: control.publish-update-notice
    name:
      en: Publish update notice
      nl: Updatebericht publiceren
    description:
      en: Tells everyone on this deployment what changed. Every person's assistant sees it once; serviceChanges
        brings each affected personal instruction up for review. Republishing a key replaces it for people not yet
        told.
      nl: Vertelt iedereen op deze omgeving wat er veranderd is. Elke assistent ziet het één keer; serviceChanges
        legt elke geraakte persoonlijke instructie ter beoordeling voor. Opnieuw publiceren vervangt het bericht
        voor wie het nog niet zag.
    implementation:
      type: plugin
      plugin: osf-control
      handler: publishUpdateNotice
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          key:
            type: string
            pattern: ^[a-z][a-z0-9-]*$
            description: Stable notice key, kebab-case (e.g. day-start-v3).
          title:
            type: string
            minLength: 1
          changed:
            type: string
            minLength: 1
            description: What changed, for the assistant to put in the person's own words.
          assistantChanges:
            type: array
            items:
              type: string
            description: What an assistant now does differently. One sentence per entry.
          userActions:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                action:
                  type: string
                why:
                  type: string
              required:
              - action
            description: Steps only the person can take.
          serviceChanges:
            type: object
            additionalProperties:
              type: string
            description: Catalog key of each changed Service mapped to what changed on it.
        required:
        - key
        - title
        - changed
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id009
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  listUpdateNotices:
    id: control.list-update-notices
    name:
      en: Update notices
      nl: Updateberichten
    description:
      en: Every published update notice, newest first, with how many people have been told.
      nl: Elk gepubliceerd updatebericht, nieuwste eerst, met hoeveel mensen het gezien hebben.
    implementation:
      type: plugin
      plugin: osf-control
      handler: listUpdateNotices
    input:
      schema:
        type: object
        additionalProperties: false
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id001
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  withdrawUpdateNotice:
    id: control.withdraw-update-notice
    name:
      en: Withdraw update notice
      nl: Updatebericht intrekken
    description:
      en: Withdraws ONE notice so nobody else is told; people already told keep their record.
      nl: Trekt ÉÉN bericht in zodat niemand het nog te zien krijgt; wie het al zag houdt dat.
    implementation:
      type: plugin
      plugin: osf-control
      handler: withdrawUpdateNotice
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          key: *id008
        required:
        - key
    output:
      schema: *id003
    auth:
      mode: control
      roles:
      - platform_admin
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id009
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
