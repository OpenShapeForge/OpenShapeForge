# The platform's own administration as canonical Operations.
#
# One operation per thing a platform operator does — tenants, organisations,
# the Service catalog, update notices, reconciliation, audit — bound to the
# core `osf-control` runtime module, projected to REST (the web talks here),
# to MCP (`/admin/mcp`, the assistant talks here) and to web pages. Every
# operation is `auth.mode: control`: the bearer is verified against the
# platform's control realm and must hold one of the listed realm roles;
# `platform_admin` holds the catalog, `platform-operator` the tenant
# lifecycle, and both may see the registry. No tenant context ever exists.
#
# Confirmation `acknowledgement` marks the operations whose blast radius is a
# tenant's access or every tenant at once: a caller passes `confirmed: true`
# after saying so to the person. The web and MCP projections carry that field.
schemaVersion: 1
kind: operationCatalog
plugin: osf-control
operations:
  whoami:
    id: control.whoami
    name:
      en: Who am I
      nl: Wie ben ik
    description:
      en: 'Describes the signed-in platform operator: name, role, scope (the whole platform), how many tenants exist
        and when the sign-in expires. Takes no arguments.'
      nl: 'Beschrijft de aangemelde platformbeheerder: naam, rol, reikwijdte (het hele platform), aantal tenants
        en wanneer de aanmelding verloopt. Zonder argumenten.'
    implementation:
      type: plugin
      plugin: osf-control
      handler: whoami
    input:
      schema:
        type: object
        additionalProperties: false
    output:
      schema:
        type: object
        additionalProperties: true
        properties:
          name:
            type: string
            x-osf-i18n:
              title:
                en: Name
                nl: Naam
          role:
            type: string
            x-osf-i18n:
              title:
                en: Role
                nl: Rol
          scope:
            type: string
            x-osf-i18n:
              title:
                en: Scope
                nl: Reikwijdte
          tenants:
            type: integer
            x-osf-i18n:
              title: &id003
                en: Tenants
                nl: Tenants
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: &id001
      data: read
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: &id002
    - status: 400
      code: VALIDATION
      description: The input does not describe a valid request.
    - status: 401
      code: UNAUTHENTICATED
      description: A control-realm operator token is required.
    - status: 403
      code: FORBIDDEN
      description: The operator lacks a required control-realm role.
    - status: 404
      code: NOT_FOUND
      description: The tenant, organization, entry or notice does not exist.
    - status: 409
      code: CONFLICT
      description: The request contradicts the current platform state.
    - status: 502
      code: IDENTITY_PROVIDER_ERROR
      description: The identity provider refused or failed the request.
    - status: 503
      code: CONTROL_PLANE_NOT_CONFIGURED
      description: The control plane is not configured on this deployment.
  platformGuide:
    id: control.platform-guide
    name:
      en: Platform administration guide
      nl: Gids platformbeheer
    description:
      en: 'The fixed process for administering the Service catalog: what an entry is, how a new version reaches
        tenants, when to force an update, how retirement behaves, and what never to do.'
      nl: 'Het vaste proces voor het beheren van de Service-catalogus: wat een entry is, hoe een nieuwe versie tenants
        bereikt, wanneer je een update forceert, hoe intrekken werkt en wat je nooit doet.'
    implementation:
      type: plugin
      plugin: osf-control
      handler: platformGuide
    input:
      schema:
        type: object
        additionalProperties: false
    output:
      schema:
        type: object
        additionalProperties: false
        properties:
          guide:
            type: string
            x-osf-i18n:
              title:
                en: Guide
                nl: Gids
        required:
        - guide
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id001
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  listTenants:
    id: control.list-tenants
    name:
      en: List tenants
      nl: Tenants
    description:
      en: 'Every tenant of the deployment: slug, display name, lifecycle status, Keycloak organization alias, and
        how many catalog entries it has installed, overridden and pending. Never returns tenant data.'
      nl: 'Alle tenants van deze omgeving: slug, naam, status, Keycloak-organisatie en hoeveel catalogus-entries
        geïnstalleerd, overschreven en in afwachting zijn. Geeft nooit tenantdata terug.'
    implementation:
      type: plugin
      plugin: osf-control
      handler: listTenants
    input:
      schema:
        type: object
        additionalProperties: false
    output:
      schema:
        type: object
        additionalProperties: false
        properties:
          tenants:
            type: array
            items:
              type: object
              additionalProperties: false
              properties:
                id:
                  type: string
                  x-osf-i18n: { title: { en: ID, nl: ID } }
                slug:
                  type: string
                  x-osf-i18n: { title: { en: Slug, nl: Slug } }
                name:
                  type: string
                  x-osf-i18n: { title: { en: Name, nl: Naam } }
                status:
                  type: string
                  x-osf-i18n: { title: { en: Status, nl: Status } }
                tenantKind:
                  type: string
                  x-osf-i18n: { title: { en: Tenant kind, nl: Tenantsoort } }
                relationId:
                  type: [string, 'null']
                  x-osf-i18n: { title: { en: Relation ID, nl: Relatie-ID } }
                relationLabel:
                  type: [string, 'null']
                  x-osf-i18n: { title: { en: Relation, nl: Relatie } }
                keycloakOrganizationId:
                  type: [string, 'null']
                  x-osf-i18n: { title: { en: Keycloak organization ID, nl: Keycloak-organisatie-ID } }
                organizationAlias:
                  type: [string, 'null']
                  x-osf-i18n: { title: { en: Organization alias, nl: Organisatie-alias } }
                installedEntries:
                  type: integer
                  x-osf-i18n: { title: { en: Installed services, nl: Geïnstalleerde services } }
                overriddenEntries:
                  type: integer
                  x-osf-i18n: { title: { en: Overridden services, nl: Overschreven services } }
                updatesAvailable:
                  type: integer
                  x-osf-i18n: { title: { en: Updates available, nl: Updates beschikbaar } }
              required: [id, slug, name, status, tenantKind, relationId, relationLabel, keycloakOrganizationId, organizationAlias, installedEntries, overriddenEntries, updatesAvailable]
            x-osf-i18n:
              title: *id003
        required:
        - tenants
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id001
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  getTenant:
    id: control.get-tenant
    name:
      en: Get tenant
      nl: Tenant opvragen
    description:
      en: One tenant by slug with the same fields list_tenants shows.
      nl: Eén tenant op slug, met dezelfde velden als de tenantlijst.
    implementation:
      type: plugin
      plugin: osf-control
      handler: getTenant
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: &id005
            type: string
            pattern: ^[a-z][a-z0-9-]*$
            description: The tenant's slug as list_tenants reports it (e.g. acme-dev).
            x-osf-i18n:
              title: &id010
                en: Tenant slug
                nl: Tenant-slug
        required:
        - slug
    output:
      schema: &id004
        type: object
        additionalProperties: true
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id001
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  createTenant:
    id: control.create-tenant
    name:
      en: Create tenant
      nl: Tenant aanmaken
    description:
      en: Creates or safely replays ONE tenant in the platform registry and its root Keycloak Organization. Use
        a stable kebab-case slug and a human display name. A replay returns the existing tenant and repairs an incomplete
        Keycloak projection; it never deletes or replaces a tenant.
      nl: Maakt ÉÉN tenant aan in het platformregister met zijn Keycloak-hoofdorganisatie, of herhaalt dat veilig.
        Gebruik een stabiele kebab-case slug en een leesbare naam. Een herhaling geeft de bestaande tenant terug
        en herstelt een onvolledige Keycloak-projectie; verwijdert of vervangt nooit.
    implementation:
      type: plugin
      plugin: osf-control
      handler: createTenant
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id005
          name:
            type: string
            minLength: 1
            description: Human display name.
            x-osf-i18n:
              title: &id006
                en: Name
                nl: Naam
        required:
        - slug
        - name
    output:
      schema: *id004
    auth:
      mode: control
      roles:
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: &id007
      data: write
      external: write
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  updateTenant:
    id: control.update-tenant
    name:
      en: Update tenant
      nl: Tenant wijzigen
    description:
      en: Renames ONE tenant and/or changes its lifecycle status. The slug stays immutable. Setting inactive or
        suspended disables the root Keycloak Organization and can interrupt access. Repeating the same state is
        a no-op.
      nl: Hernoemt ÉÉN tenant en/of wijzigt zijn status. De slug blijft onveranderlijk. Inactief of geschorst zetten
        schakelt de Keycloak-hoofdorganisatie uit en kan toegang onderbreken. Dezelfde status herhalen doet niets.
    implementation:
      type: plugin
      plugin: osf-control
      handler: updateTenant
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id005
          name:
            type: string
            minLength: 1
            x-osf-i18n:
              title: *id006
          status:
            type: string
            enum:
            - active
            - inactive
            - suspended
            x-osf-i18n:
              title:
                en: Status
                nl: Status
              enum:
                active:
                  en: Active
                  nl: Actief
                inactive:
                  en: Inactive
                  nl: Inactief
                suspended:
                  en: Suspended
                  nl: Geschorst
        required:
        - slug
    output:
      schema: *id004
    auth:
      mode: control
      roles:
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id007
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
    errors: *id002
  getBlueprintLibrary:
    id: control.get-blueprint-library
    name:
      en: Get blueprint library
      nl: Blueprintbibliotheek opvragen
    description:
      en: Which tenant's published blueprints ONE tenant may copy from, or null when none is assigned.
      nl: Van welke tenant ÉÉN tenant gepubliceerde blueprints mag kopiëren, of null als er geen is toegewezen.
    implementation:
      type: plugin
      plugin: osf-control
      handler: getBlueprintLibrary
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id005
        required:
        - slug
    output:
      schema:
        type: object
        additionalProperties: true
        properties:
          tenant:
            type: string
            x-osf-i18n:
              title: &id008
                en: Tenant
                nl: Tenant
          blueprintTenant:
            type:
            - string
            - 'null'
            x-osf-i18n:
              title: &id009
                en: Blueprint library tenant
                nl: Blueprintbibliotheek-tenant
        required:
        - tenant
        - blueprintTenant
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id001
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  assignBlueprintLibrary:
    id: control.assign-blueprint-library
    name:
      en: Assign blueprint library
      nl: Blueprintbibliotheek toewijzen
    description:
      en: Marks ONE active tenant as the blueprint library another tenant copies from. Pass null to clear the assignment.
        Existing copies keep their recorded source; a tenant cannot be its own library.
      nl: Markeert ÉÉN actieve tenant als de blueprintbibliotheek waaruit een andere tenant kopieert. Geef null
        om de toewijzing te wissen. Bestaande kopieën houden hun bron; een tenant kan niet zijn eigen bibliotheek
        zijn.
    implementation:
      type: plugin
      plugin: osf-control
      handler: assignBlueprintLibrary
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id005
          blueprintTenantSlug:
            anyOf:
            - type: string
              pattern: ^[a-z][a-z0-9-]*$
            - type: 'null'
            description: The library tenant's slug, or null to clear.
            x-osf-i18n:
              title:
                en: Blueprint library tenant
                nl: Blueprintbibliotheek-tenant
        required:
        - slug
        - blueprintTenantSlug
    output:
      schema:
        type: object
        additionalProperties: true
        properties:
          tenant:
            type: string
            x-osf-i18n:
              title: *id008
          blueprintTenant:
            type:
            - string
            - 'null'
            x-osf-i18n:
              title: *id009
          changed:
            type: boolean
            x-osf-i18n:
              title:
                en: Changed
                nl: Gewijzigd
        required:
        - tenant
        - blueprintTenant
        - changed
    auth:
      mode: control
      roles:
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: &id017
      data: write
      external: none
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  inviteFirstTenantAdmin:
    id: control.invite-first-tenant-admin
    name:
      en: Invite first tenant administrator
      nl: Eerste tenantbeheerder uitnodigen
    description:
      en: Invites the first organization administrator by email for ONE existing active tenant, through the Keycloak organization
        invitation flow. Repeating the same request reuses the invitation without resending. Refuses a different
        first administrator once one exists or is pending.
      nl: Nodigt per e-mail de eerste org_admin uit voor ÉÉN bestaande actieve tenant, via de Keycloak-organisatie-uitnodiging.
        Herhalen hergebruikt de uitnodiging zonder opnieuw te versturen. Weigert een andere eerste beheerder zodra
        er één bestaat of in afwachting is.
    implementation:
      type: plugin
      plugin: osf-control
      handler: inviteFirstTenantAdmin
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id005
          email:
            type: string
            format: email
            x-osf-i18n:
              title:
                en: E-mail address
                nl: E-mailadres
        required:
        - slug
        - email
    output:
      schema: *id004
    auth:
      mode: control
      roles:
      - platform-operator
    tenancy:
      mode: none
      description: A platform operator acts across every tenant; no tenant context exists.
    effects: *id007
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
    errors: *id002
  listTenantInvitations:
    id: control.list-tenant-invitations
    name:
      en: List tenant invitations
      nl: Tenantuitnodigingen bekijken
    description:
      en: Lists the outstanding Keycloak invitations for one tenant together with their stored roles, delivery dates, expiry and any pending local role assignments missing at the provider. Never returns invitation links.
      nl: Toont de openstaande Keycloak-uitnodigingen voor één tenant met hun opgeslagen rollen, verzenddata, vervaldatum en lokale roltoekenningen die bij de provider ontbreken. Geeft nooit uitnodigingslinks terug.
    implementation:
      type: plugin
      plugin: osf-control
      handler: listTenantInvitations
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id005
        required:
        - slug
    output:
      schema:
        type: object
        additionalProperties: false
        properties:
          tenant: { type: string, x-osf-i18n: { title: { en: Tenant, nl: Tenant } } }
          invitations:
            type: array
            x-osf-i18n: { title: { en: Invitations, nl: Uitnodigingen } }
            items:
              type: object
              additionalProperties: false
              properties:
                tenantSlug: { type: string, x-osf-i18n: { title: { en: Tenant, nl: Tenant } } }
                invitationId: { type: string, x-osf-i18n: { title: { en: Invitation ID, nl: Uitnodigings-ID } } }
                email: { type: string, x-osf-i18n: { title: { en: Email, nl: E-mail } } }
                firstName: { type: [string, 'null'], x-osf-i18n: { title: { en: First name, nl: Voornaam } } }
                lastName: { type: [string, 'null'], x-osf-i18n: { title: { en: Last name, nl: Achternaam } } }
                status: { type: [string, 'null'], x-osf-i18n: { title: { en: Status, nl: Status } } }
                sentAt: { type: [number, 'null'], x-osf-i18n: { title: { en: Sent at, nl: Verzonden op } } }
                expiresAt: { type: [number, 'null'], x-osf-i18n: { title: { en: Expires at, nl: Verloopt op } } }
                role: { type: [string, 'null'], x-osf-i18n: { title: { en: Role, nl: Rol } } }
                registrationStatus: { type: string, x-osf-i18n: { title: { en: Registration status, nl: Registratiestatus } } }
                canResend: { type: boolean, x-osf-i18n: { title: { en: Can resend, nl: Opnieuw versturen mogelijk } } }
              required: [tenantSlug, invitationId, email, firstName, lastName, status, sentAt, expiresAt, role, registrationStatus, canResend]
          unresolved:
            type: array
            items: { type: object, additionalProperties: true }
            x-osf-i18n: { title: { en: Unresolved invitations, nl: Onopgeloste uitnodigingen } }
        required: [tenant, invitations, unresolved]
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform administrator acts across every tenant; no tenant context exists.
    effects:
      data: read
      external: read
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: none
    errors: *id002
  getTenantInvitation:
    id: control.get-tenant-invitation
    name: { en: Get tenant invitation, nl: Tenantuitnodiging opvragen }
    description: { en: Reads one currently outstanding invitation without returning its invitation link., nl: Leest één actuele uitnodiging zonder de uitnodigingslink terug te geven. }
    implementation: { type: plugin, plugin: osf-control, handler: getTenantInvitation }
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id005
          invitationId: { type: string, pattern: '^[a-zA-Z0-9_-]{1,128}$', x-osf-i18n: { title: { en: Invitation ID, nl: Uitnodigings-ID } } }
        required: [slug, invitationId]
    output: { schema: { type: object, additionalProperties: true } }
    auth: { mode: control, roles: [platform_admin, platform-operator] }
    tenancy: { mode: none, description: A platform identity operation names one tenant explicitly. }
    effects: { data: read, external: read }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors: *id002
  createTenantInvitation:
    id: control.create-tenant-invitation
    name: { en: Invite tenant member, nl: Tenantlid uitnodigen }
    description: { en: Invites one member through Keycloak and records the allowlisted role applied after acceptance., nl: Nodigt één lid uit via Keycloak en legt de toegestane rol vast die na acceptatie wordt toegepast. }
    implementation: { type: plugin, plugin: osf-control, handler: createTenantInvitation }
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id005
          email: { type: string, format: email, x-osf-i18n: { title: { en: Email, nl: E-mail } } }
          firstName: { type: string, x-osf-i18n: { title: { en: First name, nl: Voornaam } } }
          lastName: { type: string, x-osf-i18n: { title: { en: Last name, nl: Achternaam } } }
          role:
            type: string
            enum: [org_admin, org_employee]
            x-osf-i18n: { title: { en: Role, nl: Rol }, enum: { org_admin: { en: Organization administrator, nl: Organisatiebeheerder }, org_employee: { en: Employee, nl: Medewerker } } }
        required: [slug, email, role]
    output: { schema: *id004 }
    auth: { mode: control, roles: [platform-operator] }
    tenancy: { mode: none, description: A platform identity operation names one tenant explicitly. }
    effects: { data: write, external: write }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: acknowledgement }
    errors: *id002
  revokeTenantInvitation:
    id: control.revoke-tenant-invitation
    name:
      en: Revoke tenant invitation
      nl: Tenantuitnodiging intrekken
    description:
      en: Revokes one currently outstanding invitation selected from List tenant invitations. Invalidates the delivered link and cancels its pending role assignment without removing an accepted member.
      nl: Trekt één actuele uitnodiging uit Tenantuitnodigingen bekijken in. Maakt de verzonden link ongeldig en annuleert de openstaande roltoekenning zonder een geaccepteerd lid te verwijderen.
    implementation:
      type: plugin
      plugin: osf-control
      handler: revokeTenantInvitation
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id005
          invitationId:
            type: string
            pattern: ^[a-zA-Z0-9_-]{1,128}$
            description: Opaque invitationId returned by List tenant invitations.
            x-osf-i18n:
              title:
                en: Invitation ID
                nl: Uitnodigings-ID
        required:
        - slug
        - invitationId
    output:
      schema: *id004
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
      description: A platform administrator acts across every tenant; no tenant context exists.
    effects:
      data: write
      external: write
    reliability:
      idempotency:
        mode: natural
    confirmation:
      mode: acknowledgement
    errors: *id002
  resendTenantInvitation:
    id: control.resend-tenant-invitation
    name:
      en: Resend tenant invitation
      nl: Tenantuitnodiging opnieuw versturen
    description:
      en: Explicitly resends one currently outstanding invitation selected from List tenant invitations, preserving its recipient and pending role. Never retries automatically after an uncertain mail response.
      nl: Verstuurt één actuele uitnodiging uit Tenantuitnodigingen bekijken expliciet opnieuw met behoud van ontvanger en openstaande rol. Probeert na een onzekere mailrespons nooit automatisch opnieuw.
    implementation:
      type: plugin
      plugin: osf-control
      handler: resendTenantInvitation
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          slug: *id005
          invitationId:
            type: string
            pattern: ^[a-zA-Z0-9_-]{1,128}$
            description: Opaque invitationId returned by List tenant invitations.
            x-osf-i18n:
              title:
                en: Invitation ID
                nl: Uitnodigings-ID
        required:
        - slug
        - invitationId
    output:
      schema: *id004
    auth:
      mode: control
      roles:
      - platform_admin
      - platform-operator
    tenancy:
      mode: none
