          get: { operation: getTenantInvitation }
          collectionActions: [createTenantInvitation]
          recordActions: [resendTenantInvitation, revokeTenantInvitation]
      TenantCredential:
        title: { en: Credentials, nl: Credentials }
        route: /tenants/:slug/members/:memberId/credentials
