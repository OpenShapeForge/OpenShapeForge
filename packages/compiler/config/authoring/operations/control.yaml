        route: /tenants
        recordRoute: /tenants/:slug
        idField: slug
        displayField: name
        fields: [id, name, slug, status, tenantKind, relationId, relationLabel, keycloakOrganizationId, organizationAlias, installedEntries, overriddenEntries, updatesAvailable]
        columns: [name, slug, status, tenantKind, organizationAlias, relationLabel]
        operations:
          list: { operation: listTenants, resultField: tenants }
          get: { operation: getTenant }
          collectionActions: [createTenant]
          recordActions: [updateTenant, getBlueprintLibrary, assignBlueprintLibrary, inviteFirstTenantAdmin]
        related:
          - { entity: TenantMember, label: { en: Members, nl: Leden }, route: /tenants/:slug/members }
          - { entity: TenantInvitation, label: { en: Invitations, nl: Uitnodigingen }, route: /tenants/:slug/invitations }
