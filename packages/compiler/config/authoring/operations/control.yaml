                service:
                  en: Service
                  nl: Service
                adapter:
                  en: Adapter
                  nl: Adapter
                capability:
                  en: Capability
                  nl: Capability
          key: &id016
            type: string
            pattern: ^[a-z][a-z0-9-]*$
