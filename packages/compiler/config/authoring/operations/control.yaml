        title: { en: Members, nl: Leden }
        route: /tenants/:slug/members
        recordRoute: /tenants/:slug/members/:memberId
        idField: memberId
        displayField: email
        fields: [tenantSlug, memberId, username, email, firstName, lastName, enabled, emailVerified, roles, credentialCount, credentialTypes]
        columns: [email, username, enabled, emailVerified, roles, credentialCount]
        operations:
          list: { operation: listTenantMembers, resultField: members }
          get: { operation: getTenantMember }
          recordActions: [assignTenantMemberRoles, removeTenantMemberRoles, removeTenantMembership, requestPasskeyRecovery]
        related:
          - { entity: TenantCredential, label: { en: Credentials, nl: Credentials }, route: /tenants/:slug/members/:memberId/credentials }
