# Personal API keys: credentials a person mints for themselves, which act AS
# that person with the organization roles they hold at the time of each
# request — optionally narrowed, never widened — and which stop working when
# the person's membership is blocked or their account is disabled.
#
# Two audiences, three rights (apps/api/src/auth/api-key/ceiling.ts):
#   - the owner: Platform.ApiKeys.Personal — mint, list and revoke their OWN
#     keys. Nobody mints a key for somebody else; there is no Operation for it.
#   - an administrator: Platform.ApiKeys.PersonalRead to see every person's
#     keys (metadata only, never the secret) and Platform.ApiKeys.PersonalRevoke
#     to withdraw any of them. The owner sees such a key as revoked by an
#     administrator, and the audit trail records who did it.
#
# Every handler calls apps/api/src/auth/api-key/personal-service.ts, which
# applies the ceiling — including the carrier rule that keeps every API key,
# personal or not, off this whole surface.
#
# The integration catalog (api-key-integrations.yaml) is the other kind of
# key: the organization's credential for an external party, backed by a
# service account of its own. Nothing here touches it.
schemaVersion: 1
kind: operationCatalog
plugin: osf-api-keys
operations:
  listMyPersonalKeys:
    id: api-keys.list-my-personal-keys
    name: { en: My API keys, nl: Mijn API-sleutels }
    description:
      en: 'Your own personal API keys: name, status, any role narrowing, expiry and last use. A request made
        with one of them acts as you. Never returns the key itself.'
      nl: 'Je eigen persoonlijke API-sleutels: naam, status, eventuele rolbeperking, vervaldatum en laatste
        gebruik. Een verzoek met een van deze sleutels handelt namens jou. Geeft nooit de sleutel zelf terug.'
    implementation: { type: plugin, plugin: osf-api-keys, handler: listMyPersonalKeys }
    input:
      schema: &listInput
        type: object
        additionalProperties: false
        properties:
          displayName:
            type: string
            maxLength: 200
            x-osf-i18n: { title: { en: Name, nl: Naam } }
          status:
            type: string
            enum: [active, expired, revoked]
            x-osf-i18n:
              title: { en: Status, nl: Status }
              enum: &statusLabels
                active: { en: Active, nl: Actief }
                expired: { en: Expired, nl: Verlopen }
                revoked: { en: Revoked, nl: Ingetrokken }
          sortField:
            type: string
            enum: [displayName, status, createdAt, expiresAt, lastUsedAt]
            default: createdAt
            x-osf-i18n:
              title: { en: Sort field, nl: Sorteerveld }
              enum:
                displayName: { en: Name, nl: Naam }
                status: { en: Status, nl: Status }
                createdAt: { en: Created, nl: Aangemaakt }
                expiresAt: { en: Expires, nl: Verloopt }
                lastUsedAt: { en: Last used, nl: Laatst gebruikt }
          sortDirection:
            type: string
            enum: [asc, desc]
            default: desc
            x-osf-i18n:
              title: { en: Sort direction, nl: Sorteerrichting }
              enum:
                asc: { en: Ascending, nl: Oplopend }
                desc: { en: Descending, nl: Aflopend }
          first:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
            x-osf-i18n: { title: { en: Page size, nl: Paginagrootte } }
          after:
            type: string
            maxLength: 256
            x-osf-i18n: { title: { en: Cursor, nl: Cursor } }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [keys, totalCount, nextCursor]
        properties:
          keys:
            type: array
            items: &personalKey
              type: object
              additionalProperties: false
              x-osf-i18n: { title: { en: API key, nl: API-sleutel } }
              required: [id, displayName, status, ownerUserId, ownerName, roleSubset, allowedIps, createdAt, expiresAt, revokedAt, revokedByAdministrator, lastUsedAt]
              properties:
                id:
                  type: string
                  format: uuid
                  x-osf-i18n: { title: { en: Key, nl: Sleutel } }
                displayName:
                  type: string
                  x-osf-i18n: { title: { en: Name, nl: Naam } }
                status:
                  type: string
                  enum: [active, expired, revoked]
                  x-osf-i18n:
                    title: { en: Status, nl: Status }
                    enum: *statusLabels
                ownerUserId:
                  type: string
                  format: uuid
                  x-osf-i18n: { title: { en: Owner id, nl: Eigenaar-id } }
                ownerName:
                  type: [string, 'null']
                  x-osf-i18n: { title: { en: Owner, nl: Eigenaar } }
                roleSubset:
                  type: [array, 'null']
                  items: { type: string }
                  description: The roles the key is narrowed to. Null means everything its owner holds at the time of each request.
                  x-osf-i18n: { title: { en: Role narrowing, nl: Rolbeperking } }
                allowedIps:
                  type: array
                  items: { type: string }
                  description: Network allowlist of IP addresses and CIDR ranges. Empty means any address.
                  x-osf-i18n: { title: { en: Allowed IP addresses, nl: Toegestane IP-adressen } }
                createdAt:
                  type: string
                  format: date-time
                  x-osf-i18n: { title: { en: Created, nl: Aangemaakt } }
                expiresAt:
                  type: string
                  format: date-time
                  x-osf-i18n: { title: { en: Expires, nl: Verloopt } }
                revokedAt:
                  type: [string, 'null']
                  format: date-time
                  x-osf-i18n: { title: { en: Revoked, nl: Ingetrokken } }
                revokedByAdministrator:
                  type: boolean
                  description: True when somebody other than the owner revoked the key.
                  x-osf-i18n: { title: { en: Revoked by an administrator, nl: Ingetrokken door een beheerder } }
                lastUsedAt:
                  type: [string, 'null']
                  format: date-time
                  x-osf-i18n: { title: { en: Last used, nl: Laatst gebruikt } }
            x-osf-i18n: { title: { en: API keys, nl: API-sleutels } }
          totalCount:
            type: integer
            minimum: 0
            x-osf-i18n: { title: { en: Total, nl: Totaal } }
          nextCursor:
            type: [string, 'null']
            x-osf-i18n: { title: { en: Next cursor, nl: Volgende cursor } }
    auth: &ownAuth { mode: session, roles: [Platform.ApiKeys.Personal] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors: &errors
      - { status: 400, code: VALIDATION, description: The input does not describe a valid request. }
      - { status: 401, code: UNAUTHENTICATED, description: An authenticated tenant session is required. }
      - { status: 403, code: FORBIDDEN, description: 'The session may not do this: it lacks the right, named a role the caller does not hold, or is itself an API key.' }
      - { status: 404, code: NOT_FOUND, description: 'The key does not exist in this organization, or is not one this session may see.' }
      - { status: 503, code: NOT_CONFIGURED, description: This deployment has no database for API keys. }
  getMyPersonalKey:
    id: api-keys.get-my-personal-key
    name: { en: View my API key, nl: Mijn API-sleutel bekijken }
    description:
      en: One of your own personal API keys. Another person's key is reported as not found.
      nl: Een van je eigen persoonlijke API-sleutels. De sleutel van iemand anders wordt als niet gevonden gemeld.
    implementation: { type: plugin, plugin: osf-api-keys, handler: getMyPersonalKey }
    input:
      schema: &idInput
        type: object
        additionalProperties: false
        required: [id]
        properties:
          id:
            type: string
            format: uuid
            x-osf-i18n: { title: { en: Key, nl: Sleutel } }
    output: { schema: *personalKey }
    auth: *ownAuth
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors: *errors
  createMyPersonalKey:
    id: api-keys.create-my-personal-key
    name: { en: Create an API key, nl: API-sleutel aanmaken }
    description:
      en: Create a personal API key that acts as you, with the roles you hold at the time of each request. Copy
        the key when it appears; you cannot view it again later. It stops working when it expires, when you
        revoke it, when an administrator revokes it, or when your access to this organization ends.
        For implementation, read the MCP resource skill://osf/implementing-api-keys/SKILL.md.
      nl: Maak een persoonlijke API-sleutel die namens jou handelt, met de rollen die je op het moment van elk
        verzoek hebt. Kopieer de sleutel zodra hij verschijnt; je kunt hem later niet opnieuw bekijken. Hij werkt
        niet meer zodra hij verloopt, als jij of een beheerder hem intrekt, of als je toegang tot deze organisatie
        eindigt.
        Lees voor de implementatie de MCP-resource skill://osf/implementing-api-keys/SKILL.md.
    implementation: { type: plugin, plugin: osf-api-keys, handler: createMyPersonalKey }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [displayName]
        properties:
          displayName:
            type: string
            minLength: 1
            maxLength: 200
            description: What you will recognise the key by, such as the script or tool that uses it.
            x-osf-i18n: { title: { en: Name, nl: Naam } }
          expiresInDays:
            type: integer
            minimum: 1
            maximum: 90
            description: 'Omit for 30 days. A personal key lives at most 90 days; mint a new one when it runs out.'
            x-osf-i18n: { title: { en: Lifetime in days, nl: Looptijd in dagen } }
          roleSubset:
            type: array
            minItems: 1
            uniqueItems: true
            items: { type: string, minLength: 1 }
            description: Narrows the key to these of your roles. Omit for everything you hold at the time of each request. Every role named must be one you hold now.
            x-osf-i18n:
              title: { en: Role narrowing, nl: Rolbeperking }
              description:
                en: Leave empty to let the key do everything you can do.
                nl: Laat leeg om de sleutel alles te laten doen wat jij kunt.
          allowedIps:
            type: array
            maxItems: 20
            uniqueItems: true
            items: { type: string, minLength: 2, maxLength: 64 }
            description: 'Optional network allowlist: IP addresses or CIDR ranges (IPv4 or IPv6), at most 20. The key is
              refused with 403 from any other address. A personal key is never usable from a web browser.'
            x-osf-i18n:
              title: { en: Allowed IP addresses, nl: Toegestane IP-adressen }
              description:
                en: Optional. Only these IP addresses or ranges (such as 203.0.113.7 or 203.0.113.0/24) may use the key.
                nl: Optioneel. Alleen deze IP-adressen of reeksen (zoals 203.0.113.7 of 203.0.113.0/24) mogen de sleutel gebruiken.
    output:
      schema:
        type: object
        additionalProperties: false
        required: [key, credential]
        properties:
          key: *personalKey
          credential:
            type: object
            additionalProperties: false
            required: [id, secret, expiresAt]
            description: 'CONFIDENTIAL. `secret` is a live credential that acts as you, returned here and nowhere
              else, exactly once. Never store, log, cache or echo it.'
            properties:
              id:
                type: string
                format: uuid
                x-osf-i18n: { title: { en: Key, nl: Sleutel } }
              secret:
                type: string
                description: The key itself, returned exactly once and never recoverable. Treat as a password.
                x-osf-i18n:
                  title: { en: API key, nl: API-sleutel }
                  description:
                    en: Copy this key now. You cannot view it again after closing.
                    nl: Kopieer deze sleutel nu. Na het sluiten kun je hem niet opnieuw bekijken.
                x-osf-classification: { sensitivity: confidential }
                x-osf-presentation: { component: FieldSecret }
              expiresAt:
                type: string
                format: date-time
                x-osf-i18n: { title: { en: Expires, nl: Verloopt } }
            x-osf-i18n: { title: { en: New API key, nl: Nieuwe API-sleutel } }
    auth: { mode: session, roles: [Platform.ApiKeys.Personal, Platform.ApiKeys.PersonalCreate] }
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: acknowledgement }
    errors: *errors
  revokeMyPersonalKey:
    id: api-keys.revoke-my-personal-key
    name: { en: Revoke, nl: Intrekken }
    description:
      en: Revokes one of your own personal API keys so it authenticates nothing from the next request on.
        Idempotent; the key stays listed as revoked.
      nl: Trekt een van je eigen persoonlijke API-sleutels in, zodat hij vanaf het volgende verzoek niets meer
        authenticeert. Idempotent; de sleutel blijft als ingetrokken in de lijst staan.
    implementation: { type: plugin, plugin: osf-api-keys, handler: revokeMyPersonalKey }
    input: { schema: *idInput }
    output: { schema: *personalKey }
    auth: *ownAuth
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: acknowledgement }
    errors: *errors
  listPersonalKeys:
    id: api-keys.list-personal-keys
    name: { en: Personal API keys, nl: Persoonlijke API-sleutels }
    description:
      en: 'Every person''s personal API keys in this organization, for an administrator: owner, name, status,
        narrowing, expiry and last use. Never returns a key itself.'
      nl: 'De persoonlijke API-sleutels van iedereen in deze organisatie, voor een beheerder: eigenaar, naam,
        status, rolbeperking, vervaldatum en laatste gebruik. Geeft nooit een sleutel zelf terug.'
    implementation: { type: plugin, plugin: osf-api-keys, handler: listPersonalKeys }
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          ownerUserId:
            type: string
            format: uuid
            x-osf-i18n: { title: { en: Owner id, nl: Eigenaar-id } }
          displayName: { type: string, maxLength: 200, x-osf-i18n: { title: { en: Name, nl: Naam } } }
          status:
            type: string
            enum: [active, expired, revoked]
            x-osf-i18n:
              title: { en: Status, nl: Status }
              enum: *statusLabels
          sortField:
            type: string
            enum: [displayName, status, createdAt, expiresAt, lastUsedAt]
            default: createdAt
            x-osf-i18n:
              title: { en: Sort field, nl: Sorteerveld }
              enum:
                displayName: { en: Name, nl: Naam }
                status: { en: Status, nl: Status }
                createdAt: { en: Created, nl: Aangemaakt }
                expiresAt: { en: Expires, nl: Verloopt }
                lastUsedAt: { en: Last used, nl: Laatst gebruikt }
          sortDirection:
            type: string
            enum: [asc, desc]
            default: desc
            x-osf-i18n:
              title: { en: Sort direction, nl: Sorteerrichting }
              enum:
                asc: { en: Ascending, nl: Oplopend }
                desc: { en: Descending, nl: Aflopend }
          first: { type: integer, minimum: 1, maximum: 100, default: 25, x-osf-i18n: { title: { en: Page size, nl: Paginagrootte } } }
          after: { type: string, maxLength: 256, x-osf-i18n: { title: { en: Cursor, nl: Cursor } } }
    output:
      schema:
        type: object
        additionalProperties: false
        required: [keys, totalCount, nextCursor]
        properties:
          keys:
            type: array
            items: *personalKey
            x-osf-i18n: { title: { en: API keys, nl: API-sleutels } }
          totalCount: { type: integer, minimum: 0, x-osf-i18n: { title: { en: Total, nl: Totaal } } }
          nextCursor: { type: [string, 'null'], x-osf-i18n: { title: { en: Next cursor, nl: Volgende cursor } } }
    auth: { mode: session, roles: [Platform.ApiKeys.PersonalRead] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors: *errors
  getPersonalKey:
    id: api-keys.get-personal-key
    name: { en: View personal API key, nl: Persoonlijke API-sleutel bekijken }
    description:
      en: Any person's personal API key in this organization, for an administrator. Metadata only.
      nl: De persoonlijke API-sleutel van iemand in deze organisatie, voor een beheerder. Alleen metadata.
    implementation: { type: plugin, plugin: osf-api-keys, handler: getPersonalKey }
    input: { schema: *idInput }
    output: { schema: *personalKey }
    auth: { mode: session, roles: [Platform.ApiKeys.PersonalRead] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors: *errors
  revokePersonalKey:
    id: api-keys.revoke-personal-key
    name: { en: Revoke, nl: Intrekken }
    description:
      en: Revokes any person's personal API key in this organization, as an administrator, so it authenticates
        nothing from the next request on. The owner sees it as revoked by an administrator, and the audit
        trail records who revoked it.
      nl: Trekt de persoonlijke API-sleutel van iemand in deze organisatie in, als beheerder, zodat hij vanaf
        het volgende verzoek niets meer authenticeert. De eigenaar ziet dat een beheerder hem heeft ingetrokken,
        en het auditlog legt vast wie dat deed.
    implementation: { type: plugin, plugin: osf-api-keys, handler: revokePersonalKey }
    input: { schema: *idInput }
    output: { schema: *personalKey }
    auth: { mode: session, roles: [Platform.ApiKeys.PersonalRevoke] }
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: acknowledgement }
    errors: *errors
interfaces:
  mcp: {}
  rest:
    operations:
      listMyPersonalKeys: { method: POST, path: /api/personal-api-keys/mine/list, response: { status: 200, kind: json } }
      getMyPersonalKey: { method: POST, path: /api/personal-api-keys/mine/get, response: { status: 200, kind: json } }
      createMyPersonalKey: { method: POST, path: /api/personal-api-keys/mine/create, response: { status: 200, kind: json } }
      revokeMyPersonalKey: { method: POST, path: /api/personal-api-keys/mine/revoke, response: { status: 200, kind: json } }
      listPersonalKeys: { method: POST, path: /api/personal-api-keys/list, response: { status: 200, kind: json } }
      getPersonalKey: { method: POST, path: /api/personal-api-keys/get, response: { status: 200, kind: json } }
      revokePersonalKey: { method: POST, path: /api/personal-api-keys/revoke, response: { status: 200, kind: json } }
  web:
    entities:
      MyPersonalApiKey:
        title: { en: My API keys, nl: Mijn API-sleutels }
        route: /my-api-keys
        recordRoute: /my-api-keys/:id
        idField: id
        displayField: displayName
        fields: [displayName, status, roleSubset, allowedIps, createdAt, expiresAt, lastUsedAt, revokedAt, revokedByAdministrator, id]
        columns: [displayName, status, expiresAt, lastUsedAt]
        operations:
          list: { operation: listMyPersonalKeys, resultField: keys }
          get: { operation: getMyPersonalKey, bindings: { id: id } }
          create: { operation: createMyPersonalKey }
          recordActions:
            - operation: revokeMyPersonalKey
              visibleWhen: { conditions: [{ field: status, operator: eq, value: active }] }
      PersonalApiKey:
        title: { en: Personal API keys, nl: Persoonlijke API-sleutels }
        route: /personal-api-keys
        recordRoute: /personal-api-keys/:id
        idField: id
        displayField: displayName
        fields: [displayName, ownerName, status, roleSubset, allowedIps, createdAt, expiresAt, lastUsedAt, revokedAt, revokedByAdministrator, ownerUserId, id]
        columns: [ownerName, displayName, status, expiresAt, lastUsedAt]
        operations:
          list: { operation: listPersonalKeys, resultField: keys }
          get: { operation: getPersonalKey, bindings: { id: id } }
          recordActions:
            - operation: revokePersonalKey
              visibleWhen: { conditions: [{ field: status, operator: eq, value: active }] }
