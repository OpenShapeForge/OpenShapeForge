version: 1
description: "Greenfield platform schema foundation for apps/api."

# Cross-module references the base platform schema is allowed to make. The
# targets are authoring entities (erp.*) that active-manifest.ts promotes into
# the merged manifest AFTER this file is loaded, so the loader accepts each
# reference on the strength of its entry here and generateArtifacts checks
# that the merged manifest really declares the target.
relationshipRegister:
  - from: { schema: platform, table: tenants, column: relation_id }
    to: { schema: erp, table: relations, column: id }
  - from: { schema: platform, table: identity_relations, column: relation_id }
    to: { schema: erp, table: relations, column: id }
  - from: { schema: platform, table: identity_relations, column: candidate_relation_id }
    to: { schema: erp, table: relations, column: id }

tables:
  - schema: platform
    name: schema_migrations
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: version, type: text, primaryKey: true }
      - { name: checksum, type: text, required: true }
      - { name: applied_at, type: timestamptz, required: true, default: now() }
      - { name: applied_by, type: text }

  # ---------------------------------------------------------------------------
  # Tenants
  #
  # The registry of the tenants themselves. `tenant_id` is load-bearing across
  # every layer — the `tid` JWT claim, the `app.tenant_id` session GUC that
  # `app.current_tenant()` reads, and a column on every tenantScoped table in
  # this file — and until this table existed nothing actually DEFINED one.
  #
  # tenantScoped:false is not an oversight: the row IS the tenant, so there is
  # no enclosing tenant to isolate it to. That is also why this lives here and
  # not as an authored core entity — backend-manifest.ts derives tenantScoped
  # from the mere presence of an `authorization:` block, so an authored Tenant
  # would either be handed a tenant_id column plus tenant-isolation RLS
  # (meaningless on this table) or forfeit role-based authorization entirely.
  #
  # domainInternal + generatedCrud:false follow from the same fact: a tenant
  # registry is cross-tenant by nature and must never surface on the per-tenant
  # GraphQL/REST schema, where every other row is fenced by a tenant predicate
  # this table has no way to satisfy. The control plane reaches it directly.
  #
  # tenantScoped:false would normally mean "no RLS policy at all", which is
  # right for the global configuration catalogs below and WRONG here: the
  # restricted runtime role holds blanket DML on every table in a
  # manifest-covered schema (db/migrations/app-role.ts), so a policyless
  # cross-tenant registry is fully readable from any raw-SQL path an ordinary
  # tenant session can reach. `tenantIdentityColumn` says that this table's
  # primary key IS a tenant id, and the emitter turns that into a policy where
  # a tenant session reads only its own row and writes nothing — every mutation
  # goes through the audited `withSystemSession` bypass instead.
  - schema: platform
    name: tenants
    tenantScoped: false
    tenantIdentityColumn: id
    domainInternal: true
    generatedCrud: false
    columns:
      # The RLS key: this uuid is what the `tid` claim carries, what
      # applyDbSession puts in app.tenant_id, and therefore what every
      # `tenant_id = app.current_tenant()` policy compares against.
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      # The human- and Keycloak-facing key: the Organization alias and the URL
      # segment. Deliberately NOT the RLS key — app.current_tenant() returns
      # uuid and casts the session var `::uuid` (db/migrations/app-helpers.ts),
      # and backend-manifest.ts force-overrides any tenant_id column to uuid,
      # so a text key could not survive the round trip even if we wanted it to.
      # Treat as immutable after creation: it is mirrored into Keycloak, where
      # an Organization's alias cannot be rebound in place.
      - { name: slug, type: text, required: true }
      - { name: name, type: text, required: true }
      # Values come from the TENANTSTATUS codetable — active/inactive/suspended,
      # defined in config/authoring/catalogs/core-referentiedata.yaml. Held as
      # text rather than a Postgres enum so adding a lifecycle state stays a
      # catalog edit instead of a migration.
      - { name: status, type: text, required: true }
      # The Keycloak Organization this tenant maps to, and the realm it lives
      # in. Both nullable: the row is created before Keycloak is provisioned and
      # the link is stamped once the SPI reports the Organization back, so a
      # half-provisioned tenant is representable rather than un-insertable.
      - { name: keycloak_organization_id, type: text }
      - { name: keycloak_realm, type: text }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: updated_at, type: timestamptz, required: true, default: now() }
      # The tenant's own organization Relation (auth/organization-relation.ts),
      # so an assistant can read `Relation.businessContext` for "what does this
      # company do" without a human pasting a description into a prompt. The
      # target is an authoring entity promoted into the manifest after this
      # file; the relationshipRegister entry at the top is what admits the
      # reference. Unlike every other mutable column here it is a tenant's own
      # self-service link, not a control-plane fact, so
      # db/migrations/organization-relation-link.ts adds the permissive UPDATE
      # policy the generated registry policy (WITH CHECK app.bypass_rls() only)
      # would otherwise refuse.
      - { name: relation_id, type: uuid, references: { schema: erp, table: relations, column: id, onDelete: SET NULL } }
    indexes:
      - name: tenants_slug_uidx
        columns: [slug]
        unique: true
      # Partial, because the link is null until provisioning completes. Postgres
      # already treats NULLs as distinct, so the predicate is not what keeps
      # several unprovisioned tenants legal — it states that intent explicitly
      # and keeps the index to the rows that actually carry a link.
      - name: tenants_keycloak_organization_uidx
        columns: [keycloak_organization_id]
        unique: true
        where: '"keycloak_organization_id" IS NOT NULL'

  # Global, tenant-agnostic page-config catalog for the generated web CRUD
  # pages. Compiler-generated platform config, identical for every tenant — NOT
  # tenant data, so tenantScoped:false (no tenant_id, no RLS), and
  # domainInternal so no generated CRUD/GraphQL surface is emitted for it. It is
  # read through the hand-written `entityPageConfigs` query in
  # `apps/api/src/graphql/schema.ts`.
  #
  # One row per (entity_slug, config_kind). `id` is "<entity_slug>:<config_kind>"
  # so the seeder can upsert on a single-column primary key, mirroring
  # entity_trigger_registry. `checksum` is the sha256 the compiler computes over
  # the whole serialized row set, so the seeder can skip a run whose input has
  # not changed.
  #
  # Rows exist only when the repo has an `apps/web`: the seed is emitted by the
  # web-gated UI generator. Without one the table stays empty and nothing reads
  # it.
  - schema: platform
    name: entity_page_configs
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: text, primaryKey: true }
      - { name: entity_slug, type: text, required: true }
      # 'list' | 'detail' | 'workspace' | 'create_form' | 'edit_form'
      - { name: config_kind, type: text, required: true }
      - { name: configs, type: jsonb, required: true, default: "'{}'::jsonb" }
      - { name: checksum, type: text, required: true }
    indexes:
      - name: entity_page_configs_slug_kind_uidx
        columns: [entity_slug, config_kind]
        unique: true
      - name: entity_page_configs_slug_idx
        columns: [entity_slug]

  - schema: platform
    name: entity_events
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    # A workflow collection-wait is satisfied by events, so the sweep that
    # resolves waits reads this table inside each wait's own tenant. workerDml
    # (a grant) and not workerAccess (a policy widening): the sweep never reads
    # it across tenants, and the tenant predicate stays the boundary.
    workerDml: true
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: aggregate_type, type: text, required: true }
      - { name: aggregate_id, type: text, required: true }
      - { name: event_type, type: text, required: true }
      - { name: payload, type: jsonb, required: true, default: "'{}'::jsonb" }
      - { name: sequence, type: bigint, required: true, generated: identity }
      # Assigned by the stream projector only after the writer has committed.
      - { name: delivery_sequence, type: bigint }
      - { name: occurred_at, type: timestamptz, required: true, default: now() }
    indexes:
      - name: entity_events_tenant_sequence_idx
        columns: [tenant_id, sequence]
      - name: entity_events_tenant_delivery_idx
        columns: [tenant_id, delivery_sequence]
        unique: true
      - name: entity_events_pending_delivery_idx
        columns: [tenant_id, occurred_at, sequence]
        where: delivery_sequence IS NULL
      - name: entity_events_tenant_aggregate_sequence_idx
        columns: [tenant_id, aggregate_type, aggregate_id, sequence]

  # Central, interface-neutral edit leases for long-running human write modes.
  # A lease is record-wide: one actor editing a Relation blocks every other
  # lease-requiring operation on that same Relation until release or expiry.
  # Only a SHA-256 token hash is stored; the opaque token itself is returned
  # once to the caller and must be presented by the protected mutation.
  - schema: platform
    name: entity_edit_leases
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: entity_id, type: text, required: true }
      - { name: target_id, type: text, required: true }
      - { name: operation_id, type: text, required: true }
      - { name: owner_user_id, type: uuid, required: true }
      - { name: owner_display_name, type: text }
      - { name: token_hash, type: text, required: true }
      - { name: acquired_version, type: text, required: true }
      - { name: inactivity_timeout_seconds, type: integer, required: true }
      - { name: acquired_at, type: timestamptz, required: true, default: now() }
      - { name: last_activity_at, type: timestamptz, required: true, default: now() }
      - { name: expires_at, type: timestamptz, required: true }
    indexes:
      - name: entity_edit_leases_target_uidx
        columns: [tenant_id, entity_id, target_id]
        unique: true
      - name: entity_edit_leases_token_uidx
        columns: [token_hash]
        unique: true
      - name: entity_edit_leases_expiry_idx
        columns: [tenant_id, expires_at]

  # Server-issued confirmation challenges for destructive entity Operations.
  # The challenge and expected typed value are hashed at rest. Consumed rows
  # remain briefly useful for deterministic ALREADY_USED responses and audit;
  # a later housekeeping policy may remove expired history.
  - schema: platform
    name: operation_confirmation_challenges
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: operation_id, type: text, required: true }
      - { name: entity_id, type: text, required: true }
      - { name: target_id, type: text, required: true }
      - { name: target_version, type: text, required: true }
      - { name: owner_user_id, type: uuid, required: true }
      - { name: token_hash, type: text, required: true }
      - { name: expected_answer_hash, type: text, required: true }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: expires_at, type: timestamptz, required: true }
      - { name: consumed_at, type: timestamptz }
    indexes:
      - name: operation_confirmation_challenges_token_uidx
        columns: [token_hash]
        unique: true
      - name: operation_confirmation_challenges_target_idx
        columns: [tenant_id, entity_id, target_id, operation_id]

  # Org-unit hierarchy for group-predicated RLS (authorization.rowAccess.group).
  # Both tables are tenantScoped (get {table}_tenant_isolation automatically) and
  # carry NO rowScope — they are the resolution substrate a user must be able to
  # read within its own tenant to expand its groups at session setup. Tenant
  # isolation is the correct and sufficient boundary.
  - schema: platform
    name: org_unit
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      # Nullable → roots. Self-referential FK to platform.org_unit(id); RESTRICT
      # so a parent cannot be deleted while children reference it (the closure
      # trigger relies on reparent/remove-first — see
      # apps/api/src/db/migrations/core-invariants.ts).
      - { name: parent_id, type: uuid, references: { schema: platform, table: org_unit, column: id, onDelete: RESTRICT } }
      - { name: name, type: text, required: true }
      # This unit's segment of the Keycloak Organization path: the SPI's
      # `organizationPath` (packages/keycloak-spi/.../OpenShapeForgeResource.java)
      # is the root-to-leaf join of these, and the SPI holds it unique within a
      # root organization. Distinct from `name`, which is a display label and
      # free to change; the segment is part of an identifier.
      - { name: slug, type: text }
      # The child Keycloak Organization mirroring this unit, stamped once the
      # SPI has created it. Both columns are nullable: units exist before the
      # Keycloak side is provisioned, and every org_unit row predating the
      # control plane has neither.
      - { name: keycloak_organization_id, type: text }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: updated_at, type: timestamptz, required: true, default: now() }
    indexes:
      - name: org_unit_tenant_parent_idx
        columns: [tenant_id, parent_id]
      # The provisioning path's idempotency key: a sub-org is identified by its
      # slug within its parent, which is also what makes the SPI's
      # `organizationPath` (the root-to-leaf slug chain) unique. Two partial
      # indexes rather than one, because Postgres treats NULLs as DISTINCT in a
      # unique index: a single index on (tenant_id, parent_id, slug) would not
      # constrain the top-level units at all, which are exactly the ones whose
      # parent_id is NULL. Both exclude slug IS NULL — org_unit rows predating
      # the control plane have no slug and are not part of this key space.
      - name: org_unit_tenant_parent_slug_uidx
        columns: [tenant_id, parent_id, slug]
        unique: true
        where: '"slug" IS NOT NULL AND "parent_id" IS NOT NULL'
      - name: org_unit_tenant_root_slug_uidx
        columns: [tenant_id, slug]
        unique: true
        where: '"slug" IS NOT NULL AND "parent_id" IS NULL'
      # Mirrors tenants_keycloak_organization_uidx: one child Organization is
      # mirrored by exactly one org_unit. Realm-global rather than per-tenant
      # because a Keycloak organization id is a realm-wide uuid, so two tenants
      # claiming the same one is drift however it arose.
      - name: org_unit_keycloak_organization_uidx
        columns: [keycloak_organization_id]
        unique: true
        where: '"keycloak_organization_id" IS NOT NULL'

  # Transitive-closure table maintained by the org_unit trigger (a core
  # invariant, apps/api/src/db/migrations/core-invariants.ts). Self-row (u,u,0)
  # per unit; (a,d,k) for every ancestor a of d at
  # distance k. descendants(x) = SELECT descendant_id WHERE ancestor_id = x;
  # ancestors(x) = SELECT ancestor_id WHERE descendant_id = x.
  - schema: platform
    name: org_unit_closure
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    # Every tenant-scoped session expands its groups through this table in
    # applyDbSession, before any policy applies — a worker's included. Without
    # the grant a worker's own tenant-scoped session fails at setup rather than
    # at the statement that needed it.
    workerDml: true
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: ancestor_id, type: uuid, required: true }
      - { name: descendant_id, type: uuid, required: true }
      - { name: depth, type: integer, required: true }
    indexes:
      - name: org_unit_closure_ancestor_idx
        columns: [tenant_id, ancestor_id]
      - name: org_unit_closure_descendant_idx
        columns: [tenant_id, descendant_id]
      - name: org_unit_closure_edge_uk
        columns: [tenant_id, ancestor_id, descendant_id]
        unique: true

  # ---------------------------------------------------------------------------
  # Connectors
  #
  # A connector's CONTRACT is compiled (apps/api/src/generated/connectors/
  # catalog.json); these tables hold the per-tenant state the contract cannot:
  # which tenants installed what, with which configuration, and which
  # entitlements they hold.
  #
  # All three are tenantScoped (so they get {table}_tenant_isolation) and
  # domainInternal (so no generated CRUD/GraphQL surface is emitted). That
  # combination is deliberate and mirrors the tenant-setting precedent: these
  # rows reference secrets and entitlement state, and must only ever be reached
  # through the connector configuration API, never through generic CRUD.
  # ---------------------------------------------------------------------------

  # One row per configured connector instance. `instance_key` allows a tenant to
  # configure the same connector more than once (two buckets, two mail domains)
  # when the contract declares `configuration.instances: multiple`; contracts
  # declaring `single` are held to one row by the API, not by the schema.
  #
  # contract_version + contract_checksum record what the installation was
  # configured AGAINST. A compiled contract that no longer matches means the
  # stored config may be invalid — a newly required field, a narrowed
  # validation, a removed operation — and the installation needs repair rather
  # than a surprise failure at call time.
  - schema: platform
    name: connector_installations
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: connector_slug, type: text, required: true }
      # Written in the cast form Postgres reports back ('default'::text) to
      # match the rest of the tree; a bare 'default' compiles and compares
      # identically — the drift comparator normalizes a redundant cast on a
      # quoted literal away before comparing (see docs/migrations.md).
      - { name: instance_key, type: text, required: true, default: "'default'::text" }
      - { name: display_name, type: text }
      # Non-secret configuration values only. Secret-marked fields live in
      # connector_secrets, encrypted; they are never written here.
      - { name: config, type: jsonb, required: true, default: "'{}'::jsonb" }
      - { name: enabled, type: boolean, required: true, default: "false" }
      - { name: contract_version, type: integer, required: true }
      - { name: contract_checksum, type: text, required: true }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: updated_at, type: timestamptz, required: true, default: now() }
    indexes:
      - name: connector_installations_tenant_slug_instance_uidx
        columns: [tenant_id, connector_slug, instance_key]
        unique: true
      - name: connector_installations_tenant_slug_idx
        columns: [tenant_id, connector_slug]

  # One row per (installation, secret field). Separate from the installation row
  # so a single secret can be rotated, re-encrypted under a new key, or audited
  # without rewriting the whole configuration — and so no read path that selects
  # an installation can accidentally select ciphertext with it.
  #
  # key_id names the encryption key so a rotation can re-encrypt row by row
  # while both keys are live.
  - schema: platform
    name: connector_secrets
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: installation_id, type: uuid, required: true, references: { schema: platform, table: connector_installations, column: id, onDelete: CASCADE } }
      - { name: field_key, type: text, required: true }
      - { name: ciphertext, type: text, required: true }
      - { name: key_id, type: text, required: true }
      - { name: algorithm, type: text, required: true }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: updated_at, type: timestamptz, required: true, default: now() }
    indexes:
      - name: connector_secrets_installation_field_uidx
        columns: [tenant_id, installation_id, field_key]
        unique: true

  # ---------------------------------------------------------------------------
  # API keys — customer-provisioned credentials for external parties
  #
  # A customer hands an external party (an integrator, a contractor, a data
  # supplier) one opaque string. That string is NOT a role container: it names
  # an INTEGRATION, whose Keycloak serviceAccount client is the identity the
  # roles actually hang off. A key may narrow those roles, never widen them.
  # ---------------------------------------------------------------------------

  # One row per external party. `keycloak_client_id` is the serviceAccount
  # client provisioned for it; the client secret is encrypted with the same
  # AES-256-GCM keyring the connector secrets use, so the customer never holds
  # it and only the API can exchange it for a token.
  #
  # tenantScoped + domainInternal, matching the connector tables: every
  # management read and write is gated by {table}_tenant_isolation, and no
  # generated CRUD surface is emitted for it.
  #
  # `status` records a cross-system write that has no shared transaction:
  # 'pending' is written BEFORE the realm mutation, so a crash leaves a row the
  # reconciler can finish or sweep rather than a live key pointing at a client
  # that does not exist.
  - schema: platform
    name: api_key_integrations
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: display_name, type: text, required: true }
      - { name: keycloak_client_id, type: text, required: true }
      # 'pending' | 'active' | 'disabled'
      - { name: status, type: text, required: true, default: "'pending'::text" }
      # Null until the realm mutation completes and the secret comes back.
      - { name: client_secret_ciphertext, type: text }
      - { name: client_secret_key_id, type: text }
      - { name: client_secret_algorithm, type: text }
      # The roles requested for this integration's service account, as the
      # provisioning caller authorized them. Kept so the reconciler can rebuild
      # the realm client after a realm reset without re-asking the customer.
      - { name: granted_roles, type: jsonb, required: true, default: "'[]'::jsonb" }
      # Scope the provisioned service account is intended to operate at. Nothing
      # reads it until row scoping ships; recorded now so that decision has
      # somewhere to land instead of silently defaulting to "self".
      - { name: intended_scope, type: text, required: true, default: "'tenant'::text" }
      - { name: created_by, type: uuid, required: true }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: updated_at, type: timestamptz, required: true, default: now() }
    indexes:
      - name: api_key_integrations_tenant_client_uidx
        columns: [tenant_id, keycloak_client_id]
        unique: true
      - name: api_key_integrations_tenant_status_idx
        columns: [tenant_id, status]

  # One row per credential. N keys per integration, which is what makes rotation
  # an INSERT now and a DELETE after the grace window — a Keycloak client holds
  # exactly one secret, so key material lives here and not there.
  #
  # tenantScoped: FALSE, deliberately, and this is the only table in this file
  # that carries a tenant_id without an RLS policy over it. The authentication
  # path resolves a credential BEFORE any tenant is known — `tenant_id` here is
  # an OUTPUT of authentication, not an input to it, and `withDbSession`
  # (correctly) refuses to open a session without a tenant and a user. The same
  # reasoning makes platform.system_bypass_audit non-tenant-scoped.
  #
  # The management surface does not rely on that: every provisioning read joins
  # through platform.api_key_integrations, whose tenant policy gates the whole
  # join, and carries an explicit tenant_id predicate on top. What lives here is
  # only what authentication needs — no display name, no actor, no audit trail
  # beyond use timestamps.
  #
  # `secret_hash` is SHA-256 of the secret half; the plaintext is returned once
  # at creation and never again. `role_subset` NULL means "whatever the
  # integration's service account holds"; non-null intersects with it.
  - schema: platform
    name: api_keys
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: integration_id, type: uuid, required: true, references: { schema: platform, table: api_key_integrations, column: id, onDelete: CASCADE } }
      # The public half of the credential, carried in the token itself and the
      # only column the authentication path searches on.
      - { name: lookup_id, type: text, required: true }
      - { name: secret_hash, type: text, required: true }
      - { name: display_name, type: text, required: true }
      - { name: role_subset, type: jsonb }
      # NULL means no expiry. Provisioning defaults to a finite value; a
      # non-expiring key takes an explicit choice.
      - { name: expires_at, type: timestamptz }
      - { name: revoked_at, type: timestamptz }
      - { name: created_by, type: uuid, required: true }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      # first_used_at finds keys minted and never activated; last_used_at finds
      # keys that have gone quiet and can be retired.
      - { name: first_used_at, type: timestamptz }
      - { name: last_used_at, type: timestamptz }
    indexes:
      - name: api_keys_lookup_uidx
        columns: [lookup_id]
        unique: true
      - name: api_keys_integration_idx
        columns: [integration_id]
      - name: api_keys_tenant_idx
        columns: [tenant_id]

  # Per-tenant entitlement grants. The signed deployment license is the CEILING
  # (what this deployment may offer at all); a row here is the GRANT (what this
  # tenant actually has). Effective availability is the intersection, so neither
  # a forged row nor a shared license can widen what a tenant sees on its own.
  - schema: platform
    name: connector_entitlements
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: entitlement, type: text, required: true }
      - { name: granted_at, type: timestamptz, required: true, default: now() }
      # NULL means no expiry. A past expiry is treated as absent, never as an error.
      - { name: expires_at, type: timestamptz }
    indexes:
      - name: connector_entitlements_tenant_key_uidx
        columns: [tenant_id, entitlement]
        unique: true

  # One row per in-flight OAuth authorization, alive for minutes.
  #
  # The `state` parameter is the ONLY thing binding a provider's callback to the
  # tenant and installation that started the flow — the callback arrives from
  # the user's browser with no session of ours attached, because the redirect
  # comes from the provider. So the row has to carry that binding, and it has to
  # be single-use: without `consumed_at`, a state value that leaked (a Referer
  # header, browser history, a shared screen) could be replayed to attach an
  # attacker's provider account to somebody else's installation.
  #
  # What is stored is a HASH of the state, never the state itself. A read of
  # this table — a backup, a support query, a compromised replica — then yields
  # nothing that can be presented to the callback.
  - schema: platform
    name: connector_oauth_states
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: connector_slug, type: text, required: true }
      - { name: instance_key, type: text, required: true }
      # SHA-256 of the state parameter. Unique, so a duplicate is a collision or
      # a replay rather than a second valid flow.
      - { name: state_hash, type: text, required: true }
      # The PKCE verifier, encrypted under the connector keyring with this row's
      # id as additional authenticated data. PKCE only binds the code to the
      # client that requested it if the verifier stays secret; storing it in the
      # clear would leave the protection on paper.
      - { name: code_verifier_ciphertext, type: text, required: true }
      - { name: code_verifier_key_id, type: text, required: true }
      - { name: code_verifier_algorithm, type: text, required: true }
      # Echoed back to the provider on the exchange. Recorded rather than
      # recomputed, because a redirect_uri that differs by one character between
      # the two calls is refused by the provider with no useful reason.
      - { name: redirect_uri, type: text, required: true }
      # Who started the flow. Not an authorization input — the callback is
      # authorized by the state alone — but the audit trail is worthless
      # without it.
      - { name: created_by, type: uuid }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: expires_at, type: timestamptz, required: true }
      # Stamped on first use. Presence, not absence, is what a replay hits.
      - { name: consumed_at, type: timestamptz }
    indexes:
      - name: connector_oauth_states_hash_uidx
        columns: [state_hash]
        unique: true
      # Drives the expiry sweep, which has to be able to find dead rows without
      # scanning every tenant's history.
      - name: connector_oauth_states_expires_idx
        columns: [expires_at]

  # Short-lived, encrypted continuation state for MCP OAuth and secure-form
  # handoffs. The public token is hashed; the payload is encrypted at rest.
  - schema: platform
    name: mcp_handoffs
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    rowScope:
      userColumns: [user_id]
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: user_id, type: uuid, required: true }
      - { name: kind, type: text, required: true }
      - { name: token_hash, type: text, required: true }
      - { name: payload_ciphertext, type: text, required: true }
      - { name: payload_key_id, type: text, required: true }
      - { name: payload_algorithm, type: text, required: true }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: expires_at, type: timestamptz, required: true }
      - { name: consumed_at, type: timestamptz }
    indexes:
      - name: mcp_handoffs_token_hash_uidx
        columns: [token_hash]
        unique: true
      - name: mcp_handoffs_expires_idx
        columns: [expires_at]

  # Capability grants: the token behind a link that lets someone WITHOUT an
  # account run a fixed set of Operations on one record — accept a document,
  # sign it, answer a request. Only the SHA-256 of the secret half of the
  # token is stored; the `<id>.<secret>` token is returned once by
  # `platform.grants.issue`. Core resolves a presented token into a grant
  # session before an `auth.mode: capability` Operation runs
  # (operations/capability-grants.ts): the row is located by id, the secret
  # is compared in constant time, and expiry, revocation, use count and the
  # attempt lock are checked. A single-use grant is consumed in the handler's
  # transaction, so a failed handler leaves it usable. `recipient` is opaque
  # to core beyond its shape; `operations` holds canonical Operation keys.
  - schema: platform
    name: capability_grants
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true, references: { schema: platform, table: tenants, column: id, onDelete: CASCADE } }
      - { name: token_hash, type: text, required: true }
      - { name: operations, type: "text[]", required: true }
      - { name: subject_entity, type: text, required: true }
      - { name: subject_id, type: uuid, required: true }
      - { name: recipient, type: jsonb, required: true }
      # Records beside the subject the issuer delegated to the recipient:
      # [{ entity, id, intents: [get | update] }], verified against the
      # issuer's own access when the grant was issued.
      - { name: records, type: jsonb, required: true, default: "'[]'::jsonb" }
      - { name: issued_by, type: uuid, required: true }
      - { name: issued_at, type: timestamptz, required: true, default: now() }
      - { name: expires_at, type: timestamptz, required: true }
      # null = reusable until expiry; 1 = single use.
      - { name: max_uses, type: integer }
      - { name: uses, type: integer, required: true, default: "0" }
      - { name: consumed_at, type: timestamptz }
      - { name: revoked_at, type: timestamptz }
      - { name: revoked_reason, type: text }
      - { name: superseded_by, type: uuid }
      # Attempt limiting: failures inside the current window count up; when
      # they reach the limit the grant is locked until locked_until.
      - { name: failed_attempts, type: integer, required: true, default: "0" }
      - { name: window_started_at, type: timestamptz }
      - { name: locked_until, type: timestamptz }
    indexes:
      - name: capability_grants_token_uidx
        columns: [token_hash]
        unique: true
      - name: capability_grants_subject_idx
        columns: [tenant_id, subject_entity, subject_id]
      # Drives the housekeeping purge, which finds dead rows without scanning
      # every tenant's history.
      - name: capability_grants_expires_idx
        columns: [expires_at]

  # ---------------------------------------------------------------------------
  # Runtime bookkeeping
  #
  # The tables below are written by the API runtime rather than authored as
  # entities, and none surfaces on the generated CRUD. They are declared here
  # so this manifest is the ONE source of truth for their shape — a database
  # is created from schema.sql and nothing else — and so drift detection holds
  # them to it like every other table. What the manifest cannot express stays
  # in the migration file named on each table, applied after the generated
  # step as idempotent DDL: check constraints, expression indexes, functions,
  # triggers, SECURITY DEFINER ownership, and every bespoke RLS policy.
  #
  # A table with a bespoke policy is therefore tenantScoped:false EVEN WHEN it
  # carries a tenant_id. tenantScoped:true would emit the generic
  # tenant-isolation policy under the same name the bespoke one uses, and two
  # definitions of one policy would be settled by whichever step ran last; the
  # migration file enables row-level security and owns the policy instead. The
  # tenant fence those policies enforce is the same one every other platform.*
  # row gets — they only narrow the WITH CHECK half.
  #
  # Indexes read newest-first (an audit trail, published notices) are declared
  # ascending: a btree serves `order by ... desc` by a backward scan, so the
  # index needs no direction of its own and the manifest need not express one.
  # ---------------------------------------------------------------------------

  # Audit log for every `withSystemSession` invocation — the break-glass path
  # that runs with app.bypass_rls = true (db/session.ts). Two rows per
  # invocation in the happy path: one when the bypass session starts, one
  # updating it with ended_at + succeeded = true when the callback returns; on
  # error the finally block inserts a single row with succeeded = false.
  #
  # Not tenant-scoped: bypass sessions can span tenants by design, and every
  # bypass must be recorded even when no app.tenant_id was set. No RLS policy
  # either — the bypass session itself is the only writer. Retention is
  # handled out of band: these rows are operationally sensitive and belong in
  # a long-term store (SIEM / log pipeline), not aged out of the OLTP database.
  # Add an explicit compliance review before changing that.
  - schema: platform
    name: system_bypass_audit
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: actor_subject, type: text, required: true }
      - { name: reason, type: text, required: true }
      - { name: tenant_id, type: uuid }
      - { name: started_at, type: timestamptz, required: true }
      - { name: ended_at, type: timestamptz }
      - { name: succeeded, type: boolean, required: true, default: "false" }
      - { name: created_at, type: timestamptz, required: true, default: now() }
    indexes:
      - name: system_bypass_audit_actor_idx
        columns: [actor_subject, started_at]
      - name: system_bypass_audit_recent_idx
        columns: [started_at]

  # One row per login at the identity provider, (issuer, subject). Platform-
  # level rather than per tenant because the same person signs in to several
  # tenants with the same account; identity_relations below is the per-tenant
  # half. Row-level security, the `identities_visibility` policy (a session
  # sees its OWN row and the identities linked or pending in its tenant, so an
  # administrator cannot enumerate people who never signed in to their
  # organization), the `lower(email)` lookup index and `app.identity_subject()`
  # are owned by db/migrations/identity-link.ts.
  - schema: platform
    name: identities
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: issuer, type: text, required: true }
      - { name: subject, type: text, required: true }
      - { name: email, type: text }
      - { name: display_name, type: text }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: updated_at, type: timestamptz, required: true, default: now() }
    indexes:
      # The upsert key of the just-in-time sign-in path:
      # `on conflict (issuer, subject)` (auth/identity-link.ts).
      - name: identities_issuer_subject_uidx
        columns: [issuer, subject]
        unique: true

  # One row per (identity, tenant): either LINKED to a Relation in that tenant
  # or PENDING with the Relation the person probably is (an e-mail match) but
  # that nobody has confirmed yet. Keyed by both ends, hence the composite
  # primary key. The two Relation references target an authoring entity
  # promoted into this manifest later — see relationshipRegister at the top.
  #
  # `status` is held to linked | pending_confirmation and the columns each
  # status requires (relation_id + linked_at + linked_by when linked, no
  # relation_id when pending) by check constraints in identity-link.ts, which
  # also owns the tenant-fenced policy: reads are tenant-wide, writes require
  # the acting session to BE the identity or to hold Organization.All.ReadWrite.
  #
  # needs_role_assignment is true only for a Relation the just-in-time path
  # CREATED whose invited role could not be recorded: while set, auth/identity.ts
  # overrides the session's roles to a minimal working set. Cleared by
  # set_member_role, which also writes `roles`.
  #
  # The onboarding_* columns are first-use onboarding state (mcp/onboarding.ts),
  # kept on this row because they have the same lifetime and owner — one
  # person, in one organization: when complete_onboarding last succeeded, the
  # ONBOARDING_VERSION it completed under (a bumped constant re-opens it),
  # whether the preferences step was skipped, and the role guides the person
  # had read when they completed so a later session still counts that step.
  - schema: platform
    name: identity_relations
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: identity_id, type: uuid, primaryKey: true, references: { schema: platform, table: identities, column: id, onDelete: CASCADE } }
      - { name: tenant_id, type: uuid, primaryKey: true, references: { schema: platform, table: tenants, column: id, onDelete: CASCADE } }
      - { name: relation_id, type: uuid, references: { schema: erp, table: relations, column: id, onDelete: CASCADE } }
      - { name: status, type: text, required: true }
      - { name: candidate_relation_id, type: uuid, references: { schema: erp, table: relations, column: id, onDelete: SET NULL } }
      - { name: linked_at, type: timestamptz }
      # 'jit' for the just-in-time path, otherwise the platform.identities id
      # of whoever linked: the person (confirm_my_link) or an administrator.
      - { name: linked_by, type: text }
      - { name: needs_role_assignment, type: boolean, required: true, default: "false" }
      # The roles this identity holds IN THIS TENANT, and nowhere else: the
      # organization-scoped grant an invitation or set_member_role records
      # (auth/employee-invitations.ts, mcp/identity-link-tools.ts) and that
      # auth/identity.ts unions onto the session for the selected tenant. A
      # Keycloak user-wide client role would be visible in every organization
      # the same account is a member of; this column is what replaced that.
      # Only a session holding Organization.All.ReadWrite (or the audited
      # bypass) may change it — trigger in db/migrations/identity-link.ts.
      - { name: roles, type: "text[]", required: true, default: "'{}'" }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: updated_at, type: timestamptz, required: true, default: now() }
      - { name: onboarding_completed_at, type: timestamptz }
      - { name: onboarding_version, type: integer }
      - { name: onboarding_preferences_skipped, type: boolean, required: true, default: "false" }
      - { name: onboarding_guides_read, type: "text[]", required: true, default: "'{}'" }
    indexes:
      - name: identity_relations_tenant_relation_idx
        columns: [tenant_id, relation_id]
      - name: identity_relations_pending_role_idx
        columns: [tenant_id]
        where: '"needs_role_assignment"'

  # The pending-role side of an organization administrator inviting a
  # colleague (auth/employee-invitations.ts). identity_relations only ever
  # gets a row once a person has SIGNED IN; an invitation happens strictly
  # before that, and Keycloak exposes no admin-API resource for an unaccepted
  # invite, so this table is the one thing the deployment can hold onto
  # between "an admin invited someone" and that person's first sign-in: the
  # e-mail, the role meant for them, and who invited them. It is a memory of
  # an intent, matched by e-mail at first sign-in, not a queue of Keycloak
  # state to reconcile against.
  #
  # `role` is held to the two composite client roles an invitation may name
  # (org_admin, org_employee) and `status` to pending | revoked | accepted —
  # with the timestamps each status requires — by check constraints in
  # db/migrations/employee-invitations.ts. The same file owns the ONE-PENDING-
  # PER-ADDRESS rule, a partial unique index over lower(email) that the
  # manifest cannot spell, and the tenant-fenced policy whose writes require
  # Organization.All.ReadWrite. `invited_by` carries the same shape as
  # identity_relations.linked_by.
  - schema: platform
    name: employee_invitations
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true, references: { schema: platform, table: tenants, column: id, onDelete: CASCADE } }
      - { name: email, type: text, required: true }
      - { name: role, type: text, required: true }
      - { name: first_name, type: text }
      - { name: last_name, type: text }
      - { name: status, type: text, required: true, default: "'pending'::text" }
      - { name: invited_by, type: text, required: true }
      - { name: invited_at, type: timestamptz, required: true, default: now() }
      - { name: revoked_at, type: timestamptz }
      - { name: revoked_by, type: text }
      - { name: accepted_at, type: timestamptz }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: updated_at, type: timestamptz, required: true, default: now() }
    indexes:
      - name: employee_invitations_tenant_status_idx
        columns: [tenant_id, status]

  # What changed in this deployment since a person last connected. One row
  # per published notice; NO tenant column because a notice is platform-wide,
  # the way a catalog publish is. Readable by every session and writable by
  # none under RLS (db/migrations/update-notices.ts), so the only way in is a
  # system session — the platform administrator's audited elevation.
  # Provenance in published_by_* is written from the verified control-realm
  # token, never from the notice body. A withdrawn notice is kept, not
  # deleted, so an acknowledgement never points at nothing.
  - schema: platform
    name: update_notices
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: key, type: text, primaryKey: true }
      - { name: title, type: text, required: true }
      # What changed, in the deployment's own words.
      - { name: changed, type: text, required: true }
      # What an assistant now does differently: an array of sentences.
      - { name: assistant_changes, type: jsonb, required: true, default: "'[]'::jsonb" }
      # What only the PERSON can do: [{action, why}]. A separate column, not a
      # flag inside a sentence, so an assistant cannot mistake one for a step
      # it may take itself.
      - { name: user_actions, type: jsonb, required: true, default: "'[]'::jsonb" }
      # Catalog keys of the Services whose definition changed, and per key
      # what changed on it: {"day-start": "..."}.
      - { name: service_changes, type: jsonb, required: true, default: "'{}'::jsonb" }
      - { name: published_at, type: timestamptz, required: true, default: now() }
      - { name: published_by_subject, type: text, required: true }
      - { name: published_by_issuer, type: text, required: true }
      - { name: published_by_name, type: text }
      - { name: withdrawn_at, type: timestamptz }
    indexes:
      - name: update_notices_published_idx
        columns: [published_at]

  # The durable record that one person was told: one row per (tenant, user,
  # notice). Keyed on the session's user rather than the identity link
  # because an acknowledgement needs exactly "this signed-in person, in this
  # organization", which every authenticated session carries — including the
  # ones with no link row. Its policy (update-notices.ts) is the tenant fence
  # plus "only the person themselves may write their own acknowledgement":
  # an administrator cannot mark a colleague as brought up to date.
  - schema: platform
    name: user_update_notices
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: tenant_id, type: uuid, primaryKey: true, references: { schema: platform, table: tenants, column: id, onDelete: CASCADE } }
      # The signed-in subject, as app.current_user_id() reports it.
      - { name: user_id, type: uuid, primaryKey: true }
      - { name: notice_key, type: text, primaryKey: true, references: { schema: platform, table: update_notices, column: key, onDelete: CASCADE } }
      - { name: acknowledged_at, type: timestamptz, required: true, default: now() }
      # The assistant states it PASSED ON the notice's user-only actions. It
      # can never state it performed them: there is no column for that.
      - { name: user_actions_passed_on, type: boolean, required: true, default: "false" }
      # [{instructionId, decision}] — what the person decided about each
      # personal instruction on a changed Service. The change itself, if any,
      # is made elsewhere; this table has no write path into an instruction.
      - { name: instruction_decisions, type: jsonb, required: true, default: "'[]'::jsonb" }

  # Durable background jobs — the core outbox. A handler enqueues a job in
  # the same transaction as its domain write; the `job-worker` role claims
  # queued rows across every tenant (workerAccess, the same axis as the
  # workflow queue) and runs each one under that job's own tenant session.
  #
  # `status` is queued | running | done | failed | dead | outcome_unknown.
  # `outcome_unknown` is what a job ends in when an external effect MAY have
  # happened (an SMTP DATA that timed out): terminal until an operator
  # resolves it, never retried on its own — the same stance the execution
  # receipts take for keyed Operations. `delivery_key` makes enqueueing
  # idempotent per tenant and kind; only a SHA-256 of the one-time claim
  # token is stored. The state-shape checks live in db/migrations/jobs.ts.
  - schema: platform
    name: jobs
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    workerAccess: job-worker
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: kind, type: text, required: true }
      # The verified user who enqueued the job. The worker runs the handler
      # under a tenant session for this user, so every row the handler touches
      # is fenced as if that person had written it.
      - { name: actor_id, type: uuid, required: true }
      - { name: payload, type: jsonb, required: true, default: "'{}'::jsonb" }
      - { name: delivery_key, type: text }
      - { name: status, type: text, required: true, default: "'queued'" }
      - { name: attempts, type: integer, required: true, default: "0" }
      - { name: max_attempts, type: integer, required: true, default: "5" }
      - { name: available_at, type: timestamptz, required: true, default: now() }
      - { name: lease_until, type: timestamptz }
      - { name: claim_token_hash, type: text }
      - { name: last_error, type: jsonb }
      - { name: result, type: jsonb }
      - { name: subject_entity, type: text }
      - { name: subject_id, type: uuid }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: updated_at, type: timestamptz, required: true, default: now() }
      - { name: completed_at, type: timestamptz }
    indexes:
      - name: jobs_delivery_key_uidx
        columns: [tenant_id, kind, delivery_key]
        unique: true
        where: delivery_key IS NOT NULL
      - name: jobs_poll_idx
        columns: [status, available_at]
      - name: jobs_subject_idx
        columns: [tenant_id, subject_entity, subject_id]
        where: subject_id IS NOT NULL
      - name: jobs_completed_idx
        columns: [status, completed_at]
        where: completed_at IS NOT NULL

  # Durable receipts for canonical keyed Operation execution — the actor-
  # scoped idempotency ledger. The raw key and request are deliberately
  # absent: only namespaced hashes are retained. A caller can only see or
  # mutate its own actor-bound rows under the current tenant
  # (`operation_execution_receipts_actor_scope`, db/migrations/
  # operation-execution-receipts.ts), which also holds the hash shapes and
  # the running | completed | outcome_unknown state machine as checks.
  # Tenant deletion owns cleanup through the cascading tenant reference.
  - schema: platform
    name: operation_execution_receipts
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: tenant_id, type: uuid, primaryKey: true, references: { schema: platform, table: tenants, column: id, onDelete: CASCADE } }
      - { name: actor_id, type: uuid, primaryKey: true }
      - { name: operation_id, type: text, primaryKey: true }
      - { name: operation_intent, type: text, primaryKey: true }
      - { name: key_hash, type: text, primaryKey: true }
      - { name: request_fingerprint, type: text, required: true }
      - { name: contract_fingerprint, type: text, required: true }
      - { name: state, type: text, required: true }
      - { name: response, type: jsonb }
      - { name: retry_at, type: timestamptz }
      - { name: started_at, type: timestamptz, required: true, default: clock_timestamp() }
      - { name: updated_at, type: timestamptz, required: true, default: clock_timestamp() }
      - { name: completed_at, type: timestamptz }

  # Blueprints: published record snapshots a blueprint tenant offers and other
  # tenants copy. The only cross-tenant read surface in the model, and it is
  # read through one SECURITY DEFINER function, `app.read_blueprints`, owned
  # by the definer role declared in the database role contract. That
  # function, its ownership transfer, the policies, the reader grants and the
  # check constraints are owned by db/migrations/blueprints.ts.
  #
  # blueprint_libraries: which blueprint tenant a tenant reads from — platform
  # registry state, written only by the audited control-plane session. The
  # two tenants must differ (a check in blueprints.ts).
  - schema: platform
    name: blueprint_libraries
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: tenant_id, type: uuid, primaryKey: true, references: { schema: platform, table: tenants, column: id, onDelete: CASCADE } }
      - { name: blueprint_tenant_id, type: uuid, required: true, references: { schema: platform, table: tenants, column: id } }

  # blueprint_versions: immutable published snapshots, keyed by their
  # coordinates (tenant, entity, blueprint, version). Insert-only for the
  # runtime role — update and delete are revoked after the grant sweep, and
  # the publish policy admits only a platform-operator session in a tenant
  # whose kind is blueprint. reader_roles is what a reader must hold one of.
  - schema: platform
    name: blueprint_versions
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: tenant_id, type: uuid, primaryKey: true, references: { schema: platform, table: tenants, column: id } }
      - { name: entity_name, type: text, primaryKey: true }
      - { name: blueprint_id, type: text, primaryKey: true }
      - { name: version, type: integer, primaryKey: true }
      - { name: source_record_id, type: uuid, required: true }
      - { name: label, type: text, required: true }
      - { name: reader_roles, type: "text[]", required: true }
      - { name: values_json, type: jsonb, required: true }
      - { name: created_at, type: timestamptz, required: true, default: now() }

  # blueprint_copies: provenance of a record a tenant created from a
  # blueprint — which version, from which blueprint tenant. The composite
  # reference into blueprint_versions and the two-tenants-differ check are
  # in blueprints.ts; the manifest expresses single-column references only.
  - schema: platform
    name: blueprint_copies
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: tenant_id, type: uuid, primaryKey: true, references: { schema: platform, table: tenants, column: id, onDelete: CASCADE } }
      - { name: entity_name, type: text, primaryKey: true }
      - { name: record_id, type: uuid, primaryKey: true }
      - { name: blueprint_tenant_id, type: uuid, required: true }
      - { name: blueprint_id, type: text, required: true }
      - { name: source_version, type: integer, required: true }
