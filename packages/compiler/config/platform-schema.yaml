version: 1
description: "Greenfield platform schema foundation for apps/api."

relationshipRegister: []

tables:
  - schema: platform
    name: schema_migrations
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: version, type: text, primaryKey: true }
      - { name: checksum, type: text, required: true }
      - { name: applied_at, type: timestamptz, required: true, default: now() }
      - { name: applied_by, type: text }

  # Global, tenant-agnostic page-config catalog for the generated web CRUD
  # pages. Compiler-generated platform config, identical for every tenant — NOT
  # tenant data, so tenantScoped:false (no tenant_id, no RLS), and
  # domainInternal so no generated CRUD/GraphQL surface is emitted for it. It is
  # read through the hand-written `entityPageConfigs` query in
  # `apps/api/src/graphql/schema.ts`.
  #
  # One row per (entity_slug, config_kind). `id` is "<entity_slug>:<config_kind>"
  # so the seeder can upsert on a single-column primary key, mirroring
  # entity_trigger_registry. `checksum` is the sha256 the compiler computes over
  # the whole serialized row set, so the seeder can skip a run whose input has
  # not changed.
  #
  # Rows exist only when the repo has an `apps/web`: the seed is emitted by the
  # web-gated UI generator. Without one the table stays empty and nothing reads
  # it.
  - schema: platform
    name: entity_page_configs
    tenantScoped: false
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: text, primaryKey: true }
      - { name: entity_slug, type: text, required: true }
      # 'list' | 'detail' | 'workspace' | 'create_form' | 'edit_form'
      - { name: config_kind, type: text, required: true }
      - { name: configs, type: jsonb, required: true, default: "'{}'::jsonb" }
      - { name: checksum, type: text, required: true }
    indexes:
      - name: entity_page_configs_slug_kind_uidx
        columns: [entity_slug, config_kind]
        unique: true
      - name: entity_page_configs_slug_idx
        columns: [entity_slug]

  - schema: platform
    name: entity_events
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: aggregate_type, type: text, required: true }
      - { name: aggregate_id, type: text, required: true }
      - { name: event_type, type: text, required: true }
      - { name: payload, type: jsonb, required: true, default: "'{}'::jsonb" }
      - { name: sequence, type: bigint, required: true, generated: identity }
      - { name: occurred_at, type: timestamptz, required: true, default: now() }
    indexes:
      - name: entity_events_tenant_sequence_idx
        columns: [tenant_id, sequence]
      - name: entity_events_tenant_aggregate_sequence_idx
        columns: [tenant_id, aggregate_type, aggregate_id, sequence]

  # Org-unit hierarchy for group-predicated RLS (authorization.rowAccess.group).
  # Both tables are tenantScoped (get {table}_tenant_isolation automatically) and
  # carry NO rowScope — they are the resolution substrate a user must be able to
  # read within its own tenant to expand its groups at session setup. Tenant
  # isolation is the correct and sufficient boundary.
  - schema: platform
    name: org_unit
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      # Nullable → roots. Self-referential FK to platform.org_unit(id); RESTRICT
      # so a parent cannot be deleted while children reference it (the closure
      # trigger relies on reparent/remove-first — see the versioned migration).
      - { name: parent_id, type: uuid, references: { schema: platform, table: org_unit, column: id, onDelete: RESTRICT } }
      - { name: name, type: text, required: true }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: updated_at, type: timestamptz, required: true, default: now() }
    indexes:
      - name: org_unit_tenant_parent_idx
        columns: [tenant_id, parent_id]

  # Transitive-closure table maintained by the org_unit trigger (versioned
  # migration). Self-row (u,u,0) per unit; (a,d,k) for every ancestor a of d at
  # distance k. descendants(x) = SELECT descendant_id WHERE ancestor_id = x;
  # ancestors(x) = SELECT ancestor_id WHERE descendant_id = x.
  - schema: platform
    name: org_unit_closure
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: ancestor_id, type: uuid, required: true }
      - { name: descendant_id, type: uuid, required: true }
      - { name: depth, type: integer, required: true }
    indexes:
      - name: org_unit_closure_ancestor_idx
        columns: [tenant_id, ancestor_id]
      - name: org_unit_closure_descendant_idx
        columns: [tenant_id, descendant_id]
      - name: org_unit_closure_edge_uk
        columns: [tenant_id, ancestor_id, descendant_id]
        unique: true

  # ---------------------------------------------------------------------------
  # Connectors
  #
  # A connector's CONTRACT is compiled (apps/api/src/generated/connectors/
  # catalog.json); these tables hold the per-tenant state the contract cannot:
  # which tenants installed what, with which configuration, and which
  # entitlements they hold.
  #
  # All three are tenantScoped (so they get {table}_tenant_isolation) and
  # domainInternal (so no generated CRUD/GraphQL surface is emitted). That
  # combination is deliberate and mirrors the tenant-setting precedent: these
  # rows reference secrets and entitlement state, and must only ever be reached
  # through the connector configuration API, never through generic CRUD.
  # ---------------------------------------------------------------------------

  # One row per configured connector instance. `instance_key` allows a tenant to
  # configure the same connector more than once (two buckets, two mail domains)
  # when the contract declares `configuration.instances: multiple`; contracts
  # declaring `single` are held to one row by the API, not by the schema.
  #
  # contract_version + contract_checksum record what the installation was
  # configured AGAINST. A compiled contract that no longer matches means the
  # stored config may be invalid — a newly required field, a narrowed
  # validation, a removed operation — and the installation needs repair rather
  # than a surprise failure at call time.
  - schema: platform
    name: connector_installations
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: connector_slug, type: text, required: true }
      # Written in the cast form Postgres reports back ('default'::text). The
      # drift comparator matches the manifest default against the live column
      # default verbatim, so a bare 'default' reads as non-additive drift and
      # blocks every roll-forward. Same reason the jsonb defaults elsewhere are
      # spelled '{}'::jsonb.
      - { name: instance_key, type: text, required: true, default: "'default'::text" }
      - { name: display_name, type: text }
      # Non-secret configuration values only. Secret-marked fields live in
      # connector_secrets, encrypted; they are never written here.
      - { name: config, type: jsonb, required: true, default: "'{}'::jsonb" }
      - { name: enabled, type: boolean, required: true, default: "false" }
      - { name: contract_version, type: integer, required: true }
      - { name: contract_checksum, type: text, required: true }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: updated_at, type: timestamptz, required: true, default: now() }
    indexes:
      - name: connector_installations_tenant_slug_instance_uidx
        columns: [tenant_id, connector_slug, instance_key]
        unique: true
      - name: connector_installations_tenant_slug_idx
        columns: [tenant_id, connector_slug]

  # One row per (installation, secret field). Separate from the installation row
  # so a single secret can be rotated, re-encrypted under a new key, or audited
  # without rewriting the whole configuration — and so no read path that selects
  # an installation can accidentally select ciphertext with it.
  #
  # key_id names the encryption key so a rotation can re-encrypt row by row
  # while both keys are live.
  - schema: platform
    name: connector_secrets
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: installation_id, type: uuid, required: true, references: { schema: platform, table: connector_installations, column: id, onDelete: CASCADE } }
      - { name: field_key, type: text, required: true }
      - { name: ciphertext, type: text, required: true }
      - { name: key_id, type: text, required: true }
      - { name: algorithm, type: text, required: true }
      - { name: created_at, type: timestamptz, required: true, default: now() }
      - { name: updated_at, type: timestamptz, required: true, default: now() }
    indexes:
      - name: connector_secrets_installation_field_uidx
        columns: [tenant_id, installation_id, field_key]
        unique: true

  # Per-tenant entitlement grants. The signed deployment license is the CEILING
  # (what this deployment may offer at all); a row here is the GRANT (what this
  # tenant actually has). Effective availability is the intersection, so neither
  # a forged row nor a shared license can widen what a tenant sees on its own.
  - schema: platform
    name: connector_entitlements
    tenantScoped: true
    domainInternal: true
    generatedCrud: false
    columns:
      - { name: id, type: uuid, primaryKey: true, default: gen_random_uuid() }
      - { name: tenant_id, type: uuid, required: true }
      - { name: entitlement, type: text, required: true }
      - { name: granted_at, type: timestamptz, required: true, default: now() }
      # NULL means no expiry. A past expiry is treated as absent, never as an error.
      - { name: expires_at, type: timestamptz }
    indexes:
      - name: connector_entitlements_tenant_key_uidx
        columns: [tenant_id, entitlement]
        unique: true
