schemaVersion: 1
kind: componentCatalog

# ── Default component per field type ──
# Used when a field does not specify a `render.component`.
defaults:
  string:
    label:
      nl: Tekst
      en: Text
    component: FieldSingleLine
  integer:
    label:
      nl: Geheel getal
      en: Integer
    component: FieldIntegerDecimal
  number:
    label:
      nl: Getal
      en: Number
    component: FieldIntegerDecimal
  boolean:
    label:
      nl: Ja/nee
      en: Yes/no
    component: FieldNullableBoolean
  object:
    label:
      nl: JSON-object
      en: JSON object
    component: FieldCodeStructuredJson
  collection:
    label:
      nl: JSON-lijst
      en: JSON array
    component: FieldCodeStructuredJson
  date:
    label:
      nl: Datum
      en: Date
    component: FieldDate
  datetime:
    label:
      nl: Datum en tijd
      en: Date and time
    component: FieldDateAndTime
# ── Default component per view element ──
# Used when a view does not specify a `render.component` for that element.
viewDefaults:
  page:
    component: PageShell
  header:
    component: PageHeader
  list:
    component: DataTable
  search:
    component: SearchInput
  filterBar:
    component: FilterBar
  tabs:
    component: TabBar
  section:
    component: SectionCard
  form:
    component: FormSection
  badges:
    component: BadgeList
  submitButton:
    component: SubmitButton
  relationshipTab:
    component: RelationshipPanel

# ── Component definitions ──
# Every component used in field rendering OR view rendering.
components:

  # ── View-level components ──

  PageShell:
    kind: view
    description: Root wrapper for a page. Renders title and children.
    props:
      - title

  PageHeader:
    kind: view
    description: Entity header with title template, subtitle, and badges.
    props:
      - titleTemplate
      - subtitleTemplate
      - badges
      - data

  DataTable:
    kind: view
    description: Sortable data table with columns, row click, and pagination.
    props:
      - columns
      - rows
      - onRowClick
      - defaultSort
      - loading

  SearchInput:
    kind: view
    description: Search input field.
    props:
      - value
      - onChange
      - placeholder

  FilterBar:
    kind: view
    description: Row of filter controls.
    props:
      - filters
      - values
      - onChange

  TabBar:
    kind: view
    description: Tab navigation wrapper with tab content.
    props:
      - tabs
      - activeTab
      - onTabChange
      - children

  SectionCard:
    kind: view
    description: Card with title and field list.
    props:
      - title
      - children

  FormSection:
    kind: view
    description: Fieldset wrapper for a group of form fields.
    props:
      - title
      - children

  BadgeList:
    kind: view
    description: Horizontal list of badges.
    props:
      - items

  SubmitButton:
    kind: view
    description: Form submit button.
    props:
      - label

  RelationshipPanel:
    kind: relationship
    description: Panel showing related entities.
    props:
      - relationship
      - parentId
      - emptyLabel

  # ── Field-level components ──

  EntityReferenceSelect:
    kind: field
    description: Picks a record of the referenced entity.
    props: [layout, labelWidth]

  EntityReferenceDisplay:
    kind: field
    description: Shows the referenced record.
    props: [layout, labelWidth]

  ChoiceTiles:
    kind: field
    description: Static options shown as tiles.
    props: [layout, labelWidth]

  FieldDefinitionView:
    kind: field
    description: Read-only display for single field definitions and field-definition lists.
    props: []

  ConditionBuilder:
    kind: field
    description: Structured builder for canonical conditions and condition groups.
    props:
      - mode
      - leftSourceField
      - defaultPath

  MapPicker:
    kind: field
    description: Map-based location picker for addresses and coordinates.
    props:
      - defaultZoom
      - defaultCenter
      - geocodeProvider

  FileUpload:
    kind: field
    description: File upload with drag and drop.
    props:
      - accept
      - maxSizeMb
      - multiple

  # ── Custom view components ──
  WoonsituatiePanel:
    kind: custom
    description: Custom panel showing living situation details for a person.
    props:
      - parentId

  InkomensOverzicht:
    kind: custom
    description: Custom income overview panel with totals.
    props:
      - parentId

  NaturalPersonInboxBaseline:
    kind: custom
    description: Mock natural-person workspace baseline using the inbox layout and relations datascreen.
    props: []
