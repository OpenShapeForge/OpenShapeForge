schemaVersion: 3
kind: coreEntity
module: core
entity: SecureInputV2
title: Secure Input V2
description: Test fixture for canonical secure-input lowering.
language: en
displayTemplate: "{{name}}"
filterField: name
labels:
  en: Secure Input V2
domains:
  - relations
authorization:
  roles:
    read: [ Relations.All.Read ]
    create: [ Relations.All.ReadWrite ]
    update: [ Relations.All.ReadWrite ]
    delete: [ Relations.All.ReadWrite ]
fields:
  - key: name
    osfType: string
    required: true
    persisted:
      column: name
      storageClass: core
  - key: configurationDefinitions
    osfType: object
    required: false
    persisted:
      column: configuration_definitions
      storageClass: core
  - key: configurationValues
    osfType: object
    required: false
    persisted:
      column: configuration_values
      storageClass: core
operations:
  create:
    name: Create secure-input fixture
    description: Creates a row after server-issued secure input.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability:
      idempotency: { mode: none }
    confirmation: { mode: none }
    interaction:
      type: secureInput
      sourceField: name
      sourceEntity: SecureInputV2
      definitionsField: configurationDefinitions
      into: configurationValues
interfaces:
  rest: {}
  graphql: {}
  mcp: {}
