schemaVersion: 3
kind: coreEntity
module: core
entity: ValueContractBadOption
title: Value Contract Bad Option
description: >-
  Test fixture — an options field whose authored default is not one of its options, to prove the build fails
  instead of storing it for every omitted field. Not part of the shipped slice.
language: en
displayTemplate: "{{label}}"
filterField: label
labels:
  en: Value Contract Bad Option
  nl: Value Contract Bad Option
domains:
  - relations
authorization:
