    read:
      - Relaties.All.Read
      - Relaties.All.ReadWrite
    create:
      - Relaties.All.ReadWrite
    update:
      - Relaties.All.ReadWrite
    delete:
      - Relaties.All.ReadWrite
fields:
  - key: label
    osfType: string
    required: true
    label:
      en: Label
      nl: Label
    persisted:
      column: label
      storageClass: core
  - key: status
    osfType: string
    required: true
    defaultValue: banana
    label:
      en: Status
      nl: Status
    options:
      type: static
      items:
        - value: open
          label:
            en: Open
            nl: Open
        - value: closed
          label:
            en: Closed
            nl: Gesloten
    persisted:
      column: status
      storageClass: core
  - key: locale
    osfType: string
    required: false
    validation:
      pattern: "^[a-z]{2}(-[A-Z]{2})?$"
    label:
      en: Locale
      nl: Taal
    persisted:
      column: locale
      storageClass: core
  - key: slug
    osfType: string
    required: false
    validation:
      pattern: "^(?!-)[a-z-]+$"
    label:
      en: Slug
      nl: Slug
    persisted:
      column: slug
      storageClass: core
  - key: quantity
    osfType: number
    required: true
    defaultValue: 1
    label:
      en: Quantity
      nl: Aantal
    persisted:
      column: quantity
      storageClass: core
  - key: tags
    osfType: string
    cardinality: collection
    required: false
    label:
      en: Tags
      nl: Tags
    options:
      type: static
      items:
        - value: red
          label:
            en: Red
            nl: Rood
    persisted:
      column: tags
      storageClass: core
