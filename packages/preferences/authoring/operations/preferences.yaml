schemaVersion: 1
kind: operationCatalog
plugin: preferences
operations:
  list:
    id: preferences.list
    name: list personal preferences
    description: Uses the signed-in identity's own application preferences and canonical managed definitions.
    implementation: { type: plugin, plugin: preferences, handler: list }
    input:
      schema:
        type: object
        additionalProperties: false
        properties:
          namespace: { type: string, minLength: 1, maxLength: 120 }
    output:
      schema:
        type: object
        additionalProperties: true
    auth: { mode: session, roles: [Preferences.Self.Read] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors:
      - { status: 400, code: VALIDATION, description: Invalid preference input. }
      - { status: 400, code: VALIDATION_FAILED, description: Value does not match its canonical definition. }
      - { status: 404, code: NOT_FOUND, description: Preference or confirmed profile is unavailable. }
  get:
    id: preferences.get
    name: get personal preferences
    description: Uses the signed-in identity's own application preferences and canonical managed definitions.
    implementation: { type: plugin, plugin: preferences, handler: get }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [namespace, key]
        properties:
          namespace: { type: string, minLength: 1, maxLength: 120 }
          key: { type: string, pattern: '^[a-z][A-Za-z0-9]*$' }
    output:
      schema:
        type: object
        additionalProperties: true
    auth: { mode: session, roles: [Preferences.Self.Read] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors:
      - { status: 400, code: VALIDATION, description: Invalid preference input. }
      - { status: 400, code: VALIDATION_FAILED, description: Value does not match its canonical definition. }
      - { status: 404, code: NOT_FOUND, description: Preference or confirmed profile is unavailable. }
  set:
    id: preferences.set
    name: set personal preferences
    description: Uses the signed-in identity's own application preferences and canonical managed definitions.
    implementation: { type: plugin, plugin: preferences, handler: set }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [namespace, key, value]
        properties:
          namespace: { type: string, minLength: 1, maxLength: 120 }
          key: { type: string, pattern: '^[a-z][A-Za-z0-9]*$' }
          value: {}
    output:
      schema:
        type: object
        additionalProperties: true
    auth: { mode: session, roles: [Preferences.Self.Write] }
    tenancy: { mode: required }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors:
      - { status: 400, code: VALIDATION, description: Invalid preference input. }
      - { status: 400, code: VALIDATION_FAILED, description: Value does not match its canonical definition. }
      - { status: 404, code: NOT_FOUND, description: Preference or confirmed profile is unavailable. }
  reset:
    id: preferences.reset
    name: reset personal preferences
    description: Uses the signed-in identity's own application preferences and canonical managed definitions.
    implementation: { type: plugin, plugin: preferences, handler: reset }
    input:
      schema:
        type: object
        additionalProperties: false
        required: [namespace, key]
        properties:
          namespace: { type: string, minLength: 1, maxLength: 120 }
          key: { type: string, pattern: '^[a-z][A-Za-z0-9]*$' }
    output:
      schema:
        type: object
        additionalProperties: true
    auth: { mode: session, roles: [Preferences.Self.Write] }
    tenancy: { mode: required }
    effects: { data: delete, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors:
      - { status: 400, code: VALIDATION, description: Invalid preference input. }
      - { status: 400, code: VALIDATION_FAILED, description: Value does not match its canonical definition. }
      - { status: 404, code: NOT_FOUND, description: Preference or confirmed profile is unavailable. }
  profile:
    id: preferences.profile
    name: profile personal preferences
    description: Returns only the signed-in identity's confirmed Relation reference.
    implementation: { type: plugin, plugin: preferences, handler: profile }
    input:
      schema:
        type: object
        additionalProperties: false
        properties: {}
    output:
      schema:
        type: object
        additionalProperties: true
    auth: { mode: session, roles: [Preferences.Self.Read] }
    tenancy: { mode: required }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
    errors:
      - { status: 400, code: VALIDATION, description: Invalid preference input. }
      - { status: 400, code: VALIDATION_FAILED, description: Value does not match its canonical definition. }
      - { status: 404, code: NOT_FOUND, description: Preference or confirmed profile is unavailable. }

interfaces:
  rest:
    operations:
      list: { method: POST, path: /api/preferences/list, response: { status: 200, kind: json } }
      get: { method: POST, path: /api/preferences/get, response: { status: 200, kind: json } }
      set: { method: POST, path: /api/preferences/set, response: { status: 200, kind: json } }
      reset: { method: POST, path: /api/preferences/reset, response: { status: 200, kind: json } }
      profile: { method: POST, path: /api/preferences/profile, response: { status: 200, kind: json } }
  mcp:
    operations:
      list: { name: preferences_list }
      get: { name: preferences_get }
      set: { name: preferences_set }
      reset: { name: preferences_reset }
      profile: { name: preferences_profile }
  graphql:
    operations:
      list: { field: preferencesList, kind: query }
      get: { field: preferencesGet, kind: query }
      set: { field: preferencesSet, kind: mutation }
      reset: { field: preferencesReset, kind: mutation }
      profile: { field: preferencesProfile, kind: query }
