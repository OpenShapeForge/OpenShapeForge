# Test fixture — an owned collection of extensible-asset.yaml (any number of
# parts per asset), authorized through its owner: what a tenant rollup over an
# owned collection aggregates. Only in the test composition. Its create and
# update are what the owner's collection mutations run; the engine refuses
# them as generic writes of an owned child, so it has no delete of its own,
# which leaves it to the partial-policy sweeps, and no MCP interface, so the
# generic tool sweeps never offer them.
schemaVersion: 3
kind: coreEntity
module: core
entity: ExtensibleAssetPart
title: Extensible asset part
description: One part of an extensible test asset.
language: en
displayTemplate: "{{quantity}}"
labels: { en: Extensible asset part, nl: Onderdeel van uitbreidbaar object }
pluralLabels: { en: Extensible asset parts, nl: Onderdelen van uitbreidbare objecten }
domains: [relations]
authorization:
  roles:
    read: [General.All.Read, General.All.ReadWrite]
    create: [General.All.ReadWrite]
    update: [General.All.ReadWrite]
fields:
  - key: asset
    osfType: ExtensibleAsset
    required: true
    relationship:
      inverse:
        key: parts
        label: { en: Parts, nl: Onderdelen }
        ownership: owned
        childAuthorization: owner
  # Rollups over these two inverses are refused: the relation itself is out of
  # a reader's reach.
  - key: auditedAsset
    osfType: ExtensibleAsset
    label: { en: Audited asset, nl: Geaudit object }
    classification: { sensitivity: confidential, category: operational }
    relationship:
      ownership: reference
      inverse:
        key: auditedParts
        label: { en: Audited parts, nl: Geauditte onderdelen }
  - key: restrictedAsset
    osfType: ExtensibleAsset
    label: { en: Restricted asset, nl: Afgeschermd object }
    authorization:
      roles:
        read: [Test.Fields.Manage]
        write: [General.All.ReadWrite]
    relationship:
      ownership: reference
      inverse:
        key: restrictedParts
        label: { en: Restricted parts, nl: Afgeschermde onderdelen }
  # What a rollup over the parts may reach, written through the collection.
  - key: location
    osfType: ExtensibleAssetLocation
    label: { en: Location, nl: Locatie }
    relationship:
      ownership: reference
      inverse: false
  - key: quantity
    osfType: number
    label: { en: Quantity, nl: Aantal }
    persisted: { column: quantity, storageClass: core }
  - key: kind
    osfType: string
    label: { en: Kind, nl: Soort }
    validation: { maxLength: 100 }
    persisted: { column: kind, storageClass: core }
  # Readable like the rest, but what reads it is internal at least.
  - key: unitCost
    osfType: number
    label: { en: Unit cost, nl: Kostprijs }
    classification: { sensitivity: internal, category: financial }
    persisted: { column: unit_cost, storageClass: core }
operations:
  list:
    name: List extensible asset parts
    description: Read accessible extensible asset parts.
    implementation: { type: entity, action: list }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  get:
    name: Read extensible asset part
    description: Read one accessible extensible asset part.
    implementation: { type: entity, action: get }
    effects: { data: read, external: none }
    reliability: { idempotency: { mode: natural } }
    confirmation: { mode: none }
  create:
    name: Create extensible asset part
    description: Create extensible asset part.
    implementation: { type: entity, action: create }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    confirmation: { mode: none }
  update:
    name: Update extensible asset part
    description: Update extensible asset part.
    implementation: { type: entity, action: update }
    effects: { data: write, external: none }
    reliability: { idempotency: { mode: none } }
    concurrency: { version: { mode: required, field: updatedAt } }
    confirmation: { mode: none }
interfaces:
  rest: {}
  graphql: {}
