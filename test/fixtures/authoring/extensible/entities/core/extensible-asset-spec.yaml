# Test fixture — the owned single child of extensible-asset.yaml (one spec per
# asset): what the extension registry lists as `ownedSingleChildren` for
# formulas. Only in the test composition.
schemaVersion: 3
kind: coreEntity
module: core
entity: ExtensibleAssetSpec
title: Extensible asset spec
description: The specification of one extensible test asset.
